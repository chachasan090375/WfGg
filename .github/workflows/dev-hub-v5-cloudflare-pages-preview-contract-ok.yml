name: Dev Hub V5 Cloudflare Pages Preview CONTRACT_OK

on:
  push:
    branches:
      - dev-hub-v5-cloudflare-pages-preview-contract-ok
  pull_request:
    branches:
      - dev-hub-v5-cloudflare-pages-preview-contract

permissions:
  contents: read

jobs:
  contract-ok:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Validate preview-only contract
        run: python3 dev-hub/bin/cloudflare-pages-preview-contract-ok-validate.py
      - name: Confirm repository unchanged
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          echo 'CLOUDFLARE_PAGES_CONTRACT_REPOSITORY_UNCHANGED=PASS'
