name: ChaCha DEV V8.0.17 Retry Inflight Verification

on:
  push:
    branches:
      - dev-hub-v817-retry-inflight-verification
    paths:
      - 'dev-hub/bin/install-v817-dark-intelligence-retry-calendar.sh'
      - 'dev-hub/systemd/chacha-dev-dark-intelligence-analysis-retry.service'
      - 'dev-hub/systemd/chacha-dev-dark-intelligence-analysis-retry.timer'
      - 'dev-hub/systemd/chacha-dev-dark-intelligence-corroboration-retry.service'
      - 'dev-hub/systemd/chacha-dev-dark-intelligence-corroboration-retry.timer'
      - 'dev-hub/tests/test_v817_retry_inflight_verification.py'
      - 'dev-hub/tests/test_v801_isolated_dark_intelligence_collector.py'
      - '.github/workflows/dev-hub-v817-retry-inflight-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and unit verification
        run: |
          set -euo pipefail
          bash -n dev-hub/bin/install-v817-dark-intelligence-retry-calendar.sh
          systemd-analyze verify             dev-hub/systemd/chacha-dev-dark-intelligence-analysis-retry.service             dev-hub/systemd/chacha-dev-dark-intelligence-analysis-retry.timer             dev-hub/systemd/chacha-dev-dark-intelligence-corroboration-retry.service             dev-hub/systemd/chacha-dev-dark-intelligence-corroboration-retry.timer
      - name: V8.0.17 qualification
        run: |
          set -euo pipefail
          python3 dev-hub/tests/test_v817_retry_inflight_verification.py | tee /tmp/v817.out
          grep -Fq 'CHACHA_DEV_V817_WAITING_TIMER_VERIFICATION=PASS' /tmp/v817.out
          grep -Fq 'CHACHA_DEV_V817_INFLIGHT_TRIGGER_VERIFICATION=PASS' /tmp/v817.out
          grep -Fq 'CHACHA_DEV_V817_CALENDAR_REQUIRED_FOR_INFLIGHT=PASS' /tmp/v817.out
          grep -Fq 'CHACHA_DEV_V817_TRANSACTIONAL_ROLLBACK_PRESERVED=PASS' /tmp/v817.out
          grep -Fq 'CHACHA_DEV_V817_AUTOMATIC_EXTERNAL_SPEND_EUR=0' /tmp/v817.out
      - name: Preserve V8.0.1 guarantees
        run: |
          set -euo pipefail
          python3 dev-hub/tests/test_v801_isolated_dark_intelligence_collector.py | tee /tmp/v801.out
          grep -Fq 'CHACHA_DEV_V801_RETRY_LOOP_BOUNDED=PASS' /tmp/v801.out
          grep -Fq 'CHACHA_DEV_V801_CORROBORATION_RETRY_NO_RECOLLECTION=PASS' /tmp/v801.out
          grep -Fq 'CHACHA_DEV_V801_AUTOMATIC_EXTERNAL_SPEND_EUR=0' /tmp/v801.out
