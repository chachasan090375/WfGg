name: Radar V6.19.2 cluster catalog budget pilot

on:
  push:
    branches: [radar-v6192-cluster-catalog-budget]
    paths:
      - '.github/scripts/patch-radar-cluster-catalog-budget-v6192.py'
      - '.github/workflows/radar-v6192-cluster-catalog-budget-pilot.yml'
      - 'radar-vps/install-v6192-pilot.sh'
      - 'radar-vps/probe-v6192-pilot-runtime.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wfgg-radar-v6192-cluster-catalog-budget
  cancel-in-progress: true

env:
  LASTWAR_CLIENT_REF: ee5f64de160a8051c2f9f98189b75038dd225a0a

jobs:
  build-qualify-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-v6192-cluster-catalog-budget
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Reconstruct cumulative V6.19.2 connector
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar /tmp/lastwar-client
          mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          echo '234df1dec57f6211bc625855bf13350c9f17fbd843fbe92d8cf1ab7cb5c081ef  /tmp/radar-src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar
          rm -rf /tmp/wfgg-radar/connector-go
          cp -a .radar-release-src/v2-source/connector-go /tmp/wfgg-radar/connector-go

          python3 .github/scripts/patch-radar-target-profile-retry.py
          python3 .github/scripts/patch-radar-federated-diagnostics-v65.py
          python3 .github/scripts/patch-player-scan-v3.py
          python3 .github/scripts/patch-player-scan-v4.py
          python3 .github/scripts/patch-radar-protocol-discovery-v67.py
          python3 .github/scripts/patch-radar-profile-isolation-v68.py
          python3 .github/scripts/patch-radar-native-profile-v69.py
          python3 .github/scripts/patch-radar-native-profile-handshake-v691.py
          python3 .github/scripts/patch-radar-native-profile-exec-v692.py
          python3 .github/scripts/patch-radar-connector-runtime-v693.py
          python3 .github/scripts/patch-radar-cluster-catalog-budget-v6192.py

          grep -Fq 'WFGG_RADAR_CLUSTER_CATALOG_BUDGET_V6192' /tmp/wfgg-radar/connector-go/cmd/radar-connector/server_cluster_catalog_v613.go
          grep -Fq 'context.WithTimeout(r.Context(), 75*time.Second)' /tmp/wfgg-radar/connector-go/cmd/radar-connector/server_cluster_catalog_v613.go
          grep -Fq 'WFGG_RADAR_CYCLE_QUALITY_CATALOG_ROUTE_V617' /tmp/wfgg-radar/connector-go/cmd/radar-connector/server_cluster_catalog_v613.go
          grep -Fq 'WFGG_RADAR_MAP_PROFILE_MERGE_JOB_V618' /tmp/wfgg-radar/connector-go/cmd/radar-connector/collector_jobs.go
          grep -Fq 'WFGG_RADAR_TARGET_PROFILE_REFRESH_V6191' /tmp/wfgg-radar/connector-go/cmd/radar-connector/profile_refresh_v6191.go
          echo RADAR_V6192_RECONSTRUCT=PASS

      - name: Test and build connector pilot
        working-directory: /tmp/wfgg-radar/connector-go
        run: |
          set -euo pipefail
          gofmt -w ./cmd ./internal
          go test ./...
          go vet ./...
          mkdir -p "$GITHUB_WORKSPACE/radar-vps/pilot-v6192"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o "$GITHUB_WORKSPACE/radar-vps/pilot-v6192/radar-connector" ./cmd/radar-connector
          test -s "$GITHUB_WORKSPACE/radar-vps/pilot-v6192/radar-connector"
          echo RADAR_V6192_CONNECTOR=PASS

      - name: Build unchanged native helper
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/ljagiello/lastwar-client.git /tmp/lastwar-client
          cd /tmp/lastwar-client
          git fetch --quiet --depth 1 origin "$LASTWAR_CLIENT_REF"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$LASTWAR_CLIENT_REF"

          mkdir -p cmd/wfgg-radar-native-template
          cp /tmp/wfgg-radar/connector-go/native-template/main.go cmd/wfgg-radar-native-template/main.go
          cp /tmp/wfgg-radar/connector-go/native-template/player_scan_v3.go cmd/wfgg-radar-native-template/player_scan_v3.go
          cp /tmp/wfgg-radar/connector-go/native-template/player_scan_v4.go cmd/wfgg-radar-native-template/player_scan_v4.go
          cp /tmp/wfgg-radar/connector-go/native-template/profile_scan_v69.go cmd/wfgg-radar-native-template/profile_scan_v69.go
          cp /tmp/wfgg-radar/connector-go/native-template/profile_scan_v69_test.go cmd/wfgg-radar-native-template/profile_scan_v69_test.go
          cp /tmp/wfgg-radar/connector-go/native-template/profile_rich_fields_v619_test.go cmd/wfgg-radar-native-template/profile_rich_fields_v619_test.go
          gofmt -w cmd/wfgg-radar-native-template/*.go
          go test -tags lastwar_native_template ./cmd/wfgg-radar-native-template
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags lastwar_native_template -trimpath -ldflags='-s -w' -o "$GITHUB_WORKSPACE/radar-vps/pilot-v6192/radar-native-template" ./cmd/wfgg-radar-native-template
          test -s "$GITHUB_WORKSPACE/radar-vps/pilot-v6192/radar-native-template"
          echo RADAR_V6192_NATIVE=PASS

      - name: Verify bounded V6.19.2 change
        run: |
          set -euo pipefail
          bash -n radar-vps/install-v6192-pilot.sh
          bash -n radar-vps/probe-v6192-pilot-runtime.sh
          grep -Fq '75*time.Second' /tmp/wfgg-radar/connector-go/cmd/radar-connector/server_cluster_catalog_v613.go
          grep -Fq '30*time.Second' /tmp/wfgg-radar/connector-go/cmd/radar-connector/server_cycle_history_v614.go
          grep -Fq '30*time.Second' /tmp/wfgg-radar/connector-go/cmd/radar-connector/server_census_v612.go
          ! grep -REiq 'attack|march|purchase|donate|reward collection|building production|collect reward' \
            .github/scripts/patch-radar-cluster-catalog-budget-v6192.py
          echo RADAR_V6192_SCOPE=CATALOG_HANDLER_ONLY
          echo RADAR_V6192_GAME_PROTOCOL_MUTATION=NO
          echo RADAR_V6192_QUALIFICATION=PASS

      - name: Publish pilot binaries to branch only
        run: |
          set -euo pipefail
          chmod 0755 radar-vps/pilot-v6192/radar-connector radar-vps/pilot-v6192/radar-native-template
          (
            cd radar-vps/pilot-v6192
            sha256sum radar-connector radar-native-template > SHA256SUMS
          )
          {
            echo "WFGG_RADAR_PILOT=V6.19.2"
            echo "SOURCE_BRANCH=radar-v6192-cluster-catalog-budget"
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "CHANGE=server-cluster-catalog-timeout-30s-to-75s"
            echo "DISCOVERY_MODE=targeted-federated-sequential"
            echo "PRODUCTION_MUTATION=NO"
          } > radar-vps/pilot-v6192/PILOT_INFO.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar-vps/pilot-v6192
          if git diff --cached --quiet; then
            echo RADAR_V6192_PILOT=UNCHANGED
            exit 0
          fi
          git commit -m 'build(radar): publish V6.19.2 catalog budget pilot'
          git fetch origin radar-v6192-cluster-catalog-budget
          git rebase origin/radar-v6192-cluster-catalog-budget
          git push origin HEAD:radar-v6192-cluster-catalog-budget
          echo RADAR_V6192_PILOT=PUBLISHED
