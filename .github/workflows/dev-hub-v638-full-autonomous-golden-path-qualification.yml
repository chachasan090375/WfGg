name: ChaCha DEV V6.39 controlled production handoff qualification

on:
  push:
    branches: [dev-hub-v639-controlled-production-handoff]
    paths:
      - 'dev-hub/bin/controlled-production-handoff-controller.py'
      - 'dev-hub/bin/pilot-v639-controlled-production-handoff-dry-run.sh'
      - 'dev-hub/bin/pilot-v639-cloudflare-pages-production-adapter-runtime.sh'
      - 'dev-hub/bin/pilot-v639-cloudflare-pages-enablement-readiness.sh'
      - 'dev-hub/bin/enable-v639-cloudflare-pages-production-adapter.sh'
      - 'dev-hub/bin/verify-v639-cloudflare-pages-enabled-sync.sh'
      - 'dev-hub/bin/discover-v639-cloudflare-pages-targets.py'
      - 'dev-hub/bin/read-v639-cloudflare-pages-target-discovery.sh'
      - 'dev-hub/bin/controlled-production-adapter.py'
      - 'dev-hub/adapters/cloudflare-pages-production-adapter.py'
      - 'dev-hub/bin/qualify-cloudflare-pages-production-adapter.py'
      - 'dev-hub/bin/qualify-cloudflare-pages-provider-health.py'
      - 'dev-hub/evidence/v639/cloudflare-pages-production-contract-ok-to-pilot-evidence.json'
      - 'dev-hub/evidence/v639/cloudflare-pages-production-pilot-promotion-receipt.json'
      - 'dev-hub/evidence/v639/cloudflare-pages-production-pilot-to-enabled-evidence.json'
      - 'dev-hub/evidence/v639/cloudflare-pages-production-enabled-promotion-receipt.json'
      - 'dev-hub/bin/adapter-provision.py'
      - 'dev-hub/evidence/v639/cloudflare-pages-production-contract-ok-evidence.json'
      - 'dev-hub/evidence/v639/cloudflare-pages-production-contract-ok-promotion-receipt.json'
      - 'dev-hub/config/cloudflare-pages-production-adapter.v1.json'
      - 'dev-hub/config/provider-adapters.v1.json'
      - 'dev-hub/config/adapter-rollbacks.v1.json'
      - 'dev-hub/config/adapter-provisioning.v1.json'
      - 'dev-hub/docs/V6.39_CLOUDFLARE_PAGES_PRODUCTION_TECH_WATCH.md'
      - 'dev-hub/config/controlled-production-handoff.v1.json'
      - 'dev-hub/config/controlled-production-adapter-dry-run.v1.json'
      - 'dev-hub/config/lifecycle.v1.json'
      - 'dev-hub/tests/test_v639_controlled_production_handoff.py'
      - 'dev-hub/bin/autonomous-golden-path-controller.py'
      - 'dev-hub/bin/project-assurance-event.py'
      - 'dev-hub/bin/golden-path-materializer.py'
      - 'dev-hub/bin/project-control.py'
      - 'dev-hub/bin/task-graph-engine.py'
      - 'dev-hub/config/autonomous-golden-path.v1.json'
      - 'dev-hub/config/project-control.v1.json'
      - 'dev-hub/config/evidence-catalog.v1.json'
      - 'dev-hub/config/guardian-coverage-manifest.v1.json'
      - 'dev-hub/config/sentinel-technical-policy.v1.json'
      - 'dev-hub/tests/test_v638_full_autonomous_golden_path.py'
      - 'dev-hub/tests/test_v637_automatic_seven_agent_finalization.py'
      - 'dev-hub/tests/test_v636_seven_agent_final_compromise.py'
      - 'dev-hub/tests/test_v635_central_specialist_authorities.py'
      - 'dev-hub/tests/test_v634_logic_ux_compromise_release.py'
      - 'dev-hub/tests/test_v633_five_agent_embedded_probes.py'
      - 'dev-hub/tests/test_v632_project_embedded_assurance.py'
      - 'dev-hub/tests/test_v631_assurance_exchange.py'
      - 'dev-hub/tests/test_v630_external_dual_assurance.py'
      - 'dev-hub/tests/test_v629_memory_guided_foundry_planning.py'
      - 'dev-hub/tests/test_v628_trusted_dispatch_lineage.py'
      - 'dev-hub/tests/test_v627_verified_evidence_learning.py'
      - 'dev-hub/tests/test_v623_contextual_memory_recall.py'
      - 'dev-hub/bin/install-v638-full-autonomous-golden-path.sh'
      - 'dev-hub/sentinel/worker.js'
      - '.github/workflows/dev-hub-v638-sentinel-d1-first-deploy.yml'
      - '.github/workflows/dev-hub-v638-full-autonomous-golden-path-qualification.yml'
      - '.github/workflows/dev-hub-v638-full-autonomous-golden-path-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-hub-v639-controlled-production-handoff
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static validation
        run: |
          set -euo pipefail
          python3 -m py_compile             dev-hub/bin/controlled-production-handoff-controller.py             dev-hub/bin/controlled-production-adapter.py             dev-hub/adapters/cloudflare-pages-production-adapter.py             dev-hub/bin/qualify-cloudflare-pages-production-adapter.py             dev-hub/bin/qualify-cloudflare-pages-provider-health.py             dev-hub/bin/discover-v639-cloudflare-pages-targets.py             dev-hub/bin/adapter-provision.py             dev-hub/tests/test_v639_controlled_production_handoff.py             dev-hub/bin/autonomous-golden-path-controller.py             dev-hub/bin/golden-path-materializer.py             dev-hub/bin/project-assurance-event.py             dev-hub/bin/project-control.py             dev-hub/bin/task-graph-engine.py
          for f in             dev-hub/config/controlled-production-handoff.v1.json             dev-hub/config/controlled-production-adapter-dry-run.v1.json             dev-hub/config/cloudflare-pages-production-adapter.v1.json             dev-hub/config/provider-adapters.v1.json             dev-hub/config/adapter-rollbacks.v1.json             dev-hub/config/adapter-provisioning.v1.json             dev-hub/config/lifecycle.v1.json             dev-hub/config/autonomous-golden-path.v1.json             dev-hub/config/project-control.v1.json             dev-hub/config/evidence-catalog.v1.json             dev-hub/config/guardian-coverage-manifest.v1.json             dev-hub/config/sentinel-technical-policy.v1.json; do
            python3 -m json.tool "$f" >/dev/null
          done
          if [ -f dev-hub/bin/install-v638-full-autonomous-golden-path.sh ]; then
            bash -n dev-hub/bin/install-v638-full-autonomous-golden-path.sh
          fi
          bash -n dev-hub/bin/pilot-v639-controlled-production-handoff-dry-run.sh
          bash -n dev-hub/bin/pilot-v639-cloudflare-pages-production-adapter-runtime.sh
          bash -n dev-hub/bin/pilot-v639-cloudflare-pages-enablement-readiness.sh
          bash -n dev-hub/bin/enable-v639-cloudflare-pages-production-adapter.sh
          bash -n dev-hub/bin/verify-v639-cloudflare-pages-enabled-sync.sh
          bash -n dev-hub/bin/read-v639-cloudflare-pages-target-discovery.sh
          echo CHACHA_DEV_V639_STATIC=PASS

      - name: V6.39 controlled production handoff
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v639_controlled_production_handoff.py

      - name: V6.39 Cloudflare Pages provider health read-only
        run: |
          set -euo pipefail
          python3 dev-hub/bin/qualify-cloudflare-pages-provider-health.py \
            --report /tmp/v639-cf-pages-provider-health-report.json \
            --evidence /tmp/v639-cf-pages-provider-health-evidence.json

      - name: V6.39 Cloudflare Pages target discovery read-only
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 dev-hub/bin/discover-v639-cloudflare-pages-targets.py \
            --output /tmp/v639-cf-pages-target-discovery.json

      - name: V6.38 full autonomous Golden Path
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v638_full_autonomous_golden_path.py

      - name: V6.37 automatic finalization regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v637_automatic_seven_agent_finalization.py

      - name: V6.36 seven-agent final compromise regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v636_seven_agent_final_compromise.py

      - name: V6.35 specialist authority regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v635_central_specialist_authorities.py

      - name: V6.34 compromise regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v634_logic_ux_compromise_release.py

      - name: V6.33 five-agent probes regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v633_five_agent_embedded_probes.py

      - name: V6.32 embedded assurance regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v632_project_embedded_assurance.py

      - name: V6.31 Assurance Exchange regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v631_assurance_exchange.py

      - name: V6.30 dual assurance regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v630_external_dual_assurance.py

      - name: V6.29 memory-guided Foundry regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v629_memory_guided_foundry_planning.py

      - name: V6.28 trusted dispatch regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v628_trusted_dispatch_lineage.py

      - name: V6.27 verified evidence regression
        env:
          CHACHA_DEV_TEST_TRUSTED_CONTEXT_BYPASS: '1'
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v627_verified_evidence_learning.py

      - name: V6.23 contextual recall regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v623_contextual_memory_recall.py

      - name: Qualification receipt
        run: |
          {
            echo CHACHA_DEV_CONTROLLED_PRODUCTION_HANDOFF=V6.39
            echo HUMAN_BOUNDARY=production-deployment
            echo PRODUCTION_MUTATION_BEFORE_APPROVAL=NO
            echo CONTROLLED_ADAPTER=dry-run-v1
            echo ROLLBACK_PROVEN=YES
            echo OPERATE_ADVANCED=NO
            echo REAL_PRODUCTION_TARGET=NO
            echo VPS_SANDBOX_PILOT=AVAILABLE
            echo CLOUDFLARE_PAGES_PRODUCTION_ADAPTER=ENABLED
            echo CLOUDFLARE_PAGES_PRODUCTION_EXECUTION=BLOCKED
            echo CLOUDFLARE_PAGES_ROLLBACK_CONTRACT=YES
            echo CLOUDFLARE_PAGES_PROVISIONING_PROBE=NON_MUTATING
            echo CLOUDFLARE_PAGES_CONTRACT_OK_QUALIFICATION=STATIC_ONLY
            echo CLOUDFLARE_PAGES_CONTRACT_OK_PROMOTION=RECORDED
            echo CLOUDFLARE_PAGES_SANDBOX_PROVISIONING=REQUIRED
            echo CLOUDFLARE_PAGES_REAL_VPS_PROVISIONING=YES
            echo CLOUDFLARE_PAGES_RUNTIME_PILOT=AVAILABLE
            echo CLOUDFLARE_PAGES_PROVIDER_HEALTH=READ_ONLY_PASS
            echo CLOUDFLARE_PAGES_PROVIDER_HEALTH_CREDENTIALS=NONE
            echo CLOUDFLARE_PAGES_ENABLEMENT_APPROVAL=HUMAN_REQUIRED
            echo CLOUDFLARE_PAGES_ENABLEMENT_READINESS=SCRIPTED
            echo CLOUDFLARE_PAGES_ENABLEMENT_APPLY=PASS
            echo CLOUDFLARE_PAGES_ENABLEMENT_APPROVAL=RECORDED
            echo CLOUDFLARE_PAGES_RUNTIME_IDEMPOTENCE=PASS
            echo CLOUDFLARE_PAGES_ENABLED_SYNC_VERIFIER=AVAILABLE
            echo CLOUDFLARE_PAGES_TARGET_DISCOVERY=READ_ONLY
            echo CLOUDFLARE_PAGES_TARGET_DISCOVERY_READER=AVAILABLE
            echo REAL_PRODUCTION_TARGET_SELECTED=NO
            echo REAL_PRODUCTION_DEPLOYMENT_AUTHORIZED=NO
            echo CLOUDFLARE_PAGES_PRODUCTION_EXECUTION=BLOCKED_AFTER_ENABLE
            echo CLOUDFLARE_PAGES_PILOT_PROMOTION_APPLIED=YES
            echo V638_REGRESSION=YES
            echo RESULT=success
            echo SOURCE_REV="$(git rev-parse HEAD)"
            echo IDEA_TO_RELEASE=YES
            echo MANUAL_INTERMEDIATE_ARTIFACT_PREPARATION=NO
            echo VERIFIED_EVIDENCE_ONLY=YES
            echo HUMAN_BOUNDARY_PRESERVED=YES
            echo TRUE_TWO_PHASE_HUMAN_RESUME=YES
            echo RESUME_SAME_PROJECT=YES
            echo SENTINEL_D1_FIRST_RELEASE_ASSURANCE=YES
            echo SPECIALIST_PROJECT_EVIDENCE=EXACT_REVISION_SIGNED_RELAY
            echo PROTECTED_APPROVAL_TRANSACTION=YES
            echo SEVEN_AGENT_FINALIZATION=AUTOMATIC_V637
            echo CANONICAL_PROFILE=static-interaction-v1
            echo UNIVERSAL_GENERATOR_CLAIMED=NO
            echo DIRECT_LEDGER_MUTATION=NO
            echo DIRECT_LIFECYCLE_MUTATION=NO
            echo AUTOMATIC_EXTERNAL_SPEND_EUR=0
          } | tee /tmp/CHACHA_DEV_V639_RECEIPT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: chacha-dev-v639-controlled-production-handoff
          path: |
            /tmp/CHACHA_DEV_V639_RECEIPT.txt
            /tmp/v639-cf-pages-provider-health-report.json
            /tmp/v639-cf-pages-provider-health-evidence.json
            /tmp/v639-cf-pages-target-discovery.json
          retention-days: 30
