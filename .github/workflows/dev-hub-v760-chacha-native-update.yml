name: ChaCha DEV V7.6 native update qualification

on:
  push:
    branches:
      - dev-hub-v760-chacha-native-update
    paths:
      - 'dev-hub/bin/native_update_publisher.py'
      - 'dev-hub/bin/direct-operator-service.py'
      - 'dev-hub/config/android-native-update.v1.json'
      - 'dev-hub/config/direct-operator.v1.json'
      - 'dev-hub/config/guardian-coverage-manifest.v1.json'
      - 'dev-hub/config/technology-core-watch.v1.json'
      - 'dev-hub/config/guardian-role-contracts.v1.json'
      - 'dev-hub/tests/test_v760_chacha_native_update.py'
      - 'android/chacha-direct-operator-widget/**'
      - '.github/workflows/dev-hub-v760-chacha-native-update.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Static validation
        run: |
          set -euo pipefail
          python3 -m py_compile             dev-hub/bin/native_update_publisher.py             dev-hub/bin/direct-operator-service.py             dev-hub/tests/test_v760_chacha_native_update.py
          python3 -m json.tool dev-hub/config/android-native-update.v1.json >/dev/null
          python3 -m json.tool dev-hub/config/direct-operator.v1.json >/dev/null
      - name: Native update contract and runtime switch
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v760_chacha_native_update.py | tee /tmp/v760.out
          grep -Fq 'CHACHA_DEV_V760_NATIVE_UPDATE=PASS' /tmp/v760.out
          grep -Fq 'CHACHA_DEV_V760_STABLE_CERT_PIN=PASS' /tmp/v760.out
          grep -Fq 'CHACHA_DEV_V760_APK_SHA256_VERIFY=YES' /tmp/v760.out
          grep -Fq 'CHACHA_DEV_V760_APK_SIGNING_CERT_VERIFY=YES' /tmp/v760.out
          grep -Fq 'CHACHA_DEV_V760_ANDROID_USER_CONFIRMATION=REQUIRED' /tmp/v760.out
          grep -Fq 'CHACHA_DEV_V760_SILENT_INSTALL=NO' /tmp/v760.out
          grep -Fq 'CHACHA_DEV_V760_NATIVE_PUBLISH_ROLLBACK=PASS' /tmp/v760.out
          grep -Fq 'CHACHA_DEV_V760_LIVE_UI_RUNTIME_SWITCH=PASS' /tmp/v760.out
      - name: Install Android SDK
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build unsigned release shell
        run: |
          set -euo pipefail
          gradle -p android/chacha-direct-operator-widget :app:assembleRelease :app:lintRelease
          APK=android/chacha-direct-operator-widget/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          sha256sum "$APK"
          echo CHACHA_DEV_V760_UNSIGNED_RELEASE_BUILD=PASS
      - uses: actions/upload-artifact@v4
        with:
          name: chacha-native-shell-v760-unsigned
          path: android/chacha-direct-operator-widget/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
      - name: Receipt
        run: |
          echo CHACHA_DEV_V760_NATIVE_UPDATE_QUALIFICATION=PASS
          echo RELEASE_SIGNING_LOCATION=VPS_ONLY
          echo PINNED_CERT_SHA256=439be7ae4154889137f8f22a4504ca6c85f4243e2052fe8ca0c29c92a692feae
          echo ANDROID_USER_INSTALL_CONFIRMATION_REQUIRED=YES
          echo SILENT_INSTALL=NO
          echo AUTOMATIC_EXTERNAL_SPEND_EUR=0
