name: WfGg Train presence frontend fix

on:
  push:
    branches:
      - train-bridge-phase3

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[presence-fix-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: train-bridge-phase3
          fetch-depth: 0

      - name: Apply presence frontend patch
        run: python .github/scripts/train_presence_frontend_fix.py

      - name: Validate Worker
        run: |
          node --check frontend/_worker.js
          grep -q 'WFGG_TRAIN_PORTAL_PRESENCE_TOKEN_FIX_V1' frontend/_worker.js
          grep -q 'wfgg_bridge=v9' frontend/_worker.js

      - name: Commit patch
        run: |
          if git diff --quiet -- frontend/_worker.js; then
            echo 'No application change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/_worker.js
          git commit -m 'fix: restore Train presence heartbeat [presence-fix-auto] [snapshot-seed-auto]'
          git push origin HEAD:train-bridge-phase3
