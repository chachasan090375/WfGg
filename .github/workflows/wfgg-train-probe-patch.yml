name: Portal Train architecture patch

on:
  push:
    branches:
      - train-bridge-phase3

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[architecture-fix-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: train-bridge-phase3
      - name: Apply ownership and vector logo patch
        run: python .github/scripts/portal_train_architecture_fix.py
      - name: Validate JavaScript
        run: |
          node --check frontend/_worker.js
          node --check frontend/portal-v070.js
          grep -q 'WFGG_TRAIN_VECTOR_LOGO_V1' frontend/_worker.js
          grep -q 'WFGG_TRAIN_ADMIN_OWNERSHIP_V1' frontend/_worker.js
          grep -q 'WFGG_PORTAL_PLAYER_STATS_V1' frontend/portal-v070.js
          grep -q 'WFGG_PORTAL_PLAYER_STATS_STYLE_V1' frontend/portal-v070.css
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/_worker.js frontend/portal-v070.js frontend/portal-v070.css
          if git diff --cached --quiet; then
            echo 'No application changes to commit.'
            exit 0
          fi
          git commit -m 'fix: move global Train admin to Portal [architecture-fix-auto]'
          git push origin HEAD:train-bridge-phase3
