name: WfGg Train boot diagnostic patch

on:
  push:
    branches:
      - train-bridge-phase3

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[bootdiag-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: train-bridge-phase3
          fetch-depth: 0
      - name: Apply Train boot diagnostic patch
        run: python .github/scripts/train_boot_diagnostic_patch.py
      - name: Validate Worker syntax
        run: node --check frontend/_worker.js
      - name: Commit diagnostic
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/_worker.js
          git commit -m 'fix: expose precise Train boot failure [bootdiag-auto]'
          git push origin HEAD:train-bridge-phase3
