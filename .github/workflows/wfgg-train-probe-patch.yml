name: WfGg Train dangling token fix

on:
  push:
    branches:
      - train-bridge-phase3

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[token-fix-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: train-bridge-phase3
          fetch-depth: 0
      - name: Apply dangling token fix
        run: python .github/scripts/fix_train_dangling_token.py
      - name: Validate Worker syntax
        run: node --check frontend/_worker.js
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/_worker.js
          git commit -m 'fix: remove dangling Train token guard [token-fix-auto]'
          git push origin HEAD:train-bridge-phase3
