name: Radar V6.9.1 native profile build

on:
  push:
    branches: [radar-production-v1]
    paths:
      - '.github/workflows/radar-v69-build.yml'
      - '.github/scripts/patch-radar-native-profile-v69.py'
      - '.github/scripts/patch-radar-native-profile-handshake-v691.py'
      - '.radar-release-src/v69-source/**'
      - '.radar-release-src/v691-source/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: wfgg-radar-v691-build
  cancel-in-progress: false

env:
  LASTWAR_CLIENT_REF: ee5f64de160a8051c2f9f98189b75038dd225a0a

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-production-v1
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Reconstruct current Radar connector
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar
          mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          echo '234df1dec57f6211bc625855bf13350c9f17fbd843fbe92d8cf1ab7cb5c081ef  /tmp/radar-src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar
          rm -rf /tmp/wfgg-radar/connector-go
          cp -a .radar-release-src/v2-source/connector-go /tmp/wfgg-radar/connector-go
          python3 .github/scripts/patch-radar-target-profile-retry.py
          python3 .github/scripts/patch-radar-federated-diagnostics-v65.py
          python3 .github/scripts/patch-player-scan-v3.py
          python3 .github/scripts/patch-player-scan-v4.py
          python3 .github/scripts/patch-radar-protocol-discovery-v67.py
          python3 .github/scripts/patch-radar-profile-isolation-v68.py
          python3 .github/scripts/patch-radar-native-profile-v69.py
          python3 .github/scripts/patch-radar-native-profile-handshake-v691.py

      - name: Test and build V6.9.1 connector
        working-directory: /tmp/wfgg-radar/connector-go
        run: |
          set -euo pipefail
          gofmt -w ./cmd ./internal
          go test ./...
          go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o "$GITHUB_WORKSPACE/radar-vps/release/radar-connector" ./cmd/radar-connector
          test -s "$GITHUB_WORKSPACE/radar-vps/release/radar-connector"

      - name: Build V6.9.1 native helper from pinned upstream
        run: |
          set -euo pipefail
          rm -rf /tmp/lastwar-client
          git clone --quiet --filter=blob:none --no-checkout https://github.com/ljagiello/lastwar-client.git /tmp/lastwar-client
          cd /tmp/lastwar-client
          git fetch --quiet --depth 1 origin "$LASTWAR_CLIENT_REF"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$LASTWAR_CLIENT_REF"
          go test ./internal/auth ./internal/pcap ./internal/sfs
          mkdir -p cmd/wfgg-radar-native-template
          cp /tmp/wfgg-radar/connector-go/native-template/main.go cmd/wfgg-radar-native-template/main.go
          cp /tmp/wfgg-radar/connector-go/native-template/player_scan_v3.go cmd/wfgg-radar-native-template/player_scan_v3.go
          cp /tmp/wfgg-radar/connector-go/native-template/player_scan_v4.go cmd/wfgg-radar-native-template/player_scan_v4.go
          cp /tmp/wfgg-radar/connector-go/native-template/profile_scan_v69.go cmd/wfgg-radar-native-template/profile_scan_v69.go
          cp /tmp/wfgg-radar/connector-go/native-template/profile_scan_v69_test.go cmd/wfgg-radar-native-template/profile_scan_v69_test.go
          gofmt -w cmd/wfgg-radar-native-template/*.go
          go test -tags lastwar_native_template ./cmd/wfgg-radar-native-template
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags lastwar_native_template -trimpath -ldflags='-s -w' -o "$GITHUB_WORKSPACE/radar-vps/release/radar-native-template" ./cmd/wfgg-radar-native-template
          test -s "$GITHUB_WORKSPACE/radar-vps/release/radar-native-template"
          "$GITHUB_WORKSPACE/radar-vps/release/radar-native-template" --capabilities > /tmp/v691-capabilities.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/v691-capabilities.json'))
          assert d.get('ok') is True
          assert d.get('readonly') is True
          assert d.get('profileHandshake') == 'v6.9.1'
          assert d.get('profileCLI') is True
          assert d.get('profileCommand') == 'get.user.info.multi'
          print('RADAR_V691_PROFILE_CAPABILITY=RECOGNIZED')
          PY
          set +e
          cli_probe="$("$GITHUB_WORKSPACE/radar-vps/release/radar-native-template" /tmp/no-capture /tmp/no-session --scan-profiles 1 2>/dev/null)"
          cli_rc=$?
          set -e
          test "$cli_rc" -ne 0
          echo "$cli_probe" | grep -Fq 'SESSION_READ_FAILED'
          ! echo "$cli_probe" | grep -Fq 'INVALID_ARGS'
          echo RADAR_V691_PROFILE_CLI=RECOGNIZED

      - name: Verify V6.9.1 read-only release surface
        run: |
          set -euo pipefail
          grep -Fq 'WFGG_RADAR_NATIVE_PROFILE_HANDSHAKE_V691' /tmp/wfgg-radar/connector-go/internal/protocol/profile_handshake_v691.go
          grep -Fq 'WFGG_RADAR_NATIVE_PROFILE_HEALTH_V691' /tmp/wfgg-radar/connector-go/cmd/radar-connector/main.go
          grep -Fq 'WFGG_RADAR_NATIVE_PROFILE_CAPABILITIES_V691' /tmp/wfgg-radar/connector-go/native-template/main.go
          grep -Fq 'profileFailureV691(rep)' /tmp/wfgg-radar/connector-go/internal/protocol/profile_scan_v69.go
          grep -Fq 'PLAYER_PROFILE_DECODE_FAILED' /tmp/wfgg-radar/connector-go/native-template/profile_scan_v69.go
          ! grep -REq 'building\.production\.collect|mail\.reward|al\.science\.donate|visitor\.operate|attack|march|purchase' .radar-release-src/v691-source .radar-release-src/v69-source/connector-go
          chmod 0755 radar-vps/release/radar-connector radar-vps/release/radar-native-template
          (
            cd radar-vps/release
            sha256sum radar-connector radar-native-template > SHA256SUMS
          )
          cat radar-vps/release/SHA256SUMS

      - name: Publish V6.9.1 release
        id: publish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar-vps/release/radar-connector radar-vps/release/radar-native-template radar-vps/release/SHA256SUMS
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo RADAR_V691_RELEASE=UNCHANGED
            exit 0
          fi
          git commit -m 'build(radar): publish V6.9.1 profile handshake diagnostics'
          git fetch origin radar-production-v1
          git rebase origin/radar-production-v1
          git push origin HEAD:radar-production-v1
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo RADAR_V691_RELEASE=PUBLISHED

      - name: Dispatch Radar production verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy-radar-production.yml --ref radar-production-v1
          echo RADAR_V691_PRODUCTION_VERIFY=DISPATCHED
