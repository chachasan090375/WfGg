name: Portal roster authority v1

on:
  push:
    branches: [portal-roster-authority-v1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-validate-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portal-roster-authority-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply central roster patch
        run: python3 scripts/patch-portal-roster-authority-v1.py
      - name: Syntax and contract
        run: |
          node --check frontend/portal-v070.js
          node --check worker/src/core.js
          node --check worker/src/index.js
          grep -q "/api/alliance/roster" worker/src/core.js
          grep -q "MEMBER_DEPARTURE" worker/src/core.js
          grep -q "/api/portal-roster/sync" worker/src/index.js
          grep -q "Retirer de l’Alliance" frontend/portal-v070.js
          grep -q "Accès réservé aux membres de l’Alliance WfGg" frontend/portal-v070.js
          grep -q "auth_code_key" worker/src/core.js
          grep -q "SESSION_DAYS" worker/src/core.js
      - name: Worker package check
        working-directory: worker
        run: |
          npm ci
          npm run check
      - name: Remove one-time machinery
        run: |
          rm -f scripts/patch-portal-roster-authority-v1.py
          rm -f .github/workflows/portal-roster-authority-v1.yml
      - name: Verify runtime-only diff
        run: |
          git status --short
          python3 - <<'PY'
          import subprocess
          allowed={'frontend/portal-v070.js','worker/src/core.js','worker/src/index.js'}
          changed=set(subprocess.check_output(['git','status','--porcelain'],text=True).splitlines())
          paths={line[3:] for line in changed if len(line)>=4}
          extra=paths-allowed
          if extra:
              raise SystemExit(f'unexpected changed files: {sorted(extra)}')
          if not paths:
              raise SystemExit('no runtime changes produced')
          PY
      - name: Commit runtime only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/portal-v070.js worker/src/core.js worker/src/index.js
          git commit -m "Portal: make alliance roster authoritative for modules"
          git push origin HEAD:portal-roster-authority-v1
