name: Sentinel supervisor access v7

on:
  push:
    branches:
      - sentinel-supervisor-access-v7
    paths:
      - 'scripts/patch-sentinel-supervisor-v7.mjs'
      - 'worker/migrations/0003_supervisor_sentinel_access.sql'
      - '.github/workflows/sentinel-supervisor-access-v7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sentinel-supervisor-access-v7
          fetch-depth: 0

      - name: Apply Sentinel supervisor patch
        run: node scripts/patch-sentinel-supervisor-v7.mjs

      - name: Validate JavaScript syntax
        run: |
          node --check frontend/_worker.js
          node --check frontend/train-native/sentinel-train-v1.js

      - name: Validate access contract
        run: |
          grep -q 'WFGG_SENTINEL_EDGE_ACCESS_V7' frontend/_worker.js
          grep -q "\['OWNER','SUPERVISOR'\].includes(sentinelRole)" frontend/_worker.js
          grep -q 'SENTINEL_ACCESS_FORBIDDEN' frontend/_worker.js
          grep -q "script.src='/train/sentinel-train-v1.js?v=007'" frontend/_worker.js
          grep -q 'WFGG_SENTINEL_ACCESS_RETRY_V7' frontend/train-native/sentinel-train-v1.js
          grep -q "\['OWNER', 'SUPERVISOR'\].includes(accessRole)" frontend/train-native/sentinel-train-v1.js
          grep -q 'WFGG_SENTINEL_LAUNCH_CAPTURE_V7' frontend/train-native/sentinel-train-v1.js
          grep -q "role TEXT NOT NULL CHECK (role IN ('OWNER','SUPERVISOR'))" worker/migrations/0003_supervisor_sentinel_access.sql
          grep -q "'flawene','flawen'" worker/migrations/0003_supervisor_sentinel_access.sql
          grep -q 'εlο ツ' worker/migrations/0003_supervisor_sentinel_access.sql

      - name: Commit generated application changes
        run: |
          if git diff --quiet -- frontend/_worker.js frontend/train-native/sentinel-train-v1.js; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/_worker.js frontend/train-native/sentinel-train-v1.js
          git commit -m 'fix(sentinel): support SUPERVISOR and robust Android launch'
          git push origin HEAD:sentinel-supervisor-access-v7
