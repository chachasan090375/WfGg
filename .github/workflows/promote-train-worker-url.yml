name: Promote Train Worker URL

on:
  push:
    branches: [train-bridge-phase3]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[prod-worker-url-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: train-bridge-phase3
      - name: Promote runtime Worker URL
        run: python .github/scripts/promote_train_worker_url.py
      - name: Validate runtime and recette
        run: |
          node --check frontend/_worker.js
          node --check frontend/portal-v070.js
          grep -q 'https://wfgg-train.chachasan090375.workers.dev' frontend/_worker.js
          grep -q 'https://wfgg-train.chachasan090375.workers.dev' frontend/portal-v070.js
          grep -q 'https://wfgg-train.chachasan090375.workers.dev/api/health' .github/workflows/train-recette.yml
          ! grep -q 'portal-auth-phase1-wfgg-train.chachasan090375.workers.dev' frontend/_worker.js
          ! grep -q 'portal-auth-phase1-wfgg-train.chachasan090375.workers.dev' frontend/portal-v070.js
      - name: Commit promotion URL
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/_worker.js frontend/portal-v070.js .github/workflows/train-recette.yml
          git commit -m 'fix: use production Train Worker [prod-worker-url-auto]'
          git push origin HEAD:train-bridge-phase3
