name: ChaCha DEV Radar V6.19.11 functional Manual Search Stop pilot qualification

on:
  push:
    branches: [dev-hub-radar-v61911-functional-stop-pilot]
    paths:
      - 'dev-hub/bin/run-radar-v61911-functional-stop-pilot-via-chacha-dev.sh'
      - 'dev-hub/projects/wfgg-radar/project-intent.v1.json'
      - '.github/workflows/dev-hub-radar-v61911-functional-stop-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  APPROVED_REV: cbf67e46308e925f1ba5fad0be3f58764231935d
  PILOT_REV: 759bfb3fe4620f544cc84fdea34e54bfa3efbdcf
  EXPECTED_CONNECTOR_SHA256: 4d66709f10d3a6b27ac255a1dfdc62e51d2817652634409ffe2edc071762c69f
  EXPECTED_UI_SHA256: 6e6827e660597549bdc8c4c06e06a644a16215aacabdd20a56993a15f651c060

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-hub-radar-v61911-functional-stop-pilot

      - name: Validate shell and embedded pilot server
        run: |
          set -euo pipefail
          R=dev-hub/bin/run-radar-v61911-functional-stop-pilot-via-chacha-dev.sh
          bash -n "$R"
          python3 - "$R" <<'PY'
          import sys
          text=open(sys.argv[1],encoding='utf-8').read()
          start="cat > \"$PILOT_SERVER\" <<'PY'\n"
          i=text.index(start)+len(start)
          j=text.index("\nPY\n\npython3 \"$PILOT_SERVER\"",i)
          source=text[i:j]
          compile(source,'v61911-functional-server.py','exec')
          print('RADAR_V61911_EMBEDDED_SERVER_SYNTAX=PASS')
          PY
          echo RADAR_V61911_FUNCTIONAL_RUNNER_SHELL=PASS

      - name: Validate functional approval and scope
        run: |
          set -euo pipefail
          R=dev-hub/bin/run-radar-v61911-functional-stop-pilot-via-chacha-dev.sh
          grep -Fq 'APPROVED_REV="cbf67e46308e925f1ba5fad0be3f58764231935d"' "$R"
          grep -Fq 'PILOT_REV="759bfb3fe4620f544cc84fdea34e54bfa3efbdcf"' "$R"
          grep -Fq 'CONNECTOR_SHA="4d66709f10d3a6b27ac255a1dfdc62e51d2817652634409ffe2edc071762c69f"' "$R"
          grep -Fq 'TARGET_QUERY="@federated:8120"' "$R"
          grep -Fq 'J’approuve la réouverture du PILOT fonctionnel Radar V6.19.11 Manual Search Stop avec le runner 3dceb68a89a82836b85163bf3bd40c8b7b7da4c5' "$R"
          grep -Fq 'récupération préalable du cycle stale 81 exclusivement via le mécanisme V6.19.7 validé' "$R"
          grep -Fq 'RADAR_V61911_FUNCTIONAL_EXPECT_STALE_RECOVERY_CYCLE=81' "$R"
          grep -Fq 'RADAR_V61911_FUNCTIONAL_WAIT_MAX_SECONDS=3600' "$R"
          grep -Fq 'RADAR_V61911_FUNCTIONAL_COLLECTOR_MUTATION=DISCOVERY_EVIDENCE_TERMINIZATION_ONLY' "$R"
          grep -Fq 'RADAR_V61911_TOKEN_PERSISTENCE=NO' "$R"
          grep -Fq 'RADAR_V61911_LASTWAR_MODE=READ_ONLY' "$R"
          grep -Fq 'PRODUCTION_RELEASE_APPROVAL_REVOKED=PASS' "$R"
          grep -Fq 'RADAR_V61911_PILOT_WINDOW_CLOSED=YES' "$R"
          echo RADAR_V61911_FUNCTIONAL_APPROVAL_SCOPE=PASS

      - name: Validate exact candidate UI and button contract
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/chachasan090375/WfGg/$PILOT_REV"
          curl -fsSL "$BASE/radar-vps/pilot-v61911/cloudflare/live-radar.html" -o /tmp/live-radar.html
          test "$(sha256sum /tmp/live-radar.html | awk '{print $1}')" = "$EXPECTED_UI_SHA256"
          grep -Fq "manualSearchRunning" /tmp/live-radar.html
          grep -Fq "manualSearchStopping" /tmp/live-radar.html
          grep -Fq "requestManualSearchStop" /tmp/live-radar.html
          grep -Fq "go.textContent=manualSearchRunning?(manualSearchStopping?'ARRÊT…':'STOP'):'RECHERCHER'" /tmp/live-radar.html
          grep -Fq "if(manualSearchRunning){await requestManualSearchStop();return}" /tmp/live-radar.html
          grep -Fq "/api/radar/search/stop" /tmp/live-radar.html
          echo RADAR_V61911_FUNCTIONAL_UI_CONTRACT=PASS

      - name: Validate exact pilot connector and guard assets
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/chachasan090375/WfGg/$PILOT_REV"
          mkdir -p /tmp/v61911
          for f in radar-vps/pilot-v61911/SHA256SUMS radar-vps/pilot-v61911/radar-connector radar-vps/install-v61911-pilot.sh radar-vps/probe-v61911-pilot-runtime.sh; do
            curl -fsSL "$BASE/$f" -o "/tmp/v61911/$(basename "$f")"
          done
          (
            cd /tmp/v61911
            sha256sum -c SHA256SUMS
          )
          test "$(sha256sum /tmp/v61911/radar-connector | awk '{print $1}')" = "$EXPECTED_CONNECTOR_SHA256"
          bash -n /tmp/v61911/install-v61911-pilot.sh
          bash -n /tmp/v61911/probe-v61911-pilot-runtime.sh
          grep -aFq 'MANUAL_SEARCH_STOPPED' /tmp/v61911/radar-connector
          grep -aFq '/v1/collector/search/stop' /tmp/v61911/radar-connector
          echo RADAR_V61911_FUNCTIONAL_PINNED_ASSETS=PASS

      - name: Verify no production deployment path
        run: |
          set -euo pipefail
          R=dev-hub/bin/run-radar-v61911-functional-stop-pilot-via-chacha-dev.sh
          ! grep -Eq 'wrangler (deploy|pages deploy)|radar-production-v1|wfgg-radar\.workers\.dev|CLOUDFLARE_API_TOKEN' "$R"
          grep -Fq 'tailscale ip -4' "$R"
          grep -Fq 'ThreadingHTTPServer' "$R"
          grep -Fq 'sessions[sid]={"credential":credential' "$R"
          ! grep -Fq 'write_text(credential' "$R"
          ! grep -Fq 'saveCredential' "$R"
          grep -Fq 'RADAR_V61911_CONNECTOR_RESTART_DURING_STOP=NO' "$R"
          grep -Fq 'RADAR_V61911_FUNCTIONAL_CYCLE_TERMINALIZED=PASS' "$R"
          grep -Fq 'RADAR_V61911_MANUAL_SEARCH_STOPPED=PASS' "$R"
          echo RADAR_V61911_FUNCTIONAL_NO_PRODUCTION_DEPLOY=PASS
          echo RADAR_V61911_FUNCTIONAL_TOKEN_PERSISTENCE=NO
