name: Sentinel functional coverage v11

on:
  push:
    branches: [sentinel-functional-audit-v11]
    paths:
      - 'scripts/patch-sentinel-functional-audit-v11.py'
      - '.github/workflows/sentinel-functional-audit-v11.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sentinel-functional-audit-v11
          fetch-depth: 0

      - name: Apply Portal Sentinel V11 patch
        run: python3 scripts/patch-sentinel-functional-audit-v11.py

      - name: Validate observer-only coverage
        run: |
          node --check frontend/_worker.js
          node --check frontend/train-native/sentinel-train-v1.js
          grep -q 'WFGG_SENTINEL_FUNCTIONAL_COVERAGE_V11' frontend/_worker.js
          grep -q "'/api/sentinel/feature-audit'" frontend/_worker.js
          grep -q "'/api/sentinel/self-test'" frontend/_worker.js
          grep -q "X-WfGg-Sentinel-Diagnostic':'v11" frontend/_worker.js
          grep -q 'sentinel-self-test-v11' frontend/_worker.js
          grep -q "sentinel-train-v11" frontend/train-native/sentinel-train-v1.js
          grep -q 'WFGG_SENTINEL_REPORT_V4' frontend/train-native/sentinel-train-v1.js
          grep -q 'train-ui-functional-contract-v11' frontend/train-native/sentinel-train-v1.js
          grep -q 'train-calendar-runtime' frontend/train-native/sentinel-train-v1.js
          grep -q "sentinel-train-v1.js?v=011" frontend/_worker.js
          ! grep -A100 'WFGG_SENTINEL_FUNCTIONAL_COVERAGE_V11' frontend/_worker.js | grep -E "method:'(POST|PUT|DELETE)'"

      - name: Validate expected UI feature families
        run: |
          for fn in addCalendar toggleAlerts testPushReminder publishMarketExchange cancelMarketExchange executeMarketSwap saveUnavailablePeriod toggleRotation saveSelfProfile changeMyPin changeLanguage saveAdminSettings saveDay openMemberForm saveMemberForm deleteMember moveRotation generateMessage refreshAdminPresence saveGameLinks openAdminAnalytics renderTrainHistory; do
            grep -q "'$fn'" frontend/train-native/sentinel-train-v1.js || { echo "MISSING_UI_CONTRACT=$fn"; exit 1; }
          done

      - name: Commit generated Portal V11 runtime
        run: |
          if git diff --quiet -- frontend/_worker.js frontend/train-native/sentinel-train-v1.js; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/_worker.js frontend/train-native/sentinel-train-v1.js
          git commit -m 'feat(sentinel): full UI and server coverage v11'
          git push origin HEAD:sentinel-functional-audit-v11
