name: ChaCha DEV Radar V6.19.8 history quality diagnostic qualification

on:
  push:
    branches: [dev-hub-v5-radar-cluster-quality-diagnostic-v1]
    paths:
      - 'dev-hub/bin/run-radar-v6198-history-quality-diagnostic.sh'
      - '.github/workflows/dev-hub-radar-v6198-history-quality-diagnostic-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-hub-v5-radar-cluster-quality-diagnostic-v1

      - name: Validate read-only history quality diagnostic
        run: |
          set -euo pipefail
          R=dev-hub/bin/run-radar-v6198-history-quality-diagnostic.sh
          bash -n "$R"
          grep -Fq 'EXPECTED_CONNECTOR="fb21a02feeaaa6a7013cf4e17c77bbb033a30a4bce021066fd947fc665360a9b"' "$R"
          grep -Fq 'EXPECTED_NATIVE="274d040f5294cb09422e5d55cc4b5335ac7739924c33dcb67b3f279645814900"' "$R"
          grep -Fq 'TARGET_SEED="8125"' "$R"
          grep -Fq "sqlite3.connect('file:'+path+'?mode=ro'" "$R"
          grep -Fq 'PRAGMA query_only=ON' "$R"
          grep -Fq 'PRAGMA quick_check' "$R"
          grep -Fq 'SERVER_CYCLE_HISTORY_SECONDS=' "$R"
          grep -Fq 'CYCLE_QUALITY_META_SECONDS=' "$R"
          grep -Fq 'RADAR_V6198_HISTORY_QUALITY_90S_TIMEOUT=YES' "$R"
          grep -Fq 'RADAR_V6198_HISTORY_QUALITY_TIMEOUT_STAGE=' "$R"
          grep -Fq 'TARGET_SEED_ELIGIBLE_HISTORY_COUNT=' "$R"
          grep -Fq 'LASTWAR_CONTACT=NO' "$R"
          grep -Fq 'RADAR_PRODUCTION_MUTATION=NO' "$R"
          grep -Fq 'COLLECTOR_DATA_MUTATION=NO' "$R"
          grep -Fq 'RADAR_V6198_HISTORY_QUALITY_DIAG=PASS' "$R"
          echo RADAR_V6198_HISTORY_QUALITY_DIAGNOSTIC=QUALIFIED
