name: ChaCha DEV Radar V6.19.6 production Sentinel reconcile qualification

on:
  push:
    branches: [dev-hub-v5-radar-cluster-quality-diagnostic-v1]
    paths:
      - 'dev-hub/bin/run-radar-v6196-production-sentinel-reconcile.sh'
      - '.github/workflows/dev-hub-radar-v6196-production-sentinel-reconcile-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-hub-v5-radar-cluster-quality-diagnostic-v1

      - name: Validate governed V6.19.6 production reconcile
        run: |
          set -euo pipefail
          F=dev-hub/bin/run-radar-v6196-production-sentinel-reconcile.sh
          bash -n "$F"
          grep -Fq 'WFGG_DEV_HUB_RADAR_V6196_PROD_RECONCILE_REV' "$F"
          grep -Fq '/opt/chacha-dev/runtime/tmp' "$F"
          grep -Fq 'J’approuve la promotion production Radar V6.19.6 Autopilot Continue-on-No-Data et le déploiement des surfaces Cloudflare associées.' "$F"
          grep -Fq 'production-release' "$F"
          grep -Fq 'radar-runtime:production-sentinel-reconcile-v6196' "$F"
          grep -Fq '"action":"pilot-close"' "$F"
          grep -Fq 'b7ff60476f3afe7c8bcb9b78963c46daa4e8b5507490cc83cbcbc4ced63e7c35' "$F"
          grep -Fq '274d040f5294cb09422e5d55cc4b5335ac7739924c33dcb67b3f279645814900' "$F"
          grep -Fq 'RADAR_V6196_PRODUCTION_RUNTIME=PASS' "$F"
          grep -Fq 'PRODUCTION_RELEASE_APPROVAL_REVOKED=PASS' "$F"
          grep -Fq 'PROJECT_CONTROL_INTEGRITY_AFTER=PASS' "$F"
          grep -Fq 'RADAR_V6196_PRODUCTION_APPROVAL_STANDING=NO' "$F"
          grep -Fq 'RADAR_V6196_LASTWAR_MUTATION=NO' "$F"
          grep -Fq 'RADAR_V6196_PROD_RECONCILE=PASS' "$F"
          echo RADAR_V6196_PRODUCTION_SENTINEL_RECONCILE=QUALIFIED
