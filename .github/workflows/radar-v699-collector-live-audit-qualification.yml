name: Radar V6.9.9 Collector live audit qualification

on:
  push:
    branches: [radar-v699-collector-live-audit]
    paths:
      - '.github/workflows/radar-v699-collector-live-audit-qualification.yml'
      - '.github/scripts/patch-radar-collector-live-audit-v699.py'
      - '.github/scripts/patch-radar-connector-runtime-v693.py'
      - '.radar-release-src/v699-source/**'

permissions:
  contents: read

env:
  LASTWAR_CLIENT_REF: ee5f64de160a8051c2f9f98189b75038dd225a0a

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-v699-collector-live-audit
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Reconstruct connector through V6.9.9
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar
          mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          echo '234df1dec57f6211bc625855bf13350c9f17fbd843fbe92d8cf1ab7cb5c081ef  /tmp/radar-src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar
          rm -rf /tmp/wfgg-radar/connector-go
          cp -a .radar-release-src/v2-source/connector-go /tmp/wfgg-radar/connector-go
          python3 .github/scripts/patch-radar-target-profile-retry.py
          python3 .github/scripts/patch-radar-federated-diagnostics-v65.py
          python3 .github/scripts/patch-player-scan-v3.py
          python3 .github/scripts/patch-player-scan-v4.py
          python3 .github/scripts/patch-radar-protocol-discovery-v67.py
          python3 .github/scripts/patch-radar-profile-isolation-v68.py
          python3 .github/scripts/patch-radar-native-profile-v69.py
          python3 .github/scripts/patch-radar-native-profile-handshake-v691.py
          python3 .github/scripts/patch-radar-native-profile-exec-v692.py
          python3 .github/scripts/patch-radar-connector-runtime-v693.py

      - name: Qualify aggregate-only live Collector audit
        working-directory: /tmp/wfgg-radar/connector-go
        run: |
          set -euo pipefail
          gofmt -w ./cmd ./internal
          go test ./...
          go test ./cmd/radar-connector -run 'TestCollectorAuditV699AggregateOnly|TestCollectorAuditV699SanitizesUpstreamFailure' -count=1
          go vet ./...
          grep -Fq 'WFGG_RADAR_COLLECTOR_LIVE_AUDIT_ROUTE_V699' cmd/radar-connector/main.go
          grep -Fq 'GET /v1/collector/audit' cmd/radar-connector/main.go
          grep -Fq 'RawPlayerDataExposed: false' cmd/radar-connector/collector_live_audit_v699.go
          ! grep -Eq 'HandleFunc\("POST /v1/collector/audit' cmd/radar-connector/main.go
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o /tmp/radar-connector-v699 ./cmd/radar-connector
          test -s /tmp/radar-connector-v699
          echo RADAR_V699_COLLECTOR_LIVE_AUDIT=PASS

      - name: Verify read-only scope
        run: |
          set -euo pipefail
          ! grep -REq 'building\.production\.collect|mail\.reward|al\.science\.donate|visitor\.operate|attack|march|purchase' .github/scripts/patch-radar-collector-live-audit-v699.py .radar-release-src/v699-source
          echo RADAR_V699_READONLY=PASS
