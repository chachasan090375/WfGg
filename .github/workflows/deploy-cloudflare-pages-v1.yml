name: Deploy WfGg to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-cloudflare-pages-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wfgg-cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare API token
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -eu
          if [ -z "$CF_API_TOKEN" ]; then
            echo 'MISSING_SECRET=CLOUDFLARE_API_TOKEN'
            exit 2
          fi
          echo 'CLOUDFLARE_API_TOKEN=OK'

      - name: Resolve Cloudflare account for wfgg Pages
        id: cloudflare
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          token = os.environ['CF_API_TOKEN']
          headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.status, r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode('utf-8', 'replace')

          status, body = get('https://api.cloudflare.com/client/v4/accounts?per_page=50')
          if status != 200:
              print(f'CF_ACCOUNTS_HTTP={status}')
              sys.exit(3)
          data = json.loads(body)
          accounts = data.get('result') or []
          print(f'CF_ACCOUNT_COUNT={len(accounts)}')

          found = None
          for account in accounts:
              account_id = account.get('id')
              account_name = account.get('name') or 'unnamed'
              print(f'CF_ACCOUNT={account_name}')
              if not account_id:
                  continue
              p_status, p_body = get(f'https://api.cloudflare.com/client/v4/accounts/{account_id}/pages/projects?per_page=100')
              print(f'CF_PAGES_LIST_HTTP={p_status}')
              if p_status != 200:
                  continue
              try:
                  projects = (json.loads(p_body).get('result') or [])
              except Exception:
                  projects = []
              names = [str(p.get('name')) for p in projects if p.get('name')]
              print('CF_PAGE_PROJECTS=' + (','.join(names) if names else '(none)'))
              if 'wfgg' in names:
                  found = account_id
                  break

          if not found:
              print('CLOUDFLARE_PROJECT_WFGG=NOT_FOUND')
              sys.exit(4)

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'account_id={found}\n')
          print('CLOUDFLARE_PROJECT_WFGG=FOUND')
          PY

      - name: Deploy frontend to wfgg Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cloudflare.outputs.account_id }}
          command: pages deploy frontend --project-name=wfgg --branch=main --commit-dirty=true

      - name: Verify production clean boot asset
        shell: bash
        run: |
          set -eu
          ROOT='https://wfgg.pages.dev'
          ok=0
          for i in $(seq 1 30); do
            curl -fsSL "$ROOT/?deploy_probe=$GITHUB_SHA-$i" -o /tmp/root.html || true
            curl -fsSL "$ROOT/portal-train-cleanboot-v1.js?deploy_probe=$GITHUB_SHA-$i" -o /tmp/cleanboot.js || true
            if grep -Fq 'portal-train-cleanboot-v1.js?v=001' /tmp/root.html \
              && grep -Fq 'WFGG_PORTAL_TRAIN_CLEANBOOT_V1' /tmp/cleanboot.js; then
              echo "WFGG_PAGES_DEPLOY=OK attempt=$i"
              ok=1
              break
            fi
            echo "attempt=$i waiting_for_cleanboot_asset"
            sleep 5
          done
          test "$ok" = 1
