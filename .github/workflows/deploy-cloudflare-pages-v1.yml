name: Deploy WfGg to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-cloudflare-pages-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wfgg-cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare API token
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -eu
          if [ -z "$CF_API_TOKEN" ]; then
            echo 'MISSING_SECRET=CLOUDFLARE_API_TOKEN'
            exit 2
          fi
          echo 'CLOUDFLARE_API_TOKEN=OK'

      - name: Resolve Cloudflare account for wfgg Pages
        id: cloudflare
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H 'Content-Type: application/json' \
            'https://api.cloudflare.com/client/v4/accounts?per_page=50' \
            -o /tmp/cf-accounts.json

          python3 - <<'PY' >/tmp/cf-account-ids.txt
          import json
          d=json.load(open('/tmp/cf-accounts.json'))
          if not d.get('success'):
              raise SystemExit('Cloudflare accounts lookup failed')
          for row in d.get('result') or []:
              if row.get('id'):
                  print(row['id'])
          PY

          found=''
          while IFS= read -r account_id; do
            [ -n "$account_id" ] || continue
            code=$(curl -sS -o /tmp/cf-project.json -w '%{http_code}' \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/$account_id/pages/projects/wfgg")
            if [ "$code" = '200' ] && python3 - <<'PY'
          import json,sys
          try:
              d=json.load(open('/tmp/cf-project.json'))
          except Exception:
              sys.exit(1)
          sys.exit(0 if d.get('success') and (d.get('result') or {}).get('name') == 'wfgg' else 1)
          PY
            then
              found="$account_id"
              break
            fi
          done </tmp/cf-account-ids.txt

          if [ -z "$found" ]; then
            echo 'CLOUDFLARE_PROJECT_WFGG=NOT_FOUND'
            exit 4
          fi

          echo "account_id=$found" >> "$GITHUB_OUTPUT"
          echo 'CLOUDFLARE_PROJECT_WFGG=FOUND'

      - name: Deploy frontend to wfgg Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cloudflare.outputs.account_id }}
          command: pages deploy frontend --project-name=wfgg --branch=main --commit-dirty=true

      - name: Verify production clean boot asset
        shell: bash
        run: |
          set -eu
          ROOT='https://wfgg.pages.dev'
          ok=0
          for i in $(seq 1 30); do
            curl -fsSL "$ROOT/?deploy_probe=$GITHUB_SHA-$i" -o /tmp/root.html || true
            curl -fsSL "$ROOT/portal-train-cleanboot-v1.js?deploy_probe=$GITHUB_SHA-$i" -o /tmp/cleanboot.js || true
            if grep -Fq 'portal-train-cleanboot-v1.js?v=001' /tmp/root.html \
              && grep -Fq 'WFGG_PORTAL_TRAIN_CLEANBOOT_V1' /tmp/cleanboot.js; then
              echo "WFGG_PAGES_DEPLOY=OK attempt=$i"
              ok=1
              break
            fi
            echo "attempt=$i waiting_for_cleanboot_asset"
            sleep 5
          done
          test "$ok" = 1
