name: Deploy WfGg to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-cloudflare-pages-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wfgg-cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          if [ -z "$CF_API_TOKEN" ]; then
            echo 'MISSING_SECRET=CLOUDFLARE_API_TOKEN'
            exit 2
          fi
          if [ -z "$CF_ACCOUNT_ID" ]; then
            echo 'MISSING_SECRET=CLOUDFLARE_ACCOUNT_ID'
            exit 3
          fi
          echo 'CLOUDFLARE_CREDENTIALS=OK'

      - name: Deploy frontend to wfgg Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend --project-name=wfgg --branch=main --commit-dirty=true

      - name: Verify production clean boot asset
        shell: bash
        run: |
          set -eu
          ROOT='https://wfgg.pages.dev'
          ok=0
          for i in $(seq 1 30); do
            curl -fsSL "$ROOT/?deploy_probe=$GITHUB_SHA-$i" -o /tmp/root.html || true
            curl -fsSL "$ROOT/portal-train-cleanboot-v1.js?deploy_probe=$GITHUB_SHA-$i" -o /tmp/cleanboot.js || true
            if grep -Fq 'portal-train-cleanboot-v1.js?v=001' /tmp/root.html \
              && grep -Fq 'WFGG_PORTAL_TRAIN_CLEANBOOT_V1' /tmp/cleanboot.js; then
              echo "WFGG_PAGES_DEPLOY=OK attempt=$i"
              ok=1
              break
            fi
            echo "attempt=$i waiting_for_cleanboot_asset"
            sleep 5
          done
          test "$ok" = 1
