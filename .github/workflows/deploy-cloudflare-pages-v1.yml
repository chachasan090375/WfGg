name: Deploy WfGg to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'scripts/generate-sentinel-source-map-v10.mjs'
      - '.github/workflows/deploy-cloudflare-pages-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wfgg-cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Sentinel source map
        run: |
          node scripts/generate-sentinel-source-map-v10.mjs
          grep -q 'sentinel-portal-source-map-v10' frontend/sentinel-source-map-v10.json
          grep -q "$GITHUB_SHA" frontend/sentinel-source-map-v10.json

      - name: Check Cloudflare API token
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -eu
          if [ -z "$CF_API_TOKEN" ]; then
            echo 'MISSING_SECRET=CLOUDFLARE_API_TOKEN'
            exit 2
          fi
          echo 'CLOUDFLARE_API_TOKEN=OK'

      - name: Resolve Cloudflare account for wfgg Pages
        id: cloudflare
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          token = os.environ['CF_API_TOKEN']
          headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.status, r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode('utf-8', 'replace')

          def safe_errors(body):
              try:
                  data = json.loads(body)
              except Exception:
                  return '(non-json response)'
              out=[]
              for err in data.get('errors') or []:
                  code=err.get('code')
                  message=str(err.get('message') or '')[:240]
                  out.append(f'{code}:{message}')
              return ' | '.join(out) if out else '(none)'

          status, body = get('https://api.cloudflare.com/client/v4/accounts?per_page=50')
          if status != 200:
              print(f'CF_ACCOUNTS_HTTP={status}')
              print('CF_ACCOUNTS_ERRORS=' + safe_errors(body))
              sys.exit(3)
          data = json.loads(body)
          accounts = data.get('result') or []
          print(f'CF_ACCOUNT_COUNT={len(accounts)}')

          found = None
          for account in accounts:
              account_id = account.get('id')
              account_name = account.get('name') or 'unnamed'
              print(f'CF_ACCOUNT={account_name}')
              if not account_id:
                  continue
              p_status, p_body = get(f'https://api.cloudflare.com/client/v4/accounts/{account_id}/pages/projects/wfgg')
              print(f'CF_PAGES_PROJECT_HTTP={p_status}')
              if p_status != 200:
                  print('CF_PAGES_PROJECT_ERRORS=' + safe_errors(p_body))
                  continue
              try:
                  project = json.loads(p_body)
              except Exception:
                  project = {}
              if project.get('success') and (project.get('result') or {}).get('name') == 'wfgg':
                  found = account_id
                  break

          if not found:
              print('CLOUDFLARE_PROJECT_WFGG=NOT_FOUND')
              sys.exit(4)

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'account_id={found}\n')
          print('CLOUDFLARE_PROJECT_WFGG=FOUND')
          PY

      - name: Deploy frontend to wfgg Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cloudflare.outputs.account_id }}
          command: pages deploy frontend --project-name=wfgg --branch=main --commit-dirty=true

      - name: Verify production clean boot and Sentinel source assets
        shell: bash
        run: |
          set -eu
          ROOT='https://wfgg.pages.dev'
          ok=0
          for i in $(seq 1 30); do
            curl -fsSL "$ROOT/?deploy_probe=$GITHUB_SHA-$i" -o /tmp/root.html || true
            curl -fsSL "$ROOT/portal-train-cleanboot-v1.js?deploy_probe=$GITHUB_SHA-$i" -o /tmp/cleanboot.js || true
            curl -fsSL "$ROOT/sentinel-source-map-v10.json?deploy_probe=$GITHUB_SHA-$i" -o /tmp/sentinel-source.json || true
            if grep -Fq 'portal-train-cleanboot-v1.js?v=002-session-bridge' /tmp/root.html \
              && grep -Fq 'WFGG_PORTAL_TRAIN_CLEANBOOT_V2' /tmp/cleanboot.js \
              && grep -Fq 'sentinel-portal-source-map-v10' /tmp/sentinel-source.json \
              && grep -Fq "$GITHUB_SHA" /tmp/sentinel-source.json; then
              echo "WFGG_PAGES_DEPLOY=OK attempt=$i"
              ok=1
              break
            fi
            echo "attempt=$i waiting_for_cleanboot_and_sentinel_source_assets"
            sleep 5
          done
          test "$ok" = 1
