name: Radar V6.19.14 coverage completion qualification

on:
  push:
    branches: [radar-v61914-coverage-completion]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-v61914-coverage-completion
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Reconstruct cumulative V6.19.14 candidate
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar
          mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          echo '234df1dec57f6211bc625855bf13350c9f17fbd843fbe92d8cf1ab7cb5c081ef  /tmp/radar-src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar
          rm -rf /tmp/wfgg-radar/connector-go
          cp -a .radar-release-src/v2-source/connector-go /tmp/wfgg-radar/connector-go

          python3 .github/scripts/patch-radar-target-profile-retry.py
          python3 .github/scripts/patch-radar-federated-diagnostics-v65.py
          python3 .github/scripts/patch-player-scan-v3.py
          python3 .github/scripts/patch-player-scan-v4.py
          python3 .github/scripts/patch-radar-protocol-discovery-v67.py
          python3 .github/scripts/patch-radar-profile-isolation-v68.py
          python3 .github/scripts/patch-radar-native-profile-v69.py
          python3 .github/scripts/patch-radar-native-profile-handshake-v691.py
          python3 .github/scripts/patch-radar-native-profile-exec-v692.py
          python3 .github/scripts/patch-radar-connector-runtime-v693.py
          python3 .github/scripts/patch-radar-cluster-catalog-budget-v6192.py
          python3 .github/scripts/patch-radar-seed-scout-v6193.py
          python3 .github/scripts/patch-radar-autopilot-v6194.py
          python3 .github/scripts/patch-radar-autopilot-stale-cycle-v6197.py
          python3 .github/scripts/patch-radar-collector-cycle-terminalization-v6198.py
          python3 .github/scripts/patch-radar-autopilot-targeted-history-v6199.py
          python3 .github/scripts/patch-radar-autopilot-continue-partial-v61910.py

          install -m 0644 .radar-release-src/v2-source/src/game/remote-transport.js /tmp/wfgg-radar/src/game/remote-transport.js
          python3 .github/scripts/patch-radar-async-collector-worker.py
          python3 .github/scripts/patch-radar-worker-rich-profile-v6191.py
          python3 .github/scripts/patch-radar-worker-seed-scout-v6193.py
          python3 .github/scripts/patch-radar-worker-autopilot-v6194.py

          install -m 0644 radar-ui-live/live-radar.html /tmp/wfgg-radar/public/live-radar.html
          python3 .github/scripts/patch-live-radar-seed-scout-v6193.py
          python3 .github/scripts/patch-live-radar-autopilot-v6194.py
          python3 .github/scripts/patch-radar-session-keepalive-v6195.py
          python3 .github/scripts/patch-live-radar-autopilot-v6196.py
          python3 .github/scripts/patch-live-radar-autopilot-v6197.py
          python3 .github/scripts/patch-live-radar-autopilot-v6198.py
          python3 .github/scripts/patch-live-radar-autopilot-v6199.py
          python3 .github/scripts/patch-live-radar-autopilot-v61910.py

          python3 .github/scripts/patch-radar-manual-search-stop-v61911.py
          python3 .github/scripts/patch-radar-autopilot-no-rescan-qualified-v61912.py
          python3 .github/scripts/patch-live-radar-autopilot-v61912.py
          python3 .github/scripts/patch-radar-autopilot-persistent-ledger-v61913.py
          python3 .github/scripts/patch-live-radar-autopilot-v61913.py
          python3 .github/scripts/patch-radar-autopilot-coverage-completion-v61914.py
          python3 .github/scripts/patch-live-radar-autopilot-v61914.py

          grep -Fq 'WFGG_RADAR_AUTOPILOT_COVERAGE_COMPLETION_V61914' /tmp/wfgg-radar/connector-go/cmd/radar-connector/server_autopilot_v6194.go
          grep -Fq 'WFGG_RADAR_AUTOPILOT_COVERAGE_COMPLETION_UI_V61914' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'WFGG_RADAR_AUTOPILOT_PERSISTENT_LEDGER_V61913' /tmp/wfgg-radar/connector-go/cmd/radar-connector/server_autopilot_v6194.go
          grep -Fq 'WFGG_RADAR_AUTOPILOT_NO_RESCAN_QUALIFIED_V61912' /tmp/wfgg-radar/connector-go/cmd/radar-connector/server_autopilot_v6194.go
          grep -Fq 'WFGG_RADAR_MANUAL_SEARCH_STOP_V61911' /tmp/wfgg-radar/connector-go/cmd/radar-connector/collector_jobs.go
          echo RADAR_V61914_RECONSTRUCT=PASS

      - name: Qualify coverage completion semantics
        working-directory: /tmp/wfgg-radar/connector-go
        run: |
          set -euo pipefail
          gofmt -w ./cmd ./internal
          go test ./...
          go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o /tmp/radar-connector ./cmd/radar-connector

          grep -aFq 'v6.19.14' /tmp/radar-connector
          grep -aFq 'COVERAGE_COMPLETE' /tmp/radar-connector
          grep -aFq 'COVERAGE_FRONTIER_CONTINUE' /tmp/radar-connector
          grep -aFq 'SEED_SCOUT_FRONTIER_EXHAUSTED' /tmp/radar-connector
          grep -aFq 'AUTOPILOT_COVERAGE_MAX_CLUSTERS_CONFLICT_V61914' /tmp/radar-connector
          grep -aFq 'radar_autopilot_ledger_v61913' /tmp/radar-connector
          grep -aFq 'MANUAL_SEARCH_STOPPED' /tmp/radar-connector

          A=/tmp/wfgg-radar/connector-go/cmd/radar-connector/server_autopilot_v6194.go
          grep -Fq 'offset := autopilotScoutStartOffsetV61914(job)' "$A"
          grep -Fq 'autopilotReachedClusterLimitV61914(job)' "$A"
          grep -Fq 'autopilotContinueCoverageWindowV61914(jobID)' "$A"
          grep -Fq 'autopilotCompleteCoverageV61914(jobID, "SEED_SCOUT_FRONTIER_EXHAUSTED")' "$A"
          grep -Fq 'CoverageMode:            coverageMode' "$A"

          echo "RADAR_V61914_CONNECTOR_SHA256=$(sha256sum /tmp/radar-connector | awk '{print $1}')"
          echo RADAR_V61914_COVERAGE_SEMANTICS=PASS
          echo RADAR_V61914_CONNECTOR_QUALIFIED=PASS

      - name: Verify coverage state-machine tests
        working-directory: /tmp/wfgg-radar/connector-go
        run: |
          set -euo pipefail
          go test ./cmd/radar-connector -run 'V61914$' -count=1 -v | tee /tmp/v61914-tests.log
          grep -Fq -- '--- PASS: TestAutopilotCoverageIgnoresClusterCeilingV61914' /tmp/v61914-tests.log
          grep -Fq -- '--- PASS: TestAutopilotCoverageScoutOffsetV61914' /tmp/v61914-tests.log
          grep -Fq -- '--- PASS: TestAutopilotCoverageWindowAndCompletionV61914' /tmp/v61914-tests.log
          echo RADAR_V61914_CLUSTER_CAP_REMOVED_IN_COVERAGE=PASS
          echo RADAR_V61914_SCOUT_WINDOW_CONTINUATION=PASS
          echo RADAR_V61914_TRUE_EXHAUSTION_COMPLETION=PASS

      - name: Verify Last War and token safety
        run: |
          set -euo pipefail
          P=.github/scripts/patch-radar-autopilot-coverage-completion-v61914.py
          ! grep -Fq 'ScanPlayerRegionDiagnosticOnServer' "$P"
          ! grep -Fq 'runCollectorSearch' "$P"
          ! grep -REiq 'localStorage.*token|sessionStorage.*token|INSERT.*token|token.*INSERT|access_token' "$P"
          ! grep -REiq 'building\.production\.collect|mail\.reward|al\.science\.donate|visitor\.operate|march|attack|purchase' "$P"
          echo RADAR_V61914_QUALIFICATION_GAME_SCAN=NO
          echo RADAR_V61914_LASTWAR_MODE=READ_ONLY
          echo RADAR_V61914_TOKEN_PERSISTENCE=NO
          echo RADAR_V61914_COLLECTOR_MUTATION=NO_NEW_MUTATION_CLASS

      - name: Qualify UI and regression guards
        run: |
          set -euo pipefail
          U=/tmp/wfgg-radar/public/live-radar.html
          A=/tmp/wfgg-radar/connector-go/cmd/radar-connector/server_autopilot_v6194.go
          C=/tmp/wfgg-radar/connector-go/cmd/radar-connector/collector_jobs.go
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('/tmp/wfgg-radar/public/live-radar.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',h,re.S)
          if not m:
              raise SystemExit('LIVE_RADAR_SCRIPT_MISSING')
          Path('/tmp/live-radar-v61914.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/live-radar-v61914.js
          grep -Fq 'AUTOPILOT V6.19.14 · ARRÊTÉ' "$U"
          grep -Fq 'coverageMode:true' "$U"
          grep -Fq 'COUVERTURE TERMINÉE' "$U"
          grep -Fq 'COVERAGE_FRONTIER_CONTINUE' "$U"
          grep -Fq 'WFGG_RADAR_AUTOPILOT_PERSISTENT_LEDGER_UI_V61913' "$U"
          grep -Fq 'WFGG_RADAR_AUTOPILOT_NO_RESCAN_QUALIFIED_UI_V61912' "$U"
          grep -Fq 'WFGG_RADAR_MANUAL_SEARCH_STOP_UI_V61911' "$U"
          grep -Fq 'context.WithTimeout(parentCtx, 12*time.Minute)' "$C"
          grep -Fq 's.runCollectorSearch(context.Background(), child.ID, token, command)' "$A"
          grep -Fq 'MANUAL_SEARCH_STOPPED' "$C"
          echo "RADAR_V61914_UI_SHA256=$(sha256sum "$U" | awk '{print $1}')"
          echo RADAR_V61914_REGRESSION_GUARDS=PASS
