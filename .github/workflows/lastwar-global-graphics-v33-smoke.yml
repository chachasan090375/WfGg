name: Last War Global Graphics V33 smoke

on:
  push:
    branches: [lab-global-graphics-catalog-v33]
  workflow_dispatch:

jobs:
  v33:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: |
          python -m py_compile \
            scripts/lastwar-global-graphics-catalog-v31.py \
            scripts/lastwar-global-graphics-scope-enrich-v31.py \
            scripts/lastwar-global-graphics-scope-correct-v31.py \
            scripts/lastwar-global-graphics-hierarchy-v31.py \
            scripts/lastwar-global-graphics-enrich-v32.py \
            scripts/lastwar-event-graph-crosswalk-v32.py \
            scripts/lastwar-global-graphics-server-v32.py \
            scripts/lastwar-global-graphics-enrich-v33.py \
            scripts/lastwar-global-graphics-dimension-correct-v33.py \
            scripts/lastwar-global-graphics-render-availability-v33.py \
            scripts/lastwar-global-graphics-dependencies-v33.py \
            scripts/lastwar-global-graphics-android-codec-v33.py \
            scripts/lastwar-global-graphics-server-v33.py \
            scripts/lastwar-global-graphics-server-v33-resolved.py \
            scripts/lastwar-global-graphics-server-v33-exact.py
      - name: Check viewer JavaScript
        run: |
          node --check frontend/lab/global-graphics-v33/model-viewer-v33.js
          python - <<'PY'
          import re
          from pathlib import Path
          h=Path('frontend/lab/lastwar-global-graphics-viewer-v33.html').read_text('utf-8')
          inline=[]
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',h,re.S|re.I):
              if 'src=' not in attrs.lower() and body.strip():inline.append(body)
          Path('/tmp/v33-inline.js').write_text('\n'.join(inline),'utf-8')
          print('V33_INLINE_SCRIPTS',len(inline))
          PY
          node --check /tmp/v33-inline.js
      - name: Build catalog dimensionality render availability and dependencies
        run: |
          python scripts/lastwar-global-graphics-catalog-v31.py "$GITHUB_WORKSPACE"
          python scripts/lastwar-global-graphics-scope-enrich-v31.py "$GITHUB_WORKSPACE"
          python scripts/lastwar-global-graphics-scope-correct-v31.py "$GITHUB_WORKSPACE"
          python scripts/lastwar-global-graphics-hierarchy-v31.py "$GITHUB_WORKSPACE"
          python scripts/lastwar-global-graphics-enrich-v32.py "$GITHUB_WORKSPACE"
          python scripts/lastwar-global-graphics-enrich-v33.py "$GITHUB_WORKSPACE"
          python scripts/lastwar-global-graphics-dimension-correct-v33.py "$GITHUB_WORKSPACE"
          python scripts/lastwar-global-graphics-render-availability-v33.py "$GITHUB_WORKSPACE"
          python scripts/lastwar-global-graphics-dependencies-v33.py "$GITHUB_WORKSPACE"
      - name: Assert V33 contract
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db=Path.home()/'.cache/wfgg-lastwar-v31/graphics-catalog-v31.sqlite3'
          con=sqlite3.connect(db)
          n=con.execute('select count(*) from assets').fetchone()[0]
          dims=dict(con.execute('select dimension_class,count(*) from assets group by dimension_class'))
          roles=dict(con.execute('select model_role,count(*) from assets group by model_role'))
          avail=dict(con.execute('select render_availability,count(*) from assets group by render_availability'))
          dep_edges=con.execute('select count(*) from bundle_dependencies_v33').fetchone()[0]
          tank0_deps=[r[0] for r in con.execute('select target_bundle_id from bundle_dependencies_v33 where source_bundle_id=2039 order by ordinal')]
          assert n==107247,n
          assert sum(dims.values())==n,dims
          assert sum(avail.values())==n,avail
          assert dims.get('2D',0)>1000,dims
          assert dims.get('3D',0)>0,dims
          assert dims.get('Composant 3D',0)>0,dims
          assert roles.get('geometry',0)>0,roles
          assert roles.get('texture',0)>0,roles
          assert avail.get('local-exact',0)>0,avail
          assert avail.get('global-index-only',0)>0,avail
          assert dep_edges>1000,dep_edges
          assert 23464 in tank0_deps,tank0_deps
          assert len(tank0_deps)>=20,tank0_deps
          assert con.execute("select count(*) from assets where dependency_count>0").fetchone()[0]>1000
          assert con.execute("select count(*) from assets where render_availability in ('local-exact','local-resolved') and render_source_stable_id is not null").fetchone()[0]>0
          assert con.execute("select count(*) from assets where asset_folder<>''").fetchone()[0]>50000
          assert con.execute("select count(*) from facets where axis='dimension_class'").fetchone()[0]>=4
          assert con.execute("select count(*) from facets where axis='render_availability'").fetchone()[0]>=2
          bad2d=con.execute("select count(*) from assets where lower(asset_path) like '%.prefab' and dimension_class='2D'").fetchone()[0]
          badgraphic=con.execute("select count(*) from assets where lower(asset_path) like '%.prefab' and graphic_class='Graphique'").fetchone()[0]
          assert bad2d==0,bad2d
          assert badgraphic==0,badgraphic
          print('V33_SMOKE_OK assets=',n,'dimensions=',dims,'roles=',roles,'availability=',avail,'depEdges=',dep_edges,'tank0Deps=',len(tank0_deps),'prefab2d=',bad2d,'prefabGraphic=',badgraphic)
          con.close()
          PY
      - name: Validate viewer and renderer contract
        run: |
          grep -q 'id="render_availability"' frontend/lab/lastwar-global-graphics-viewer-v33.html
          grep -q 'local-renderable' frontend/lab/lastwar-global-graphics-viewer-v33.html
          grep -q 'id="dimension_class"' frontend/lab/lastwar-global-graphics-viewer-v33.html
          grep -q 'id="graphic_class"' frontend/lab/lastwar-global-graphics-viewer-v33.html
          grep -q 'model-viewer-v33.js' frontend/lab/lastwar-global-graphics-viewer-v33.html
          grep -q '/api/v33/model' scripts/lastwar-global-graphics-server-v33.py
          grep -q 'availability-map' scripts/lastwar-global-graphics-server-v33-resolved.py
          grep -q 'global-index-only' scripts/lastwar-global-graphics-server-v33-resolved.py
          grep -q 'bundle_dependencies_v33' scripts/lastwar-global-graphics-server-v33-exact.py
          grep -q 'android-direct' scripts/lastwar-global-graphics-server-v33-exact.py
          grep -q 'MeshHandler' scripts/lastwar-global-graphics-android-codec-v33.py
          grep -q 'decode_astc' scripts/lastwar-global-graphics-android-codec-v33.py
          grep -q 'lastwar-global-graphics-server-v33-exact.py' scripts/lastwar-global-graphics-v33.sh
