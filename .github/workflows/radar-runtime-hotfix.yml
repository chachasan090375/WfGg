name: Radar runtime hotfix

on:
  push:
    branches: [radar-production-v1]
    paths:
      - '.github/workflows/radar-runtime-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wfgg-radar-runtime-hotfix
  cancel-in-progress: false

env:
  RADAR_D1_NAME: wfgg-radar
  RADAR_CONNECTOR_URL: https://chachavps.tail3ab05a.ts.net

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct canonical Radar V0.5
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar
          mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          echo '234df1dec57f6211bc625855bf13350c9f17fbd843fbe92d8cf1ab7cb5c081ef  /tmp/radar-src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar

      - name: Apply runtime auth and indexing hotfixes
        working-directory: /tmp/wfgg-radar
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # 1) Keep async authentication failures inside the Worker try/catch.
          p = Path('src/worker.js')
          s = p.read_text()
          old = "if (url.pathname === '/api/auth/game-token' && request.method === 'POST') return authenticateGameToken(request, env);"
          new = "if (url.pathname === '/api/auth/game-token' && request.method === 'POST') return await authenticateGameToken(request, env);"
          if new not in s:
              if old not in s:
                  raise SystemExit('AUTH_AWAIT_HOTFIX_TARGET_NOT_FOUND')
              s = s.replace(old, new, 1)
              p.write_text(s)
          print('AUTH_ASYNC_REJECTION_CONTAINMENT=OK')

          # 2) Cloudflare Workers native fetch is receiver-sensitive. Do not store
          #    the raw global fetch function and later invoke it as this.fetchImpl().
          p = Path('src/game/remote-transport.js')
          s = p.read_text()
          old = "constructor({ baseUrl, sharedKey, timeoutMs = 65000, fetchImpl = fetch } = {}) {"
          new = "constructor({ baseUrl, sharedKey, timeoutMs = 65000, fetchImpl = (...args) => globalThis.fetch(...args) } = {}) {"
          if new not in s:
              if old not in s:
                  raise SystemExit('FETCH_BINDING_HOTFIX_TARGET_NOT_FOUND')
              s = s.replace(old, new, 1)
              p.write_text(s)
          print('REMOTE_FETCH_RECEIVER_BINDING=OK')

          # 3) Safe one-time owner bootstrap: when Radar has no OWNER grant yet,
          #    the first identity successfully certified by the Last War connector
          #    becomes OWNER. Once an OWNER exists, normal grants are required.
          p = Path('src/db/repository.js')
          s = p.read_text()
          old = """export async function ensureBootstrapOwnerGrant(env, identity) {
            const configured = normalizePseudo(env?.RADAR_OWNER_PSEUDO || '');
            if (!configured || configured !== normalizePseudo(identity?.pseudo || '')) return null;
            const bound = await getGrantByBoundUid(env, identity.gameUid);
            if (bound) return bound;
            const byPseudo = await getGrantByPseudo(env, identity.pseudo);
            if (byPseudo) return byPseudo;
            return upsertGrant(env, { pseudo: identity.pseudo, role: ROLES.OWNER, active: true, actorUid: null });
          }"""
          new = """export async function ensureBootstrapOwnerGrant(env, identity) {
            const rawConfigured = String(env?.RADAR_OWNER_PSEUDO || '');
            const configured = normalizePseudo(rawConfigured);
            const identityPseudo = normalizePseudo(identity?.pseudo || '');
            if (!identityPseudo) return null;

            const bound = await getGrantByBoundUid(env, identity.gameUid);
            if (bound) return bound;
            const byPseudo = await getGrantByPseudo(env, identity.pseudo);
            if (byPseudo) return byPseudo;

            if (rawConfigured === '__AUTO_BOOTSTRAP_FIRST_VALID__') {
              const existingOwner = await requireDb(env)
                .prepare('SELECT pseudo_key FROM access_grants WHERE role = ? AND active = 1 LIMIT 1')
                .bind(ROLES.OWNER)
                .first();
              if (existingOwner) return null;
              return upsertGrant(env, { pseudo: identity.pseudo, role: ROLES.OWNER, active: true, actorUid: null });
            }

            if (!configured || configured !== identityPseudo) return null;
            return upsertGrant(env, { pseudo: identity.pseudo, role: ROLES.OWNER, active: true, actorUid: null });
          }"""
          if new not in s:
              if old not in s:
                  raise SystemExit('OWNER_BOOTSTRAP_HOTFIX_TARGET_NOT_FOUND')
              s = s.replace(old, new, 1)
              p.write_text(s)
          print('OWNER_FIRST_VALID_BOOTSTRAP=OK')

          # 4) Project every certified live snapshot identity into the searchable
          #    Radar observation index. Raw evidence remains stored separately in
          #    game_observation_*; this is only a normalized READONLY projection.
          p = Path('src/db/repository.js')
          s = p.read_text()
          anchor = """export async function saveCredential(env, gameUid, encrypted) {"""
          projection = """export async function saveRadarIdentityObservation(env, { identity = null, session = null, batchId = null, observedAt = null } = {}) {
            const gameUid = String(identity?.gameUid || '').trim();
            const pseudo = String(identity?.pseudo || '').trim();
            if (!gameUid || !pseudo) return null;
            const ts = observedAt || nowIso();
            const serverId = identity?.serverId || session?.serverId || null;
            const rawRef = batchId ? `game_observation_batch:${batchId}` : null;
            await requireDb(env).prepare(`
              INSERT INTO radar_observations(
                subject_uid, pseudo, server_id, alliance_id, alliance_tag,
                x, y, hq_level, power, shield_state,
                observed_at, source_command, raw_ref
              ) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?)
            `).bind(
              gameUid, pseudo, serverId ? String(serverId) : null, null, null,
              null, null, null, null, null,
              ts, 'oracle.live-snapshot.identity', rawRef
            ).run();
            return { subjectUid: gameUid, pseudo, serverId: serverId ? String(serverId) : null, observedAt: ts, rawRef };
          }

          """
          if 'export async function saveRadarIdentityObservation' not in s:
              if anchor not in s:
                  raise SystemExit('RADAR_IDENTITY_PROJECTION_ANCHOR_NOT_FOUND')
              s = s.replace(anchor, projection + anchor, 1)
              p.write_text(s)
          print('RADAR_IDENTITY_PROJECTION=OK')

          p = Path('src/worker.js')
          s = p.read_text()
          old_import = "import { bindIdentityToGrant, ensureBootstrapOwnerGrant, getCredential, listGrants, listUsers, saveCredential, saveObservedSnapshot, upsertGrant, audit } from './db/repository.js';"
          new_import = "import { bindIdentityToGrant, ensureBootstrapOwnerGrant, getCredential, listGrants, listUsers, saveCredential, saveObservedSnapshot, saveRadarIdentityObservation, upsertGrant, audit } from './db/repository.js';"
          if new_import not in s:
              if old_import not in s:
                  raise SystemExit('RADAR_IDENTITY_PROJECTION_IMPORT_NOT_FOUND')
              s = s.replace(old_import, new_import, 1)

          old_capture = """          const stored = await saveObservedSnapshot(env, session.gameUid, snapshot);
          await audit(env, session.gameUid, 'oracle.live-snapshot.capture', session.gameUid, { batchId: stored.batchId, observations: stored.observationCount, source: snapshot.source || null });"""
          new_capture = """          const stored = await saveObservedSnapshot(env, session.gameUid, snapshot);
          const indexedIdentity = await saveRadarIdentityObservation(env, {
            identity: snapshot.identity || null,
            session: snapshot.session || null,
            batchId: stored.batchId,
            observedAt: stored.observedAt
          });
          await audit(env, session.gameUid, 'oracle.live-snapshot.capture', session.gameUid, { batchId: stored.batchId, observations: stored.observationCount, indexedIdentity: Boolean(indexedIdentity), source: snapshot.source || null });"""
          if new_capture not in s:
              if old_capture not in s:
                  raise SystemExit('RADAR_IDENTITY_PROJECTION_CAPTURE_NOT_FOUND')
              s = s.replace(old_capture, new_capture, 1)
          p.write_text(s)
          print('RADAR_CAPTURE_TO_SEARCH_INDEX=OK')
          PY
          node --check src/worker.js
          node --check src/game/remote-transport.js
          node --check src/db/repository.js
          grep -Fq "return await authenticateGameToken(request, env);" src/worker.js
          grep -Fq "fetchImpl = (...args) => globalThis.fetch(...args)" src/game/remote-transport.js
          grep -Fq "__AUTO_BOOTSTRAP_FIRST_VALID__" src/db/repository.js
          grep -Fq "saveRadarIdentityObservation" src/worker.js
          grep -Fq "INSERT INTO radar_observations" src/db/repository.js

      - name: Run Guardian regression gate
        working-directory: /tmp/wfgg-radar
        run: |
          set -euo pipefail
          npm test
          npm run check

      - name: Resolve Cloudflare context
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 .github/scripts/resolve-cloudflare-context.py

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Resolve Radar D1
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          p = subprocess.run(['wrangler','d1','list','--json'], text=True, capture_output=True)
          if p.returncode:
              print(p.stdout); print(p.stderr); raise SystemExit(p.returncode)
          rows = json.loads(p.stdout)
          found = next((x for x in rows if x.get('name') == os.environ['RADAR_D1_NAME']), None)
          if not found or not found.get('uuid'):
              raise SystemExit('RADAR_D1_NOT_FOUND')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('database_id=' + found['uuid'] + '\n')
          print('RADAR_D1=OK')
          PY

      - name: Generate production configuration
        env:
          D1_ID: ${{ steps.d1.outputs.database_id }}
        working-directory: /tmp/wfgg-radar
        run: |
          cat > wrangler.toml <<EOF
          name = "wfgg-radar"
          main = "src/worker.js"
          compatibility_date = "2026-09-10"
          workers_dev = true

          [assets]
          directory = "./public"
          binding = "ASSETS"
          run_worker_first = ["/api/*"]

          [[d1_databases]]
          binding = "DB"
          database_name = "wfgg-radar"
          database_id = "$D1_ID"

          [vars]
          RADAR_SESSION_TTL = "3600"
          RADAR_OWNER_PSEUDO = "__AUTO_BOOTSTRAP_FIRST_VALID__"
          RADAR_CONNECTOR_URL = "$RADAR_CONNECTOR_URL"

          [triggers]
          crons = ["*/5 * * * *"]
          EOF

      - name: Deploy contained Radar Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        working-directory: /tmp/wfgg-radar
        run: wrangler deploy

      - name: Verify runtime surface
        env:
          RADAR_URL: https://wfgg-radar.${{ steps.cf.outputs.subdomain }}.workers.dev
        run: |
          set -euo pipefail
          curl -fsSL "$RADAR_URL/api/health?hotfix=$GITHUB_SHA" -o /tmp/health.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get('ok') is True
          assert d.get('app') == 'wfgg-radar'
          assert d.get('version') == '0.5.0'
          assert d.get('gameConnector') == 'configured'
          print('RADAR_RUNTIME_HOTFIX=OK')
          PY

      - name: Guardian auth transport smoke test
        env:
          RADAR_URL: https://wfgg-radar.${{ steps.cf.outputs.subdomain }}.workers.dev
        run: |
          set -euo pipefail
          body="$(printf '{\"token\":\"guardian-invalid-token-%s\"}' "$GITHUB_RUN_ID")"
          code="$(curl -sS --max-time 75 -o /tmp/auth-smoke.txt -w '%{http_code}' \
            -H 'content-type: application/json' \
            -H 'accept: application/json' \
            -H 'user-agent: Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36' \
            --data "$body" \
            "$RADAR_URL/api/auth/game-token")"
          echo "AUTH_SMOKE_HTTP=$code"
          python3 - <<'PY'
          import json
          raw=open('/tmp/auth-smoke.txt',encoding='utf-8',errors='replace').read()
          assert 'Illegal invocation' not in raw, raw[:300]
          assert 'error code: 1101' not in raw, raw[:300]
          try:
              data=json.loads(raw)
          except Exception:
              raise SystemExit('AUTH_SMOKE_NON_JSON=' + raw[:300])
          assert isinstance(data, dict)
          assert data.get('error') or data.get('ok') is True
          print('AUTH_TRANSPORT_RECEIVER=OK')
          print('AUTH_SMOKE_JSON=OK')
          PY
