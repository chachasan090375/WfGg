name: Portal Last War chat safe v22

on:
  push:
    branches: [portal-lastwar-chat-safe-v22]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lastwar-chat-safe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portal-lastwar-chat-safe-v22

      - name: Apply Last War safe patch
        run: python .github/scripts/portal_lastwar_chat_safe_v22_patch.py

      - name: Validate sources
        run: |
          node --check frontend/portal-invitations-lastwar-safe-v1.js
          node --check .github/qa/portal-invitations-recette.mjs
          grep -q 'portal-invitations-lastwar-safe-v1.js?v=001' frontend/index.html
          grep -q 'WFGG_LASTWAR_CHAT_SAFE_V1' frontend/portal-invitations-lastwar-safe-v1.js
          grep -q 'MAX_CHARS=240' frontend/portal-invitations-lastwar-safe-v1.js

      - name: Build XLSX fixture
        shell: python
        run: |
          import zipfile, html
          rows=[('Pseudo','Rang','Code personnel'),('Alpha R4','R4','111111'),('Bravo R3','R3','222222'),('Charlie R5','R5','333333')]
          def cell(ref,val): return f'<c r="{ref}" t="inlineStr"><is><t>{html.escape(val)}</t></is></c>'
          xmlrows=[]
          for i,row in enumerate(rows,1):
            xmlrows.append(f'<row r="{i}">'+''.join(cell(f'{chr(65+j)}{i}',v) for j,v in enumerate(row))+'</row>')
          sheet='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+''.join(xmlrows)+'</sheetData></worksheet>'
          workbook='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Joueurs" sheetId="1" r:id="rId1"/></sheets></workbook>'
          rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>'
          types='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'
          rootrels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'
          with zipfile.ZipFile('/tmp/qa-members.xlsx','w',zipfile.ZIP_DEFLATED) as z:
            z.writestr('[Content_Types].xml',types);z.writestr('_rels/.rels',rootrels);z.writestr('xl/workbook.xml',workbook);z.writestr('xl/_rels/workbook.xml.rels',rels);z.writestr('xl/worksheets/sheet1.xml',sheet)

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local portal
        run: |
          python3 -m http.server 4173 --directory frontend >/tmp/portal.log 2>&1 &
          echo $! >/tmp/portal.pid
          sleep 2

      - name: Run invitation browser recette
        env:
          WFGG_PREVIEW: http://127.0.0.1:4173
          WFGG_XLSX_FIXTURE: /tmp/qa-members.xlsx
        run: node .github/qa/portal-invitations-recette.mjs

      - name: Commit tested files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/index.html .github/qa/portal-invitations-recette.mjs
          git commit -m 'Portail v22: activer les blocs de chat Last War sûrs'
          git push origin HEAD:portal-lastwar-chat-safe-v22
