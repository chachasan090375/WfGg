name: WfGg direct Train bridge smoke

on:
  push:
    branches:
      - train-bridge-phase3

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify CORS and Portal context hop
        shell: bash
        run: |
          set -euo pipefail
          TRAIN='https://portal-auth-phase1-wfgg-train.chachasan090375.workers.dev'

          echo '=== CORS PREFLIGHT ==='
          curl -sS -D /tmp/preflight.headers -o /dev/null -X OPTIONS \
            -H 'Origin: https://train-bridge-phase3.wfgg.pages.dev' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: X-WfGg-Portal-Token' \
            "$TRAIN/api/snapshot"
          cat /tmp/preflight.headers
          grep -qi '^HTTP/.* 204' /tmp/preflight.headers
          grep -qi 'access-control-allow-headers:.*x-wfgg-portal-token' /tmp/preflight.headers
          echo 'TRAIN_CORS=OK'

          echo '=== PORTAL CONTEXT HOP ==='
          status="$(curl -sS -o /tmp/body.json -w '%{http_code}' \
            -H 'X-WfGg-Portal-Token: wfgg-intentional-invalid-smoke-token' \
            "$TRAIN/api/snapshot")"
          cat /tmp/body.json
          echo
          echo "STATUS=$status"
          test "$status" = '401'
          echo 'TRAIN_TO_PORTAL_API=OK'
