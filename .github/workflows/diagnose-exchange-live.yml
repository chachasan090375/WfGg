name: Diagnose live exchange

on:
  push:
    branches: [exchange-diagnosis]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Capture production Train app
        shell: bash
        run: |
          set -eu
          curl -fsSL -A 'Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/139 Mobile Safari/537.36' \
            'https://wfgg.pages.dev/train/app.js?wfgg_bridge=v13&exchange_diag=3' \
            -o /tmp/app.js
          node --check /tmp/app.js
      - name: Print schedule code contexts
        shell: python
        run: |
          from pathlib import Path
          s=Path('/tmp/app.js').read_text(encoding='utf-8')
          terms=['function schedule','function roleKey','function myAssignments','function findAssignment','function pickFair','r3Cycle','cycleDrivers','cycleVips','driverClass']
          for term in terms:
              print('\n===== '+term+' =====')
              start=0; hits=0
              while hits<8:
                  i=s.find(term,start)
                  if i<0: break
                  a=max(0,i-1800); b=min(len(s),i+6500)
                  print(s[a:b]); print('\n--- HIT END ---')
                  hits+=1; start=i+len(term)
              if hits==0: print('NO_HIT')
