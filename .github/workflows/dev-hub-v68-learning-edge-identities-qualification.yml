name: ChaCha DEV V6.8 learning edge and identities qualification
on:
  push:
    branches: [dev-hub-v68-learning-edge-identities]
    paths:
      - 'dev-hub/bin/learning-identity-provisioner.py'
      - 'dev-hub/bin/install-learning-edge-cloudflare.sh'
      - 'dev-hub/systemd/chacha-dev-learning-edge-cloudflared.service'
      - 'dev-hub/config/learning-edge.v1.json'
      - 'dev-hub/evidence/technology-watch-learning-edge-v68.json'
      - 'dev-hub/tests/test_v68_learning_edge_identities.py'
      - '.github/workflows/dev-hub-v68-learning-edge-identities-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: dev-hub-v68-learning-edge-identities}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Static validation
        run: |
          set -euo pipefail
          python3 -m py_compile dev-hub/bin/learning-identity-provisioner.py
          bash -n dev-hub/bin/install-learning-edge-cloudflare.sh
          python3 -m json.tool dev-hub/config/learning-edge.v1.json >/dev/null
          python3 -m json.tool dev-hub/evidence/technology-watch-learning-edge-v68.json >/dev/null
          echo CHACHA_DEV_V68_STATIC=PASS
      - name: Identity and edge contracts
        run: |
          set -euo pipefail
          python3 dev-hub/tests/test_v68_learning_edge_identities.py
      - name: Platform invariants
        run: |
          set -euo pipefail
          grep -Fq -- '--token-file /opt/chacha-dev/runtime/secrets/learning-ingress-tunnel.token' dev-hub/systemd/chacha-dev-learning-edge-cloudflared.service
          ! grep -Fq -- '--token ' dev-hub/systemd/chacha-dev-learning-edge-cloudflared.service
          grep -Fq '"app_specific": false' dev-hub/config/learning-edge.v1.json
          grep -Fq '"central_ingress_remains_loopback_only": true' dev-hub/config/learning-edge.v1.json
          ! grep -Eiq 'last war|rotation|radar|train app' dev-hub/bin/learning-identity-provisioner.py dev-hub/config/learning-edge.v1.json
          echo CHACHA_DEV_V68_PLATFORM_GLOBAL_EDGE=PASS
      - name: Qualification receipt
        run: |
          {
            echo CHACHA_DEV_LEARNING_EDGE=V6.8
            echo RESULT=success
            echo SOURCE_REV="$(git rev-parse HEAD)"
            echo SCOPE=PLATFORM_GLOBAL
            echo SELECTED_EDGE=CLOUDFLARE_TUNNEL
            echo ORIGIN_CONNECTION=OUTBOUND_ONLY
            echo DIRECT_PUBLIC_VPS_PORT=NO
            echo TLS=EDGE_MANAGED_HTTPS
            echo PER_DEPLOYMENT_IDENTITIES=YES
            echo SECRET_IN_REPOSITORY=NO
            echo TOKEN_IN_PROCESS_ARGS=NO
            echo KEY_REVOCATION=YES
            echo AUTOMATIC_EXTERNAL_SPEND_EUR=0
          } | tee /tmp/CHACHA_DEV_V68_RECEIPT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: chacha-dev-v68-learning-edge-identities
          path: /tmp/CHACHA_DEV_V68_RECEIPT.txt
          retention-days: 30
