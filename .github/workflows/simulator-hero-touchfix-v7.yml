name: Simulator hero touchfix v7

on:
  push:
    branches:
      - simulator-standalone-v1
    paths:
      - '.github/workflows/simulator-hero-touchfix-v7.yml'

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simulator-standalone-v1
          fetch-depth: 0
      - name: Wire v7 stylesheet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          link='  <link rel="stylesheet" href="hero-sheet-touchfix-v7.css?v=007-hitbox" />\n'
          for name in ('simulator/index.html','frontend/simulator/index.html'):
              p=Path(name);s=p.read_text(encoding='utf-8')
              if 'hero-sheet-touchfix-v7.css' not in s:
                  marker='  <link rel="stylesheet" href="hero-roster-game-v6.css?v=006-game-roster" />\n'
                  if marker not in s: raise SystemExit(f'v6 marker missing in {name}')
                  s=s.replace(marker,marker+link,1)
              p.write_text(s,encoding='utf-8')
          Path('simulator/UI_VERSION.txt').write_text('HERO_ROSTER_V7_TOUCHFIX\n31 local portraits / UR SSR SR / tabs and close touch-safe\n2026-08-26\n',encoding='utf-8')
          PY
          grep -Fq 'hero-sheet-touchfix-v7.css?v=007-hitbox' simulator/index.html
          grep -Fq 'hero-sheet-touchfix-v7.css?v=007-hitbox' frontend/simulator/index.html
      - name: Commit v7 wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulator/index.html frontend/simulator/index.html simulator/UI_VERSION.txt
          git diff --cached --check
          git commit -m 'simulator: enable hero sheet touchfix v7'
          git push origin HEAD:simulator-standalone-v1
      - name: Verify public v7 assets
        shell: bash
        run: |
          set -euo pipefail
          ROOT='https://simulator-standalone-v1.wfgg.pages.dev/simulator'
          for i in $(seq 1 40); do
            curl -fsSL "$ROOT/?touchfix_v7=$i" -o /tmp/index.html || true
            if grep -Fq 'hero-sheet-touchfix-v7.css?v=007-hitbox' /tmp/index.html && curl -fsSL "$ROOT/hero-sheet-touchfix-v7.css?v=007-hitbox&n=$i" | grep -Fq 'z-index:80'; then
              echo "HERO_TOUCHFIX_V7_DEPLOYED=YES attempt=$i"; exit 0
            fi
            sleep 3
          done
          exit 1
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Android touch recette
        shell: bash
        run: |
          node <<'JS'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:2,locale:'fr-FR'});
              const page=await context.newPage(); const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
              await page.goto('https://simulator-standalone-v1.wfgg.pages.dev/simulator/?touchfix_v7_e2e=1',{waitUntil:'networkidle',timeout:60000});
              await page.locator('#stepNav [data-step="1"]').tap();
              const cards=page.locator('.game-hero-card'); await cards.first().waitFor({state:'visible'}); assert.equal(await cards.count(),31);
              await page.waitForFunction(()=>[...document.querySelectorAll('.game-hero-card img')].length===31 && [...document.querySelectorAll('.game-hero-card img')].every(i=>i.complete&&i.naturalWidth>100),null,{timeout:30000});
              await cards.first().tap(); await page.locator('#heroGameSheet.open').waitFor({state:'visible'});
              for(const [id,target] of [['grade','.lw4-skill-icons'],['wall','.lw4-tier-stars'],['weapon','.lw4-weapon-stage'],['attributes','.lw4-stage']]){
                await page.locator(`[data-sheet-tab="${id}"]`).tap(); await page.locator(target).waitFor({state:'visible'});
              }
              const close=page.locator('#heroSheetClose'); const cb=await close.boundingBox(); assert.ok(cb);
              const closeHit=await page.evaluate(({x,y})=>{const e=document.elementFromPoint(x,y);return {id:e?.id,tag:e?.tagName,cls:e?.className}}, {x:cb.x+cb.width/2,y:cb.y+cb.height/2});
              assert.equal(closeHit.id,'heroSheetClose',`close hit target ${JSON.stringify(closeHit)}`);
              await close.tap(); await page.waitForTimeout(150); assert.equal(await page.locator('#heroGameSheet.open').count(),0);
              await cards.nth(1).tap(); await page.locator('#heroGameSheet.open').waitFor({state:'visible'});
              const action=page.locator('#heroOwnedAction'); const ab=await action.boundingBox(); assert.ok(ab);
              const actionHit=await page.evaluate(({x,y})=>{const e=document.elementFromPoint(x,y);return {id:e?.id,tag:e?.tagName,cls:e?.className}}, {x:ab.x+ab.width/2,y:ab.y+ab.height/2});
              assert.equal(actionHit.id,'heroOwnedAction',`action hit target ${JSON.stringify(actionHit)}`);
              await page.locator('#heroSheetClose').tap();
              const metric=await page.evaluate(()=>({w:innerWidth,sw:(document.scrollingElement||document.documentElement).scrollWidth})); assert.ok(metric.sw<=metric.w+2);
              assert.equal(errors.length,0,errors.join(' | '));
              console.log(JSON.stringify({ok:true,cards:31,portraits:31,tabsTouch:true,closeTouch:true,closeHit,actionHit,metric},null,2));
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
