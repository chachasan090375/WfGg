name: WfGg production recette

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-recette:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate production sources
        run: |
          node --check frontend/_worker.js
          node --check frontend/portal-v070.js
          node --check frontend/portal-invitations-v1.js
          node --check frontend/portal-invitations-android-filefix-v1.js
          node --check .github/qa/train-recette-e2e.mjs
          node --check .github/qa/train-recette-extended.mjs
          node --check .github/qa/exchange-authority-recette.mjs
          node --check .github/qa/portal-responsive-recette.mjs
          node --check .github/qa/portal-invitations-recette.mjs
          grep -q 'https://wfgg-train.chachasan090375.workers.dev' frontend/_worker.js
          grep -q 'https://wfgg-train.chachasan090375.workers.dev' frontend/portal-v070.js
          grep -q 'WFGG_TRAIN_SERVER_SCHEDULE_V1' frontend/_worker.js
          grep -q 'WFGG_TRAIN_MUTATE_REFRESH_GUARD_V1' frontend/_worker.js
          grep -q 'WFGG_TRAIN_EXCHANGE_ORPHAN_FALLBACK_V1' frontend/_worker.js
          grep -q 'wfgg_bridge=v14' frontend/_worker.js
          grep -q "profileSubpage:'main'" frontend/portal-v070.js
          grep -q 'profileTrainRotationHost' frontend/portal-v070.js
          grep -q 'openSessionHistory' frontend/portal-v070.js
          ! grep -q 'renderHomeTrainRotationCard' frontend/portal-v070.js
          ! grep -q 'loadHomeTrainRotation' frontend/portal-v070.js
          grep -q 'portal-v070.js?v=080-profile-v16' frontend/index.html
          grep -q 'portal-responsive-v1.css?v=001' frontend/index.html
          grep -q 'portal-invitations-v1.css?v=001' frontend/index.html
          grep -q 'portal-invitations-v1.js?v=001' frontend/index.html
          grep -q 'portal-invitations-android-filefix-v1.js?v=001' frontend/index.html
          grep -q 'WFGG_PORTAL_RESPONSIVE_GUARD_V1' frontend/portal-responsive-v1.css
          grep -q 'WFGG_PORTAL_INVITATIONS_V1' frontend/portal-invitations-v1.js
          grep -q 'WFGG_PORTAL_INVITATIONS_ANDROID_FILEFIX_V1' frontend/portal-invitations-android-filefix-v1.js
          grep -q "removeAttribute('accept')" frontend/portal-invitations-android-filefix-v1.js
          grep -q "input.value=''" frontend/portal-invitations-android-filefix-v1.js
          grep -q 'https://wfgg.pages.dev/' frontend/portal-invitations-v1.js
          ! grep -q 'fetch(' frontend/portal-invitations-v1.js
          ! grep -q 'XMLHttpRequest' frontend/portal-invitations-v1.js
          ! grep -q 'portal-auth-phase1-wfgg-train.chachasan090375.workers.dev' frontend/_worker.js
          ! grep -q 'portal-auth-phase1-wfgg-train.chachasan090375.workers.dev' frontend/portal-v070.js
      - name: Wait for wfgg.pages.dev production assets
        shell: bash
        run: |
          set -eu
          ROOT='https://wfgg.pages.dev'
          UA='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/139 Mobile Safari/537.36'
          ok=0
          for i in $(seq 1 60); do
            curl -fsSL -A "$UA" "$ROOT/?production_recette=$i" -o /tmp/root.html || true
            curl -fsSL -A "$UA" "$ROOT/portal-v070.js?v=080-profile-v16&production_recette=$i" -o /tmp/portal.js || true
            curl -fsSL -A "$UA" "$ROOT/portal-responsive-v1.css?v=001&production_recette=$i" -o /tmp/responsive.css || true
            curl -fsSL -A "$UA" "$ROOT/portal-invitations-v1.js?v=001&production_recette=$i" -o /tmp/invitations.js || true
            curl -fsSL -A "$UA" "$ROOT/portal-invitations-android-filefix-v1.js?v=001&production_recette=$i" -o /tmp/invitations-filefix.js || true
            curl -fsSL -A "$UA" "$ROOT/portal-invitations-v1.css?v=001&production_recette=$i" -o /tmp/invitations.css || true
            curl -fsSL -A "$UA" "$ROOT/train/?production_recette=$i" -o /tmp/train.html || true
            curl -fsSL -A "$UA" "$ROOT/train/app.js?wfgg_bridge=v14&production_recette=$i" -o /tmp/app.js || true
            cancel_refs=$(grep -o 'cancelMarketExchange' /tmp/app.js 2>/dev/null | wc -l | tr -d ' ' || true)
            if grep -Fq 'portal-v070.js?v=080-profile-v16' /tmp/root.html \
              && grep -Fq 'portal-responsive-v1.css?v=001' /tmp/root.html \
              && grep -Fq 'portal-invitations-v1.js?v=001' /tmp/root.html \
              && grep -Fq 'portal-invitations-android-filefix-v1.js?v=001' /tmp/root.html \
              && grep -Fq 'portal-invitations-v1.css?v=001' /tmp/root.html \
              && grep -Fq 'WFGG_PORTAL_RESPONSIVE_GUARD_V1' /tmp/responsive.css \
              && grep -Fq 'WFGG_PORTAL_INVITATIONS_V1' /tmp/invitations.js \
              && grep -Fq 'WFGG_PORTAL_INVITATIONS_ANDROID_FILEFIX_V1' /tmp/invitations-filefix.js \
              && grep -Fq 'WFGG_PORTAL_INVITATIONS_STYLE_V1' /tmp/invitations.css \
              && grep -Fq "profileSubpage:'main'" /tmp/portal.js \
              && grep -Fq 'profileTrainRotationHost' /tmp/portal.js \
              && grep -Fq 'openSessionHistory' /tmp/portal.js \
              && ! grep -Fq 'renderHomeTrainRotationCard' /tmp/portal.js \
              && ! grep -Fq 'loadHomeTrainRotation' /tmp/portal.js \
              && grep -Fq 'wfgg_bridge=v14' /tmp/train.html \
              && grep -Fq 'https://wfgg-train.chachasan090375.workers.dev' /tmp/train.html \
              && grep -Fq 'state.__serverSchedule' /tmp/app.js \
              && grep -Fq 'Modification enregistrée mais synchronisation impossible' /tmp/app.js \
              && grep -Fq 'Joueur indisponible' /tmp/app.js \
              && ! grep -Fq 'portal-auth-phase1-wfgg-train.chachasan090375.workers.dev' /tmp/train.html \
              && [ "$cancel_refs" -ge 4 ]; then
              echo "WFGG_PAGES_DEV_PROFILE_V16_RESPONSIVE_INVITATIONS_V18_ANDROID_FILEFIX=OK cancel_refs=$cancel_refs"
              ok=1
              break
            fi
            echo "attempt=$i waiting_for_profile_responsive_invitations_android_filefix_and_train cancel_refs=$cancel_refs"
            sleep 5
          done
          test "$ok" = 1
          node --check /tmp/portal.js
          node --check /tmp/invitations.js
          node --check /tmp/invitations-filefix.js
          node --check /tmp/app.js
          grep -Fq 'Historique des connexions' /tmp/portal.js
          grep -Fq 'https://wfgg.pages.dev/' /tmp/invitations.js
          grep -Fq 'Metatouk' /tmp/invitations.js
          grep -Fq 'Flawene' /tmp/invitations.js
          ! grep -Fq 'fetch(' /tmp/invitations.js
          grep -Fq "removeAttribute('accept')" /tmp/invitations-filefix.js
          grep -Fq "input.value=''" /tmp/invitations-filefix.js
          grep -Fq 'overflow:hidden' /tmp/responsive.css
          grep -Fq 'max-width:100%' /tmp/responsive.css
          ! grep -Fq 'renderHomeTrainRotationCard' /tmp/portal.js
          ! grep -Fq 'if (token)' /tmp/app.js
          ! grep -Fq 'if (!token)' /tmp/app.js
          grep -Fq 'Retirer mon annonce' /tmp/app.js
          curl -fsSL -A "$UA" "$ROOT/assets/wfgg-logo-mini.svg?production_recette=1" -o /tmp/logo.svg
          grep -Fq '<svg' /tmp/logo.svg
      - name: Verify production Train backend
        shell: bash
        run: |
          set -eu
          curl -fsSi 'https://wfgg-train.chachasan090375.workers.dev/api/health?production_recette=v14' -o /tmp/backend-health.txt
          grep -iq '^x-wfgg-r3-cycle-model: v1' /tmp/backend-health.txt
          grep -iq '^x-wfgg-rotation-sequence-guard: v2' /tmp/backend-health.txt
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run portal responsive mobile recette on production
        env:
          WFGG_PREVIEW: https://wfgg.pages.dev
        run: node .github/qa/portal-responsive-recette.mjs
      - name: Run invitations browser recette on production
        env:
          WFGG_PREVIEW: https://wfgg.pages.dev
        run: node .github/qa/portal-invitations-recette.mjs
      - name: Run primary browser recette on production
        env:
          WFGG_PREVIEW: https://wfgg.pages.dev
        run: node .github/qa/train-recette-e2e.mjs
      - name: Run extended browser recette on production
        env:
          WFGG_PREVIEW: https://wfgg.pages.dev
        run: node .github/qa/train-recette-extended.mjs
      - name: Run exchange authority recette on production
        env:
          WFGG_PREVIEW: https://wfgg.pages.dev
        run: node .github/qa/exchange-authority-recette.mjs
