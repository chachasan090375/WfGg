name: ChaCha DEV Radar V6.19.9 stale cycle 66 recovery qualification

on:
  push:
    branches: [dev-hub-v5-radar-cluster-quality-diagnostic-v1]
    paths:
      - 'dev-hub/bin/run-radar-v6199-recover-stale-cycle66-via-chacha-dev.sh'
      - '.github/workflows/dev-hub-radar-v6199-stale66-recovery-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-hub-v5-radar-cluster-quality-diagnostic-v1

      - name: Validate governed stale cycle 66 recovery
        run: |
          set -euo pipefail
          R=dev-hub/bin/run-radar-v6199-recover-stale-cycle66-via-chacha-dev.sh
          bash -n "$R"
          grep -Fq 'EXPECTED_CONNECTOR="5058159307ccb99e8e631fe71014608934b8575e69d5599e4388550306baab7f"' "$R"
          grep -Fq 'EXPECTED_NATIVE="274d040f5294cb09422e5d55cc4b5335ac7739924c33dcb67b3f279645814900"' "$R"
          grep -Fq 'TARGET_CYCLE_ID=66' "$R"
          grep -Fq 'TARGET_QUERY="@federated:8125"' "$R"
          grep -Fq 'STALE_MIN_SECONDS=900' "$R"
          grep -Fq "sqlite3.connect('file:'+db+'?mode=ro'" "$R"
          grep -Fq "PRAGMA query_only=ON" "$R"
          grep -Fq 'RUNNING_TARGETED_COUNT' "$R"
          grep -Fq 'J’approuve la récupération du cycle Collector stale 66 de Radar V6.19.9, limitée à sa terminalisation en FAILED avec STALE_RUNNING_CYCLE_RECOVERED_V6197, sans scan Last War et sans autre mutation Collector.' "$R"
          grep -Fq '/cycle/finish' "$R"
          grep -Fq '"cycleId":66,"status":"FAILED","error":"STALE_RUNNING_CYCLE_RECOVERED_V6197"' "$R"
          grep -Fq 'RADAR_V6199_STALE66_COLLECTOR_FINISH_API=PASS' "$R"
          grep -Fq 'RADAR_V6199_STALE66_TERMINAL=PASS' "$R"
          grep -Fq 'RADAR_V6199_STALE66_RUNNING_TARGETED_AFTER=0' "$R"
          grep -Fq 'LASTWAR_CONTACT=NO' "$R"
          grep -Fq 'RADAR_PRODUCTION_MUTATION=NO' "$R"
          grep -Fq 'RADAR_V6199_COLLECTOR_MUTATION=CYCLE_66_TERMINALIZATION_ONLY' "$R"
          grep -Fq 'RADAR_V6199_HISTORY_MUTATION=NO' "$R"
          grep -Fq 'RADAR_V6199_STALE66_RECOVERY_APPROVAL_STANDING=NO' "$R"
          grep -Fq 'RADAR_V6199_STALE66_RECOVERY=PASS' "$R"
          echo RADAR_V6199_STALE66_RECOVERY=QUALIFIED
