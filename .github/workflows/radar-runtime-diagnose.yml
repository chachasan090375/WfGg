name: Radar runtime diagnose

on:
  push:
    branches: [radar-production-v1]
    paths:
      - '.github/workflows/radar-runtime-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct canonical Radar V0.5
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar && mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar
      - name: Inspect auth runtime paths
        working-directory: /tmp/wfgg-radar
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          keys=['authenticateGameToken','encryptGameToken','saveCredential','ensureBootstrapOwnerGrant','bindIdentityToGrant','audit(','connectorFromEnv','crypto.subtle','randomUUID','getRandomValues','env.DB','prepare(','.bind(','fetch(']
          for p in sorted(Path('src').rglob('*.js')):
            lines=p.read_text().splitlines()
            hit=set()
            for i,line in enumerate(lines,1):
              if any(k in line for k in keys):
                for n in range(max(1,i-8), min(len(lines),i+18)+1): hit.add(n)
            if not hit: continue
            print(f'===== {p} =====')
            last=0
            for n in sorted(hit):
              if last and n>last+1: print('...')
              print(f'{n:04d}: {lines[n-1]}')
              last=n
          print('===== WORKER IMPORTS =====')
          p=Path('src/worker.js'); lines=p.read_text().splitlines()
          for n in range(1,min(42,len(lines))+1): print(f'{n:04d}: {lines[n-1]}')
          PY
