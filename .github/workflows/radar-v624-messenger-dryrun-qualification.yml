name: Radar V6.24 Messenger dry-run qualification

on:
  push:
    branches: [radar-v624-internal-mail-protocol-discovery]
    paths:
      - '.radar-release-src/v624-messenger-source/**'
      - '.github/workflows/radar-v624-messenger-dryrun-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-v624-internal-mail-protocol-discovery

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Test dry-run contract
        working-directory: .radar-release-src/v624-messenger-source
        run: |
          set -euo pipefail
          go test ./...
          echo V624_MESSENGER_CONTRACT_TESTS=PASS

      - name: Prove no network-capable code exists
        run: |
          set -euo pipefail
          root='.radar-release-src/v624-messenger-source'
          if grep -RFn --include='*.go' -E '"net"|"net/http"|net\.Dial|http\.NewRequest|SendExtension|Write\(' "$root"; then
            echo V624_MESSENGER_NETWORK_CODE=FOUND
            exit 1
          fi
          echo V624_MESSENGER_NETWORK_CODE=ABSENT
          echo V624_MAIL_SEND_EXECUTED=NO
          echo V624_LASTWAR_MUTATION=NO
          echo V624_RADAR_LASTWAR_MODE=READ_ONLY
          echo V624_CROSS_SERVER_PRIVATE_MAIL=BLOCKED_UNPROVEN

      - name: Contract receipt
        run: |
          cat <<'EOF'
          WFGG_RADAR_MESSENGER=V6.24
          RESULT=success
          MODE=DRY_RUN_ONLY
          COMMAND=mail.send
          MAIL_SELF_SEND=21
          TITLE_LIMIT_BYTES=50
          CONTENT_LIMIT_BYTES=2000
          NETWORK_CODE=ABSENT
          LASTWAR_MUTATION=NO
          RADAR_LASTWAR_MODE=READ_ONLY
          CROSS_SERVER_PRIVATE_MAIL=BLOCKED_UNPROVEN
          PRODUCTION_DEPLOYMENT=NO
          EOF
