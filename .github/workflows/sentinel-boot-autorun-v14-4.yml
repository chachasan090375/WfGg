name: Sentinel Train boot autorun v14.4

on:
  push:
    branches:
      - sentinel-boot-autorun-v14-4

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sentinel-boot-autorun-v14-4
          fetch-depth: 0

      - name: Patch Sentinel boot autorun
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sentinel = Path('frontend/train-native/sentinel-train-v1.js')
          s = sentinel.read_text()

          if "const VERSION = 'sentinel-train-v14.4';" not in s:
              old = "const VERSION = 'sentinel-train-v14.3';"
              assert old in s, 'Sentinel V14.3 marker not found'
              s = s.replace(old, "const VERSION = 'sentinel-train-v14.4';", 1)

          if 'let bootAutoLaunchDone = false;' not in s:
              needle = '  let lastAnchor = null;\n'
              assert needle in s, 'lastAnchor marker not found'
              s = s.replace(needle, needle + '  let bootAutoLaunchDone = false;\n', 1)

          if 'WFGG_SENTINEL_BOOT_AUTORUN_V14_4' not in s:
              needle = "    } else {\n      button.textContent = '🧪 ' + bootReportText();\n    }\n    return true;\n  }\n\n  function popup() {"
              assert needle in s, 'injectBootButton tail not found'
              replacement = "    } else {\n      button.textContent = '🧪 ' + bootReportText();\n    }\n\n    /* WFGG_SENTINEL_BOOT_AUTORUN_V14_4\n       Sur l'écran de panne Train, Sentinel ne dépend plus d'un toucher mobile :\n       après validation OWNER/SUPERVISEUR, le panneau s'ouvre une seule fois et\n       la recette existante démarre automatiquement via openPopup(). */\n    if (!bootAutoLaunchDone) {\n      bootAutoLaunchDone = true;\n      setTimeout(() => {\n        openPopup().catch((error) => {\n          console.error('WFGG_SENTINEL_BOOT_AUTORUN_V14_4=ERROR', error);\n        });\n      }, 80);\n    }\n    return true;\n  }\n\n  function popup() {"
              s = s.replace(needle, replacement, 1)

          sentinel.write_text(s)

          worker = Path('frontend/_worker.js')
          w = worker.read_text()
          if "sentinel-train-v1.js?v=0144" not in w:
              assert "sentinel-train-v1.js?v=0143" in w, 'Sentinel loader 0143 not found'
              w = w.replace("sentinel-train-v1.js?v=0143", "sentinel-train-v1.js?v=0144")
          worker.write_text(w)
          PY

      - name: Validate Sentinel V14.4
        run: |
          node --check frontend/train-native/sentinel-train-v1.js
          node --check frontend/_worker.js
          grep -F "const VERSION = 'sentinel-train-v14.4';" frontend/train-native/sentinel-train-v1.js
          grep -F "WFGG_SENTINEL_BOOT_AUTORUN_V14_4" frontend/train-native/sentinel-train-v1.js
          grep -F "sentinel-train-v1.js?v=0144" frontend/_worker.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('frontend/train-native/sentinel-train-v1.js').read_text()
          assert s.count('WFGG_SENTINEL_BOOT_AUTORUN_V14_4') >= 2
          assert 'openPopup().catch((error)' in s
          assert 'bootAutoLaunchDone = true' in s
          print('WFGG_SENTINEL_BOOT_AUTORUN_V14_4=PASS')
          PY

      - name: Commit tested fix
        run: |
          if git diff --quiet -- frontend/train-native/sentinel-train-v1.js frontend/_worker.js; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/train-native/sentinel-train-v1.js frontend/_worker.js
          git commit -m "fix(sentinel): auto-open report on Train boot failure"
          git push origin HEAD:sentinel-boot-autorun-v14-4
