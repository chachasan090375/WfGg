name: Simulator public probe

on:
  push:
    branches: [simulator-standalone-v1]
    paths:
      - '.github/workflows/simulator-public-probe.yml'
      - 'frontend/_headers'
      - 'frontend/simulator/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe preview HTTP and JSON
        shell: bash
        run: |
          set -euo pipefail
          base='https://simulator-standalone-v1.wfgg.pages.dev/simulator'
          echo '=== PAGE HEADERS ==='
          curl -fsSIL "$base/" | sed -n '1,80p'
          echo
          for p in \
            profile-persistence-v2.js \
            data/tactics-card-catalog.v2.json \
            data/account-inputs.v1.json \
            data/research-inputs.v1.json \
            data/objectives.v1.json \
            data/season6-context.v1.json \
            data/season6-hero-evolution.v1.json \
            data/overlords.v1.json; do
            echo "=== $p ==="
            code=$(curl -sS -o /tmp/body -w '%{http_code}' "$base/$p")
            effective=$(curl -sSL -o /dev/null -w '%{url_effective}' "$base/$p")
            type=$(curl -sSI "$base/$p" | awk 'BEGIN{IGNORECASE=1}/^content-type:/{sub(/\r$/,"",$0);print substr($0,15);exit}')
            echo "HTTP=$code effective=$effective content-type=$type bytes=$(wc -c </tmp/body)"
            test "$code" = 200
            if [[ "$p" == *.json ]]; then python3 -m json.tool /tmp/body >/dev/null; fi
          done
          echo 'PUBLIC HTTP PROBE OK'

      - name: Install Playwright Chromium
        shell: bash
        run: |
          mkdir -p /tmp/wfgg-probe && cd /tmp/wfgg-probe
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Browser network trace
        shell: bash
        env:
          NODE_PATH: /tmp/wfgg-probe/node_modules
        run: |
          cat >/tmp/wfgg-probe/trace.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:412,height:915},isMobile:true,hasTouch:true});
            const page=await ctx.newPage();
            const failed=[];
            const responses=[];
            page.on('requestfailed',r=>{failed.push({url:r.url(),type:r.resourceType(),failure:r.failure()});console.log('REQUEST_FAILED',r.url(),JSON.stringify(r.failure()));});
            page.on('response',r=>{if(r.url().includes('/simulator/data/')){responses.push({url:r.url(),status:r.status(),ct:r.headers()['content-type']||''});console.log('JSON_RESPONSE',r.status(),r.url(),r.headers()['content-type']||'');}});
            page.on('console',m=>{if(m.type()==='error')console.log('CONSOLE_ERROR',m.text());});
            page.on('pageerror',e=>console.log('PAGE_ERROR',e.message));
            const nav=await page.goto('https://simulator-standalone-v1.wfgg.pages.dev/simulator/?netprobe='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
            console.log('NAV',nav.status(),page.url());
            await page.waitForTimeout(2500);
            const direct=await page.evaluate(async()=>{
              const urls=['data/tactics-card-catalog.v2.json','data/account-inputs.v1.json','data/research-inputs.v1.json'];
              const out=[];
              for(const u of urls){try{const r=await fetch(u,{cache:'no-store'});out.push({u,ok:r.ok,status:r.status,type:r.headers.get('content-type'),len:(await r.text()).length});}catch(e){out.push({u,error:String(e),name:e?.name,message:e?.message});}}
              return {origin:location.origin,href:location.href,out};
            });
            console.log('DIRECT_FETCH',JSON.stringify(direct));
            console.log('FAILED_COUNT',failed.length,'JSON_RESPONSES',responses.length);
            await browser.close();
            if(direct.out.some(x=>x.error)||failed.some(x=>x.url.includes('/simulator/data/')))process.exit(2);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/wfgg-probe/trace.cjs
