name: Local Evidence Materialization Qualification

on:
  push:
    branches:
      - fix-domain-local-evidence-materialization
    paths:
      - 'dev-hub/adapters/context7-mcp-adapter.py'
      - 'dev-hub/adapters/platform-command-adapter.py'
      - 'dev-hub/adapters/collector-knowledge-adapter.py'
      - 'dev-hub/bin/verification-broker.py'
      - 'dev-hub/config/verification-broker.v1.json'
      - 'dev-hub/tests/test_local_evidence_materialization.py'
      - '.github/workflows/local-evidence-materialization-qualification.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile changed Python
        run: |
          python3 -m py_compile \
            dev-hub/adapters/context7-mcp-adapter.py \
            dev-hub/adapters/platform-command-adapter.py \
            dev-hub/adapters/collector-knowledge-adapter.py \
            dev-hub/bin/verification-broker.py \
            dev-hub/tests/test_local_evidence_materialization.py

      - name: Run local evidence materialization regression suite
        run: |
          python3 dev-hub/tests/test_local_evidence_materialization.py

      - name: Assert fail-closed invariants remain explicit
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          policy=json.loads(Path('dev-hub/config/verification-broker.v1.json').read_text())
          assert policy['evidence']['unreadable_external_source']=='NEEDS_INDEPENDENT_CHECK'
          assert policy['principles']['declared_task_output_only'] is True
          assert policy['principles']['original_task_result_is_immutable'] is True
          print('VERIFICATION_BROKER_FAIL_CLOSED=PASS')
          print('DECLARED_OUTPUT_ONLY=PASS')
          print('ORIGINAL_RESULT_IMMUTABLE=PASS')
          PY
