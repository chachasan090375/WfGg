name: Apply Train exchange regression fix

on:
  push:
    branches: [train-bridge-phase3]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[exchange-fix-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: train-bridge-phase3
      - name: Apply exchange patches
        run: |
          python .github/scripts/train_exchange_ui_fix.py
          python .github/scripts/train_exchange_ui_fix_v2.py
      - run: |
          node --check frontend/_worker.js
          grep -q 'WFGG_TRAIN_EXCHANGE_OWN_CANCEL_V2' frontend/_worker.js
          grep -q 'wfgg_bridge=v13' frontend/_worker.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/_worker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: restore own exchange cancellation v2 [exchange-fix-auto]'
          git push origin HEAD:train-bridge-phase3
