name: ChaCha DEV V6.56 sixth adapter wave production weighted maturity qualification

on:
  push:
    branches:
      - dev-hub-v656-sixth-adapter-wave-production-weighted-maturity
    paths:
      - 'dev-hub/bin/agent_evolution_controller.py'
      - 'dev-hub/bin/install-v656-sixth-adapter-production-weighted-maturity.sh'
      - 'dev-hub/bin/agent_benchmark_adapters.py'
      - 'dev-hub/bin/agent_benchmark_oracles.py'
      - 'dev-hub/bin/autonomous-project-orchestrator.py'
      - 'dev-hub/config/agent-evolution.v1.json'
      - 'dev-hub/config/agent-benchmark-adapters.v1.json'
      - 'dev-hub/tests/test_v656_sixth_adapter_production_weighted_maturity.py'
      - '.github/workflows/dev-hub-v656-sixth-adapter-production-weighted-maturity-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static validation
        run: |
          set -euo pipefail
          bash -n dev-hub/bin/install-v656-sixth-adapter-production-weighted-maturity.sh
          python3 -m py_compile dev-hub/bin/agent_evolution_controller.py dev-hub/bin/agent_benchmark_adapters.py dev-hub/bin/agent_benchmark_oracles.py dev-hub/bin/autonomous-project-orchestrator.py dev-hub/tests/test_v656_sixth_adapter_production_weighted_maturity.py
          python3 -m json.tool dev-hub/config/agent-evolution.v1.json >/dev/null
          python3 -m json.tool dev-hub/config/agent-benchmark-adapters.v1.json >/dev/null
          grep -Fq '"version":"6.56.0"' dev-hub/bin/autonomous-project-orchestrator.py
      - name: V6.56 weighted maturity and sixth wave
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v656_sixth_adapter_production_weighted_maturity.py | tee /tmp/v656.out
          grep -Fq 'CHACHA_DEV_V656_TEST_ENGINEER_EXECUTABLE_ADAPTER=PASS' /tmp/v656.out
          grep -Fq 'CHACHA_DEV_V656_PERFORMANCE_ENGINEER_EXECUTABLE_ADAPTER=PASS' /tmp/v656.out
          grep -Fq 'CHACHA_DEV_V656_SRE_OBSERVABILITY_EXECUTABLE_ADAPTER=PASS' /tmp/v656.out
          grep -Fq 'CHACHA_DEV_V656_PRODUCTION_WEIGHTED_MATURITY=PASS' /tmp/v656.out
          grep -Fq 'CHACHA_DEV_V656_BENCHMARK_ONLY_MATURITY_LIMIT=PASS' /tmp/v656.out
          grep -Fq 'CHACHA_DEV_V656_BENCHMARK_ONLY_CANDIDATE_MATERIALIZATION=BLOCKED' /tmp/v656.out
          grep -Fq 'CHACHA_DEV_V656_PRODUCTION_OUTRANKS_BENCHMARK=PASS' /tmp/v656.out
          grep -Fq 'CHACHA_DEV_V656_SIXTH_WAVE_TOTAL_COVERAGE_80=PASS' /tmp/v656.out
          grep -Fq 'CHACHA_DEV_V656_AUTOMATIC_EXTERNAL_SPEND_EUR=0' /tmp/v656.out
      - name: V6.55 regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v655_production_evidence_fifth_wave.py >/tmp/v655.out
          grep -Fq 'CHACHA_DEV_V655_HISTORICAL_VERIFIED_BACKFILL=PASS' /tmp/v655.out
          grep -Fq 'CHACHA_DEV_V655_PRODUCTION_MEASUREMENT_PRECEDENCE=PASS' /tmp/v655.out
      - name: Qualification receipt
        run: |
          echo CHACHA_DEV_V656_QUALIFICATION=PASS
          echo SIXTH_WAVE_EXECUTABLE_ADAPTERS=3
          echo PRODUCTION_WEIGHT=0.70
          echo BENCHMARK_WEIGHT=0.30
          echo BENCHMARK_ONLY_CANDIDATE_MATERIALIZATION=BLOCKED
          echo PRODUCTION_MEASUREMENT_PRECEDENCE=YES
          echo ARCHITECTURE_COUNCIL_FINAL_AUTHORITY=YES
          echo AUTOMATIC_EXTERNAL_SPEND_EUR=0
