name: LastWar phase21 static catalog QA

on:
  workflow_dispatch:
  push:
    branches:
      - portal-auth-lastwar-lab-v1
    paths:
      - 'scripts/lastwar-phase21-static-catalog-forensics.sh'
      - '.github/workflows/lastwar-phase21-qa.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate shell syntax
        run: bash -n scripts/lastwar-phase21-static-catalog-forensics.sh
      - name: Validate embedded Python syntax
        run: |
          set -euo pipefail
          awk '/^cat > "\$PY" <<'"'"'PYEOF'"'"'$/{f=1;next} /^PYEOF$/{if(f){exit}} f{print}' scripts/lastwar-phase21-static-catalog-forensics.sh > /tmp/phase21.py
          python -m py_compile /tmp/phase21.py
      - name: Enforce offline privacy contract
        run: |
          set -euo pipefail
          f=scripts/lastwar-phase21-static-catalog-forensics.sh
          grep -q 'OFFLINE ONLY' "$f"
          grep -q 'no Last War network connection' "$f"
          ! grep -Eq 'curl |wget |requests\.|urllib\.request|socket\.' "$f"
          ! grep -Eq 'loginKey|accessToken|password' "$f"
