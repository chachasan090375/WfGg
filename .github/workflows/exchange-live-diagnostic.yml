name: Exchange live diagnostic

on:
  push:
    branches: [exchange-fix]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exchange-fix
      - name: Fetch production Train JavaScript
        run: |
          curl -fsSL 'https://wfgg.pages.dev/train/app.js?wfgg_bridge=v13&exchange_diag=2' -o /tmp/app.js
          node --check /tmp/app.js
      - name: Print exchange implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/app.js').read_text(encoding='utf-8')
          terms=[
            'function roleKey','function roleKeyLabel','function myAssignments','function assignmentFor',
            'function schedule','function generateSchedule','function applySnapshot','async function syncSnapshot',
            'async function mutate','function renderExchanges','function openExchange','function publishMarketExchange',
            'function pickMyDateForMarket','function executeMarketSwap'
          ]
          for term in terms:
              print('\n===== '+term+' =====')
              pos=s.find(term)
              print('pos=',pos)
              if pos>=0:
                  print(s[max(0,pos-1600):min(len(s),pos+5200)])
          PY
