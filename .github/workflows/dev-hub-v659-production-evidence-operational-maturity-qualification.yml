name: ChaCha DEV V6.59 production evidence operational maturity qualification

on:
  push:
    branches:
      - dev-hub-v659-production-evidence-operational-maturity-closure
    paths:
      - 'dev-hub/bin/agent_fleet_observatory.py'
      - 'dev-hub/bin/install-v659-production-evidence-operational-maturity.sh'
      - 'dev-hub/bin/autonomous-project-orchestrator.py'
      - 'dev-hub/config/agent-fleet-observatory.v1.json'
      - 'dev-hub/tests/test_v659_production_evidence_operational_maturity.py'
      - '.github/workflows/dev-hub-v659-production-evidence-operational-maturity-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static validation
        run: |
          set -euo pipefail
          bash -n dev-hub/bin/install-v659-production-evidence-operational-maturity.sh
          python3 -m py_compile dev-hub/bin/agent_fleet_observatory.py dev-hub/bin/autonomous-project-orchestrator.py dev-hub/tests/test_v659_production_evidence_operational_maturity.py
          python3 -m json.tool dev-hub/config/agent-fleet-observatory.v1.json >/dev/null
          grep -Fq '"version":"6.59.0"' dev-hub/bin/autonomous-project-orchestrator.py
      - name: V6.59 production evidence maturity
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v659_production_evidence_operational_maturity.py | tee /tmp/v659.out
          grep -Fq 'CHACHA_DEV_V659_GUARDIAN_EXTERNAL_STRUCTURAL_PRODUCTION_EVIDENCE=PASS' /tmp/v659.out
          grep -Fq 'CHACHA_DEV_V659_GUARDIAN_ACCURACY_INFERENCE=NO' /tmp/v659.out
          grep -Fq 'CHACHA_DEV_V659_SENTINEL_ATTESTED_STRUCTURAL_PRODUCTION_EVIDENCE=PASS' /tmp/v659.out
          grep -Fq 'CHACHA_DEV_V659_SENTINEL_ACCURACY_INFERENCE=NO' /tmp/v659.out
          grep -Fq 'CHACHA_DEV_V659_ACCEPTANCE_STRUCTURAL_PRODUCTION_EVIDENCE=PASS' /tmp/v659.out
          grep -Fq 'CHACHA_DEV_V659_ACCEPTANCE_ACCURACY_INFERENCE=NO' /tmp/v659.out
          grep -Fq 'CHACHA_DEV_V659_PRODUCTION_PRECEDENCE=PASS' /tmp/v659.out
          grep -Fq 'CHACHA_DEV_V659_BENCHMARK_ONLY_CANDIDATE_MATERIALIZATION=BLOCKED' /tmp/v659.out
          grep -Fq 'CHACHA_DEV_V659_AUTOMATIC_EXTERNAL_SPEND_EUR=0' /tmp/v659.out
      - name: V6.58 regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v658_visual_content_project_radar_evidence.py >/tmp/v658.out
          grep -Fq 'CHACHA_DEV_V658_RADAR_ACCURACY_FROM_PROMOTION=NO' /tmp/v658.out
          grep -Fq 'CHACHA_DEV_V658_PLATFORM_ROUTING_FOR_RADAR=FORBIDDEN' /tmp/v658.out
      - name: Qualification receipt
        run: |
          echo CHACHA_DEV_V659_QUALIFICATION=PASS
          echo GUARDIAN_EXTERNAL_STRUCTURAL_PRODUCTION_DIMENSIONS=3
          echo GUARDIAN_ACCURACY_INFERENCE=NO
          echo SENTINEL_ATTESTED_STRUCTURAL_PRODUCTION_DIMENSIONS=3
          echo SENTINEL_ACCURACY_INFERENCE=NO
          echo ACCEPTANCE_STRUCTURAL_PRODUCTION_DIMENSIONS=3
          echo ACCEPTANCE_ACCURACY_INFERENCE=NO
          echo BENCHMARK_ONLY_CANDIDATE_MATERIALIZATION=BLOCKED
          echo ARCHITECTURE_COUNCIL_FINAL_AUTHORITY=YES
          echo AUTOMATIC_EXTERNAL_SPEND_EUR=0
