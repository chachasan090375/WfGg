name: Build Radar VPS production binaries

on:
  push:
    branches: [radar-production-v1]
    paths:
      - '.github/workflows/build-radar-vps-binaries.yml'
      - '.github/scripts/patch-radar-target-profile-retry.py'
      - '.github/scripts/patch-radar-federated-diagnostics-v65.py'
      - '.github/scripts/patch-player-scan-v3.py'
      - '.github/scripts/patch-player-scan-v4.py'
      - '.github/scripts/patch-radar-protocol-discovery-v67.py'
      - '.github/scripts/patch-radar-profile-isolation-v68.py'
      - '.github/scripts/patch-radar-native-profile-v69.py'
      - '.github/scripts/patch-radar-native-profile-handshake-v691.py'
      - '.github/scripts/patch-radar-native-profile-exec-v692.py'
      - '.github/scripts/patch-radar-connector-runtime-v693.py'
      - '.github/scripts/patch-radar-cluster-catalog-budget-v6192.py'
      - '.github/scripts/patch-radar-seed-scout-v6193.py'
      - '.github/scripts/patch-radar-autopilot-v6194.py'
      - '.radar-release-src/v2-source/connector-go/**'
      - '.radar-release-src/v6193-source/**'
      - '.radar-release-src/v6194-source/**'
      - '.radar-release-src/v6197-source/**'
      - '.radar-release-src/v6198-source/**'
      - '.github/scripts/patch-radar-autopilot-stale-cycle-v6197.py'
      - '.github/scripts/patch-radar-collector-cycle-terminalization-v6198.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: wfgg-radar-vps-binaries
  cancel-in-progress: false

env:
  LASTWAR_CLIENT_REF: ee5f64de160a8051c2f9f98189b75038dd225a0a
  EXPECTED_CONNECTOR_SHA256: fb21a02feeaaa6a7013cf4e17c77bbb033a30a4bce021066fd947fc665360a9b
  EXPECTED_NATIVE_SHA256: 274d040f5294cb09422e5d55cc4b5335ac7739924c33dcb67b3f279645814900

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-production-v1
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Reconstruct cumulative V6.19.8
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar /tmp/lastwar-client
          mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          echo '234df1dec57f6211bc625855bf13350c9f17fbd843fbe92d8cf1ab7cb5c081ef  /tmp/radar-src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar
          rm -rf /tmp/wfgg-radar/connector-go
          cp -a .radar-release-src/v2-source/connector-go /tmp/wfgg-radar/connector-go

          python3 .github/scripts/patch-radar-target-profile-retry.py
          python3 .github/scripts/patch-radar-federated-diagnostics-v65.py
          python3 .github/scripts/patch-player-scan-v3.py
          python3 .github/scripts/patch-player-scan-v4.py
          python3 .github/scripts/patch-radar-protocol-discovery-v67.py
          python3 .github/scripts/patch-radar-profile-isolation-v68.py
          python3 .github/scripts/patch-radar-native-profile-v69.py
          python3 .github/scripts/patch-radar-native-profile-handshake-v691.py
          python3 .github/scripts/patch-radar-native-profile-exec-v692.py
          python3 .github/scripts/patch-radar-connector-runtime-v693.py
          python3 .github/scripts/patch-radar-cluster-catalog-budget-v6192.py
          python3 .github/scripts/patch-radar-seed-scout-v6193.py
          python3 .github/scripts/patch-radar-autopilot-v6194.py
          python3 .github/scripts/patch-radar-autopilot-stale-cycle-v6197.py
          python3 .github/scripts/patch-radar-collector-cycle-terminalization-v6198.py

          grep -Fq 'WFGG_RADAR_CLUSTER_CATALOG_BUDGET_V6192' /tmp/wfgg-radar/connector-go/cmd/radar-connector/server_cluster_catalog_v613.go
          grep -Fq 'WFGG_RADAR_SEED_SCOUT_V6193' /tmp/wfgg-radar/connector-go/cmd/radar-connector/server_seed_scout_v6193.go
          grep -Fq 'WFGG_RADAR_AUTOPILOT_CONTINUE_NO_DATA_V6196' /tmp/wfgg-radar/connector-go/cmd/radar-connector/server_autopilot_v6194.go
          grep -Fq 'SEED_SKIPPED_NO_DATA' /tmp/wfgg-radar/connector-go/cmd/radar-connector/server_autopilot_v6194.go
          grep -Fq 'AUTOPILOT_NO_DATA' /tmp/wfgg-radar/connector-go/cmd/radar-connector/server_autopilot_v6194.go
          echo RADAR_V6198_PRODUCTION_RECONSTRUCT=PASS

      - name: Test and build connector
        working-directory: /tmp/wfgg-radar/connector-go
        run: |
          set -euo pipefail
          gofmt -w ./cmd ./internal
          go test ./...
          go vet ./...
          mkdir -p "$GITHUB_WORKSPACE/radar-vps/release"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o "$GITHUB_WORKSPACE/radar-vps/release/radar-connector" ./cmd/radar-connector
          actual="$(sha256sum "$GITHUB_WORKSPACE/radar-vps/release/radar-connector" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_CONNECTOR_SHA256"
          echo "RADAR_V6198_CONNECTOR_SHA256=$actual"

      - name: Build qualified native helper
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/ljagiello/lastwar-client.git /tmp/lastwar-client
          cd /tmp/lastwar-client
          git fetch --quiet --depth 1 origin "$LASTWAR_CLIENT_REF"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$LASTWAR_CLIENT_REF"

          mkdir -p cmd/wfgg-radar-native-template
          cp /tmp/wfgg-radar/connector-go/native-template/main.go cmd/wfgg-radar-native-template/main.go
          cp /tmp/wfgg-radar/connector-go/native-template/player_scan_v3.go cmd/wfgg-radar-native-template/player_scan_v3.go
          cp /tmp/wfgg-radar/connector-go/native-template/player_scan_v4.go cmd/wfgg-radar-native-template/player_scan_v4.go
          cp /tmp/wfgg-radar/connector-go/native-template/profile_scan_v69.go cmd/wfgg-radar-native-template/profile_scan_v69.go
          cp /tmp/wfgg-radar/connector-go/native-template/profile_scan_v69_test.go cmd/wfgg-radar-native-template/profile_scan_v69_test.go
          cp /tmp/wfgg-radar/connector-go/native-template/profile_rich_fields_v619_test.go cmd/wfgg-radar-native-template/profile_rich_fields_v619_test.go
          gofmt -w cmd/wfgg-radar-native-template/*.go
          go test -tags lastwar_native_template ./cmd/wfgg-radar-native-template
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags lastwar_native_template -trimpath -ldflags='-s -w' -o "$GITHUB_WORKSPACE/radar-vps/release/radar-native-template" ./cmd/wfgg-radar-native-template
          actual="$(sha256sum "$GITHUB_WORKSPACE/radar-vps/release/radar-native-template" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_NATIVE_SHA256"
          echo "RADAR_V6198_NATIVE_SHA256=$actual"

      - name: Verify read-only production release
        run: |
          set -euo pipefail
          chmod 0755 radar-vps/release/radar-connector radar-vps/release/radar-native-template
          grep -aFq 'native-template-readonly-v4' radar-vps/release/radar-native-template
          grep -aFq 'world.get.block' radar-vps/release/radar-native-template
          grep -aFq 'get.user.info.multi' radar-vps/release/radar-native-template
          (
            cd radar-vps/release
            sha256sum radar-connector radar-native-template > SHA256SUMS
          )
          grep -Fq "$EXPECTED_CONNECTOR_SHA256  radar-connector" radar-vps/release/SHA256SUMS
          grep -Fq "$EXPECTED_NATIVE_SHA256  radar-native-template" radar-vps/release/SHA256SUMS
          grep -aFq 'v6.19.8' radar-vps/release/radar-connector
          grep -aFq 'SEED_SKIPPED_NO_DATA' radar-vps/release/radar-connector
          grep -aFq 'AUTOPILOT_NO_DATA' radar-vps/release/radar-connector
          grep -aFq 'STALE_RUNNING_CYCLE_RECOVERED_V6197' radar-vps/release/radar-connector
          grep -aFq 'COLLECTOR_CYCLE_TERMINALIZATION_FAILED' radar-vps/release/radar-connector
          echo RADAR_V6198_GAME_MUTATION=NO
          echo RADAR_V6198_LASTWAR_MUTATION=NO
          echo RADAR_V6198_AUTOPILOT_COLLECTOR_MUTATION=YES
          echo RADAR_V6198_TOKEN_PERSISTENCE=NO
          echo RADAR_V6198_PRODUCTION_RELEASE=QUALIFIED

      - name: Commit production release binaries
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar-vps/release/radar-connector radar-vps/release/radar-native-template radar-vps/release/SHA256SUMS
          if git diff --cached --quiet; then
            echo RADAR_V6198_RELEASE_BINARIES=UNCHANGED
            GH_TOKEN="${{ github.token }}" gh workflow run deploy-radar-production.yml --ref radar-production-v1
            echo RADAR_V6198_CLOUDFLARE_DISPATCH=TRIGGERED
            exit 0
          fi
          git commit -m 'build(radar): publish V6.19.8 Collector Cycle Terminalization production binaries'
          git fetch origin radar-production-v1
          git rebase origin/radar-production-v1
          git push origin HEAD:radar-production-v1
          echo RADAR_V6198_RELEASE_BINARIES=PUBLISHED
          GH_TOKEN="${{ github.token }}" gh workflow run deploy-radar-production.yml --ref radar-production-v1
          echo RADAR_V6198_CLOUDFLARE_DISPATCH=TRIGGERED
