name: Build Radar VPS binaries

on:
  push:
    branches: [radar-production-v1]
    paths:
      - '.github/workflows/build-radar-vps-binaries.yml'
      - '.github/scripts/patch-radar-target-profile-retry.py'
      - '.radar-release-src/v2-source/connector-go/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wfgg-radar-vps-binaries
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-production-v1
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Reconstruct immutable Radar V0.5 base
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar
          mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          echo '234df1dec57f6211bc625855bf13350c9f17fbd843fbe92d8cf1ab7cb5c081ef  /tmp/radar-src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar

      - name: Overlay current connector source
        run: |
          set -euo pipefail
          test -f .radar-release-src/v2-source/connector-go/go.mod
          test -f .radar-release-src/v2-source/connector-go/cmd/radar-connector/main.go
          rm -rf /tmp/wfgg-radar/connector-go
          cp -a .radar-release-src/v2-source/connector-go /tmp/wfgg-radar/connector-go

      - name: Apply searched-target profile retry
        run: |
          set -euo pipefail
          python3 .github/scripts/patch-radar-target-profile-retry.py
          grep -q 'PROFILE_TARGET_RETRY_V1' /tmp/wfgg-radar/connector-go/cmd/radar-connector/collector_jobs.go
          grep -q 'PROFILE_TARGET_NOT_RETURNED' /tmp/wfgg-radar/connector-go/cmd/radar-connector/collector_jobs.go
          echo 'RADAR_TARGET_PROFILE_RETRY=STAGED'

      - name: Test and build Radar connector
        working-directory: /tmp/wfgg-radar/connector-go
        run: |
          set -euo pipefail
          gofmt -w ./cmd ./internal
          go test ./...
          mkdir -p "$GITHUB_WORKSPACE/radar-vps/release"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o "$GITHUB_WORKSPACE/radar-vps/release/radar-connector" ./cmd/radar-connector

      - name: Build pinned Last War email auth client
        run: |
          set -euo pipefail
          UPSTREAM_COMMIT='ee5f64de160a8051c2f9f98189b75038dd225a0a'
          rm -rf /tmp/lastwar-client
          git clone --quiet --filter=blob:none https://github.com/ljagiello/lastwar-client.git /tmp/lastwar-client
          cd /tmp/lastwar-client
          git fetch --quiet --depth 1 origin "$UPSTREAM_COMMIT"
          git checkout --quiet --detach "$UPSTREAM_COMMIT"
          test "$(git rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o "$GITHUB_WORKSPACE/radar-vps/release/radar-lastwar-auth-client" ./cmd/lastwar-client
          chmod 0755 "$GITHUB_WORKSPACE/radar-vps/release/radar-lastwar-auth-client"
          echo "LASTWAR_AUTH_CLIENT_UPSTREAM=$UPSTREAM_COMMIT"

      - name: Preserve validated V4 native helper
        run: |
          set -euo pipefail
          test -x radar-vps/release/radar-native-template || chmod 0755 radar-vps/release/radar-native-template
          grep -aFq 'native-template-readonly-v4' radar-vps/release/radar-native-template
          grep -aFq 'world.get.block' radar-vps/release/radar-native-template
          grep -aFq 'get.user.info.multi' radar-vps/release/radar-native-template
          echo 'RADAR_NATIVE_TEMPLATE=PRESERVED_V4'

      - name: Verify release binaries
        run: |
          set -euo pipefail
          chmod 0755 radar-vps/release/radar-connector radar-vps/release/radar-native-template radar-vps/release/radar-lastwar-auth-client
          cd radar-vps/release
          sha256sum radar-connector radar-native-template radar-lastwar-auth-client > SHA256SUMS
          file radar-connector radar-native-template radar-lastwar-auth-client
          test -s radar-lastwar-auth-client
          cat SHA256SUMS

      - name: Commit VPS release binaries
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar-vps/release/radar-connector radar-vps/release/radar-native-template radar-vps/release/radar-lastwar-auth-client radar-vps/release/SHA256SUMS
          if git diff --cached --quiet; then
            echo 'VPS_BINARIES=UNCHANGED'
            exit 0
          fi
          git commit -m 'build(radar): publish profile-retry connector bundle'
          git fetch origin radar-production-v1
          git rebase origin/radar-production-v1
          git push origin HEAD:radar-production-v1
          echo 'VPS_BINARIES=PUBLISHED'
