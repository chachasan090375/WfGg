name: ChaCha DEV Radar V6.19.8 production Sentinel reconcile qualification

on:
  push:
    branches: [dev-hub-v5-radar-cluster-quality-diagnostic-v1]
    paths:
      - 'dev-hub/bin/run-radar-v6198-production-sentinel-reconcile.sh'
      - '.github/workflows/dev-hub-radar-v6198-production-sentinel-reconcile-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-hub-v5-radar-cluster-quality-diagnostic-v1

      - name: Validate governed V6.19.8 production reconcile
        run: |
          set -euo pipefail
          F=dev-hub/bin/run-radar-v6198-production-sentinel-reconcile.sh
          bash -n "$F"
          grep -Fq 'WFGG_DEV_HUB_RADAR_V6198_PROD_RECONCILE_REV' "$F"
          grep -Fq 'RUNTIME="/opt/chacha-dev/runtime"' "$F"
          grep -Fq 'WORK_ROOT="$RUNTIME/tmp"' "$F"
          grep -Fq 'J’approuve la promotion production Radar V6.19.8 Collector Cycle Terminalization et le déploiement des surfaces Cloudflare associées.' "$F"
          grep -Fq 'production-release' "$F"
          grep -Fq 'RADAR_V6198_PRODUCTION_RELEASE_MANIFEST=READY' "$F"
          grep -Fq 'radar-production-v1/radar-vps/release/SHA256SUMS' "$F"
          grep -Fq 'radar-runtime:production-sentinel-reconcile-v6198' "$F"
          grep -Fq '"action":"pilot-close"' "$F"
          grep -Fq 'fb21a02feeaaa6a7013cf4e17c77bbb033a30a4bce021066fd947fc665360a9b' "$F"
          grep -Fq '274d040f5294cb09422e5d55cc4b5335ac7739924c33dcb67b3f279645814900' "$F"
          grep -Fq 'RADAR_V6198_PRODUCTION_RUNTIME=PASS' "$F"
          grep -Fq 'PRODUCTION_RELEASE_APPROVAL_REVOKED=PASS' "$F"
          grep -Fq 'PROJECT_CONTROL_INTEGRITY_AFTER=PASS' "$F"
          grep -Fq 'RADAR_V6198_PRODUCTION_APPROVAL_STANDING=NO' "$F"
          grep -Fq 'RADAR_V6198_LASTWAR_MUTATION=NO' "$F"
          grep -Fq 'RADAR_V6198_COLLECTOR_MUTATION=DISCOVERY_AND_TERMINALIZATION_ONLY' "$F"
          grep -Fq 'RADAR_V6198_PROD_RECONCILE=PASS' "$F"
          echo RADAR_V6198_PRODUCTION_SENTINEL_RECONCILE=QUALIFIED
