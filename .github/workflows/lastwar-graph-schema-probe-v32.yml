name: Last War Graph Schema Probe V32
on:
  push:
    branches: [lab-global-graphics-catalog-v32]
    paths:
      - 'scripts/lastwar-graph-schema-probe-v32.py'
      - '.github/workflows/lastwar-graph-schema-probe-v32.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/lastwar-graph-schema-probe-v32.py "$GITHUB_WORKSPACE"
