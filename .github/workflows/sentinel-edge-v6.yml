name: Sentinel edge v6

on:
  push:
    branches:
      - sentinel-edge-v6
    paths:
      - 'scripts/patch-sentinel-edge-v6.mjs'
      - '.github/workflows/sentinel-edge-v6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sentinel-edge-v6
          fetch-depth: 0
      - name: Apply Sentinel edge patch
        run: node scripts/patch-sentinel-edge-v6.mjs
      - name: Validate syntax and security contract
        run: |
          node --check frontend/_worker.js
          grep -q 'WFGG_SENTINEL_EDGE_RUNNER_V6' frontend/_worker.js
          grep -q "meCall.data?.system?.role!=='OWNER'" frontend/_worker.js
          grep -q 'SENTINEL_OWNER_ONLY' frontend/_worker.js
          grep -q "return await runSentinelAtPortalEdge(request)" frontend/_worker.js
          grep -q "X-WfGg-Portal-Token':token" frontend/_worker.js
          grep -q "readonly:true" frontend/_worker.js
          grep -q "WFGG_TRAIN_PORTAL_HOME_AND_PROFILE_POLISH_V5" frontend/_worker.js
          grep -q "script.src='/train/sentinel-train-v1.js?v=005'" frontend/_worker.js
      - name: Commit generated Worker change
        run: |
          if git diff --quiet -- frontend/_worker.js; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/_worker.js
          git commit -m 'fix(sentinel): run OWNER-only diagnostics at Pages edge'
          git push origin HEAD:sentinel-edge-v6
