name: LastWar phase27 config loader QA

on:
  workflow_dispatch:
  push:
    branches:
      - portal-auth-lastwar-lab-v1
    paths:
      - 'scripts/lastwar-phase27-config-loader-discovery.sh'
      - '.github/workflows/lastwar-phase27-qa.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate shell syntax
        run: bash -n scripts/lastwar-phase27-config-loader-discovery.sh
      - name: Validate embedded Python syntax
        run: |
          set -euo pipefail
          awk '/^cat > "\$PY" <<'"'"'PYEOF'"'"'$/{f=1;next} /^PYEOF$/{if(f){exit}} f{print}' scripts/lastwar-phase27-config-loader-discovery.sh > /tmp/phase27.py
          python -m py_compile /tmp/phase27.py
      - name: Enforce offline exact-mapping contract
        run: |
          set -euo pipefail
          f=scripts/lastwar-phase27-config-loader-discovery.sh
          grep -q 'OFFLINE ONLY' "$f"
          grep -q 'No Last War network connection' "$f"
          grep -q 'HeroTemplateManager' "$f"
          grep -q 'LW_Hero' "$f"
          grep -q 'LuaEntry' "$f"
          grep -q 'DataConfig' "$f"
          grep -q 'exact_ascii_numeric_boundary_enabled=true' "$f"
          grep -q 'unknown_hero_ids_are_not_guessed=true' "$f"
          grep -q '50016 must NOT match icon_item_650016' "$f"
          ! grep -Eq '50016[[:space:]]*[:=][[:space:]]*["'"']?(Tesla|DVA)|50017[[:space:]]*[:=][[:space:]]*["'"']?(Tesla|DVA)' "$f"
          ! grep -Eq 'curl |wget |requests\.|urllib\.request|socket\.' "$f"
