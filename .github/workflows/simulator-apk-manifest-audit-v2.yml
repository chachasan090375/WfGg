name: Simulator APK manifest audit v2

on:
  push:
    branches: [simulator-standalone-v1]
    paths: ['.github/workflows/simulator-apk-manifest-audit-v2.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simulator-standalone-v1
          fetch-depth: 0

      - name: Inspect verified current XAPK for DataTable bootstrap metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lw/xapk simulator/research
          EXPECTED_SHA1='a5c3bc2cb56678339fd3fa3d124945c4ccca2e01'
          candidates=(
            'https://d.apkpure.net/b/XAPK/com.fun.lastwar.gp?versionCode=1864'
            'https://d.apkpure.net/b/XAPK/com.fun.lastwar.gp?version=1.0.359'
          )
          found=''
          for url in "${candidates[@]}"; do
            rm -f /tmp/lw/current.xapk
            if curl -fL --retry 2 --connect-timeout 20 --max-time 900 "$url" -o /tmp/lw/current.xapk; then
              got=$(sha1sum /tmp/lw/current.xapk | awk '{print $1}')
              echo "SHA1=$got"
              if [[ "$got" == "$EXPECTED_SHA1" ]]; then found="$url"; break; fi
            fi
          done
          if [[ -z "$found" ]]; then
            echo 'Verified current 1.0.359/build 1864 XAPK unavailable; refusing mismatched input.' >&2
            exit 2
          fi
          unzip -q /tmp/lw/current.xapk -d /tmp/lw/xapk

          python3 - <<'PY'
          import hashlib, json, pathlib, re, zipfile

          root=pathlib.Path('/tmp/lw')
          xapk=root/'current.xapk'
          apks=sorted((root/'xapk').rglob('*.apk'), key=lambda p:p.stat().st_size, reverse=True)
          needle_rx=re.compile(rb'(table_version|table_env|getlsu3dversion\.php|hotupdate|lastwar-cdn|table_[0-9]+_|DataTable)', re.I)
          name_rx=re.compile(r'(table|manifest|version|hot.?update|metadata|download)', re.I)
          printable=re.compile(rb'[\x20-\x7e]{8,320}')
          filename_hits=[]
          string_hits=[]
          apk_inventory=[]

          def add_string(apk_name, entry_name, raw):
            for m in printable.finditer(raw):
              s=m.group().decode('ascii','ignore')
              if needle_rx.search(m.group()):
                string_hits.append({'apk':apk_name,'entry':entry_name,'text':s[:320]})
                if len(string_hits) >= 350:
                  return True
            return False

          for apk in apks:
            rec={'name':apk.name,'bytes':apk.stat().st_size,'sha1':hashlib.sha1(apk.read_bytes()).hexdigest()}
            apk_inventory.append(rec)
            try:
              with zipfile.ZipFile(apk) as z:
                for info in z.infolist():
                  n=info.filename
                  if name_rx.search(n):
                    filename_hits.append({'apk':apk.name,'path':n,'bytes':info.file_size})
                  # Metadata/config/native entries are the most likely locations for bootstrap literals.
                  low=n.lower()
                  likely=(
                    'global-metadata.dat' in low or
                    low.endswith(('.json','.xml','.txt','.bytes','.config','.ini','.properties')) or
                    ('assets/' in low and info.file_size <= 12_000_000) or
                    (low.endswith(('.so','.dll')) and info.file_size <= 80_000_000)
                  )
                  if not likely or info.file_size <= 0 or len(string_hits) >= 350:
                    continue
                  try:
                    raw=z.read(info)
                  except Exception:
                    continue
                  if needle_rx.search(raw):
                    if add_string(apk.name,n,raw):
                      break
            except zipfile.BadZipFile:
              rec['badZip']=True

          # Deduplicate exact string hits while preserving order.
          seen=set(); dedup=[]
          for h in string_hits:
            k=(h['apk'],h['entry'],h['text'])
            if k not in seen:
              seen.add(k); dedup.append(h)
          out={
            'source':{
              'version':'1.0.359','buildId':1864,'architecture':'arm64-v8a',
              'xapkSha1':hashlib.sha1(xapk.read_bytes()).hexdigest()
            },
            'apkInventory':apk_inventory,
            'filenameHits':filename_hits[:1200],
            'stringHits':dedup[:350],
            'searchTerms':['table_version','table_env','getlsu3dversion.php','hotupdate','lastwar-cdn','table_<version>_<md5>.data','DataTable'],
            'note':'Sanitized metadata/string inventory only. No APK, asset pack, account/session data, secrets, or bulk copyrighted assets are committed.'
          }
          p=pathlib.Path('simulator/research/current-apk-manifest-audit.v2.json')
          p.write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps({'apks':len(apk_inventory),'filenameHits':len(filename_hits),'stringHits':len(dedup)},indent=2))
          PY

      - name: Commit sanitized audit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add simulator/research/current-apk-manifest-audit.v2.json
          if ! git diff --cached --quiet; then
            git commit -m 'simulator: capture APK DataTable manifest audit v2'
            git push origin HEAD:simulator-standalone-v1
          fi
