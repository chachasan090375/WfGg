name: Radar V6.12 live server census

on:
  push:
    branches: [radar-v612-live-census-probe]
    paths:
      - '.github/workflows/radar-v612-live-server-census.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RADAR_CONNECTOR_URL: https://chachavps.tail3ab05a.ts.net

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read aggregate server cooccurrence map V6.12.2
        env:
          RADAR_CONNECTOR_SHARED_KEY: ${{ secrets.RADAR_CONNECTOR_SHARED_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, hmac, json, os, secrets, time, urllib.error, urllib.request

          base = os.environ['RADAR_CONNECTOR_URL'].rstrip('/')
          key = os.environ['RADAR_CONNECTOR_SHARED_KEY'].encode()
          path = '/v1/collector/server-cycle-map'
          ts = str(int(time.time()))
          nonce = secrets.token_hex(16)
          body_hash = hashlib.sha256(b'').hexdigest()
          canonical = '\n'.join(['GET', path, ts, nonce, body_hash])
          sig = hmac.new(key, canonical.encode(), hashlib.sha256).hexdigest()
          req = urllib.request.Request(base + path, method='GET', headers={
              'X-Radar-Timestamp': ts,
              'X-Radar-Nonce': nonce,
              'X-Radar-Signature': sig,
          })
          started = time.monotonic()
          try:
              with urllib.request.urlopen(req, timeout=40) as response:
                  data = json.loads(response.read().decode())
          except urllib.error.HTTPError as exc:
              body = exc.read().decode(errors='replace')
              try:
                  data = json.loads(body)
              except Exception:
                  data = {'error': 'NON_JSON_ERROR'}
              print('RADAR_V6122_HTTP_STATUS=' + str(exc.code))
              print('RADAR_V6122_ERROR=' + str(data.get('error') or 'UNKNOWN'))
              print('RADAR_V6122_READONLY=' + str(data.get('readonly')))
              raise SystemExit(2)

          elapsed_ms = int((time.monotonic() - started) * 1000)
          assert data.get('ok') is True
          assert data.get('readonly') is True
          assert data.get('rawPlayerDataExposed') is False
          assert data.get('mapVersion') == 'v6.12.2'
          print('RADAR_V6122_MAP=PASS')
          print('RADAR_V6122_ELAPSED_MS=' + str(elapsed_ms))
          print('RADAR_V6122_CYCLE_COUNT=' + str(data.get('cycleCount', 0)))
          print('RADAR_V6122_EDGE_COUNT=' + str(data.get('edgeCount', 0)))
          for row in data.get('cycles') or []:
              members = ','.join(str(x.get('serverId','')) + ':' + str(x.get('observations',0)) for x in row.get('servers') or [])
              print('CYCLE|{cycle}|servers={count}|{members}'.format(
                  cycle=row.get('cycleId',''), count=row.get('serverCount',0), members=members))
          for row in data.get('edges') or []:
              print('EDGE|{a}|{b}|cyclesTogether={n}'.format(
                  a=row.get('serverA',''), b=row.get('serverB',''), n=row.get('cyclesTogether',0)))
          PY
