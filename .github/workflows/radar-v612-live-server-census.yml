name: Radar V6.14 live historical cycle-state probe

on:
  push:
    branches: [radar-v612-live-census-probe]
    paths:
      - '.github/workflows/radar-v612-live-server-census.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RADAR_CONNECTOR_URL: https://chachavps.tail3ab05a.ts.net

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read historical cycle-state graph V6.14
        env:
          RADAR_CONNECTOR_SHARED_KEY: ${{ secrets.RADAR_CONNECTOR_SHARED_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, hmac, json, os, secrets, time, urllib.error, urllib.request

          base = os.environ['RADAR_CONNECTOR_URL'].rstrip('/')
          key = os.environ['RADAR_CONNECTOR_SHARED_KEY'].encode()
          path = '/v1/collector/server-cycle-history'
          ts = str(int(time.time()))
          nonce = secrets.token_hex(16)
          body_hash = hashlib.sha256(b'').hexdigest()
          canonical = '\n'.join(['GET', path, ts, nonce, body_hash])
          sig = hmac.new(key, canonical.encode(), hashlib.sha256).hexdigest()
          req = urllib.request.Request(base + path, method='GET', headers={
              'X-Radar-Timestamp': ts,
              'X-Radar-Nonce': nonce,
              'X-Radar-Signature': sig,
          })
          started = time.monotonic()
          try:
              with urllib.request.urlopen(req, timeout=40) as response:
                  data = json.loads(response.read().decode())
          except urllib.error.HTTPError as exc:
              body = exc.read().decode(errors='replace')
              try:
                  data = json.loads(body)
              except Exception:
                  data = {'error': 'NON_JSON_ERROR'}
              print('RADAR_V614_HTTP_STATUS=' + str(exc.code))
              print('RADAR_V614_ERROR=' + str(data.get('error') or 'UNKNOWN'))
              print('RADAR_V614_READONLY=' + str(data.get('readonly')))
              raise SystemExit(2)

          elapsed_ms = int((time.monotonic() - started) * 1000)
          assert data.get('ok') is True
          assert data.get('readonly') is True
          assert data.get('rawPlayerDataExposed') is False
          assert data.get('mapVersion') == 'v6.14'
          assert data.get('clusterSemanticsProven') is False
          print('RADAR_V614_HISTORY=PASS')
          print('RADAR_V614_ELAPSED_MS=' + str(elapsed_ms))
          print('RADAR_V614_SEMANTICS=' + str(data.get('semantics','')))
          print('RADAR_V614_SERVER_ID_SOURCE=' + str(data.get('serverIdSource','')))
          print('RADAR_V614_ATTRIBUTION=' + str(data.get('underlyingAttribution','')))
          print('RADAR_V614_CLUSTER_SEMANTICS_PROVEN=' + str(data.get('clusterSemanticsProven')))
          print('RADAR_V614_CYCLE_COUNT=' + str(data.get('cycleCount',0)))
          print('RADAR_V614_EDGE_COUNT=' + str(data.get('edgeCount',0)))
          print('RADAR_V614_SEEN_ROWS=' + str(data.get('seenRows',0)))
          print('RADAR_V614_HASH_MATCHED=' + str(data.get('hashMatched',0)))
          print('RADAR_V614_HASH_MISMATCHED=' + str(data.get('hashMismatched',0)))
          print('RADAR_V614_UNRESOLVED=' + str(data.get('unresolved',0)))
          print('RADAR_V614_HASH_MATCH_RATE={:.9f}'.format(float(data.get('hashMatchRate',0))))
          for row in data.get('cycles') or []:
              members = ','.join(str(x.get('serverId','')) + ':' + str(x.get('observations',0)) for x in row.get('servers') or [])
              print('CYCLE|{cycle}|servers={count}|seen={seen}|matched={matched}|mismatched={mismatched}|unresolved={unresolved}|{members}'.format(
                  cycle=row.get('cycleId',''), count=row.get('serverCount',0), seen=row.get('seenRows',0),
                  matched=row.get('hashMatched',0), mismatched=row.get('hashMismatched',0), unresolved=row.get('unresolved',0), members=members))
          for row in data.get('edges') or []:
              print('EDGE|{a}|{b}|cyclesTogether={n}'.format(
                  a=row.get('serverA',''), b=row.get('serverB',''), n=row.get('cyclesTogether',0)))
          PY
