name: Radar V6.12 live server census

on:
  push:
    branches: [radar-v612-live-census-probe]
    paths:
      - '.github/workflows/radar-v612-live-server-census.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RADAR_CONNECTOR_URL: https://chachavps.tail3ab05a.ts.net

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read explainable server cluster evidence V6.12.3
        env:
          RADAR_CONNECTOR_SHARED_KEY: ${{ secrets.RADAR_CONNECTOR_SHARED_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, hmac, json, os, secrets, time, urllib.error, urllib.request

          base = os.environ['RADAR_CONNECTOR_URL'].rstrip('/')
          key = os.environ['RADAR_CONNECTOR_SHARED_KEY'].encode()
          path = '/v1/collector/server-cluster-evidence'
          ts = str(int(time.time()))
          nonce = secrets.token_hex(16)
          body_hash = hashlib.sha256(b'').hexdigest()
          canonical = '\n'.join(['GET', path, ts, nonce, body_hash])
          sig = hmac.new(key, canonical.encode(), hashlib.sha256).hexdigest()
          req = urllib.request.Request(base + path, method='GET', headers={
              'X-Radar-Timestamp': ts,
              'X-Radar-Nonce': nonce,
              'X-Radar-Signature': sig,
          })
          started = time.monotonic()
          try:
              with urllib.request.urlopen(req, timeout=40) as response:
                  data = json.loads(response.read().decode())
          except urllib.error.HTTPError as exc:
              body = exc.read().decode(errors='replace')
              try:
                  data = json.loads(body)
              except Exception:
                  data = {'error': 'NON_JSON_ERROR'}
              print('RADAR_V6123_HTTP_STATUS=' + str(exc.code))
              print('RADAR_V6123_ERROR=' + str(data.get('error') or 'UNKNOWN'))
              print('RADAR_V6123_READONLY=' + str(data.get('readonly')))
              raise SystemExit(2)

          elapsed_ms = int((time.monotonic() - started) * 1000)
          assert data.get('ok') is True
          assert data.get('readonly') is True
          assert data.get('rawPlayerDataExposed') is False
          assert data.get('evidenceVersion') == 'v6.12.3'
          print('RADAR_V6123_EVIDENCE=PASS')
          print('RADAR_V6123_ELAPSED_MS=' + str(elapsed_ms))
          print('RADAR_V6123_CYCLE_COUNT=' + str(data.get('cycleCount', 0)))
          print('RADAR_V6123_PERSISTENT_COUNT=' + str(data.get('persistentCount', 0)))
          print('RADAR_V6123_TRANSIENT_COUNT=' + str(data.get('transientCount', 0)))
          print('RADAR_V6123_CORE_EDGES=' + str(data.get('coreStrongEdges', 0)) + '/' + str(data.get('coreExpectedEdges', 0)))
          print('RADAR_V6123_CORE_CLIQUE_COMPLETE=' + str(data.get('coreCliqueComplete')))
          print('RADAR_V6123_LOW_VOLUME_THRESHOLD=' + str(data.get('lowVolumeThreshold')))
          for row in data.get('persistent') or []:
              print('PERSISTENT|{sid}|cycles={cycles}|coverage={coverage:.6f}|observations={obs}|mean={mean:.3f}|relative={relative:.6f}|class={cls}'.format(
                  sid=row.get('serverId',''), cycles=row.get('cyclesSeen',0), coverage=float(row.get('cycleCoverage',0)),
                  obs=row.get('observations',0), mean=float(row.get('meanObservationsPerCycle',0)),
                  relative=float(row.get('relativeVolumeToCoreMedian',0)), cls=row.get('evidenceClass','')))
          for row in data.get('transient') or []:
              print('TRANSIENT|{sid}|cycles={cycles}|coverage={coverage:.6f}|observations={obs}|mean={mean:.3f}|relative={relative:.6f}|class={cls}'.format(
                  sid=row.get('serverId',''), cycles=row.get('cyclesSeen',0), coverage=float(row.get('cycleCoverage',0)),
                  obs=row.get('observations',0), mean=float(row.get('meanObservationsPerCycle',0)),
                  relative=float(row.get('relativeVolumeToCoreMedian',0)), cls=row.get('evidenceClass','')))
          PY
