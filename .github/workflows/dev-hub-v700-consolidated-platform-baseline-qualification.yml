name: ChaCha DEV V7 consolidated platform baseline qualification

on:
  push:
    branches:
      - dev-hub-v700-consolidated-platform-baseline
    paths:
      - 'dev-hub/bin/install-v700-consolidated-platform-baseline.sh'
      - 'dev-hub/bin/build-v7-runtime-release.py'
      - 'dev-hub/bin/intendant-platform-consolidator.py'
      - 'dev-hub/bin/architecture-council-platform-consolidation-v7.py'
      - 'dev-hub/bin/autonomous-project-orchestrator.py'
      - 'dev-hub/config/platform-consolidation.v1.json'
      - 'dev-hub/config/platform-baseline.v7.json'
      - 'dev-hub/tests/test_v700_consolidated_platform_baseline.py'
      - 'dev-hub/tests/test_v623_contextual_memory_recall.py'
      - 'dev-hub/tests/test_v660_independent_accuracy_attestation.py'
      - 'dev-hub/tests/test_v661_real_world_evidence_isolated_candidate.py'
      - 'dev-hub/tests/test_v663_runtime_surface_instrumentation_readiness.py'
      - 'dev-hub/tests/test_v664_real_instrumented_project_acceptance_council.py'
      - '.github/workflows/dev-hub-v700-consolidated-platform-baseline-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static validation
        run: |
          set -euo pipefail
          if [ -f dev-hub/bin/install-v700-consolidated-platform-baseline.sh ]; then
            bash -n dev-hub/bin/install-v700-consolidated-platform-baseline.sh
          fi
          python3 -m py_compile             dev-hub/bin/build-v7-runtime-release.py             dev-hub/bin/intendant-platform-consolidator.py             dev-hub/bin/architecture-council-platform-consolidation-v7.py             dev-hub/bin/autonomous-project-orchestrator.py             dev-hub/tests/test_v700_consolidated_platform_baseline.py
          python3 -m json.tool dev-hub/config/platform-consolidation.v1.json >/dev/null
          python3 -m json.tool dev-hub/config/platform-baseline.v7.json >/dev/null
          grep -Fq '"version":"7.0.0"' dev-hub/bin/autonomous-project-orchestrator.py
      - name: V7 canonical consolidation qualification
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v700_consolidated_platform_baseline.py | tee /tmp/v700.out
          grep -Fq 'CHACHA_DEV_V700_CANONICAL_BASELINE=PASS' /tmp/v700.out
          grep -Fq 'CHACHA_DEV_V700_COMPILED_RUNTIME=PASS' /tmp/v700.out
          grep -Fq 'CHACHA_DEV_V700_INTENDANT_CONSOLIDATOR=PASS' /tmp/v700.out
          grep -Fq 'CHACHA_DEV_V700_ARCHITECTURE_COUNCIL_CONSOLIDATION=PASS' /tmp/v700.out
          grep -Fq 'CHACHA_DEV_V700_THREE_RELEASE_RETENTION=PASS' /tmp/v700.out
          grep -Fq 'CHACHA_DEV_V700_RADAR_PROJECT_ONLY=PASS' /tmp/v700.out
          grep -Fq 'CHACHA_DEV_V700_ACCEPTANCE_PRODUCTION_ACTIVATION=NO' /tmp/v700.out
          grep -Fq 'CHACHA_DEV_V700_GIT_HISTORY_PRESERVED=YES' /tmp/v700.out
          grep -Fq 'CHACHA_DEV_V700_CANONICAL_BUS_REWRITE=NO' /tmp/v700.out
          grep -Fq 'CHACHA_DEV_V700_BENCHMARK_EVIDENCE_MUTATION=NO' /tmp/v700.out
      - name: Critical historical invariants
        run: |
          set -euo pipefail
          for t in             dev-hub/tests/test_v660_independent_accuracy_attestation.py             dev-hub/tests/test_v661_real_world_evidence_isolated_candidate.py             dev-hub/tests/test_v663_runtime_surface_instrumentation_readiness.py             dev-hub/tests/test_v664_real_instrumented_project_acceptance_council.py; do
            PYTHONPATH=dev-hub/bin python3 "$t"
          done
      - name: V7 qualification receipt
        run: |
          echo CHACHA_DEV_V700_QUALIFICATION=PASS
          echo CANONICAL_VERSION=7.0.0
          echo OWNER_AGENT=intendant
          echo COMPILED_RUNTIME=PASS
          echo THREE_RELEASE_RETENTION=PASS
          echo GIT_HISTORY_PRESERVED=YES
          echo REMOTE_BRANCH_AUTO_DELETE=NO
          echo CANONICAL_OBSERVATION_BUS_REWRITE=NO
          echo BENCHMARK_EVIDENCE_MUTATION=NO
          echo SELF_MUTATION=NO
          echo SELF_PROMOTION=NO
          echo ARCHITECTURE_COUNCIL_FINAL_AUTHORITY=YES
          echo AUTOMATIC_EXTERNAL_SPEND_EUR=0
