name: Radar V6.19.4 Autopilot qualification

on:
  push:
    branches: [radar-v6194-autopilot]
    paths:
      - '.radar-release-src/v6194-source/**'
      - '.github/scripts/patch-radar-autopilot-v6194.py'
      - '.github/scripts/patch-radar-worker-autopilot-v6194.py'
      - '.github/scripts/patch-live-radar-autopilot-v6194.py'
      - '.github/workflows/radar-v6194-autopilot-qualification.yml'
      - 'radar-vps/install-v6194-pilot.sh'
      - 'radar-vps/probe-v6194-pilot-runtime.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wfgg-radar-v6194-autopilot
  cancel-in-progress: true

env:
  LASTWAR_CLIENT_REF: ee5f64de160a8051c2f9f98189b75038dd225a0a

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-v6194-autopilot
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Reconstruct cumulative V6.19.4 candidate
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar /tmp/lastwar-client
          mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          echo '234df1dec57f6211bc625855bf13350c9f17fbd843fbe92d8cf1ab7cb5c081ef  /tmp/radar-src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar
          rm -rf /tmp/wfgg-radar/connector-go
          cp -a .radar-release-src/v2-source/connector-go /tmp/wfgg-radar/connector-go

          python3 .github/scripts/patch-radar-target-profile-retry.py
          python3 .github/scripts/patch-radar-federated-diagnostics-v65.py
          python3 .github/scripts/patch-player-scan-v3.py
          python3 .github/scripts/patch-player-scan-v4.py
          python3 .github/scripts/patch-radar-protocol-discovery-v67.py
          python3 .github/scripts/patch-radar-profile-isolation-v68.py
          python3 .github/scripts/patch-radar-native-profile-v69.py
          python3 .github/scripts/patch-radar-native-profile-handshake-v691.py
          python3 .github/scripts/patch-radar-native-profile-exec-v692.py
          python3 .github/scripts/patch-radar-connector-runtime-v693.py
          python3 .github/scripts/patch-radar-cluster-catalog-budget-v6192.py
          python3 .github/scripts/patch-radar-seed-scout-v6193.py
          python3 .github/scripts/patch-radar-autopilot-v6194.py

          install -m 0644 .radar-release-src/v2-source/src/game/remote-transport.js /tmp/wfgg-radar/src/game/remote-transport.js
          python3 .github/scripts/patch-radar-async-collector-worker.py
          python3 .github/scripts/patch-radar-worker-rich-profile-v6191.py
          python3 .github/scripts/patch-radar-worker-seed-scout-v6193.py
          python3 .github/scripts/patch-radar-worker-autopilot-v6194.py

          install -m 0644 radar-ui-live/live-radar.html /tmp/wfgg-radar/public/live-radar.html
          python3 .github/scripts/patch-live-radar-seed-scout-v6193.py
          python3 .github/scripts/patch-live-radar-autopilot-v6194.py

          grep -Fq 'WFGG_RADAR_AUTOPILOT_ROUTE_V6194' /tmp/wfgg-radar/connector-go/cmd/radar-connector/main.go
          grep -Fq 'WFGG_RADAR_PARTIAL_CYCLE_MARKER_V617' /tmp/wfgg-radar/connector-go/cmd/radar-connector/collector_jobs.go
          grep -Fq 'WFGG_RADAR_AUTOPILOT_WORKER_V6194' /tmp/wfgg-radar/src/worker.js
          grep -Fq 'WFGG_RADAR_AUTOPILOT_UI_V6194' /tmp/wfgg-radar/public/live-radar.html
          echo RADAR_V6194_RECONSTRUCT=PASS

      - name: Test and build connector
        working-directory: /tmp/wfgg-radar/connector-go
        run: |
          set -euo pipefail
          gofmt -w ./cmd ./internal
          go test ./...
          go vet ./...
          mkdir -p "$GITHUB_WORKSPACE/radar-vps/pilot-v6194"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o "$GITHUB_WORKSPACE/radar-vps/pilot-v6194/radar-connector" ./cmd/radar-connector
          test -s "$GITHUB_WORKSPACE/radar-vps/pilot-v6194/radar-connector"
          echo RADAR_V6194_CONNECTOR=PASS

      - name: Build unchanged qualified native helper
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/ljagiello/lastwar-client.git /tmp/lastwar-client
          cd /tmp/lastwar-client
          git fetch --quiet --depth 1 origin "$LASTWAR_CLIENT_REF"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$LASTWAR_CLIENT_REF"

          mkdir -p cmd/wfgg-radar-native-template
          cp /tmp/wfgg-radar/connector-go/native-template/main.go cmd/wfgg-radar-native-template/main.go
          cp /tmp/wfgg-radar/connector-go/native-template/player_scan_v3.go cmd/wfgg-radar-native-template/player_scan_v3.go
          cp /tmp/wfgg-radar/connector-go/native-template/player_scan_v4.go cmd/wfgg-radar-native-template/player_scan_v4.go
          cp /tmp/wfgg-radar/connector-go/native-template/profile_scan_v69.go cmd/wfgg-radar-native-template/profile_scan_v69.go
          cp /tmp/wfgg-radar/connector-go/native-template/profile_scan_v69_test.go cmd/wfgg-radar-native-template/profile_scan_v69_test.go
          cp /tmp/wfgg-radar/connector-go/native-template/profile_rich_fields_v619_test.go cmd/wfgg-radar-native-template/profile_rich_fields_v619_test.go
          gofmt -w cmd/wfgg-radar-native-template/*.go
          go test -tags lastwar_native_template ./cmd/wfgg-radar-native-template
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags lastwar_native_template -trimpath -ldflags='-s -w' -o "$GITHUB_WORKSPACE/radar-vps/pilot-v6194/radar-native-template" ./cmd/wfgg-radar-native-template
          echo RADAR_V6194_NATIVE=PASS

      - name: Qualify Worker and UI
        run: |
          set -euo pipefail
          node --check /tmp/wfgg-radar/src/worker.js
          grep -Fq '/api/radar/autopilot/start' /tmp/wfgg-radar/src/worker.js
          grep -Fq '/api/radar/autopilot/status' /tmp/wfgg-radar/src/worker.js
          grep -Fq '/api/radar/autopilot/stop' /tmp/wfgg-radar/src/worker.js
          grep -Fq 'DÉMARRER L’AUTOPILOT' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'ARRÊTER L’AUTOPILOT' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'fonctionne téléphone verrouillé' /tmp/wfgg-radar/public/live-radar.html
          echo RADAR_V6194_SURFACES=PASS

      - name: Verify Autopilot safety contract
        run: |
          set -euo pipefail
          bash -n radar-vps/install-v6194-pilot.sh
          bash -n radar-vps/probe-v6194-pilot-runtime.sh
          SRC=.radar-release-src/v6194-source/connector-go/cmd/radar-connector/server_autopilot_v6194.go
          grep -Fq 'GameReadonly:' "$SRC"
          grep -Fq 'GameMutation:' "$SRC"
          grep -Fq 'TokenPersisted:' "$SRC"
          grep -Fq 'BrowserRequired:' "$SRC"
          grep -Fq 'classifyAutopilotCycleV6194' "$SRC"
          grep -Fq 'RegionsCompleted == 9 && job.RegionsFailed == 0' "$SRC"
          grep -Fq 'AUTOPILOT_PARTIAL_RETRY_LIMIT' "$SRC"
          ! grep -REiq 'building\.production\.collect|mail\.reward|al\.science\.donate|visitor\.operate|march|attack|purchase'             .radar-release-src/v6194-source .github/scripts/patch-radar-autopilot-v6194.py
          echo RADAR_V6194_LASTWAR_MUTATION=NO
          echo RADAR_V6194_PARTIAL_CYCLES_COUNT_AS_CONFIRMATION=NO
          echo RADAR_V6194_TOKEN_PERSISTENCE=NO
          echo RADAR_V6194_SAFETY=PASS

      - name: Publish qualified pilot artifacts
        run: |
          set -euo pipefail
          chmod 0755 radar-vps/pilot-v6194/radar-connector radar-vps/pilot-v6194/radar-native-template
          (
            cd radar-vps/pilot-v6194
            sha256sum radar-connector radar-native-template > SHA256SUMS
          )
          {
            echo "WFGG_RADAR_PILOT=V6.19.4"
            echo "SOURCE_BRANCH=radar-v6194-autopilot"
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "CHANGE=server-side-autopilot"
            echo "FULL_CYCLES_PER_CLUSTER=3"
            echo "PARTIAL_CYCLES_COUNT=NO"
            echo "PHONE_REQUIRED=NO"
            echo "LASTWAR_MUTATION=NO"
            echo "COLLECTOR_MUTATION=YES"
            echo "TOKEN_PERSISTENCE=NO"
          } > radar-vps/pilot-v6194/PILOT_INFO.txt
          {
            sha256sum /tmp/wfgg-radar/src/worker.js
            sha256sum /tmp/wfgg-radar/src/game/remote-transport.js
            sha256sum /tmp/wfgg-radar/public/live-radar.html
          } > radar-vps/pilot-v6194/CLOUDFLARE_SHA256SUMS

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar-vps/pilot-v6194
          if git diff --cached --quiet; then
            echo RADAR_V6194_PILOT=UNCHANGED
            exit 0
          fi
          git commit -m 'build(radar): publish V6.19.4 Autopilot pilot'
          git push origin HEAD:radar-v6194-autopilot
          echo RADAR_V6194_PILOT=PUBLISHED
