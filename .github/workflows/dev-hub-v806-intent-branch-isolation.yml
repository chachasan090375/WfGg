name: ChaCha DEV V8.0.6 Intent Branch Isolation

on:
  push:
    branches:
      - dev-hub-v806-intent-branch-isolation
    paths:
      - 'dev-hub/bin/functional-intent-orchestrator.py'
      - 'dev-hub/bin/architecture-decision-council.py'
      - 'dev-hub/bin/autonomous-project-orchestrator.py'
      - 'dev-hub/tests/test_v806_intent_branch_isolation.py'
      - '.github/workflows/dev-hub-v806-intent-branch-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: |
          set -euo pipefail
          python3 -m py_compile             dev-hub/bin/functional-intent-orchestrator.py             dev-hub/bin/architecture-decision-council.py             dev-hub/bin/autonomous-project-orchestrator.py             dev-hub/tests/test_v806_intent_branch_isolation.py
      - name: V8.0.6 qualification
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v806_intent_branch_isolation.py | tee /tmp/v806.out
          grep -Fq 'CHACHA_DEV_V806_PROMOTION_DOES_NOT_MATCH_MOTION=PASS' /tmp/v806.out
          grep -Fq 'CHACHA_DEV_V806_BUILD_DOES_NOT_MATCH_UI=PASS' /tmp/v806.out
          grep -Fq 'CHACHA_DEV_V806_REAL_MOTION_STILL_MATCHES_ANIMATION=PASS' /tmp/v806.out
          grep -Fq 'CHACHA_DEV_V806_PACKAGE_LOCAL_BRANCH_BLOCKING=PASS' /tmp/v806.out
          grep -Fq 'CHACHA_DEV_V806_REAL_BLOCKER_ROUTING=PASS' /tmp/v806.out
          grep -Fq 'CHACHA_DEV_V806_AUTOMATIC_EXTERNAL_SPEND_EUR=0' /tmp/v806.out
