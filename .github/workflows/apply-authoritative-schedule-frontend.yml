name: Apply authoritative Train schedule frontend

on:
  push:
    branches: [train-bridge-phase3]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[authoritative-frontend-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: train-bridge-phase3
      - name: Patch frontend bridge
        run: python .github/scripts/train_authoritative_schedule_bridge.py
      - name: Validate bridge
        run: |
          node --check frontend/_worker.js
          grep -q 'WFGG_TRAIN_AUTHORITATIVE_SCHEDULE_V1' frontend/_worker.js
          grep -q 'wfgg_bridge=v14' frontend/_worker.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/_worker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: use authoritative server schedule in Train [authoritative-frontend-auto]'
          git push origin HEAD:train-bridge-phase3
