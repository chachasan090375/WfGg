name: Sentinel source diagnostics v10

on:
  push:
    branches:
      - sentinel-source-diagnostics-v10
    paths:
      - 'scripts/patch-sentinel-source-diagnostics-v10.py'
      - 'scripts/generate-sentinel-source-map-v10.mjs'
      - '.github/workflows/sentinel-source-diagnostics-v10.yml'
      - '.github/workflows/deploy-cloudflare-pages-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sentinel-source-diagnostics-v10
          fetch-depth: 0

      - name: Apply Sentinel V10 patch
        run: python3 scripts/patch-sentinel-source-diagnostics-v10.py

      - name: Generate build source index
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/generate-sentinel-source-map-v10.mjs

      - name: Validate syntax and observer contract
        run: |
          node --check frontend/_worker.js
          node --check frontend/train-native/sentinel-train-v1.js
          grep -q 'sentinel-edge-v10' frontend/_worker.js
          grep -q 'WFGG_SENTINEL_REPORT_V3' frontend/train-native/sentinel-train-v1.js
          grep -q 'historique résolu' frontend/train-native/sentinel-train-v1.js
          grep -q "X-WfGg-Sentinel-Diagnostic':'v10" frontend/_worker.js
          grep -q 'sentinel-source-index' frontend/_worker.js
          grep -q 'Source exacte:' frontend/_worker.js
          grep -q 'sentinel-portal-source-map-v10' frontend/sentinel-source-map-v10.json
          grep -q 'runSentinelAtPortalEdge' frontend/sentinel-source-map-v10.json
          grep -q 'readonly:true' frontend/_worker.js
          ! grep -A180 'WFGG_SENTINEL_AUTO_DIAGNOSTIC_V9' frontend/_worker.js | grep -E "method:'(POST|PUT|DELETE)'"

      - name: Validate existing Sentinel access contract
        run: |
          grep -q 'SENTINEL_SUPERVISOR_NAMES_V8' frontend/_worker.js
          grep -q "sentinelEffectiveRole(meCall.data)" frontend/_worker.js
          grep -q "return await sentinelPortalMeAtEdge(request)" frontend/_worker.js

      - name: Commit generated portal changes
        run: |
          if git diff --quiet -- frontend/_worker.js frontend/train-native/sentinel-train-v1.js; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/_worker.js frontend/train-native/sentinel-train-v1.js
          git commit -m 'feat(sentinel): source-level autonomous diagnostics v10'
          git push origin HEAD:sentinel-source-diagnostics-v10
