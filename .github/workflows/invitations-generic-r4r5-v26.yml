name: Portail v26 generic R4 R5 invitation thanks

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/invitations-generic-r4r5-v26.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/patch-invitations-generic-r4r5-v26.py
      - name: Validate
        run: |
          node --check frontend/portal-invitations-v1.js
          node --check frontend/portal-invitations-lastwar-safe-v1.js
          grep -Fq 'bureau R4/R5' frontend/portal-invitations-v1.js
          grep -Fq 'bureau R4/R5' frontend/portal-invitations-lastwar-safe-v1.js
          grep -Fq 'v26=generic-r4r5-thanks' frontend/index.html
          grep -Fq 'v=004-generic-r4r5-thanks' frontend/index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/portal-invitations-v1.js frontend/portal-invitations-lastwar-safe-v1.js frontend/index.html .github/qa/portal-invitations-recette.mjs
          git diff --cached --check
          git commit -m 'Portail v26: remercier génériquement le bureau R4-R5'
          git push origin HEAD:main
