name: Sentinel supervisor edge v8

on:
  push:
    branches:
      - sentinel-supervisor-edge-fallback-v8
    paths:
      - 'scripts/patch-sentinel-supervisor-edge-v8.mjs'
      - '.github/workflows/sentinel-supervisor-edge-v8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sentinel-supervisor-edge-fallback-v8
          fetch-depth: 0
      - name: Apply edge fallback patch
        run: node scripts/patch-sentinel-supervisor-edge-v8.mjs
      - name: Validate syntax and access contract
        run: |
          node --check frontend/_worker.js
          grep -q 'WFGG_SENTINEL_SUPERVISOR_FALLBACK_V8' frontend/_worker.js
          grep -q "SENTINEL_SUPERVISOR_NAMES_V8" frontend/_worker.js
          grep -q "sentinelEffectiveRole(meCall.data)" frontend/_worker.js
          grep -q "return await sentinelPortalMeAtEdge(request)" frontend/_worker.js
          grep -q "version:'sentinel-edge-v8'" frontend/_worker.js
          grep -q "can_use_sentinel:true" frontend/_worker.js
          grep -q "\['R4','R5'\].includes(rank)" frontend/_worker.js
      - name: Commit generated edge change
        run: |
          if git diff --quiet -- frontend/_worker.js; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/_worker.js
          git commit -m 'fix(sentinel): authorize configured supervisors at Pages edge'
          git push origin HEAD:sentinel-supervisor-edge-fallback-v8
