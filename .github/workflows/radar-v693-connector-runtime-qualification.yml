name: Radar V6.9.3 connector runtime fingerprint qualification

on:
  push:
    branches: [radar-v693-connector-runtime-fingerprint]
    paths:
      - '.github/workflows/radar-v693-connector-runtime-qualification.yml'
      - '.github/workflows/radar-v69-build.yml'
      - '.github/scripts/patch-radar-connector-runtime-v693.py'
      - '.radar-release-src/v693-source/**'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-v693-connector-runtime-fingerprint
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Reconstruct connector through V6.9.3
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar
          mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          echo '234df1dec57f6211bc625855bf13350c9f17fbd843fbe92d8cf1ab7cb5c081ef  /tmp/radar-src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar
          rm -rf /tmp/wfgg-radar/connector-go
          cp -a .radar-release-src/v2-source/connector-go /tmp/wfgg-radar/connector-go
          python3 .github/scripts/patch-radar-target-profile-retry.py
          python3 .github/scripts/patch-radar-federated-diagnostics-v65.py
          python3 .github/scripts/patch-player-scan-v3.py
          python3 .github/scripts/patch-player-scan-v4.py
          python3 .github/scripts/patch-radar-protocol-discovery-v67.py
          python3 .github/scripts/patch-radar-profile-isolation-v68.py
          python3 .github/scripts/patch-radar-native-profile-v69.py
          python3 .github/scripts/patch-radar-native-profile-handshake-v691.py
          python3 .github/scripts/patch-radar-native-profile-exec-v692.py
          python3 .github/scripts/patch-radar-connector-runtime-v693.py

      - name: Test V6.9.3 runtime fingerprint
        working-directory: /tmp/wfgg-radar/connector-go
        run: |
          set -euo pipefail
          gofmt -w ./cmd ./internal
          go test ./...
          go test ./cmd/radar-connector -run TestConnectorRuntimeDiagnosticsV693 -count=1
          go vet ./...
          grep -Fq 'WFGG_RADAR_CONNECTOR_RUNTIME_FINGERPRINT_V693' cmd/radar-connector/runtime_fingerprint_v693.go
          grep -Fq 'WFGG_RADAR_CONNECTOR_RUNTIME_HEALTH_V693' cmd/radar-connector/main.go
          grep -Fq 'connectorRuntime' cmd/radar-connector/main.go
          grep -Fq 'profileExecDiagnostics' cmd/radar-connector/runtime_fingerprint_v693.go
          grep -Fq 'WFGG_RADAR_NATIVE_PROFILE_EXEC_BRIDGE_V692' internal/protocol/profile_scan_v69.go
          ! grep -Fq 'return nil, errors.New("LASTWAR_PLAYER_PROFILE_FAILED")' internal/protocol/profile_scan_v69.go
          echo RADAR_V693_CONNECTOR_RUNTIME=QUALIFIED

      - name: Verify production build runtime gate
        run: |
          set -euo pipefail
          grep -Fq 'patch-radar-connector-runtime-v693.py' .github/workflows/radar-v69-build.yml
          grep -Fq 'Certify live V6.9.3 connector runtime' .github/workflows/radar-v69-build.yml
          grep -Fq 'RADAR_V693_CONNECTOR_RUNTIME=PASS' .github/workflows/radar-v69-build.yml
          grep -Fq 'profileExecDiagnostics' .github/workflows/radar-v69-build.yml
          grep -Fq 'EXPECTED_CONNECTOR' .github/workflows/radar-v69-build.yml
          echo RADAR_V693_FINAL_BUILD_GATE=QUALIFIED
