name: ChaCha DEV V7 Guardian coverage sync

on:
  push:
    branches:
      - 'dev-hub-v7*'
    paths:
      - 'dev-hub/config/v730-release-gates.v1.json'
      - 'dev-hub/config/guardian-coverage-manifest.v1.json'
      - 'dev-hub/bin/install-v730-direct-operator-android-widget.sh'
      - 'dev-hub/bin/direct-operator-service.py'
      - 'dev-hub/bin/functional-translator-agent.py'
      - 'dev-hub/config/direct-operator.v1.json'
      - 'dev-hub/config/functional-translator-satellite.v1.json'
      - 'dev-hub/bin/progress_state_controller.py'
      - 'dev-hub/bin/live_ui_publisher.py'
      - 'dev-hub/bin/native_update_publisher.py'
      - 'dev-hub/bin/android_release_signer.py'
      - 'dev-hub/bin/object-factory.py'
      - 'dev-hub/config/progress-reporting.v1.json'
      - 'dev-hub/config/android-live-shell.v1.json'
      - 'dev-hub/config/android-native-update.v1.json'
      - 'dev-hub/config/android-release-signing.v1.json'
      - 'dev-hub/config/object-factory.v1.json'
      - 'dev-hub/bin/install-v780-runtime-convergence.sh'
      - 'dev-hub/bin/install-v720-human-interface-gateway.sh'
      - 'dev-hub/bin/human-interface-gateway.py'
      - 'dev-hub/bin/central-interface-controller.py'
      - 'dev-hub/config/human-interface-gateway.v1.json'
      - '.github/workflows/dev-hub-v720-human-interface-gateway-qualification.yml'
      - '.github/workflows/dev-hub-v7-platform-qualification.yml'
      - '.github/workflows/dev-hub-v7-guardian-contract-sync.yml'
      - '.github/workflows/dev-hub-v730-direct-operator-qualification.yml'
      - '.github/workflows/dev-hub-v7-guardian-coverage-sync.yml'
      - '.github/workflows/dev-hub-v780-runtime-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate Guardian coverage manifest
        run: |
          set -euo pipefail
          python3 -m json.tool dev-hub/config/guardian-coverage-manifest.v1.json >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('dev-hub/config/guardian-coverage-manifest.v1.json'))
          rows=x.get('expected_components') or []
          by={c['component_id']:c for c in rows}
          g=by['human-interface-gateway']
          assert g['kind']=='interface',g
          assert g['criticality']=='CRITICAL',g
          assert g['proof']['file']=='dev-hub/bin/human-interface-gateway.py',g
          direct=by['direct-operator-service']
          translator=by['functional-translator-satellite']
          assert direct['kind']=='interface' and direct['criticality']=='CRITICAL',direct
          assert translator['kind']=='satellite-agent' and translator['criticality']=='CRITICAL',translator
          print('CHACHA_DEV_V7_GUARDIAN_GATEWAY_COVERAGE_STATIC=PASS')
          print('CHACHA_DEV_V7_GUARDIAN_DIRECT_OPERATOR_COVERAGE_STATIC=PASS')
          print('EXPECTED_COMPONENTS='+str(len(rows)))
          PY

      - name: Sync and verify Guardian expected components
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,urllib.parse,urllib.request,urllib.error
          token=os.environ.get('CLOUDFLARE_API_TOKEN','').strip()
          if not token: raise SystemExit('MISSING_SECRET=CLOUDFLARE_API_TOKEN')
          headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'}
          def call(url,method='GET',body=None):
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(url,headers=headers,method=method,data=data)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:return r.status,json.loads(r.read())
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try:p=json.loads(raw)
                  except Exception:p={'raw':raw[:800]}
                  return e.code,p
          aid=os.environ.get('CF_ACCOUNT_ID','').strip()
          if not aid:
              status,payload=call('https://api.cloudflare.com/client/v4/accounts?per_page=50')
              rows=(payload.get('result') or []) if status==200 else []
              if len(rows)!=1: raise SystemExit('CLOUDFLARE_ACCOUNT_RESOLUTION_FAILED')
              aid=rows[0]['id']
          status,payload=call('https://api.cloudflare.com/client/v4/accounts/'+aid+'/d1/database?name='+urllib.parse.quote('chacha-dev-guardian'))
          if status!=200: raise SystemExit('GUARDIAN_D1_LOOKUP_FAILED:'+str(status))
          db=next((x for x in (payload.get('result') or []) if x.get('name')=='chacha-dev-guardian'),None)
          if not db: raise SystemExit('GUARDIAN_D1_MISSING')
          query=f"https://api.cloudflare.com/client/v4/accounts/{aid}/d1/database/{db['uuid']}/query"
          coverage=json.load(open('dev-hub/config/guardian-coverage-manifest.v1.json',encoding='utf-8'))
          q=lambda s:"'"+str(s).replace("'","''")+"'"
          j=lambda v:json.dumps(v,separators=(',',':'),sort_keys=True)
          components=coverage.get('expected_components') or []
          sql=[]
          for c in components:
              dig=hashlib.sha256(j(c).encode()).hexdigest()
              source_criticality=str(c['criticality'])
              d1_criticality='CRITICAL' if source_criticality=='HIGH' else source_criticality
              if d1_criticality not in {'BLOCK','CRITICAL'}:
                  raise SystemExit('GUARDIAN_COVERAGE_UNSUPPORTED_CRITICALITY:'+source_criticality+':'+str(c['component_id']))
              sql.append("INSERT INTO expected_components(component_id,role,kind,enforcement_point,criticality,source_digest,updated_at) VALUES("
                         +q(c['component_id'])+','+q(c['role'])+','+q(c['kind'])+','+q(c['enforcement_point'])+','
                         +q(d1_criticality)+','+q(dig)+",datetime('now')) "
                         "ON CONFLICT(component_id) DO UPDATE SET role=excluded.role,kind=excluded.kind,"
                         "enforcement_point=excluded.enforcement_point,criticality=excluded.criticality,"
                         "source_digest=excluded.source_digest,updated_at=datetime('now') "
                         "WHERE expected_components.source_digest<>excluded.source_digest;")
          ids=[str(c['component_id']) for c in components]
          if ids:
              sql.append("DELETE FROM expected_components WHERE component_id NOT IN ("+",".join(q(x) for x in ids)+");")
          else:
              sql.append("DELETE FROM expected_components;")
          status,payload=call(query,'POST',{'sql':'\n'.join(sql)})
          if status!=200 or not payload.get('success'):
              raise SystemExit('GUARDIAN_COVERAGE_SYNC_FAILED:'+str(status)+':'+json.dumps(payload)[:600])
          expected=len(coverage.get('expected_components') or [])
          status,payload=call(query,'POST',{'sql':'SELECT component_id,criticality FROM expected_components ORDER BY component_id'})
          actual=[]
          for block in payload.get('result') or []: actual.extend(block.get('results') or [])
          ids={str(x.get('component_id')) for x in actual}
          if status!=200 or not payload.get('success') or len(actual)!=expected or not {'human-interface-gateway','direct-operator-service','functional-translator-satellite'} <= ids:
              raise SystemExit('GUARDIAN_COVERAGE_READBACK_FAILED:'+json.dumps(actual)[:1000])
          print('CHACHA_DEV_V7_GUARDIAN_COVERAGE_SYNC=PASS')
          print('CHACHA_DEV_V7_GUARDIAN_GATEWAY_EXPECTED=YES')
          print('CHACHA_DEV_V7_GUARDIAN_DIRECT_OPERATOR_EXPECTED=YES')
          print('EXPECTED_COMPONENTS='+str(expected))
          print('D1_SYNC_MODE=DIGEST_AWARE_DELTA')
          print('D1_CRITICALITY_COMPATIBILITY=HIGH_TO_CRITICAL')
          print('FULL_TABLE_REWRITE=NO')
          print('AUTOMATIC_EXTERNAL_SPEND_EUR=0')
          PY
