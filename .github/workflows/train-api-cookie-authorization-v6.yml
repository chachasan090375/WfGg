name: Train API cookie authorization v6

on:
  push:
    branches:
      - fix-train-api-cookie-authorization-v6

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-train-api-cookie-authorization-v6
          fetch-depth: 0

      - name: Apply portal bridge patch
        run: python3 .github/scripts/train_api_cookie_authorization_v6.py

      - name: Validate portal worker source
        run: |
          node --check frontend/_worker.js
          grep -q 'WFGG_TRAIN_API_COOKIE_AUTH_DUAL_TRANSPORT_V6' frontend/_worker.js
          grep -q "headers.set('Authorization', 'Bearer ' + cookiePortalTrainToken)" frontend/_worker.js
          grep -q "headers.set('X-WfGg-Portal-Bridge', 'cookie-auth-v6')" frontend/_worker.js

      - name: Commit tested portal patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/_worker.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix(train): dual transport portal cookie to backend v6'
          git push origin HEAD:fix-train-api-cookie-authorization-v6
