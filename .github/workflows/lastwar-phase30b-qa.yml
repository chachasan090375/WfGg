name: LastWar phase30b node payload QA

on:
  workflow_dispatch:
  push:
    branches:
      - portal-auth-lastwar-lab-v1
    paths:
      - 'scripts/lastwar-phase30b-node-payload-extraction.sh'
      - '.github/workflows/lastwar-phase30b-qa.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate shell syntax
        run: bash -n scripts/lastwar-phase30b-node-payload-extraction.sh
      - name: Validate embedded Python syntax
        run: |
          set -euo pipefail
          awk '/^cat > "\$PY" <<'"'"'PYEOF'"'"'$/{f=1;next} /^PYEOF$/{if(f){exit}} f{print}' scripts/lastwar-phase30b-node-payload-extraction.sh > /tmp/phase30b.py
          python -m py_compile /tmp/phase30b.py
      - name: Enforce offline node fallback contract
        run: |
          set -euo pipefail
          f=scripts/lastwar-phase30b-node-payload-extraction.sh
          grep -q 'OFFLINE ONLY' "$f"
          grep -q 'UnityPy.load(td)' "$f"
          grep -q 'node payload' "$f"
          grep -q 'hero_mapping_requires_established_name_in_object_name=true' "$f"
          ! grep -Eq 'curl |wget |requests\.|urllib\.request|socket\.' "$f"
