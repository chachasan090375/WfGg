name: Train runtime roster integration recette

on:
  push:
    branches: [fix-train-runtime-roster-integration-v1]
    paths:
      - '.github/scripts/apply-train-runtime-roster-integration-v1.py'
      - '.github/workflows/train-runtime-roster-integration-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-recette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-train-runtime-roster-integration-v1
          fetch-depth: 0
      - name: Apply runtime patch
        run: python3 .github/scripts/apply-train-runtime-roster-integration-v1.py
      - name: Validate JavaScript and runtime simulation
        run: |
          node --check frontend/_worker.js
          node --check frontend/train-native/app.v15.js
          node --check /tmp/train-runtime-roster-sim.js
          grep -Fq 'WFGG_TRAIN_ROSTER_INTEGRATION_UI_RUNTIME_V1' frontend/_worker.js
          grep -Fq 'WFGG_ROSTER_INTEGRATION_UI_V1' /tmp/train-runtime-roster-sim.js
          grep -Fq 'rotationIntegrationStatus' /tmp/train-runtime-roster-sim.js
          grep -Fq 'remainingCount' /tmp/train-runtime-roster-sim.js
          grep -Fq "vip: ['R3']" /tmp/train-runtime-roster-sim.js
          grep -Fq '🎁 R2 / R1' /tmp/train-runtime-roster-sim.js
          grep -Fq '🧭 Intégrations en cours' /tmp/train-runtime-roster-sim.js
          grep -Fq 'WFGG_ROSTER_INTEGRATION_UI_V1' .github/workflows/production-recette.yml
          sha256sum -c frontend/train-native/app.v15.js.sha256
          git diff --check
      - name: Commit tested runtime files
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/_worker.js frontend/train-native/README.md frontend/train-native/app.v15.js.sha256 .github/workflows/production-recette.yml
          git commit -m 'fix(train): apply roster integration to production runtime'
          git push origin HEAD:fix-train-runtime-roster-integration-v1
