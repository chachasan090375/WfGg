name: Sovereign State Guardian Schedule Quiescence Check

on:
  push:
    branches:
      - 'roadmap-master-train-20261003-14-sovereign-state-fabric'
    paths:
      - '.github/workflows/sovereign-state-guardian-schedule-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Wait until Guardian Cron schedules are absent
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request
          token=os.environ['CF_API_TOKEN']; aid=os.environ.get('CF_ACCOUNT_ID','').strip()
          headers={'Authorization':'Bearer '+token}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:return json.loads(r.read())
          if not aid:
              rows=(get('https://api.cloudflare.com/client/v4/accounts?per_page=50').get('result') or [])
              if len(rows)!=1: raise SystemExit('CLOUDFLARE_ACCOUNT_RESOLUTION_FAILED')
              aid=rows[0]['id']
          url=f'https://api.cloudflare.com/client/v4/accounts/{aid}/workers/scripts/chacha-dev-guardian/schedules'
          for i in range(1,61):
              p=get(url); schedules=(p.get('result') or {}).get('schedules') or []
              print(json.dumps({'attempt':i,'schedule_count':len(schedules),'crons':[x.get('cron') for x in schedules]}))
              if not schedules:
                  print('CHACHA_DEV_GUARDIAN_CRON_QUIESCENCE=PASS')
                  raise SystemExit(0)
              time.sleep(15)
          raise SystemExit('GUARDIAN_CRON_PROPAGATION_NOT_COMPLETE')
          PY
