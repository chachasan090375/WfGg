name: WfGg Micheline loader patch

on:
  push:
    branches:
      - train-bridge-phase3

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[micheline-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: train-bridge-phase3
          fetch-depth: 0
      - name: Apply Micheline loader patch
        run: python .github/scripts/micheline_loader_patch.py
      - name: Validate worker syntax
        run: node --check frontend/_worker.js
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/_worker.js
          git commit -m 'feat: replace Train loader with vintage Micheline [micheline-auto]'
          git push origin HEAD:train-bridge-phase3
