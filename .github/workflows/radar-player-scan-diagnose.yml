name: Radar player scan diagnose

on:
  push:
    branches: [radar-production-v1]
    paths:
      - '.github/workflows/radar-player-scan-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct patched Radar and inspect scan error path
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar
          mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar
          base64 -d .radar-release-src/player-scan-v2.patch | gzip -dc > /tmp/player-scan-v2.patch
          cd /tmp/wfgg-radar
          git apply /tmp/player-scan-v2.patch
          echo '=== REMOTE TRANSPORT ==='
          sed -n '1,110p' src/game/remote-transport.js
          echo '=== CONNECTOR SCAN HANDLER ==='
          sed -n '100,155p' connector-go/cmd/radar-connector/main.go
          echo '=== NATIVE SCAN ERROR MAPPING ==='
          sed -n '120,180p' connector-go/internal/protocol/native_template.go
