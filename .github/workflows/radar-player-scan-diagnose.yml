name: Radar player scan diagnose

on:
  push:
    branches: [radar-production-v1]
    paths:
      - '.github/workflows/radar-player-scan-diagnose.yml'
      - 'radar-vps/test-player-scan-direct-vps-from-termux.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Termux diagnostic syntax
        run: |
          set -euo pipefail
          bash -n radar-vps/test-player-scan-direct-vps-from-termux.sh
          echo TERMUX_DIAGNOSTIC_SYNTAX=OK
      - name: Probe public ChaChaVPS funnel
        run: |
          set +e
          code="$(curl -sS -o /tmp/funnel-body.txt -w '%{http_code}' --max-time 20 https://chachavps.tail3ab05a.ts.net/v1/health)"
          echo "FUNNEL_HTTP=$code"
          echo -n 'FUNNEL_BODY='
          tr '\n' ' ' < /tmp/funnel-body.txt | head -c 400
          echo
          exit 0
      - name: Reconstruct patched Radar and inspect scan matcher
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar
          mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar
          base64 -d .radar-release-src/player-scan-v2.patch | gzip -dc > /tmp/player-scan-v2.patch
          cd /tmp/wfgg-radar
          git apply /tmp/player-scan-v2.patch
          echo '=== FIND SCAN TEMPLATE ==='
          awk '/^func findScanTemplate/{p=1} p{print} /^func runPlayerScan/{exit}' connector-go/native-template/main.go
