name: ChaCha DEV V6.20 Guardian corrective enforcement qualification

on:
  push:
    branches: [dev-hub-v620-guardian-corrective-enforcement]
    paths:
      - 'dev-hub/guardian/**'
      - 'dev-hub/bin/guardian-client.py'
      - 'dev-hub/bin/guardian-remediation-controller.py'
      - 'dev-hub/bin/guardian_remediation_runtime.py'
      - 'dev-hub/bin/agent_role_contracts.py'
      - 'dev-hub/bin/agent-role-contract-manager.py'
      - 'dev-hub/bin/agent-foundry-planner.py'
      - 'dev-hub/bin/dynamic_component_contracts.py'
      - 'dev-hub/bin/component-role-contract-manager.py'
      - 'dev-hub/bin/task-contract-binder.py'
      - 'dev-hub/bin/execution-scheduler.py'
      - 'dev-hub/bin/guardian-coverage-heartbeat.py'
      - 'dev-hub/bin/run-controller.py'
      - 'dev-hub/bin/autonomous-project-orchestrator.py'
      - 'dev-hub/bin/technology_watch_runtime.py'
      - 'dev-hub/bin/architecture-decision-council.py'
      - 'dev-hub/config/guardian-role-contracts.v1.json'
      - 'dev-hub/config/agent-foundry.v1.json'
      - 'dev-hub/config/guardian-runtime-policy.v1.json'
      - 'dev-hub/config/guardian-coverage-manifest.v1.json'
      - 'dev-hub/config/run-controller.v1.json'
      - 'dev-hub/systemd/chacha-dev-guardian-coverage-heartbeat.service'
      - 'dev-hub/systemd/chacha-dev-guardian-coverage-heartbeat.timer'
      - 'dev-hub/systemd/chacha-dev-guardian-remediation.service'
      - 'dev-hub/systemd/chacha-dev-guardian-remediation.timer'
      - 'dev-hub/tests/test_v620_guardian_corrective_enforcement.py'
      - 'dev-hub/bin/install-v620-guardian-corrective-enforcement.sh'
      - '.github/workflows/dev-hub-v620-guardian-corrective-enforcement-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-hub-v620-guardian-corrective-enforcement
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static validation
        run: |
          set -euo pipefail
          node --check dev-hub/guardian/worker.js
          python3 -m py_compile             dev-hub/bin/guardian-client.py \
            dev-hub/bin/guardian-remediation-controller.py \
            dev-hub/bin/guardian_remediation_runtime.py \
            dev-hub/bin/agent_role_contracts.py \
            dev-hub/bin/agent-role-contract-manager.py \
            dev-hub/bin/agent-foundry-planner.py \
            dev-hub/bin/dynamic_component_contracts.py \
            dev-hub/bin/component-role-contract-manager.py \
            dev-hub/bin/task-contract-binder.py \
            dev-hub/bin/execution-scheduler.py             dev-hub/bin/guardian-coverage-heartbeat.py             dev-hub/bin/run-controller.py             dev-hub/bin/autonomous-project-orchestrator.py             dev-hub/bin/technology_watch_runtime.py             dev-hub/bin/architecture-decision-council.py
          python3 -m json.tool dev-hub/config/guardian-role-contracts.v1.json >/dev/null
          python3 -m json.tool dev-hub/config/guardian-runtime-policy.v1.json >/dev/null
          python3 -m json.tool dev-hub/config/guardian-coverage-manifest.v1.json >/dev/null
          python3 -m json.tool dev-hub/config/run-controller.v1.json >/dev/null
          if [ -f dev-hub/bin/install-v620-guardian-corrective-enforcement.sh ]; then
            bash -n dev-hub/bin/install-v620-guardian-corrective-enforcement.sh
          fi
          echo CHACHA_DEV_V620_STATIC=PASS

      - name: Action leases and coverage watchdog
        run: |
          set -euo pipefail
          python3 dev-hub/tests/test_v620_guardian_corrective_enforcement.py

      - name: Governance invariants
        run: |
          set -euo pipefail
          grep -Fq '"all_governed_actions_require_realtime_verdict": true' dev-hub/config/guardian-runtime-policy.v1.json
          grep -Fq '"action_lease_required": true' dev-hub/config/guardian-runtime-policy.v1.json
          grep -Fq '"coverage_heartbeat_required": true' dev-hub/config/guardian-runtime-policy.v1.json
          grep -Fq '"low_risk_unavailable_verdict": "BLOCK"' dev-hub/config/guardian-runtime-policy.v1.json
          grep -Fq '"emergency-control-bridge"' dev-hub/config/guardian-runtime-policy.v1.json
          grep -Fq 'ACTION_ID_REQUIRED' dev-hub/guardian/worker.js
          grep -Fq 'POST_ACTION_MISSING' dev-hub/guardian/worker.js
          grep -Fq 'COVERAGE_HEARTBEAT_STALE' dev-hub/guardian/worker.js
          grep -Fq '"guardian_role_contract"' dev-hub/config/agent-foundry.v1.json
          grep -Fq 'dynamic_instance_contract_registration' dev-hub/guardian/worker.js
          grep -Fq 'CAPABILITY_OUTSIDE_AGENT_MISSION' dev-hub/guardian/worker.js
          grep -Fq 'dynamic_component_contract_registration' dev-hub/guardian/worker.js
          grep -Fq 'CAPABILITY_OUTSIDE_COMPONENT_MISSION' dev-hub/guardian/worker.js
          grep -Fq '"role:__branch__"' dev-hub/config/guardian-role-contracts.v1.json
          grep -Fq '"role:__dynamic-orchestrator__"' dev-hub/config/guardian-role-contracts.v1.json
          grep -Fq 'task_contract_binding_protocol:true' dev-hub/guardian/worker.js
          grep -Fq 'TASK_CONTRACT_IDENTITY_DRIFT' dev-hub/guardian/worker.js
          grep -Fq '"task_contract_binding_required_in_execute_mode": true' dev-hub/config/run-controller.v1.json
          grep -Fq '"corrective_enforcement": {' dev-hub/config/guardian-runtime-policy.v1.json
          grep -Fq '"guardian_may_issue_directives": true' dev-hub/config/guardian-runtime-policy.v1.json
          grep -Fq '"guardian_may_enforce_holds": true' dev-hub/config/guardian-runtime-policy.v1.json
          grep -Fq '"guardian_may_rewrite_architecture": false' dev-hub/config/guardian-runtime-policy.v1.json
          grep -Fq 'REMEDIATION_REQUIRED:' dev-hub/guardian/worker.js
          grep -Fq 'REMEDIATION_MAX_ATTEMPTS_EXCEEDED' dev-hub/guardian/worker.js
          grep -Fq '/v1/remediations' dev-hub/guardian/worker.js
          grep -Fq 'guardian_remediation_runtime as grr' dev-hub/bin/run-controller.py
          grep -Fq 'guardian_remediation_runtime as grr' dev-hub/bin/autonomous-project-orchestrator.py
          grep -Fq 'guardian_remediation_runtime as grr' dev-hub/bin/technology_watch_runtime.py
          echo CHACHA_DEV_V620_CORRECTIVE_ENFORCEMENT_INVARIANTS=PASS

      - name: Qualification receipt
        run: |
          {
            echo CHACHA_DEV_GUARDIAN_CORRECTIVE_ENFORCEMENT=V6.20
            echo RESULT=success
            echo SOURCE_REV="$(git rev-parse HEAD)"
            echo EVERY_GOVERNED_ACTION_PRE_POST_CORRELATED=YES
            echo EVERY_CREATED_AGENT_GETS_VERSIONED_ROLE_CONTRACT=YES
            echo DYNAMIC_AGENT_PROJECT_SCOPE_ENFORCED=YES
            echo DYNAMIC_AGENT_CAPABILITY_SCOPE_ENFORCED=YES
            echo DYNAMIC_AGENT_PERMISSION_SCOPE_ENFORCED=YES
            echo DYNAMIC_AGENT_PRODUCTION_PRIVILEGE_ESCALATION=NO
            echo EVERY_DYNAMIC_BRANCH_GETS_VERSIONED_ROLE_CONTRACT=YES
            echo EVERY_DYNAMIC_ORCHESTRATOR_GETS_VERSIONED_ROLE_CONTRACT=YES
            echo DYNAMIC_COMPONENT_PROJECT_SCOPE_ENFORCED=YES
            echo DYNAMIC_COMPONENT_CAPABILITY_SCOPE_ENFORCED=YES
            echo DYNAMIC_COMPONENT_PRODUCTION_PRIVILEGE_ESCALATION=NO
            echo EVERY_TASK_GUARDIAN_BOUND=YES
            echo GRAPH_TO_PLAN_BINDING_PRESERVED=YES
            echo PLAN_TO_DISPATCH_BINDING_PRESERVED=YES
            echo BINDING_DIGEST_ENFORCED=YES
            echo PRE_POST_EXACT_CONTRACT_IDENTITY=YES
            echo GUARDIAN_ISSUES_CORRECTIVE_DIRECTIVES=YES
            echo GUARDIAN_ENFORCES_REMEDIATION_HOLDS=YES
            echo RESPONSIBLE_COMPONENT_RECEIVES_RULE_REMINDER=YES
            echo CORRECTED_ACTION_MUST_BE_RESUBMITTED=YES
            echo REMEDIATION_MAX_FAILED_ATTEMPTS=3
            echo REMEDIATION_ESCALATION=CRITICAL_STOP_REQUIRED
            echo GUARDIAN_REWRITES_ARCHITECTURE=NO
            echo GUARDIAN_EXPANDS_PERMISSIONS=NO
            echo MISSING_POST_EXTERNALLY_DETECTED=YES
            echo EXPECTED_COMPONENT_COVERAGE_WATCH=YES
            echo DYNAMIC_AGENTS_COVERED_AT_RUN_CONTROLLER=YES
            echo REGISTERED_ADAPTERS_COVERED_AT_RUN_CONTROLLER=YES
            echo LOW_RISK_GUARDIAN_UNAVAILABLE=BLOCK
            echo EMERGENCY_CONTROL_BRIDGE_EXEMPT=YES
            echo ALERT_POLLING=YES
            echo GUARDIAN_AUTO_STOP=NO
            echo AUTOMATIC_EXTERNAL_SPEND_EUR=0
          } | tee /tmp/CHACHA_DEV_V620_RECEIPT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: chacha-dev-v620-guardian-corrective-enforcement
          path: /tmp/CHACHA_DEV_V620_RECEIPT.txt
          retention-days: 30
