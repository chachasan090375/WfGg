name: LastWar phase28 table container QA

on:
  workflow_dispatch:
  push:
    branches:
      - portal-auth-lastwar-lab-v1
    paths:
      - 'scripts/lastwar-phase28-table-container-forensics.sh'
      - '.github/workflows/lastwar-phase28-qa.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate shell syntax
        run: bash -n scripts/lastwar-phase28-table-container-forensics.sh
      - name: Validate embedded Python syntax
        run: |
          set -euo pipefail
          awk '/^cat > "\$PY" <<'"'"'PYEOF'"'"'$/{f=1;next} /^PYEOF$/{if(f){exit}} f{print}' scripts/lastwar-phase28-table-container-forensics.sh > /tmp/phase28.py
          python -m py_compile /tmp/phase28.py
      - name: Enforce offline authoritative-mapping contract
        run: |
          set -euo pipefail
          f=scripts/lastwar-phase28-table-container-forensics.sh
          grep -q 'OFFLINE ONLY' "$f"
          grep -q 'No Last War network connection' "$f"
          grep -q 'assets/table/' "$f"
          grep -q 'LW_Hero' "$f"
          grep -q 'HeroAppearance' "$f"
          grep -q 'exact_ascii_numeric_boundary_enabled=true' "$f"
          grep -q 'unknown_hero_ids_are_not_guessed=true' "$f"
          grep -q 'numeric_occurrence_alone_is_not_identity_mapping=true' "$f"
          if grep -Eq 'curl |wget |requests\.|urllib\.request|socket\.' "$f"; then
            echo 'network primitive detected' >&2
            exit 1
          fi
