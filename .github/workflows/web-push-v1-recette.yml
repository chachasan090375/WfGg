name: Portal Web Push v1 recette

on:
  push:
    branches: [feature-web-push-v1]
    paths:
      - '.github/scripts/web_push_v1_portal_patch.py'
      - '.github/scripts/web_push_v1_portal_fix.py'
      - '.github/scripts/web_push_v1_portal_fix2.py'
      - '.github/scripts/web_push_v1_portal_test_route.py'
      - '.github/qa/web-push-v1-recette.mjs'
      - '.github/workflows/web-push-v1-recette.yml'
      - 'frontend/_worker.js'
      - 'frontend/train-native/app.v15.js'
      - 'frontend/train-native/wfgg-push-sw.js'
      - 'frontend/train-native/manifest.webmanifest'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recette:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-web-push-v1
      - name: Apply Portal Web Push patch
        run: |
          if ! grep -q 'WFGG_WEB_PUSH_CLIENT_V1' frontend/train-native/app.v15.js; then
            python .github/scripts/web_push_v1_portal_patch.py
          fi
          python .github/scripts/web_push_v1_portal_fix.py
          python .github/scripts/web_push_v1_portal_fix2.py
          python .github/scripts/web_push_v1_portal_test_route.py
      - name: Syntax and focused contract
        run: |
          node --check frontend/_worker.js
          node --check frontend/train-native/app.v15.js
          node --check frontend/train-native/wfgg-push-sw.js
          node .github/qa/web-push-v1-recette.mjs
      - name: Existing Portal source smoke
        run: |
          grep -q 'WFGG_PORTAL_TRAIN_SAME_ORIGIN_API_V2' frontend/_worker.js
          grep -q 'WFGG_TRAIN_SERVER_SCHEDULE_V1' frontend/_worker.js
          grep -q 'WFGG_ROSTER_INTEGRATION_UI_V1' frontend/train-native/app.v15.js
      - name: Commit tested production patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/_worker.js frontend/train-native/app.v15.js frontend/train-native/wfgg-push-sw.js frontend/train-native/manifest.webmanifest
          if git diff --cached --quiet; then
            echo 'No production changes to commit.'
            exit 0
          fi
          git commit -m 'feat(push): use real backend path for test notifications'
          git push origin HEAD:feature-web-push-v1
