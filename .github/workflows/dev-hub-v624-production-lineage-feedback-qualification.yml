name: ChaCha DEV V6.24 production lineage feedback qualification

on:
  push:
    branches: [dev-hub-v624-production-lineage-feedback]
    paths:
      - 'dev-hub/bin/production-lineage-feedback.py'
      - 'dev-hub/bin/guardian-governed-production-lineage-feedback.py'
      - 'dev-hub/bin/universal_learning_runtime.py'
      - 'dev-hub/bin/universal-learning-producer.py'
      - 'dev-hub/bin/reusable-branch-registry.py'
      - 'dev-hub/bin/reusable-architecture-registry.py'
      - 'dev-hub/config/production-lineage-feedback.v1.json'
      - 'dev-hub/config/universal-learning.v1.json'
      - 'dev-hub/config/guardian-role-contracts.v1.json'
      - 'dev-hub/config/guardian-coverage-manifest.v1.json'
      - 'dev-hub/schemas/learning-delta-v1.schema.json'
      - 'dev-hub/systemd/chacha-dev-production-lineage-feedback.service'
      - 'dev-hub/systemd/chacha-dev-production-lineage-feedback.timer'
      - 'dev-hub/tests/test_v624_production_lineage_feedback.py'
      - 'dev-hub/bin/install-v624-production-lineage-feedback.sh'
      - '.github/workflows/dev-hub-v624-production-lineage-feedback-qualification.yml'
      - '.github/workflows/dev-hub-v624-guardian-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-hub-v624-production-lineage-feedback
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Static validation
        run: |
          set -euo pipefail
          python3 -m py_compile             dev-hub/bin/production-lineage-feedback.py             dev-hub/bin/guardian-governed-production-lineage-feedback.py             dev-hub/bin/universal_learning_runtime.py             dev-hub/bin/universal-learning-producer.py             dev-hub/bin/reusable-branch-registry.py             dev-hub/bin/reusable-architecture-registry.py
          python3 -m json.tool dev-hub/config/production-lineage-feedback.v1.json >/dev/null
          python3 -m json.tool dev-hub/config/universal-learning.v1.json >/dev/null
          python3 -m json.tool dev-hub/config/guardian-role-contracts.v1.json >/dev/null
          python3 -m json.tool dev-hub/config/guardian-coverage-manifest.v1.json >/dev/null
          python3 -m json.tool dev-hub/schemas/learning-delta-v1.schema.json >/dev/null
          if [ -f dev-hub/bin/install-v624-production-lineage-feedback.sh ]; then
            bash -n dev-hub/bin/install-v624-production-lineage-feedback.sh
          fi
          echo CHACHA_DEV_V624_STATIC=PASS

      - name: Production lineage feedback semantics
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v624_production_lineage_feedback.py

      - name: V6.23 contextual memory regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v623_contextual_memory_recall.py

      - name: V6.22 memory regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v622_central_memory_assimilation.py

      - name: Qualification receipt
        run: |
          {
            echo CHACHA_DEV_PRODUCTION_LINEAGE_FEEDBACK=V6.24
            echo RESULT=success
            echo SOURCE_REV="$(git rev-parse HEAD)"
            echo LEARNING_DELTA_COMPONENT_LINEAGE=YES
            echo EXACT_LINEAGE_REQUIRED_FOR_REUSE_MUTATION=YES
            echo MISSING_LINEAGE_STILL_LEARNS_CENTRALLY=YES
            echo MISSING_LINEAGE_REUSE_MUTATION=NO
            echo CRITICAL_ANOMALY_QUARANTINES_EXACT_ASSET=YES
            echo HIGH_ANOMALY_DEGRADES_EXACT_ASSET=YES
            echo VERIFIED_RECOVERY_AUTO_ADOPT=NO
            echo TECHNOLOGY_REVALIDATION_BEFORE_REUSE=YES
            echo ACCEPTANCE_BEFORE_READOPT=YES
            echo ALL_COMPONENT_REPUTATION_INDEX=YES
            echo FEEDBACK_IDEMPOTENT=YES
            echo GUARDIAN_GOVERNED=YES
            echo DIRECT_APPLICATION_MUTATION=NO
            echo AUTOMATIC_EXTERNAL_SPEND_EUR=0
          } | tee /tmp/CHACHA_DEV_V624_RECEIPT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: chacha-dev-v624-production-lineage-feedback
          path: /tmp/CHACHA_DEV_V624_RECEIPT.txt
          retention-days: 30
