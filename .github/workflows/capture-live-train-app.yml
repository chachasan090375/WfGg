name: Verify live Portal and Train guards

on:
  push:
    branches:
      - train-bridge-phase3

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live services
        shell: bash
        run: |
          set -eu
          ROOT='https://train-bridge-phase3.wfgg.pages.dev'
          TRAIN="$ROOT/train/"
          TRAIN_WORKER='https://portal-auth-phase1-wfgg-train.chachasan090375.workers.dev'
          PORTAL_API='https://wfgg-api.chachasan090375.workers.dev'
          UA='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/139 Mobile Safari/537.36'

          curl -fsSL -A "$UA" "$TRAIN?guard-final=1" -o /tmp/train.html
          curl -sS -D /tmp/options.headers -o /dev/null -X OPTIONS \
            -H 'Origin: https://train-bridge-phase3.wfgg.pages.dev' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: X-WfGg-Portal-Token,Content-Type' \
            "$TRAIN_WORKER/api/exchanges/probe/accept"
          curl -fsSL "$PORTAL_API/api/health" -o /tmp/portal-health.json

          grep -Fq '/assets/wfgg-logo-mini.svg' /tmp/train.html
          grep -Fq 'wfgg_bridge=v11' /tmp/train.html
          grep -iF 'x-wfgg-rotation-guard' /tmp/options.headers >/dev/null

          echo '=== PORTAL API HEALTH ==='
          cat /tmp/portal-health.json
          echo
          if grep -Fq '"admin_gate":"R4_R5_ONLY"' /tmp/portal-health.json; then
            echo 'LIVE_PORTAL_R4_R5_GATE=OK'
          else
            echo 'LIVE_PORTAL_R4_R5_GATE=NOT_DEPLOYED'
          fi
          echo 'LIVE_TRAIN_ROTATION_GUARD=OK'
