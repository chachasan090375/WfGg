name: Verify live Train rotation guard

on:
  push:
    branches:
      - train-bridge-phase3

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify preview and Worker guard
        shell: bash
        run: |
          set -eu
          ROOT='https://train-bridge-phase3.wfgg.pages.dev'
          TRAIN="$ROOT/train/"
          WORKER='https://portal-auth-phase1-wfgg-train.chachasan090375.workers.dev'
          UA='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/139 Mobile Safari/537.36'
          ok=0
          for i in $(seq 1 30); do
            curl -fsSL -A "$UA" "$TRAIN?guard-check=$i" -o /tmp/train.html || true
            curl -sS -D /tmp/options.headers -o /dev/null -X OPTIONS \
              -H 'Origin: https://train-bridge-phase3.wfgg.pages.dev' \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: X-WfGg-Portal-Token,Content-Type' \
              "$WORKER/api/exchanges/probe/accept" || true
            logo=0; v11=0; guard=0; methods=0
            grep -Fq '/assets/wfgg-logo-mini.svg' /tmp/train.html && logo=1 || true
            grep -Fq 'wfgg_bridge=v11' /tmp/train.html && v11=1 || true
            grep -iF 'x-wfgg-rotation-guard' /tmp/options.headers >/dev/null && guard=1 || true
            grep -iF 'access-control-allow-methods:' /tmp/options.headers >/dev/null && methods=1 || true
            echo "attempt=$i logo=$logo v11=$v11 rotation_guard=$guard cors_methods=$methods"
            if [ "$logo" = 1 ] && [ "$v11" = 1 ] && [ "$guard" = 1 ] && [ "$methods" = 1 ]; then
              echo 'LIVE_ROTATION_GUARD_V1=OK'
              ok=1
              break
            fi
            sleep 5
          done
          echo '=== WORKER HEADERS ==='
          cat /tmp/options.headers
          test "$ok" = 1
