name: Inspect live Train interactions

on:
  push:
    branches:
      - train-bridge-phase3

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect served Train handlers
        shell: bash
        run: |
          set -eu
          URL='https://train-bridge-phase3.wfgg.pages.dev/train/app.js?wfgg_bridge=v6&inspect=interaction'
          curl -fsSL "$URL" -o /tmp/app.js
          echo '=== INIT / BIND / NAV SYMBOLS ==='
          grep -nE 'function (init|bind|bindEvents|showView|setView|render|bootApp)|const (init|bindEvents|showView)|addEventListener\(.click|querySelectorAll\(.nav|nav-item|bottomNav|logoutBtn|brandHome|profileBtn|planning|exchanges|alerts|admin' /tmp/app.js | head -n 260 || true
          echo '=== CONTEXT AROUND W EXPORT ==='
          grep -n -C 8 -E 'window\.W|showTrainEntry|bootApp' /tmp/app.js | head -n 220 || true
          echo '=== CONTEXT AROUND DOMCONTENTLOADED / INIT ==='
          grep -n -C 10 -E 'DOMContentLoaded|init\(\)|bindEvents\(\)' /tmp/app.js | head -n 260 || true
