name: Verify live Train presence v9

on:
  push:
    branches:
      - train-bridge-phase3

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify frontend and backend presence bridges
        shell: bash
        run: |
          set -eu
          BASE='https://train-bridge-phase3.wfgg.pages.dev/train/'
          API='https://portal-auth-phase1-wfgg-train.chachasan090375.workers.dev'
          UA='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/139 Mobile Safari/537.36'
          ok=0
          for i in $(seq 1 30); do
            html="$(curl -fsSL -A "$UA" "${BASE}?verify=presence-v9-$i" 2>/dev/null || true)"
            js="$(curl -fsSL -A "$UA" -e "$BASE" "${BASE}app.js?wfgg_bridge=v9&verify=$i" 2>/dev/null || true)"
            curl -sS -A "$UA" -D /tmp/api.headers -o /tmp/api.body "${API}/api/snapshot?verify=$i" >/dev/null 2>&1 || true

            html_v9=0
            js_safe=0
            js_unsafe=0
            api_v1=0
            case "$html" in *'wfgg_bridge=v9'*) html_v9=1;; esac
            case "$js" in *"if(document.visibilityState!=='visible')return;"*) js_safe=1;; esac
            case "$js" in *"if(!token || document.visibilityState!=='visible')return;"*) js_unsafe=1;; esac
            if grep -qi '^x-wfgg-presence-entry: v1' /tmp/api.headers; then api_v1=1; fi

            echo "attempt=$i html_v9=$html_v9 heartbeat_safe=$js_safe heartbeat_unsafe=$js_unsafe backend_presence_v1=$api_v1"
            if [ "$html_v9" = 1 ] && [ "$js_safe" = 1 ] && [ "$js_unsafe" = 0 ] && [ "$api_v1" = 1 ]; then
              echo 'LIVE_TRAIN_PRESENCE_V9=OK'
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
