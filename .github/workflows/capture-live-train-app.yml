name: Inspect live Train CSS click blockers

on:
  push:
    branches:
      - train-bridge-phase3

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live CSS and control markup
        shell: bash
        run: |
          set -eu
          BASE='https://train-bridge-phase3.wfgg.pages.dev/train/'
          UA='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/139 Mobile Safari/537.36'

          curl -fsSL -A "$UA" "${BASE}?inspect=css-${GITHUB_SHA}" -o /tmp/train.html
          echo '=== TOP ACTIONS ==='
          grep -nE -C 5 'top-actions|logoutBtn|brandHome' /tmp/train.html | head -n 120 || true

          curl -fsSL -A "$UA" -e "$BASE" "${BASE}styles.css?v=44&inspect=${GITHUB_SHA}" -o /tmp/styles.css

          echo '=== CLICK RELATED CSS ==='
          grep -nEi -C 4 'pointer-events|z-index|position:[[:space:]]*fixed|\.hidden|modal|backdrop|bottom-nav|nav-btn|topbar|top-actions|icon-btn|app-view' /tmp/styles.css | head -n 520 || true

          echo '=== CSS SIZE ==='
          wc -c /tmp/styles.css
