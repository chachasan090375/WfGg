name: Inspect live Train rights and exchange UI

on:
  push:
    branches:
      - train-bridge-phase3

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live Train frontend contracts
        shell: bash
        run: |
          set -eu
          ROOT='https://train-bridge-phase3.wfgg.pages.dev'
          TRAIN="$ROOT/train/"
          UA='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/139 Mobile Safari/537.36'
          for i in $(seq 1 24); do
            curl -fsSL -A "$UA" "$TRAIN?inspect=rights-$i" -o /tmp/train.html || true
            curl -fsSL -A "$UA" -e "$TRAIN" "$ROOT/train/app.js?wfgg_bridge=v11&inspect=$i" -o /tmp/app.js || true
            if grep -Fq '/assets/wfgg-logo-mini.svg' /tmp/train.html && grep -Fq 'function init' /tmp/app.js; then
              break
            fi
            sleep 5
          done
          echo '=== LIVE VERSION ==='
          grep -nE -C 3 'wfgg-logo-mini|app.js' /tmp/train.html | head -n 80 || true
          echo '=== ADMIN GATING ==='
          grep -nE -C 8 'nav-btn|adminView|isAdmin\(|data-view=.admin|Admin' /tmp/app.js | head -n 360 || true
          echo '=== EXCHANGE ACCEPT / ERRORS ==='
          grep -nE -C 10 'exchanges/.+accept|acceptExchange|swapWithDate|myDate|show.*error|toast|error' /tmp/app.js | head -n 520 || true
          echo '=== BASIC ASSERTIONS ==='
          grep -Fq '/assets/wfgg-logo-mini.svg' /tmp/train.html
          grep -Fq 'wfgg_bridge=v11' /tmp/train.html
          grep -Fq '/api/exchanges/' /tmp/app.js
