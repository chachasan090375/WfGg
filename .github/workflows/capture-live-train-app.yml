name: Inspect Train init DOM contract

on:
  push:
    branches:
      - train-bridge-phase3

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Compare init required IDs with live HTML
        shell: bash
        run: |
          set -eu
          BASE='https://train-bridge-phase3.wfgg.pages.dev/train/'
          UA='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/139 Mobile Safari/537.36'
          curl -fsSL -A "$UA" "${BASE}?inspect=init-dom-${GITHUB_SHA}" -o /tmp/train.html
          curl -fsSL -A "$UA" -e "$BASE" "${BASE}app.js?wfgg_bridge=v7&inspect=${GITHUB_SHA}" -o /tmp/app.js

          echo '=== INIT FUNCTION ==='
          sed -n '1929,1985p' /tmp/app.js

          echo '=== REQUIRED INIT IDS IN LIVE HTML ==='
          python - <<'PY'
          import re
          html=open('/tmp/train.html',encoding='utf-8').read()
          js=open('/tmp/app.js',encoding='utf-8').read()
          m=re.search(r'async function init\(\) \{(.*?)\n    \}',js,re.S)
          body=m.group(1) if m else ''
          ids=[]
          for x in re.findall(r"getElementById\('([^']+)'\)",body):
              if x not in ids: ids.append(x)
          for x in ids:
              present=bool(re.search(r'id=["\']'+re.escape(x)+r'["\']',html))
              print(f'{x}: {"PRESENT" if present else "MISSING"}')
          print('NAV_BUTTON_COUNT:',len(re.findall(r'class=["\'][^"\']*\bnav-btn\b',html)))
          PY
