name: Verify live Train token fix

on:
  push:
    branches:
      - train-bridge-phase3

permissions:
  contents: read

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[capture-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare preview and verify app.js
        run: |
          set -euo pipefail
          URL='https://train-bridge-phase3.wfgg.pages.dev/train/app.js'
          for i in $(seq 1 24); do
            curl -fsSL -A 'Mozilla/5.0 WfGg-Smoke/1.0' "$URL" -o /tmp/train-app.js || true
            if [ -s /tmp/train-app.js ] && ! grep -Fq 'if (token)' /tmp/train-app.js; then
              grep -Fq "const API_BASE = '';" /tmp/train-app.js
              echo 'LIVE_TRAIN_TOKEN_FIX=OK'
              exit 0
            fi
            sleep 5
          done
          echo 'LIVE_TRAIN_TOKEN_FIX=NOT_DEPLOYED'
          exit 1
