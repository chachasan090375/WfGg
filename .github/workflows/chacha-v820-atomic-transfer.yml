name: ChaCha V8.2.0 atomic transfer

on:
  push:
    branches:
      - transfer-v820-atomic-bootstrap
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-exact-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Sentinel remediation patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum .chacha-transfer/v820-sentinel-fix.patch | awk '{print $1}')" = "5f0fc108c84c1944be8bebc5e16a38337386b9c7f5e6a8c3ad8457f3d6eefa79"
          cp .chacha-transfer/v820-sentinel-fix.patch /tmp/v820-sentinel-fix.patch
          echo CHACHA_DEV_V820_SENTINEL_PATCH_SHA=PASS

      - name: Recreate exact Sentinel remediation commit
        shell: bash
        env:
          PARENT: 40c54ea4848fa1363a6c508017d16a0b9f45a31d
          EXPECTED_TREE: 75f00df96f4de7a62351693e9cd69465f860790f
          EXPECTED_COMMIT: 7ea4c89f196bf1c52aafae24cc5474e44d296278
        run: |
          set -euo pipefail
          git checkout --detach "$PARENT"
          git apply --index /tmp/v820-sentinel-fix.patch
          TREE="$(git write-tree)"
          test "$TREE" = "$EXPECTED_TREE"
          echo CHACHA_DEV_V820_SENTINEL_TREE_SHA=PASS
          export GIT_AUTHOR_NAME='ChaCha DEV'
          export GIT_AUTHOR_EMAIL='chacha-dev@local.invalid'
          export GIT_AUTHOR_DATE='1790423607 +0000'
          export GIT_COMMITTER_NAME='ChaCha DEV'
          export GIT_COMMITTER_EMAIL='chacha-dev@local.invalid'
          export GIT_COMMITTER_DATE='1790423607 +0000'
          COMMIT="$(printf '%s\n' 'test(v820): make mandatory regressions version-agnostic' | git commit-tree "$TREE" -p "$PARENT")"
          test "$COMMIT" = "$EXPECTED_COMMIT"
          echo CHACHA_DEV_V820_SENTINEL_COMMIT_SHA=PASS
          git push origin "$COMMIT:refs/heads/dev-hub-v820-universal-materialization-compliance"
          echo CHACHA_DEV_V820_SENTINEL_REMEDIATION_PUBLISHED=PASS
