name: wfgg-api Cloudflare Builds API diagnostic v1

on:
  push:
    branches: [wfgg-api-build-diagnostic-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-cloudflare-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read failed Cloudflare build directly by UUID
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request, urllib.error

          token=os.environ.get('CF_API_TOKEN','')
          if not token:
              print('CF_DIAG=MISSING_CLOUDFLARE_API_TOKEN');sys.exit(2)
          headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      return r.status,r.read().decode('utf-8','replace')
              except urllib.error.HTTPError as e:
                  return e.code,e.read().decode('utf-8','replace')
          def data(body):
              try:return json.loads(body)
              except Exception:return {}
          def errors(body):
              d=data(body)
              return ' | '.join(f"{e.get('code')}:{e.get('message')}" for e in d.get('errors') or []) or '(none)'

          st,body=get('https://api.cloudflare.com/client/v4/accounts?per_page=50')
          print(f'CF_ACCOUNTS_HTTP={st}')
          if st!=200:
              print('CF_ACCOUNTS_ERRORS='+errors(body));sys.exit(3)
          account_id=None
          for a in data(body).get('result') or []:
              aid=a.get('id')
              if not aid: continue
              pst,pbody=get(f'https://api.cloudflare.com/client/v4/accounts/{aid}/pages/projects/wfgg')
              if pst==200 and data(pbody).get('success'):
                  account_id=aid;break
          if not account_id:
              print('CF_ACCOUNT=NOT_FOUND');sys.exit(4)
          print('CF_ACCOUNT=FOUND')

          build_uuid='090e73da-a32c-486f-9abd-684fe9ddb785'
          st,body=get(f'https://api.cloudflare.com/client/v4/accounts/{account_id}/builds/builds/{build_uuid}')
          print(f'CF_BUILD_GET_HTTP={st}')
          if st!=200:
              print('CF_BUILD_GET_ERRORS='+errors(body))
          else:
              b=data(body).get('result') or {}
              m=b.get('build_trigger_metadata') or {}
              t=b.get('trigger') or {}
              print(f'CF_BUILD_OUTCOME={b.get("build_outcome")}')
              print(f'CF_BUILD_BRANCH={m.get("branch")}')
              print(f'CF_BUILD_COMMIT={m.get("commit_hash")}')
              print(f'CF_BUILD_BUILD_COMMAND={m.get("build_command")}')
              print(f'CF_BUILD_DEPLOY_COMMAND={m.get("deploy_command")}')
              print(f'CF_BUILD_ROOT={m.get("root_directory")}')
              print(f'CF_TRIGGER_NAME={t.get("trigger_name")}')
              print(f'CF_TRIGGER_ROOT={t.get("root_directory")}')
              print(f'CF_TRIGGER_BUILD={t.get("build_command")}')
              print(f'CF_TRIGGER_DEPLOY={t.get("deploy_command")}')
              print(f'CF_TRIGGER_BRANCH_INCLUDES={t.get("branch_includes")}')
              print(f'CF_TRIGGER_BRANCH_EXCLUDES={t.get("branch_excludes")}')

          st,body=get(f'https://api.cloudflare.com/client/v4/accounts/{account_id}/builds/builds/{build_uuid}/logs')
          print(f'CF_BUILD_LOGS_HTTP={st}')
          if st!=200:
              print('CF_BUILD_LOGS_ERRORS='+errors(body));sys.exit(5)
          result=data(body).get('result') or {}
          lines=result.get('lines') or []
          print(f'CF_BUILD_LOG_LINES={len(lines)}')
          keep=[]
          rx=re.compile(r'error|fail|exception|enoent|not found|wrangler|root|token|config|npm|directory|worker|package',re.I)
          for row in lines:
              if isinstance(row,list):
                  msg=' '.join(str(x) for x in row[1:])
              else:
                  msg=str(row)
              if rx.search(msg):
                  msg=re.sub(r'Bearer\s+\S+','Bearer [REDACTED]',msg,flags=re.I)
                  msg=re.sub(r'(?i)(token\s*[=:]\s*)\S+',r'\1[REDACTED]',msg)
                  keep.append(msg[:1000])
          print('CF_RELEVANT_LOG_LINES_BEGIN')
          for line in keep[-160:]: print(line)
          print('CF_RELEVANT_LOG_LINES_END')
          PY
