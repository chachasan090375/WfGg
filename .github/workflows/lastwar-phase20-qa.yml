name: LastWar phase20 hero combat QA

on:
  workflow_dispatch:
  push:
    branches:
      - portal-auth-lastwar-lab-v1
    paths:
      - 'scripts/lastwar-phase20-hero-combat-discovery.sh'
      - '.github/workflows/lastwar-phase20-qa.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate shell syntax
        run: bash -n scripts/lastwar-phase20-hero-combat-discovery.sh
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
      - name: Compile embedded phase20 helper against pinned client
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ljagiello/lastwar-client.git /tmp/lastwar-client
          cd /tmp/lastwar-client
          git fetch --depth 1 origin ee5f64de160a8051c2f9f98189b75038dd225a0a
          git checkout --detach ee5f64de160a8051c2f9f98189b75038dd225a0a
          mkdir -p internal/cmd/wfgg-phase20-hero-combat
          awk '/^cat > .*main.go.*GOEOF/{f=1;next}/^GOEOF$/{if(f){exit}}f' "$GITHUB_WORKSPACE/scripts/lastwar-phase20-hero-combat-discovery.sh" > internal/cmd/wfgg-phase20-hero-combat/main.go
          go build ./internal/cmd/wfgg-phase20-hero-combat
      - name: Enforce privacy and offline contract
        run: |
          set -euo pipefail
          f=scripts/lastwar-phase20-hero-combat-discovery.sh
          grep -q 'OFFLINE ONLY' "$f"
          grep -q 'uuid' "$f"
          grep -q 'guid' "$f"
          grep -q 'token' "$f"
          ! grep -Eq 'curl |wget |http.NewRequest|net.Dial' "$f"
