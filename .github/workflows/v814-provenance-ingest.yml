name: V814 targeted recovery provenance ingest

on:
  push:
    branches:
      - dev-hub-v814-targeted-platform-recovery-provenance

permissions:
  contents: write

jobs:
  ingest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch exact active hotfix source bundle
        shell: bash
        run: |
          set -euo pipefail
          URL='https://chachavps.tail3ab05a.ts.net/v814-targeted-recovery-provenance'
          EXPECTED='238945a384ba2a0f51e2a3999ea3b748d7688dc510304a622fff4779b968d783'
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 "$URL" -o /tmp/v814-provenance.tar.gz
          echo "$EXPECTED  /tmp/v814-provenance.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v814-provenance.tar.gz -C .
          git config user.name 'ChaCha DEV provenance bridge'
          git config user.email 'chacha-dev@local.invalid'
          git add dev-hub/bin/central-interface-controller.py dev-hub/bin/direct-operator-service.py dev-hub/config/direct-operator.v1.json dev-hub/tests/test_targeted_platform_recovery.py
          git commit -m 'fix(v814): preserve targeted platform recovery'
          git push origin HEAD:dev-hub-v814-targeted-platform-recovery-provenance
          echo CHACHA_DEV_V814_TARGETED_RECOVERY_PROVENANCE=PASS
          echo CHACHA_DEV_AUTOMATIC_EXTERNAL_SPEND_EUR=0
