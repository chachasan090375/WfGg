name: Radar V6.19.6 production promotion qualification

on:
  push:
    branches: [radar-v6196-production-promotion]
  pull_request:
    branches: [radar-production-v1]
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_CONNECTOR_SHA256: b7ff60476f3afe7c8bcb9b78963c46daa4e8b5507490cc83cbcbc4ced63e7c35
  EXPECTED_NATIVE_SHA256: 274d040f5294cb09422e5d55cc4b5335ac7739924c33dcb67b3f279645814900
  EXPECTED_WORKER_SHA256: 052deb78c56aa6eb522f8808ffe0cc427c9d605d65a0e6983b6dbb9749da56ea
  EXPECTED_TRANSPORT_SHA256: 9dc489b759c75cc0a4882d29324965ca8171de84febae788ced52404b28ee573

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-v6196-production-promotion
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Reconstruct cumulative V6.19.6 production candidate
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar
          mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          echo '234df1dec57f6211bc625855bf13350c9f17fbd843fbe92d8cf1ab7cb5c081ef  /tmp/radar-src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar
          rm -rf /tmp/wfgg-radar/connector-go
          cp -a .radar-release-src/v2-source/connector-go /tmp/wfgg-radar/connector-go

          python3 .github/scripts/patch-radar-target-profile-retry.py
          python3 .github/scripts/patch-radar-federated-diagnostics-v65.py
          python3 .github/scripts/patch-player-scan-v3.py
          python3 .github/scripts/patch-player-scan-v4.py
          python3 .github/scripts/patch-radar-protocol-discovery-v67.py
          python3 .github/scripts/patch-radar-profile-isolation-v68.py
          python3 .github/scripts/patch-radar-native-profile-v69.py
          python3 .github/scripts/patch-radar-native-profile-handshake-v691.py
          python3 .github/scripts/patch-radar-native-profile-exec-v692.py
          python3 .github/scripts/patch-radar-connector-runtime-v693.py
          python3 .github/scripts/patch-radar-cluster-catalog-budget-v6192.py
          python3 .github/scripts/patch-radar-seed-scout-v6193.py
          python3 .github/scripts/patch-radar-autopilot-v6194.py

          install -m 0644 .radar-release-src/v2-source/src/game/remote-transport.js /tmp/wfgg-radar/src/game/remote-transport.js
          python3 .github/scripts/patch-radar-async-collector-worker.py
          python3 .github/scripts/patch-radar-worker-rich-profile-v6191.py
          python3 .github/scripts/patch-radar-worker-seed-scout-v6193.py
          python3 .github/scripts/patch-radar-worker-autopilot-v6194.py

          install -m 0644 radar-ui-live/live-radar.html /tmp/wfgg-radar/public/live-radar.html
          python3 .github/scripts/patch-live-radar-seed-scout-v6193.py
          python3 .github/scripts/patch-live-radar-autopilot-v6194.py
          python3 .github/scripts/patch-radar-session-keepalive-v6195.py
          python3 .github/scripts/patch-live-radar-autopilot-v6196.py

          grep -Fq 'WFGG_RADAR_AUTOPILOT_CONTINUE_NO_DATA_V6196' /tmp/wfgg-radar/connector-go/cmd/radar-connector/server_autopilot_v6194.go
          grep -Fq 'WFGG_RADAR_AUTOPILOT_CONTINUE_NO_DATA_UI_V6196' /tmp/wfgg-radar/public/live-radar.html
          echo RADAR_V6196_PRODUCTION_RECONSTRUCT=PASS

      - name: Qualify connector and exact SHA
        working-directory: /tmp/wfgg-radar/connector-go
        run: |
          set -euo pipefail
          gofmt -w ./cmd ./internal
          go test ./...
          go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o /tmp/radar-connector ./cmd/radar-connector
          actual="$(sha256sum /tmp/radar-connector | awk '{print $1}')"
          echo "RADAR_V6196_CONNECTOR_SHA256=$actual"
          test "$actual" = "$EXPECTED_CONNECTOR_SHA256"
          grep -Fq 'SEED_SKIPPED_NO_DATA' cmd/radar-connector/server_autopilot_v6194.go
          grep -Fq 'AUTOPILOT_NO_DATA' cmd/radar-connector/server_autopilot_v6194.go
          grep -Fq 'AUTOPILOT_CONSECUTIVE_FAILURE_LIMIT' cmd/radar-connector/server_autopilot_v6194.go
          grep -Fq 'AUTOPILOT_AUTH_FAILED' cmd/radar-connector/server_autopilot_v6194.go
          echo RADAR_V6196_CONNECTOR_QUALIFIED=PASS

      - name: Discover and qualify Cloudflare surface digests
        run: |
          set -euo pipefail
          node --check /tmp/wfgg-radar/src/worker.js
          worker="$(sha256sum /tmp/wfgg-radar/src/worker.js | awk '{print $1}')"
          transport="$(sha256sum /tmp/wfgg-radar/src/game/remote-transport.js | awk '{print $1}')"
          ui="$(sha256sum /tmp/wfgg-radar/public/live-radar.html | awk '{print $1}')"
          echo "RADAR_V6196_WORKER_SHA256=$worker"
          echo "RADAR_V6196_TRANSPORT_SHA256=$transport"
          echo "RADAR_V6196_UI_SHA256=$ui"
          test "$worker" = "$EXPECTED_WORKER_SHA256"
          test "$transport" = "$EXPECTED_TRANSPORT_SHA256"
          grep -Fq 'WFGG_RADAR_SESSION_KEEPALIVE_V6195' /tmp/wfgg-radar/src/worker.js
          grep -Fq '/api/auth/session/refresh' /tmp/wfgg-radar/src/worker.js
          grep -Fq 'WFGG_RADAR_SESSION_KEEPALIVE_UI_V6195' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'AUTO 12H' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'WFGG_RADAR_AUTOPILOT_CONTINUE_NO_DATA_UI_V6196' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'SEED_SKIPPED_NO_DATA' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'Aucune donnée exploitable' /tmp/wfgg-radar/public/live-radar.html
          echo RADAR_V6196_CLOUDFLARE_SURFACES_DISCOVERY=PASS

      - name: Verify Last War read-only safety
        run: |
          set -euo pipefail
          ! grep -REiq 'building\.production\.collect|mail\.reward|al\.science\.donate|visitor\.operate|march|attack|purchase' .radar-release-src/v6194-source
          echo RADAR_V6196_LASTWAR_MUTATION=NO
          echo RADAR_V6196_COLLECTOR_MUTATION=NORMAL_DISCOVERY_ONLY
          echo RADAR_V6196_TOKEN_PERSISTENCE=NO

      - name: Verify guarded production workflows
        run: |
          set -euo pipefail
          B=.github/workflows/build-radar-vps-binaries.yml
          D=.github/workflows/deploy-radar-production.yml
          grep -Fq 'EXPECTED_CONNECTOR_SHA256: b7ff60476f3afe7c8bcb9b78963c46daa4e8b5507490cc83cbcbc4ced63e7c35' "$B"
          grep -Fq 'EXPECTED_CONNECTOR_SHA256: b7ff60476f3afe7c8bcb9b78963c46daa4e8b5507490cc83cbcbc4ced63e7c35' "$D"
          grep -Fq 'EXPECTED_UI_SHA256: PENDING_V6196_UI_SHA256' "$D"
          grep -Fq 'patch-live-radar-autopilot-v6196.py' "$D"
          grep -Fq 'RADAR_SESSION_TTL = "43200"' "$D"
          grep -Fq 'RADAR_V6196_CLOUDFLARE_PRODUCTION=PASS' "$D"
          echo RADAR_V6196_PRODUCTION_PROMOTION=DISCOVERY_PASS
