name: Simulator browser E2E

on:
  push:
    branches: [simulator-standalone-v1]
    paths:
      - 'simulator/**'
      - '.github/workflows/simulator-browser-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright
        run: |
          mkdir -p /tmp/wfgg-e2e && cd /tmp/wfgg-e2e
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Full mobile recipe — local source and public preview
        env:
          NODE_PATH: /tmp/wfgg-e2e/node_modules
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory simulator >/tmp/wfgg-source-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep .2; done

          cat >/tmp/wfgg-e2e/test.cjs <<'JS'
          const { chromium } = require('playwright');
          const PROFILE='wfgg-simulator-profile-v1';
          const PUBLIC='https://simulator-standalone-v1.wfgg.pages.dev/simulator/';
          const LOCAL='http://127.0.0.1:4173/';
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};

          async function waitPublicFresh(){
            for(let i=0;i<75;i++){
              try{
                const q='?fresh='+Date.now();
                const [p,a,t]=await Promise.all([
                  fetch(PUBLIC+'profile-persistence-v2.js'+q).then(r=>r.ok?r.text():''),
                  fetch(PUBLIC+'app.js'+q).then(r=>r.ok?r.text():''),
                  fetch(PUBLIC+'tactics-autosave-v2.js'+q).then(r=>r.ok?r.text():'')
                ]);
                if(p.includes("version:'2.2.0'") && a.indexOf('const clone =') < a.indexOf('let state = loadState()') && t.includes("version:'2.1.0'")) return;
              }catch(_){}
              await wait(2000);
            }
            throw new Error('Public preview did not reach persistence 2.2.0 / tactics 2.1.0');
          }

          async function makePage(browser){
            const context=await browser.newContext({viewport:{width:412,height:915},isMobile:true,hasTouch:true,deviceScaleFactor:2});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push('pageerror: '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            return {context,page,errors};
          }

          async function openClean(page,url){
            const r=await page.goto(url+'?e2e='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
            assert(r&&r.ok(),'HTTP navigation failed '+url);
            await page.evaluate(()=>localStorage.clear());
            await page.reload({waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.WfGgProfilePersistence?.version==='2.2.0',{timeout:12000});
            await page.waitForFunction(()=>window.WfGgTacticsAutosave?.version==='2.1.0',{timeout:12000});
            await page.waitForSelector('#stepNav [data-step]',{timeout:12000});
          }

          async function assertPersisted(page,path,value,msg){
            const got=await page.evaluate(({k,path})=>{
              let x=JSON.parse(localStorage.getItem(k)||'{}');
              for(const p of path)x=x?.[p];
              return x;
            },{k:PROFILE,path});
            assert(String(got)===String(value),msg+` (${got} != ${value})`);
          }

          async function baseAndAccount(page,errors,label){
            await page.waitForTimeout(500);
            assert(errors.length===0,label+' bootstrap errors: '+errors.join(' | '));
            assert(await page.locator('#stepNav [data-step]').count()===6,label+' navigation steps != 6');
            for(let i=0;i<6;i++){
              await page.locator(`#stepNav [data-step="${i}"]`).click();
              assert(await page.locator('.step-panel:not(.hidden)').count()===1,label+` step ${i} broken`);
            }
            await page.locator('#stepNav [data-step="0"]').click();
            await page.locator('[data-account="hqLevel"]').fill('31');
            await page.reload({waitUntil:'domcontentloaded'}); // no blur, no save button
            await page.waitForSelector('[data-account="hqLevel"]');
            assert(await page.locator('[data-account="hqLevel"]').inputValue()==='31',label+' account typing not persisted');
          }

          async function heroes(page){
            await page.locator('#stepNav [data-step="1"]').click();
            await page.locator('#addHero').click();
            let card=page.locator('.hero-card').first();
            await card.locator('[data-field="heroId"]').fill('Mason');
            await card.locator('[data-field="displayedAttack"]').fill('110000');
            await page.reload({waitUntil:'domcontentloaded'}); // persistence while field may still be focused
            await page.waitForSelector('.hero-card');
            card=page.locator('.hero-card').first();
            assert(await card.locator('[data-field="heroId"]').inputValue()==='Mason','hero name typing not persisted');
            assert(await card.locator('[data-field="displayedAttack"]').inputValue()==='110000','hero attack typing not persisted');
            const extra=[
              ['Marshall','tank','support',95000,80000,1000000],
              ['DVA','aircraft','attack',130000,65000,850000],
              ['Carlie','aircraft','defense',85000,115000,1450000],
              ['Schuyler','aircraft','attack',120000,62000,820000]
            ];
            for(const h of extra){
              await page.locator('#addHero').click();
              const c=page.locator('.hero-card').last();
              await c.locator('[data-field="heroId"]').fill(h[0]);
              await c.locator('[data-field="troopType"]').selectOption(h[1]);
              await c.locator('[data-field="role"]').selectOption(h[2]);
              await c.locator('[data-field="displayedAttack"]').fill(String(h[3]));
              await c.locator('[data-field="displayedDefense"]').fill(String(h[4]));
              await c.locator('[data-field="displayedHp"]').fill(String(h[5]));
              await c.locator('[data-field="displayedHp"]').blur();
            }
            assert(await page.locator('.hero-card').count()===5,'hero count != 5');
            await page.reload({waitUntil:'domcontentloaded'});
            assert(await page.locator('.hero-card').count()===5,'heroes lost after reload');
          }

          async function gear(page){
            await page.locator('#stepNav [data-step="2"]').click();
            await page.locator('#addGear').click();
            let g=page.locator('.gear-card').first();
            await g.locator('[data-field="itemId"]').fill('E2E Railgun');
            await g.locator('[data-field="level"]').fill('40');
            await page.reload({waitUntil:'domcontentloaded'}); // no blur
            await page.waitForSelector('.gear-card');
            g=page.locator('.gear-card').first();
            assert(await g.locator('[data-field="itemId"]').inputValue()==='E2E Railgun','gear name typing not persisted');
            assert(await g.locator('[data-field="level"]').inputValue()==='40','gear level typing not persisted');
            await g.locator('[data-field="currentlyAssignedHero"]').selectOption('DVA');
          }

          async function research(page){
            await page.locator('#stepNav [data-step="3"]').click();
            const level=page.locator('[data-research-level]').first();
            const id=await level.getAttribute('data-research-level');
            await level.fill('3');
            await page.locator(`[data-research-bonus="${id}"]`).fill('2.5');
            await page.reload({waitUntil:'domcontentloaded'}); // no blur
            await page.locator('#stepNav [data-step="3"]').click();
            assert(await page.locator(`[data-research-level="${id}"]`).inputValue()==='3','research level typing not persisted');
            assert(await page.locator(`[data-research-bonus="${id}"]`).inputValue()==='2.5','research bonus typing not persisted');
          }

          async function seasonAndTactics(page){
            await page.locator('#stepNav [data-step="4"]').click();
            await page.locator('[data-totem="bearTank"]').fill('12');
            await page.reload({waitUntil:'domcontentloaded'}); // no blur
            await page.locator('#stepNav [data-step="4"]').click();
            assert(await page.locator('[data-totem="bearTank"]').inputValue()==='12','totem typing not persisted');
            await page.waitForSelector('#tacticsCardsV2');
            await page.locator('[data-tactics-phase]').selectOption('season6');
            let b=page.locator('.tactics-slot[data-kind="battle"]').first();
            await b.locator('[data-card-id]').selectOption('universal-zombie-killer');
            await page.waitForTimeout(150);
            b=page.locator('.tactics-slot[data-kind="battle"]').first();
            await b.locator('[data-card-level]').fill('5');
            await b.locator('[data-card-value="attackPct"]').fill('12.5');
            await b.locator('[data-card-value="defensePct"]').fill('7.5');
            await b.locator('[data-card-secondary]').fill('E2E secondary attribute');
            await page.waitForTimeout(120);
            await assertPersisted(page,['season6','tacticsV2','battleSlots',0,'cardId'],'universal-zombie-killer','tactics card not in unified profile');
            await assertPersisted(page,['season6','tacticsV2','battleSlots',0,'level'],5,'tactics level not autosaved');
            await assertPersisted(page,['season6','tacticsV2','battleSlots',0,'values','attackPct'],12.5,'tactics ATK value not autosaved');
            await assertPersisted(page,['season6','tacticsV2','battleSlots',0,'values','defensePct'],7.5,'tactics DEF value not autosaved');
            await assertPersisted(page,['season6','tacticsV2','battleSlots',0,'secondaryText'],'E2E secondary attribute','tactics text not autosaved');
            await page.reload({waitUntil:'domcontentloaded'}); // values must survive reload
            await page.locator('#stepNav [data-step="4"]').click(); await page.waitForSelector('#tacticsCardsV2');
            b=page.locator('.tactics-slot[data-kind="battle"]').first();
            assert(await b.locator('[data-card-id]').inputValue()==='universal-zombie-killer','tactics card UI lost');
            assert(await b.locator('[data-card-value="attackPct"]').inputValue()==='12.5','tactics ATK UI lost');
            assert(await b.locator('[data-card-secondary]').inputValue()==='E2E secondary attribute','tactics text UI lost');
            await page.locator('[data-tactics-phase]').selectOption('offseason'); await page.waitForTimeout(120);
            assert(await page.locator('.tactics-slot[data-kind="battle"].inactive').count()===4,'battle cards active off-season');
            const off=await page.evaluate(k=>({t:window.WfGgTacticsRuntime.state().phase,p:window.WfGgSeason6Runtime.totemPct(JSON.parse(localStorage.getItem(k)),'tank')}),PROFILE);
            assert(off.t==='offseason','runtime phase bridge broken');
            assert(off.p===0,'S6 totem active off-season');
            await page.locator('[data-tactics-phase]').selectOption('season6'); await page.waitForTimeout(120);
            const on=await page.evaluate(k=>window.WfGgSeason6Runtime.totemPct(JSON.parse(localStorage.getItem(k)),'tank'),PROFILE);
            assert(on===6,'S6 tank totem expected +6%');
          }

          async function enginesAndSummary(page){
            const out=await page.evaluate(()=>{
              const h=[
                {heroId:'A',troopType:'aircraft',role:'defense',displayedAttack:100000,displayedDefense:100000,displayedHp:1000000},
                {heroId:'B',troopType:'aircraft',role:'defense',displayedAttack:105000,displayedDefense:90000,displayedHp:950000},
                {heroId:'C',troopType:'aircraft',role:'attack',displayedAttack:130000,displayedDefense:60000,displayedHp:800000},
                {heroId:'D',troopType:'aircraft',role:'attack',displayedAttack:125000,displayedDefense:60000,displayedHp:800000},
                {heroId:'E',troopType:'aircraft',role:'support',displayedAttack:90000,displayedDefense:70000,displayedHp:850000}
              ];
              const wanted=window.WfGgSimulatorEngine.optimizePlacement(h,'wanted-39',{});
              const monster=window.WfGgSimulatorEngine.optimizePlacement(h,'monster-generic',{});
              return {wanted:!!wanted?.best?.score,monster:!!monster?.best?.score,wm:wanted?.best?.score?.mode,mm:monster?.best?.score?.mode};
            });
            assert(out.wanted&&out.monster,'engine returned no score');
            assert(out.wm==='wanted','Code engine mode wrong');
            assert(out.mm==='monster','Monster engine mode wrong');
            await page.locator('#stepNav [data-step="5"]').click();
            await page.waitForTimeout(900);
            assert(await page.locator('#optimizerResult').count()===1,'optimizer summary bridge missing');
            assert((await page.locator('#step-summary').innerText()).trim().length>100,'summary empty');
            await page.locator('#languageStrip [data-lang="it"]').click();
            await page.reload({waitUntil:'domcontentloaded'});
            assert((await page.locator('#topTitle').innerText()).toLowerCase().includes('simulatore'),'locale not persisted');
          }

          async function recipe(browser,url,label){
            const {context,page,errors}=await makePage(browser);
            await openClean(page,url);
            await baseAndAccount(page,errors,label);
            await heroes(page);
            await gear(page);
            await research(page);
            await seasonAndTactics(page);
            await enginesAndSummary(page);
            await page.screenshot({path:`/tmp/wfgg-e2e/${label}-final.png`,fullPage:true});
            assert(errors.length===0,label+' final browser errors: '+errors.join(' | '));
            await page.evaluate(()=>localStorage.clear());
            await context.close();
            console.log(label,'FULL RECIPE OK');
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            await recipe(browser,LOCAL,'source');
            await waitPublicFresh();
            await recipe(browser,PUBLIC,'public');
            await browser.close();
            console.log('WFGG SIMULATOR COMPLETE MOBILE RECIPE OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/wfgg-e2e/test.cjs

      - name: Upload diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-mobile-e2e-screens
          path: /tmp/wfgg-e2e/*.png
          if-no-files-found: ignore
