name: ChaCha DEV Autonomy exact object transport

on:
  push:
    branches:
      - dev-hub-autonomy-object-transport
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-exact-object:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import exact Autonomy incident remediation Git object
        env:
          BUNDLE_URL: https://benjamin-switched-ripe-desktop.trycloudflare.com/autonomy-incident-remediation-12895ebb.bundle
          BUNDLE_SHA256: 47bc65999afaeb018ae1bdc405949f6f7cc0ee7125c6eb7b05945fbc7a25e3a2
          TARGET_SHA: 12895ebbde0a420aaa9a99b9dc5b36074dab22da
          TARGET_TREE: 52f2795a77693c5854f085c85bff80f52110ba0b
        run: |
          set -euo pipefail
          sleep 15
          curl -fsSL --retry 8 --retry-delay 5 "$BUNDLE_URL" -o /tmp/autonomy-incident.bundle
          echo "$BUNDLE_SHA256  /tmp/autonomy-incident.bundle" | sha256sum -c -
          git bundle verify /tmp/autonomy-incident.bundle
          git fetch /tmp/autonomy-incident.bundle refs/heads/autonomy-incident-remediation:refs/remotes/autonomy/imported
          IMPORTED_SHA="$(git rev-parse refs/remotes/autonomy/imported)"
          IMPORTED_TREE="$(git rev-parse "$TARGET_SHA^{tree}")"
          echo "IMPORTED_SHA=$IMPORTED_SHA"
          echo "IMPORTED_TREE=$IMPORTED_TREE"
          test "$IMPORTED_SHA" = "$TARGET_SHA"
          test "$IMPORTED_TREE" = "$TARGET_TREE"
          echo "CHACHA_DEV_AUTONOMY_INCIDENT_OBJECT_IMPORT=PASS"
          git push origin "$TARGET_SHA:refs/heads/dev-hub-autonomy-incident-remediation-staging"
