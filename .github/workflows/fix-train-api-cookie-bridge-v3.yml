name: Fix Train API cookie bridge v3

on:
  push:
    branches:
      - fix-train-api-cookie-bridge-v3

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-train-api-cookie-bridge-v3

      - name: Apply server-side Train cookie bridge
        run: python .github/scripts/fix_train_api_cookie_bridge_v3.py

      - name: Validate Worker syntax and auth contract
        run: |
          node --check frontend/_worker.js
          grep -Fq 'WFGG_TRAIN_API_COOKIE_AUTH_V5' frontend/_worker.js
          grep -Fq "headers.set('X-WfGg-Portal-Token', cookiePortalTrainToken)" frontend/_worker.js
          grep -Fq "credentials:'same-origin'" frontend/_worker.js
          python - <<'PY'
          from pathlib import Path
          s=Path('frontend/_worker.js').read_text()
          assert s.count('WFGG_TRAIN_API_COOKIE_AUTH_V5') == 1
          block=s[s.index('WFGG_TRAIN_API_COOKIE_AUTH_V5')-1000:]
          assert 'cookiePortalTrainToken = portalSessionCookie(request)' in block
          assert "headers.set('X-WfGg-Portal-Token', cookiePortalTrainToken)" in block
          assert 'apiRequest = new Request(request, { headers })' in block
          bridge=s[s.index('WFGG_PORTAL_TRAIN_SAME_ORIGIN_API_V2'):s.index('const norm=v=>')]
          assert bridge.count("credentials:'same-origin'") >= 2
          print('TRAIN_API_COOKIE_BRIDGE_V3=PASS')
          PY

      - name: Commit tested fix
        run: |
          if git diff --quiet -- frontend/_worker.js; then
            echo 'No Worker changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/_worker.js
          git commit -m 'fix(train): authenticate proxied API from Portal cookie'
          git push origin HEAD:fix-train-api-cookie-bridge-v3
