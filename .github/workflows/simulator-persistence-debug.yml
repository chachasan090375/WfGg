name: Simulator persistence debug

on:
  push:
    branches: [simulator-standalone-v1]
    paths:
      - '.github/workflows/simulator-persistence-debug.yml'
      - 'simulator/profile-persistence-v2.js'
      - 'simulator/app.js'
      - 'simulator/index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        run: |
          mkdir -p /tmp/wfgg-debug && cd /tmp/wfgg-debug
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Trace profile
        env:
          NODE_PATH: /tmp/wfgg-debug/node_modules
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory simulator >/tmp/http.log 2>&1 &
          pid=$!; trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep .2; done
          cat >/tmp/wfgg-debug/test.cjs <<'JS'
          const {chromium}=require('playwright');
          const K='wfgg-simulator-profile-v1';
          const snap=async(page,label)=>{
            const x=await page.evaluate(k=>{
              let parsed={};try{parsed=JSON.parse(localStorage.getItem(k)||'{}')}catch(_){}
              const c=document.querySelector('.hero-card');
              const field=c?.querySelector('[data-field="displayedPower"]');
              return {
                revision:window.WfGgProfilePersistence?.revision,
                rawHero:parsed.heroes?.[0]||null,
                domPower:field?.value??null,
                activeField:document.activeElement?.dataset?.field||null,
                cardIndex:c?.dataset?.index??null
              };
            },k=K);
            console.log('TRACE '+label+' '+JSON.stringify(x));
            return x;
          };
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:412,height:915}});
            await p.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
            await p.evaluate(()=>localStorage.clear());await p.reload({waitUntil:'domcontentloaded'});
            await p.waitForFunction(()=>window.WfGgProfilePersistence?.version==='2.4.0');
            await p.locator('#stepNav [data-step="1"]').click();await p.locator('#addHero').click();
            let c=p.locator('.hero-card').first();
            await c.locator('[data-field="heroId"]').fill('Mason');
            c=p.locator('.hero-card').first();await c.locator('[data-field="displayedAttack"]').fill('110000');
            c=p.locator('.hero-card').first();await c.locator('[data-field="displayedPower"]').fill('1000000');
            const before=await snap(p,'BEFORE_RELOAD');
            if(String(before.rawHero?.displayedPower)!=='1000000')throw new Error('Power absent from storage before reload');
            await p.reload({waitUntil:'domcontentloaded'});
            await p.waitForSelector('.hero-card');
            const after=await snap(p,'AFTER_RELOAD');
            if(String(after.rawHero?.displayedPower)!=='1000000')throw new Error('Power lost from storage during reload');
            if(after.domPower!=='1000000')throw new Error('Storage retains power but UI fails to render it');
            await b.close();console.log('PERSISTENCE TRACE OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/wfgg-debug/test.cjs
