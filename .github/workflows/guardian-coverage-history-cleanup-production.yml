name: Guardian coverage history cleanup production

on:
  push:
    branches:
      - 'production-guardian-coverage-history-cleanup-*'
    paths:
      - '.chacha-approvals/guardian-coverage-history-cleanup/*.json'

permissions:
  contents: read

env:
  EXPECTED_CANDIDATE: f58d76f034b7e5ec423e312d78f8ca92b8d92111
  EXPECTED_ACTIVE_PRODUCTION: 3d403f60fe1a5c836b6fb84ddef24b7d74378307
  EXPECTED_ALIGNMENT_RUN: '37122801656'
  EXPECTED_HEARTBEAT_SNAPSHOT: coverage-8ada9a440ddd4629bc8647ea5d32d964

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve explicit operator approval
        id: approval
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find .chacha-approvals/guardian-coverage-history-cleanup -maxdepth 1 -type f -name '*.json' | sort)
          test "${#files[@]}" = 1
          FILE="${files[0]}"
          python3 - "$FILE" "$GITHUB_OUTPUT" <<'PY'
          import json,re,sys
          x=json.load(open(sys.argv[1],encoding='utf-8'))
          assert x.get('schema')=='chacha.dev/production-approval/v1',x
          assert x.get('scope')=='guardian-coverage-history-cleanup-production',x
          assert x.get('approved') is True and x.get('approved_by')=='operator',x
          assert x.get('candidate_revision')=='f58d76f034b7e5ec423e312d78f8ca92b8d92111',x
          assert x.get('active_production_revision')=='3d403f60fe1a5c836b6fb84ddef24b7d74378307',x
          assert x.get('alignment_run_id')==37122801656,x
          assert x.get('heartbeat_snapshot_id')=='coverage-8ada9a440ddd4629bc8647ea5d32d964',x
          assert x.get('alert_ids')==[
            'coverage-missing-guardian-action-state-reconciler',
            'coverage-stale-guardian-action-state-reconciler'],x
          assert x.get('directive_ids')==[
            'remed-coverage-missing-guardian-action-state-reconciler',
            'remed-coverage-stale-guardian-action-state-reconciler'],x
          for k in ['worker_deploy','platform_current_switch','native_local_activation','guardian_latch_clear','functional_remediation_apply','action_lease_reconciliation_apply','row_delete','destructive_cleanup']:
              assert x.get(k) is False,(k,x)
          with open(sys.argv[2],'a') as f:
              f.write('candidate='+x['candidate_revision']+'\n')
          print('CHACHA_DEV_GUARDIAN_COVERAGE_HISTORY_OPERATOR_APPROVAL=PASS')
          PY

      - name: Verify prerequisite alignment run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          req=urllib.request.Request(
            'https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['EXPECTED_ALIGNMENT_RUN'],
            headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as r:x=json.load(r)
          assert x.get('name')=='Guardian coverage alignment production',x
          assert x.get('conclusion')=='success',x
          print('CHACHA_DEV_GUARDIAN_COVERAGE_HISTORY_ALIGNMENT_PREREQUISITE=PASS')
          PY

      - name: Resolve Guardian D1 target
        id: cf
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.parse,urllib.request
          token=os.environ['CF_API_TOKEN']; aid=os.environ.get('CF_ACCOUNT_ID','').strip(); h={'Authorization':'Bearer '+token}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=30) as r:return r.status,json.load(r)
          if not aid:
              st,p=get('https://api.cloudflare.com/client/v4/accounts?per_page=50'); rows=p.get('result') or []
              if len(rows)!=1: raise SystemExit('ACCOUNT_RESOLUTION_FAILED')
              aid=rows[0]['id']
          st,p=get('https://api.cloudflare.com/client/v4/accounts/'+aid+'/d1/database?name='+urllib.parse.quote('chacha-dev-guardian'))
          db=next((x for x in (p.get('result') or []) if x.get('name')=='chacha-dev-guardian'),None)
          if st!=200 or not db: raise SystemExit('GUARDIAN_D1_MISSING')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('account_id='+aid+'\n'); f.write('database_id='+db['uuid']+'\n')
          print('CHACHA_DEV_GUARDIAN_COVERAGE_HISTORY_TARGET=PASS')
          PY

      - name: Prepare D1-only Wrangler contract
        run: |
          cat > .wrangler-guardian-coverage-history.jsonc <<EOF
          {"name":"chacha-dev-guardian","main":"dev-hub/guardian/worker.js","compatibility_date":"2026-09-24","d1_databases":[{"binding":"DB","database_name":"chacha-dev-guardian","database_id":"${{ steps.cf.outputs.database_id }}"}]}
          EOF

      - name: Capture rollback snapshot and enforce preconditions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        run: |
          set -euo pipefail
          W='.wrangler-guardian-coverage-history.jsonc'
          npx --yes wrangler@4.45.0 d1 execute chacha-dev-guardian --remote --config="$W" --json --command="SELECT * FROM guardian_alerts WHERE alert_id IN ('coverage-missing-guardian-action-state-reconciler','coverage-stale-guardian-action-state-reconciler','functional-guardian-func-dec5fdd67a52486f9c9e056664222591') ORDER BY alert_id;" > /tmp/history-alerts-before.json
          npx --yes wrangler@4.45.0 d1 execute chacha-dev-guardian --remote --config="$W" --json --command="SELECT * FROM remediation_directives WHERE directive_id IN ('remed-coverage-missing-guardian-action-state-reconciler','remed-coverage-stale-guardian-action-state-reconciler','remed-functional-guardian-func-dec5fdd67a52486f9c9e056664222591') ORDER BY directive_id;" > /tmp/history-remeds-before.json
          npx --yes wrangler@4.45.0 d1 execute chacha-dev-guardian --remote --config="$W" --json --command="SELECT * FROM remediation_holds WHERE directive_id IN ('remed-coverage-missing-guardian-action-state-reconciler','remed-coverage-stale-guardian-action-state-reconciler') ORDER BY hold_key;" > /tmp/history-holds-before.json
          npx --yes wrangler@4.45.0 d1 execute chacha-dev-guardian --remote --config="$W" --json --command="SELECT component_id FROM expected_components ORDER BY component_id;" > /tmp/history-expected-before.json
          python3 - <<'PY'
          import json
          def rows(path):
              raw=json.load(open(path)); out=[]
              def walk(v):
                  if isinstance(v,dict):
                      if isinstance(v.get('results'),list): out.extend(v['results'])
                      for z in v.values(): walk(z)
                  elif isinstance(v,list):
                      for z in v: walk(z)
              walk(raw); return out
          alerts=rows('/tmp/history-alerts-before.json'); rems=rows('/tmp/history-remeds-before.json'); holds=rows('/tmp/history-holds-before.json'); exp=rows('/tmp/history-expected-before.json')
          target_alerts={'coverage-missing-guardian-action-state-reconciler','coverage-stale-guardian-action-state-reconciler'}
          target_rems={'remed-coverage-missing-guardian-action-state-reconciler','remed-coverage-stale-guardian-action-state-reconciler'}
          amap={r['alert_id']:r for r in alerts}; rmap={r['directive_id']:r for r in rems}
          assert target_alerts <= set(amap),amap.keys()
          assert target_rems <= set(rmap),rmap.keys()
          assert all(amap[x]['status']=='OPEN' for x in target_alerts),amap
          assert all(rmap[x]['status']=='DELIVERED' for x in target_rems),rmap
          assert amap['functional-guardian-func-dec5fdd67a52486f9c9e056664222591']['status']=='OPEN',amap
          assert rmap['remed-functional-guardian-func-dec5fdd67a52486f9c9e056664222591']['status']=='DELIVERED',rmap
          ids={r['component_id'] for r in exp}
          assert len(ids)==56,len(ids)
          assert 'guardian-action-state-reconciler' not in ids,ids
          assert 'governed-platform-promotion' in ids,ids
          q=lambda s:"NULL" if s is None else "'"+str(s).replace("'","''")+"'"
          sql=[]
          for aid in sorted(target_alerts): sql.append("UPDATE guardian_alerts SET status='OPEN' WHERE alert_id="+q(aid)+";")
          for rid in sorted(target_rems):
              r=rmap[rid]
              sql.append("UPDATE remediation_directives SET status="+q(r['status'])+",applied_at="+q(r.get('applied_at'))+",resolution_evidence_json="+q(r.get('resolution_evidence_json'))+" WHERE directive_id="+q(rid)+";")
          for h in holds:
              sql.append("UPDATE remediation_holds SET active="+str(int(h.get('active') or 0))+",cleared_at="+q(h.get('cleared_at'))+" WHERE hold_key="+q(h['hold_key'])+";")
          open('/tmp/history-cleanup-rollback.sql','w').write('\n'.join(sql)+'\n')
          print('CHACHA_DEV_GUARDIAN_COVERAGE_HISTORY_PRECONDITIONS=PASS')
          print('TARGET_ALERTS=2'); print('TARGET_DIRECTIVES=2'); print('TARGET_HOLDS='+str(len(holds)))
          PY

      - name: Persist pre-mutation rollback evidence
        uses: actions/upload-artifact@v4
        with:
          name: guardian-coverage-history-cleanup-rollback
          path: |
            /tmp/history-alerts-before.json
            /tmp/history-remeds-before.json
            /tmp/history-holds-before.json
            /tmp/history-expected-before.json
            /tmp/history-cleanup-rollback.sql
          retention-days: 30

      - name: Terminalize exact historical coverage records with automatic rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        run: |
          set -euo pipefail
          W='.wrangler-guardian-coverage-history.jsonc'; MUTATED=0
          rollback(){ set +e; if [[ "$MUTATED" = 1 ]]; then npx --yes wrangler@4.45.0 d1 execute chacha-dev-guardian --remote --file=/tmp/history-cleanup-rollback.sql --config="$W"; fi; echo CHACHA_DEV_GUARDIAN_COVERAGE_HISTORY_AUTOMATIC_ROLLBACK=PASS; }
          trap rollback ERR
          python3 - <<'PY'
          import json
          ev=json.dumps({
            'source':'bounded-coverage-history-cleanup',
            'alignment_run_id':37122801656,
            'heartbeat_snapshot_id':'coverage-8ada9a440ddd4629bc8647ea5d32d964',
            'resolution':'EXPECTED_COMPONENT_REMOVED_AFTER_ACTIVE_PRODUCTION_REALIGNMENT',
            'active_production_revision':'3d403f60fe1a5c836b6fb84ddef24b7d74378307',
            'candidate_revision':'f58d76f034b7e5ec423e312d78f8ca92b8d92111',
            'expected_components':56,
            'coverage_ratio':1.0,
            'functional_drift_untouched':True
          },sort_keys=True,separators=(',',':'))
          q=lambda s:"'"+str(s).replace("'","''")+"'"
          alerts=['coverage-missing-guardian-action-state-reconciler','coverage-stale-guardian-action-state-reconciler']
          rems=['remed-coverage-missing-guardian-action-state-reconciler','remed-coverage-stale-guardian-action-state-reconciler']
          sql=[]
          for aid in alerts: sql.append("UPDATE guardian_alerts SET status='ACKED' WHERE alert_id="+q(aid)+" AND status='OPEN';")
          for rid in rems: sql.append("UPDATE remediation_directives SET status='APPLIED',applied_at=datetime('now'),resolution_evidence_json="+q(ev)+" WHERE directive_id="+q(rid)+" AND status='DELIVERED';")
          sql.append("UPDATE remediation_holds SET active=0,cleared_at=datetime('now') WHERE directive_id IN ("+','.join(q(x) for x in rems)+") AND active=1;")
          open('/tmp/history-cleanup-apply.sql','w').write('\n'.join(sql)+'\n')
          PY
          MUTATED=1
          npx --yes wrangler@4.45.0 d1 execute chacha-dev-guardian --remote --file=/tmp/history-cleanup-apply.sql --config="$W"
          npx --yes wrangler@4.45.0 d1 execute chacha-dev-guardian --remote --config="$W" --json --command="SELECT * FROM guardian_alerts WHERE alert_id IN ('coverage-missing-guardian-action-state-reconciler','coverage-stale-guardian-action-state-reconciler','functional-guardian-func-dec5fdd67a52486f9c9e056664222591') ORDER BY alert_id;" > /tmp/history-alerts-after.json
          npx --yes wrangler@4.45.0 d1 execute chacha-dev-guardian --remote --config="$W" --json --command="SELECT * FROM remediation_directives WHERE directive_id IN ('remed-coverage-missing-guardian-action-state-reconciler','remed-coverage-stale-guardian-action-state-reconciler','remed-functional-guardian-func-dec5fdd67a52486f9c9e056664222591') ORDER BY directive_id;" > /tmp/history-remeds-after.json
          npx --yes wrangler@4.45.0 d1 execute chacha-dev-guardian --remote --config="$W" --json --command="SELECT * FROM remediation_holds WHERE directive_id IN ('remed-coverage-missing-guardian-action-state-reconciler','remed-coverage-stale-guardian-action-state-reconciler') ORDER BY hold_key;" > /tmp/history-holds-after.json
          python3 - <<'PY'
          import json
          def rows(path):
              raw=json.load(open(path)); out=[]
              def walk(v):
                  if isinstance(v,dict):
                      if isinstance(v.get('results'),list): out.extend(v['results'])
                      for z in v.values(): walk(z)
                  elif isinstance(v,list):
                      for z in v: walk(z)
              walk(raw); return out
          alerts={r['alert_id']:r for r in rows('/tmp/history-alerts-after.json')}
          rems={r['directive_id']:r for r in rows('/tmp/history-remeds-after.json')}
          holds=rows('/tmp/history-holds-after.json')
          for aid in ['coverage-missing-guardian-action-state-reconciler','coverage-stale-guardian-action-state-reconciler']:
              assert alerts[aid]['status']=='ACKED',alerts[aid]
          for rid in ['remed-coverage-missing-guardian-action-state-reconciler','remed-coverage-stale-guardian-action-state-reconciler']:
              r=rems[rid]; assert r['status']=='APPLIED',r; ev=json.loads(r['resolution_evidence_json']); assert ev['alignment_run_id']==37122801656 and ev['coverage_ratio']==1.0,ev
          assert all(int(h.get('active') or 0)==0 for h in holds),holds
          assert alerts['functional-guardian-func-dec5fdd67a52486f9c9e056664222591']['status']=='OPEN',alerts
          assert rems['remed-functional-guardian-func-dec5fdd67a52486f9c9e056664222591']['status']=='DELIVERED',rems
          print('CHACHA_DEV_GUARDIAN_COVERAGE_HISTORY_READBACK=PASS')
          print('COVERAGE_ALERTS_ACKED=2'); print('COVERAGE_DIRECTIVES_APPLIED=2'); print('FUNCTIONAL_DRIFT_UNTOUCHED=YES')
          PY
          trap - ERR
          echo CHACHA_DEV_GUARDIAN_COVERAGE_HISTORY_CLEANUP=PASS
          echo ROW_DELETE=NO
          echo WORKER_DEPLOY=NO
          echo PLATFORM_CURRENT_SWITCH=NO
          echo NATIVE_LOCAL_ACTIVATION=NO
          echo GUARDIAN_LATCH_CLEAR=NO
          echo FUNCTIONAL_REMEDIATION_APPLIED=NO
          echo ACTION_LEASE_RECONCILIATION_APPLIED=NO
          echo AUTOMATIC_EXTERNAL_SPEND_EUR=0

      - name: Persist post-mutation evidence
        uses: actions/upload-artifact@v4
        with:
          name: guardian-coverage-history-cleanup-after
          path: |
            /tmp/history-alerts-after.json
            /tmp/history-remeds-after.json
            /tmp/history-holds-after.json
          retention-days: 30
