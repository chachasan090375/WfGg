name: Radar V6.19.11 Manual Search Stop pilot publication qualification

on:
  push:
    branches: [radar-v61911-manual-search-stop]
    paths:
      - '.github/scripts/patch-radar-manual-search-stop-v61911.py'
      - '.github/workflows/radar-v61911-pilot-publication-qualification.yml'
      - 'radar-vps/install-v61911-pilot.sh'
      - 'radar-vps/probe-v61911-pilot-runtime.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wfgg-radar-v61911-pilot-publication
  cancel-in-progress: true

env:
  EXPECTED_CONNECTOR_SHA256: 4d66709f10d3a6b27ac255a1dfdc62e51d2817652634409ffe2edc071762c69f
  EXPECTED_NATIVE_SHA256: 274d040f5294cb09422e5d55cc4b5335ac7739924c33dcb67b3f279645814900
  EXPECTED_WORKER_SHA256: 7c557fb6850a188eb354c2ff52680c2ce0c0c6765e9e93dc0436012e1b8abfe2
  EXPECTED_TRANSPORT_SHA256: 074de8c1574781c5974ae4ba34266b76afaaac89d4ef9cd161dba88e6278cc3c
  EXPECTED_UI_SHA256: 6e6827e660597549bdc8c4c06e06a644a16215aacabdd20a56993a15f651c060

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-v61911-manual-search-stop
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Reconstruct cumulative V6.19.11 pilot candidate
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar
          mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          echo '234df1dec57f6211bc625855bf13350c9f17fbd843fbe92d8cf1ab7cb5c081ef  /tmp/radar-src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar
          rm -rf /tmp/wfgg-radar/connector-go
          cp -a .radar-release-src/v2-source/connector-go /tmp/wfgg-radar/connector-go

          python3 .github/scripts/patch-radar-target-profile-retry.py
          python3 .github/scripts/patch-radar-federated-diagnostics-v65.py
          python3 .github/scripts/patch-player-scan-v3.py
          python3 .github/scripts/patch-player-scan-v4.py
          python3 .github/scripts/patch-radar-protocol-discovery-v67.py
          python3 .github/scripts/patch-radar-profile-isolation-v68.py
          python3 .github/scripts/patch-radar-native-profile-v69.py
          python3 .github/scripts/patch-radar-native-profile-handshake-v691.py
          python3 .github/scripts/patch-radar-native-profile-exec-v692.py
          python3 .github/scripts/patch-radar-connector-runtime-v693.py
          python3 .github/scripts/patch-radar-cluster-catalog-budget-v6192.py
          python3 .github/scripts/patch-radar-seed-scout-v6193.py
          python3 .github/scripts/patch-radar-autopilot-v6194.py
          python3 .github/scripts/patch-radar-autopilot-stale-cycle-v6197.py
          python3 .github/scripts/patch-radar-collector-cycle-terminalization-v6198.py
          python3 .github/scripts/patch-radar-autopilot-targeted-history-v6199.py
          python3 .github/scripts/patch-radar-autopilot-continue-partial-v61910.py

          install -m 0644 .radar-release-src/v2-source/src/game/remote-transport.js /tmp/wfgg-radar/src/game/remote-transport.js
          python3 .github/scripts/patch-radar-async-collector-worker.py
          python3 .github/scripts/patch-radar-worker-rich-profile-v6191.py
          python3 .github/scripts/patch-radar-worker-seed-scout-v6193.py
          python3 .github/scripts/patch-radar-worker-autopilot-v6194.py

          install -m 0644 radar-ui-live/live-radar.html /tmp/wfgg-radar/public/live-radar.html
          python3 .github/scripts/patch-live-radar-seed-scout-v6193.py
          python3 .github/scripts/patch-live-radar-autopilot-v6194.py
          python3 .github/scripts/patch-radar-session-keepalive-v6195.py
          python3 .github/scripts/patch-live-radar-autopilot-v6196.py
          python3 .github/scripts/patch-live-radar-autopilot-v6197.py
          python3 .github/scripts/patch-live-radar-autopilot-v6198.py
          python3 .github/scripts/patch-live-radar-autopilot-v6199.py
          python3 .github/scripts/patch-live-radar-autopilot-v61910.py

          python3 .github/scripts/patch-radar-manual-search-stop-v61911.py
          echo RADAR_V61911_PILOT_RECONSTRUCT=PASS

      - name: Build and verify exact connector
        working-directory: /tmp/wfgg-radar/connector-go
        run: |
          set -euo pipefail
          gofmt -w ./cmd ./internal
          go test ./...
          go vet ./...
          mkdir -p "$GITHUB_WORKSPACE/radar-vps/pilot-v61911/cloudflare"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o "$GITHUB_WORKSPACE/radar-vps/pilot-v61911/radar-connector" ./cmd/radar-connector
          actual="$(sha256sum "$GITHUB_WORKSPACE/radar-vps/pilot-v61911/radar-connector" | awk '{print $1}')"
          echo "RADAR_V61911_CONNECTOR_SHA256=$actual"
          test "$actual" = "$EXPECTED_CONNECTOR_SHA256"
          grep -aFq 'MANUAL_SEARCH_STOPPED' "$GITHUB_WORKSPACE/radar-vps/pilot-v61911/radar-connector"
          grep -aFq '/v1/collector/search/stop' "$GITHUB_WORKSPACE/radar-vps/pilot-v61911/radar-connector"
          echo RADAR_V61911_CONNECTOR=PASS

      - name: Verify unchanged native helper
        run: |
          set -euo pipefail
          actual="$(sha256sum radar-vps/release/radar-native-template | awk '{print $1}')"
          echo "RADAR_V61911_NATIVE_SHA256=$actual"
          test "$actual" = "$EXPECTED_NATIVE_SHA256"
          echo RADAR_V61911_NATIVE=UNCHANGED

      - name: Stage and verify pilot Cloudflare surfaces
        run: |
          set -euo pipefail
          node --check /tmp/wfgg-radar/src/worker.js
          node --check /tmp/wfgg-radar/src/game/remote-transport.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('/tmp/wfgg-radar/public/live-radar.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',html,re.S)
          if not m:
              raise SystemExit('LIVE_RADAR_SCRIPT_MISSING')
          Path('/tmp/live-radar-v61911-pilot.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/live-radar-v61911-pilot.js

          worker="$(sha256sum /tmp/wfgg-radar/src/worker.js | awk '{print $1}')"
          transport="$(sha256sum /tmp/wfgg-radar/src/game/remote-transport.js | awk '{print $1}')"
          ui="$(sha256sum /tmp/wfgg-radar/public/live-radar.html | awk '{print $1}')"
          test "$worker" = "$EXPECTED_WORKER_SHA256"
          test "$transport" = "$EXPECTED_TRANSPORT_SHA256"
          test "$ui" = "$EXPECTED_UI_SHA256"

          install -m 0644 /tmp/wfgg-radar/src/worker.js radar-vps/pilot-v61911/cloudflare/worker.js
          install -m 0644 /tmp/wfgg-radar/src/game/remote-transport.js radar-vps/pilot-v61911/cloudflare/remote-transport.js
          install -m 0644 /tmp/wfgg-radar/public/live-radar.html radar-vps/pilot-v61911/cloudflare/live-radar.html

          grep -Fq '/api/radar/search/stop' radar-vps/pilot-v61911/cloudflare/worker.js
          grep -Fq 'gameMutation: false' radar-vps/pilot-v61911/cloudflare/worker.js
          grep -Fq 'stopCollectorSearch(id)' radar-vps/pilot-v61911/cloudflare/remote-transport.js
          grep -Fq "manualSearchRunning" radar-vps/pilot-v61911/cloudflare/live-radar.html
          grep -Fq "manualSearchStopping" radar-vps/pilot-v61911/cloudflare/live-radar.html
          grep -Fq "requestManualSearchStop" radar-vps/pilot-v61911/cloudflare/live-radar.html
          grep -Fq "go.textContent=manualSearchRunning?(manualSearchStopping?'ARRÊT…':'STOP'):'RECHERCHER'" radar-vps/pilot-v61911/cloudflare/live-radar.html
          echo RADAR_V61911_PILOT_SURFACES=STAGED

      - name: Verify guard probe and safety contract
        run: |
          set -euo pipefail
          bash -n radar-vps/install-v61911-pilot.sh
          bash -n radar-vps/probe-v61911-pilot-runtime.sh
          grep -Fq 'RADAR_V61911_GAME_SCAN_EXECUTED=NO' radar-vps/probe-v61911-pilot-runtime.sh
          grep -Fq 'RADAR_V61911_COLLECTOR_MUTATION=NO' radar-vps/probe-v61911-pilot-runtime.sh
          grep -Fq 'RADAR_V61911_LASTWAR_MODE=READ_ONLY' radar-vps/probe-v61911-pilot-runtime.sh
          grep -Fq 'RADAR_V61911_TOKEN_READ=NO' radar-vps/probe-v61911-pilot-runtime.sh
          grep -Fq 'RADAR_V61911_TOKEN_PERSISTENCE=NO' radar-vps/probe-v61911-pilot-runtime.sh
          grep -Fq 'RADAR_V61911_PRODUCTION_DEPLOYMENT=NO' radar-vps/probe-v61911-pilot-runtime.sh
          grep -Fq 'RADAR_V61911_RUNTIME_PROBE=PASS' radar-vps/probe-v61911-pilot-runtime.sh
          grep -Fq 'WFGG_RADAR_V6191_REV' radar-vps/install-v61911-pilot.sh
          ! grep -Fq 'request("POST","/v1/collector/search",' radar-vps/probe-v61911-pilot-runtime.sh
          ! grep -Fq '/v1/collector/autopilot/start' radar-vps/probe-v61911-pilot-runtime.sh
          ! grep -REiq 'building\.production\.collect|mail\.reward|al\.science\.donate|visitor\.operate|march|attack|purchase' .github/scripts/patch-radar-manual-search-stop-v61911.py
          echo RADAR_V61911_GUARD_PROBE_CONTRACT=PASS
          echo RADAR_V61911_LASTWAR_MODE=READ_ONLY
          echo RADAR_V61911_TOKEN_PERSISTENCE=NO
          echo RADAR_V61911_PRODUCTION_DEPLOYMENT=NO

      - name: Publish qualified V6.19.11 pilot artifacts to branch only
        run: |
          set -euo pipefail
          chmod 0755 radar-vps/pilot-v61911/radar-connector
          (
            cd radar-vps/pilot-v61911
            sha256sum radar-connector > SHA256SUMS
            cd cloudflare
            sha256sum worker.js remote-transport.js live-radar.html > ../CLOUDFLARE_SHA256SUMS
          )
          {
            echo "WFGG_RADAR_PILOT=V6.19.11"
            echo "SOURCE_BRANCH=radar-v61911-manual-search-stop"
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "CHANGE=manual-search-stop"
            echo "MANUAL_SEARCH_STOP=YES"
            echo "BUTTON_TOGGLE=RECHERCHER_STOP_RECHERCHER"
            echo "STOP_SCOPE=MANUAL_SEARCH_ONLY"
            echo "LASTWAR_MODE=READ_ONLY"
            echo "GAME_SCAN_GUARD_PROBE=NO"
            echo "COLLECTOR_MUTATION_GUARD_PROBE=NO"
            echo "TOKEN_PERSISTENCE=NO"
            echo "NATIVE_HELPER=UNCHANGED"
            echo "PRODUCTION_DEPLOYMENT=NO"
            echo "PRODUCTION_PROMOTION=NO"
          } > radar-vps/pilot-v61911/PILOT_INFO.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar-vps/pilot-v61911
          if git diff --cached --quiet; then
            echo RADAR_V61911_PILOT=UNCHANGED
            exit 0
          fi
          git commit -m 'build(radar): publish V6.19.11 Manual Search Stop pilot'
          git push origin HEAD:radar-v61911-manual-search-stop
          echo RADAR_V61911_PILOT=PUBLISHED
