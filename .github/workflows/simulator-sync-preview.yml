name: Sync simulator preview

on:
  push:
    branches:
      - simulator-standalone-v1
    paths:
      - 'simulator/**'
      - '.github/workflows/simulator-sync-preview.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: simulator-standalone-v1
          fetch-depth: 0

      - name: Repair bootstrap ordering if needed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('simulator/app.js')
          s=p.read_text(encoding='utf-8')
          state_line="  let state = loadState();\n"
          clone_line="  const clone = obj => JSON.parse(JSON.stringify(obj));\n"
          if state_line not in s or clone_line not in s:
              raise SystemExit('bootstrap markers missing')
          if s.index(state_line) < s.index(clone_line):
              s=s.replace(state_line,'',1)
              s=s.replace(clone_line,clone_line+state_line,1)
              p.write_text(s,encoding='utf-8')
              print('bootstrap repaired')
          else:
              print('bootstrap already correct')
          PY

      - name: Mirror simulator into Pages output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf frontend/simulator
          mkdir -p frontend
          cp -a simulator frontend/simulator
          if git diff --quiet -- simulator/app.js frontend/simulator; then
            echo 'Simulator and preview mirror already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulator/app.js frontend/simulator
          git diff --cached --check
          git commit -m 'fix: repair simulator bootstrap and sync preview'
          git push origin HEAD:simulator-standalone-v1
