name: Sync simulator preview

on:
  push:
    branches:
      - simulator-standalone-v1
    paths:
      - 'simulator/**'
      - '.github/workflows/simulator-sync-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: simulator-standalone-v1
          fetch-depth: 0

      - name: Mirror canonical simulator into Cloudflare output
        shell: bash
        run: |
          set -euo pipefail
          test -d simulator
          mkdir -p frontend/simulator
          rsync -a --delete simulator/ frontend/simulator/

          # The published copy must be byte-identical to the canonical source.
          diff -qr simulator frontend/simulator

          echo -n 'CANONICAL_INDEX='; sha256sum simulator/index.html | cut -d' ' -f1
          echo -n 'PUBLISHED_INDEX='; sha256sum frontend/simulator/index.html | cut -d' ' -f1
          echo -n 'CANONICAL_OWNER='; sha256sum simulator/hero-portrait-owner-v223.js | cut -d' ' -f1
          echo -n 'PUBLISHED_OWNER='; sha256sum frontend/simulator/hero-portrait-owner-v223.js | cut -d' ' -f1

          grep -q '0224-frame2-handoff' frontend/simulator/index.html
          grep -q "22.3.2-frame2-handoff" frontend/simulator/hero-portrait-owner-v223.js
          grep -q 'wfgg-v223-owned' frontend/simulator/hero-portrait-owner-v223.js
          grep -q 'wfgg-v223-frame2' frontend/simulator/hero-portrait-owner-v223.js

      - name: Commit synchronized Cloudflare output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/simulator; then
            echo 'SIMULATOR_PREVIEW_ALREADY_SYNCED=YES'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A frontend/simulator
          git diff --cached --check
          git commit -m 'simulator: sync canonical source to Cloudflare preview output'
          git push origin HEAD:simulator-standalone-v1
