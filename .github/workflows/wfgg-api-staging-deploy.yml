name: WfGg staging Worker manual deploy fallback

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: worker-staging
    steps:
      - uses: actions/checkout@v4

      - name: Install staging dependencies
        run: npm install --no-audit --no-fund

      - name: Stage and validate runtime
        run: |
          npm run stage
          npm run check
          grep -q "LASTWAR_RECONNECT_GSL_FAILED" src/lastwar-identity.js
          grep -q "LASTWAR_BROKER_UNAVAILABLE" src/lastwar-identity.js
          grep -q '"name": "wfgg-api-staging"' wrangler.jsonc

      - name: Deploy fallback
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
