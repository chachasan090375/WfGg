name: wfgg-api build diagnostic v1

on:
  push:
    branches: [wfgg-api-build-diagnostic-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect worker project
        run: |
          pwd
          find worker -maxdepth 2 -type f -print | sort
          cat worker/package.json
          cat worker/wrangler.jsonc
      - name: Install worker dependencies
        working-directory: worker
        run: npm install
      - name: Syntax and module checks
        working-directory: worker
        run: |
          npm run check
          node --check src/core.js
          node --check src/index.js
      - name: Worker-root dry-run
        working-directory: worker
        run: npx wrangler deploy --dry-run --outdir /tmp/wfgg-api-worker-root
      - name: Repo-root dry-run before redirect
        shell: bash
        run: |
          set +e
          npx --yes wrangler@4.130.0 deploy --dry-run --outdir /tmp/wfgg-api-repo-root-before > /tmp/root-before.log 2>&1
          rc=$?
          set -e
          echo "ROOT_BEFORE_RC=$rc"
          tail -n 80 /tmp/root-before.log
          if [ "$rc" -eq 0 ]; then
            echo 'ROOT_BEFORE_ALREADY_WORKS=yes'
          else
            echo 'ROOT_BEFORE_ALREADY_WORKS=no'
          fi
      - name: Create temporary Wrangler config redirect
        run: |
          mkdir -p .wrangler/deploy
          printf '%s\n' '{ "configPath": "../../worker/wrangler.jsonc" }' > .wrangler/deploy/config.json
          cat .wrangler/deploy/config.json
      - name: Repo-root dry-run through redirect
        run: |
          npx --yes wrangler@4.130.0 deploy --dry-run --outdir /tmp/wfgg-api-repo-root-after
          test -s /tmp/wfgg-api-repo-root-after/index.js
          grep -q 'wfgg-api' /tmp/wfgg-api-repo-root-after/README.md || true
      - name: Compare bundles
        run: |
          sha256sum /tmp/wfgg-api-worker-root/index.js /tmp/wfgg-api-repo-root-after/index.js
          cmp /tmp/wfgg-api-worker-root/index.js /tmp/wfgg-api-repo-root-after/index.js
          echo 'ROOT_REDIRECT_EQUIVALENT_BUNDLE=OK'
