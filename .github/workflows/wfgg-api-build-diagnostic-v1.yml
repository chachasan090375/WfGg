name: wfgg-api build diagnostic v1

on:
  push:
    branches: [wfgg-api-build-diagnostic-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install worker dependencies
        working-directory: worker
        run: npm install
      - name: Syntax and config contract
        run: |
          node --check worker/src/core.js
          node --check worker/src/index.js
          grep -q '"name": "wfgg-api"' wrangler.jsonc
          grep -q '"main": "worker/src/index.js"' wrangler.jsonc
          grep -q '"database_id": "fda272af-36f9-4f4b-8e44-857271f9d016"' wrangler.jsonc
          grep -q '"bucket_name": "wfgg-avatars"' wrangler.jsonc
      - name: Worker-directory dry-run
        working-directory: worker
        run: |
          npx wrangler deploy --dry-run --outdir /tmp/wfgg-api-worker-dir | tee /tmp/worker-dir.log
          test -s /tmp/wfgg-api-worker-dir/index.js
      - name: Repository-root dry-run
        run: |
          npx --yes wrangler@4.130.0 deploy --dry-run --outdir /tmp/wfgg-api-repo-root | tee /tmp/repo-root.log
          test -s /tmp/wfgg-api-repo-root/index.js
      - name: Validate equivalent Worker contract
        run: |
          node --check /tmp/wfgg-api-worker-dir/index.js
          node --check /tmp/wfgg-api-repo-root/index.js
          grep -q 'env.DB (wfgg-db)' /tmp/worker-dir.log
          grep -q 'env.DB (wfgg-db)' /tmp/repo-root.log
          grep -q 'env.AVATARS (wfgg-avatars)' /tmp/worker-dir.log
          grep -q 'env.AVATARS (wfgg-avatars)' /tmp/repo-root.log
          grep -q 'env.PORTAL_ORIGINS' /tmp/worker-dir.log
          grep -q 'env.PORTAL_ORIGINS' /tmp/repo-root.log
          echo 'WFGG_API_BOTH_BUILD_CONTEXTS=OK'
