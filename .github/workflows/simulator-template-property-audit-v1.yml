name: Simulator template property growth audit v1

on:
  push:
    branches: [simulator-standalone-v1]
    paths: ['.github/workflows/simulator-template-property-audit-v1.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simulator-standalone-v1
          fetch-depth: 0
      - name: Prepare current DataTable and decompiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lw/xapk /tmp/lw/decompiled simulator/research
          curl -fL --retry 2 --connect-timeout 20 --max-time 900 'https://d.apkpure.net/b/XAPK/com.fun.lastwar.gp?versionCode=1864' -o /tmp/lw/current.xapk
          python3 - <<'PY'
          import json,zipfile,pathlib,re,hashlib,subprocess
          root=pathlib.Path('/tmp/lw'); p=root/'current.xapk'
          with zipfile.ZipFile(p) as z:
              mans=[n for n in z.namelist() if pathlib.PurePosixPath(n).name.lower() in ('manifest.json','xapk_manifest.json')]
              d=json.loads(z.read(mans[0]).decode('utf-8','replace'))
          if (str(d.get('package_name') or d.get('packageName') or d.get('package') or ''),str(d.get('version_name') or d.get('versionName') or ''),str(d.get('version_code') or d.get('versionCode') or ''))!=('com.fun.lastwar.gp','1.0.359','1864'): raise SystemExit('Unexpected client metadata')
          subprocess.run(['unzip','-q',str(p),'-d',str(root/'xapk')],check=True)
          for apk in sorted((root/'xapk').rglob('*.apk'),key=lambda x:x.stat().st_size,reverse=True):
              try:
                  with zipfile.ZipFile(apk) as z:
                      tn=next((n for n in z.namelist() if re.search(r'(^|/)assets/table/table_.*\.data$',n,re.I)),None)
                      if not tn: continue
                      raw=z.read(tn); (root/'table.data').write_bytes(raw)
                      (root/'source.json').write_text(json.dumps({'apk':apk.name,'path':tn,'bytes':len(raw),'md5':hashlib.md5(raw).hexdigest(),'sha256':hashlib.sha256(raw).hexdigest()},indent=2)+'\n')
                      break
              except zipfile.BadZipFile: pass
          if not (root/'table.data').exists(): raise SystemExit('DataTable not found')
          PY
          if ! command -v lua5.3 >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq lua5.3; fi
          git clone --depth=1 https://github.com/HansWessels/unluac.git /tmp/unluac >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/unluac/src/unluac/parse/LHeaderType.java'); s=p.read_text()
          s=s.replace('if(format != 0) {','if(format != 0 && format != 1) {',1)
          marker='class LHeaderType53 extends LHeaderType {'; pos=s.index(marker); head,tail=s[:pos],s[pos:]
          old='    parse_instruction_size(buffer, header, s);'
          if old not in tail: raise SystemExit('Lua53 instruction size call not found')
          p.write_text(head+tail.replace(old,'    if(s.format != 1) parse_instruction_size(buffer, header, s);',1))
          PY
          (cd /tmp/unluac && bash build.sh >/dev/null)
      - name: Decompile and extract template property rows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,zipfile,subprocess,tempfile,json
          root=pathlib.Path('/tmp/lw'); jar='/tmp/unluac/bin/unluac.jar'
          names=['lw_template_property','lw_template_property_category']
          with zipfile.ZipFile(root/'table.data') as z:
              for n in names:
                  raw=z.read(n)
                  with tempfile.NamedTemporaryFile(suffix='.luac') as f:
                      f.write(raw); f.flush(); cp=subprocess.run(['java','-jar',jar,f.name],stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,timeout=45)
                  if cp.returncode: raise SystemExit(cp.stderr[-500:])
                  (root/'decompiled'/(n+'.lua')).write_text(cp.stdout)
          PY
          cat >/tmp/lw/dump.lua <<'LUA'
          local function dense(t)
            local n=0
            for k,_ in pairs(t) do if type(k)~='number' or k<1 or math.floor(k)~=k then return false,0 end; if k>n then n=k end end
            for i=1,n do if rawget(t,i)==nil then return false,n end end
            return true,n
          end
          local function esc(s) return (s:gsub('\\','\\\\'):gsub('"','\\"'):gsub('\n','\\n'):gsub('\r','\\r'):gsub('\t','\\t')) end
          local function enc(v,d,seen)
            d=d or 0; seen=seen or {}; local ty=type(v)
            if ty=='nil' then return 'null' elseif ty=='number' then return tostring(v) elseif ty=='boolean' then return v and 'true' or 'false' elseif ty=='string' then return '"'..esc(v)..'"' end
            if ty~='table' or d>12 or seen[v] then return 'null' end; seen[v]=true
            local a,n=dense(v); local p={}
            if a then for i=1,n do p[#p+1]=enc(v[i],d+1,seen) end; seen[v]=nil; return '['..table.concat(p,',')..']' end
            local ks={}; for k,_ in pairs(v) do ks[#ks+1]=k end; table.sort(ks,function(a,b)return tostring(a)<tostring(b)end)
            for _,k in ipairs(ks) do p[#p+1]='"'..esc(tostring(k))..'":'..enc(v[k],d+1,seen) end; seen[v]=nil; return '{'..table.concat(p,',')..'}'
          end
          local ok,T=pcall(dofile,arg[1]); if not ok then io.stderr:write(tostring(T)..'\n'); os.exit(2) end
          print(enc(T))
          LUA
          python3 - <<'PY'
          import json,pathlib,subprocess
          root=pathlib.Path('/tmp/lw'); source=json.loads((root/'source.json').read_text())
          def load(name):
              cp=subprocess.run(['lua5.3','/tmp/lw/dump.lua',str(root/'decompiled'/(name+'.lua'))],stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,timeout=45)
              if cp.returncode: raise RuntimeError(cp.stderr[-500:])
              return json.loads(cp.stdout)
          def get(row,pos):
              if isinstance(row,list): return row[pos-1] if pos-1<len(row) else None
              if isinstance(row,dict): return row.get(str(pos),row.get(pos))
          def decode(T):
              idx=T.get('index',{}); data=T.get('data',{}); vext=T.get('vExt')
              F={n:{'column':int(d[0]),'type':d[1],'linked':bool(d[2]) if len(d)>2 else False} for n,d in idx.items() if isinstance(d,list) and len(d)>=2}
              def ext(v):
                  if not isinstance(v,(int,float)) or int(v)!=v or int(v)<1:return v
                  k=int(v)
                  if isinstance(vext,list) and k<=len(vext): return vext[k-1]
                  if isinstance(vext,dict): return vext.get(str(k),vext.get(k,v))
                  return v
              items=list(data.items()) if isinstance(data,dict) else [(i+1,r) for i,r in enumerate(data or [])]
              out=[]
              for key,row in items:
                  rec={'_key':int(key) if str(key).isdigit() else key}
                  for n,fd in F.items():
                      v=get(row,fd['column']); rec[n]=ext(v) if fd['linked'] else v
                  out.append(rec)
              return F,out
          Fp,prop=decode(load('lw_template_property')); Fc,cat=decode(load('lw_template_property_category'))
          # Preserve all rows because these tables are small enough and numeric-only; also derive likely Williams-related subsets.
          category_matches=[r for r in cat if r.get('quality')==5 and r.get('template_id')==2]
          type2=[r for r in prop if r.get('type')==2]
          levels={int(r.get('level')):r for r in type2 if isinstance(r.get('level'),(int,float))}
          checkpoints={str(k):levels.get(k) for k in (1,50,100,150,174,175) if levels.get(k) is not None}
          out={'source':source,'propertyFields':Fp,'categoryFields':Fc,'categoryRows':cat,'categoryWilliamsTemplateQuality':category_matches,'type2RowCount':len(type2),'type2LevelRange':[min(levels) if levels else None,max(levels) if levels else None],'type2Checkpoints':checkpoints,'type2Rows':type2,'interpretationStatus':'raw_native_rows_only_formula_not_assumed'}
          p=pathlib.Path('simulator/research/template-property-growth-audit.v1.json'); p.write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps({'categoryMatches':category_matches,'type2Rows':len(type2),'levelRange':out['type2LevelRange'],'checkpoints':checkpoints,'outputBytes':p.stat().st_size},indent=2))
          PY
      - name: Commit template property growth audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add simulator/research/template-property-growth-audit.v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'simulator: capture template property growth audit'
          git fetch origin simulator-standalone-v1
          git rebase origin/simulator-standalone-v1
          git push origin HEAD:simulator-standalone-v1
