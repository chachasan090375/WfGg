name: Dev Hub V5 Claude PILOT Preparation

on:
  workflow_dispatch:
  push:
    branches:
      - dev-hub-v5-claude-pilot-prep
    paths:
      - 'dev-hub/config/claude-managed-agents-pilot.v1.json'
      - 'dev-hub/config/claude-agent-adapter.v1.json'
      - 'dev-hub/config/provider-adapters.v1.json'
      - 'dev-hub/config/capability-registry.v1.json'
      - 'dev-hub/fixtures/claude-pilot-readonly-fixture.txt'
      - 'dev-hub/bin/claude-managed-agents-pilot-preflight.py'
      - 'dev-hub/bin/claude-managed-agents-pilot-probe.py'
      - 'dev-hub/docs/CLAUDE_PILOT_PREP_V1.md'
      - '.github/workflows/dev-hub-v5-claude-pilot-prep.yml'
  pull_request:
    paths:
      - 'dev-hub/config/claude-managed-agents-pilot.v1.json'
      - 'dev-hub/config/claude-agent-adapter.v1.json'
      - 'dev-hub/config/provider-adapters.v1.json'
      - 'dev-hub/config/capability-registry.v1.json'
      - 'dev-hub/fixtures/claude-pilot-readonly-fixture.txt'
      - 'dev-hub/bin/claude-managed-agents-pilot-preflight.py'
      - 'dev-hub/bin/claude-managed-agents-pilot-probe.py'
      - 'dev-hub/docs/CLAUDE_PILOT_PREP_V1.md'
      - '.github/workflows/dev-hub-v5-claude-pilot-prep.yml'

permissions:
  contents: read

jobs:
  preflight:
    if: github.event_name != 'pull_request' || github.event.pull_request.base.ref == 'dev-hub-v5-claude-contract-ok'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static JSON and Python syntax
        run: |
          python -m json.tool dev-hub/config/claude-managed-agents-pilot.v1.json >/dev/null
          python -m json.tool dev-hub/config/claude-agent-adapter.v1.json >/dev/null
          python -m json.tool dev-hub/config/provider-adapters.v1.json >/dev/null
          python -m json.tool dev-hub/config/capability-registry.v1.json >/dev/null
          python -m py_compile dev-hub/bin/claude-managed-agents-pilot-preflight.py
          python -m py_compile dev-hub/bin/claude-managed-agents-pilot-probe.py

      - name: Run no-secret PILOT preflight
        env:
          CLAUDE_PILOT_PREFLIGHT_OUTPUT: /tmp/claude-pilot-preflight.json
        run: python dev-hub/bin/claude-managed-agents-pilot-preflight.py

      - name: Confirm expected blocked preparation state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/claude-pilot-preflight.json').read_text())
          assert value['schema'] == 'chacha.dev/claude-managed-agents-pilot-preflight/v1'
          assert value['status'] == 'BLOCKED_AUTH_MISSING', value
          assert value['source_status'] == 'CONTRACT_OK'
          assert value['target_status'] == 'PILOT'
          assert value['runtime_surface'] == 'claude-managed-agents'
          assert value['registry_mutated'] is False
          assert value['runtime_executed'] is False
          assert value['credential_value_observed'] is False
          assert value['credential_reference_present'] is False
          assert value['promotion_eligible'] is False
          assert value['automatic_promotion'] is False
          assert value['static_blockers'] == []
          assert 'ANTHROPIC_API_KEY' in value['missing_external_references']
          assert value['next_action'] == 'configure-external-auth-reference'
          print('CLAUDE_PILOT_PREP=PASS expected_block=AUTH_MISSING runtime=false mutation=false')
          PY

      - name: Confirm live harness cannot run without external references
        run: |
          set +e
          python dev-hub/bin/claude-managed-agents-pilot-probe.py >/tmp/claude-live-harness-blocked.json
          rc=$?
          set -e
          test "$rc" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/claude-live-harness-blocked.json').read_text())
          assert value['status'] == 'BLOCKED'
          blockers = value['blockers']
          assert 'MISSING_EXTERNAL_REFERENCE:ANTHROPIC_API_KEY' in blockers
          assert any(x.startswith('MISSING_EXTERNAL_REFERENCE:CHACHA_ANTHROPIC_AGENT_ID') for x in blockers)
          print('CLAUDE_LIVE_HARNESS_GUARD=PASS no_external_references=true')
          PY

      - name: Confirm registry remains CONTRACT_OK
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          reg = json.loads(Path('dev-hub/config/provider-adapters.v1.json').read_text())
          cfg = json.loads(Path('dev-hub/config/claude-agent-adapter.v1.json').read_text())
          cap = json.loads(Path('dev-hub/config/capability-registry.v1.json').read_text())
          assert reg['adapters']['claude-agent-adapter']['status'] == 'CONTRACT_OK'
          assert cfg['runtime_status'] == 'CONTRACT_OK'
          assert reg['adapters']['claude-agent-adapter']['supports'] == ['read', 'plan']
          assert 'anthropic-claude' not in {p['id'] for p in cap['capabilities']['code-edit']['providers']}
          print('CLAUDE_REGISTRY_UNCHANGED status=CONTRACT_OK code_edit=false')
          PY

      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: claude-pilot-preflight-${{ github.run_id }}
          path: /tmp/claude-pilot-preflight.json
          if-no-files-found: error
          retention-days: 30
