name: Last War preview real unlink fix

on:
  push:
    branches:
      - connector-readonly-v1
    paths:
      - .github/workflows/lastwar-unlink-fix-preview.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: connector-readonly-v1
          fetch-depth: 0

      - name: Apply unlink patch
        run: python3 .github/scripts/apply_lastwar_unlink_preview.py

      - name: Validate patch
        run: |
          git diff --check
          grep -q "/api/lastwar/identity/unlink" worker-staging/overrides/lastwar-identity.js
          grep -q "/api/lastwar/identity/unlink" frontend/lastwar-connect-v2.js
          grep -q "014-real-unlink" frontend/index.html

      - name: Commit preview fix
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker-staging/overrides/lastwar-identity.js frontend/lastwar-connect-v2.js frontend/index.html
          git commit -m "connector: make Last War unlink real and idempotent"
          git push origin HEAD:connector-readonly-v1
