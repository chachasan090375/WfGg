name: Portal invitations Inter-Saison v21

on:
  push:
    branches: [portal-invitations-thanks-interseason-v21]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portal-invitations-thanks-interseason-v21
          fetch-depth: 0
      - name: Apply v21 patch if needed
        run: |
          if ! grep -Fq "investissement durant toute l'Inter-Saison" frontend/portal-invitations-v1.js; then
            python3 .github/scripts/invitations_thanks_interseason_v21.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/portal-invitations-v1.js frontend/index.html .github/qa/portal-invitations-recette.mjs .github/workflows/production-recette.yml
            git commit -m "Portail v21: remercier le bureau pour l'Inter-Saison"
            git push origin HEAD:portal-invitations-thanks-interseason-v21
          fi
      - name: Validate sources
        run: |
          node --check frontend/portal-invitations-v1.js
          node --check .github/qa/portal-invitations-recette.mjs
          grep -Fq "investissement durant toute l'Inter-Saison" frontend/portal-invitations-v1.js
          test "$(grep -Fc "investissement durant toute l'Inter-Saison" frontend/portal-invitations-v1.js)" -eq 4
          grep -Fq 'portal-invitations-v1.js?v=002-interseason-thanks' frontend/index.html
      - name: Generate XLSX fixture
        run: python3 .github/qa/make-invitations-xlsx-fixture.py /tmp/qa-members.xlsx
      - name: Start local portal
        run: |
          python3 -m http.server 4173 --directory frontend >/tmp/wfgg-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run invitations browser recette
        env:
          WFGG_PREVIEW: http://127.0.0.1:4173
          WFGG_XLSX_FIXTURE: /tmp/qa-members.xlsx
        run: node .github/qa/portal-invitations-recette.mjs
