name: WfGg Train Phase 3 smoke checks

on:
  push:
    branches:
      - train-bridge-phase3

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check Portal preview and Train bridge
        shell: bash
        run: |
          set -euo pipefail
          PORTAL='https://train-bridge-phase3.wfgg.pages.dev'
          TRAIN_API='https://portal-auth-phase1-wfgg-train.chachasan090375.workers.dev'

          echo '=== PORTAL ROOT ==='
          curl --retry 3 --retry-delay 2 -fsSIL "$PORTAL/" | sed -n '1,8p'

          echo '=== TRAIN HTML ==='
          curl --retry 3 --retry-delay 2 -fsSL "$PORTAL/train/" -o /tmp/train.html
          grep -q 'WFGG_PORTAL_TRAIN_FETCH_BRIDGE_V2' /tmp/train.html
          grep -q 'wfggTrainPortalGate' /tmp/train.html
          echo 'TRAIN_HTML_BRIDGE=OK'

          echo '=== TRAIN APP REWRITE ==='
          curl --retry 3 --retry-delay 2 -fsSL "$PORTAL/train/app.js" -o /tmp/app.js
          if grep -q 'https://wfgg-train.chachasan090375.workers.dev' /tmp/app.js; then
            echo 'LEGACY_API_ORIGIN_STILL_PRESENT'
            exit 1
          fi
          echo 'TRAIN_APP_REWRITE=OK'

          echo '=== DIRECT TRAIN API ==='
          curl --retry 3 --retry-delay 2 -fsSL "$TRAIN_API/api/health"
          echo

          echo '=== TRAIN API THROUGH PORTAL ==='
          curl --retry 3 --retry-delay 2 -fsSL \
            -H 'X-WfGg-Portal-Token: smoke-test-routing-only' \
            "$PORTAL/api/health" | tee /tmp/train-health.json
          echo
          grep -q 'WfGg Train' /tmp/train-health.json
          echo 'TRAIN_API_PROXY=OK'
