name: Portal login field debug v24

on:
  push:
    branches: [portal-auth-mobile-debug-v24]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login-field-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portal-auth-mobile-debug-v24
      - name: Validate guard
        run: |
          node --check frontend/portal-auth-mobile-guard-v1.js
          grep -q 'WFGG_PORTAL_AUTH_MOBILE_GUARD_V1' frontend/portal-auth-mobile-guard-v1.js
          grep -q 'portal-auth-mobile-guard-v1.js?v=001' frontend/index.html
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local portal
        run: |
          python3 -m http.server 4173 --directory frontend >/tmp/portal.log 2>&1 &
          echo $! >/tmp/portal.pid
          sleep 2
      - name: Check guarded mobile login field
        env:
          WFGG_PREVIEW: http://127.0.0.1:4173
          WFGG_EXPECT_GUARD: '1'
        run: node .github/qa/portal-login-field-debug.mjs
