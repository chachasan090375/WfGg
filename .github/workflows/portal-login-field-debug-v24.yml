name: Portal login field debug v24

on:
  push:
    branches: [portal-auth-mobile-debug-v24]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login-field-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portal-auth-mobile-debug-v24
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check production login field
        env:
          WFGG_PREVIEW: https://wfgg.pages.dev
        run: node .github/qa/portal-login-field-debug.mjs
