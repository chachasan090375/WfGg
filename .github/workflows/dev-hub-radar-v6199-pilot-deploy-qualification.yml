name: ChaCha DEV Radar V6.19.9 pilot deploy qualification

on:
  push:
    branches: [dev-hub-v5-radar-cluster-quality-diagnostic-v1]
    paths:
      - 'dev-hub/bin/run-radar-v6199-pilot-via-chacha-dev.sh'
      - 'dev-hub/projects/wfgg-radar/project-intent.v1.json'
      - '.github/workflows/dev-hub-radar-v6199-pilot-deploy-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PILOT_REV: 53ad1ca3295bca9cf45b4a06d40f4fb61a84d6de
  EXPECTED_CONNECTOR_SHA256: 5058159307ccb99e8e631fe71014608934b8575e69d5599e4388550306baab7f
  EXPECTED_NATIVE_SHA256: 274d040f5294cb09422e5d55cc4b5335ac7739924c33dcb67b3f279645814900

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-hub-v5-radar-cluster-quality-diagnostic-v1

      - name: Validate governed runner
        run: |
          set -euo pipefail
          R=dev-hub/bin/run-radar-v6199-pilot-via-chacha-dev.sh
          bash -n "$R"
          grep -Fq 'PILOT_REV="53ad1ca3295bca9cf45b4a06d40f4fb61a84d6de"' "$R"
          grep -Fq 'PILOT_BRANCH="radar-v6199-autopilot-targeted-history-quality"' "$R"
          grep -Fq 'CONNECTOR_SHA="5058159307ccb99e8e631fe71014608934b8575e69d5599e4388550306baab7f"' "$R"
          grep -Fq 'NATIVE_SHA="274d040f5294cb09422e5d55cc4b5335ac7739924c33dcb67b3f279645814900"' "$R"
          grep -Fq 'radar-vps/install-v6199-pilot.sh' "$R"
          grep -Fq 'radar-vps/probe-v6199-pilot-runtime.sh' "$R"
          grep -Fq 'PROJECT_CONTROL' "$R"
          grep -Fq 'run_graph' "$R"
          grep -Fq 'RADAR_V6199_GAME_SCAN_EXECUTED=NO' "$R"
          grep -Fq 'RADAR_V6199_COLLECTOR_MUTATION=NO' "$R"
          echo RADAR_V6199_CHACHA_RUNNER=PASS

      - name: Validate project intent
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          x=json.load(open('dev-hub/projects/wfgg-radar/project-intent.v1.json',encoding='utf-8'))
          assert x['current_change']['id']=='radar-v6199-autopilot-targeted-history-quality',x
          assert x['current_change']['pilot_only'] is True,x
          criteria='\n'.join(x.get('acceptance_criteria') or [])
          assert 'mode=ro' in criteria,criteria
          assert 'candidate cycle IDs' in criteria,criteria
          assert 'V6.19.8 Collector cycle terminalization remains present.' in criteria,criteria
          assert 'Production promotion requires a separate explicit human approval.' in criteria,criteria
          print('RADAR_V6199_PROJECT_INTENT=PASS')
          PY

      - name: Validate pinned pilot assets
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/chachasan090375/WfGg/$PILOT_REV"
          mkdir -p /tmp/v6199
          for f in radar-vps/pilot-v6199/SHA256SUMS radar-vps/pilot-v6199/PILOT_INFO.txt radar-vps/pilot-v6199/radar-connector radar-vps/pilot-v6199/radar-native-template radar-vps/install-v6199-pilot.sh radar-vps/probe-v6199-pilot-runtime.sh; do
            curl -fsSL "$BASE/$f" -o "/tmp/v6199/$(basename "$f")"
          done
          grep -Fq 'WFGG_RADAR_PILOT=V6.19.9' /tmp/v6199/PILOT_INFO.txt
          grep -Fq 'AUTOPILOT_TARGETED_HISTORY_QUALITY=YES' /tmp/v6199/PILOT_INFO.txt
          grep -Fq 'TARGETED_HISTORY_FULL_REBUILD=NO' /tmp/v6199/PILOT_INFO.txt
          grep -Fq 'HISTORY_READONLY=YES' /tmp/v6199/PILOT_INFO.txt
          grep -Fq 'COLLECTOR_CYCLE_TERMINALIZATION_PRESERVED=YES' /tmp/v6199/PILOT_INFO.txt
          grep -Fq 'STALE_CYCLE_RECOVERY_PRESERVED=YES' /tmp/v6199/PILOT_INFO.txt
          grep -Fq 'NO_DATA_CONTINUE_PRESERVED=YES' /tmp/v6199/PILOT_INFO.txt
          (
            cd /tmp/v6199
            sha256sum -c SHA256SUMS
          )
          test "$(sha256sum /tmp/v6199/radar-connector | awk '{print $1}')" = "$EXPECTED_CONNECTOR_SHA256"
          test "$(sha256sum /tmp/v6199/radar-native-template | awk '{print $1}')" = "$EXPECTED_NATIVE_SHA256"
          bash -n /tmp/v6199/install-v6199-pilot.sh
          bash -n /tmp/v6199/probe-v6199-pilot-runtime.sh
          grep -Fq 'GAME_TOKEN_REQUIRED' /tmp/v6199/probe-v6199-pilot-runtime.sh
          grep -Fq 'AUTOPILOT_TARGET_HISTORY_TIMEOUT_V6199' /tmp/v6199/probe-v6199-pilot-runtime.sh
          grep -Fq 'RADAR_V6199_GAME_SCAN_EXECUTED=NO' /tmp/v6199/probe-v6199-pilot-runtime.sh
          grep -Fq 'RADAR_V6199_COLLECTOR_MUTATION=NO' /tmp/v6199/probe-v6199-pilot-runtime.sh
          echo RADAR_V6199_PINNED_PILOT_ASSETS=PASS

      - name: Verify one-shot approval contract
        run: |
          set -euo pipefail
          R=dev-hub/bin/run-radar-v6199-pilot-via-chacha-dev.sh
          grep -Fq 'J’approuve le PILOT Radar V6.19.9 Autopilot Targeted History Quality révision 53ad1ca3295bca9cf45b4a06d40f4fb61a84d6de avec probe de garde sans scan de jeu.' "$R"
          grep -Fq '"revision":"53ad1ca3295bca9cf45b4a06d40f4fb61a84d6de"' "$R"
          grep -Fq 'PRODUCTION_RELEASE_APPROVAL_REVOKED=PASS' "$R"
          grep -Fq "RADAR_V6199_PILOT_CLOSE='+('PASS' if ok else 'FAIL')" "$R"
          echo RADAR_V6199_ONE_SHOT_APPROVAL=PASS
