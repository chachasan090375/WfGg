name: Radar V6.25 server population schema discovery

on:
  push:
    branches: [radar-v625-coverage-cardinality-discovery]
    paths:
      - '.github/workflows/radar-v625-server-population-schema.yml'
      - '.github/scripts/v625_server_population_schema.py'
      - '.github/scripts/v625_server_detail_strings.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-jdk unzip python3-pip lua5.3
          python3 -m pip install --quiet remotezip
          git clone --quiet https://github.com/HansWessels/unluac.git /tmp/unluac
          cd /tmp/unluac
          git checkout --quiet 1b2bfed6045eb719a27f026311744d7a674847f5
          cd "$GITHUB_WORKSPACE"
          python3 .github/scripts/v625_server_population_schema.py --patch-unluac /tmp/unluac
          cd /tmp/unluac/src
          mkdir -p build
          javac -d build unluac/*.java
          jar cfe /tmp/unluac-v625.jar unluac.Main -C build .
          test -s /tmp/unluac-v625.jar

      - name: Fetch Lua pack
        run: |
          set -euo pipefail
          python3 -c "from remotezip import RemoteZip; from pathlib import Path; u='https://d.apkpure.net/b/XAPK/com.fun.lastwar.gp?nc=arm64-v8a%2Carmeabi-v7a&sv=23&versionCode=1835'; r=RemoteZip(u,headers={'User-Agent':'Mozilla/5.0'}); m=[n for n in r.namelist() if n.endswith('install_time_pack.apk')]; assert len(m)==1,m; Path('/tmp/install_time_pack.apk').write_bytes(r.read(m[0])); r.close()"
          unzip -p /tmp/install_time_pack.apk assets/lwScripts/LWScripts.data > /tmp/LWScripts.data
          test -s /tmp/LWScripts.data
          echo "V625_LWSCRIPTS_BYTES=$(stat -c %s /tmp/LWScripts.data)"

      - name: Decompile and analyze population candidates
        run: |
          set -euo pipefail
          python3 .github/scripts/v625_server_population_schema.py --pack /tmp/LWScripts.data --jar /tmp/unluac-v625.jar

      - name: Extract exact server-detail constants
        run: |
          set -euo pipefail
          python3 .github/scripts/v625_server_detail_strings.py | tee /tmp/v625-server-detail-strings.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-v625-server-population-schema
          path: |
            /tmp/v625-picked.json
            /tmp/v625-population-evidence.json
            /tmp/v625-decompiled
            /tmp/v625-server-detail-strings.json
            /tmp/v625-server-detail-strings.log
          if-no-files-found: warn
          retention-days: 30
