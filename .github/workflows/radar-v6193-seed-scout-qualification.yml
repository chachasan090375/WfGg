name: Radar V6.19.3 Seed Scout qualification

on:
  push:
    branches: [radar-v6193-seed-scout]
    paths:
      - '.radar-release-src/v6193-source/**'
      - '.github/scripts/patch-radar-seed-scout-v6193.py'
      - '.github/scripts/patch-radar-worker-seed-scout-v6193.py'
      - '.github/scripts/patch-live-radar-seed-scout-v6193.py'
      - '.github/workflows/radar-v6193-seed-scout-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wfgg-radar-v6193-seed-scout
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-v6193-seed-scout
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Reconstruct cumulative V6.19.3 connector and Worker
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar
          mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          echo '234df1dec57f6211bc625855bf13350c9f17fbd843fbe92d8cf1ab7cb5c081ef  /tmp/radar-src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar

          rm -rf /tmp/wfgg-radar/connector-go
          cp -a .radar-release-src/v2-source/connector-go /tmp/wfgg-radar/connector-go

          python3 .github/scripts/patch-radar-target-profile-retry.py
          python3 .github/scripts/patch-radar-federated-diagnostics-v65.py
          python3 .github/scripts/patch-player-scan-v3.py
          python3 .github/scripts/patch-player-scan-v4.py
          python3 .github/scripts/patch-radar-protocol-discovery-v67.py
          python3 .github/scripts/patch-radar-profile-isolation-v68.py
          python3 .github/scripts/patch-radar-native-profile-v69.py
          python3 .github/scripts/patch-radar-native-profile-handshake-v691.py
          python3 .github/scripts/patch-radar-native-profile-exec-v692.py
          python3 .github/scripts/patch-radar-connector-runtime-v693.py
          python3 .github/scripts/patch-radar-cluster-catalog-budget-v6192.py
          python3 .github/scripts/patch-radar-seed-scout-v6193.py

          test -s .radar-release-src/v2-source/src/game/remote-transport.js
          install -m 0644 .radar-release-src/v2-source/src/game/remote-transport.js /tmp/wfgg-radar/src/game/remote-transport.js
          python3 .github/scripts/patch-radar-async-collector-worker.py
          python3 .github/scripts/patch-radar-worker-rich-profile-v6191.py
          python3 .github/scripts/patch-radar-worker-seed-scout-v6193.py

          install -m 0644 radar-ui-live/live-radar.html /tmp/wfgg-radar/public/live-radar.html
          python3 .github/scripts/patch-live-radar-seed-scout-v6193.py

          echo RADAR_V6193_RECONSTRUCT=PASS

      - name: Test Seed Scout connector
        working-directory: /tmp/wfgg-radar/connector-go
        run: |
          set -euo pipefail
          gofmt -w ./cmd ./internal
          go test ./cmd/radar-connector -run 'TestSeedScout' -count=1
          go test ./...
          go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o /tmp/radar-connector-v6193 ./cmd/radar-connector
          test -s /tmp/radar-connector-v6193
          echo RADAR_V6193_CONNECTOR=PASS

      - name: Test Worker and UI bridge
        run: |
          set -euo pipefail
          node --check /tmp/wfgg-radar/src/worker.js
          grep -Fq 'WFGG_RADAR_SEED_SCOUT_TRANSPORT_V6193' /tmp/wfgg-radar/src/game/remote-transport.js
          grep -Fq 'WFGG_RADAR_SEED_SCOUT_WORKER_V6193' /tmp/wfgg-radar/src/worker.js
          grep -Fq '/api/radar/seed-scout/start' /tmp/wfgg-radar/src/worker.js
          grep -Fq '/api/radar/seed-scout/status' /tmp/wfgg-radar/src/worker.js
          grep -Fq 'WFGG_RADAR_SEED_SCOUT_UI_V6193' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'DÉCOUVRIR LA PROCHAINE GRAPPE' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq "\$('q').value=String(seed.command)" /tmp/wfgg-radar/public/live-radar.html
          ! grep -Fq 'runCollectorSearch(seed.command)' /tmp/wfgg-radar/public/live-radar.html
          echo RADAR_V6193_WORKER_UI=PASS

      - name: Verify one-region no-Collector-mutation contract
        run: |
          set -euo pipefail
          S=.radar-release-src/v6193-source/connector-go/cmd/radar-connector/server_seed_scout_v6193.go
          grep -Fq 'ScanPlayerRegionDiagnosticOnServer' "$S"
          grep -Fq 'RegionsPerCandidate: 1' "$S"
          grep -Fq 'CollectorMutation:   false' "$S"
          grep -Fq 'CyclesCreated:       0' "$S"
          grep -Fq 'ProfilesEnriched:    0' "$S"
          ! grep -Fq 'collectorStartCycle(' "$S"
          ! grep -Fq 'collectorIngest(' "$S"
          ! grep -Fq 'collectorFinishCycle(' "$S"
          ! grep -Fq 'ScanProfiles(' "$S"
          ! grep -REiq 'attack|march|purchase|donate|reward collection|building production|collect reward' \
            .radar-release-src/v6193-source \
            .github/scripts/patch-radar-seed-scout-v6193.py \
            .github/scripts/patch-radar-worker-seed-scout-v6193.py \
            .github/scripts/patch-live-radar-seed-scout-v6193.py
          echo RADAR_V6193_ONE_REGION_PER_CANDIDATE=PASS
          echo RADAR_V6193_COLLECTOR_MUTATION=NO
          echo RADAR_V6193_GAME_MUTATION=NO
          echo RADAR_V6193_READONLY=PASS

      - name: Verify V6.19.2 catalog budget retained
        run: |
          set -euo pipefail
          grep -Fq 'context.WithTimeout(r.Context(), 75*time.Second)' /tmp/wfgg-radar/connector-go/cmd/radar-connector/server_cluster_catalog_v613.go
          grep -Fq 'POST /v1/collector/server-seed-scout/start' /tmp/wfgg-radar/connector-go/cmd/radar-connector/main.go
          grep -Fq 'GET /v1/collector/server-seed-scout/status' /tmp/wfgg-radar/connector-go/cmd/radar-connector/main.go
          echo RADAR_V6193_V6192_REGRESSION=PASS

      - name: Assert production untouched
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "radar-v6193-seed-scout"
          echo RADAR_V6193_PRODUCTION_MUTATION=NO
          echo RADAR_V6193_QUALIFICATION=PASS
