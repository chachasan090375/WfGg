name: Profile layout v16

on:
  push:
    branches: [profile-layout-v16]
    paths:
      - '.github/workflows/profile-layout-v16.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: profile-layout-v16
      - name: Apply profile layout patch
        run: python .github/scripts/profile_layout_v16_patch.py
      - name: Validate portal source
        shell: bash
        run: |
          set -euo pipefail
          node --check frontend/portal-v070.js
          grep -q "profileSubpage:'main'" frontend/portal-v070.js
          grep -q 'profileTrainRotationHost' frontend/portal-v070.js
          grep -q 'openSessionHistory' frontend/portal-v070.js
          grep -q 'backProfileSettings' frontend/portal-v070.js
          grep -q 'loadProfileTrainRotation' frontend/portal-v070.js
          ! grep -q 'renderHomeTrainRotationCard' frontend/portal-v070.js
          ! grep -q 'loadHomeTrainRotation' frontend/portal-v070.js
          grep -q 'Historique des connexions' frontend/portal-v070.js
          grep -q 'Sign-in history' frontend/portal-v070.js
          grep -q 'Historial de conexiones' frontend/portal-v070.js
      - name: Commit validated profile layout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/portal-v070.js
          if git diff --cached --quiet; then
            echo 'No profile layout change to commit.'
            exit 0
          fi
          git commit -m 'ui: move Train rotation into profile and isolate sign-in history [v16]'
          git push origin HEAD:profile-layout-v16
