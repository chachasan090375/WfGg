name: ChaCha DEV Radar V6.19.6 pilot deploy qualification

on:
  push:
    branches: [dev-hub-v5-radar-cluster-quality-diagnostic-v1]
    paths:
      - 'dev-hub/bin/run-radar-v6196-pilot-via-chacha-dev.sh'
      - 'dev-hub/projects/wfgg-radar/project-intent.v1.json'
      - '.github/workflows/dev-hub-radar-v6196-pilot-deploy-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PILOT_REV: 98e9bf4c04f25903d72063023d73583387091c4e
  EXPECTED_CONNECTOR_SHA256: b7ff60476f3afe7c8bcb9b78963c46daa4e8b5507490cc83cbcbc4ced63e7c35
  EXPECTED_NATIVE_SHA256: 274d040f5294cb09422e5d55cc4b5335ac7739924c33dcb67b3f279645814900

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-hub-v5-radar-cluster-quality-diagnostic-v1

      - name: Validate governed runner
        run: |
          set -euo pipefail
          R=dev-hub/bin/run-radar-v6196-pilot-via-chacha-dev.sh
          bash -n "$R"
          grep -Fq 'PILOT_REV="98e9bf4c04f25903d72063023d73583387091c4e"' "$R"
          grep -Fq 'PILOT_BRANCH="radar-v6196-autopilot-continue-no-data"' "$R"
          grep -Fq 'CONNECTOR_SHA="b7ff60476f3afe7c8bcb9b78963c46daa4e8b5507490cc83cbcbc4ced63e7c35"' "$R"
          grep -Fq 'NATIVE_SHA="274d040f5294cb09422e5d55cc4b5335ac7739924c33dcb67b3f279645814900"' "$R"
          grep -Fq 'radar-vps/install-v6196-pilot.sh' "$R"
          grep -Fq 'radar-vps/probe-v6196-pilot-runtime.sh' "$R"
          grep -Fq 'PROJECT_CONTROL' "$R"
          grep -Fq 'run_graph' "$R"
          grep -Fq 'RADAR_V6196_GAME_SCAN_EXECUTED=NO' "$R"
          grep -Fq 'RADAR_V6196_COLLECTOR_MUTATION=NO' "$R"
          echo RADAR_V6196_CHACHA_RUNNER=PASS

      - name: Validate project intent
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p='dev-hub/projects/wfgg-radar/project-intent.v1.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['current_change']['id']=='radar-v6196-autopilot-continue-no-data',x
          assert x['current_change']['pilot_only'] is True,x
          criteria='\n'.join(x.get('acceptance_criteria') or [])
          assert 'SKIPPED_NO_DATA' in criteria,criteria
          assert 'Production promotion requires a separate explicit human approval.' in criteria,criteria
          print('RADAR_V6196_PROJECT_INTENT=PASS')
          PY

      - name: Validate pinned pilot assets
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/chachasan090375/WfGg/$PILOT_REV"
          mkdir -p /tmp/v6196
          for f in radar-vps/pilot-v6196/SHA256SUMS radar-vps/pilot-v6196/PILOT_INFO.txt radar-vps/pilot-v6196/radar-connector radar-vps/pilot-v6196/radar-native-template radar-vps/install-v6196-pilot.sh radar-vps/probe-v6196-pilot-runtime.sh; do
            curl -fsSL "$BASE/$f" -o "/tmp/v6196/$(basename "$f")"
          done
          grep -Fq 'WFGG_RADAR_PILOT=V6.19.6' /tmp/v6196/PILOT_INFO.txt
          grep -Fq 'NO_DATA_RESULT=SKIPPED_NOT_CONFIRMED' /tmp/v6196/PILOT_INFO.txt
          grep -Fq 'VALID_EVIDENCE_PRESERVED=YES' /tmp/v6196/PILOT_INFO.txt
          grep -Fq 'GLOBAL_FAILURE_GUARDS=PRESERVED' /tmp/v6196/PILOT_INFO.txt
          (
            cd /tmp/v6196
            sha256sum -c SHA256SUMS
          )
          test "$(sha256sum /tmp/v6196/radar-connector | awk '{print $1}')" = "$EXPECTED_CONNECTOR_SHA256"
          test "$(sha256sum /tmp/v6196/radar-native-template | awk '{print $1}')" = "$EXPECTED_NATIVE_SHA256"
          bash -n /tmp/v6196/install-v6196-pilot.sh
          bash -n /tmp/v6196/probe-v6196-pilot-runtime.sh
          grep -Fq 'GAME_TOKEN_REQUIRED' /tmp/v6196/probe-v6196-pilot-runtime.sh
          grep -Fq 'RADAR_V6196_GAME_SCAN_EXECUTED=NO' /tmp/v6196/probe-v6196-pilot-runtime.sh
          echo RADAR_V6196_PINNED_PILOT_ASSETS=PASS

      - name: Verify one-shot approval contract
        run: |
          set -euo pipefail
          R=dev-hub/bin/run-radar-v6196-pilot-via-chacha-dev.sh
          grep -Fq 'J’approuve le PILOT Radar V6.19.6 Autopilot révision 98e9bf4c04f25903d72063023d73583387091c4e avec probe de garde sans scan de jeu.' "$R"
          grep -Fq 'PRODUCTION_RELEASE_APPROVAL_REVOKED=PASS' "$R"
          grep -Fq 'RADAR_V6196_PILOT_CLOSE=PASS' "$R"
          echo RADAR_V6196_ONE_SHOT_APPROVAL=PASS
