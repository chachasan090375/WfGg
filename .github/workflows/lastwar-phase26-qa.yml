name: LastWar phase26 decoded payload index QA

on:
  workflow_dispatch:
  push:
    branches:
      - portal-auth-lastwar-lab-v1
    paths:
      - 'scripts/lastwar-phase26-decoded-payload-index.sh'
      - '.github/workflows/lastwar-phase26-qa.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate shell syntax
        run: bash -n scripts/lastwar-phase26-decoded-payload-index.sh
      - name: Validate embedded Python syntax
        run: |
          set -euo pipefail
          awk '/^cat > "\$PY" <<'"'"'PYEOF'"'"'$/{f=1;next} /^PYEOF$/{if(f){exit}} f{print}' scripts/lastwar-phase26-decoded-payload-index.sh > /tmp/phase26.py
          python -m py_compile /tmp/phase26.py
      - name: Enforce offline and evidence contract
        run: |
          set -euo pipefail
          f=scripts/lastwar-phase26-decoded-payload-index.sh
          grep -q 'OFFLINE ONLY' "$f"
          grep -q 'No Last War network connection' "$f"
          grep -q 'scan_decoded_payload_content_not_node_filename' "$f"
          grep -q 'unknown_hero_ids_are_not_guessed=true' "$f"
          grep -q 'nearbyStrings_are_forensic_context_only=true' "$f"
          ! grep -Eq 'curl |wget |requests\.|urllib\.request|socket\.' "$f"
