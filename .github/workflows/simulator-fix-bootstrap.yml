name: Repair simulator bootstrap

on:
  push:
    branches: [simulator-standalone-v1]
    paths: ['.github/workflows/simulator-fix-bootstrap.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simulator-standalone-v1
      - name: Fix temporal-dead-zone bootstrap and commit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('simulator/app.js')
          s=p.read_text(encoding='utf-8')
          old="""  let schemas = {};
  let state = loadState();
  let researchTab = 'hero';

  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];
  const esc = value => String(value ?? '').replace(/[&<>\\\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\\\"':'&quot;'}[c]));
  const clone = obj => JSON.parse(JSON.stringify(obj));
  const ui = key => (UI[state.locale] || UI.fr)[key] ?? UI.fr[key] ?? key;
"""
          new="""  let schemas = {};
  let researchTab = 'hero';

  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];
  const esc = value => String(value ?? '').replace(/[&<>\\\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\\\"':'&quot;'}[c]));
  const clone = obj => JSON.parse(JSON.stringify(obj));
  let state = loadState();
  const ui = key => (UI[state.locale] || UI.fr)[key] ?? UI.fr[key] ?? key;
"""
          if old not in s:
              raise SystemExit('expected bootstrap block not found; refusing blind edit')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'wfgg-simulator-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add simulator/app.js
          git commit -m 'fix: initialize simulator helpers before loading profile'
          git push origin HEAD:simulator-standalone-v1
