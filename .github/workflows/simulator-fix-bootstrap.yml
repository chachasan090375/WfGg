name: Repair simulator bootstrap

on:
  push:
    branches:
      - simulator-standalone-v1
    paths:
      - '.github/workflows/simulator-fix-bootstrap.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simulator-standalone-v1
      - name: Repair app bootstrap ordering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('simulator/app.js')
          s = p.read_text(encoding='utf-8')
          bad = "  let state = loadState();\n"
          marker = "  const clone = obj => JSON.parse(JSON.stringify(obj));\n"
          if bad not in s or marker not in s:
              raise SystemExit('bootstrap markers missing')
          s = s.replace(bad, '', 1)
          s = s.replace(marker, marker + bad, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name wfgg-simulator-ci
          git config user.email actions@users.noreply.github.com
          git add simulator/app.js
          git diff --cached --check
          git commit -m 'fix: initialize simulator helpers before loading profile'
          git push origin HEAD:simulator-standalone-v1
