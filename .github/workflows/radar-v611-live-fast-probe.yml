name: Radar V6.11 live fast identity probe

on:
  push:
    branches: [radar-v611-live-probe-run]
    paths:
      - '.github/workflows/radar-v611-live-fast-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RADAR_CONNECTOR_URL: https://chachavps.tail3ab05a.ts.net

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe canonical El TonTon lookup field presence
        env:
          RADAR_CONNECTOR_SHARED_KEY: ${{ secrets.RADAR_CONNECTOR_SHARED_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, hmac, json, os, secrets, time, urllib.parse, urllib.request

          base = os.environ['RADAR_CONNECTOR_URL'].rstrip('/')
          key = os.environ['RADAR_CONNECTOR_SHARED_KEY'].encode()
          canonical_path = '/v1/collector/identity/lookup'
          query = 'El TonTon'
          request_path = canonical_path + '?q=' + urllib.parse.quote(query)

          ts = str(int(time.time()))
          nonce = secrets.token_hex(16)
          body_hash = hashlib.sha256(b'').hexdigest()
          canonical = '\n'.join(['GET', canonical_path, ts, nonce, body_hash])
          sig = hmac.new(key, canonical.encode(), hashlib.sha256).hexdigest()
          req = urllib.request.Request(base + request_path, method='GET', headers={
              'X-Radar-Timestamp': ts,
              'X-Radar-Nonce': nonce,
              'X-Radar-Signature': sig,
          })
          started = time.monotonic()
          with urllib.request.urlopen(req, timeout=20) as response:
              data = json.loads(response.read().decode())
          elapsed_ms = int((time.monotonic() - started) * 1000)
          assert data.get('ok') is True
          assert data.get('resolved') is True
          assert data.get('readonly') is True
          p = data.get('player') or {}
          fields = {
              'uid': bool(str(p.get('gameUid') or '').strip()),
              'server': bool(str(p.get('serverId') or '').strip()),
              'alliance': bool(str(p.get('allianceTag') or p.get('allianceId') or '').strip()),
              'hq': p.get('hqLevel') is not None,
              'power': p.get('power') is not None,
              'position': p.get('x') is not None and p.get('y') is not None,
          }
          print('RADAR_V611_ELTONTON_ROUTE=' + str(data.get('route') or ''))
          print('RADAR_V611_ELTONTON_FIELDS=' + json.dumps(fields, sort_keys=True))
          print('RADAR_V611_ELTONTON_SERVER_992=' + str(str(p.get('serverId') or '') == '992').lower())
          print('RADAR_V611_ELTONTON_PROBE_MS=' + str(elapsed_ms))
          PY
