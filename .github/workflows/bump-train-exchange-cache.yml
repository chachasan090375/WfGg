name: Bump Train exchange cache

on:
  push:
    branches: [exchange-diagnosis]
    paths:
      - '.github/scripts/bump_train_exchange_cache.py'
      - '.github/workflows/bump-train-exchange-cache.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exchange-diagnosis
      - name: Bump Train cache revision
        run: python .github/scripts/bump_train_exchange_cache.py
      - name: Validate runtime
        run: |
          node --check frontend/_worker.js
          grep -q 'wfgg_bridge=v14' frontend/_worker.js
          grep -q 'WFGG_TRAIN_SCHEDULE_PARITY_V1' frontend/_worker.js
      - name: Commit cache bump
        run: |
          if git diff --quiet -- frontend/_worker.js; then
            echo 'No runtime change needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/_worker.js
          git commit -m 'fix: force Train v14 after exchange parity fix [exchange-cache-auto]'
          git push origin HEAD:exchange-diagnosis
