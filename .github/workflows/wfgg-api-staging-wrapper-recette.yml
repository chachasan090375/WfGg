name: WfGg API staging wrapper recette

on:
  push:
    branches:
      - connector-readonly-v1
    paths:
      - 'worker/package.json'
      - 'worker/scripts/install-staging-wrangler-wrapper.mjs'
      - '.github/workflows/wfgg-api-staging-wrapper-recette.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recette:
    runs-on: ubuntu-latest
    env:
      WORKERS_CI: '1'
      WORKERS_CI_BRANCH: connector-readonly-v1
      WFGG_WRAPPER_TEST_DRY_RUN: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies and wrapper
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Verify wrapper installed
        working-directory: worker
        run: |
          set -euo pipefail
          test -x node_modules/.bin/wrangler
          grep -q 'intercepting Cloudflare preview upload' node_modules/.bin/wrangler
          grep -q 'wfgg-api-staging-wrapper-test' node_modules/.bin/wrangler

      - name: Simulate Cloudflare preview deploy
        working-directory: worker
        run: npx wrangler versions upload

      - name: Validate staging dry-run output
        run: |
          set -euo pipefail
          test -d /tmp/wfgg-api-staging-wrapper-test
          grep -R -q 'LASTWAR_USER' /tmp/wfgg-api-staging-wrapper-test || true
          echo 'STAGING_WRAPPER_RECETTE_OK'
