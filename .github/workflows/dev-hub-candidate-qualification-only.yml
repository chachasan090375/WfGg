name: ChaCha DEV candidate qualification only

on:
  push:
    branches: [chacha/ci-separation-20261009]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: dev-hub/bin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify governance invariants
        run: |
          python3 dev-hub/tests/test_guardian_reference_invariant.py
          python3 dev-hub/tests/test_capability_reuse_umg.py
          python3 dev-hub/tests/test_umg_activation_proof.py
          python3 dev-hub/tests/test_platform_safety_failures.py
          python3 dev-hub/tests/test_platform_safety_process_integration.py
          python3 dev-hub/tests/test_functional_execution_safety.py
          python3 dev-hub/tests/test_guardian_stop_latch_reconciliation.py
          python3 dev-hub/tests/test_v616_guardian_action_leases.py
          python3 dev-hub/tests/test_v809_guardian_run_propagation.py
          python3 dev-hub/tests/test_v810_guardian_run_propagation_hotfix.py
