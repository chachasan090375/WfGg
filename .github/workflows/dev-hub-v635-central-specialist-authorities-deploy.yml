name: ChaCha DEV V6.35 deploy central specialist authorities

on:
  push:
    branches: [dev-hub-v635-central-specialist-authorities]
    paths:
      - 'dev-hub/specialists/**'
      - 'dev-hub/curator/**'
      - 'dev-hub/bastion/**'
      - 'dev-hub/intendant/**'
      - 'dev-hub/assurance-exchange/**'
      - 'dev-hub/config/worker-learning-central-identity.v1.json'
      - '.github/workflows/dev-hub-v635-central-specialist-authorities-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-hub-v635-central-specialist-authorities
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static external authority validation
        run: |
          set -euo pipefail
          node --check dev-hub/specialists/core.js
          node --check dev-hub/curator/worker.js
          node --check dev-hub/bastion/worker.js
          node --check dev-hub/intendant/worker.js
          node --check dev-hub/assurance-exchange/worker.js
          echo CHACHA_DEV_V635_EXTERNAL_AUTHORITY_STATIC=PASS

      - name: Resolve Cloudflare account and D1 databases
        id: cf
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.parse,urllib.request,urllib.error
          token=os.environ.get('CF_API_TOKEN','').strip()
          if not token: raise SystemExit('MISSING_SECRET=CLOUDFLARE_API_TOKEN')
          headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'}
          def call(url,method='GET',body=None):
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(url,headers=headers,method=method,data=data)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:return r.status,json.loads(r.read())
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try:payload=json.loads(raw)
                  except Exception:payload={'raw':raw[:500]}
                  return e.code,payload
          aid=os.environ.get('CF_ACCOUNT_ID','').strip()
          if not aid:
              status,payload=call('https://api.cloudflare.com/client/v4/accounts?per_page=50')
              rows=(payload.get('result') or []) if status==200 else []
              if len(rows)!=1: raise SystemExit('CLOUDFLARE_ACCOUNT_RESOLUTION_AMBIGUOUS_'+str(len(rows)))
              aid=rows[0]['id']
          def ensure_db(name):
              status,payload=call('https://api.cloudflare.com/client/v4/accounts/'+aid+'/d1/database?name='+urllib.parse.quote(name))
              if status!=200: raise SystemExit('D1_LIST_FAILED_'+name)
              rows=payload.get('result') or []
              db=next((x for x in rows if x.get('name')==name),None)
              if not db:
                  status,payload=call('https://api.cloudflare.com/client/v4/accounts/'+aid+'/d1/database','POST',{'name':name,'jurisdiction':'eu'})
                  if status not in (200,201): raise SystemExit('D1_CREATE_FAILED_'+name)
                  db=payload.get('result')
              return db['uuid']
          ids={name:ensure_db(name) for name in [
            'chacha-dev-curator','chacha-dev-bastion','chacha-dev-intendant','chacha-dev-assurance-exchange'
          ]}
          status,payload=call('https://api.cloudflare.com/client/v4/accounts/'+aid+'/workers/subdomain')
          if status!=200 or not (payload.get('result') or {}).get('subdomain'):
              raise SystemExit('WORKERS_SUBDOMAIN_RESOLUTION_FAILED')
          sub=payload['result']['subdomain']
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('account_id='+aid+'\n')
              f.write('workers_subdomain='+sub+'\n')
              f.write('curator_database_id='+ids['chacha-dev-curator']+'\n')
              f.write('bastion_database_id='+ids['chacha-dev-bastion']+'\n')
              f.write('intendant_database_id='+ids['chacha-dev-intendant']+'\n')
              f.write('exchange_database_id='+ids['chacha-dev-assurance-exchange']+'\n')
          print('CHACHA_DEV_V635_D1_DATABASES_READY=PASS')
          PY

      - name: Prepare Wrangler configs and authority seed
        run: |
          set -euo pipefail
          SUBDOMAIN="${{ steps.cf.outputs.workers_subdomain }}"
          EXCHANGE_URL="https://chacha-dev-assurance-exchange.$SUBDOMAIN.workers.dev"
          GUARDIAN_URL="https://chacha-dev-guardian.$SUBDOMAIN.workers.dev"
          SENTINEL_URL="https://chacha-dev-sentinel.$SUBDOMAIN.workers.dev"

          make_specialist_config() {
            role="$1"; dbid="$2"
            cat > ".wrangler-$role.jsonc" <<EOF
          {
            "name": "chacha-dev-$role",
            "main": "dev-hub/$role/worker.js",
            "compatibility_date": "2026-09-23",
            "workers_dev": true,
            "services": [
              {"binding": "ASSURANCE_EXCHANGE_SERVICE", "service": "chacha-dev-assurance-exchange"}
            ],
            "d1_databases": [{
              "binding": "DB",
              "database_name": "chacha-dev-$role",
              "database_id": "$dbid"
            }]
          }
          EOF
          }
          make_specialist_config curator "${{ steps.cf.outputs.curator_database_id }}"
          make_specialist_config bastion "${{ steps.cf.outputs.bastion_database_id }}"
          make_specialist_config intendant "${{ steps.cf.outputs.intendant_database_id }}"

          cat > .wrangler-exchange.jsonc <<EOF
          {
            "name": "chacha-dev-assurance-exchange",
            "main": "dev-hub/assurance-exchange/worker.js",
            "compatibility_date": "2026-09-23",
            "workers_dev": true,
            "vars": {
              "GUARDIAN_URL": "$GUARDIAN_URL",
              "SENTINEL_URL": "$SENTINEL_URL"
            },
            "services": [
              {"binding": "GUARDIAN_SERVICE", "service": "chacha-dev-guardian"},
              {"binding": "SENTINEL_SERVICE", "service": "chacha-dev-sentinel"},
              {"binding": "CURATOR_SERVICE", "service": "chacha-dev-curator"},
              {"binding": "BASTION_SERVICE", "service": "chacha-dev-bastion"},
              {"binding": "INTENDANT_SERVICE", "service": "chacha-dev-intendant"}
            ],
            "d1_databases": [{
              "binding": "DB",
              "database_name": "chacha-dev-assurance-exchange",
              "database_id": "${{ steps.cf.outputs.exchange_database_id }}"
            }]
          }
          EOF

          python3 - <<'PY'
          import json
          identity=json.load(open('dev-hub/config/worker-learning-central-identity.v1.json',encoding='utf-8'))
          q=lambda s:"'"+str(s).replace("'","''")+"'"
          sql=(
            "INSERT INTO authority_identities(key_id,status,public_key_spki_b64,created_at) VALUES("
            +q(identity['key_id'])+",'ACTIVE',"+q(identity['public_key_spki_b64'])+",datetime('now')) "
            "ON CONFLICT(key_id) DO UPDATE SET status='ACTIVE',public_key_spki_b64=excluded.public_key_spki_b64;\n"
          )
          open('.specialist-seed.sql','w',encoding='utf-8').write(sql)
          print('CHACHA_DEV_V635_SPECIALIST_SEED=PASS')
          PY

      - name: Apply specialist schemas and seed identities
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        run: |
          set -euo pipefail
          for role in curator bastion intendant; do
            npx --yes wrangler@4.45.0 d1 execute "chacha-dev-$role" --remote               --file=dev-hub/specialists/migrations/0001.sql --config=".wrangler-$role.jsonc"
            npx --yes wrangler@4.45.0 d1 execute "chacha-dev-$role" --remote               --file=.specialist-seed.sql --config=".wrangler-$role.jsonc"
          done
          echo CHACHA_DEV_V635_SPECIALIST_SCHEMAS=PASS

      - name: Apply Exchange schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        run: |
          set -euo pipefail
          for f in dev-hub/assurance-exchange/migrations/*.sql; do
            npx --yes wrangler@4.45.0 d1 execute chacha-dev-assurance-exchange --remote               --file="$f" --config=.wrangler-exchange.jsonc
          done
          echo CHACHA_DEV_V635_EXCHANGE_SCHEMA=PASS

      - name: Deploy specialist authorities
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        run: |
          set -euo pipefail
          for role in curator bastion intendant; do
            npx --yes wrangler@4.45.0 deploy --config=".wrangler-$role.jsonc"
          done
          echo CHACHA_DEV_V635_SPECIALIST_DEPLOY=PASS

      - name: Redeploy Assurance Exchange
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.45.0 deploy --config=.wrangler-exchange.jsonc
          echo CHACHA_DEV_V635_EXCHANGE_REDEPLOY=PASS

      - name: Verify central specialist health
        env:
          SUBDOMAIN: ${{ steps.cf.outputs.workers_subdomain }}
        run: |
          set -euo pipefail
          for role in curator bastion intendant; do
            url="https://chacha-dev-$role.$SUBDOMAIN.workers.dev/healthz"
            ok=0
            for i in $(seq 1 30); do
              if curl -fsS "$url" -o "/tmp/$role.json" &&
                 grep -Fq '"external_authority":true' "/tmp/$role.json" &&
                 grep -Fq '"project_scoped_identity":true' "/tmp/$role.json" &&
                 grep -Fq '"exact_revision_reviews":true' "/tmp/$role.json" &&
                 grep -Fq '"assurance_exchange_publish":true' "/tmp/$role.json"; then
                ok=1; break
              fi
              sleep 3
            done
            test "$ok" = 1
          done
          grep -Fq '"bastion_incident_response":true' /tmp/bastion.json
          grep -Fq '"failover_status":"RESERVED_INACTIVE"' /tmp/bastion.json

          EXCHANGE="https://chacha-dev-assurance-exchange.$SUBDOMAIN.workers.dev"
          curl -fsS "$EXCHANGE/healthz" -o /tmp/exchange.json
          grep -Fq '"curator_service_binding":true' /tmp/exchange.json
          grep -Fq '"bastion_service_binding":true' /tmp/exchange.json
          grep -Fq '"intendant_service_binding":true' /tmp/exchange.json
          grep -Fq '"specialist_review_source_reverification":true' /tmp/exchange.json

          echo CHACHA_DEV_V635_REAL_CURATOR_HEALTH=PASS
          echo CHACHA_DEV_V635_REAL_BASTION_HEALTH=PASS
          echo CHACHA_DEV_V635_REAL_INTENDANT_HEALTH=PASS
          echo CHACHA_DEV_V635_REAL_EXCHANGE_SPECIALIST_BINDINGS=PASS
          echo CHACHA_DEV_V635_FAILOVER=RESERVED_INACTIVE
          echo AUTOMATIC_EXTERNAL_SPEND_EUR=0
