name: Radar V6.19.3 Seed Scout pilot build

on:
  push:
    branches: [radar-v6193-seed-scout]
    paths:
      - '.radar-release-src/v6193-source/**'
      - '.github/scripts/patch-radar-seed-scout-v6193.py'
      - '.github/scripts/patch-radar-worker-seed-scout-v6193.py'
      - '.github/scripts/patch-live-radar-seed-scout-v6193.py'
      - '.github/workflows/radar-v6193-seed-scout-pilot.yml'
      - 'radar-vps/install-v6193-pilot.sh'
      - 'radar-vps/probe-v6193-pilot-runtime.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wfgg-radar-v6193-seed-scout-pilot
  cancel-in-progress: true

env:
  LASTWAR_CLIENT_REF: ee5f64de160a8051c2f9f98189b75038dd225a0a

jobs:
  build-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-v6193-seed-scout
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Reconstruct cumulative V6.19.3
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar /tmp/lastwar-client
          mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          echo '234df1dec57f6211bc625855bf13350c9f17fbd843fbe92d8cf1ab7cb5c081ef  /tmp/radar-src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar
          rm -rf /tmp/wfgg-radar/connector-go
          cp -a .radar-release-src/v2-source/connector-go /tmp/wfgg-radar/connector-go

          python3 .github/scripts/patch-radar-target-profile-retry.py
          python3 .github/scripts/patch-radar-federated-diagnostics-v65.py
          python3 .github/scripts/patch-player-scan-v3.py
          python3 .github/scripts/patch-player-scan-v4.py
          python3 .github/scripts/patch-radar-protocol-discovery-v67.py
          python3 .github/scripts/patch-radar-profile-isolation-v68.py
          python3 .github/scripts/patch-radar-native-profile-v69.py
          python3 .github/scripts/patch-radar-native-profile-handshake-v691.py
          python3 .github/scripts/patch-radar-native-profile-exec-v692.py
          python3 .github/scripts/patch-radar-connector-runtime-v693.py
          python3 .github/scripts/patch-radar-cluster-catalog-budget-v6192.py
          python3 .github/scripts/patch-radar-seed-scout-v6193.py

          install -m 0644 .radar-release-src/v2-source/src/game/remote-transport.js /tmp/wfgg-radar/src/game/remote-transport.js
          python3 .github/scripts/patch-radar-async-collector-worker.py
          python3 .github/scripts/patch-radar-worker-rich-profile-v6191.py
          python3 .github/scripts/patch-radar-worker-seed-scout-v6193.py

          install -m 0644 radar-ui-live/live-radar.html /tmp/wfgg-radar/public/live-radar.html
          python3 .github/scripts/patch-live-radar-seed-scout-v6193.py
          echo RADAR_V6193_RECONSTRUCT=PASS

      - name: Test and build connector
        working-directory: /tmp/wfgg-radar/connector-go
        run: |
          set -euo pipefail
          gofmt -w ./cmd ./internal
          go test ./...
          go vet ./...
          mkdir -p "$GITHUB_WORKSPACE/radar-vps/pilot-v6193/cloudflare"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o "$GITHUB_WORKSPACE/radar-vps/pilot-v6193/radar-connector" ./cmd/radar-connector
          test -s "$GITHUB_WORKSPACE/radar-vps/pilot-v6193/radar-connector"
          echo RADAR_V6193_CONNECTOR=PASS

      - name: Build unchanged native helper
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/ljagiello/lastwar-client.git /tmp/lastwar-client
          cd /tmp/lastwar-client
          git fetch --quiet --depth 1 origin "$LASTWAR_CLIENT_REF"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$LASTWAR_CLIENT_REF"

          mkdir -p cmd/wfgg-radar-native-template
          cp /tmp/wfgg-radar/connector-go/native-template/main.go cmd/wfgg-radar-native-template/main.go
          cp /tmp/wfgg-radar/connector-go/native-template/player_scan_v3.go cmd/wfgg-radar-native-template/player_scan_v3.go
          cp /tmp/wfgg-radar/connector-go/native-template/player_scan_v4.go cmd/wfgg-radar-native-template/player_scan_v4.go
          cp /tmp/wfgg-radar/connector-go/native-template/profile_scan_v69.go cmd/wfgg-radar-native-template/profile_scan_v69.go
          cp /tmp/wfgg-radar/connector-go/native-template/profile_scan_v69_test.go cmd/wfgg-radar-native-template/profile_scan_v69_test.go
          cp /tmp/wfgg-radar/connector-go/native-template/profile_rich_fields_v619_test.go cmd/wfgg-radar-native-template/profile_rich_fields_v619_test.go
          gofmt -w cmd/wfgg-radar-native-template/*.go
          go test -tags lastwar_native_template ./cmd/wfgg-radar-native-template
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags lastwar_native_template -trimpath -ldflags='-s -w' -o "$GITHUB_WORKSPACE/radar-vps/pilot-v6193/radar-native-template" ./cmd/wfgg-radar-native-template
          test -s "$GITHUB_WORKSPACE/radar-vps/pilot-v6193/radar-native-template"
          echo RADAR_V6193_NATIVE=PASS

      - name: Stage qualified Cloudflare surfaces
        run: |
          set -euo pipefail
          node --check /tmp/wfgg-radar/src/worker.js
          install -m 0644 /tmp/wfgg-radar/src/worker.js radar-vps/pilot-v6193/cloudflare/worker.js
          install -m 0644 /tmp/wfgg-radar/src/game/remote-transport.js radar-vps/pilot-v6193/cloudflare/remote-transport.js
          install -m 0644 /tmp/wfgg-radar/public/live-radar.html radar-vps/pilot-v6193/cloudflare/live-radar.html
          grep -Fq '/api/radar/seed-scout/start' radar-vps/pilot-v6193/cloudflare/worker.js
          grep -Fq 'WFGG_RADAR_SEED_SCOUT_OFFSET_KEY' radar-vps/pilot-v6193/cloudflare/live-radar.html
          echo RADAR_V6193_CLOUDFLARE_SURFACES=STAGED

      - name: Verify pilot scripts and safety
        run: |
          set -euo pipefail
          bash -n radar-vps/install-v6193-pilot.sh
          bash -n radar-vps/probe-v6193-pilot-runtime.sh
          grep -Fq 'ScanPlayerRegionDiagnosticOnServer' .radar-release-src/v6193-source/connector-go/cmd/radar-connector/server_seed_scout_v6193.go
          ! grep -Fq 'collectorStartCycle(' .radar-release-src/v6193-source/connector-go/cmd/radar-connector/server_seed_scout_v6193.go
          ! grep -Fq 'collectorIngest(' .radar-release-src/v6193-source/connector-go/cmd/radar-connector/server_seed_scout_v6193.go
          ! grep -Fq 'collectorFinishCycle(' .radar-release-src/v6193-source/connector-go/cmd/radar-connector/server_seed_scout_v6193.go
          ! grep -Fq 'ScanProfiles(' .radar-release-src/v6193-source/connector-go/cmd/radar-connector/server_seed_scout_v6193.go
          grep -Fq 'context.WithTimeout(r.Context(), 75*time.Second)' /tmp/wfgg-radar/connector-go/cmd/radar-connector/server_cluster_catalog_v613.go
          echo RADAR_V6193_PRODUCTION_MUTATION=NO
          echo RADAR_V6193_PILOT_QUALIFICATION=PASS

      - name: Publish pilot artifacts to branch only
        run: |
          set -euo pipefail
          chmod 0755 radar-vps/pilot-v6193/radar-connector radar-vps/pilot-v6193/radar-native-template
          (
            cd radar-vps/pilot-v6193
            sha256sum radar-connector radar-native-template > SHA256SUMS
            cd cloudflare
            sha256sum worker.js remote-transport.js live-radar.html > ../CLOUDFLARE_SHA256SUMS
          )
          {
            echo "WFGG_RADAR_PILOT=V6.19.3"
            echo "SOURCE_BRANCH=radar-v6193-seed-scout"
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "CHANGE=read-only-one-region-seed-scout"
            echo "BATCH_SIZE=8"
            echo "BATCH_CURSOR=non-overlapping-offset"
            echo "COLLECTOR_MUTATION=NO"
            echo "GAME_MUTATION=NO"
            echo "PRODUCTION_MUTATION=NO"
          } > radar-vps/pilot-v6193/PILOT_INFO.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar-vps/pilot-v6193
          if git diff --cached --quiet; then
            echo RADAR_V6193_PILOT=UNCHANGED
            exit 0
          fi
          git commit -m 'build(radar): publish V6.19.3 Seed Scout pilot'
          git reset --hard HEAD
          git fetch origin radar-v6193-seed-scout
          git rebase origin/radar-v6193-seed-scout
          git push origin HEAD:radar-v6193-seed-scout
          echo RADAR_V6193_PILOT=PUBLISHED
