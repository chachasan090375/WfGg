name: Sentinel UI V13 patch

on:
  push:
    branches:
      - sentinel-ui-behavior-v13

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'sentinel(v13):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sentinel-ui-behavior-v13
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: node scripts/patch-sentinel-ui-v13.mjs
      - name: Refresh checksum
        run: sha256sum frontend/train-native/app.v15.js > frontend/train-native/app.v15.js.sha256
      - name: Syntax checks
        run: |
          node --check frontend/train-native/app.v15.js
          node --check frontend/train-native/sentinel-train-v1.js
      - name: Commit runtime patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/train-native/app.v15.js frontend/train-native/app.v15.js.sha256 frontend/train-native/sentinel-train-v1.js
          if git diff --cached --quiet; then
            echo "No runtime changes"
            exit 0
          fi
          git commit -m "sentinel(v13): simulate UI behavior and graphic state"
          git push origin HEAD:sentinel-ui-behavior-v13
