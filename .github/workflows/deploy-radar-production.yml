name: Deploy autonomous WfGg Radar production

on:
  push:
    branches: [radar-production-v1]
    paths:
      - 'radar-release/**'
      - '.github/workflows/deploy-radar-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wfgg-radar-production
  cancel-in-progress: false

env:
  RADAR_WORKER: wfgg-radar
  RADAR_D1_NAME: wfgg-radar
  RADAR_CONNECTOR_URL: https://chachavps.tail3ab05a.ts.net

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RADAR_CONNECTOR_SHARED_KEY: ${{ secrets.RADAR_CONNECTOR_SHARED_KEY }}
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'MISSING_SECRET=CLOUDFLARE_API_TOKEN'; exit 2; }
          test "${#RADAR_CONNECTOR_SHARED_KEY}" -ge 32 || { echo 'MISSING_OR_WEAK_SECRET=RADAR_CONNECTOR_SHARED_KEY'; exit 2; }
          echo 'CLOUDFLARE_API_TOKEN=OK'
          echo 'RADAR_CONNECTOR_SHARED_KEY=OK'

      - name: Expand immutable Radar release
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar
          mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          echo '234df1dec57f6211bc625855bf13350c9f17fbd843fbe92d8cf1ab7cb5c081ef  /tmp/radar-src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar

      - name: Guardian pre-deploy gate
        working-directory: /tmp/wfgg-radar
        run: |
          set -euo pipefail
          npm test
          npm run check
          cd connector-go
          go test ./...
          go vet ./...
          go build ./cmd/radar-connector
          cd ..
          grep -q "native-template-readonly-v1" connector-go/internal/protocol/native_template.go
          grep -q '"_id"' connector-go/native-template/main.go
          grep -q '"cmdBaseTime"' connector-go/native-template/main.go
          grep -q '"SecurityCode"' connector-go/native-template/main.go
          grep -q '"OneCode"' connector-go/native-template/main.go
          grep -q '"CoreV"' connector-go/native-template/main.go
          grep -q '"psh"' connector-go/native-template/main.go
          ! grep -REq 'building\.production\.collect|mail\.reward|al\.science\.donate|visitor\.operate' connector-go src || false

      - name: Verify ChaChaVPS connector over signed HTTPS
        env:
          RADAR_CONNECTOR_SHARED_KEY: ${{ secrets.RADAR_CONNECTOR_SHARED_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, hmac, json, os, secrets, time, urllib.request

          base = os.environ['RADAR_CONNECTOR_URL'].rstrip('/')
          path = '/v1/health'
          method = 'GET'
          body = b''
          timestamp = str(int(time.time()))
          nonce = secrets.token_hex(16)
          body_hash = hashlib.sha256(body).hexdigest()
          canonical = '\n'.join([method, path, timestamp, nonce, body_hash])
          signature = hmac.new(
              os.environ['RADAR_CONNECTOR_SHARED_KEY'].encode(),
              canonical.encode(),
              hashlib.sha256,
          ).hexdigest()
          req = urllib.request.Request(
              base + path,
              method=method,
              headers={
                  'X-Radar-Timestamp': timestamp,
                  'X-Radar-Nonce': nonce,
                  'X-Radar-Signature': signature,
              },
          )
          with urllib.request.urlopen(req, timeout=15) as response:
              data = json.loads(response.read().decode())
          assert data.get('ok') is True
          assert data.get('service') == 'wfgg-radar-connector'
          assert data.get('readonly') is True
          print('CHACHAVPS_CONNECTOR=OK')
          print('CHACHAVPS_CONNECTOR_PROTOCOL=' + str(data.get('protocol', 'unknown')))
          PY

      - name: Resolve Cloudflare deployment context
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 .github/scripts/resolve-cloudflare-context.py

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Resolve or create autonomous Radar D1
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          name=os.environ['RADAR_D1_NAME']
          def run(*args):
            proc=subprocess.run(args,text=True,capture_output=True)
            if proc.returncode:
              print(proc.stdout)
              print(proc.stderr)
              raise SystemExit(proc.returncode)
            return proc.stdout
          data=json.loads(run('wrangler','d1','list','--json'))
          found=next((x for x in data if x.get('name')==name),None)
          if not found:
            print('D1_CREATE=START')
            subprocess.run(['wrangler','d1','create',name],check=True)
            data=json.loads(run('wrangler','d1','list','--json'))
            found=next((x for x in data if x.get('name')==name),None)
          if not found or not found.get('uuid'):
            raise SystemExit('RADAR_D1_RESOLVE_FAILED')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('database_id='+found['uuid']+'\n')
          print('RADAR_D1=OK')
          PY

      - name: Generate production Worker configuration
        env:
          D1_ID: ${{ steps.d1.outputs.database_id }}
        working-directory: /tmp/wfgg-radar
        run: |
          set -euo pipefail
          cat > wrangler.toml <<EOF
          name = "wfgg-radar"
          main = "src/worker.js"
          compatibility_date = "2026-09-10"
          workers_dev = true

          [assets]
          directory = "./public"
          binding = "ASSETS"
          run_worker_first = ["/api/*"]

          [[d1_databases]]
          binding = "DB"
          database_name = "wfgg-radar"
          database_id = "$D1_ID"

          [vars]
          RADAR_SESSION_TTL = "3600"
          RADAR_OWNER_PSEUDO = "__OWNER_BOOTSTRAP_PENDING__"
          RADAR_CONNECTOR_URL = "$RADAR_CONNECTOR_URL"

          [triggers]
          crons = ["*/5 * * * *"]
          EOF

      - name: Apply autonomous Radar database schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        working-directory: /tmp/wfgg-radar
        run: wrangler d1 execute wfgg-radar --remote --file=schema.sql

      - name: Deploy Radar Worker and static UI
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        working-directory: /tmp/wfgg-radar
        run: wrangler deploy

      - name: Ensure Radar local cryptographic secrets exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        working-directory: /tmp/wfgg-radar
        run: |
          set -euo pipefail
          names="$(wrangler secret list --name wfgg-radar 2>/dev/null || true)"
          ensure_secret() {
            key="$1"
            echo "$names" | grep -q "\"name\"[[:space:]]*:[[:space:]]*\"$key\"" && { echo "$key=EXISTS"; return; }
            value="$(python3 - <<'PY'
          import secrets
          print(secrets.token_urlsafe(48))
          PY
          )"
            printf '%s' "$value" | wrangler secret put "$key" --name wfgg-radar >/dev/null
            unset value
            echo "$key=CREATED"
          }
          ensure_secret RADAR_SESSION_KEY
          ensure_secret RADAR_TOKEN_VAULT_KEY

      - name: Synchronize ChaChaVPS connector key into Radar Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
          RADAR_CONNECTOR_SHARED_KEY: ${{ secrets.RADAR_CONNECTOR_SHARED_KEY }}
        working-directory: /tmp/wfgg-radar
        run: |
          set -euo pipefail
          printf '%s' "$RADAR_CONNECTOR_SHARED_KEY" | wrangler secret put RADAR_CONNECTOR_SHARED_KEY --name wfgg-radar >/dev/null
          echo 'RADAR_CONNECTOR_SHARED_KEY=SYNCHRONIZED'

      - name: Verify autonomous production surface
        env:
          RADAR_URL: https://wfgg-radar.${{ steps.cf.outputs.subdomain }}.workers.dev
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 24); do
            if curl -fsSL "$RADAR_URL/api/health?probe=$GITHUB_SHA-$i" -o /tmp/radar-health.json \
              && python3 - <<'PY'
          import json
          d=json.load(open('/tmp/radar-health.json'))
          assert d['ok'] is True
          assert d['app']=='wfgg-radar'
          assert d['mode']=='standalone'
          assert d['version']=='0.5.0'
          assert d['gameConnector']=='configured'
          assert d['agents']['oracle']=='v0.5'
          assert d['agents']['sentinel']=='v0.5'
          assert d['agents']['guardian']=='v0.5'
          assert d['agents']['orchestrator']=='v0.5'
          assert d['automation']['enabled'] is True
          PY
            then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          curl -fsSL "$RADAR_URL/" | grep -q 'WfGg Radar'
          echo "RADAR_PRODUCTION_URL=$RADAR_URL"
          echo "RADAR_CONNECTOR_URL=$RADAR_CONNECTOR_URL"
          echo 'RADAR_PRODUCTION=OK'
