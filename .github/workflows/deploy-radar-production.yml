name: Deploy autonomous WfGg Radar production

on:
  # Production ordering: source/workflow promotion first triggers the VPS binary
  # builder. Cloudflare deploys only after that builder publishes the immutable
  # radar-vps/release artifacts to radar-production-v1.
  push:
    branches: [radar-production-v1]
    paths:
      - 'radar-vps/release/**'
  workflow_dispatch:


permissions:
  contents: read

concurrency:
  group: wfgg-radar-production
  cancel-in-progress: false

env:
  RADAR_WORKER: wfgg-radar
  RADAR_D1_NAME: wfgg-radar
  RADAR_CONNECTOR_URL: https://chachavps.tail3ab05a.ts.net
  EXPECTED_CONNECTOR_SHA256: da12aad924564309615b71c249262294f4ba4e5d0aad54a7921c315d07c016fe
  EXPECTED_NATIVE_SHA256: 274d040f5294cb09422e5d55cc4b5335ac7739924c33dcb67b3f279645814900
  EXPECTED_WORKER_SHA256: b4434c02abf740ea224c5ea60aebebfb0baa11ac7f02fffd68838970ba50d27d
  EXPECTED_TRANSPORT_SHA256: c194a13d35ed436278fb11221c73249f89fa9cb9b979122103b9ba20f73e2b5c
  EXPECTED_UI_SHA256: 0e7a226a7dc4c82ef83128d87d4f0458f9054dfe72dd55d574d61b3bb619145e

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RADAR_CONNECTOR_SHARED_KEY: ${{ secrets.RADAR_CONNECTOR_SHARED_KEY }}
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'MISSING_SECRET=CLOUDFLARE_API_TOKEN'; exit 2; }
          test "${#RADAR_CONNECTOR_SHARED_KEY}" -ge 32 || { echo 'MISSING_OR_WEAK_SECRET=RADAR_CONNECTOR_SHARED_KEY'; exit 2; }
          echo CLOUDFLARE_API_TOKEN=OK
          echo RADAR_CONNECTOR_SHARED_KEY=OK

      - name: Reconstruct cumulative V6.22
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar
          mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          echo '234df1dec57f6211bc625855bf13350c9f17fbd843fbe92d8cf1ab7cb5c081ef  /tmp/radar-src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar
          rm -rf /tmp/wfgg-radar/connector-go
          cp -a .radar-release-src/v2-source/connector-go /tmp/wfgg-radar/connector-go

          python3 .github/scripts/patch-radar-target-profile-retry.py
          python3 .github/scripts/patch-radar-federated-diagnostics-v65.py
          python3 .github/scripts/patch-player-scan-v3.py
          python3 .github/scripts/patch-player-scan-v4.py
          python3 .github/scripts/patch-radar-protocol-discovery-v67.py
          python3 .github/scripts/patch-radar-profile-isolation-v68.py
          python3 .github/scripts/patch-radar-native-profile-v69.py
          python3 .github/scripts/patch-radar-native-profile-handshake-v691.py
          python3 .github/scripts/patch-radar-native-profile-exec-v692.py
          python3 .github/scripts/patch-radar-connector-runtime-v693.py
          python3 .github/scripts/patch-radar-profile-refresh-v6191.py
          python3 .github/scripts/patch-radar-cluster-catalog-budget-v6192.py
          python3 .github/scripts/patch-radar-seed-scout-v6193.py
          python3 .github/scripts/patch-radar-autopilot-v6194.py
          python3 .github/scripts/patch-radar-autopilot-stale-cycle-v6197.py
          python3 .github/scripts/patch-radar-collector-cycle-terminalization-v6198.py
          python3 .github/scripts/patch-radar-autopilot-targeted-history-v6199.py
          python3 .github/scripts/patch-radar-autopilot-continue-partial-v61910.py

          install -m 0644 .radar-release-src/v2-source/src/game/remote-transport.js /tmp/wfgg-radar/src/game/remote-transport.js
          python3 .github/scripts/patch-radar-async-collector-worker.py
          python3 .github/scripts/patch-radar-worker-rich-profile-v6191.py
          python3 .github/scripts/patch-radar-worker-seed-scout-v6193.py
          python3 .github/scripts/patch-radar-worker-autopilot-v6194.py

          install -m 0644 radar-ui-live/live-radar.html /tmp/wfgg-radar/public/live-radar.html
          python3 .github/scripts/patch-live-radar-seed-scout-v6193.py
          python3 .github/scripts/patch-live-radar-autopilot-v6194.py
          python3 .github/scripts/patch-radar-session-keepalive-v6195.py
          python3 .github/scripts/patch-live-radar-autopilot-v6196.py
          python3 .github/scripts/patch-live-radar-autopilot-v6197.py
          python3 .github/scripts/patch-live-radar-autopilot-v6198.py
          python3 .github/scripts/patch-live-radar-autopilot-v6199.py
          python3 .github/scripts/patch-live-radar-autopilot-v61910.py
          python3 .github/scripts/patch-radar-manual-search-stop-v61911.py
          python3 .github/scripts/patch-radar-autopilot-no-rescan-qualified-v61912.py
          python3 .github/scripts/patch-live-radar-autopilot-v61912.py
          python3 .github/scripts/patch-radar-autopilot-persistent-ledger-v61913.py
          python3 .github/scripts/patch-live-radar-autopilot-v61913.py
          python3 .github/scripts/patch-radar-autopilot-coverage-completion-v61914.py
          python3 .github/scripts/patch-live-radar-autopilot-v61914.py
          python3 .github/scripts/patch-radar-worker-coverage-propagation-v61915.py
          python3 .github/scripts/patch-radar-autopilot-failure-scope-v61916.py
          python3 .github/scripts/patch-radar-autopilot-adaptive-verification-v61917.py
          python3 .github/scripts/patch-radar-worker-adaptive-verification-v61917.py
          python3 .github/scripts/patch-live-radar-adaptive-verification-v61917.py
          python3 .github/scripts/patch-radar-autopilot-ledger-confirmation-v620.py
          python3 .github/scripts/patch-radar-player-intelligence-connector-v620.py
          python3 .github/scripts/patch-radar-player-intelligence-ui-worker-v620.py
          python3 .github/scripts/patch-radar-recruitment-filter-normalization-v621.py
          python3 .github/scripts/patch-radar-recruitment-ux-ui-worker-v621.py
          python3 .github/scripts/patch-radar-live-profile-resolution-v622.py
          echo RADAR_V622_PRODUCTION_RECONSTRUCT=PASS

      - name: Verify qualified Cloudflare surface digests
        run: |
          set -euo pipefail
          worker="$(sha256sum /tmp/wfgg-radar/src/worker.js | awk '{print $1}')"
          transport="$(sha256sum /tmp/wfgg-radar/src/game/remote-transport.js | awk '{print $1}')"
          ui="$(sha256sum /tmp/wfgg-radar/public/live-radar.html | awk '{print $1}')"
          test "$worker" = "$EXPECTED_WORKER_SHA256"
          test "$transport" = "$EXPECTED_TRANSPORT_SHA256"
          test "$ui" = "$EXPECTED_UI_SHA256"
          grep -Fq '/api/radar/seed-scout/start' /tmp/wfgg-radar/src/worker.js
          grep -Fq '/api/radar/autopilot/start' /tmp/wfgg-radar/src/worker.js
          grep -Fq '/api/radar/autopilot/status' /tmp/wfgg-radar/src/worker.js
          grep -Fq '/api/radar/autopilot/stop' /tmp/wfgg-radar/src/worker.js
          grep -Fq 'baseUrl: env.RADAR_CONNECTOR_URL' /tmp/wfgg-radar/src/worker.js
          ! grep -Fq 'RADAR_CONECTOR_URL' /tmp/wfgg-radar/src/worker.js
          grep -Fq 'WFGG_RADAR_SEED_SCOUT_OFFSET_KEY' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'WFGG_RADAR_AUTOPILOT_UI_V6194' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'WFGG_RADAR_SESSION_KEEPALIVE_V6195' /tmp/wfgg-radar/src/worker.js
          grep -Fq '/api/auth/session/refresh' /tmp/wfgg-radar/src/worker.js
          grep -Fq 'WFGG_RADAR_SESSION_KEEPALIVE_UI_V6195' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'AUTO 12H' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'WFGG_RADAR_AUTOPILOT_CONTINUE_NO_DATA_UI_V6196' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'SEED_SKIPPED_NO_DATA' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'Aucune donnée exploitable' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'WFGG_RADAR_AUTOPILOT_STALE_CYCLE_RECOVERY_UI_V6197' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'WFGG_RADAR_COLLECTOR_CYCLE_TERMINALIZATION_UI_V6198' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'WFGG_RADAR_AUTOPILOT_TARGETED_HISTORY_QUALITY_UI_V6199' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'WFGG_RADAR_AUTOPILOT_CONTINUE_PARTIAL_LIMIT_UI_V61910' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'WFGG_RADAR_MANUAL_SEARCH_STOP_UI_V61911' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq '/api/radar/search/stop' /tmp/wfgg-radar/src/worker.js
          grep -Fq 'WFGG_RADAR_MANUAL_SEARCH_STOP_TRANSPORT_V61911' /tmp/wfgg-radar/src/game/remote-transport.js
          grep -Fq 'WFGG_RADAR_AUTOPILOT_NO_RESCAN_QUALIFIED_V61912' /tmp/wfgg-radar/connector-go/cmd/radar-connector/server_autopilot_v6194.go
          grep -Fq 'WFGG_RADAR_AUTOPILOT_NO_RESCAN_QUALIFIED_UI_V61912' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'WFGG_RADAR_AUTOPILOT_PERSISTENT_LEDGER_V61913' /tmp/wfgg-radar/connector-go/cmd/radar-connector/server_autopilot_v6194.go
          grep -Fq 'WFGG_RADAR_AUTOPILOT_PERSISTENT_LEDGER_UI_V61913' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'WFGG_RADAR_AUTOPILOT_COVERAGE_COMPLETION_V61914' /tmp/wfgg-radar/connector-go/cmd/radar-connector/server_autopilot_v6194.go
          grep -Fq 'WFGG_RADAR_AUTOPILOT_COVERAGE_COMPLETION_UI_V61914' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'WFGG_RADAR_AUTOPILOT_WORKER_COVERAGE_PROPAGATION_V61915' /tmp/wfgg-radar/src/worker.js
          grep -Fq 'WFGG_RADAR_AUTOPILOT_RADAR_ANIMATION_V61915' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'WFGG_RADAR_AUTOPILOT_WORKER_COVERAGE_PROPAGATION_UI_V61915' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'WFGG_RADAR_AUTOPILOT_FAILURE_SCOPE_CONTINUE_V61916' /tmp/wfgg-radar/connector-go/cmd/radar-connector/server_autopilot_v6194.go
          grep -Fq 'WFGG_RADAR_AUTOPILOT_FAILURE_SCOPE_CONTINUE_UI_V61916' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'WFGG_RADAR_AUTOPILOT_ADAPTIVE_VERIFICATION_V61917' /tmp/wfgg-radar/connector-go/cmd/radar-connector/server_autopilot_v6194.go
          grep -Fq 'WFGG_RADAR_AUTOPILOT_ADAPTIVE_VERIFICATION_WORKER_V61917' /tmp/wfgg-radar/src/worker.js
          grep -Fq 'WFGG_RADAR_AUTOPILOT_ADAPTIVE_VERIFICATION_UI_V61917' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'WFGG_RADAR_AUTOPILOT_LEDGER_CONFIRMATION_RESILIENCE_V620' /tmp/wfgg-radar/connector-go/cmd/radar-connector/server_autopilot_v6194.go
          grep -Fq 'WFGG_RADAR_PLAYER_INTELLIGENCE_V620' /tmp/wfgg-radar/connector-go/cmd/radar-connector/player_intelligence_v620.go
          grep -Fq 'WFGG_RADAR_PLAYER_INTELLIGENCE_WORKER_V620' /tmp/wfgg-radar/src/worker.js
          grep -Fq '/api/radar/intelligence/search' /tmp/wfgg-radar/src/worker.js
          grep -Fq 'WFGG_RADAR_PLAYER_INTELLIGENCE_UI_V620' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'id="filterButton"' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'ANCIENS PSEUDOS' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'WFGG_RADAR_RECRUITMENT_FILTER_NORMALIZATION_V621' /tmp/wfgg-radar/connector-go/cmd/radar-connector/player_intelligence_v621.go
          grep -Fq 'WFGG_RADAR_RECRUITMENT_UX_WORKER_V621' /tmp/wfgg-radar/src/worker.js
          grep -Fq 'WFGG_RADAR_RECRUITMENT_UX_UI_V621' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'PAYS PROPOSÉS PAR LAST WAR' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'RECRUTEMENT FR' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'data-kind="servers"' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'data-kind="alliances"' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'data-kind="players"' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'lastwar-observed-values' /tmp/wfgg-radar/connector-go/cmd/radar-connector/player_intelligence_v621.go
          grep -Fq 'WFGG_RADAR_PROFILE_ONLY_JOB_V6191' /tmp/wfgg-radar/connector-go/cmd/radar-connector/collector_jobs.go
          grep -Fq 'WFGG_RADAR_TARGET_PROFILE_REFRESH_ROUTE_V6191' /tmp/wfgg-radar/connector-go/cmd/radar-connector/main.go
          grep -Fq 'WFGG_RADAR_LIVE_PROFILE_RESOLUTION_UI_V622' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'scheduleResolvedProfileRefreshV622' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'get.user.info.multi · LIVE' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'aucun scan MAP' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'AUTOPILOT V6.20.0 · ARRÊTÉ' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'fullCyclesPerCluster:1,adaptiveVerification:true,coverageMode:true' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq '1×9/9 valide par grappe' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'AUTOPILOT V6.20.0 · ARRÊTÉ' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'SEED_SKIPPED_FAILURE_SCOPE' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'AUTOPILOT V6.20.0 · ARRÊTÉ' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'AUTOPILOT V6.20.0 · ARRÊTÉ' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'coverageMode:true' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'COUVERTURE TERMINÉE' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'AUTOPILOT V6.20.0 · ARRÊTÉ' /tmp/wfgg-radar/public/live-radar.html
          echo RADAR_V622_CLOUDFLARE_DIGESTS=PASS

      - name: Guardian pre-deploy gate
        working-directory: /tmp/wfgg-radar
        run: |
          set -euo pipefail
          npm test
          npm run check
          cd connector-go
          go test ./...
          go vet ./...
          cd ..
          ! grep -REq 'building\.production\.collect|mail\.reward|al\.science\.donate|visitor\.operate' connector-go src || false
          echo RADAR_V622_GUARDIAN=PASS

      - name: Wait for Sentinel reconciliation and connector availability
        env:
          RADAR_CONNECTOR_SHARED_KEY: ${{ secrets.RADAR_CONNECTOR_SHARED_KEY }}
        run: |
          set -euo pipefail
          sleep 75
          python3 - <<'PY'
          import hashlib,hmac,json,os,secrets,time,urllib.request,urllib.error
          base=os.environ['RADAR_CONNECTOR_URL'].rstrip('/')
          secret=os.environ['RADAR_CONNECTOR_SHARED_KEY']
          path='/v1/collector/search/stop'
          body=b'{"id":""}'
          for attempt in range(1,37):
              ts=str(int(time.time()))
              nonce=secrets.token_hex(16)
              canonical='\n'.join(['POST',path,ts,nonce,hashlib.sha256(body).hexdigest()])
              sig=hmac.new(secret.encode(),canonical.encode(),hashlib.sha256).hexdigest()
              req=urllib.request.Request(base+path,data=body,method='POST',headers={
                  'Content-Type':'application/json',
                  'X-Radar-Timestamp':ts,
                  'X-Radar-Nonce':nonce,
                  'X-Radar-Signature':sig,
              })
              try:
                  with urllib.request.urlopen(req,timeout=15) as r:
                      status=r.status; data=json.load(r)
              except urllib.error.HTTPError as e:
                  status=e.code
                  try: data=json.loads(e.read().decode())
                  except Exception: data={}
              print(f'RADAR_V622_CONNECTOR_WAIT={attempt} HTTP={status} ERROR={data.get("error")}')
              if status==400 and data.get('error')=='COLLECTOR_JOB_ID_REQUIRED':
                  print('RADAR_V622_CONNECTOR_SIGNED_SURFACE=READY')
                  raise SystemExit(0)
              time.sleep(5)
          raise SystemExit('RADAR_V622_CONNECTOR_SURFACE_TIMEOUT')
          PY
      - name: Resolve Cloudflare deployment context
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 .github/scripts/resolve-cloudflare-context.py

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Resolve or create autonomous Radar D1
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          name=os.environ['RADAR_D1_NAME']
          def run(*args):
              proc=subprocess.run(args,text=True,capture_output=True)
              if proc.returncode:
                  print(proc.stdout); print(proc.stderr)
                  raise SystemExit(proc.returncode)
              return proc.stdout
          data=json.loads(run('wrangler','d1','list','--json'))
          found=next((x for x in data if x.get('name')==name),None)
          if not found:
              subprocess.run(['wrangler','d1','create',name],check=True)
              data=json.loads(run('wrangler','d1','list','--json'))
              found=next((x for x in data if x.get('name')==name),None)
          if not found or not found.get('uuid'):
              raise SystemExit('RADAR_D1_RESOLVE_FAILED')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('database_id='+found['uuid']+'\n')
          PY

      - name: Generate production Worker configuration
        env:
          D1_ID: ${{ steps.d1.outputs.database_id }}
        working-directory: /tmp/wfgg-radar
        run: |
          set -euo pipefail
          cat > wrangler.toml <<EOF
          name = "wfgg-radar"
          main = "src/worker.js"
          compatibility_date = "2026-09-10"
          workers_dev = true

          [assets]
          directory = "./public"
          binding = "ASSETS"
          run_worker_first = ["/api/*"]

          [[d1_databases]]
          binding = "DB"
          database_name = "wfgg-radar"
          database_id = "$D1_ID"

          [vars]
          RADAR_SESSION_TTL = "43200"
          RADAR_OWNER_PSEUDO = "__OWNER_BOOTSTRAP_PENDING__"
          RADAR_CONNECTOR_URL = "$RADAR_CONNECTOR_URL"

          [triggers]
          crons = ["*/5 * * * *"]
          EOF

      - name: Apply autonomous Radar database schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        working-directory: /tmp/wfgg-radar
        run: wrangler d1 execute wfgg-radar --remote --file=schema.sql

      - name: Apply V6.19.1 rich profile cache schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        working-directory: /tmp/wfgg-radar
        run: wrangler d1 execute wfgg-radar --remote --file="$GITHUB_WORKSPACE/worker/migrations/0004_radar_profile_rich_v6191.sql"

      - name: Deploy Radar Worker and static UI
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        working-directory: /tmp/wfgg-radar
        run: wrangler deploy

      - name: Ensure Radar cryptographic secrets exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        working-directory: /tmp/wfgg-radar
        run: |
          set -euo pipefail
          names="$(wrangler secret list --name wfgg-radar 2>/dev/null || true)"
          ensure_secret() {
            key="$1"
            echo "$names" | grep -q "\"name\"[[:space:]]*:[[:space:]]*\"$key\"" && { echo "$key=EXISTS"; return; }
            value="$(python3 - <<'PY'
          import secrets
          print(secrets.token_urlsafe(48))
          PY
          )"
            printf '%s' "$value" | wrangler secret put "$key" --name wfgg-radar >/dev/null
            unset value
            echo "$key=CREATED"
          }
          ensure_secret RADAR_SESSION_KEY
          ensure_secret RADAR_TOKEN_VAULT_KEY

      - name: Synchronize connector key into Radar Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
          RADAR_CONNECTOR_SHARED_KEY: ${{ secrets.RADAR_CONNECTOR_SHARED_KEY }}
        working-directory: /tmp/wfgg-radar
        run: |
          set -euo pipefail
          printf '%s' "$RADAR_CONNECTOR_SHARED_KEY" | wrangler secret put RADAR_CONNECTOR_SHARED_KEY --name wfgg-radar >/dev/null
          echo RADAR_CONNECTOR_SHARED_KEY=SYNCHRONIZED

      - name: Verify production surface
        env:
          RADAR_URL: https://wfgg-radar.${{ steps.cf.outputs.subdomain }}.workers.dev
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            echo "RADAR_PROBE=$i"
            if curl -fsSL "$RADAR_URL/api/health?probe=$GITHUB_SHA-$i" -o /tmp/radar-health.json &&
               python3 - <<'PY'
          import json
          d=json.load(open('/tmp/radar-health.json'))
          assert d.get('ok') is True
          assert d.get('app')=='wfgg-radar'
          assert d.get('gameConnector')=='configured'
          PY
            then break; fi
            test "$i" -lt 24 || exit 1
