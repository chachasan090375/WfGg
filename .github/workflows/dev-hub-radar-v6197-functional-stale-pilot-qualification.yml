name: ChaCha DEV Radar V6.19.7 functional stale-cycle pilot qualification

on:
  push:
    branches: [dev-hub-v5-radar-cluster-quality-diagnostic-v1]
    paths:
      - 'dev-hub/bin/run-radar-v6197-functional-stale-pilot-via-chacha-dev.sh'
      - 'dev-hub/projects/wfgg-radar/project-intent.v1.json'
      - '.github/workflows/dev-hub-radar-v6197-functional-stale-pilot-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PILOT_REV: 633364c2f2f60aaef6967126df7d25a167f972f3
  EXPECTED_CONNECTOR_SHA256: ccbb1a178212d3137136fff30c31725b88a7e3a8113dca922138018186a158d5
  EXPECTED_NATIVE_SHA256: 274d040f5294cb09422e5d55cc4b5335ac7739924c33dcb67b3f279645814900

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-hub-v5-radar-cluster-quality-diagnostic-v1

      - name: Validate bounded functional runner
        run: |
          set -euo pipefail
          R=dev-hub/bin/run-radar-v6197-functional-stale-pilot-via-chacha-dev.sh
          bash -n "$R"
          grep -Fq 'PILOT_REV="633364c2f2f60aaef6967126df7d25a167f972f3"' "$R"
          grep -Fq 'PILOT_BRANCH="radar-v6197-autopilot-stale-cycle-recovery"' "$R"
          grep -Fq 'CONNECTOR_SHA="ccbb1a178212d3137136fff30c31725b88a7e3a8113dca922138018186a158d5"' "$R"
          grep -Fq 'TARGET_QUERY="@federated:8131"' "$R"
          grep -Fq 'STALE_TARGET_CYCLE_NOT_FOUND' "$R"
          grep -Fq 'TARGET_CYCLE_NOT_STALE' "$R"
          grep -Fq 'RADAR_V6197_FUNCTIONAL_WINDOW_READY=YES' "$R"
          grep -Fq 'appuie UNE SEULE FOIS sur RECHERCHE' "$R"
          grep -Fq 'STALE_RUNNING_CYCLE_RECOVERED_V6197' "$R"
          grep -Fq 'RADAR_V6197_STALE_CYCLE_RECOVERED=PASS' "$R"
          grep -Fq 'RADAR_V6197_FRESH_CYCLE_TERMINAL=PASS' "$R"
          grep -Fq 'RADAR_V6197_LASTWAR_MUTATION=NO' "$R"
          grep -Fq 'PRODUCTION_RELEASE_APPROVAL_REVOKED=PASS' "$R"
          grep -Fq 'RADAR_V6197_PILOT_CLOSE=' "$R"
          echo RADAR_V6197_FUNCTIONAL_RUNNER=PASS

      - name: Validate exact functional approval boundary
        run: |
          set -euo pipefail
          R=dev-hub/bin/run-radar-v6197-functional-stale-pilot-via-chacha-dev.sh
          grep -Fq 'J’approuve le PILOT fonctionnel Radar V6.19.7 Stale Cycle Recovery révision 633364c2f2f60aaef6967126df7d25a167f972f3 avec un scan Last War READ-ONLY ciblé sur @federated:8131 et mutation Collector limitée à la récupération du cycle stale et au nouveau cycle de preuve.' "$R"
          grep -Fq 'single_pilot_window' "$R"
          echo RADAR_V6197_FUNCTIONAL_APPROVAL_CONTRACT=PASS

      - name: Validate project intent
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          x=json.load(open('dev-hub/projects/wfgg-radar/project-intent.v1.json',encoding='utf-8'))
          assert x['current_change']['id']=='radar-v6197-autopilot-stale-cycle-recovery'
          c='\n'.join(x.get('acceptance_criteria') or [])
          assert 'exactly one normal @federated:8131 search' in c,c
          assert 'STALE_RUNNING_CYCLE_RECOVERED_V6197' in c,c
          assert 'Last War READ-ONLY' in c,c
          print('RADAR_V6197_FUNCTIONAL_INTENT=PASS')
          PY

      - name: Validate pinned V6.19.7 pilot assets
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/chachasan090375/WfGg/$PILOT_REV"
          mkdir -p /tmp/v6197
          for f in radar-vps/pilot-v6197/SHA256SUMS radar-vps/pilot-v6197/radar-connector radar-vps/pilot-v6197/radar-native-template radar-vps/install-v6197-pilot.sh radar-vps/probe-v6197-pilot-runtime.sh; do
            curl -fsSL "$BASE/$f" -o "/tmp/v6197/$(basename "$f")"
          done
          (cd /tmp/v6197 && sha256sum -c SHA256SUMS)
          test "$(sha256sum /tmp/v6197/radar-connector | awk '{print $1}')" = "$EXPECTED_CONNECTOR_SHA256"
          test "$(sha256sum /tmp/v6197/radar-native-template | awk '{print $1}')" = "$EXPECTED_NATIVE_SHA256"
          echo RADAR_V6197_FUNCTIONAL_PINNED_ASSETS=PASS
