name: Dev Hub V5 Cloudflare Pages Preview Enablement Chain V2

on:
  push:
    branches: [dev-hub-v5-cloudflare-pages-preview-enable-chain-v2]

permissions:
  contents: read
  checks: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Freeze repository state
        run: |
          set -euo pipefail
          git status --porcelain > /tmp/git-before.txt
          test ! -s /tmp/git-before.txt
          mkdir -p /tmp/cf-evidence /tmp/cf-runtime /tmp/cf-control
      - name: Observe real Pages preview 3x
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess,time
          from pathlib import Path
          req={'schema':'chacha.dev/dispatch-envelope/v1','project':'wfgg','task':{'id':'preview','permission':'preview-deploy'},'bindings':[{'provider':'cloudflare-pages','adapter':'cloudflare-pages-adapter'}],'metadata':{'cloudflare_pages':{'source_commit_sha':os.environ['GITHUB_SHA'],'source_branch':os.environ['GITHUB_REF_NAME']}}}
          def obs():
            p=subprocess.run(['python3','dev-hub/adapters/cloudflare-pages-adapter.py'],input=json.dumps(req),text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,env=os.environ.copy(),timeout=45)
            return json.loads(p.stdout)
          first=None
          for _ in range(60):
            x=obs()
            if x.get('status')=='OK': first=x; break
            time.sleep(5)
          assert first is not None,x
          runs=[first]
          for _ in range(2):
            time.sleep(2); x=obs(); assert x['status']=='OK',x; runs.append(x)
          urls=[]
          for i,x in enumerate(runs,1):
            assert x['verification']['status']=='UNVERIFIED'
            d=x['evidence'][0]['details']; assert d['production_target'] is False and d['workers_target_selected'] is False
            assert d['source_commit_sha']==os.environ['GITHUB_SHA'] and d['source_branch']==os.environ['GITHUB_REF_NAME']
            urls.append(d['immutable_preview_url']); Path(f'/tmp/cf-evidence/observation-{i}.json').write_text(json.dumps(x,indent=2)+'\n')
          assert len(set(urls))==1
          url=urls[0]; assert url.startswith('https://') and url.endswith('.wfgg.pages.dev') and url!='https://wfgg.pages.dev'
          Path('/tmp/cf-evidence/preview-url.txt').write_text(url+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('PREVIEW_URL='+url+'\n')
          print('REAL_PREVIEW=PASS'); print('REPEATABILITY=3/3'); print('HEALTH=HEALTHY')
          PY
      - name: Prepare provider-agnostic manifest and isolated control plane
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          repo=Path.cwd(); root=Path('/tmp/cf-control')
          m={'schema':'chacha.dev/project-manifest/v1','project':'cf-preview-enable-qualification','environment':{'class':'preview'},'workflows':[{'id':'browser-verification','kind':'browser-verification','target':{'url':os.environ['PREVIEW_URL']}}]}
          assert all(k not in m for k in ('provider','adapter'))
          assert all(k not in m['workflows'][0] for k in ('provider','adapter'))
          Path('/tmp/cf-manifest.json').write_text(json.dumps(m,indent=2)+'\n')
          state=json.loads((repo/'dev-hub/config/control-plane-state.v1.json').read_text()); state['storage']['runtime_root']=str(root/'state'); state['storage']['transaction_root']=str(root/'transactions'); (root/'state-policy.json').write_text(json.dumps(state,indent=2)+'\n')
          rc=json.loads((repo/'dev-hub/config/run-controller.v1.json').read_text()); rc['mode']='execute-enabled'; rc['locking']['root']=str(root/'locks/dispatch'); (root/'run-controller.json').write_text(json.dumps(rc,indent=2)+'\n')
          pc=json.loads((repo/'dev-hub/config/project-control.v1.json').read_text()); pc['runtime'].update({'state_root':str(root/'state'),'evidence_root':str(root/'evidence'),'plans_root':str(root/'plans'),'health_root':str(root/'health'),'runs_root':str(root/'runs'),'transactions_root':str(root/'transactions'),'locks_root':str(root/'locks/control')}); pc['repository_paths']['control_plane_state']=str(root/'state-policy.json'); pc['repository_paths']['run_controller']=str(root/'run-controller.json'); (root/'project-control.json').write_text(json.dumps(pc,indent=2)+'\n')
          print('PROVIDER_AGNOSTIC_MANIFEST=PASS')
          PY
      - name: Verify preview through Chrome Playwright and Broker
        run: |
          set -euo pipefail
          python3 dev-hub/bin/trusted-runtime-provisioner-v2.py --repo-root "$GITHUB_WORKSPACE" --project-control-policy /tmp/cf-control/project-control.json --manifest /tmp/cf-manifest.json --runtime-root /tmp/cf-runtime --execute --output /tmp/cf-evidence/browser-chain.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/cf-evidence/browser-chain.json').read_text())
          assert x['status']=='VERIFIED' and x['executed'] is True
          assert x['required_external_providers']==['chrome-devtools-mcp','playwright-mcp']
          assert x['provider_selection_owned_by_scheduler'] is True and x['registry_mutated'] is False and x['production_touched'] is False
          assert x['audit_integrity']=='PASS'
          print('BROWSER_CHAIN=VERIFIED')
          PY
      - name: Qualify PILOT readiness and sandbox
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy,json,os
          from datetime import datetime,timezone
          from pathlib import Path
          repo=Path.cwd(); a=json.loads((repo/'dev-hub/config/provider-adapters.v1.json').read_text()); c=json.loads((repo/'dev-hub/config/cloudflare-pages-preview-contract.v1.json').read_text())
          assert a['adapters']['cloudflare-pages-adapter']=={'status':'CONTRACT_OK','executable':None,'supports':['preview-deploy']}
          assert c['runtime_status']=='CONTRACT_OK' and c['security']['production_deploy'] is False
          sa=copy.deepcopy(a); sc=copy.deepcopy(c); sa['adapters']['cloudflare-pages-adapter']['status']='PILOT'; sc['runtime_status']='PILOT'; sa['adapters']['cloudflare-pages-adapter']['status']='ENABLED'; sc['runtime_status']='ENABLED'
          assert sa['adapters']['cloudflare-pages-adapter']['supports']==['preview-deploy'] and sa['adapters']['cloudflare-pages-adapter']['executable'] is None and sc['security']['production_deploy'] is False
          b=json.loads(Path('/tmp/cf-evidence/browser-chain.json').read_text()); url=Path('/tmp/cf-evidence/preview-url.txt').read_text().strip()
          e={'schema':'chacha.dev/cloudflare-pages-preview-enablement-chain/v1','provider_id':'cloudflare-pages','adapter_id':'cloudflare-pages-adapter','observed_at':datetime.now(timezone.utc).isoformat(),'source_commit_sha':os.environ['GITHUB_SHA'],'source_branch':os.environ['GITHUB_REF_NAME'],'pilot':{'status':'PASS','immutable_preview_url':url,'provider_result_trust':'UNVERIFIED','production_touched':False},'readiness':{'status':'READY_FOR_ENABLEMENT','repeatability':'3/3','provider_health':'HEALTHY','browser_chain_status':b['status'],'audit_integrity':b['audit_integrity'],'blockers':[]},'sandbox':{'status':'PASS','transition':'PILOT->ENABLED','authoritative_registry_mutated':False,'supports':['preview-deploy'],'executable':None,'production_capability':False},'rollback':{'defined':True,'target':'CONTRACT_OK','data_migration_required':False,'cloudflare_project_mutation_required':False,'production_change_required':False},'eligible_for_enabled_materialization':True,'automatic_promotion':False}
          Path('/tmp/cf-evidence/enablement-chain.json').write_text(json.dumps(e,indent=2)+'\n')
          print('PILOT=PASS'); print('READINESS=READY_FOR_ENABLEMENT'); print('SANDBOX=PASS')
          PY
      - name: Prove plan-only and repository unchanged
        run: |
          set -euo pipefail
          python3 dev-hub/bin/trusted-runtime-provisioner-v2.py --repo-root "$GITHUB_WORKSPACE" --project-control-policy /tmp/cf-control/project-control.json --manifest /tmp/cf-manifest.json --runtime-root /tmp/cf-plan --output /tmp/cf-evidence/plan-only.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/cf-evidence/plan-only.json').read_text()); assert x['status']=='PLANNED' and x['executed'] is False and x['provisioned']=={} and x['runtime_binding_created'] is False
          PY
          git status --porcelain > /tmp/git-after.txt
          diff -u /tmp/git-before.txt /tmp/git-after.txt
          test ! -s /tmp/git-after.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-preview-enablement-${{ github.run_id }}
          path: /tmp/cf-evidence
          retention-days: 30
          if-no-files-found: error
