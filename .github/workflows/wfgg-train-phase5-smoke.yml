name: WfGg Train Phase 5 deployed smoke

on:
  push:
    branches:
      - train-bridge-phase5

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed bridge
        shell: bash
        run: |
          set -euo pipefail
          PORTAL='https://train-bridge-phase5.wfgg.pages.dev'
          TRAIN='https://portal-auth-phase1-wfgg-train.chachasan090375.workers.dev'

          echo '=== WAIT FOR PAGES ==='
          ok=0
          for i in $(seq 1 20); do
            if curl -fsSL "$PORTAL/train/" -o /tmp/train.html \
              && grep -q 'WFGG_PORTAL_TRAIN_DIRECT_API_V1' /tmp/train.html; then
              ok=1
              break
            fi
            sleep 3
          done
          test "$ok" = 1
          echo 'PHASE5_HTML=OK'

          echo '=== HEADERS ==='
          curl -sSIL "$PORTAL/train/" | tee /tmp/train.headers
          csp="$(grep -i '^content-security-policy:' /tmp/train.headers || true)"
          echo "CSP=${csp:-NONE}"
          if [ -n "$csp" ] && echo "$csp" | grep -qi 'connect-src'; then
            echo "$csp" | grep -Eq "portal-auth-phase1-wfgg-train\.chachasan090375\.workers\.dev|connect-src[^;]*\*"
          fi
          echo 'TRAIN_CSP=OK'

          echo '=== APP REWRITE ==='
          curl -fsSL "$PORTAL/train/app.js" -o /tmp/app.js
          ! grep -q 'https://wfgg-train.chachasan090375.workers.dev' /tmp/app.js
          echo 'TRAIN_APP_REWRITE=OK'

          echo '=== DIRECT API CORS ==='
          curl -sS -D /tmp/cors.headers -o /dev/null -X OPTIONS \
            -H "Origin: $PORTAL" \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: X-WfGg-Portal-Token' \
            "$TRAIN/api/snapshot"
          grep -qi '^HTTP/.* 204' /tmp/cors.headers
          grep -qi 'access-control-allow-headers:.*x-wfgg-portal-token' /tmp/cors.headers
          echo 'TRAIN_DIRECT_CORS=OK'

          echo '=== INVALID TOKEN MUST REACH PORTAL API ==='
          status="$(curl -sS -o /tmp/body.json -w '%{http_code}' \
            -H 'X-WfGg-Portal-Token: wfgg-intentional-invalid-phase5-token' \
            "$TRAIN/api/snapshot")"
          cat /tmp/body.json
          echo
          test "$status" = '401'
          echo 'TRAIN_DIRECT_CONTEXT_HOP=OK'
