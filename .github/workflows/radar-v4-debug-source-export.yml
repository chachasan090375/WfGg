name: Radar v4 debug source export

on:
  push:
    branches: [radar-production-v1]
    paths:
      - '.github/workflows/radar-v4-debug-source-export.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct patched v4 source
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar
          mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar
          base64 -d .radar-release-src/player-scan-v2.patch | gzip -dc > /tmp/player-scan-v2.patch
          cd /tmp/wfgg-radar
          git apply /tmp/player-scan-v2.patch
          cd "$GITHUB_WORKSPACE"
          python3 .github/scripts/patch-player-scan-v3.py
          python3 .github/scripts/patch-player-scan-v4.py
      - name: Export exact patched sources
        run: |
          set -euo pipefail
          mkdir -p .radar-release-src/v4-export/native-template .radar-release-src/v4-export/protocol
          cp /tmp/wfgg-radar/connector-go/native-template/main.go .radar-release-src/v4-export/native-template/main.go
          cp /tmp/wfgg-radar/connector-go/internal/protocol/native_template.go .radar-release-src/v4-export/protocol/native_template.go
          git config user.name 'WfGg Radar CI'
          git config user.email 'radar-ci@users.noreply.github.com'
          git add .radar-release-src/v4-export
          if git diff --cached --quiet; then
            echo SOURCE_EXPORT_UNCHANGED=YES
          else
            git commit -m 'chore(radar): export exact v4 debug sources'
            git push origin HEAD:radar-production-v1
          fi
