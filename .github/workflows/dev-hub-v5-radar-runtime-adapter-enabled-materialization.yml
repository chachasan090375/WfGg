name: DEV HUB V5 Radar runtime adapter ENABLED materialization

on:
  push:
    branches:
      - dev-hub-v5-radar-runtime-adapter-enabled
    paths:
      - 'dev-hub/config/provider-adapters.v1.json'
      - 'dev-hub/evidence/radar-runtime-adapter-enabled-2026-09-18.json'
      - 'dev-hub/bin/adapter-promotion.py'
      - 'dev-hub/config/adapter-contract.v1.json'
      - 'dev-hub/config/adapter-promotion.v1.json'
      - 'dev-hub/config/adapter-rollbacks.v1.json'
      - 'dev-hub/bin/run-controller.py'
      - '.github/workflows/dev-hub-v5-radar-runtime-adapter-enabled-materialization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-enabled:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reproduce approved PILOT to ENABLED transition
        run: |
          set -euo pipefail
          cp dev-hub/config/provider-adapters.v1.json /tmp/committed-registry.json

          python3 - <<'PY'
          import json
          p='/tmp/committed-registry.json'
          x=json.load(open(p,encoding='utf-8'))
          a=x['adapters']['radar-runtime-adapter']
          assert a['status']=='ENABLED',a
          assert a['executable']=='/opt/chacha-dev/adapters/radar-runtime/current/radar-runtime-adapter',a
          a['status']='PILOT'
          open('/tmp/pre-enable-registry.json','w',encoding='utf-8').write(json.dumps(x,indent=2)+'\n')
          print('RADAR_ENABLE_PRESTATE_RECONSTRUCTED=PILOT')
          PY

          python3 dev-hub/bin/adapter-promotion.py             --registry /tmp/pre-enable-registry.json             --contract dev-hub/config/adapter-contract.v1.json             --policy dev-hub/config/adapter-promotion.v1.json             --evidence dev-hub/evidence/radar-runtime-adapter-enabled-2026-09-18.json             --report /tmp/enabled-report.json             --json apply             --adapter radar-runtime-adapter             --target ENABLED             --executable /opt/chacha-dev/adapters/radar-runtime/current/radar-runtime-adapter             --approval-id approval-radar-runtime-adapter-enabled-20260918T1902Z             --actor chacha-dev-human-approved-enable             --receipt /tmp/enabled-receipt.json             --apply > /tmp/enabled-stdout.json

          python3 - <<'PY'
          import json
          committed=json.load(open('/tmp/committed-registry.json',encoding='utf-8'))
          generated=json.load(open('/tmp/pre-enable-registry.json',encoding='utf-8'))
          report=json.load(open('/tmp/enabled-report.json',encoding='utf-8'))
          receipt=json.load(open('/tmp/enabled-receipt.json',encoding='utf-8'))

          ca=committed['adapters']['radar-runtime-adapter']
          ga=generated['adapters']['radar-runtime-adapter']
          assert ga==ca,(ga,ca)

          assert report['eligible'] is True,report
          assert report['applied'] is True,report
          assert report['current_status']=='PILOT',report
          assert report['target_status']=='ENABLED',report
          assert report['production_capable'] is True,report
          assert report['approval_required'] is True,report
          assert report['approval_id']=='approval-radar-runtime-adapter-enabled-20260918T1902Z',report
          assert report['blockers']==[],report

          assert receipt['receipt_schema']=='chacha.dev/adapter-promotion-receipt/v1',receipt
          assert receipt['new_entry']==ca,receipt
          assert receipt['approval_id']=='approval-radar-runtime-adapter-enabled-20260918T1902Z',receipt

          print('RADAR_ENABLED_ENGINE_REPRODUCTION=PASS')
          print('RADAR_ENABLED_REGISTRY_MATCH=PASS')
          print('RADAR_ENABLED_APPROVAL_BINDING=PASS')
          print('RADAR_ENABLED_RECEIPT=PASS')
          PY

      - name: Validate explicit human approval evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          e=json.load(open('dev-hub/evidence/radar-runtime-adapter-enabled-2026-09-18.json',encoding='utf-8'))
          a=e['approvals']
          assert len(a)==1,a
          x=a[0]
          assert x['id']=='approval-radar-runtime-adapter-enabled-20260918T1902Z',x
          assert x['type']=='adapter-production-enable',x
          assert x['adapter']=='radar-runtime-adapter',x
          assert x['target_status']=='ENABLED',x
          assert x['actor']=='human-user',x
          assert x['source']=='chat-explicit-approval',x
          for gate in ('repeatable-pass','provider-health-pass','rollback-defined'):
              assert e['evidence'][gate]['status']=='PASS',(gate,e)
          print('RADAR_ENABLED_HUMAN_APPROVAL_EVIDENCE=PASS')
          print('RADAR_ENABLED_TECHNICAL_GATES=PASS')
          PY

      - name: Assert Run Controller can now admit the adapter
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          r=json.load(open('dev-hub/config/provider-adapters.v1.json',encoding='utf-8'))
          a=r['adapters']['radar-runtime-adapter']
          assert a['status']=='ENABLED',a
          assert a['executable']=='/opt/chacha-dev/adapters/radar-runtime/current/radar-runtime-adapter',a
          assert set(a['supports'])=={'read','production-deploy'},a
          print('RADAR_RUNTIME_ADAPTER_STATUS=ENABLED')
          print('RADAR_RUNTIME_ADAPTER_EXECUTABLE_BOUND=PASS')
          PY
          grep -Fq 'adef.get("status") != "ENABLED"' dev-hub/bin/run-controller.py
          echo RADAR_RUN_CONTROLLER_ENABLEMENT_GATE=PASS

      - name: Validate rollback definition remains present
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          x=json.load(open('dev-hub/config/adapter-rollbacks.v1.json',encoding='utf-8'))
          r=x['adapters']['radar-runtime-adapter']
          assert r['enabled'] is True,r
          assert r['from_status']=='ENABLED',r
          assert r['target_status']=='DISABLED',r
          assert len(r['steps'])>=2,r
          assert len(r['verification'])>=1,r
          print('RADAR_ENABLED_ROLLBACK_DEFINED=PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: radar-runtime-adapter-enabled-materialization-${{ github.run_id }}
          path: |
            /tmp/enabled-report.json
            /tmp/enabled-receipt.json
          retention-days: 30
          if-no-files-found: error
