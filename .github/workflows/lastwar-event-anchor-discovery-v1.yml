name: Last War Event Anchor Discovery V1
on:
  push:
    branches: [lab-global-graphics-catalog-v31]
    paths:
      - 'scripts/lastwar-event-anchor-discovery-v1.py'
      - '.github/workflows/lastwar-event-anchor-discovery-v1.yml'
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan event/activity anchors
        run: python scripts/lastwar-event-anchor-discovery-v1.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/event-anchor-discovery-v1.json"
      - uses: actions/upload-artifact@v4
        with:
          name: lastwar-event-anchor-discovery-v1
          path: ${{ runner.temp }}/event-anchor-discovery-v1.json
          retention-days: 7
