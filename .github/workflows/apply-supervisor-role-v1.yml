name: Apply supervisor role v1

on:
  push:
    branches: [main]
    paths:
      - 'worker/migrations/0003_supervisor_sentinel_access.sql'
      - '.github/workflows/apply-supervisor-role-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Cloudflare account
        id: cf
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          token=os.environ['CF_API_TOKEN']
          if not token:
              raise SystemExit('MISSING_SECRET=CLOUDFLARE_API_TOKEN')
          req=urllib.request.Request('https://api.cloudflare.com/client/v4/accounts?per_page=50',headers={'Authorization':f'Bearer {token}'})
          with urllib.request.urlopen(req,timeout=20) as r:
              data=json.load(r)
          accounts=data.get('result') or []
          if not accounts:
              raise SystemExit('CLOUDFLARE_ACCOUNT_NOT_FOUND')
          account_id=accounts[0]['id']
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f'account_id={account_id}\n')
          print('CLOUDFLARE_ACCOUNT=RESOLVED')
          PY

      - name: Install Wrangler
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Apply D1 migrations
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        run: npx wrangler d1 migrations apply wfgg-db --remote

      - name: Verify OWNER and SUPERVISOR assignments
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        run: |
          npx wrangler d1 execute wfgg-db --remote --command "SELECT u.display_name,u.player_name,m.rank,sr.role FROM users u JOIN memberships m ON m.user_id=u.id JOIN system_roles sr ON sr.user_id=u.id WHERE sr.role IN ('OWNER','SUPERVISOR') ORDER BY CASE sr.role WHEN 'OWNER' THEN 0 ELSE 1 END,u.display_name" --json
