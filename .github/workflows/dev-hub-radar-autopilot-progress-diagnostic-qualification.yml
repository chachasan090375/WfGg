name: ChaCha DEV Radar Autopilot progress diagnostic qualification

on:
  push:
    branches: [dev-hub-v5-radar-cluster-quality-diagnostic-v1]
    paths:
      - 'dev-hub/adapters/radar-runtime-adapter.py'
      - 'dev-hub/tests/test_radar_runtime_adapter_contract.py'
      - 'dev-hub/config/adapter-provisioning.v1.json'
      - 'dev-hub/bin/run-radar-autopilot-progress-diagnostic-e2e.sh'
      - '.github/workflows/dev-hub-radar-autopilot-progress-diagnostic-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-hub-v5-radar-cluster-quality-diagnostic-v1

      - name: Validate adapter, tests and runner
        run: |
          set -euo pipefail
          python3 -m py_compile dev-hub/adapters/radar-runtime-adapter.py
          python3 dev-hub/tests/test_radar_runtime_adapter_contract.py
          bash -n dev-hub/bin/run-radar-autopilot-progress-diagnostic-e2e.sh
          echo RADAR_AUTOPILOT_PROGRESS_SYNTAX=PASS

      - name: Verify read-only contract
        run: |
          set -euo pipefail
          A=dev-hub/adapters/radar-runtime-adapter.py
          R=dev-hub/bin/run-radar-autopilot-progress-diagnostic-e2e.sh
          grep -Fq '"autopilot-progress-diagnostic": "read"' "$A"
          grep -Fq 'SELECT id,status' "$A"
          grep -Fq "LIKE '@federated:%'" "$A"
          grep -Fq 'time.sleep(8)' "$A"
          grep -Fq 'LASTWAR_CONTACT=NO' "$R"
          grep -Fq 'RADAR_PRODUCTION_MUTATION=NO' "$R"
          grep -Fq 'COLLECTOR_DATA_MUTATION=NO' "$R"
          ! grep -Eq 'pilot-open|pilot-install|production-deploy|autopilot/start|autopilot/stop' "$R"
          python3 - <<'PY'
          import json
          x=json.load(open('dev-hub/config/adapter-provisioning.v1.json',encoding='utf-8'))
          assert x['adapters']['radar-runtime-adapter']['version']=='1.5.3',x
          print('RADAR_RUNTIME_ADAPTER_VERSION=1.5.3')
          PY
          echo RADAR_AUTOPILOT_PROGRESS_READONLY=PASS

      - name: Verify ChaCha DEV governed path
        run: |
          set -euo pipefail
          R=dev-hub/bin/run-radar-autopilot-progress-diagnostic-e2e.sh
          grep -Fq 'project-control-cli.py' "$R"
          grep -Fq 'schedule --project' "$R"
          grep -Fq 'prepare-run --project' "$R"
          grep -Fq 'dispatch --project' "$R"
          grep -Fq 'PROJECT_CONTROL>SCHEDULER>RUN_CONTROLLER>RADAR_RUNTIME_ADAPTER' "$R"
          echo RADAR_AUTOPILOT_PROGRESS_GOVERNANCE=PASS
