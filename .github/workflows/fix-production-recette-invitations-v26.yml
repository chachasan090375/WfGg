name: Fix production recette invitations v26

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-production-recette-invitations-v26.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update invitation cache expectations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/production-recette.yml')
          s=p.read_text(encoding='utf-8')
          s=s.replace('portal-invitations-v1.js?v=001','portal-invitations-v1.js?v=002&v26=generic-r4r5-thanks')
          s=s.replace('portal-invitations-lastwar-safe-v1.js?v=003-alliance-notice','portal-invitations-lastwar-safe-v1.js?v=004-generic-r4r5-thanks')
          s=s.replace('WFGG_PAGES_DEV_INVITATIONS_ALLIANCE_V25=OK','WFGG_PAGES_DEV_INVITATIONS_ALLIANCE_V26=OK')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/production-recette.yml
          git diff --cached --check
          git commit -m 'test: align production recette with invitations v26'
          git push origin HEAD:main
