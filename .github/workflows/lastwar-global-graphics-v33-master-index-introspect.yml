name: Last War V33 master index introspection

on:
  push:
    branches: [lab-global-graphics-catalog-v33]
    paths:
      - '.github/workflows/lastwar-global-graphics-v33-master-index-introspect.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect master physical bundle record
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('frontend/lab/master-assets-v2/index/lastwar-graphics-master-index-v1.json')
          data=json.loads(p.read_text('utf-8'))
          print('COUNTS',data['counts'])
          for bid in [0,1,2,100,1000,15291]:
              b=data['bundles'][bid]
              print('\nBUNDLE',bid)
              print('logicalName',repr(b.get('logicalName')))
              print('aliasName',repr(b.get('aliasName')))
              print('preferredExtraction',json.dumps(b.get('preferredExtraction'),ensure_ascii=False,separators=(',',':')))
              print('locations',json.dumps(b.get('locations'),ensure_ascii=False,separators=(',',':'))[:12000])
          PY
