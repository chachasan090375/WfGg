name: LastWar isolated probe QA

on:
  workflow_dispatch:
  push:
    branches:
      - portal-auth-lastwar-lab-v1
    paths:
      - 'scripts/lastwar-termux-probe.sh'
      - 'scripts/lastwar-phase3-session-from-pcap.sh'
      - 'scripts/lastwar-phase4-login-diff.sh'
      - 'scripts/lastwar-phase5-native-template-login.sh'
      - 'scripts/lastwar-phase6-module-schema-export.sh'
      - '.github/workflows/lastwar-probe-qa.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WfGg preview branch
        uses: actions/checkout@v6

      - name: Validate shell syntax
        run: |
          bash -n scripts/lastwar-termux-probe.sh
          bash -n scripts/lastwar-phase3-session-from-pcap.sh
          bash -n scripts/lastwar-phase4-login-diff.sh
          bash -n scripts/lastwar-phase5-native-template-login.sh
          bash -n scripts/lastwar-phase6-module-schema-export.sh

      - name: Setup Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'

      - name: Reproduce local-only patches and build
        shell: bash
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/lastwar-client"
          git clone --quiet --filter=blob:none https://github.com/ljagiello/lastwar-client.git "$upstream"
          cd "$upstream"
          git fetch --quiet --depth 1 origin ee5f64de160a8051c2f9f98189b75038dd225a0a
          git checkout --quiet --detach ee5f64de160a8051c2f9f98189b75038dd225a0a
          git reset --quiet --hard ee5f64de160a8051c2f9f98189b75038dd225a0a

          auth_file="$upstream/internal/auth/login.go"
          tmp_file="$auth_file.wfgg.tmp"
          awk '
            {
              print
              if ($0 ~ /^[[:space:]]*result\.Account = msg2\.Params[[:space:]]*$/) {
                print "\tif snapshotPath := os.Getenv(\"WFGG_LASTWAR_SNAPSHOT_PATH\"); snapshotPath != \"\" {"
                print "\t\tif err := os.WriteFile(snapshotPath, []byte(msg2.Params.StringRedacted()+\"\\n\"), 0o600); err != nil {"
                print "\t\t\tslog.Warn(\"failed to write WfGg redacted Last War probe snapshot\", \"error\", err)"
                print "\t\t}"
                print "\t}"
              }
            }
          ' "$auth_file" > "$tmp_file"
          mv "$tmp_file" "$auth_file"
          grep -q 'WFGG_LASTWAR_SNAPSHOT_PATH' "$auth_file"

          identity_file="$upstream/internal/auth/identity.go"
          tmp_file="$identity_file.wfgg.tmp"
          awk '
            {
              if ($0 ~ /^[[:space:]]*return os\.Link\(tmpPath, path\)[[:space:]]*$/) {
                print "\tif err := os.Link(tmpPath, path); err == nil {"
                print "\t\treturn nil"
                print "\t}"
                print "\tf, err := os.OpenFile(path, os.O_WRONLY|os.O_CREATE|os.O_EXCL, 0o600)"
                print "\tif err != nil {"
                print "\t\treturn err"
                print "\t}"
                print "\tcleanupCreated := true"
                print "\tdefer func() {"
                print "\t\t_ = f.Close()"
                print "\t\tif cleanupCreated {"
                print "\t\t\t_ = os.Remove(path)"
                print "\t\t}"
                print "\t}()"
                print "\tif _, err := f.WriteString(id); err != nil {"
                print "\t\treturn err"
                print "\t}"
                print "\tif err := f.Sync(); err != nil {"
                print "\t\treturn err"
                print "\t}"
                print "\tif err := f.Close(); err != nil {"
                print "\t\treturn err"
                print "\t}"
                print "\tcleanupCreated = false"
                print "\treturn nil"
                next
              }
              print
            }
          ' "$identity_file" > "$tmp_file"
          mv "$tmp_file" "$identity_file"
          grep -q 'cleanupCreated := true' "$identity_file"

          gofmt -w "$auth_file" "$identity_file"
          GOTOOLCHAIN=auto go build -o "$RUNNER_TEMP/lastwar-client-probe" ./cmd/lastwar-client
          test -x "$RUNNER_TEMP/lastwar-client-probe"

      - name: Validate phase3 build-alignment logic
        run: |
          set -euo pipefail
          grep -q 'APP_VERSION=' scripts/lastwar-phase3-session-from-pcap.sh
          grep -q 'VERSION_CODE=' scripts/lastwar-phase3-session-from-pcap.sh
          grep -q 'Identité applicative alignée' scripts/lastwar-phase3-session-from-pcap.sh

      - name: Validate phase4 is local-only and redacted
        run: |
          set -euo pipefail
          grep -q 'Aucune connexion au serveur Last War' scripts/lastwar-phase4-login-diff.sh
          grep -q 'BuildLoginParams' scripts/lastwar-phase4-login-diff.sh
          grep -q 'DIFF masqué' scripts/lastwar-phase4-login-diff.sh

      - name: Validate phase5 is one-login read-only
        run: |
          set -euo pipefail
          grep -q 'native-template / lecture seule / local-only' scripts/lastwar-phase5-native-template-login.sh
          grep -q 'LOGIN_RESPONSE=OK' scripts/lastwar-phase5-native-template-login.sh
          grep -q 'INIT_RECEIVED=' scripts/lastwar-phase5-native-template-login.sh
          grep -q 'FRESH_DYNAMIC' scripts/lastwar-phase5-native-template-login.sh

      - name: Validate phase6 is offline module export
        run: |
          set -euo pipefail
          grep -q 'OFFLINE ONLY' scripts/lastwar-phase6-module-schema-export.sh
          grep -q 'WFGG_LASTWAR_MODULE_SCHEMA_V1' scripts/lastwar-phase6-module-schema-export.sh
          grep -q 'NetworkUsed: false' scripts/lastwar-phase6-module-schema-export.sh
          grep -q 'WFGG_LASTWAR_PHASE6_MODULE_SCHEMA.json' scripts/lastwar-phase6-module-schema-export.sh

      - name: Verify probes stay non-automating
        run: |
          set -euo pipefail
          grep -q -- '-list-buildings' scripts/lastwar-termux-probe.sh
          grep -q -- '-list-buildings' scripts/lastwar-phase3-session-from-pcap.sh
          for script in scripts/lastwar-termux-probe.sh scripts/lastwar-phase3-session-from-pcap.sh scripts/lastwar-phase4-login-diff.sh scripts/lastwar-phase5-native-template-login.sh scripts/lastwar-phase6-module-schema-export.sh; do
            if grep -Eq -- '(^|[[:space:]])-collect([[:space:]]|$)' "$script"; then
              echo "Forbidden gameplay automation flag found in $script" >&2
              exit 1
            fi
          done
