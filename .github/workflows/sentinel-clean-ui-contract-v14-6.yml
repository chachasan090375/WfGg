name: Sentinel clean UI contract v14.6

on:
  push:
    branches:
      - sentinel-clean-ui-contract-v14-6

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sentinel-clean-ui-contract-v14-6
          fetch-depth: 0
      - name: Apply Sentinel clean UI contract patch
        run: python3 .github/scripts/sentinel_clean_ui_contract_v14_6.py
      - name: Validate JavaScript and contract
        run: |
          node --check frontend/train-native/app.v15.js
          node --check frontend/train-native/sentinel-train-v1.js
          node --check frontend/_worker.js
          grep -Fq 'WFGG_SENTINEL_CLEAN_UI_CONTRACT_V14_6' frontend/train-native/app.v15.js
          grep -Fq "const VERSION = 'sentinel-train-v14.6';" frontend/train-native/sentinel-train-v1.js
          grep -Fq '/train/sentinel-train-v1.js?v=0146' frontend/_worker.js
          grep -Fq "pushSim('notification-wfgg-reset-prompt',true,'contrôle technique volontairement masqué" frontend/train-native/app.v15.js
          (cd frontend/train-native && sha256sum -c app.v15.js.sha256)
      - name: Commit tested production patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/train-native/app.v15.js frontend/train-native/app.v15.js.sha256 frontend/train-native/sentinel-train-v1.js frontend/_worker.js
          if git diff --cached --quiet; then
            echo 'No production changes to commit'
          else
            git commit -m 'fix(sentinel): align behavior simulation with clean alerts UI v14.6'
            git push origin HEAD:sentinel-clean-ui-contract-v14-6
          fi
