name: ChaCha DEV Radar V6.19.11 pilot runner qualification

on:
  push:
    branches: [dev-hub-v5-radar-v61911-pilot-runner]
    paths:
      - 'dev-hub/bin/run-radar-v61911-pilot-via-chacha-dev.sh'
      - '.github/workflows/dev-hub-radar-v61911-pilot-runner-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chacha-dev-radar-v61911-pilot-runner
  cancel-in-progress: true

env:
  APPROVED_CANDIDATE_REV: cbf67e46308e925f1ba5fad0be3f58764231935d
  PILOT_REV: 895f288e6f8bd18486b02b022b9ecbef9d3102ab
  EXPECTED_CONNECTOR_SHA256: 4d66709f10d3a6b27ac255a1dfdc62e51d2817652634409ffe2edc071762c69f
  EXPECTED_NATIVE_SHA256: 274d040f5294cb09422e5d55cc4b5335ac7739924c33dcb67b3f279645814900

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-hub-v5-radar-v61911-pilot-runner
          fetch-depth: 0

      - name: Verify ChaCha DEV runtime adapter baseline
        run: |
          set -euo pipefail
          python3 -m py_compile             dev-hub/adapters/radar-runtime-adapter.py             dev-hub/bin/project-control-cli.py             dev-hub/bin/project-control.py             dev-hub/bin/execution-scheduler.py             dev-hub/bin/run-controller.py             dev-hub/bin/external-runtime-dispatch.py
          python3 dev-hub/tests/test_radar_runtime_adapter_contract.py
          grep -Fq '"status": "ENABLED"' dev-hub/config/provider-adapters.v1.json
          grep -Fq '/opt/chacha-dev/adapters/radar-runtime/current/radar-runtime-adapter' dev-hub/config/provider-adapters.v1.json
          echo RADAR_V61911_CHACHA_BASELINE=PASS

      - name: Verify approved candidate to immutable pilot bundle scope
        run: |
          set -euo pipefail
          git fetch --no-tags origin radar-v61911-manual-search-stop
          git cat-file -e "$APPROVED_CANDIDATE_REV^{commit}"
          git cat-file -e "$PILOT_REV^{commit}"
          git merge-base --is-ancestor "$APPROVED_CANDIDATE_REV" "$PILOT_REV"

          git diff --name-only "$APPROVED_CANDIDATE_REV" "$PILOT_REV" > /tmp/v61911-diff.txt
          cat /tmp/v61911-diff.txt
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/radar-v61911-pilot-publication-qualification.yml|              radar-vps/install-v61911-pilot.sh|              radar-vps/probe-v61911-pilot-runtime.sh|              radar-vps/pilot-v61911/*|              radar-vps/pilot-v61911/cloudflare/*)
                ;;
              *)
                echo "UNAPPROVED_BEHAVIOR_PATH=$path"
                exit 1
                ;;
            esac
          done < /tmp/v61911-diff.txt

          ! git diff --name-only "$APPROVED_CANDIDATE_REV" "$PILOT_REV" | grep -Eq '^\.github/scripts/patch-radar-manual-search-stop-v61911\.py$'
          echo RADAR_V61911_APPROVAL_SCOPE_INHERITANCE=PASS

      - name: Verify immutable pilot artifacts and guard probe
        run: |
          set -euo pipefail
          mkdir -p /tmp/v61911-pilot
          git show "$PILOT_REV:radar-vps/install-v61911-pilot.sh" > /tmp/v61911-pilot/install.sh
          git show "$PILOT_REV:radar-vps/probe-v61911-pilot-runtime.sh" > /tmp/v61911-pilot/probe.sh
          git show "$PILOT_REV:radar-vps/pilot-v61911/PILOT_INFO.txt" > /tmp/v61911-pilot/PILOT_INFO.txt
          git show "$PILOT_REV:radar-vps/pilot-v61911/SHA256SUMS" > /tmp/v61911-pilot/SHA256SUMS

          bash -n /tmp/v61911-pilot/install.sh
          bash -n /tmp/v61911-pilot/probe.sh

          grep -Fq 'WFGG_RADAR_V6191_REV' /tmp/v61911-pilot/install.sh
          grep -Fq "$EXPECTED_CONNECTOR_SHA256  radar-connector" /tmp/v61911-pilot/SHA256SUMS
          grep -Fq 'WFGG_RADAR_PILOT=V6.19.11' /tmp/v61911-pilot/PILOT_INFO.txt
          grep -Fq 'LASTWAR_MODE=READ_ONLY' /tmp/v61911-pilot/PILOT_INFO.txt
          grep -Fq 'GAME_SCAN_GUARD_PROBE=NO' /tmp/v61911-pilot/PILOT_INFO.txt
          grep -Fq 'TOKEN_PERSISTENCE=NO' /tmp/v61911-pilot/PILOT_INFO.txt
          grep -Fq 'PRODUCTION_DEPLOYMENT=NO' /tmp/v61911-pilot/PILOT_INFO.txt
          grep -Fq 'RADAR_V61911_RUNTIME_PROBE=PASS' /tmp/v61911-pilot/probe.sh
          grep -Fq 'RADAR_V61911_GAME_SCAN_EXECUTED=NO' /tmp/v61911-pilot/probe.sh
          grep -Fq 'RADAR_V61911_COLLECTOR_MUTATION=NO' /tmp/v61911-pilot/probe.sh
          grep -Fq 'RADAR_V61911_TOKEN_READ=NO' /tmp/v61911-pilot/probe.sh
          ! grep -Fq 'request("POST","/v1/collector/search",' /tmp/v61911-pilot/probe.sh
          ! grep -Fq '/v1/collector/autopilot/start' /tmp/v61911-pilot/probe.sh
          echo RADAR_V61911_IMMUTABLE_PILOT_GUARD=PASS

      - name: Verify governed runner scope
        run: |
          set -euo pipefail
          R=dev-hub/bin/run-radar-v61911-pilot-via-chacha-dev.sh
          bash -n "$R"
          grep -Fq 'APPROVED_CANDIDATE_REV="cbf67e46308e925f1ba5fad0be3f58764231935d"' "$R"
          grep -Fq 'PILOT_REV="895f288e6f8bd18486b02b022b9ecbef9d3102ab"' "$R"
          grep -Fq 'CONNECTOR_SHA="4d66709f10d3a6b27ac255a1dfdc62e51d2817652634409ffe2edc071762c69f"' "$R"
          grep -Fq 'NATIVE_SHA="274d040f5294cb09422e5d55cc4b5335ac7739924c33dcb67b3f279645814900"' "$R"
          grep -Fq '"action":"pilot-open"' "$R"
          grep -Fq '"action":"pilot-install"' "$R"
          grep -Fq '"action":"pilot-probe"' "$R"
          grep -Fq '"action":"pilot-close"' "$R"
          grep -Fq 'RADAR_V61911_GAME_SCAN_EXECUTED=NO' "$R"
          grep -Fq 'RADAR_V61911_LASTWAR_MODE=READ_ONLY' "$R"
          grep -Fq 'RADAR_V61911_TOKEN_PERSISTENCE=NO' "$R"
          grep -Fq 'RADAR_V61911_PRODUCTION_PROMOTION=NO' "$R"
          grep -Fq 'PROJECT_CONTROL>SCHEDULER>RUN_CONTROLLER>RADAR_RUNTIME_ADAPTER' "$R"
          ! grep -Fq '/v1/collector/search"' "$R"
          ! grep -Fq '/v1/collector/autopilot/start' "$R"
          echo RADAR_V61911_CHACHA_RUNNER=PASS
