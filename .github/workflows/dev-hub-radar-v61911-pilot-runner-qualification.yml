name: ChaCha DEV Radar V6.19.11 Manual Search Stop pilot runner qualification

on:
  push:
    branches: [dev-hub-radar-v61911-pilot-runner]
    paths:
      - 'dev-hub/bin/run-radar-v61911-pilot-via-chacha-dev.sh'
      - 'dev-hub/projects/wfgg-radar/project-intent.v1.json'
      - '.github/workflows/dev-hub-radar-v61911-pilot-runner-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  APPROVED_REV: cbf67e46308e925f1ba5fad0be3f58764231935d
  PILOT_REV: 759bfb3fe4620f544cc84fdea34e54bfa3efbdcf
  EXPECTED_CONNECTOR_SHA256: 4d66709f10d3a6b27ac255a1dfdc62e51d2817652634409ffe2edc071762c69f
  EXPECTED_NATIVE_SHA256: 274d040f5294cb09422e5d55cc4b5335ac7739924c33dcb67b3f279645814900

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-hub-radar-v61911-pilot-runner

      - name: Validate governed runner
        run: |
          set -euo pipefail
          R=dev-hub/bin/run-radar-v61911-pilot-via-chacha-dev.sh
          bash -n "$R"
          grep -Fq 'APPROVED_REV="cbf67e46308e925f1ba5fad0be3f58764231935d"' "$R"
          grep -Fq 'PILOT_REV="759bfb3fe4620f544cc84fdea34e54bfa3efbdcf"' "$R"
          grep -Fq 'PILOT_BRANCH="radar-v61911-manual-search-stop"' "$R"
          grep -Fq 'CONNECTOR_SHA="4d66709f10d3a6b27ac255a1dfdc62e51d2817652634409ffe2edc071762c69f"' "$R"
          grep -Fq 'NATIVE_SHA="274d040f5294cb09422e5d55cc4b5335ac7739924c33dcb67b3f279645814900"' "$R"
          grep -Fq 'radar-vps/install-v61911-pilot.sh' "$R"
          grep -Fq 'radar-vps/probe-v61911-pilot-runtime.sh' "$R"
          grep -Fq 'RADAR_V61911_GAME_SCAN_EXECUTED=NO' "$R"
          grep -Fq 'RADAR_V61911_COLLECTOR_MUTATION=NO' "$R"
          grep -Fq 'RADAR_V61911_STOP_SCOPE=MANUAL_SEARCH_ONLY' "$R"
          grep -Fq 'RADAR_V61911_CHACHA_DEPLOY=PASS' "$R"
          echo RADAR_V61911_CHACHA_RUNNER=PASS

      - name: Validate project intent
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          x=json.load(open('dev-hub/projects/wfgg-radar/project-intent.v1.json',encoding='utf-8'))
          assert x['current_change']['id']=='radar-v61911-manual-search-stop',x
          assert x['current_change']['pilot_only'] is True,x
          assert x['current_change']['rollback_required'] is True,x
          criteria='\n'.join(x.get('acceptance_criteria') or [])
          assert 'POST /v1/collector/search/stop' in criteria,criteria
          assert 'Last War scan' in criteria,criteria
          assert 'no Collector mutation' in criteria,criteria
          assert 'Production promotion or deployment requires a separate explicit human approval.' in criteria,criteria
          print('RADAR_V61911_PROJECT_INTENT=PASS')
          PY

      - name: Validate pinned pilot assets
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/chachasan090375/WfGg/$PILOT_REV"
          mkdir -p /tmp/v61911
          for f in radar-vps/pilot-v61911/SHA256SUMS radar-vps/pilot-v61911/PILOT_INFO.txt radar-vps/pilot-v61911/radar-connector radar-vps/install-v61911-pilot.sh radar-vps/probe-v61911-pilot-runtime.sh; do
            curl -fsSL "$BASE/$f" -o "/tmp/v61911/$(basename "$f")"
          done
          grep -Fq 'WFGG_RADAR_PILOT=V6.19.11' /tmp/v61911/PILOT_INFO.txt
          grep -Fq 'MANUAL_SEARCH_STOP=YES' /tmp/v61911/PILOT_INFO.txt
          grep -Fq 'STOP_SCOPE=MANUAL_SEARCH_ONLY' /tmp/v61911/PILOT_INFO.txt
          grep -Fq 'LASTWAR_MODE=READ_ONLY' /tmp/v61911/PILOT_INFO.txt
          grep -Fq 'GAME_SCAN_GUARD_PROBE=NO' /tmp/v61911/PILOT_INFO.txt
          grep -Fq 'TOKEN_PERSISTENCE=NO' /tmp/v61911/PILOT_INFO.txt
          grep -Fq 'PRODUCTION_DEPLOYMENT=NO' /tmp/v61911/PILOT_INFO.txt
          (
            cd /tmp/v61911
            sha256sum -c SHA256SUMS
          )
          test "$(sha256sum /tmp/v61911/radar-connector | awk '{print $1}')" = "$EXPECTED_CONNECTOR_SHA256"
          bash -n /tmp/v61911/install-v61911-pilot.sh
          bash -n /tmp/v61911/probe-v61911-pilot-runtime.sh
          grep -Fq 'RADAR_V61911_RUNTIME_PROBE=PASS' /tmp/v61911/probe-v61911-pilot-runtime.sh
          grep -Fq 'RADAR_V61911_GAME_SCAN_EXECUTED=NO' /tmp/v61911/probe-v61911-pilot-runtime.sh
          grep -Fq 'RADAR_V61911_COLLECTOR_MUTATION=NO' /tmp/v61911/probe-v61911-pilot-runtime.sh
          grep -Fq 'RADAR_V61911_TOKEN_READ=NO' /tmp/v61911/probe-v61911-pilot-runtime.sh
          ! grep -Fq 'request("POST","/v1/collector/search",' /tmp/v61911/probe-v61911-pilot-runtime.sh
          ! grep -Fq '/v1/collector/autopilot/start' /tmp/v61911/probe-v61911-pilot-runtime.sh
          echo RADAR_V61911_PINNED_PILOT_ASSETS=PASS

      - name: Verify one-shot approval contract
        run: |
          set -euo pipefail
          R=dev-hub/bin/run-radar-v61911-pilot-via-chacha-dev.sh
          grep -Fq 'J’approuve le PILOT Radar V6.19.11 Manual Search Stop révision cbf67e46308e925f1ba5fad0be3f58764231935d, avec probe de garde sans scan Last War, Last War strictement READ-ONLY, aucune persistance de token et aucune promotion/déploiement production.' "$R"
          grep -Fq '"revision":"cbf67e46308e925f1ba5fad0be3f58764231935d"' "$R"
          grep -Fq '"artifact_revision":"759bfb3fe4620f544cc84fdea34e54bfa3efbdcf"' "$R"
          grep -Fq 'PRODUCTION_RELEASE_APPROVAL_REVOKED=PASS' "$R"
          grep -Fq 'RADAR_V61911_PILOT_WINDOW_CLOSED=YES' "$R"
          echo RADAR_V61911_ONE_SHOT_APPROVAL=PASS
