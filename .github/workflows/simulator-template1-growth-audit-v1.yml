name: Simulator template 1 growth audit v1

on:
  push:
    branches: [simulator-standalone-v1]
    paths: ['.github/workflows/simulator-template1-growth-audit-v1.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simulator-standalone-v1
          fetch-depth: 0
      - name: Extract current template 1 curve
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lw/xapk /tmp/lw simulator/research
          curl -fL --retry 2 --connect-timeout 20 --max-time 900 'https://d.apkpure.net/b/XAPK/com.fun.lastwar.gp?versionCode=1864' -o /tmp/lw/current.xapk
          python3 - <<'PY'
          import json,zipfile,pathlib,re,subprocess,tempfile,hashlib
          root=pathlib.Path('/tmp/lw'); p=root/'current.xapk'
          with zipfile.ZipFile(p) as z:
              mans=[n for n in z.namelist() if pathlib.PurePosixPath(n).name.lower() in ('manifest.json','xapk_manifest.json')]
              d=json.loads(z.read(mans[0]).decode('utf-8','replace'))
          if (str(d.get('package_name') or d.get('packageName') or d.get('package') or ''),str(d.get('version_name') or d.get('versionName') or ''),str(d.get('version_code') or d.get('versionCode') or ''))!=('com.fun.lastwar.gp','1.0.359','1864'): raise SystemExit('Unexpected client metadata')
          subprocess.run(['unzip','-q',str(p),'-d',str(root/'xapk')],check=True)
          table=None; meta=None
          for apk in sorted((root/'xapk').rglob('*.apk'),key=lambda x:x.stat().st_size,reverse=True):
              try:
                  with zipfile.ZipFile(apk) as z:
                      tn=next((n for n in z.namelist() if re.search(r'(^|/)assets/table/table_.*\.data$',n,re.I)),None)
                      if tn:
                          table=z.read(tn); meta={'apk':apk.name,'path':tn,'bytes':len(table),'md5':hashlib.md5(table).hexdigest(),'sha256':hashlib.sha256(table).hexdigest()}; break
              except zipfile.BadZipFile: pass
          if table is None: raise SystemExit('DataTable not found')
          (root/'table.data').write_bytes(table); (root/'source.json').write_text(json.dumps(meta,indent=2)+'\n')
          PY
          if ! command -v lua5.3 >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq lua5.3; fi
          git clone --depth=1 https://github.com/HansWessels/unluac.git /tmp/unluac >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/unluac/src/unluac/parse/LHeaderType.java'); s=p.read_text(); s=s.replace('if(format != 0) {','if(format != 0 && format != 1) {',1)
          marker='class LHeaderType53 extends LHeaderType {'; pos=s.index(marker); head,tail=s[:pos],s[pos:]; old='    parse_instruction_size(buffer, header, s);'
          if old not in tail: raise SystemExit('Lua53 instruction size call not found')
          p.write_text(head+tail.replace(old,'    if(s.format != 1) parse_instruction_size(buffer, header, s);',1))
          PY
          (cd /tmp/unluac && bash build.sh >/dev/null)
          python3 - <<'PY'
          import pathlib,zipfile,subprocess,tempfile
          root=pathlib.Path('/tmp/lw'); jar='/tmp/unluac/bin/unluac.jar'
          with zipfile.ZipFile(root/'table.data') as z: raw=z.read('lw_template_property')
          with tempfile.NamedTemporaryFile(suffix='.luac') as f:
              f.write(raw); f.flush(); cp=subprocess.run(['java','-jar',jar,f.name],stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,timeout=45)
          if cp.returncode: raise SystemExit(cp.stderr[-500:])
          (root/'lw_template_property.lua').write_text(cp.stdout)
          PY
          cat >/tmp/lw/dump.lua <<'LUA'
          local function dense(t) local n=0 for k,_ in pairs(t) do if type(k)~='number' or k<1 or math.floor(k)~=k then return false,0 end if k>n then n=k end end for i=1,n do if rawget(t,i)==nil then return false,n end end return true,n end
          local function esc(s) return (s:gsub('\\','\\\\'):gsub('"','\\"'):gsub('\n','\\n'):gsub('\r','\\r'):gsub('\t','\\t')) end
          local function enc(v,d,seen) d=d or 0 seen=seen or {} local ty=type(v) if ty=='nil' then return 'null' elseif ty=='number' then return tostring(v) elseif ty=='boolean' then return v and 'true' or 'false' elseif ty=='string' then return '"'..esc(v)..'"' end if ty~='table' or d>12 or seen[v] then return 'null' end seen[v]=true local a,n=dense(v) local p={} if a then for i=1,n do p[#p+1]=enc(v[i],d+1,seen) end seen[v]=nil return '['..table.concat(p,',')..']' end local ks={} for k,_ in pairs(v) do ks[#ks+1]=k end table.sort(ks,function(a,b)return tostring(a)<tostring(b)end) for _,k in ipairs(ks) do p[#p+1]='"'..esc(tostring(k))..'":'..enc(v[k],d+1,seen) end seen[v]=nil return '{'..table.concat(p,',')..'}' end
          local ok,T=pcall(dofile,arg[1]); if not ok then io.stderr:write(tostring(T)..'\n'); os.exit(2) end print(enc(T))
          LUA
          python3 - <<'PY'
          import json,pathlib,subprocess
          root=pathlib.Path('/tmp/lw'); source=json.loads((root/'source.json').read_text())
          cp=subprocess.run(['lua5.3','/tmp/lw/dump.lua',str(root/'lw_template_property.lua')],stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,timeout=45)
          if cp.returncode: raise SystemExit(cp.stderr[-500:])
          T=json.loads(cp.stdout); idx=T['index']; data=T['data']
          fields={n:int(v[0]) for n,v in idx.items() if isinstance(v,list) and v}
          def val(row,pos):
              if isinstance(row,list): return row[pos-1] if pos-1<len(row) else None
              return row.get(str(pos)) if isinstance(row,dict) else None
          items=list(data.items()) if isinstance(data,dict) else [(i+1,r) for i,r in enumerate(data)]
          rows=[]
          for key,row in items:
              rec={n:val(row,p) for n,p in fields.items()}
              if rec.get('type')==1 and isinstance(rec.get('level'),(int,float)) and 1<=int(rec['level'])<=175:
                  rows.append({'level':int(rec['level']),'hp':float(rec['base_hp']),'attack':float(rec['base_patk']),'defense':float(rec['base_pdef'])})
          rows.sort(key=lambda r:r['level'])
          levels=[r['level'] for r in rows]
          if levels!=list(range(1,176)): raise SystemExit(f'Template1 levels incomplete: first={levels[:3]} last={levels[-3:]} count={len(levels)}')
          by={r['level']:r for r in rows}
          out={'source':source,'templateId':1,'levelRange':[1,175],'rowCount':175,'checkpoints':{str(k):by[k] for k in (1,50,100,150,174,175)},'rows':rows,'note':'Native template 1 level curve only; hero-specific base scaling still applies.'}
          p=pathlib.Path('simulator/research/template1-growth-audit.v1.json'); p.write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps({'rowCount':len(rows),'checkpoints':out['checkpoints'],'bytes':p.stat().st_size},indent=2))
          PY
      - name: Commit template 1 curve
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add simulator/research/template1-growth-audit.v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'simulator: capture template 1 hero growth curve'
          git fetch origin simulator-standalone-v1
          git rebase origin/simulator-standalone-v1
          git push origin HEAD:simulator-standalone-v1
