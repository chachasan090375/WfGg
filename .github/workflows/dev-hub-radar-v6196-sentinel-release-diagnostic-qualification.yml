name: ChaCha DEV Radar V6.19.6 Sentinel release diagnostic qualification

on:
  push:
    branches: [dev-hub-v5-radar-cluster-quality-diagnostic-v1]
    paths:
      - 'dev-hub/adapters/radar-runtime-adapter.py'
      - 'dev-hub/tests/test_radar_runtime_adapter_contract.py'
      - 'dev-hub/config/adapter-provisioning.v1.json'
      - 'dev-hub/bin/run-radar-v6196-sentinel-release-diagnostic-e2e.sh'
      - '.github/workflows/dev-hub-radar-v6196-sentinel-release-diagnostic-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-hub-v5-radar-cluster-quality-diagnostic-v1

      - name: Validate read-only Sentinel diagnostic contract
        run: |
          set -euo pipefail
          A=dev-hub/adapters/radar-runtime-adapter.py
          T=dev-hub/tests/test_radar_runtime_adapter_contract.py
          R=dev-hub/bin/run-radar-v6196-sentinel-release-diagnostic-e2e.sh
          python3 -m py_compile "$A"
          python3 "$T"
          bash -n "$R"
          grep -Fq '"sentinel-release-diagnostic": "read"' "$A"
          grep -Fq 'RADAR_SENTINEL_RELEASE_DIAGNOSTIC_OK' "$A"
          grep -Fq '"runtime_mutation": False' "$A"
          grep -Fq '"game_scan_executed": False' "$A"
          grep -Fq '"collector_mutation": False' "$A"
          grep -Fq 'c5a5b0f6acda2870f2567be7e43d48fcb9af05c4' "$R"
          grep -Fq 'b7ff60476f3afe7c8bcb9b78963c46daa4e8b5507490cc83cbcbc4ced63e7c35' "$R"
          grep -Fq '274d040f5294cb09422e5d55cc4b5335ac7739924c33dcb67b3f279645814900' "$R"
          grep -Fq "'permission':'read'" "$R"
          grep -Fq "'action':'sentinel-release-diagnostic'" "$R"
          grep -Fq 'RADAR_PRODUCTION_MUTATION=NO' "$R"
          grep -Fq 'LASTWAR_CONTACT=NO' "$R"
          grep -Fq 'RADAR_V6196_SENTINEL_DIAGNOSTIC_E2E=PASS' "$R"
          echo RADAR_V6196_SENTINEL_RELEASE_DIAGNOSTIC=QUALIFIED
