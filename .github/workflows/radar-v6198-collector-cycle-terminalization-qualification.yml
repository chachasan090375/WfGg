name: Radar V6.19.8 Collector cycle terminalization qualification

on:
  push:
    branches: [radar-v6198-collector-cycle-terminalization]
    paths:
      - '.radar-release-src/v6198-source/**'
      - '.github/scripts/patch-radar-collector-cycle-terminalization-v6198.py'
      - '.github/scripts/patch-live-radar-autopilot-v6198.py'
      - '.github/workflows/radar-v6198-collector-cycle-terminalization-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wfgg-radar-v6198-terminalization
  cancel-in-progress: true

env:
  EXPECTED_NATIVE_SHA256: 274d040f5294cb09422e5d55cc4b5335ac7739924c33dcb67b3f279645814900

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-v6198-collector-cycle-terminalization

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Reconstruct cumulative V6.19.8 candidate
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar
          mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          echo '234df1dec57f6211bc625855bf13350c9f17fbd843fbe92d8cf1ab7cb5c081ef  /tmp/radar-src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar
          rm -rf /tmp/wfgg-radar/connector-go
          cp -a .radar-release-src/v2-source/connector-go /tmp/wfgg-radar/connector-go

          python3 .github/scripts/patch-radar-target-profile-retry.py
          python3 .github/scripts/patch-radar-federated-diagnostics-v65.py
          python3 .github/scripts/patch-player-scan-v3.py
          python3 .github/scripts/patch-player-scan-v4.py
          python3 .github/scripts/patch-radar-protocol-discovery-v67.py
          python3 .github/scripts/patch-radar-profile-isolation-v68.py
          python3 .github/scripts/patch-radar-native-profile-v69.py
          python3 .github/scripts/patch-radar-native-profile-handshake-v691.py
          python3 .github/scripts/patch-radar-native-profile-exec-v692.py
          python3 .github/scripts/patch-radar-connector-runtime-v693.py
          python3 .github/scripts/patch-radar-cluster-catalog-budget-v6192.py
          python3 .github/scripts/patch-radar-seed-scout-v6193.py
          python3 .github/scripts/patch-radar-autopilot-v6194.py
          python3 .github/scripts/patch-radar-autopilot-stale-cycle-v6197.py
          python3 .github/scripts/patch-radar-collector-cycle-terminalization-v6198.py

          install -m 0644 .radar-release-src/v2-source/src/game/remote-transport.js /tmp/wfgg-radar/src/game/remote-transport.js
          python3 .github/scripts/patch-radar-async-collector-worker.py
          python3 .github/scripts/patch-radar-worker-rich-profile-v6191.py
          python3 .github/scripts/patch-radar-worker-seed-scout-v6193.py
          python3 .github/scripts/patch-radar-worker-autopilot-v6194.py

          install -m 0644 radar-ui-live/live-radar.html /tmp/wfgg-radar/public/live-radar.html
          python3 .github/scripts/patch-live-radar-seed-scout-v6193.py
          python3 .github/scripts/patch-live-radar-autopilot-v6194.py
          python3 .github/scripts/patch-radar-session-keepalive-v6195.py
          python3 .github/scripts/patch-live-radar-autopilot-v6196.py
          python3 .github/scripts/patch-live-radar-autopilot-v6197.py
          python3 .github/scripts/patch-live-radar-autopilot-v6198.py

          grep -Fq 'WFGG_RADAR_COLLECTOR_CYCLE_TERMINALIZATION_V6198' /tmp/wfgg-radar/connector-go/cmd/radar-connector/collector_cycle_terminalization_v6198.go
          grep -Fq 'WFGG_RADAR_COLLECTOR_CYCLE_TERMINALIZATION_CALLSITE_V6198' /tmp/wfgg-radar/connector-go/cmd/radar-connector/collector_jobs.go
          grep -Fq 'WFGG_RADAR_COLLECTOR_CYCLE_TERMINALIZATION_V6198' /tmp/wfgg-radar/connector-go/cmd/radar-connector/server_autopilot_v6194.go
          grep -Fq 'WFGG_RADAR_COLLECTOR_CYCLE_TERMINALIZATION_UI_V6198' /tmp/wfgg-radar/public/live-radar.html
          echo RADAR_V6198_RECONSTRUCT=PASS

      - name: Test, vet and build connector
        working-directory: /tmp/wfgg-radar/connector-go
        run: |
          set -euo pipefail
          gofmt -w ./cmd ./internal
          go test ./...
          go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o /tmp/radar-connector-v6198 ./cmd/radar-connector
          actual="$(sha256sum /tmp/radar-connector-v6198 | awk '{print $1}')"
          echo "RADAR_V6198_CONNECTOR_SHA256=$actual"
          grep -aFq 'v6.19.8' /tmp/radar-connector-v6198
          grep -aFq 'COLLECTOR_CYCLE_TERMINALIZATION_FAILED' /tmp/radar-connector-v6198
          grep -aFq 'STALE_RUNNING_CYCLE_RECOVERED_V6197' /tmp/radar-connector-v6198
          grep -aFq 'SEED_SKIPPED_NO_DATA' /tmp/radar-connector-v6198
          echo RADAR_V6198_CONNECTOR=PASS

      - name: Verify cycle terminalization safety contract
        run: |
          set -euo pipefail
          C=/tmp/wfgg-radar/connector-go/cmd/radar-connector/collector_cycle_terminalization_v6198.go
          J=/tmp/wfgg-radar/connector-go/cmd/radar-connector/collector_jobs.go
          A=/tmp/wfgg-radar/connector-go/cmd/radar-connector/server_autopilot_v6194.go
          grep -Fq 'collectorTerminalizationAttemptsV6198 = 12' "$C"
          grep -Fq 'collectorFinishCycleReliableV6198' "$C"
          grep -Fq 'collectorCycleTerminalStateV6198' "$C"
          grep -Fq 'finishFailedV6198 := func(' "$J"
          grep -Fq 'MAP_INGEST_FAILED_CYCLE_TERMINALIZATION_FAILED' "$J" || grep -Fq 'code+"_CYCLE_TERMINALIZATION_FAILED"' "$J"
          grep -Fq 'collectorFinishCycleReliableV6198(cycle.ID, "SUCCESS", "")' "$J"
          grep -Eq 'autopilotVersionV6194[[:space:]]*=[[:space:]]*"v6\.19\.8"' "$A"
          echo RADAR_V6198_TERMINALIZATION_RETRY=PASS
          echo RADAR_V6198_TERMINAL_STATE_VERIFICATION=PASS

      - name: Verify regression invariants
        run: |
          set -euo pipefail
          A=/tmp/wfgg-radar/connector-go/cmd/radar-connector/server_autopilot_v6194.go
          U=/tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'AUTOPILOT_CONSECUTIVE_FAILURE_LIMIT' "$A"
          grep -Fq 'AUTOPILOT_AUTH_FAILED' "$A"
          grep -Fq 'AUTOPILOT_NO_DATA' "$A"
          grep -Fq 'SEED_SKIPPED_NO_DATA' "$A"
          grep -Fq 'AUTOPILOT V6.19.8 · ARRÊTÉ' "$U"
          grep -Fq 'AUTO 12H' "$U"
          grep -Fq '/api/auth/session/refresh' /tmp/wfgg-radar/src/worker.js
          echo RADAR_V6198_V6197_STALE_RECOVERY_REGRESSION=PASS
          echo RADAR_V6198_V6196_NO_DATA_REGRESSION=PASS
          echo RADAR_V6198_V6195_KEEPALIVE_REGRESSION=PASS

      - name: Verify unchanged native helper and Last War read-only safety
        run: |
          set -euo pipefail
          actual="$(sha256sum radar-vps/release/radar-native-template | awk '{print $1}')"
          test "$actual" = "$EXPECTED_NATIVE_SHA256"
          ! grep -REiq 'building\.production\.collect|mail\.reward|al\.science\.donate|visitor\.operate|march|attack|purchase'             .radar-release-src/v2-source/connector-go .radar-release-src/v6194-source .radar-release-src/v6197-source .radar-release-src/v6198-source
          echo "RADAR_V6198_NATIVE_SHA256=$actual"
          echo RADAR_V6198_NATIVE_CHANGE=NO
          echo RADAR_V6198_LASTWAR_MUTATION=NO
          echo RADAR_V6198_COLLECTOR_MUTATION=TERMINALIZATION_ONLY
