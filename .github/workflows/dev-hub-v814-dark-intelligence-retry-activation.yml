name: ChaCha DEV V8.0.14 Dark Intelligence Retry Activation

on:
  push:
    branches:
      - dev-hub-v814-dark-intelligence-retry-activation
    paths:
      - 'dev-hub/systemd/chacha-dev-dark-intelligence-analysis-retry.service'
      - 'dev-hub/systemd/chacha-dev-dark-intelligence-analysis-retry.timer'
      - 'dev-hub/systemd/chacha-dev-dark-intelligence-corroboration-retry.service'
      - 'dev-hub/systemd/chacha-dev-dark-intelligence-corroboration-retry.timer'
      - 'dev-hub/bin/install-v814-dark-intelligence-retry-activation.sh'
      - 'dev-hub/tests/test_v814_dark_intelligence_retry_activation.py'
      - '.github/workflows/dev-hub-v814-dark-intelligence-retry-activation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Shell and unit syntax
        run: |
          set -euo pipefail
          bash -n dev-hub/bin/install-v814-dark-intelligence-retry-activation.sh
          systemd-analyze verify             dev-hub/systemd/chacha-dev-dark-intelligence-analysis-retry.service             dev-hub/systemd/chacha-dev-dark-intelligence-analysis-retry.timer             dev-hub/systemd/chacha-dev-dark-intelligence-corroboration-retry.service             dev-hub/systemd/chacha-dev-dark-intelligence-corroboration-retry.timer
      - name: V8.0.14 qualification
        run: |
          set -euo pipefail
          python3 dev-hub/tests/test_v814_dark_intelligence_retry_activation.py | tee /tmp/v814.out
          grep -Fq 'CHACHA_DEV_V814_VALID_SYSTEMD_UNITS=PASS' /tmp/v814.out
          grep -Fq 'CHACHA_DEV_V814_RETRY_LIMIT_TWO=PASS' /tmp/v814.out
          grep -Fq 'CHACHA_DEV_V814_TIMER_15_MINUTES=PASS' /tmp/v814.out
          grep -Fq 'CHACHA_DEV_V814_TRANSACTIONAL_UNIT_ROLLBACK=PASS' /tmp/v814.out
          grep -Fq 'CHACHA_DEV_V814_SYSTEMD_ANALYZE_VERIFY=PASS' /tmp/v814.out
          grep -Fq 'CHACHA_DEV_V814_AUTOMATIC_EXTERNAL_SPEND_EUR=0' /tmp/v814.out
      - name: Preserve V8.0.1 Dark Intelligence guarantees
        run: |
          set -euo pipefail
          python3 dev-hub/tests/test_v801_isolated_dark_intelligence_collector.py | tee /tmp/v801.out
          grep -Fq 'CHACHA_DEV_V801_RETRY_LOOP_BOUNDED=PASS' /tmp/v801.out
          grep -Fq 'CHACHA_DEV_V801_CORROBORATION_RETRY_NO_RECOLLECTION=PASS' /tmp/v801.out
          grep -Fq 'CHACHA_DEV_V801_AUTOMATIC_EXTERNAL_SPEND_EUR=0' /tmp/v801.out
