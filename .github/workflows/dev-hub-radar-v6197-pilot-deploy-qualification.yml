name: ChaCha DEV Radar V6.19.7 pilot deploy qualification

on:
  push:
    branches: [dev-hub-v5-radar-cluster-quality-diagnostic-v1]
    paths:
      - 'dev-hub/bin/run-radar-v6197-pilot-via-chacha-dev.sh'
      - 'dev-hub/projects/wfgg-radar/project-intent.v1.json'
      - '.github/workflows/dev-hub-radar-v6197-pilot-deploy-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PILOT_REV: 633364c2f2f60aaef6967126df7d25a167f972f3
  EXPECTED_CONNECTOR_SHA256: ccbb1a178212d3137136fff30c31725b88a7e3a8113dca922138018186a158d5
  EXPECTED_NATIVE_SHA256: 274d040f5294cb09422e5d55cc4b5335ac7739924c33dcb67b3f279645814900

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-hub-v5-radar-cluster-quality-diagnostic-v1

      - name: Validate governed runner
        run: |
          set -euo pipefail
          R=dev-hub/bin/run-radar-v6197-pilot-via-chacha-dev.sh
          bash -n "$R"
          grep -Fq 'PILOT_REV="633364c2f2f60aaef6967126df7d25a167f972f3"' "$R"
          grep -Fq 'PILOT_BRANCH="radar-v6197-autopilot-stale-cycle-recovery"' "$R"
          grep -Fq 'CONNECTOR_SHA="ccbb1a178212d3137136fff30c31725b88a7e3a8113dca922138018186a158d5"' "$R"
          grep -Fq 'NATIVE_SHA="274d040f5294cb09422e5d55cc4b5335ac7739924c33dcb67b3f279645814900"' "$R"
          grep -Fq 'radar-vps/install-v6197-pilot.sh' "$R"
          grep -Fq 'radar-vps/probe-v6197-pilot-runtime.sh' "$R"
          grep -Fq 'PROJECT_CONTROL' "$R"
          grep -Fq 'run_graph' "$R"
          grep -Fq 'RADAR_V6197_GAME_SCAN_EXECUTED=NO' "$R"
          grep -Fq 'RADAR_V6197_COLLECTOR_MUTATION=NO' "$R"
          echo RADAR_V6197_CHACHA_RUNNER=PASS

      - name: Validate project intent
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p='dev-hub/projects/wfgg-radar/project-intent.v1.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['current_change']['id']=='radar-v6197-autopilot-stale-cycle-recovery',x
          assert x['current_change']['pilot_only'] is True,x
          criteria='\n'.join(x.get('acceptance_criteria') or [])
          assert '15 minutes' in criteria,criteria
          assert 'STALE_RUNNING_CYCLE_RECOVERED_V6197' in criteria,criteria
          assert 'V6.19.6 AUTOPILOT_NO_DATA and SEED_SKIPPED_NO_DATA behavior remains present.' in criteria,criteria
          assert 'Production promotion requires a separate explicit human approval.' in criteria,criteria
          print('RADAR_V6197_PROJECT_INTENT=PASS')
          PY

      - name: Validate pinned pilot assets
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/chachasan090375/WfGg/$PILOT_REV"
          mkdir -p /tmp/v6197
          for f in radar-vps/pilot-v6197/SHA256SUMS radar-vps/pilot-v6197/PILOT_INFO.txt radar-vps/pilot-v6197/radar-connector radar-vps/pilot-v6197/radar-native-template radar-vps/install-v6197-pilot.sh radar-vps/probe-v6197-pilot-runtime.sh; do
            curl -fsSL "$BASE/$f" -o "/tmp/v6197/$(basename "$f")"
          done
          grep -Fq 'WFGG_RADAR_PILOT=V6.19.7' /tmp/v6197/PILOT_INFO.txt
          grep -Fq 'STALE_CYCLE_RECOVERY=YES' /tmp/v6197/PILOT_INFO.txt
          grep -Fq 'STALE_THRESHOLD_MINUTES=15' /tmp/v6197/PILOT_INFO.txt
          grep -Fq 'NO_DATA_CONTINUE_PRESERVED=YES' /tmp/v6197/PILOT_INFO.txt
          grep -Fq 'GLOBAL_FAILURE_GUARDS=PRESERVED' /tmp/v6197/PILOT_INFO.txt
          (
            cd /tmp/v6197
            sha256sum -c SHA256SUMS
          )
          test "$(sha256sum /tmp/v6197/radar-connector | awk '{print $1}')" = "$EXPECTED_CONNECTOR_SHA256"
          test "$(sha256sum /tmp/v6197/radar-native-template | awk '{print $1}')" = "$EXPECTED_NATIVE_SHA256"
          bash -n /tmp/v6197/install-v6197-pilot.sh
          bash -n /tmp/v6197/probe-v6197-pilot-runtime.sh
          grep -Fq 'GAME_TOKEN_REQUIRED' /tmp/v6197/probe-v6197-pilot-runtime.sh
          grep -Fq 'RADAR_V6197_GAME_SCAN_EXECUTED=NO' /tmp/v6197/probe-v6197-pilot-runtime.sh
          echo RADAR_V6197_PINNED_PILOT_ASSETS=PASS

      - name: Verify one-shot approval contract
        run: |
          set -euo pipefail
          R=dev-hub/bin/run-radar-v6197-pilot-via-chacha-dev.sh
          grep -Fq 'J’approuve le PILOT Radar V6.19.7 Stale Cycle Recovery révision 633364c2f2f60aaef6967126df7d25a167f972f3 avec probe de garde sans scan de jeu.' "$R"
          grep -Fq 'PRODUCTION_RELEASE_APPROVAL_REVOKED=PASS' "$R"
          grep -Fq "RADAR_V6197_PILOT_CLOSE='+('PASS' if ok else 'FAIL')" "$R"
          echo RADAR_V6197_ONE_SHOT_APPROVAL=PASS
