name: ChaCha DEV V6.58 visual content specialist project-local Radar evidence qualification

on:
  push:
    branches:
      - dev-hub-v658-visual-content-specialist-project-local-radar-evidence
    paths:
      - 'dev-hub/bin/agent_benchmark_adapters.py'
      - 'dev-hub/bin/agent_benchmark_oracles.py'
      - 'dev-hub/bin/agent_fleet_observatory.py'
      - 'dev-hub/bin/autonomous-project-orchestrator.py'
      - 'dev-hub/config/agent-benchmark-adapters.v1.json'
      - 'dev-hub/config/agent-fleet-observatory.v1.json'
      - 'dev-hub/config/domain-orchestration.v1.json'
      - 'dev-hub/tests/test_v658_visual_content_project_radar_evidence.py'
      - '.github/workflows/dev-hub-v658-visual-content-project-radar-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static validation
        run: |
          set -euo pipefail
          python3 -m py_compile dev-hub/bin/agent_benchmark_adapters.py dev-hub/bin/agent_benchmark_oracles.py dev-hub/bin/agent_fleet_observatory.py dev-hub/bin/autonomous-project-orchestrator.py dev-hub/tests/test_v658_visual_content_project_radar_evidence.py
          python3 -m json.tool dev-hub/config/agent-benchmark-adapters.v1.json >/dev/null
          python3 -m json.tool dev-hub/config/agent-fleet-observatory.v1.json >/dev/null
          python3 -m json.tool dev-hub/config/domain-orchestration.v1.json >/dev/null
          grep -Fq '"version":"6.58.0"' dev-hub/bin/autonomous-project-orchestrator.py
      - name: V6.58 specialist and project Radar wave
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v658_visual_content_project_radar_evidence.py | tee /tmp/v658.out
          grep -Fq 'CHACHA_DEV_V658_GRAPHICS_EXECUTABLE_CONTRACT=PASS' /tmp/v658.out
          grep -Fq 'CHACHA_DEV_V658_ANIMATION_EXECUTABLE_CONTRACT=PASS' /tmp/v658.out
          grep -Fq 'CHACHA_DEV_V658_UI_LAYOUT_ROLE_ALIGNMENT=PASS' /tmp/v658.out
          grep -Fq 'CHACHA_DEV_V658_TRANSLATION_EXECUTABLE_CONTRACT=PASS' /tmp/v658.out
          grep -Fq 'CHACHA_DEV_V658_PUBLICATION_EXECUTABLE_CONTRACT=PASS' /tmp/v658.out
          grep -Fq 'CHACHA_DEV_V658_PROJECT_LOCAL_RADAR_READONLY_ADAPTER=PASS' /tmp/v658.out
          grep -Fq 'CHACHA_DEV_V658_RADAR_STRUCTURAL_PRODUCTION_EVIDENCE=PASS' /tmp/v658.out
          grep -Fq 'CHACHA_DEV_V658_RADAR_ACCURACY_FROM_PROMOTION=NO' /tmp/v658.out
          grep -Fq 'CHACHA_DEV_V658_PLATFORM_ROUTING_FOR_RADAR=FORBIDDEN' /tmp/v658.out
          grep -Fq 'CHACHA_DEV_V658_BENCHMARK_ONLY_CANDIDATE_MATERIALIZATION=BLOCKED' /tmp/v658.out
          grep -Fq 'CHACHA_DEV_V658_AUTOMATIC_EXTERNAL_SPEND_EUR=0' /tmp/v658.out
      - name: V6.57 regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v657_seventh_adapter_authority_specialist_evidence.py >/tmp/v657.out
          grep -Fq 'CHACHA_DEV_V657_REVISE_IS_NOT_ACCURACY_PROOF=PASS' /tmp/v657.out
          grep -Fq 'CHACHA_DEV_V657_BENCHMARK_ONLY_CANDIDATE_MATERIALIZATION=BLOCKED' /tmp/v657.out
      - name: Qualification receipt
        run: |
          echo CHACHA_DEV_V658_QUALIFICATION=PASS
          echo VISUAL_CONTENT_EXECUTABLE_CONTRACTS=5
          echo PROJECT_LOCAL_RADAR_READONLY_ADAPTER=PASS
          echo RADAR_STRUCTURAL_PRODUCTION_DIMENSIONS=2
          echo RADAR_ACCURACY_FROM_PROMOTION=NO
          echo UI_LAYOUT_SPECIALIST_DOMAIN_OWNER=YES
          echo PLATFORM_GLOBAL_RADAR_PROMOTION=FORBIDDEN
          echo AUTOMATIC_EXTERNAL_SPEND_EUR=0
