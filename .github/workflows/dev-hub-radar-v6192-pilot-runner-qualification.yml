name: ChaCha DEV Radar V6.19.2 governed pilot runner qualification

on:
  push:
    branches: [dev-hub-v5-radar-cluster-quality-diagnostic-v1]
    paths:
      - 'dev-hub/bin/run-radar-v6192-pilot-via-chacha-dev.sh'
      - 'dev-hub/projects/wfgg-radar/project-intent.v1.json'
      - '.github/workflows/dev-hub-radar-v6192-pilot-runner-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-hub-v5-radar-cluster-quality-diagnostic-v1

      - name: Validate shell and project intent
        run: |
          set -euo pipefail
          bash -n dev-hub/bin/run-radar-v6192-pilot-via-chacha-dev.sh
          python3 - <<'PY'
          import json
          p='dev-hub/projects/wfgg-radar/project-intent.v1.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['schema']=='chacha.dev/project-intent/v1',x
          assert x['project']=='wfgg-radar',x
          assert x['current_change']['id']=='radar-v6192-cluster-catalog-budget',x
          assert x['current_change']['pilot_only'] is True,x
          assert x['current_change']['rollback_required'] is True,x
          print('PROJECT_INTENT=PASS')
          PY

      - name: Verify approval and pilot safety invariants
        run: |
          set -euo pipefail
          F=dev-hub/bin/run-radar-v6192-pilot-via-chacha-dev.sh
          grep -Fq 'APPROVAL_ID="production-release"' "$F"
          grep -Fq 'J’approuve le déploiement PILOT Radar V6.19.2 avec timeout catalogue 75 s.' "$F"
          grep -Fq 'PRODUCTION_RELEASE_APPROVAL_REVOKED=PASS' "$F"
          grep -Fq 'close_pilot' "$F"
          grep -Fq 'revoke_approval' "$F"
          grep -Fq 'radar-runtime:pilot-open-v6192' "$F"
          grep -Fq 'radar-runtime:pilot-install-v6192' "$F"
          grep -Fq 'radar-runtime:cluster-catalog-probe-v6192' "$F"
          grep -Fq 'radar-runtime:pilot-close-v6192' "$F"
          grep -Fq '7c807206e585b3eb21321892661657398c50e947' "$F"
          grep -Fq '1202bc345ed8342398d255667bd783b237182776751f40e7da7ac958ee31f9da' "$F"
          grep -Fq '274d040f5294cb09422e5d55cc4b5335ac7739924c33dcb67b3f279645814900' "$F"
          echo GOVERNED_PILOT_RUNNER=QUALIFIED
