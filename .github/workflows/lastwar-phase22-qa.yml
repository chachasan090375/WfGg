name: LastWar phase22 catalog bridge QA

on:
  workflow_dispatch:
  push:
    branches:
      - portal-auth-lastwar-lab-v1
    paths:
      - 'scripts/lastwar-phase22-catalog-bridge.sh'
      - '.github/workflows/lastwar-phase22-qa.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate shell syntax
        run: bash -n scripts/lastwar-phase22-catalog-bridge.sh
      - name: Validate embedded Python syntax
        run: |
          set -euo pipefail
          awk '/^cat > "\$PY" <<'"'"'PYEOF'"'"'$/{f=1;next} /^PYEOF$/{if(f){exit}} f{print}' scripts/lastwar-phase22-catalog-bridge.sh > /tmp/phase22.py
          python -m py_compile /tmp/phase22.py
      - name: Enforce exact-mapping and privacy rules
        run: |
          set -euo pipefail
          f=scripts/lastwar-phase22-catalog-bridge.sh
          grep -q 'OFFLINE ONLY' "$f"
          grep -q 'no Last War network connection' "$f"
          grep -q 'same_printable_catalog_record' "$f"
          grep -q 'unknown_hero_ids_are_not_guessed=true' "$f"
          ! grep -Eq 'curl |wget |requests\.|urllib\.request|socket\.' "$f"
          ! grep -Eq 'loginKey|accessToken|password' "$f"
