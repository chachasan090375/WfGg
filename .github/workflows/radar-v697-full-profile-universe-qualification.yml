name: Radar V6.9.7 full-cycle profile universe qualification

on:
  push:
    branches: [radar-v697-full-profile-universe]
    paths:
      - '.github/workflows/radar-v697-full-profile-universe-qualification.yml'
      - '.github/scripts/patch-radar-full-profile-universe-v697.py'
      - '.github/scripts/patch-radar-connector-runtime-v693.py'
      - '.radar-release-src/v697-source/**'

permissions:
  contents: read

env:
  LASTWAR_CLIENT_REF: ee5f64de160a8051c2f9f98189b75038dd225a0a

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-v697-full-profile-universe
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Reconstruct connector through V6.9.7
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar
          mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          echo '234df1dec57f6211bc625855bf13350c9f17fbd843fbe92d8cf1ab7cb5c081ef  /tmp/radar-src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar
          rm -rf /tmp/wfgg-radar/connector-go
          cp -a .radar-release-src/v2-source/connector-go /tmp/wfgg-radar/connector-go
          python3 .github/scripts/patch-radar-target-profile-retry.py
          python3 .github/scripts/patch-radar-federated-diagnostics-v65.py
          python3 .github/scripts/patch-player-scan-v3.py
          python3 .github/scripts/patch-player-scan-v4.py
          python3 .github/scripts/patch-radar-protocol-discovery-v67.py
          python3 .github/scripts/patch-radar-profile-isolation-v68.py
          python3 .github/scripts/patch-radar-native-profile-v69.py
          python3 .github/scripts/patch-radar-native-profile-handshake-v691.py
          python3 .github/scripts/patch-radar-native-profile-exec-v692.py
          python3 .github/scripts/patch-radar-connector-runtime-v693.py

      - name: Qualify full current-cycle profile population
        working-directory: /tmp/wfgg-radar/connector-go
        run: |
          set -euo pipefail
          gofmt -w ./cmd ./internal
          go test ./...
          go test ./cmd/radar-connector -run 'TestAppendProfileUIDsV697DeduplicatesAcrossRegions|TestProfileAttemptBudgetV697ScalesBeyondDeltaBudget' -count=1
          go vet ./...
          grep -Fq 'WFGG_RADAR_FULL_PROFILE_UNIVERSE_JOB_V697' cmd/radar-connector/collector_jobs.go
          grep -Fq 'WFGG_RADAR_PROFILE_DYNAMIC_BUDGET_V697' cmd/radar-connector/profile_isolation_v68.go
          grep -Fq 'uids := append([]string(nil), profileUIDsV697...)' cmd/radar-connector/collector_jobs.go
          ! grep -Fq 'uids, err := collectorChangedUIDs(ctx, cycle.ID)' cmd/radar-connector/collector_jobs.go
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o /tmp/radar-connector-v697 ./cmd/radar-connector
          test -s /tmp/radar-connector-v697
          echo RADAR_V697_FULL_PROFILE_UNIVERSE=PASS

      - name: Verify read-only scope
        run: |
          set -euo pipefail
          ! grep -REq 'building\.production\.collect|mail\.reward|al\.science\.donate|visitor\.operate|attack|march|purchase' .github/scripts/patch-radar-full-profile-universe-v697.py .radar-release-src/v697-source
          echo RADAR_V697_READONLY=PASS
