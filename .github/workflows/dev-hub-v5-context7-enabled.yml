name: Dev Hub V5 Context7 ENABLED

on:
  workflow_dispatch:
  push:
    branches:
      - dev-hub-v5-context7-enabled
    paths:
      - 'dev-hub/config/provider-adapters.v1.json'
      - 'dev-hub/config/mcp-provider-catalog.v1.json'
      - 'dev-hub/config/mcp-context7-contract.v1.json'
      - 'dev-hub/config/adapter-rollbacks.v1.json'
      - 'dev-hub/evidence/context7-enable-readiness-35076408369-evidence.json'
      - 'dev-hub/evidence/context7-enabled-promotion-35076725665-receipt.json'
      - 'dev-hub/evidence/context7-enabled-promotion-35076725665-report.json'
      - 'dev-hub/evidence/context7-enabled-promotion-35076725665-provenance.json'
      - 'dev-hub/bin/mcp-context7-enabled-validate.py'
      - '.github/workflows/dev-hub-v5-context7-enabled.yml'
  pull_request:
    paths:
      - 'dev-hub/config/provider-adapters.v1.json'
      - 'dev-hub/config/mcp-provider-catalog.v1.json'
      - 'dev-hub/config/mcp-context7-contract.v1.json'
      - 'dev-hub/config/adapter-rollbacks.v1.json'
      - 'dev-hub/evidence/context7-enable-readiness-35076408369-evidence.json'
      - 'dev-hub/evidence/context7-enabled-promotion-35076725665-receipt.json'
      - 'dev-hub/evidence/context7-enabled-promotion-35076725665-report.json'
      - 'dev-hub/evidence/context7-enabled-promotion-35076725665-provenance.json'
      - 'dev-hub/bin/mcp-context7-enabled-validate.py'
      - '.github/workflows/dev-hub-v5-context7-enabled.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON syntax
        run: |
          python -m json.tool dev-hub/config/provider-adapters.v1.json >/dev/null
          python -m json.tool dev-hub/config/mcp-provider-catalog.v1.json >/dev/null
          python -m json.tool dev-hub/config/mcp-context7-contract.v1.json >/dev/null
          python -m json.tool dev-hub/config/adapter-rollbacks.v1.json >/dev/null
          python -m json.tool dev-hub/evidence/context7-enable-readiness-35076408369-evidence.json >/dev/null
          python -m json.tool dev-hub/evidence/context7-enabled-promotion-35076725665-receipt.json >/dev/null
          python -m json.tool dev-hub/evidence/context7-enabled-promotion-35076725665-report.json >/dev/null
          python -m json.tool dev-hub/evidence/context7-enabled-promotion-35076725665-provenance.json >/dev/null

      - name: Validate Context7 design contract
        run: python dev-hub/bin/mcp-context7-contract-validate.py

      - name: Validate Context7 ENABLED state
        run: python dev-hub/bin/mcp-context7-enabled-validate.py

      - name: Confirm ENABLED remains read-only and non-production
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('dev-hub/config/provider-adapters.v1.json').read_text())
          catalog = json.loads(Path('dev-hub/config/mcp-provider-catalog.v1.json').read_text())
          receipt = json.loads(Path('dev-hub/evidence/context7-enabled-promotion-35076725665-receipt.json').read_text())
          adapter = registry['adapters']['context7-mcp-adapter']
          provider = catalog['providers']['context7-mcp']
          assert adapter['status'] == 'ENABLED'
          assert adapter['supports'] == ['read']
          assert adapter.get('executable') is None
          assert provider['runtime_status'] == 'ENABLED'
          assert provider['write_scope'] == []
          assert receipt['production_capable'] is False
          assert receipt['approval_required'] is False
          print('CONTEXT7_ENABLED_BOUNDARY_OK: read_only=true production=false executable=null')
          PY
