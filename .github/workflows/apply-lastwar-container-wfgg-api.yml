name: Apply Last War container to wfgg-api

on:
  push:
    branches:
      - connector-readonly-v1
    paths:
      - '.github/workflows/apply-lastwar-container-wfgg-api.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: connector-readonly-v1

      - name: Apply deterministic integration patch
        run: python3 .github/scripts/apply_lastwar_container_to_wfgg_api.py

      - name: Validate JavaScript syntax
        run: |
          node --check worker/src/index.js
          node --check worker/src/lastwar-identity.js
          node --check worker/src/lastwar-container.js
          node --check frontend/lastwar-connect-v2.js
          node --check frontend/_worker.js

      - name: Validate integration markers
        run: |
          grep -q "LastWarUserContainer" worker/src/index.js
          grep -q "routeLastWarIdentity" worker/src/index.js
          grep -q "0.5.0-lastwar-container" worker/src/index.js
          grep -q "LASTWAR_USER" worker/wrangler.jsonc
          grep -q "../lastwar-broker/Dockerfile" worker/wrangler.jsonc
          grep -q "LASTWAR_CONNECTOR_API||''" frontend/lastwar-connect-v2.js
          grep -q "connector-readonly-v1-wfgg-api.chachasan090375.workers.dev" frontend/_worker.js
          grep -q "v=013-container-direct" frontend/index.html

      - name: Commit branch integration
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/index.js frontend/lastwar-connect-v2.js frontend/_worker.js frontend/index.html
          git commit -m "connector: route preview through embedded Last War container"
          git push origin HEAD:connector-readonly-v1
