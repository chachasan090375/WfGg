name: Radar V6.18 map profile merge qualification

on:
  push:
    branches: [radar-v618-map-profile-merge]
    paths:
      - '.radar-release-src/v618-source/**'
      - '.github/scripts/patch-radar-map-profile-merge-v618.py'
      - '.github/scripts/patch-radar-connector-runtime-v693.py'
      - '.github/workflows/radar-v618-map-profile-merge-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  LASTWAR_CLIENT_REF: ee5f64de160a8051c2f9f98189b75038dd225a0a

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-v618-map-profile-merge
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Reconstruct V6.18 connector
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar
          mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          echo '234df1dec57f6211bc625855bf13350c9f17fbd843fbe92d8cf1ab7cb5c081ef  /tmp/radar-src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar
          rm -rf /tmp/wfgg-radar/connector-go
          cp -a .radar-release-src/v2-source/connector-go /tmp/wfgg-radar/connector-go
          python3 .github/scripts/patch-radar-target-profile-retry.py
          python3 .github/scripts/patch-radar-federated-diagnostics-v65.py
          python3 .github/scripts/patch-player-scan-v3.py
          python3 .github/scripts/patch-player-scan-v4.py
          python3 .github/scripts/patch-radar-protocol-discovery-v67.py
          python3 .github/scripts/patch-radar-profile-isolation-v68.py
          python3 .github/scripts/patch-radar-native-profile-v69.py
          python3 .github/scripts/patch-radar-native-profile-handshake-v691.py
          python3 .github/scripts/patch-radar-native-profile-exec-v692.py
          python3 .github/scripts/patch-radar-connector-runtime-v693.py

      - name: Test map profile merge
        working-directory: /tmp/wfgg-radar/connector-go
        run: |
          set -euo pipefail
          gofmt -w ./cmd ./internal
          go test ./cmd/radar-connector -run 'TestMergeProfileWithMapV618PreservesWorldFields|TestMergeProfileWithMapV618ExplicitProfileWins|TestMergeProfileBatchV618UsesUIDMap|TestQualityCatalogV617DoesNotConfirmTwoFullPlusOnePartial' -count=1
          go test ./...
          go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o /tmp/radar-connector-v618 ./cmd/radar-connector
          test -s /tmp/radar-connector-v618

      - name: Verify V6.18 merge surface
        run: |
          set -euo pipefail
          grep -Fq 'WFGG_RADAR_MAP_PROFILE_MERGE_JOB_V618' /tmp/wfgg-radar/connector-go/cmd/radar-connector/collector_jobs.go
          grep -Fq 'rememberMapPlayersV618(mapPlayersV618, players)' /tmp/wfgg-radar/connector-go/cmd/radar-connector/collector_jobs.go
          grep -Fq 'mergeProfileBatchV618(mapPlayersV618, profiles)' /tmp/wfgg-radar/connector-go/cmd/radar-connector/collector_jobs.go
          grep -Fq 'mergeProfileBatchV618(mapPlayersV618, players)' /tmp/wfgg-radar/connector-go/cmd/radar-connector/collector_jobs.go
          grep -Fq 'out.ServerID = base.ServerID' /tmp/wfgg-radar/connector-go/cmd/radar-connector/profile_map_merge_v618.go
          grep -Fq 'out.X = base.X' /tmp/wfgg-radar/connector-go/cmd/radar-connector/profile_map_merge_v618.go
          grep -Fq 'out.Y = base.Y' /tmp/wfgg-radar/connector-go/cmd/radar-connector/profile_map_merge_v618.go
          grep -Fq 'out.AllianceTag = base.AllianceTag' /tmp/wfgg-radar/connector-go/cmd/radar-connector/profile_map_merge_v618.go
          grep -Fq 'WFGG_RADAR_PARTIAL_CYCLE_MARKER_V617' /tmp/wfgg-radar/connector-go/cmd/radar-connector/collector_jobs.go
          ! grep -REq 'building\.production\.collect|mail\.reward|al\.science\.donate|visitor\.operate|attack|march|purchase' .radar-release-src/v618-source
          echo RADAR_V618_MAP_PROFILE_MERGE=QUALIFIED
