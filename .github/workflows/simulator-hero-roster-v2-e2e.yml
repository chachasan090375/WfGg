name: Simulator hero roster v2 E2E

on:
  push:
    branches: [simulator-standalone-v1]
    paths:
      - 'simulator/hero-roster-v2.js'
      - 'simulator/hero-roster-v2.css'
      - 'simulator/data/hero-catalog.v2.json'
      - 'simulator/index.html'
      - '.github/workflows/simulator-hero-roster-v2-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hero-roster-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          mkdir -p /tmp/wfgg-hero-e2e && cd /tmp/wfgg-hero-e2e
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Test public graphical hero workflow and multi-select
        env:
          NODE_PATH: /tmp/wfgg-hero-e2e/node_modules
        run: |
          cat >/tmp/wfgg-hero-e2e/test.cjs <<'JS'
          const {chromium}=require('playwright');
          const URL='https://simulator-standalone-v1.wfgg.pages.dev/simulator/';
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            for(let i=0;i<80;i++){
              try{
                const js=await fetch(URL+'hero-roster-v2.js?fresh='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'');
                if(js.includes("version:'2.2.0'"))break;
              }catch(_){}
              if(i===79)throw new Error('public preview missing hero roster 2.2');
              await sleep(1500);
            }
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:412,height:915},isMobile:true,hasTouch:true,deviceScaleFactor:2});
            const page=await context.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(e.message));page.on('console',m=>{if(m.type()==='error'&&!m.text().includes('Failed to load resource'))errors.push(m.text())});
            await page.goto(URL+'?heroMultiE2E='+Date.now(),{waitUntil:'networkidle',timeout:30000});
            await page.evaluate(()=>localStorage.clear());
            await page.reload({waitUntil:'networkidle',timeout:30000});
            await page.waitForFunction(()=>window.WfGgHeroRosterV2?.version==='2.2.0',{timeout:12000});
            await page.locator('#stepNav [data-step="1"]').click();
            await page.waitForSelector('#gameHeroRosterV2 .game-hero-card',{timeout:12000});
            assert(await page.locator('#gameHeroRosterV2 .game-hero-card').count()===31,'31 hero cards expected');
            assert(await page.locator('#heroSelectionMode.active').count()===1,'multi-select must be active by default');

            await page.locator('[data-hero-id="kimberly"]').click();
            await page.waitForSelector('[data-hero-id="kimberly"].owned',{timeout:5000});
            assert(await page.locator('#heroGameSheet.open').count()===0,'card tap in selection mode must not open sheet');
            await page.locator('[data-hero-id="monica"]').click();
            await page.waitForSelector('[data-hero-id="monica"].owned',{timeout:5000});
            assert((await page.locator('#gameRosterCount').textContent()).startsWith('2/31'),'two selected heroes expected');

            await page.locator('[data-hero-info="kimberly"]').click();
            await page.waitForSelector('#heroGameSheet.open',{timeout:5000});
            assert((await page.locator('#heroOwnedAction').textContent()).toLowerCase().includes('retirer'),'info sheet must preserve owned state');
            await page.locator('#heroSheetClose').click();

            await page.reload({waitUntil:'networkidle',timeout:30000});
            await page.locator('#stepNav [data-step="1"]').click();
            await page.waitForSelector('[data-hero-id="kimberly"].owned',{timeout:8000});
            assert(await page.locator('[data-hero-id="monica"].owned').count()===1,'Monica selection lost after reload');
            assert((await page.locator('#gameRosterCount').textContent()).startsWith('2/31'),'multi-selection count lost after reload');

            await page.locator('[data-hero-id="kimberly"]').click();
            await page.waitForTimeout(500);
            assert(await page.locator('[data-hero-id="kimberly"].owned').count()===0,'selection-mode tap must remove owned hero');
            assert(await page.locator('[data-hero-id="monica"].owned').count()===1,'other selected hero must remain');

            await page.locator('#heroSelectionMode').click();
            assert(await page.locator('#heroSelectionMode.active').count()===0,'details mode expected');
            await page.locator('[data-hero-id="monica"]').click();
            await page.waitForSelector('#heroGameSheet.open',{timeout:5000});
            assert(await page.locator('[data-hero-id="monica"].owned').count()===1,'details-mode tap must not alter possession');

            await page.screenshot({path:'/tmp/wfgg-hero-e2e/hero-roster-v2-multiselect.png',fullPage:true});
            assert(errors.length===0,'browser errors: '+errors.join(' | '));
            console.log('WFGG HERO ROSTER V2.2 MULTISELECT E2E COMPLETE');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/wfgg-hero-e2e/test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-hero-roster-v2-multiselect-screen
          path: /tmp/wfgg-hero-e2e/hero-roster-v2-multiselect.png
          if-no-files-found: ignore
