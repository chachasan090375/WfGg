name: ChaCha DEV Radar V6.19.8 functional terminalization pilot qualification

on:
  push:
    branches: [dev-hub-v5-radar-cluster-quality-diagnostic-v1]
    paths:
      - 'dev-hub/bin/run-radar-v6198-functional-terminalization-pilot-via-chacha-dev.sh'
      - 'dev-hub/projects/wfgg-radar/project-intent.v1.json'
      - '.github/workflows/dev-hub-radar-v6198-functional-terminalization-pilot-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PILOT_REV: 93d58f84a8182e141dbc86ac5b0d4dde893484bc
  EXPECTED_CONNECTOR_SHA256: fb21a02feeaaa6a7013cf4e17c77bbb033a30a4bce021066fd947fc665360a9b
  EXPECTED_NATIVE_SHA256: 274d040f5294cb09422e5d55cc4b5335ac7739924c33dcb67b3f279645814900

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-hub-v5-radar-cluster-quality-diagnostic-v1

      - name: Validate bounded functional runner
        run: |
          set -euo pipefail
          R=dev-hub/bin/run-radar-v6198-functional-terminalization-pilot-via-chacha-dev.sh
          bash -n "$R"
          grep -Fq 'PILOT_REV="93d58f84a8182e141dbc86ac5b0d4dde893484bc"' "$R"
          grep -Fq 'PILOT_BRANCH="radar-v6198-collector-cycle-terminalization"' "$R"
          grep -Fq 'CONNECTOR_SHA="fb21a02feeaaa6a7013cf4e17c77bbb033a30a4bce021066fd947fc665360a9b"' "$R"
          grep -Fq 'TARGET_QUERY="@federated:8131"' "$R"
          grep -Fq 'STALE_RUNNING_CYCLE_RECOVERED_V6197' "$R"
          grep -Fq 'RADAR_V6198_FUNCTIONAL_WINDOW_READY=YES' "$R"
          grep -Fq 'appuie UNE SEULE FOIS sur RECHERCHE' "$R"
          grep -Fq 'FRESH_CYCLE_NOT_TERMINAL_WITHIN_300S' "$R"
          grep -Fq 'TERMINALIZATION_RETRIES_EXHAUSTED' "$R"
          grep -Fq 'RADAR_V6198_FRESH_CYCLE_TERMINAL=PASS' "$R"
          grep -Fq 'RADAR_V6198_FUNCTIONAL_PROOF=PASS' "$R"
          grep -Fq 'RADAR_V6198_PILOT_CLOSE=' "$R"
          grep -Fq 'PRODUCTION_RELEASE_APPROVAL_REVOKED=PASS' "$R"
          echo RADAR_V6198_FUNCTIONAL_RUNNER=PASS

      - name: Validate exact functional approval boundary
        run: |
          set -euo pipefail
          R=dev-hub/bin/run-radar-v6198-functional-terminalization-pilot-via-chacha-dev.sh
          grep -Fq 'J’approuve le PILOT fonctionnel Radar V6.19.8 Collector Cycle Terminalization révision 93d58f84a8182e141dbc86ac5b0d4dde893484bc avec un scan Last War READ-ONLY ciblé sur @federated:8131 et mutation Collector limitée à la récupération du cycle stale, au nouveau cycle de preuve et à sa terminalisation.' "$R"
          grep -Fq 'single_pilot_window' "$R"
          echo RADAR_V6198_FUNCTIONAL_APPROVAL_CONTRACT=PASS

      - name: Validate project intent
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          x=json.load(open('dev-hub/projects/wfgg-radar/project-intent.v1.json',encoding='utf-8'))
          assert x['current_change']['id']=='radar-v6198-collector-cycle-terminalization',x
          c='\n'.join(x.get('acceptance_criteria') or [])
          assert 'exactly one normal @federated:8131 search' in c,c
          assert 'STALE_RUNNING_CYCLE_RECOVERED_V6197' in c,c
          assert 'within 300 seconds' in c,c
          assert '_CYCLE_TERMINALIZATION_FAILED' in c,c
          assert 'Last War READ-ONLY' in c,c
          print('RADAR_V6198_FUNCTIONAL_INTENT=PASS')
          PY

      - name: Validate immutable pilot assets
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/chachasan090375/WfGg/$PILOT_REV"
          mkdir -p /tmp/v6198
          for f in radar-vps/pilot-v6198/SHA256SUMS radar-vps/pilot-v6198/PILOT_INFO.txt radar-vps/pilot-v6198/radar-connector radar-vps/pilot-v6198/radar-native-template radar-vps/install-v6198-pilot.sh radar-vps/probe-v6198-pilot-runtime.sh; do
            curl -fsSL "$BASE/$f" -o "/tmp/v6198/$(basename "$f")"
          done
          (cd /tmp/v6198 && sha256sum -c SHA256SUMS)
          test "$(sha256sum /tmp/v6198/radar-connector | awk '{print $1}')" = "$EXPECTED_CONNECTOR_SHA256"
          test "$(sha256sum /tmp/v6198/radar-native-template | awk '{print $1}')" = "$EXPECTED_NATIVE_SHA256"
          grep -Fq 'COLLECTOR_CYCLE_TERMINALIZATION=YES' /tmp/v6198/PILOT_INFO.txt
          grep -Fq 'TERMINALIZATION_ATTEMPTS=12' /tmp/v6198/PILOT_INFO.txt
          echo RADAR_V6198_FUNCTIONAL_PINNED_ASSETS=PASS
