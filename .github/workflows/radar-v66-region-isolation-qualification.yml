name: Radar V6.6 region isolation qualification

on:
  push:
    branches: [radar-v66-region-isolation-work]
    paths:
      - '.github/scripts/patch-radar-region-isolation-v66.py'
      - '.github/scripts/patch-radar-federated-diagnostics-v65.py'
      - '.radar-release-src/v2-source/connector-go/**'
      - 'radar-ui-live/live-radar.html'
      - 'docs/RADAR_COLLECTOR_KNOWLEDGE_ENGINE_V1.md'
      - '.github/workflows/radar-v66-region-isolation-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Reconstruct isolated Radar tree
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar
          mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          echo '234df1dec57f6211bc625855bf13350c9f17fbd843fbe92d8cf1ab7cb5c081ef  /tmp/radar-src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar
          rm -rf /tmp/wfgg-radar/connector-go
          cp -a .radar-release-src/v2-source/connector-go /tmp/wfgg-radar/connector-go
          install -m 0644 .radar-release-src/v2-source/src/game/remote-transport.js /tmp/wfgg-radar/src/game/remote-transport.js
          python3 .github/scripts/patch-radar-target-profile-retry.py
          python3 .github/scripts/patch-radar-async-collector-worker.py
          install -m 0644 radar-ui-live/live-radar.html /tmp/wfgg-radar/public/live-radar.html
          python3 .github/scripts/patch-radar-federated-diagnostics-v65.py
          python3 .github/scripts/patch-radar-region-isolation-v66.py

      - name: Validate V6.6 connector contract
        run: |
          set -euo pipefail
          f=/tmp/wfgg-radar/connector-go/cmd/radar-connector/collector_jobs.go
          grep -q 'WFGG_RADAR_REGION_ISOLATION_V66' "$f"
          grep -q 'RegionsCompleted' "$f"
          grep -q 'RegionsFailed' "$f"
          grep -q 'RegionFailures' "$f"
          grep -q 'j.RegionsFailed++' "$f"
          grep -q 'j.RegionsCompleted++' "$f"
          grep -q 'continue' "$f"
          grep -q 'MAP_ALL_REGIONS_FAILED' "$f"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/wfgg-radar/connector-go/cmd/radar-connector/collector_jobs.go').read_text()
          start=s.index('for region := 0; region < 9; region++')
          end=s.index('if current, ok := radarCollectorJobs.get(jobID)', start)
          loop=s[start:end]
          assert 'collectorFinishCycle(context.Background(), cycle.ID, "FAILED", "MAP_REGION_FAILED")' not in loop
          assert 'fail("MAP_REGION_FAILED"' not in loop
          assert 'RegionFailures = append' in loop
          assert 'continue' in loop
          print('RADAR_V66_REGION_CONTINUATION=PASS')
          PY

      - name: Validate Worker and UI partial-result contract
        run: |
          set -euo pipefail
          grep -q 'WFGG_RADAR_REGION_ISOLATION_V66' /tmp/wfgg-radar/src/worker.js
          grep -q 'job.partial' /tmp/wfgg-radar/src/worker.js
          grep -q 'WFGG_RADAR_REGION_ISOLATION_UI_V66' /tmp/wfgg-radar/public/live-radar.html
          grep -q 'TERMINÉ PARTIEL' /tmp/wfgg-radar/public/live-radar.html
          grep -q 'données valides conservées' /tmp/wfgg-radar/public/live-radar.html
          ! grep -q 'accessToken' /tmp/wfgg-radar/public/live-radar.html
          ! grep -q 'stderr' /tmp/wfgg-radar/public/live-radar.html
          echo 'RADAR_V66_PARTIAL_RESULT_UI=PASS'

      - name: Test connector
        working-directory: /tmp/wfgg-radar/connector-go
        run: |
          set -euo pipefail
          gofmt -w ./cmd ./internal
          go test ./...
          go vet ./...
          CGO_ENABLED=0 go build ./cmd/radar-connector
          echo 'RADAR_V66_CONNECTOR=PASS'

      - name: Test Worker and UI staging
        working-directory: /tmp/wfgg-radar
        run: |
          set -euo pipefail
          npm test
          npm run check
          node --check src/worker.js
          echo 'RADAR_V66_WEB=PASS'

      - name: Validate knowledge-engine boundary
        run: |
          set -euo pipefail
          grep -q '`OBSERVED`' docs/RADAR_COLLECTOR_KNOWLEDGE_ENGINE_V1.md
          grep -q '`INFERRED`' docs/RADAR_COLLECTOR_KNOWLEDGE_ENGINE_V1.md
          grep -q '`CONFIRMED`' docs/RADAR_COLLECTOR_KNOWLEDGE_ENGINE_V1.md
          grep -q '`OBSOLETE`' docs/RADAR_COLLECTOR_KNOWLEDGE_ENGINE_V1.md
          grep -q 'Collector reste read-only' docs/RADAR_COLLECTOR_KNOWLEDGE_ENGINE_V1.md
          echo 'RADAR_KNOWLEDGE_ENGINE_CONTRACT=PASS'

      - name: Confirm no production mutation
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          echo 'RADAR_V66_REPOSITORY_UNCHANGED=PASS'
          echo 'RADAR_V66_PRODUCTION_TOUCHED=NO'
