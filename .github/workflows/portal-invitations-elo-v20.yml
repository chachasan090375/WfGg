name: Portal invitations εlο v20 recette

on:
  push:
    branches: [portal-invitations-elo-fix-v20]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  elo-recette:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portal-invitations-elo-fix-v20
      - name: Validate sources
        run: |
          node --check frontend/portal-invitations-android-filefix-v1.js
          node --check .github/qa/portal-invitations-recette.mjs
          python3 -m py_compile .github/qa/make-invitations-xlsx-fixture.py
          grep -Fq 'WFGG_PORTAL_INVITATIONS_ELO_CANONICAL_V1' frontend/portal-invitations-android-filefix-v1.js
          grep -Fq "const CANONICAL_ELO='εlο ツ'" frontend/portal-invitations-android-filefix-v1.js
      - name: Generate XLSX fixture
        run: python3 .github/qa/make-invitations-xlsx-fixture.py /tmp/qa-members.xlsx
      - name: Start local portal
        run: |
          python3 -m http.server 4173 --directory frontend >/tmp/wfgg-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run invitation browser recette
        env:
          WFGG_PREVIEW: http://127.0.0.1:4173
          WFGG_XLSX_FIXTURE: /tmp/qa-members.xlsx
        run: node .github/qa/portal-invitations-recette.mjs
