name: ChaCha DEV V6.34 logic UX compromise qualification

on:
  push:
    branches: [dev-hub-v634-logic-ux-challenge-loop]
    paths:
      - 'dev-hub/bin/logic-search-engine.py'
      - 'dev-hub/bin/ux-planning-engine.py'
      - 'dev-hub/bin/multi-agent-compromise-engine.py'
      - 'dev-hub/bin/compromise-release-gate.py'
      - 'dev-hub/bin/autonomous-project-orchestrator.py'
      - 'dev-hub/bin/architecture-decision-council.py'
      - 'dev-hub/config/logic-search.v1.json'
      - 'dev-hub/config/ux-planning.v1.json'
      - 'dev-hub/config/decision-challenge.v1.json'
      - 'dev-hub/config/compromise-release-gate.v1.json'
      - 'dev-hub/config/architecture-decision-council.v1.json'
      - 'dev-hub/config/guardian-role-contracts.v1.json'
      - 'dev-hub/config/guardian-coverage-manifest.v1.json'
      - 'dev-hub/config/project-control.v1.json'
      - 'dev-hub/config/sentinel-technical-policy.v1.json'
      - 'dev-hub/guardian/worker.js'
      - 'dev-hub/tests/test_v634_logic_ux_compromise_release.py'
      - 'dev-hub/tests/test_v633_five_agent_embedded_probes.py'
      - 'dev-hub/tests/test_v632_project_embedded_assurance.py'
      - 'dev-hub/tests/test_v631_assurance_exchange.py'
      - 'dev-hub/tests/test_v630_external_dual_assurance.py'
      - 'dev-hub/tests/test_v629_memory_guided_foundry_planning.py'
      - 'dev-hub/tests/test_v628_trusted_dispatch_lineage.py'
      - 'dev-hub/tests/test_v627_verified_evidence_learning.py'
      - 'dev-hub/tests/test_v623_contextual_memory_recall.py'
      - 'dev-hub/bin/install-v634-logic-ux-challenge-loop.sh'
      - '.github/workflows/dev-hub-v634-logic-ux-challenge-qualification.yml'
      - '.github/workflows/dev-hub-v634-logic-ux-challenge-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-hub-v634-logic-ux-challenge-loop
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static validation
        run: |
          set -euo pipefail
          node --check dev-hub/guardian/worker.js
          python3 -m py_compile             dev-hub/bin/logic-search-engine.py             dev-hub/bin/ux-planning-engine.py             dev-hub/bin/multi-agent-compromise-engine.py             dev-hub/bin/compromise-release-gate.py             dev-hub/bin/autonomous-project-orchestrator.py             dev-hub/bin/architecture-decision-council.py
          for f in             dev-hub/config/logic-search.v1.json             dev-hub/config/ux-planning.v1.json             dev-hub/config/decision-challenge.v1.json             dev-hub/config/compromise-release-gate.v1.json             dev-hub/config/architecture-decision-council.v1.json             dev-hub/config/guardian-role-contracts.v1.json             dev-hub/config/guardian-coverage-manifest.v1.json             dev-hub/config/project-control.v1.json; do
            python3 -m json.tool "$f" >/dev/null
          done
          if [ -f dev-hub/bin/install-v634-logic-ux-challenge-loop.sh ]; then
            bash -n dev-hub/bin/install-v634-logic-ux-challenge-loop.sh
          fi
          echo CHACHA_DEV_V634_STATIC=PASS

      - name: V6.34 logic UX compromise release
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v634_logic_ux_compromise_release.py

      - name: V6.33 five-agent probes regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v633_five_agent_embedded_probes.py

      - name: V6.32 embedded assurance regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v632_project_embedded_assurance.py

      - name: V6.31 Assurance Exchange regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v631_assurance_exchange.py

      - name: V6.30 dual assurance regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v630_external_dual_assurance.py

      - name: V6.29 memory guided Foundry regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v629_memory_guided_foundry_planning.py

      - name: V6.28 trusted dispatch regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v628_trusted_dispatch_lineage.py

      - name: V6.27 verified evidence regression
        env:
          CHACHA_DEV_TEST_TRUSTED_CONTEXT_BYPASS: '1'
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v627_verified_evidence_learning.py

      - name: V6.23 contextual recall regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v623_contextual_memory_recall.py

      - name: Qualification receipt
        run: |
          {
            echo CHACHA_DEV_LOGIC_UX_CHALLENGE_LOOP=V6.34
            echo RESULT=success
            echo SOURCE_REV="$(git rev-parse HEAD)"
            echo LOGICIAN_ADAPTIVE_SEARCH=YES
            echo ERGONOMIST_UX_CHALLENGE=YES
            echo CENTRAL_COMPROMISE_FIRST=YES
            echo AGENT_REVISION_ONLY_AFTER_FAILED_COMPROMISE=YES
            echo ARCHITECTURE_COUNCIL_CONSUMES_COMPROMISE=YES
            echo SEVEN_AGENT_RELEASE_GATE=YES
            echo MISSING_AGENT_FAIL_CLOSED=YES
            echo NO_MAJORITY_VOTE=YES
            echo CURRENT_PLAN_INCUMBENCY_PRIVILEGE=NO
            echo DIRECT_MUTATION=NO
            echo AUTOMATIC_EXTERNAL_SPEND_EUR=0
          } | tee /tmp/CHACHA_DEV_V634_RECEIPT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: chacha-dev-v634-logic-ux-challenge
          path: /tmp/CHACHA_DEV_V634_RECEIPT.txt
          retention-days: 30
