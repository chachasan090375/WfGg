name: ChaCha DEV V8.0.16 Timer Schedule Verification

on:
  push:
    branches:
      - dev-hub-v816-timer-schedule-verification
    paths:
      - 'dev-hub/bin/install-v816-dark-intelligence-retry-activation.sh'
      - 'dev-hub/tests/test_v816_timer_schedule_verification.py'
      - '.github/workflows/dev-hub-v816-timer-schedule-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: |
          set -euo pipefail
          bash -n dev-hub/bin/install-v816-dark-intelligence-retry-activation.sh
          python3 -m py_compile dev-hub/tests/test_v816_timer_schedule_verification.py
      - name: V8.0.16 qualification
        run: |
          set -euo pipefail
          python3 dev-hub/tests/test_v816_timer_schedule_verification.py | tee /tmp/v816.out
          grep -Fq 'CHACHA_DEV_V816_SYSTEMD255_TIMERS_MONOTONIC=PASS' /tmp/v816.out
          grep -Fq 'CHACHA_DEV_V816_REALTIME_COMPATIBILITY=PASS' /tmp/v816.out
          grep -Fq 'CHACHA_DEV_V816_FALSE_SCHEDULE_REJECTED=PASS' /tmp/v816.out
          grep -Fq 'CHACHA_DEV_V816_TRANSACTIONAL_ROLLBACK_PRESERVED=PASS' /tmp/v816.out
          grep -Fq 'CHACHA_DEV_V816_AUTOMATIC_EXTERNAL_SPEND_EUR=0' /tmp/v816.out
