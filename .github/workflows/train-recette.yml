name: Train full recette — exchange v14

on:
  push:
    branches: [exchange-fix]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-recette:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exchange-fix
      - name: Validate exchange v14 source
        run: |
          node --check frontend/_worker.js
          node --check .github/qa/train-recette-e2e.mjs
          node --check .github/qa/train-recette-extended.mjs
          node --check .github/qa/exchange-authority-recette.mjs
          grep -q 'WFGG_TRAIN_EXCHANGE_OWN_CANCEL_V2' frontend/_worker.js
          grep -q 'WFGG_TRAIN_SERVER_SCHEDULE_V1' frontend/_worker.js
          grep -q 'WFGG_TRAIN_MUTATE_REFRESH_GUARD_V1' frontend/_worker.js
          grep -q 'WFGG_TRAIN_EXCHANGE_ORPHAN_FALLBACK_V1' frontend/_worker.js
          grep -q 'wfgg_bridge=v14' frontend/_worker.js
          grep -q '/assets/wfgg-logo-mini.svg' frontend/_worker.js
      - name: Verify production backend authoritative schedule
        shell: bash
        run: |
          set -eu
          curl -fsSi 'https://wfgg-train.chachasan090375.workers.dev/api/health?exchange_v14=1' -o /tmp/backend-health.txt
          grep -iq '^x-wfgg-r3-cycle-model: v1' /tmp/backend-health.txt
          grep -iq '^x-wfgg-rotation-sequence-guard: v2' /tmp/backend-health.txt
      - name: Wait for Cloudflare exchange preview v14
        shell: bash
        run: |
          set -eu
          ROOT='https://exchange-fix.wfgg.pages.dev'
          ok=0
          for i in $(seq 1 50); do
            curl -fsSL "$ROOT/train/?recette=$i" -o /tmp/train.html || true
            if grep -Fq 'wfgg_bridge=v14' /tmp/train.html; then
              curl -fsSL "$ROOT/train/app.js?wfgg_bridge=v14&recette=$i" -o /tmp/app.js || true
              if grep -Fq 'state.__serverSchedule' /tmp/app.js && grep -Fq 'Joueur indisponible' /tmp/app.js && grep -Fq 'Retirer mon annonce' /tmp/app.js; then
                ok=1; break
              fi
            fi
            sleep 4
          done
          test "$ok" = 1
          node --check /tmp/app.js
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run primary browser recette
        env:
          WFGG_PREVIEW: https://exchange-fix.wfgg.pages.dev
        run: node .github/qa/train-recette-e2e.mjs
      - name: Run extended browser recette
        env:
          WFGG_PREVIEW: https://exchange-fix.wfgg.pages.dev
        run: node .github/qa/train-recette-extended.mjs
      - name: Run exchange authority recette
        env:
          WFGG_PREVIEW: https://exchange-fix.wfgg.pages.dev
        run: node .github/qa/exchange-authority-recette.mjs
