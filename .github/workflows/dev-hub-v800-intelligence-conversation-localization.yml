name: ChaCha DEV V8.0 Intelligence Conversation Localization

on:
  push:
    branches:
      - dev-hub-v800-intelligence-conversation-localization
    paths:
      - 'dev-hub/bin/dark-intelligence-agent.py'
      - 'dev-hub/bin/conversation-interface-agent.py'
      - 'dev-hub/bin/direct-operator-service.py'
      - 'dev-hub/config/dark-intelligence-agent.v1.json'
      - 'dev-hub/config/conversation-interface-agent.v1.json'
      - 'dev-hub/config/professional-localization.v1.json'
      - 'dev-hub/config/direct-operator.v1.json'
      - 'dev-hub/config/progress-reporting.v1.json'
      - 'dev-hub/config/agent-routing.v1.json'
      - 'dev-hub/config/domain-orchestration.v1.json'
      - 'dev-hub/direct-operator-ui/index.html'
      - 'dev-hub/tests/test_v800_intelligence_conversation_localization.py'
      - '.github/workflows/dev-hub-v800-intelligence-conversation-localization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile contracts
        run: |
          set -euo pipefail
          python3 -m py_compile             dev-hub/bin/dark-intelligence-agent.py             dev-hub/bin/conversation-interface-agent.py             dev-hub/bin/direct-operator-service.py             dev-hub/tests/test_v800_intelligence_conversation_localization.py
          python3 -m json.tool dev-hub/config/dark-intelligence-agent.v1.json >/dev/null
          python3 -m json.tool dev-hub/config/conversation-interface-agent.v1.json >/dev/null
          python3 -m json.tool dev-hub/config/professional-localization.v1.json >/dev/null
      - name: V8.0 qualification
        run: |
          set -euo pipefail
          python3 dev-hub/tests/test_v800_intelligence_conversation_localization.py | tee /tmp/v800.out
          grep -Fq 'CHACHA_DEV_V800_DARK_SOURCE_VERIFICATION_CHAIN=PASS' /tmp/v800.out
          grep -Fq 'CHACHA_DEV_V800_DARK_RAW_SOURCE_FACT_PROMOTION=NO' /tmp/v800.out
          grep -Fq 'CHACHA_DEV_V800_CONVERSATION_BRAIN_TO_HUMAN_PATH=PASS' /tmp/v800.out
          grep -Fq 'CHACHA_DEV_V800_CONVERSATION_DECISION_MODIFICATION=NO' /tmp/v800.out
          grep -Fq 'CHACHA_DEV_V800_PROFESSIONAL_LOCALIZATION=PASS' /tmp/v800.out
          grep -Fq 'CHACHA_DEV_V800_AUTOMATIC_EXTERNAL_SPEND_EUR=0' /tmp/v800.out
