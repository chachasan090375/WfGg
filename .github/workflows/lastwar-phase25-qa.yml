name: LastWar phase25 UnityFS metadata repair QA

on:
  workflow_dispatch:
  push:
    branches:
      - portal-auth-lastwar-lab-v1
    paths:
      - 'scripts/lastwar-phase25-unityfs-metadata-repair.sh'
      - '.github/workflows/lastwar-phase25-qa.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate shell syntax
        run: bash -n scripts/lastwar-phase25-unityfs-metadata-repair.sh
      - name: Validate embedded Python syntax
        run: |
          set -euo pipefail
          awk '/^cat > "\$PY" <<'"'"'PYEOF'"'"'$/{f=1;next} /^PYEOF$/{if(f){exit}} f{print}' scripts/lastwar-phase25-unityfs-metadata-repair.sh > /tmp/phase25.py
          python -m py_compile /tmp/phase25.py
      - name: Enforce offline and evidence contract
        run: |
          set -euo pipefail
          f=scripts/lastwar-phase25-unityfs-metadata-repair.sh
          grep -q 'OFFLINE ONLY' "$f"
          grep -q 'No Last War network connection' "$f"
          grep -q 'format_version_ge_7_align_header_to_16_before_blocks_info' "$f"
          grep -q 'unknown_hero_ids_are_not_guessed=true' "$f"
          grep -q 'decoded_template_row_with_explicit_id_and_name_or_localization_key' "$f"
          ! grep -Eq 'curl |wget |requests\.|urllib\.request|socket\.' "$f"
