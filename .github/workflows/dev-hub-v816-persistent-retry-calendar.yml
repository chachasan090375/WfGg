name: ChaCha DEV V8.0.16 Persistent Retry Calendar

on:
  push:
    branches:
      - dev-hub-v816-persistent-retry-calendar
    paths:
      - 'dev-hub/systemd/chacha-dev-dark-intelligence-analysis-retry.timer'
      - 'dev-hub/systemd/chacha-dev-dark-intelligence-corroboration-retry.timer'
      - 'dev-hub/bin/install-v816-dark-intelligence-retry-calendar.sh'
      - 'dev-hub/tests/test_v816_persistent_retry_calendar.py'
      - '.github/workflows/dev-hub-v816-persistent-retry-calendar.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and unit verification
        run: |
          set -euo pipefail
          bash -n dev-hub/bin/install-v816-dark-intelligence-retry-calendar.sh
          systemd-analyze verify             dev-hub/systemd/chacha-dev-dark-intelligence-analysis-retry.service             dev-hub/systemd/chacha-dev-dark-intelligence-analysis-retry.timer             dev-hub/systemd/chacha-dev-dark-intelligence-corroboration-retry.service             dev-hub/systemd/chacha-dev-dark-intelligence-corroboration-retry.timer
      - name: V8.0.16 qualification
        run: |
          set -euo pipefail
          python3 dev-hub/tests/test_v816_persistent_retry_calendar.py | tee /tmp/v816.out
          grep -Fq 'CHACHA_DEV_V816_RECURRING_CALENDAR_TIMER=PASS' /tmp/v816.out
          grep -Fq 'CHACHA_DEV_V816_NO_ELAPSED_MONOTONIC_TRAP=PASS' /tmp/v816.out
          grep -Fq 'CHACHA_DEV_V816_TIMER_RESTART_ON_INSTALL=PASS' /tmp/v816.out
          grep -Fq 'CHACHA_DEV_V816_TRANSACTIONAL_ROLLBACK_PRESERVED=PASS' /tmp/v816.out
          grep -Fq 'CHACHA_DEV_V816_AUTOMATIC_EXTERNAL_SPEND_EUR=0' /tmp/v816.out
      - name: Preserve V8.0.1 guarantees
        run: |
          set -euo pipefail
          python3 dev-hub/tests/test_v801_isolated_dark_intelligence_collector.py | tee /tmp/v801.out
          grep -Fq 'CHACHA_DEV_V801_RETRY_LOOP_BOUNDED=PASS' /tmp/v801.out
          grep -Fq 'CHACHA_DEV_V801_CORROBORATION_RETRY_NO_RECOLLECTION=PASS' /tmp/v801.out
          grep -Fq 'CHACHA_DEV_V801_AUTOMATIC_EXTERNAL_SPEND_EUR=0' /tmp/v801.out
