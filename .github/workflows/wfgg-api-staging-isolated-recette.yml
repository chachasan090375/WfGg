name: WfGg isolated staging Worker recette

on:
  push:
    branches:
      - connector-readonly-v1
    paths:
      - 'worker-staging/**'
      - 'worker/src/**'
      - 'lastwar-broker/**'
      - '.github/workflows/wfgg-api-staging-isolated-recette.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install isolated staging dependencies
        working-directory: worker-staging
        run: npm install --no-audit --no-fund

      - name: Stage canonical runtime
        working-directory: worker-staging
        run: npm run stage

      - name: Validate JavaScript
        working-directory: worker-staging
        run: npm run check

      - name: Validate external staging Worker bundle
        working-directory: worker-staging
        run: npx wrangler deploy --dry-run --outdir /tmp/wfgg-isolated-staging

      - name: Assert staging identity
        run: |
          set -euo pipefail
          grep -q '"name": "wfgg-api-staging"' worker-staging/wrangler.jsonc
          test -f worker-staging/src/lastwar-identity.js
          grep -q 'LASTWAR_BROKER_URL' worker-staging/src/lastwar-identity.js
          grep -q 'LASTWAR_BROKER_SHARED_SECRET' worker-staging/src/lastwar-identity.js
          ! grep -q '"containers"' worker-staging/wrangler.jsonc
          grep -q '"deleted_classes"' worker-staging/wrangler.jsonc
          grep -q 'LastWarUserContainer' worker-staging/wrangler.jsonc
          echo ISOLATED_STAGING_EXTERNAL_RECETTE_OK
