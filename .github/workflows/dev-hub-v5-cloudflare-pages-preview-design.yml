name: Dev Hub V5 Cloudflare Pages Preview Design

on:
  push:
    branches:
      - dev-hub-v5-cloudflare-pages-preview-contract
  pull_request:
    branches:
      - dev-hub-v5-playwright-external-preview

permissions:
  contents: read

jobs:
  cloudflare-pages-preview-design:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate design contract
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain > /tmp/git-before.txt
          python3 - <<'PY'
          from pathlib import Path
          compile(Path('dev-hub/bin/cloudflare-pages-preview-design-validate.py').read_text(), 'cloudflare-pages-preview-design-validate.py', 'exec')
          PY
          python3 dev-hub/bin/cloudflare-pages-preview-design-validate.py

      - name: Confirm no runtime or repository mutation
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain > /tmp/git-after.txt
          diff -u /tmp/git-before.txt /tmp/git-after.txt
          test ! -s /tmp/git-after.txt
          echo 'CLOUDFLARE_PAGES_PREVIEW_DESIGN_REPOSITORY_UNCHANGED=PASS'
          echo 'CLOUDFLARE_PAGES_PREVIEW_DESIGN_RUNTIME_EXECUTED=NO'
          echo 'CLOUDFLARE_PAGES_PREVIEW_DESIGN_PRODUCTION_TOUCHED=NO'
