name: Sentinel UI graphic V13.1

on:
  push:
    branches:
      - sentinel-ui-graphic-v13-1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sentinel-ui-graphic-v13-1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply graphic audit patch
        run: node scripts/patch-sentinel-ui-graphic-v13-1.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check frontend/train-native/app.v15.js
          node --check frontend/train-native/sentinel-train-v1.js
      - name: Validate V13.1 contract
        run: |
          grep -q 'WFGG_SENTINEL_UI_GRAPHIC_V13_1' frontend/train-native/app.v15.js
          grep -q "waitMs:3000,conditional:true" frontend/train-native/app.v15.js
          grep -q "graphicInfo=graphics.filter" frontend/train-native/app.v15.js
          grep -q "scrollIntoView" frontend/train-native/app.v15.js
          grep -q "Chaque contrôle est centré par scrollIntoView" frontend/train-native/sentinel-train-v1.js
      - name: Verify app checksum
        run: |
          cd frontend/train-native
          sha256sum -c app.v15.js.sha256
      - name: Commit generated runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/train-native/app.v15.js frontend/train-native/app.v15.js.sha256 frontend/train-native/sentinel-train-v1.js
          if git diff --cached --quiet; then
            echo 'No runtime changes'
          else
            git commit -m 'sentinel(v13.1): fix mobile graphic audit protocol'
            git push origin HEAD:sentinel-ui-graphic-v13-1
          fi
