name: ChaCha DEV V8.1.4 Voice Gateway

on:
  push:
    branches:
      - dev-hub-v814-voice-gateway
    paths:
      - 'android/chacha-direct-operator-widget/**'
      - 'dev-hub/direct-operator-ui/index.html'
      - 'dev-hub/config/voice-gateway.v1.json'
      - 'dev-hub/config/android-live-shell.v1.json'
      - 'dev-hub/config/direct-operator.v1.json'
      - 'dev-hub/config/guardian-role-contracts.v1.json'
      - 'dev-hub/config/assurance-agent-instrumentation.v1.json'
      - 'dev-hub/tests/test_v814_voice_gateway.py'
      - 'dev-hub/docs/VOICE_GATEWAY_V814.md'
      - '.github/workflows/dev-hub-v814-voice-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static validation
        run: |
          set -euo pipefail
          python3 -m py_compile dev-hub/tests/test_v814_voice_gateway.py
          python3 -m json.tool dev-hub/config/voice-gateway.v1.json >/dev/null
          python3 -m json.tool dev-hub/config/android-live-shell.v1.json >/dev/null
          python3 -m json.tool dev-hub/config/direct-operator.v1.json >/dev/null
          python3 -m json.tool dev-hub/config/guardian-role-contracts.v1.json >/dev/null
          python3 -m json.tool dev-hub/config/assurance-agent-instrumentation.v1.json >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          s=Path('dev-hub/direct-operator-ui/index.html').read_text()
          Path('/tmp/v814-ui.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/v814-ui.js

      - name: Voice Gateway qualification
        run: |
          set -euo pipefail
          python3 dev-hub/tests/test_v814_voice_gateway.py | tee /tmp/v814.out
          grep -Fq 'CHACHA_DEV_V814_ANDROID_STT=PASS' /tmp/v814.out
          grep -Fq 'CHACHA_DEV_V814_ANDROID_TTS=PASS' /tmp/v814.out
          grep -Fq 'CHACHA_DEV_V814_TURN_LOOP=PASS' /tmp/v814.out
          grep -Fq 'CHACHA_DEV_V814_MANUAL_BARGE_IN=PASS' /tmp/v814.out
          grep -Fq 'CHACHA_DEV_V814_AUTOMATIC_EXTERNAL_SPEND_EUR=0' /tmp/v814.out
      - name: Dual-channel regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v813_dual_channel.py | tee /tmp/v813.out
          grep -Fq 'CHACHA_DEV_V813_CONVERSATION_NO_BUILD_PIPELINE=PASS' /tmp/v813.out
          grep -Fq 'CHACHA_DEV_V813_BUILD_HANDOFF_EXPLICIT=PASS' /tmp/v813.out
          grep -Fq 'CHACHA_DEV_V813_GLOBAL_STOP_PRESERVED=PASS' /tmp/v813.out

      - name: Install Android SDK
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build and lint Android 0.7.0
        run: |
          set -euo pipefail
          gradle -p android/chacha-direct-operator-widget :app:assembleDebug :app:lintDebug
          APK=android/chacha-direct-operator-widget/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          echo CHACHA_DEV_V814_ANDROID_BUILD=PASS

      - uses: actions/upload-artifact@v4
        with:
          name: chacha-v814-voice-gateway-debug
          path: android/chacha-direct-operator-widget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Receipt
        run: |
          echo CHACHA_DEV_V814_VOICE_GATEWAY_QUALIFICATION=PASS
          echo ANDROID_VERSION_CODE=7
          echo ANDROID_VERSION_NAME=0.7.0
          echo MANUAL_BARGE_IN=YES
          echo AUTOMATIC_VAD_BARGE_IN=NO
          echo AUTOMATIC_EXTERNAL_SPEND_EUR=0
