name: ChaCha DEV Branch Foundry source integrator qualification

on:
  push:
    branches:
      - dev-hub-post-v730-universal-evolution-coverage-sync
    paths:
      - 'dev-hub/adapters/platform-component-branch-foundry-source-integrator.py'
      - 'dev-hub/config/platform-component-branch-foundry-source-integrator.v1.json'
      - 'dev-hub/tests/test_platform_component_branch_foundry_source_integrator.py'
      - '.github/workflows/dev-hub-platform-branch-foundry-source-integrator-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static validation
        run: |
          set -euo pipefail
          python3 -m py_compile dev-hub/adapters/platform-component-branch-foundry-source-integrator.py dev-hub/tests/test_platform_component_branch_foundry_source_integrator.py
          python3 -m json.tool dev-hub/config/platform-component-branch-foundry-source-integrator.v1.json >/dev/null
      - name: Isolated Git source integration qualification
        run: |
          set -euo pipefail
          python3 dev-hub/tests/test_platform_component_branch_foundry_source_integrator.py | tee /tmp/source-integrator.out
          grep -Fq 'CHACHA_DEV_BRANCH_FOUNDRY_SOURCE_INTEGRATOR=PASS' /tmp/source-integrator.out
          grep -Fq 'CHACHA_DEV_BRANCH_FOUNDRY_SOURCE_INTEGRATOR_DESCENDANT_REQUIRED=YES' /tmp/source-integrator.out
          grep -Fq 'CHACHA_DEV_BRANCH_FOUNDRY_SOURCE_INTEGRATOR_NAMESPACED_REF=PASS' /tmp/source-integrator.out
          grep -Fq 'CHACHA_DEV_BRANCH_FOUNDRY_SOURCE_INTEGRATOR_IDEMPOTENT=YES' /tmp/source-integrator.out
          grep -Fq 'CHACHA_DEV_BRANCH_FOUNDRY_SOURCE_INTEGRATOR_ROLLBACK=PASS' /tmp/source-integrator.out
          grep -Fq 'CHACHA_DEV_BRANCH_FOUNDRY_SOURCE_INTEGRATOR_BRANCH_MUTATION=NO' /tmp/source-integrator.out
          grep -Fq 'CHACHA_DEV_BRANCH_FOUNDRY_SOURCE_INTEGRATOR_PUSH=NO' /tmp/source-integrator.out
          grep -Fq 'CHACHA_DEV_BRANCH_FOUNDRY_SOURCE_INTEGRATOR_NETWORK=NO' /tmp/source-integrator.out
          grep -Fq 'CHACHA_DEV_BRANCH_FOUNDRY_SOURCE_INTEGRATOR_RUNTIME_MUTATION=NO' /tmp/source-integrator.out
          grep -Fq 'CHACHA_DEV_BRANCH_FOUNDRY_SOURCE_INTEGRATOR_PRODUCTION_ACTIVATION=NO' /tmp/source-integrator.out
          grep -Fq 'CHACHA_DEV_BRANCH_FOUNDRY_SOURCE_INTEGRATOR_AUTOMATIC_EXTERNAL_SPEND_EUR=0' /tmp/source-integrator.out
      - name: Receipt
        run: |
          echo CHACHA_DEV_BRANCH_FOUNDRY_SOURCE_INTEGRATOR_QUALIFICATION=PASS
          echo APPLY_MODE=SOURCE_RELEASE_CANDIDATE_INTEGRATION
          echo CANDIDATE_OWNER=BRANCH_FOUNDRY
          echo BARE_REPOSITORY_REQUIRED=YES
          echo WORKING_TREE_MUTATION=NO
          echo PRODUCTION_BRANCH_MUTATION=NO
          echo PUSH=NO
          echo NETWORK=NO
          echo ROLLBACK=REQUIRED
          echo AUTOMATIC_EXTERNAL_SPEND_EUR=0
          echo EXACT_SHA_CONVERGENCE=YES
