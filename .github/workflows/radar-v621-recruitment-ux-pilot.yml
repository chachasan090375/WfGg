name: Radar V6.21 Recruitment UX automated PILOT

on:
  push:
    branches: [radar-v621-recruitment-ux-filter-normalization]
    paths:
      - '.github/scripts/patch-radar-recruitment-filter-normalization-v621.py'
      - '.github/scripts/patch-radar-recruitment-ux-ui-worker-v621.py'
      - '.github/workflows/radar-v621-recruitment-ux-pilot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-v621-recruitment-ux-filter-normalization
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Require qualified V6.21 candidate
        run: |
          set -euo pipefail
          Q=radar-vps/V621_QUALIFICATION_RECEIPT.txt
          test -f "$Q"
          grep -Fq 'WFGG_RADAR_QUALIFICATION=V6.21' "$Q"
          grep -Fq 'RESULT=success' "$Q"
          grep -Fq 'COUNTRY_OPTIONS_SOURCE=LASTWAR_OBSERVED_VALUES' "$Q"
          grep -Fq 'GENERIC_WORLD_COUNTRY_LIST=NO' "$Q"
          grep -Fq 'LASTWAR_MODE=READ_ONLY' "$Q"
          grep -Fq 'TOKEN_PERSISTENCE=NO' "$Q"
          grep -Fq 'PRODUCTION_DEPLOYMENT=NO' "$Q"
          echo RADAR_V621_QUALIFICATION_GATE=PASS

      - name: Reconstruct exact V6.21 candidate
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar
          mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          echo '234df1dec57f6211bc625855bf13350c9f17fbd843fbe92d8cf1ab7cb5c081ef  /tmp/radar-src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar
          rm -rf /tmp/wfgg-radar/connector-go
          cp -a .radar-release-src/v2-source/connector-go /tmp/wfgg-radar/connector-go

          python3 .github/scripts/patch-radar-target-profile-retry.py
          python3 .github/scripts/patch-radar-federated-diagnostics-v65.py
          python3 .github/scripts/patch-player-scan-v3.py
          python3 .github/scripts/patch-player-scan-v4.py
          python3 .github/scripts/patch-radar-protocol-discovery-v67.py
          python3 .github/scripts/patch-radar-profile-isolation-v68.py
          python3 .github/scripts/patch-radar-native-profile-v69.py
          python3 .github/scripts/patch-radar-native-profile-handshake-v691.py
          python3 .github/scripts/patch-radar-native-profile-exec-v692.py
          python3 .github/scripts/patch-radar-connector-runtime-v693.py
          python3 .github/scripts/patch-radar-cluster-catalog-budget-v6192.py
          python3 .github/scripts/patch-radar-seed-scout-v6193.py
          python3 .github/scripts/patch-radar-autopilot-v6194.py
          python3 .github/scripts/patch-radar-autopilot-stale-cycle-v6197.py
          python3 .github/scripts/patch-radar-collector-cycle-terminalization-v6198.py
          python3 .github/scripts/patch-radar-autopilot-targeted-history-v6199.py
          python3 .github/scripts/patch-radar-autopilot-continue-partial-v61910.py

          install -m 0644 .radar-release-src/v2-source/src/game/remote-transport.js /tmp/wfgg-radar/src/game/remote-transport.js
          python3 .github/scripts/patch-radar-async-collector-worker.py
          python3 .github/scripts/patch-radar-worker-rich-profile-v6191.py
          python3 .github/scripts/patch-radar-worker-seed-scout-v6193.py
          python3 .github/scripts/patch-radar-worker-autopilot-v6194.py

          install -m 0644 radar-ui-live/live-radar.html /tmp/wfgg-radar/public/live-radar.html
          python3 .github/scripts/patch-live-radar-seed-scout-v6193.py
          python3 .github/scripts/patch-live-radar-autopilot-v6194.py
          python3 .github/scripts/patch-radar-session-keepalive-v6195.py
          python3 .github/scripts/patch-live-radar-autopilot-v6196.py
          python3 .github/scripts/patch-live-radar-autopilot-v6197.py
          python3 .github/scripts/patch-live-radar-autopilot-v6198.py
          python3 .github/scripts/patch-live-radar-autopilot-v6199.py
          python3 .github/scripts/patch-live-radar-autopilot-v61910.py
          python3 .github/scripts/patch-radar-manual-search-stop-v61911.py
          python3 .github/scripts/patch-radar-autopilot-no-rescan-qualified-v61912.py
          python3 .github/scripts/patch-live-radar-autopilot-v61912.py
          python3 .github/scripts/patch-radar-autopilot-persistent-ledger-v61913.py
          python3 .github/scripts/patch-live-radar-autopilot-v61913.py
          python3 .github/scripts/patch-radar-autopilot-coverage-completion-v61914.py
          python3 .github/scripts/patch-live-radar-autopilot-v61914.py
          python3 .github/scripts/patch-radar-worker-coverage-propagation-v61915.py
          python3 .github/scripts/patch-radar-autopilot-failure-scope-v61916.py
          python3 .github/scripts/patch-radar-autopilot-adaptive-verification-v61917.py
          python3 .github/scripts/patch-radar-worker-adaptive-verification-v61917.py
          python3 .github/scripts/patch-live-radar-adaptive-verification-v61917.py
          python3 .github/scripts/patch-radar-autopilot-ledger-confirmation-v620.py
          python3 .github/scripts/patch-radar-player-intelligence-connector-v620.py
          python3 .github/scripts/patch-radar-player-intelligence-ui-worker-v620.py
          python3 .github/scripts/patch-radar-recruitment-filter-normalization-v621.py
          python3 .github/scripts/patch-radar-recruitment-ux-ui-worker-v621.py
          echo RADAR_V621_PILOT_RECONSTRUCT=PASS

      - name: PILOT V6.21 country options and normalized recruitment filters
        working-directory: /tmp/wfgg-radar/connector-go
        run: |
          set -euo pipefail
          gofmt -w ./cmd ./internal
          go test ./cmd/radar-connector -run '^TestPlayerIntelligence.*V621$' -count=1 -v | tee /tmp/v621-pilot-intel.log
          python3 - <<'PY'
          from pathlib import Path
          log=Path('/tmp/v621-pilot-intel.log').read_text(encoding='utf-8')
          required=[
            'TestPlayerIntelligenceCountryOptionsAreGameObservedV621',
            'TestPlayerIntelligenceUnsupportedCountryIsGracefulV621',
            'TestPlayerIntelligenceNormalizedChipsV621',
            'TestPlayerIntelligenceIncludeAliasV621',
            'TestPlayerIntelligenceAliasSearchStillWorksV621',
          ]
          missing=[n for n in required if ('--- PASS: '+n) not in log]
          if missing:
              raise SystemExit('V621_PILOT_TESTS_MISSING='+','.join(missing))
          print('RADAR_V621_COUNTRY_AND_FILTERS=PASS')
          PY

      - name: PILOT preserve V6.20 ledger and Player Intelligence
        working-directory: /tmp/wfgg-radar/connector-go
        run: |
          set -euo pipefail
          go test ./cmd/radar-connector -run 'V620$' -count=1 -v | tee /tmp/v620-pilot-regression.log
          grep -Fq -- '--- PASS: TestAutopilotFullAfterPartialPersistsAndConfirmsV620' /tmp/v620-pilot-regression.log
          grep -Fq -- '--- PASS: TestAutopilotLedgerRetryableV620' /tmp/v620-pilot-regression.log
          grep -Fq -- '--- PASS: TestPlayerIntelligenceAliasSearchV620' /tmp/v620-pilot-regression.log
          grep -Fq -- '--- PASS: TestPlayerIntelligenceAllianceSearchV620' /tmp/v620-pilot-regression.log
          grep -Fq -- '--- PASS: TestPlayerIntelligenceRecruitmentFiltersV620' /tmp/v620-pilot-regression.log
          echo RADAR_V621_PRESERVE_V620=PASS

      - name: PILOT preserve Adaptive Verification 1x9/9
        working-directory: /tmp/wfgg-radar/connector-go
        run: |
          set -euo pipefail
          go test ./cmd/radar-connector -run '^TestAutopilotAdaptiveOneFullCycleConfirmsV61917$|^TestAutopilotAdaptivePartialDoesNotConfirmV61917$' -count=1 -v | tee /tmp/v61917-pilot.log
          grep -Fq -- '--- PASS: TestAutopilotAdaptiveOneFullCycleConfirmsV61917' /tmp/v61917-pilot.log
          grep -Fq -- '--- PASS: TestAutopilotAdaptivePartialDoesNotConfirmV61917' /tmp/v61917-pilot.log
          echo RADAR_V621_FAST_COVERAGE_ONE_FULL_9_OF_9=PASS
          echo RADAR_V621_PARTIAL_RETRY_ONLY=PASS

      - name: PILOT V6.21 UI Worker Connector contract
        run: |
          set -euo pipefail
          U=/tmp/wfgg-radar/public/live-radar.html
          W=/tmp/wfgg-radar/src/worker.js
          T=/tmp/wfgg-radar/src/game/remote-transport.js
          I=/tmp/wfgg-radar/connector-go/cmd/radar-connector/player_intelligence_v621.go
          node --check "$W"
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('/tmp/wfgg-radar/public/live-radar.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',h,re.S); assert m
          Path('/tmp/v621-pilot-ui.js').write_text(m.group(1),encoding='utf-8')
          markers=[
            'WFGG_RADAR_RECRUITMENT_UX_UI_V621',
            'PAYS PROPOSÉS PAR LAST WAR',
            'RECRUTEMENT FR',
            'data-kind="servers"',
            'data-kind="alliances"',
            'data-kind="players"',
            'INCLURE',
            'EXCLURE',
            'v621ParseMetric',
            'v621ApplyFRPreset',
            'Le filtre Pays n’est pas encore disponible',
            'fullCyclesPerCluster:1,adaptiveVerification:true,coverageMode:true',
          ]
          missing=[m for m in markers if m not in h]
          if 'FILTER_UNSUPPORTED_V620:country' in h:
              missing.append('raw-filter-error-visible')
          if missing:
              raise SystemExit('V621_UI_CONTRACT_MISSING='+','.join(missing))
          print('RADAR_V621_UI_CONTRACT=PASS')
          PY
          node --check /tmp/v621-pilot-ui.js
          grep -Fq 'WFGG_RADAR_RECRUITMENT_UX_WORKER_V621' "$W"
          grep -Fq 'tokenUsed: false' "$W"
          grep -Fq 'collectorPlayerIntelligenceV621' "$T"
          grep -Fq 'mode=ro' "$I"
          grep -Fq 'PRAGMA query_only=ON' "$I"
          grep -Fq 'lastwar-observed-values' "$I"
          echo RADAR_V621_UI_WORKER_CONNECTOR=PASS

      - name: PILOT full regression and digests
        working-directory: /tmp/wfgg-radar/connector-go
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o /tmp/radar-connector ./cmd/radar-connector
          python3 - <<'PY'
          from pathlib import Path
          b=Path('/tmp/radar-connector').read_bytes()
          markers=[
            b'v6.20.0',b'v6.21.0',b'ADAPTIVE_FAST',
            b'AUTOPILOT_LEDGER_PERSIST_FAILED_V620',
            b'/v1/collector/intelligence/search-v621',
            b'lastwar-observed-values',b'ignoredFilters',b'warnings',
            b'MANUAL_SEARCH_STOPPED',b'SEED_LOCAL_FAILURE_LIMIT',
          ]
          missing=[m.decode() for m in markers if m not in b]
          if missing:
              raise SystemExit('V621_PILOT_BINARY_MARKERS_MISSING='+','.join(missing))
          print('RADAR_V621_BINARY_REGRESSION=PASS')
          PY
          echo "RADAR_V621_PILOT_CONNECTOR_SHA256=$(sha256sum /tmp/radar-connector | awk '{print $1}')"
          echo "RADAR_V621_PILOT_WORKER_SHA256=$(sha256sum /tmp/wfgg-radar/src/worker.js | awk '{print $1}')"
          echo "RADAR_V621_PILOT_TRANSPORT_SHA256=$(sha256sum /tmp/wfgg-radar/src/game/remote-transport.js | awk '{print $1}')"
          echo "RADAR_V621_PILOT_UI_SHA256=$(sha256sum /tmp/wfgg-radar/public/live-radar.html | awk '{print $1}')"
          echo RADAR_V621_FULL_REGRESSION=PASS

      - name: Verify no game scan and no production deployment
        run: |
          set -euo pipefail
          C=.github/scripts/patch-radar-recruitment-filter-normalization-v621.py
          U=.github/scripts/patch-radar-recruitment-ux-ui-worker-v621.py
          ! grep -Fq 'ScanPlayerRegionDiagnosticOnServer' "$C"
          ! grep -Fq 'runCollectorSearch' "$C"
          ! grep -Fq 'getCredential' "$U"
          ! grep -Fq 'scanPlayer(' "$U"
          ! grep -REiq 'localStorage.*token|sessionStorage.*token|INSERT.*token|token.*INSERT|access_token' "$C" "$U"
          grep -Fq "mode=ro" "$C"
          grep -Fq "PRAGMA query_only=ON" "$C"
          grep -Fq "lastwar-observed-values" "$C"
          echo RADAR_V621_GAME_SCAN_EXECUTED=NO
          echo RADAR_V621_LASTWAR_MODE=READ_ONLY
          echo RADAR_V621_TOKEN_PERSISTENCE=NO
          echo RADAR_V621_PRODUCTION_DEPLOYMENT=NO
          echo RADAR_V621_PILOT=PASS

      - name: Record V6.21 PILOT receipt
        if: always()
        env:
          PILOT_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p radar-vps
          {
            echo "WFGG_RADAR_PILOT=V6.21"
            echo "RESULT=$PILOT_RESULT"
            echo "SOURCE_REV=$(git rev-parse HEAD)"
            echo "COUNTRY_OPTIONS_SOURCE=LASTWAR_OBSERVED_VALUES"
            echo "GENERIC_WORLD_COUNTRY_LIST=NO"
            echo "GAME_SCAN_EXECUTED=NO"
            echo "LASTWAR_MODE=READ_ONLY"
            echo "TOKEN_PERSISTENCE=NO"
            echo "PRODUCTION_DEPLOYMENT=NO"
            for F in /tmp/v621-pilot-intel.log /tmp/v620-pilot-regression.log /tmp/v61917-pilot.log; do
              if [ -f "$F" ]; then
                echo
                echo "===== $(basename "$F") ====="
                tail -n 100 "$F"
              fi
            done
          } > radar-vps/V621_PILOT_RECEIPT.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar-vps/V621_PILOT_RECEIPT.txt
          if ! git diff --cached --quiet; then
            git commit -m "ci(radar): record V6.21 PILOT $PILOT_RESULT [skip ci]"
            git push origin HEAD:radar-v621-recruitment-ux-filter-normalization
          fi
