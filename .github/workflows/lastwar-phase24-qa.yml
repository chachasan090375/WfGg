name: LastWar phase24 template source QA

on:
  workflow_dispatch:
  push:
    branches:
      - portal-auth-lastwar-lab-v1
    paths:
      - 'scripts/lastwar-phase24-template-source-discovery.sh'
      - '.github/workflows/lastwar-phase24-qa.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate shell syntax
        run: bash -n scripts/lastwar-phase24-template-source-discovery.sh
      - name: Validate embedded Python syntax
        run: |
          set -euo pipefail
          awk '/^cat > "\$PY" <<'"'"'PYEOF'"'"'$/{f=1;next} /^PYEOF$/{if(f){exit}} f{print}' scripts/lastwar-phase24-template-source-discovery.sh > /tmp/phase24.py
          python -m py_compile /tmp/phase24.py
      - name: Enforce offline and exact-mapping contract
        run: |
          set -euo pipefail
          f=scripts/lastwar-phase24-template-source-discovery.sh
          grep -q 'OFFLINE ONLY' "$f"
          grep -q 'no Last War network connection' "$f"
          grep -q 'HeroTemplateManager' "$f"
          grep -q 'DominatorMainTemplate' "$f"
          grep -q 'unknown_hero_ids_are_not_guessed=true' "$f"
          ! grep -Eq 'curl |wget |requests\.|urllib\.request|socket\.' "$f"
