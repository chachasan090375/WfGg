name: Simulator hero roster v13

on:
  push:
    branches:
      - simulator-standalone-v1
    paths:
      - '.github/workflows/simulator-hero-roster-v13.yml'

permissions:
  contents: write

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simulator-standalone-v1
          fetch-depth: 0
      - name: Validate source
        run: node --check simulator/hero-roster-uniform-v13.js
      - name: Wire V13
        run: python3 .github/scripts/patch-simulator-hero-roster-v13.py
      - name: Validate bundle
        run: |
          node --check frontend/simulator/hero-roster-uniform-v13.js
          grep -Fq 'hero-roster-uniform-v13.css?v=013-uniform-motion' simulator/index.html
          grep -Fq 'hero-roster-uniform-v13.js?v=013-uniform-motion' frontend/simulator/index.html
      - name: Commit wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulator/index.html simulator/UI_VERSION.txt frontend/simulator/index.html frontend/simulator/hero-roster-uniform-v13.js frontend/simulator/hero-roster-uniform-v13.css
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'simulator: enable uniform hero roster v13'
            git fetch origin simulator-standalone-v1
            git rebase origin/simulator-standalone-v1
            git push origin HEAD:simulator-standalone-v1
          fi
      - name: Wait for Cloudflare V13
        shell: bash
        run: |
          set -euo pipefail
          ROOT='https://simulator-standalone-v1.wfgg.pages.dev/simulator'
          for i in $(seq 1 60); do
            curl -fsSL "$ROOT/?hero_v13=$i" -o /tmp/index.html || true
            if grep -Fq 'hero-roster-uniform-v13.js?v=013-uniform-motion' /tmp/index.html && grep -Fq 'hero-roster-uniform-v13.css?v=013-uniform-motion' /tmp/index.html; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Android uniform crop and motion recette
        run: |
          node <<'JS'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:2,locale:'fr-FR'});
              const page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(String(e)));
              await page.goto('https://simulator-standalone-v1.wfgg.pages.dev/simulator/?hero_v13_e2e=1',{waitUntil:'networkidle',timeout:60000});
              const cards=page.locator('.game-hero-card');await cards.first().waitFor({state:'visible',timeout:30000});assert.equal(await cards.count(),31);
              await page.waitForFunction(()=>[...document.querySelectorAll('.game-hero-card')].every(c=>c.dataset.wfggV13Crop),{timeout:5000});
              const murphy=page.locator('.game-hero-card[data-hero-id="murphy"]');assert.equal(await murphy.evaluate(el=>el.style.getPropertyValue('--wfgg-v13-y')),'-13%');assert.equal(await murphy.evaluate(el=>el.style.getPropertyValue('--wfgg-v13-zoom')),'1.3');
              const initialShadow=await page.locator('.game-hero-card.rarity-UR').first().evaluate(el=>getComputedStyle(el).boxShadow);
              const states=[];
              await page.exposeFunction('v13Phase',x=>states.push(x));
              await page.evaluate(()=>new MutationObserver(()=>window.v13Phase({phase:document.documentElement.dataset.wfggV13Phase,count:document.querySelectorAll('.wfgg-v13-live').length})).observe(document.documentElement,{attributes:true,attributeFilter:['data-wfgg-v13-phase']}));
              await page.waitForFunction(()=>[...document.querySelectorAll('.game-hero-card')].every(c=>c.dataset.wfggV13Seen==='1'),{timeout:22000});
              const seen=await page.locator('.game-hero-card[data-wfgg-v13-seen="1"]').count();assert.equal(seen,31);
              const live=page.locator('.game-hero-card.wfgg-v13-live').first();if(await live.count()){const anim=await live.locator('.hero-card-portrait img').evaluate(el=>getComputedStyle(el).animationName);assert.match(anim,/wfgg-v13-character-live/)}
              const finalShadow=await page.locator('.game-hero-card.rarity-UR').first().evaluate(el=>getComputedStyle(el).boxShadow);assert.equal(finalShadow,initialShadow);
              assert.ok(states.some(x=>x.phase==='rest'&&x.count===0),'no fully-resting gap detected');
              const legacy=await page.locator('.game-hero-card.wfgg-v10-live,.game-hero-card.wfgg-v12-live').count();assert.equal(legacy,0);
              const metric=await page.evaluate(()=>({w:innerWidth,sw:(document.scrollingElement||document.documentElement).scrollWidth}));assert.ok(metric.sw<=metric.w+2);
              assert.equal(errors.length,0,errors.join(' | '));
              console.log(JSON.stringify({ok:true,cards:31,seen,restGap:true,murphy:'-13% / 1.30',metric},null,2));
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
