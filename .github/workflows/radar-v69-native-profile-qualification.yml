name: Radar V6.9 native profile qualification

on:
  push:
    branches: [radar-v69-native-profiles]
    paths:
      - '.github/scripts/patch-radar-native-profile-v69.py'
      - '.github/workflows/radar-v69-native-profile-qualification.yml'
      - '.radar-release-src/v69-source/**'
      - 'docs/RADAR_NATIVE_PROFILE_V69.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wfgg-radar-v69-native-profile-qualification
  cancel-in-progress: true

env:
  LASTWAR_CLIENT_REF: ee5f64de160a8051c2f9f98189b75038dd225a0a

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Reconstruct current Radar connector
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar
          mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          echo '234df1dec57f6211bc625855bf13350c9f17fbd843fbe92d8cf1ab7cb5c081ef  /tmp/radar-src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar
          rm -rf /tmp/wfgg-radar/connector-go
          cp -a .radar-release-src/v2-source/connector-go /tmp/wfgg-radar/connector-go
          python3 .github/scripts/patch-radar-target-profile-retry.py
          python3 .github/scripts/patch-radar-federated-diagnostics-v65.py
          python3 .github/scripts/patch-player-scan-v3.py
          python3 .github/scripts/patch-player-scan-v4.py
          python3 .github/scripts/patch-radar-protocol-discovery-v67.py
          python3 .github/scripts/patch-radar-profile-isolation-v68.py

      - name: Apply V6.9 native profile bridge
        run: |
          set -euo pipefail
          python3 .github/scripts/patch-radar-native-profile-v69.py
          grep -Fq 'WFGG_RADAR_NATIVE_PROFILE_MAIN_V69' /tmp/wfgg-radar/connector-go/native-template/main.go
          grep -Fq 'WFGG_RADAR_NATIVE_PROFILE_BRIDGE_V69' /tmp/wfgg-radar/connector-go/internal/protocol/region_scan.go
          grep -Fq 'WFGG_RADAR_NATIVE_PROFILE_V69' /tmp/wfgg-radar/connector-go/native-template/profile_scan_v69.go
          grep -Fq -- '--scan-profiles' /tmp/wfgg-radar/connector-go/internal/protocol/profile_scan_v69.go
          ! grep -Fq '"@profile:"+strings.Join' /tmp/wfgg-radar/connector-go/internal/protocol/region_scan.go
          echo RADAR_V69_NATIVE_PROFILE=STAGED

      - name: Test connector bridge
        working-directory: /tmp/wfgg-radar/connector-go
        run: |
          set -euo pipefail
          gofmt -w ./cmd ./internal
          go test ./...
          go vet ./...
          go build ./cmd/radar-connector
          echo RADAR_V69_CONNECTOR=PASS

      - name: Test and build native profile helper
        run: |
          set -euo pipefail
          rm -rf /tmp/lastwar-client
          git clone --quiet --filter=blob:none --no-checkout https://github.com/ljagiello/lastwar-client.git /tmp/lastwar-client
          cd /tmp/lastwar-client
          git fetch --quiet --depth 1 origin "$LASTWAR_CLIENT_REF"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$LASTWAR_CLIENT_REF"
          go test ./internal/auth ./internal/pcap ./internal/sfs
          mkdir -p cmd/wfgg-radar-native-template
          cp /tmp/wfgg-radar/connector-go/native-template/main.go cmd/wfgg-radar-native-template/main.go
          cp /tmp/wfgg-radar/connector-go/native-template/player_scan_v3.go cmd/wfgg-radar-native-template/player_scan_v3.go
          cp /tmp/wfgg-radar/connector-go/native-template/player_scan_v4.go cmd/wfgg-radar-native-template/player_scan_v4.go
          cp /tmp/wfgg-radar/connector-go/native-template/profile_scan_v69.go cmd/wfgg-radar-native-template/profile_scan_v69.go
          cp /tmp/wfgg-radar/connector-go/native-template/profile_scan_v69_test.go cmd/wfgg-radar-native-template/profile_scan_v69_test.go
          gofmt -w cmd/wfgg-radar-native-template/*.go
          go test -tags lastwar_native_template ./cmd/wfgg-radar-native-template
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags lastwar_native_template -trimpath -ldflags='-s -w' -o /tmp/radar-native-template-v69 ./cmd/wfgg-radar-native-template
          test -s /tmp/radar-native-template-v69
          strings /tmp/radar-native-template-v69 > /tmp/radar-native-template-v69.strings
          grep -Fq -- '--scan-profiles' /tmp/radar-native-template-v69.strings
          grep -Fq 'get.user.info.multi' /tmp/radar-native-template-v69.strings
          echo RADAR_V69_NATIVE_HELPER=PASS

      - name: Validate profile-only safety boundary
        run: |
          set -euo pipefail
          grep -Fq 'get.user.info.multi' /tmp/wfgg-radar/connector-go/native-template/profile_scan_v69.go || true
          ! grep -REq 'building\.production\.collect|mail\.reward|al\.science\.donate|visitor\.operate|attack|march|purchase' .radar-release-src/v69-source/connector-go
          ! grep -REq 'fmt\.Print|log\.Print|slog\.' .radar-release-src/v69-source/connector-go/internal/protocol/profile_scan_v69.go
          grep -Fq 'never routes profile UIDs through the map/player search path' .radar-release-src/v69-source/connector-go/native-template/profile_scan_v69.go
          echo RADAR_V69_READONLY_PRIVACY=PASS

      - name: Confirm production untouched
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'radar-v69-native-profiles'
          git diff --quiet
          echo RADAR_PRODUCTION_MUTATION=NO
