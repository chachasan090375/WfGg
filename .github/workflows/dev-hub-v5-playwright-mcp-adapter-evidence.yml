name: Dev Hub V5 Playwright MCP Adapter Evidence

on:
  workflow_dispatch:
  push:
    branches:
      - dev-hub-v5-playwright-mcp-adapter-contract
    paths:
      - 'dev-hub/evidence/playwright-mcp-adapter-contract-2026-09-16.json'
      - 'dev-hub/adapters/playwright-mcp-adapter.py'
      - '.github/workflows/dev-hub-v5-playwright-mcp-adapter-evidence.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate committed adapter evidence
        run: |
          python -m json.tool dev-hub/evidence/playwright-mcp-adapter-contract-2026-09-16.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('dev-hub/evidence/playwright-mcp-adapter-contract-2026-09-16.json').read_text())
          assert e['schema']=='chacha.dev/playwright-mcp-adapter-contract-evidence/v1'
          assert e['provider']=='playwright-mcp'
          assert e['adapter']=='playwright-mcp-adapter'
          assert e['adapter_status']=='CONTRACT_OK'
          assert e['contract']['input']=='chacha.dev/dispatch-envelope/v1'
          assert e['contract']['output']=='chacha.dev/task-result/v1'
          assert e['contract']['permission']=='read'
          assert e['contract']['caller_selects_mcp_tool'] is False
          assert e['contract']['compatibility_mode']=='EXPLICIT_PROVIDER_COMPATIBILITY'
          expected=[
            'browser_navigate','browser_snapshot','browser_console_messages','browser_network_requests','browser_close'
          ]
          assert e['contract']['fixed_tool_sequence']==expected
          assert e['runtime_result']['called_tools']==expected
          assert e['runtime_result']['status']=='OK'
          assert e['runtime_result']['verification_status']=='UNVERIFIED'
          assert e['runtime_result']['evidence_source']=='http://127.0.0.1:18765/'
          assert '?' not in e['runtime_result']['evidence_source']
          assert all(v=='PASS' for v in e['checks'].values())
          assert e['workflow']['run_id']==35090712764
          assert e['workflow']['conclusion']=='success'
          assert e['workflow']['artifact_id']==10443543496
          assert e['workflow']['artifact_digest']=='sha256:2da5fd8b9e0ff62a93a5bbd2734f5263d7ab23620ffe0befa3bc87166034deeb'
          assert e['promotion']['automatic'] is False
          assert e['promotion']['provider_status_changed'] is False
          print('PLAYWRIGHT_MCP_ADAPTER_EVIDENCE=PASS')
          PY

      - name: Confirm adapter does not expose direct tool choice in metadata contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('dev-hub/adapters/playwright-mcp-adapter.py').read_text()
          assert 'ALLOWED_METADATA_KEYS = {"operation", "url", "expected_text"}' in text
          assert '"tool_name"' in text and 'DENIED_INPUT_KEYS' in text
          assert 'browser_run_code_unsafe' not in text.split('SAFE_TOOLS =',1)[1].split(')',1)[0]
          assert 'shell=False' in text
          print('PLAYWRIGHT_MCP_ADAPTER_DIRECT_TOOL_CONTROL=DENIED')
          PY
