name: Radar V6.19.7 stale-cycle recovery qualification

on:
  push:
    branches: [radar-v6197-autopilot-stale-cycle-recovery]
    paths:
      - '.radar-release-src/v2-source/connector-go/**'
      - '.radar-release-src/v6194-source/**'
      - '.radar-release-src/v6197-source/**'
      - '.github/scripts/patch-radar-autopilot-stale-cycle-v6197.py'
      - '.github/scripts/patch-live-radar-autopilot-v6197.py'
      - '.github/workflows/radar-v6197-autopilot-stale-cycle-recovery-qualification.yml'
      - 'radar-vps/install-v6197-pilot.sh'
      - 'radar-vps/probe-v6197-pilot-runtime.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wfgg-radar-v6197-autopilot
  cancel-in-progress: true

env:
  EXPECTED_CONNECTOR_SHA256: ccbb1a178212d3137136fff30c31725b88a7e3a8113dca922138018186a158d5
  EXPECTED_NATIVE_SHA256: 274d040f5294cb09422e5d55cc4b5335ac7739924c33dcb67b3f279645814900

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-v6197-autopilot-stale-cycle-recovery

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Reconstruct cumulative V6.19.7 candidate
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar
          mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          echo '234df1dec57f6211bc625855bf13350c9f17fbd843fbe92d8cf1ab7cb5c081ef  /tmp/radar-src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar
          rm -rf /tmp/wfgg-radar/connector-go
          cp -a .radar-release-src/v2-source/connector-go /tmp/wfgg-radar/connector-go

          python3 .github/scripts/patch-radar-target-profile-retry.py
          python3 .github/scripts/patch-radar-federated-diagnostics-v65.py
          python3 .github/scripts/patch-player-scan-v3.py
          python3 .github/scripts/patch-player-scan-v4.py
          python3 .github/scripts/patch-radar-protocol-discovery-v67.py
          python3 .github/scripts/patch-radar-profile-isolation-v68.py
          python3 .github/scripts/patch-radar-native-profile-v69.py
          python3 .github/scripts/patch-radar-native-profile-handshake-v691.py
          python3 .github/scripts/patch-radar-native-profile-exec-v692.py
          python3 .github/scripts/patch-radar-connector-runtime-v693.py
          python3 .github/scripts/patch-radar-cluster-catalog-budget-v6192.py
          python3 .github/scripts/patch-radar-seed-scout-v6193.py
          python3 .github/scripts/patch-radar-autopilot-v6194.py
          python3 .github/scripts/patch-radar-autopilot-stale-cycle-v6197.py

          install -m 0644 .radar-release-src/v2-source/src/game/remote-transport.js /tmp/wfgg-radar/src/game/remote-transport.js
          python3 .github/scripts/patch-radar-async-collector-worker.py
          python3 .github/scripts/patch-radar-worker-rich-profile-v6191.py
          python3 .github/scripts/patch-radar-worker-seed-scout-v6193.py
          python3 .github/scripts/patch-radar-worker-autopilot-v6194.py

          install -m 0644 radar-ui-live/live-radar.html /tmp/wfgg-radar/public/live-radar.html
          python3 .github/scripts/patch-live-radar-seed-scout-v6193.py
          python3 .github/scripts/patch-live-radar-autopilot-v6194.py
          python3 .github/scripts/patch-radar-session-keepalive-v6195.py
          python3 .github/scripts/patch-live-radar-autopilot-v6196.py
          python3 .github/scripts/patch-live-radar-autopilot-v6197.py

          grep -Fq 'WFGG_RADAR_AUTOPILOT_STALE_CYCLE_RECOVERY_V6197' /tmp/wfgg-radar/connector-go/cmd/radar-connector/collector_stale_cycle_v6197.go
          grep -Fq 'WFGG_RADAR_AUTOPILOT_STALE_CYCLE_RECOVERY_V6197' /tmp/wfgg-radar/connector-go/cmd/radar-connector/server_autopilot_v6194.go
          grep -Fq 'WFGG_RADAR_AUTOPILOT_STALE_CYCLE_RECOVERY_UI_V6197' /tmp/wfgg-radar/public/live-radar.html
          echo RADAR_V6197_RECONSTRUCT=PASS

      - name: Test, vet and build connector
        working-directory: /tmp/wfgg-radar/connector-go
        run: |
          set -euo pipefail
          gofmt -w ./cmd ./internal
          go test ./...
          go vet ./...
          mkdir -p "$GITHUB_WORKSPACE/radar-vps/pilot-v6197"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o "$GITHUB_WORKSPACE/radar-vps/pilot-v6197/radar-connector" ./cmd/radar-connector
          actual="$(sha256sum "$GITHUB_WORKSPACE/radar-vps/pilot-v6197/radar-connector" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_CONNECTOR_SHA256"
          echo "RADAR_V6197_CONNECTOR_SHA256=$actual"
          grep -aFq 'v6.19.7' "$GITHUB_WORKSPACE/radar-vps/pilot-v6197/radar-connector"
          grep -aFq 'STALE_RUNNING_CYCLE_RECOVERED_V6197' "$GITHUB_WORKSPACE/radar-vps/pilot-v6197/radar-connector"
          echo RADAR_V6197_CONNECTOR=PASS

      - name: Verify stale-cycle safety contract
        run: |
          set -euo pipefail
          C=/tmp/wfgg-radar/connector-go/cmd/radar-connector/collector_stale_cycle_v6197.go
          J=/tmp/wfgg-radar/connector-go/cmd/radar-connector/collector_jobs.go
          A=/tmp/wfgg-radar/connector-go/cmd/radar-connector/server_autopilot_v6194.go
          grep -Fq 'collectorStaleCycleThresholdV6197 = 15 * time.Minute' "$C"
          grep -Fq 'collectorCycleStaleByStartedAtV6197' "$C"
          grep -Fq 'STALE_RUNNING_CYCLE_RECOVERED_V6197' "$C"
          grep -Fq 'collectorStartCycleWithStaleRecoveryV6197(ctx, query)' "$J"
          grep -Fq 'recovery fails closed and the pre-V6.19.7' "$C"
          grep -Eq 'autopilotVersionV6194[[:space:]]*=[[:space:]]*"v6\.19\.7"' "$A"
          grep -Fq 'AUTOPILOT_CONSECUTIVE_FAILURE_LIMIT' "$A"
          grep -Fq 'AUTOPILOT_AUTH_FAILED' "$A"
          grep -Fq 'AUTOPILOT_NO_DATA' "$A"
          grep -Fq 'SEED_SKIPPED_NO_DATA' "$A"
          echo RADAR_V6197_STALE_CYCLE_RECOVERY=PASS
          echo RADAR_V6197_GLOBAL_FAILURE_GUARDS=PRESERVED
          echo RADAR_V6196_NO_DATA_CONTINUE_REGRESSION=PASS

      - name: Verify UI and keepalive regression
        run: |
          set -euo pipefail
          node --check /tmp/wfgg-radar/src/worker.js
          U=/tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'AUTOPILOT V6.19.7 · ARRÊTÉ' "$U"
          grep -Fq 'cycles Collector stale récupérés' "$U"
          grep -Fq 'SEED_SKIPPED_NO_DATA' "$U"
          grep -Fq 'AUTO 12H' "$U"
          grep -Fq '/api/auth/session/refresh' /tmp/wfgg-radar/src/worker.js
          echo RADAR_V6197_UI=PASS
          echo RADAR_V6195_SESSION_KEEPALIVE_REGRESSION=PASS

      - name: Verify unchanged native helper and Last War read-only safety
        run: |
          set -euo pipefail
          actual="$(sha256sum radar-vps/release/radar-native-template | awk '{print $1}')"
          test "$actual" = "$EXPECTED_NATIVE_SHA256"
          ! grep -REiq 'building\.production\.collect|mail\.reward|al\.science\.donate|visitor\.operate|march|attack|purchase'             .radar-release-src/v2-source/connector-go .radar-release-src/v6194-source
          echo "RADAR_V6197_NATIVE_SHA256=$actual"
          echo RADAR_V6197_NATIVE_CHANGE=NO
          echo RADAR_V6197_LASTWAR_MUTATION=NO
          echo RADAR_V6197_COLLECTOR_STALE_RECOVERY_MUTATION=YES

      - name: Verify pilot installer and guard-only probe
        run: |
          set -euo pipefail
          bash -n radar-vps/install-v6197-pilot.sh
          bash -n radar-vps/probe-v6197-pilot-runtime.sh
          grep -Fq 'WFGG_RADAR_PILOT=V6.19.7' radar-vps/install-v6197-pilot.sh
          grep -Fq "$EXPECTED_CONNECTOR_SHA256" radar-vps/probe-v6197-pilot-runtime.sh
          grep -Fq 'GAME_TOKEN_REQUIRED' radar-vps/probe-v6197-pilot-runtime.sh
          grep -Fq 'RADAR_V6197_GAME_SCAN_EXECUTED=NO' radar-vps/probe-v6197-pilot-runtime.sh
          grep -Fq 'RADAR_V6197_COLLECTOR_MUTATION=NO' radar-vps/probe-v6197-pilot-runtime.sh
          echo RADAR_V6197_PILOT_GUARD_PROBE=PASS

      - name: Publish qualified V6.19.7 pilot artifacts
        run: |
          set -euo pipefail
          install -m 0755 radar-vps/release/radar-native-template radar-vps/pilot-v6197/radar-native-template
          actual_native="$(sha256sum radar-vps/pilot-v6197/radar-native-template | awk '{print $1}')"
          test "$actual_native" = "$EXPECTED_NATIVE_SHA256"
          chmod 0755 radar-vps/pilot-v6197/radar-connector radar-vps/pilot-v6197/radar-native-template
          (
            cd radar-vps/pilot-v6197
            sha256sum radar-connector radar-native-template > SHA256SUMS
          )
          grep -Fq "$EXPECTED_CONNECTOR_SHA256  radar-connector" radar-vps/pilot-v6197/SHA256SUMS
          grep -Fq "$EXPECTED_NATIVE_SHA256  radar-native-template" radar-vps/pilot-v6197/SHA256SUMS
          {
            echo "WFGG_RADAR_PILOT=V6.19.7"
            echo "SOURCE_BRANCH=radar-v6197-autopilot-stale-cycle-recovery"
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "CHANGE=autopilot-stale-cycle-recovery"
            echo "STALE_CYCLE_RECOVERY=YES"
            echo "STALE_THRESHOLD_MINUTES=15"
            echo "STALE_RESULT=FAILED_NOT_CONFIRMED"
            echo "NO_DATA_CONTINUE_PRESERVED=YES"
            echo "GLOBAL_FAILURE_GUARDS=PRESERVED"
            echo "LASTWAR_MUTATION=NO"
            echo "COLLECTOR_MUTATION=YES"
            echo "TOKEN_PERSISTENCE=NO"
          } > radar-vps/pilot-v6197/PILOT_INFO.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar-vps/pilot-v6197
          if git diff --cached --quiet; then
            echo RADAR_V6197_PILOT=UNCHANGED
            exit 0
          fi
          git commit -m 'build(radar): publish V6.19.7 stale-cycle recovery pilot'
          git push origin HEAD:radar-v6197-autopilot-stale-cycle-recovery
          echo RADAR_V6197_PILOT=PUBLISHED
