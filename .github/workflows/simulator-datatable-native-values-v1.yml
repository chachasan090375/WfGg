name: Simulator DataTable native hero values v1

on:
  push:
    branches: [simulator-standalone-v1]
    paths: ['.github/workflows/simulator-datatable-native-values-v1.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simulator-standalone-v1
          fetch-depth: 0

      - name: Download verified client and embedded DataTable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lw/xapk /tmp/lw/decompiled simulator/research
          url='https://d.apkpure.net/b/XAPK/com.fun.lastwar.gp?versionCode=1864'
          curl -fL --retry 2 --connect-timeout 20 --max-time 900 "$url" -o /tmp/lw/current.xapk
          python3 - <<'PY'
          import json,zipfile,pathlib,hashlib,re
          root=pathlib.Path('/tmp/lw'); p=root/'current.xapk'
          with zipfile.ZipFile(p) as z:
              manifests=[n for n in z.namelist() if pathlib.PurePosixPath(n).name.lower() in ('manifest.json','xapk_manifest.json')]
              if not manifests: raise SystemExit('No XAPK manifest')
              d=json.loads(z.read(manifests[0]).decode('utf-8','replace'))
          package=str(d.get('package_name') or d.get('packageName') or d.get('package') or '')
          vname=str(d.get('version_name') or d.get('versionName') or '')
          vcode=str(d.get('version_code') or d.get('versionCode') or '')
          if (package,vname,vcode) != ('com.fun.lastwar.gp','1.0.359','1864'):
              raise SystemExit(f'Unexpected XAPK metadata: {(package,vname,vcode)}')
          print(json.dumps({'package':package,'versionName':vname,'versionCode':vcode,'sha1':hashlib.sha1(p.read_bytes()).hexdigest()}))
          PY
          unzip -q /tmp/lw/current.xapk -d /tmp/lw/xapk
          python3 - <<'PY'
          import pathlib,zipfile,re,hashlib,json
          root=pathlib.Path('/tmp/lw')
          found=None; version_text=None
          for apk in sorted((root/'xapk').rglob('*.apk'),key=lambda p:p.stat().st_size,reverse=True):
              try:
                  with zipfile.ZipFile(apk) as z:
                      names=z.namelist()
                      table_names=[n for n in names if re.search(r'(^|/)assets/table/table_.*\.data$',n,re.I)]
                      if table_names:
                          n=table_names[0]; data=z.read(n); (root/'table.data').write_bytes(data)
                          vn=next((x for x in names if x.lower().endswith('/assets/table/version') or x.lower()=='assets/table/version'),None)
                          if vn:
                              version_text=z.read(vn).decode('utf-8','replace').strip()
                          found={'apk':apk.name,'path':n,'bytes':len(data),'md5':hashlib.md5(data).hexdigest(),'sha256':hashlib.sha256(data).hexdigest(),'versionManifest':version_text}
                          break
              except zipfile.BadZipFile:
                  pass
          if not found: raise SystemExit('Embedded DataTable not found')
          (root/'source-meta.json').write_text(json.dumps(found,indent=2)+'\n')
          print(json.dumps(found,indent=2))
          PY

      - name: Build Last War compatible unluac and ensure Lua 5.3
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v lua5.3 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq lua5.3
          fi
          git clone --depth=1 https://github.com/HansWessels/unluac.git /tmp/unluac >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/unluac/src/unluac/parse/LHeaderType.java')
          s=p.read_text()
          s=s.replace('if(format != 0) {','if(format != 0 && format != 1) {',1)
          marker='class LHeaderType53 extends LHeaderType {'
          pos=s.index(marker); head,tail=s[:pos],s[pos:]
          old='    parse_instruction_size(buffer, header, s);'
          if old not in tail: raise SystemExit('Lua53 instruction size call not found')
          tail=tail.replace(old,'    if(s.format != 1) parse_instruction_size(buffer, header, s);',1)
          p.write_text(head+tail)
          PY
          cd /tmp/unluac
          bash build.sh >/dev/null
          test -s bin/unluac.jar

      - name: Decompile target tables
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,zipfile,re,subprocess,tempfile,json
          root=pathlib.Path('/tmp/lw'); table=root/'table.data'; outdir=root/'decompiled'; jar='/tmp/unluac/bin/unluac.jar'
          with zipfile.ZipFile(table) as z:
              names=z.namelist()
              exact={'lw_hero','lw_hero_rank','lw_hero_awaken','lw_hero_awaken_rank','lw_hero_unique_weapon_unit'}
              rx=re.compile(r'^lw_hero.*(level|rank|star|quality|skill|weapon|attr|property|grow|upgrade|exp)',re.I)
              targets=sorted({n for n in names if n in exact or rx.search(n)})
              if 'lw_hero' in names: targets=sorted(set(targets)|{'lw_hero'})
              records=[]
              for n in targets:
                  raw=z.read(n)
                  with tempfile.NamedTemporaryFile(suffix='.luac') as f:
                      f.write(raw); f.flush()
                      cp=subprocess.run(['java','-jar',jar,f.name],stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,timeout=30)
                  rec={'name':n,'bytes':len(raw),'ok':cp.returncode==0}
                  if cp.returncode==0:
                      p=outdir/(re.sub(r'[^A-Za-z0-9_.-]+','_',n)+'.lua'); p.write_text(cp.stdout)
                      rec['sourceChars']=len(cp.stdout)
                  else:
                      rec['error']=cp.stderr.strip()[-500:]
                  records.append(rec)
          (root/'target-tables.json').write_text(json.dumps(records,indent=2)+'\n')
          print(json.dumps({'targetCount':len(records),'targets':records},indent=2))
          PY

      - name: Load Lua tables and derive compact native values
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/lw/dump_table.lua <<'LUA'
          local function is_array(t)
            local n=0
            for k,_ in pairs(t) do
              if type(k)~='number' or k<1 or math.floor(k)~=k then return false,0 end
              if k>n then n=k end
            end
            for i=1,n do if rawget(t,i)==nil then return false,0 end end
            return true,n
          end
          local function esc(s)
            return (s:gsub('\\','\\\\'):gsub('"','\\"'):gsub('\b','\\b'):gsub('\f','\\f'):gsub('\n','\\n'):gsub('\r','\\r'):gsub('\t','\\t'))
          end
          local function enc(v,depth,seen)
            depth=depth or 0; seen=seen or {}
            local ty=type(v)
            if ty=='nil' then return 'null' end
            if ty=='number' then
              if v~=v or v==math.huge or v==-math.huge then return 'null' end
              return tostring(v)
            end
            if ty=='boolean' then return v and 'true' or 'false' end
            if ty=='string' then return '"'..esc(v)..'"' end
            if ty~='table' or depth>10 then return 'null' end
            if seen[v] then return 'null' end
            seen[v]=true
            local arr,n=is_array(v); local parts={}
            if arr then
              for i=1,n do parts[#parts+1]=enc(v[i],depth+1,seen) end
              seen[v]=nil; return '['..table.concat(parts,',')..']'
            end
            local keys={}; for k,_ in pairs(v) do keys[#keys+1]=k end
            table.sort(keys,function(a,b) return tostring(a)<tostring(b) end)
            for _,k in ipairs(keys) do parts[#parts+1]='"'..esc(tostring(k))..'":'..enc(v[k],depth+1,seen) end
            seen[v]=nil; return '{'..table.concat(parts,',')..'}'
          end
          local path=arg[1]
          local ok,T=pcall(dofile,path)
          if not ok then io.stderr:write(tostring(T)..'\n'); os.exit(2) end
          print(enc({index=T.index or {},data=T.data or {},vExt=T.vExt or {},link=T.link or {}}))
          LUA

          python3 - <<'PY'
          import pathlib,json,re,subprocess
          root=pathlib.Path('/tmp/lw'); ddir=root/'decompiled'
          HERO_IDS={50007,50006,50009,50008,50010,10060,50019,50021,50018,50020,10051,50015,50014,50022,50013,40020,40010,40012,40006,40009,40008,40019,40016,40015,40018,40013,40007,30005,30002,30004,30003}
          source=json.loads((root/'source-meta.json').read_text())
          target_meta=json.loads((root/'target-tables.json').read_text())

          def resolve_table(path):
              cp=subprocess.run(['lua5.3','/tmp/lw/dump_table.lua',str(path)],stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,timeout=30)
              if cp.returncode!=0: raise RuntimeError(cp.stderr[-1000:])
              return json.loads(cp.stdout)

          def rows_as_maps(T):
              idx=T.get('index') or {}; data=T.get('data') or {}; vext=T.get('vExt') or []
              fields={}
              for name,desc in idx.items():
                  if isinstance(desc,list) and len(desc)>=2:
                      fields[name]={'column':int(desc[0]),'type':desc[1],'linked':bool(desc[2]) if len(desc)>2 else False}
              out=[]
              for key,row in data.items():
                  if not isinstance(row,list): continue
                  rec={'_key':int(key) if str(key).lstrip('-').isdigit() else key}
                  for name,fd in fields.items():
                      pos=fd['column']-1
                      val=row[pos] if 0<=pos<len(row) else None
                      if fd['linked'] and isinstance(val,(int,float)) and int(val)==val and 1<=int(val)<=len(vext):
                          val=vext[int(val)-1]
                      rec[name]=val
                  out.append(rec)
              return fields,out

          keep_field_rx=re.compile(r'(id$|hero|type|quality|rarity|level|lv|rank|star|attr|property|ratio|add|power|skill|weapon|max|growth|grow|base|hp|health|attack|atk|def|shard|exp|cost)',re.I)
          tables={}; discoveries=[]
          for meta in target_meta:
              if not meta.get('ok'): continue
              path=ddir/(re.sub(r'[^A-Za-z0-9_.-]+','_',meta['name'])+'.lua')
              try:
                  T=resolve_table(path); fields,rows=rows_as_maps(T)
              except Exception as e:
                  discoveries.append({'name':meta['name'],'loadError':str(e)[:500]}); continue
              discoveries.append({'name':meta['name'],'rowCount':len(rows),'fields':fields})
              selected=[]
              lname=meta['name'].lower()
              for rec in rows:
                  hero_refs=[]
                  for f in ('id','hero_id','hero'):
                      v=rec.get(f)
                      if isinstance(v,(int,float)): hero_refs.append(int(v))
                  if lname=='lw_hero':
                      include=any(v in HERO_IDS for v in hero_refs)
                  elif lname in ('lw_hero_rank',):
                      include=True
                  elif any(f in fields for f in ('hero_id','hero')):
                      include=any(v in HERO_IDS for v in hero_refs)
                  else:
                      include=len(rows)<=260
                  if not include: continue
                  compact={'_key':rec['_key']}
                  for k,v in rec.items():
                      if k=='_key' or keep_field_rx.search(k): compact[k]=v
                  selected.append(compact)
              if selected:
                  tables[meta['name']]={'rowCount':len(rows),'selectedCount':len(selected),'fields':fields,'rows':selected}

          williams=None
          for rec in tables.get('lw_hero',{}).get('rows',[]):
              if rec.get('id')==50007 or rec.get('_key')==50007: williams=rec; break
          rank_rows=tables.get('lw_hero_rank',{}).get('rows',[])
          out={
            'source':{'package':'com.fun.lastwar.gp','appVersion':'1.0.359','buildId':1864,**source},
            'heroIds':sorted(HERO_IDS),
            'discoveries':discoveries,
            'tables':tables,
            'anchors':{'williamsNativeId':50007,'williamsRow':williams,'rankRows':rank_rows},
            'note':'Compact derived configuration values for the WfGg simulator only. No APK/XAPK, images, locale text, bulk decompiled Lua or player/account data are committed.'
          }
          p=pathlib.Path('simulator/research/datatable-native-hero-values.v1.json')
          p.write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps({'tableCount':len(tables),'tableNames':sorted(tables),'williamsFound':williams is not None,'rankRows':len(rank_rows),'outputBytes':p.stat().st_size},indent=2))
          PY

      - name: Commit compact derived native values
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add simulator/research/datatable-native-hero-values.v1.json
          if git diff --cached --quiet; then
            echo 'No native value changes to commit.'
            exit 0
          fi
          git commit -m 'simulator: capture native hero DataTable values'
          git fetch origin simulator-standalone-v1
          git rebase origin/simulator-standalone-v1
          git push origin HEAD:simulator-standalone-v1
