name: Train splash + Sentinel v4

on:
  push:
    branches:
      - train-splash-sentinel-v4
    paths:
      - 'scripts/patch-train-splash-sentinel-v4.mjs'
      - '.github/workflows/train-splash-sentinel-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: train-splash-sentinel-v4
          fetch-depth: 0
      - name: Patch unified Worker
        run: node scripts/patch-train-splash-sentinel-v4.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check frontend/_worker.js
          node --check frontend/train-native/app.v15.js
          node --check frontend/train-native/sentinel-train-v1.js
      - name: Validate passive boot contract
        run: |
          grep -q 'WFGG_TRAIN_PASSIVE_SPLASH_SENTINEL_V4' frontend/_worker.js
          grep -q 'WFGG_TRAIN_PASSIVE_SPLASH_RUNTIME_V4' frontend/_worker.js
          grep -q 'WFGG_TRAIN_EARLY_SPLASH_V4' frontend/_worker.js
          grep -q 'WFGG_TRAIN_SENTINEL_STATIC_V4' frontend/_worker.js
          grep -q "script.src='/train/sentinel-train-v1.js?v=004'" frontend/_worker.js
          grep -q "if(ROUTE==='train')forceTrainPortalEntry();" frontend/_worker.js
          grep -q "if (suffix === '/sentinel-train-v1.js')" frontend/_worker.js
          grep -q 'WFGG_PORTAL_DIRECT_TRAIN_BOOTSTRAP_V2' frontend/train-native/app.v15.js
          grep -q 'WFGG_SENTINEL_TRAIN_ROUND_LAUNCHER_V1' frontend/train-native/sentinel-train-v1.js
          grep -q 'WFGG_SENTINEL_REPORT_V2' frontend/train-native/sentinel-train-v1.js
          ! grep -q "script.src = '/train-native/sentinel-train-v1.js" frontend/train-native/app.v15.js
          sha256sum -c frontend/train-native/app.v15.js.sha256
      - name: Commit generated Worker change
        run: |
          if git diff --quiet -- frontend/_worker.js; then
            echo 'No generated Worker changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/_worker.js
          git commit -m 'fix(train): restore splash and load Sentinel after boot'
          git push origin HEAD:train-splash-sentinel-v4
