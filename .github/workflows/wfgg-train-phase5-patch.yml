name: WfGg Train Phase 5 direct API patch

on:
  push:
    branches:
      - train-bridge-phase5

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[phase5-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: train-bridge-phase5
          fetch-depth: 0

      - name: Route Portal-authenticated Train API directly from browser
        shell: python
        run: |
          from pathlib import Path

          path = Path('frontend/_worker.js')
          src = path.read_text(encoding='utf-8')

          old = """    const WFGG_NATIVE_FETCH=window.fetch.bind(window);\n\n    window.fetch=function(input,init){\n      const options=init?{...init}:{};\n\n      try{\n        const raw=\n          typeof input==='string'||input instanceof URL\n            ? String(input)\n            : input?.url;\n\n        const target=new URL(raw||'',location.href);\n\n        if(\n          target.origin===location.origin &&\n          (target.pathname==='/api'||target.pathname.startsWith('/api/'))\n        ){\n          const portalToken=localStorage.getItem(PORTAL_TOKEN);\n\n          if(portalToken){\n            const headers=new Headers(\n              options.headers ||\n              (input instanceof Request ? input.headers : undefined)\n            );\n\n            headers.set('X-WfGg-Portal-Token',portalToken);\n            if(headers.get('Authorization')==='Bearer '+TRAIN_BRIDGE_SENTINEL){\n              headers.delete('Authorization');\n            }\n            options.headers=headers;\n\n            if(input instanceof Request){\n              return WFGG_NATIVE_FETCH(\n                new Request(input,options)\n              );\n            }\n          }\n        }\n      }catch(e){}\n\n      return WFGG_NATIVE_FETCH(input,options);\n    };\n"""

          new = """    const WFGG_NATIVE_FETCH=window.fetch.bind(window);\n    const WFGG_TRAIN_API_DIRECT='https://portal-auth-phase1-wfgg-train.chachasan090375.workers.dev';\n\n    /* WFGG_PORTAL_TRAIN_DIRECT_API_V1\n       En session Portail, le navigateur contacte directement le Worker Train.\n       Cela évite le sous-appel Pages Worker -> Worker, bloqué par Cloudflare.\n       Le token Portail reste transmis uniquement par en-tête et jamais dans l'URL.\n    */\n    window.fetch=async function(input,init){\n      const options=init?{...init}:{};\n\n      try{\n        const raw=\n          typeof input==='string'||input instanceof URL\n            ? String(input)\n            : input?.url;\n\n        const target=new URL(raw||'',location.href);\n\n        if(\n          target.origin===location.origin &&\n          (target.pathname==='/api'||target.pathname.startsWith('/api/'))\n        ){\n          const portalToken=localStorage.getItem(PORTAL_TOKEN);\n\n          if(portalToken){\n            const headers=new Headers(\n              options.headers ||\n              (input instanceof Request ? input.headers : undefined)\n            );\n\n            headers.set('X-WfGg-Portal-Token',portalToken);\n            if(headers.get('Authorization')==='Bearer '+TRAIN_BRIDGE_SENTINEL){\n              headers.delete('Authorization');\n            }\n\n            const directUrl=\n              WFGG_TRAIN_API_DIRECT+target.pathname+target.search;\n\n            if(input instanceof Request){\n              const bridged=new Request(input,{...options,headers});\n              const method=String(bridged.method||'GET').toUpperCase();\n              const directOptions={\n                method,\n                headers:new Headers(bridged.headers),\n                mode:'cors',\n                credentials:'omit',\n                cache:bridged.cache,\n                redirect:bridged.redirect,\n                referrerPolicy:bridged.referrerPolicy,\n                keepalive:bridged.keepalive,\n                signal:bridged.signal\n              };\n\n              if(method!=='GET'&&method!=='HEAD'){\n                directOptions.body=await bridged.clone().arrayBuffer();\n              }\n\n              return WFGG_NATIVE_FETCH(directUrl,directOptions);\n            }\n\n            return WFGG_NATIVE_FETCH(directUrl,{\n              ...options,\n              headers,\n              mode:'cors',\n              credentials:'omit'\n            });\n          }\n        }\n      }catch(e){\n        console.warn(\n          'WFGG_TRAIN_DIRECT_API_BRIDGE_ERROR',\n          String(e&&e.message||e)\n        );\n      }\n\n      return WFGG_NATIVE_FETCH(input,options);\n    };\n"""

          if old not in src:
              raise SystemExit('Expected phase4 fetch bridge not found; refusing blind patch')

          src = src.replace(old, new, 1)
          path.write_text(src, encoding='utf-8')

      - name: Validate worker syntax
        run: node --check frontend/_worker.js

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/_worker.js
          git commit -m 'fix: bypass Pages Worker for Portal Train API [phase5-auto]'
          git push origin HEAD:train-bridge-phase5
