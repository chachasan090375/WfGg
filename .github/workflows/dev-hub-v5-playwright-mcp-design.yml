name: Dev Hub V5 Playwright MCP Design

on:
  workflow_dispatch:
  push:
    branches:
      - dev-hub-v5-playwright-mcp-design
    paths:
      - 'dev-hub/config/mcp-playwright-contract.v1.json'
      - 'dev-hub/config/provider-adapters.v1.json'
      - 'dev-hub/config/mcp-provider-catalog.v1.json'
      - 'dev-hub/bin/mcp-playwright-contract-validate.py'
      - 'dev-hub/docs/MCP_PLAYWRIGHT_CONTRACT_V1.md'
      - 'dev-hub/evidence/playwright-mcp-design-2026-09-16.json'
      - '.github/workflows/dev-hub-v5-playwright-mcp-design.yml'
  pull_request:
    paths:
      - 'dev-hub/config/mcp-playwright-contract.v1.json'
      - 'dev-hub/config/provider-adapters.v1.json'
      - 'dev-hub/config/mcp-provider-catalog.v1.json'
      - 'dev-hub/bin/mcp-playwright-contract-validate.py'
      - 'dev-hub/docs/MCP_PLAYWRIGHT_CONTRACT_V1.md'
      - 'dev-hub/evidence/playwright-mcp-design-2026-09-16.json'
      - '.github/workflows/dev-hub-v5-playwright-mcp-design.yml'

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.base.ref == 'dev-hub-v5-mcp-catalog'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON and Python syntax
        run: |
          python -m json.tool dev-hub/config/mcp-playwright-contract.v1.json >/dev/null
          python -m json.tool dev-hub/config/provider-adapters.v1.json >/dev/null
          python -m json.tool dev-hub/config/mcp-provider-catalog.v1.json >/dev/null
          python -m json.tool dev-hub/evidence/playwright-mcp-design-2026-09-16.json >/dev/null
          python -m py_compile dev-hub/bin/mcp-playwright-contract-validate.py

      - name: Validate Playwright MCP design contract
        run: python dev-hub/bin/mcp-playwright-contract-validate.py

      - name: Confirm no browser or package runtime is installed by design gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('dev-hub/config/mcp-playwright-contract.v1.json').read_text())
          r=json.loads(Path('dev-hub/config/provider-adapters.v1.json').read_text())
          e=json.loads(Path('dev-hub/evidence/playwright-mcp-design-2026-09-16.json').read_text())
          assert c['runtime_status'] == 'DESIGNED'
          assert c['admission']['runtime_call_allowed_at_design_stage'] is False
          assert c['admission']['browser_download_allowed_at_design_stage'] is False
          assert c['execution']['vps_install_allowed_at_design_stage'] is False
          assert r['adapters']['playwright-mcp-adapter']['status'] == 'DESIGNED'
          assert r['adapters']['playwright-mcp-adapter']['executable'] is None
          assert 'browser_run_code_unsafe' in c['tool_policy']['explicit_deny']
          assert e['runtime_executed'] is False
          assert e['browser_downloaded'] is False
          assert e['vps_modified'] is False
          assert e['production_modified'] is False
          assert all(v == 'PASS' for v in e['checks'].values())
          print('PLAYWRIGHT_MCP_DESIGN_BOUNDARY_OK runtime=false browser_download=false vps_install=false unsafe_code=false')
          PY
