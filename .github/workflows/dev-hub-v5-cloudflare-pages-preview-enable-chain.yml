name: Dev Hub V5 Cloudflare Pages Preview Enablement Chain

on:
  push:
    branches:
      - dev-hub-v5-cloudflare-pages-preview-enable-chain
  pull_request:
    branches:
      - dev-hub-v5-cloudflare-pages-preview-contract-ok

permissions:
  contents: read
  checks: read

jobs:
  enablement-chain:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Freeze repository state
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain > /tmp/cfpages-git-before.txt
          test ! -s /tmp/cfpages-git-before.txt
          mkdir -p /tmp/chacha-cfpages-evidence /tmp/chacha-cfpages-runtime

      - name: Observe real Cloudflare Pages preview three times
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, time
          from pathlib import Path

          root=Path('/tmp/chacha-cfpages-evidence')
          request={
            'schema':'chacha.dev/dispatch-envelope/v1',
            'project':'wfgg',
            'task':{'id':'cloudflare-pages-preview-observation','permission':'preview-deploy'},
            'bindings':[{'provider':'cloudflare-pages','adapter':'cloudflare-pages-adapter'}],
            'metadata':{'cloudflare_pages':{
              'source_commit_sha':os.environ['GITHUB_SHA'],
              'source_branch':os.environ['GITHUB_REF_NAME'],
            }},
          }
          env=os.environ.copy()
          def observe():
            p=subprocess.run(['python3','dev-hub/adapters/cloudflare-pages-adapter.py'],input=json.dumps(request),text=True,
                             stdout=subprocess.PIPE,stderr=subprocess.PIPE,env=env,check=False,timeout=45)
            try: out=json.loads(p.stdout)
            except Exception: out={'status':'BLOCKED','summary':'ADAPTER_OUTPUT_INVALID','stdout':p.stdout,'stderr':p.stderr}
            return out

          first=None
          for _ in range(60):
            out=observe()
            if out.get('status')=='OK':
              first=out; break
            time.sleep(5)
          assert first is not None, out
          runs=[first]
          for _ in range(2):
            time.sleep(2)
            x=observe(); assert x.get('status')=='OK', x; runs.append(x)
          urls=[]
          for i,x in enumerate(runs,1):
            assert x['verification']['status']=='UNVERIFIED', x
            assert x['producer']=='cloudflare-pages-adapter'
            details=x['evidence'][0]['details']
            assert details['deployment_environment']=='preview'
            assert details['production_target'] is False
            assert details['workers_target_selected'] is False
            assert details['source_commit_sha']==os.environ['GITHUB_SHA']
            assert details['source_branch']==os.environ['GITHUB_REF_NAME']
            url=details['immutable_preview_url']
            assert url.startswith('https://') and url.endswith('.wfgg.pages.dev')
            assert url.rstrip('/')!='https://wfgg.pages.dev'
            urls.append(url)
            (root/f'cloudflare-observation-{i}.json').write_text(json.dumps(x,indent=2)+'\n')
          assert len(set(urls))==1, urls
          preview=urls[0]
          (root/'preview-url.txt').write_text(preview+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('CLOUDFLARE_PREVIEW_URL='+preview+'\n')
          print('CLOUDFLARE_PAGES_REAL_PREVIEW=PASS')
          print('CLOUDFLARE_PAGES_REPEATABILITY=3/3')
          print('CLOUDFLARE_PAGES_PROVIDER_HEALTH=HEALTHY')
          print('CLOUDFLARE_PAGES_PROVIDER_RESULT=UNVERIFIED')
          PY

      - name: Build provider-agnostic browser verification manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest={
            'schema':'chacha.dev/project-manifest/v1',
            'project':'cloudflare-pages-preview-enable-chain',
            'environment':{'class':'preview'},
            'workflows':[{
              'id':'cloudflare-pages-preview-browser-verification',
              'kind':'browser-verification',
              'target':{'url':os.environ['CLOUDFLARE_PREVIEW_URL']},
            }],
          }
          Path('/tmp/chacha-cfpages-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          text=json.dumps(manifest)
          assert 'chrome-devtools-mcp' not in text and 'playwright-mcp' not in text and 'cloudflare-pages' not in text
          print('CLOUDFLARE_PAGES_MANIFEST_PROVIDER_AGNOSTIC=PASS')
          PY

      - name: Prepare isolated Control Plane
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/chacha-cfpages-control
          rm -rf "$root"
          mkdir -p "$root"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/chacha-cfpages-control'); repo=Path.cwd()
          state=json.loads((repo/'dev-hub/config/control-plane-state.v1.json').read_text())
          state['storage']['runtime_root']=str(root/'state'); state['storage']['transaction_root']=str(root/'transactions')
          (root/'control-plane-state.json').write_text(json.dumps(state,indent=2)+'\n')
          run=json.loads((repo/'dev-hub/config/run-controller.v1.json').read_text())
          run['mode']='execute-enabled'; run['locking']['root']=str(root/'locks/dispatch')
          (root/'run-controller.json').write_text(json.dumps(run,indent=2)+'\n')
          pc=json.loads((repo/'dev-hub/config/project-control.v1.json').read_text())
          pc['runtime'].update({'state_root':str(root/'state'),'evidence_root':str(root/'evidence'),'plans_root':str(root/'plans'),
            'health_root':str(root/'health'),'runs_root':str(root/'runs'),'transactions_root':str(root/'transactions'),'locks_root':str(root/'locks/control')})
          pc['repository_paths']['control_plane_state']=str(root/'control-plane-state.json')
          pc['repository_paths']['run_controller']=str(root/'run-controller.json')
          assert pc['repository_paths']['capability_registry']=='dev-hub/config/capability-registry.v1.json'
          assert pc['repository_paths']['provider_adapters']=='dev-hub/config/provider-adapters.v1.json'
          (root/'project-control.json').write_text(json.dumps(pc,indent=2)+'\n')
          PY

      - name: Verify immutable preview with Chrome and Playwright through Broker
        shell: bash
        run: |
          set -euo pipefail
          python3 dev-hub/bin/trusted-runtime-provisioner-v2.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --project-control-policy /tmp/chacha-cfpages-control/project-control.json \
            --manifest /tmp/chacha-cfpages-manifest.json \
            --runtime-root /tmp/chacha-cfpages-runtime \
            --execute \
            --output /tmp/chacha-cfpages-evidence/browser-chain.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/chacha-cfpages-evidence/browser-chain.json').read_text())
          assert x['status']=='VERIFIED' and x['executed'] is True, x
          assert x['required_external_providers']==['chrome-devtools-mcp','playwright-mcp']
          assert x['provider_selection_owned_by_scheduler'] is True
          assert x['binding_selected_by_task'] is False
          assert x['registry_mutated'] is False
          assert x['production_touched'] is False
          assert x['audit_integrity']=='PASS'
          assert len(x['verified_workflows'])==1
          print('CLOUDFLARE_PAGES_CHROME_SOURCE=PASS')
          print('CLOUDFLARE_PAGES_PLAYWRIGHT_INDEPENDENT=PASS')
          print('CLOUDFLARE_PAGES_VERIFICATION_BROKER=VERIFIED')
          PY

      - name: Simulate PILOT to ENABLED sandbox and produce readiness evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy, hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path('/tmp/chacha-cfpages-evidence')
          repo=Path.cwd()
          adapters=json.loads((repo/'dev-hub/config/provider-adapters.v1.json').read_text())
          contract=json.loads((repo/'dev-hub/config/cloudflare-pages-preview-contract.v1.json').read_text())
          assert adapters['adapters']['cloudflare-pages-adapter']['status']=='CONTRACT_OK'
          assert adapters['adapters']['cloudflare-pages-adapter']['supports']==['preview-deploy']
          assert contract['runtime_status']=='CONTRACT_OK'
          sandbox_adapters=copy.deepcopy(adapters); sandbox_contract=copy.deepcopy(contract)
          sandbox_adapters['adapters']['cloudflare-pages-adapter']['status']='PILOT'
          sandbox_contract['runtime_status']='PILOT'
          assert sandbox_contract['security']['production_deploy'] is False
          sandbox_adapters['adapters']['cloudflare-pages-adapter']['status']='ENABLED'
          sandbox_contract['runtime_status']='ENABLED'
          assert sandbox_adapters['adapters']['cloudflare-pages-adapter']['supports']==['preview-deploy']
          assert sandbox_adapters['adapters']['cloudflare-pages-adapter']['executable'] is None
          preview=(root/'preview-url.txt').read_text().strip()
          browser=json.loads((root/'browser-chain.json').read_text())
          observations=[json.loads((root/f'cloudflare-observation-{i}.json').read_text()) for i in (1,2,3)]
          evidence={
            'schema':'chacha.dev/cloudflare-pages-preview-enablement-chain/v1',
            'provider_id':'cloudflare-pages','adapter_id':'cloudflare-pages-adapter',
            'observed_at':datetime.now(timezone.utc).isoformat(),
            'source_commit_sha':os.environ['GITHUB_SHA'],'source_branch':os.environ['GITHUB_REF_NAME'],
            'pilot':{'status':'PASS','real_pages_preview_observed':True,'immutable_preview_url':preview,
              'provider_result_trust':'UNVERIFIED','production_touched':False},
            'readiness':{'status':'READY_FOR_ENABLEMENT','repeatability':'3/3','provider_health':'HEALTHY',
              'browser_chain_status':browser['status'],'audit_integrity':browser['audit_integrity'],'blockers':[]},
            'sandbox':{'status':'PASS','transition':'PILOT->ENABLED','authoritative_registry_mutated':False,
              'production_capability':False,'supports':['preview-deploy'],'executable':None},
            'rollback':{'defined':True,'target':'CONTRACT_OK','data_migration_required':False,
              'cloudflare_project_mutation_required':False,'production_change_required':False},
            'automatic_promotion':False,
            'eligible_for_enabled_materialization':True,
          }
          (root/'enablement-chain.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print('CLOUDFLARE_PAGES_PILOT=PASS')
          print('CLOUDFLARE_PAGES_READINESS=READY_FOR_ENABLEMENT')
          print('CLOUDFLARE_PAGES_SANDBOX=PASS')
          print('CLOUDFLARE_PAGES_ENABLED_MATERIALIZATION_ELIGIBLE=true')
          PY

      - name: Confirm plan-only remains non-executing
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/chacha-cfpages-plan
          python3 dev-hub/bin/trusted-runtime-provisioner-v2.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --project-control-policy /tmp/chacha-cfpages-control/project-control.json \
            --manifest /tmp/chacha-cfpages-manifest.json \
            --runtime-root /tmp/chacha-cfpages-plan \
            --output /tmp/chacha-cfpages-evidence/plan-only.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/chacha-cfpages-evidence/plan-only.json').read_text())
          assert x['status']=='PLANNED' and x['executed'] is False
          assert x['provisioned']=={} and x['runtime_binding_created'] is False
          print('CLOUDFLARE_PAGES_PLAN_ONLY=PASS')
          PY

      - name: Confirm repository unchanged
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain > /tmp/cfpages-git-after.txt
          diff -u /tmp/cfpages-git-before.txt /tmp/cfpages-git-after.txt
          test ! -s /tmp/cfpages-git-after.txt
          echo 'CLOUDFLARE_PAGES_REPOSITORY_UNCHANGED=PASS'

      - name: Upload enablement evidence
        uses: actions/upload-artifact@v4
        with:
          name: dev-hub-v5-cloudflare-pages-preview-enable-chain-${{ github.run_id }}
          path: /tmp/chacha-cfpages-evidence
          retention-days: 30
          if-no-files-found: error
