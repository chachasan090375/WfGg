name: Dev Hub V5 Cloudflare Pages Chrome Diagnostic

on:
  push:
    branches:
      - dev-hub-v5-cloudflare-pages-preview-chrome-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TARGET_URL: "https://07dcae0e.wfgg.pages.dev"
      ALLOWED_ORIGIN: "https://07dcae0e.wfgg.pages.dev"
    steps:
      - uses: actions/checkout@v4
      - name: Provision Chrome DevTools MCP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/chacha-cd-mcp && mkdir -p /tmp/chacha-cd-mcp
          cd /tmp/chacha-cd-mcp
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-audit --no-fund chrome-devtools-mcp@1.9.0 >/dev/null
          echo "CDMCP=$(realpath node_modules/.bin/chrome-devtools-mcp)" >> "$GITHUB_ENV"
          echo "CDWORK=/tmp/chacha-cd-mcp" >> "$GITHUB_ENV"
          (google-chrome --version || google-chrome-stable --version || chromium --version || true) | tee /tmp/browser-version.txt
      - name: Run direct adapter V3 entry
        shell: bash
        run: |
          set -euo pipefail
          BROWSER_VERSION="$(cat /tmp/browser-version.txt)"
          python3 - <<'PY' >/tmp/request.json
          import json,os
          print(json.dumps({
            'schema':'chacha.dev/dispatch-envelope/v1',
            'project':'cf-pages-chrome-diagnostic',
            'task':{'id':'chrome-direct','permission':'read'},
            'bindings':[{'provider':'chrome-devtools-mcp','adapter':'chrome-devtools-mcp-adapter'}],
            'policy_context':{'timeout_seconds':60},
            'metadata':{'chrome_devtools_mcp':{'operation':'inspect_url','url':os.environ['TARGET_URL']}}
          }))
          PY
          CHACHA_CHROME_DEVTOOLS_MCP_SERVER="$CDMCP" \
          CHACHA_CHROME_DEVTOOLS_MCP_WORKDIR="$CDWORK" \
          CHACHA_CHROME_DEVTOOLS_MCP_PACKAGE_VERSION="1.9.0" \
          CHACHA_CHROME_DEVTOOLS_BROWSER_VERSION="$BROWSER_VERSION" \
          CHACHA_CHROME_DEVTOOLS_TARGET_CLASS="preview" \
          CHACHA_CHROME_DEVTOOLS_ALLOWED_ORIGIN="$ALLOWED_ORIGIN" \
          python3 dev-hub/bin/chrome-devtools-mcp-adapter-runtime-v3-entry.py </tmp/request.json | tee /tmp/result.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/result.json'))
          print('STATUS='+str(x.get('status')))
          print('SUMMARY='+str(x.get('summary')))
          print('PRODUCER='+str(x.get('producer')))
          if x.get('evidence'):
              print('DETAILS='+json.dumps(x['evidence'][0].get('details',{}),sort_keys=True))
          assert x.get('status')=='OK', x
          assert x.get('producer')=='chrome-devtools-mcp-adapter'
          assert x.get('verification',{}).get('status')=='UNVERIFIED'
          PY
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: dev-hub-v5-cloudflare-pages-chrome-diagnostic-${{ github.run_id }}
          path: |
            /tmp/result.json
            /tmp/browser-version.txt
          retention-days: 7
