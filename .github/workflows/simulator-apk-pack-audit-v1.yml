name: Simulator APK pack audit v1

on:
  push:
    branches: [simulator-standalone-v1]
    paths: ['.github/workflows/simulator-apk-pack-audit-v1.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simulator-standalone-v1
          fetch-depth: 0

      - name: Download verified current public XAPK and inventory useful assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lw simulator/research
          EXPECTED_SHA1='a5c3bc2cb56678339fd3fa3d124945c4ccca2e01'
          candidates=(
            'https://d.apkpure.net/b/XAPK/com.fun.lastwar.gp?versionCode=1864'
            'https://d.apkpure.net/b/XAPK/com.fun.lastwar.gp?version=1.0.359'
          )
          found=''
          for url in "${candidates[@]}"; do
            echo "Trying $url"
            rm -f /tmp/lw/current.xapk
            if curl -fL --retry 2 --connect-timeout 20 --max-time 900 "$url" -o /tmp/lw/current.xapk; then
              got=$(sha1sum /tmp/lw/current.xapk | awk '{print $1}')
              echo "SHA1=$got"
              if [[ "$got" == "$EXPECTED_SHA1" ]]; then found="$url"; break; fi
            fi
          done
          if [[ -z "$found" ]]; then
            echo 'Current 1.0.359 arm64 XAPK could not be verified; refusing to inspect a mismatched package.' >&2
            exit 2
          fi

          unzip -l /tmp/lw/current.xapk > /tmp/lw/xapk-list.txt
          unzip -q /tmp/lw/current.xapk -d /tmp/lw/xapk
          feature=$(find /tmp/lw/xapk -maxdepth 2 -type f \( -iname '*install*time*pack*.apk' -o -iname '*install_time_pack*' \) | head -n1 || true)
          if [[ -z "$feature" ]]; then
            feature=$(find /tmp/lw/xapk -maxdepth 2 -type f -name '*.apk' -printf '%s %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)
          fi
          test -n "$feature"
          echo "FEATURE=$feature"
          unzip -l "$feature" > /tmp/lw/feature-list.txt

          python3 - <<'PY'
          import pathlib,re,json,hashlib,zipfile,os
          root=pathlib.Path('/tmp/lw')
          xapk=root/'current.xapk'
          xdir=root/'xapk'
          apks=sorted(xdir.rglob('*.apk'),key=lambda p:p.stat().st_size,reverse=True)
          feature=next((p for p in apks if 'install_time_pack' in p.name.lower()),apks[0])
          pats={
            'tables': re.compile(r'(^|/)assets/table/|table_.*\.data$',re.I),
            'heroes': re.compile(r'hero|portrait|avatar|head|role|rarity',re.I),
            'gear': re.compile(r'equip|equipment|weapon|rail|gun|cannon|chip|armor|armour|radar',re.I),
            'tactics': re.compile(r'tactic|battle.?card|strategy.?card|card[_/.-]',re.I),
            'research': re.compile(r'research|science|tech|technology',re.I),
            'overlord': re.compile(r'overlord|gorilla|ape|monkey|skybreaker|hawk',re.I),
            'ui': re.compile(r'ui|atlas|sprite|frame|border|badge|icon',re.I),
            'animation': re.compile(r'anim|controller|timeline|spine|skeleton|effect',re.I),
          }
          with zipfile.ZipFile(feature) as z:
            names=z.namelist()
            groups={k:[n for n in names if rx.search(n)][:5000] for k,rx in pats.items()}
            table_names=[n for n in names if pats['tables'].search(n)]
            table_meta=[]
            for n in table_names:
              info=z.getinfo(n)
              rec={'path':n,'bytes':info.file_size,'compressedBytes':info.compress_size,'crc32':f'{info.CRC:08x}'}
              if n.lower().endswith('.data') and info.file_size < 30_000_000:
                data=z.read(n)
                rec['md5']=hashlib.md5(data).hexdigest()
                rec['sha256']=hashlib.sha256(data).hexdigest()
                rec['magic']=data[:8].hex()
              table_meta.append(rec)
          out={
            'source':{'version':'1.0.359','buildId':1864,'architecture':'arm64-v8a','xapkSha1':hashlib.sha1(xapk.read_bytes()).hexdigest()},
            'featureApk':{'name':feature.name,'bytes':feature.stat().st_size,'sha1':hashlib.sha1(feature.read_bytes()).hexdigest()},
            'entryCount':len(names),'tables':table_meta,
            'groups':{k:{'count':sum(1 for n in names if pats[k].search(n)),'sample':v[:400]} for k,v in groups.items()},
            'note':'Inventory only. The full XAPK/asset pack and copyrighted bulk assets are not committed.'
          }
          pathlib.Path('simulator/research/current-apk-pack-audit.v1.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps({k:(v if k not in ('groups',) else {g:x['count'] for g,x in v.items()}) for k,v in out.items()},indent=2,ensure_ascii=False))
          PY

      - name: Commit metadata only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add simulator/research/current-apk-pack-audit.v1.json
          if ! git diff --cached --quiet; then
            git commit -m 'simulator: capture current APK pack asset inventory'
            git push origin HEAD:simulator-standalone-v1
          fi
