name: Simulator APK pack audit v1

on:
  push:
    branches: [simulator-standalone-v1]
    paths: ['.github/workflows/simulator-apk-pack-audit-v1.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simulator-standalone-v1
          fetch-depth: 0

      - name: Download and verify current public XAPK by embedded metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lw simulator/research
          candidates=(
            'https://d.apkpure.net/b/XAPK/com.fun.lastwar.gp?versionCode=1864'
            'https://d.apkpure.net/b/XAPK/com.fun.lastwar.gp?version=1.0.359'
          )
          found=''
          for url in "${candidates[@]}"; do
            echo "Trying $url"
            rm -f /tmp/lw/current.xapk
            if curl -fL --retry 2 --connect-timeout 20 --max-time 900 "$url" -o /tmp/lw/current.xapk; then
              if python3 - <<'PY'
          import json,sys,zipfile,pathlib
          p=pathlib.Path('/tmp/lw/current.xapk')
          try:
            with zipfile.ZipFile(p) as z:
              candidates=[n for n in z.namelist() if pathlib.PurePosixPath(n).name.lower() in ('manifest.json','xapk_manifest.json')]
              if not candidates:
                print('No XAPK metadata manifest found')
                sys.exit(3)
              d=json.loads(z.read(candidates[0]).decode('utf-8','replace'))
          except Exception as e:
            print('Manifest read failed:',repr(e)); sys.exit(4)
          package=str(d.get('package_name') or d.get('packageName') or d.get('package') or '')
          version_name=str(d.get('version_name') or d.get('versionName') or '')
          version_code=str(d.get('version_code') or d.get('versionCode') or '')
          print(json.dumps({'manifest':candidates[0],'package':package,'versionName':version_name,'versionCode':version_code},ensure_ascii=False))
          ok=(package=='com.fun.lastwar.gp' and version_name=='1.0.359' and version_code=='1864')
          sys.exit(0 if ok else 5)
          PY
              then
                found="$url"
                break
              fi
            fi
          done
          if [[ -z "$found" ]]; then
            echo 'Could not obtain an XAPK whose embedded metadata matches com.fun.lastwar.gp 1.0.359 / build 1864.' >&2
            exit 2
          fi
          sha1sum /tmp/lw/current.xapk | tee /tmp/lw/xapk.sha1
          sha256sum /tmp/lw/current.xapk | tee /tmp/lw/xapk.sha256
          unzip -q /tmp/lw/current.xapk -d /tmp/lw/xapk

      - name: Audit DataTable/bootstrap assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re,json,hashlib,zipfile
          root=pathlib.Path('/tmp/lw')
          xapk=root/'current.xapk'
          xdir=root/'xapk'
          apks=sorted(xdir.rglob('*.apk'),key=lambda p:p.stat().st_size,reverse=True)
          if not apks:
            raise SystemExit('No APK found in verified XAPK')

          pats={
            'tables': re.compile(r'(^|/)assets/table/|table_.*\.data$',re.I),
            'heroes': re.compile(r'hero|portrait|avatar|head|role|rarity',re.I),
            'gear': re.compile(r'equip|equipment|weapon|rail|gun|cannon|chip|armor|armour|radar',re.I),
            'tactics': re.compile(r'tactic|battle.?card|strategy.?card|card[_/.-]',re.I),
            'research': re.compile(r'research|science|tech|technology',re.I),
            'overlord': re.compile(r'overlord|gorilla|ape|monkey|skybreaker|hawk',re.I),
            'bootstrap': re.compile(r'table[_-]?version|table[_-]?env|getlsu3dversion|hotupdate|lastwar-cdn|manifest|download',re.I),
          }
          byte_needles=[b'table_version',b'table_env',b'getlsu3dversion.php',b'lastwar-cdn',b'hotupdate',b'DataTable']
          ascii_rx=re.compile(rb'[\x20-\x7e]{8,360}')
          table_meta=[]; groups={k:[] for k in pats}; bootstrap_strings=[]; apk_meta=[]

          for apk in apks:
            apk_meta.append({'name':apk.name,'bytes':apk.stat().st_size,'sha1':hashlib.sha1(apk.read_bytes()).hexdigest()})
            try:
              with zipfile.ZipFile(apk) as z:
                names=z.namelist()
                for k,rx in pats.items():
                  groups[k].extend({'apk':apk.name,'path':n} for n in names if rx.search(n))
                for n in names:
                  info=z.getinfo(n)
                  if pats['tables'].search(n):
                    rec={'apk':apk.name,'path':n,'bytes':info.file_size,'compressedBytes':info.compress_size,'crc32':f'{info.CRC:08x}'}
                    if n.lower().endswith('.data') and info.file_size < 30_000_000:
                      data=z.read(n)
                      rec['md5']=hashlib.md5(data).hexdigest()
                      rec['sha256']=hashlib.sha256(data).hexdigest()
                      rec['magic']=data[:8].hex()
                    table_meta.append(rec)

                  low=n.lower()
                  likely=('global-metadata.dat' in low or low.endswith(('.json','.xml','.txt','.bytes','.config','.ini','.properties')) or ('assets/' in low and info.file_size <= 12_000_000) or (low.endswith(('.so','.dll')) and info.file_size <= 80_000_000))
                  if not likely or info.file_size <= 0 or len(bootstrap_strings)>=350:
                    continue
                  try: data=z.read(n)
                  except Exception: continue
                  lower=data.lower()
                  if not any(x.lower() in lower for x in byte_needles):
                    continue
                  for m in ascii_rx.finditer(data):
                    s=m.group(); sl=s.lower()
                    if any(x.lower() in sl for x in byte_needles):
                      bootstrap_strings.append({'apk':apk.name,'entry':n,'text':s.decode('ascii','ignore')[:360]})
                      if len(bootstrap_strings)>=350: break
            except zipfile.BadZipFile:
              apk_meta[-1]['badZip']=True

          seen=set(); dedup=[]
          for h in bootstrap_strings:
            key=(h['apk'],h['entry'],h['text'])
            if key not in seen:
              seen.add(key); dedup.append(h)

          out={
            'source':{'package':'com.fun.lastwar.gp','version':'1.0.359','buildId':1864,'architecture':'arm64-v8a','xapkSha1':hashlib.sha1(xapk.read_bytes()).hexdigest(),'xapkSha256':hashlib.sha256(xapk.read_bytes()).hexdigest()},
            'apks':apk_meta,
            'tables':table_meta,
            'groups':{k:{'count':len(v),'sample':v[:500]} for k,v in groups.items()},
            'bootstrapStringHits':dedup[:350],
            'target':{'dataTableVersion':'1295','descriptor':'DataTable,1295,294,1768181284'},
            'note':'Metadata/string inventory only. No XAPK/APK, bulk copyrighted assets, account/session data, secrets, tokens or private player codes are committed.'
          }
          p=pathlib.Path('simulator/research/current-apk-pack-audit.v1.json')
          p.write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps({'apkCount':len(apk_meta),'tableEntries':len(table_meta),'bootstrapStringHits':len(dedup),'groupCounts':{k:len(v) for k,v in groups.items()},'xapkSha1':out['source']['xapkSha1']},indent=2))
          PY

      - name: Commit sanitized metadata only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add simulator/research/current-apk-pack-audit.v1.json
          if ! git diff --cached --quiet; then
            git commit -m 'simulator: capture current APK pack and DataTable bootstrap audit'
            git push origin HEAD:simulator-standalone-v1
          fi
