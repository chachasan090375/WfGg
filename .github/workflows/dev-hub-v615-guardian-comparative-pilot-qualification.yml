name: ChaCha DEV V6.15 Guardian and comparative pilot qualification

on:
  push:
    branches: [dev-hub-v615-guardian-comparative-pilot]
    paths:
      - 'dev-hub/guardian/**'
      - 'dev-hub/bin/guardian-client.py'
      - 'dev-hub/bin/guardian-alert-poller.py'
      - 'dev-hub/bin/run-controller.py'
      - 'dev-hub/bin/autonomous-project-orchestrator.py'
      - 'dev-hub/bin/technology_watch_runtime.py'
      - 'dev-hub/bin/architecture-comparative-pilot.py'
      - 'dev-hub/bin/architecture-portfolio-optimizer.py'
      - 'dev-hub/bin/architecture-decision-council.py'
      - 'dev-hub/config/guardian-role-contracts.v1.json'
      - 'dev-hub/config/guardian-runtime-policy.v1.json'
      - 'dev-hub/config/comparative-pilot-policy.v1.json'
      - 'dev-hub/config/run-controller.v1.json'
      - 'dev-hub/tests/test_v615_guardian_comparative_pilot.py'
      - 'dev-hub/tests/fixtures/comparative-pilot-harness.py'
      - 'dev-hub/bin/install-v615-guardian-comparative-pilot.sh'
      - '.github/workflows/dev-hub-v615-guardian-comparative-pilot-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-hub-v615-guardian-comparative-pilot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static validation
        run: |
          set -euo pipefail
          node --check dev-hub/guardian/worker.js
          python3 -m py_compile             dev-hub/bin/guardian-client.py             dev-hub/bin/guardian-alert-poller.py             dev-hub/bin/run-controller.py             dev-hub/bin/autonomous-project-orchestrator.py             dev-hub/bin/technology_watch_runtime.py             dev-hub/bin/architecture-comparative-pilot.py             dev-hub/bin/architecture-portfolio-optimizer.py             dev-hub/bin/architecture-decision-council.py             dev-hub/tests/fixtures/comparative-pilot-harness.py
          python3 -m json.tool dev-hub/config/guardian-role-contracts.v1.json >/dev/null
          python3 -m json.tool dev-hub/config/guardian-runtime-policy.v1.json >/dev/null
          python3 -m json.tool dev-hub/config/comparative-pilot-policy.v1.json >/dev/null
          python3 -m json.tool dev-hub/config/run-controller.v1.json >/dev/null
          if [ -f dev-hub/bin/install-v615-guardian-comparative-pilot.sh ]; then
            bash -n dev-hub/bin/install-v615-guardian-comparative-pilot.sh
          fi
          echo CHACHA_DEV_V615_STATIC=PASS

      - name: Guardian and comparative pilot contracts
        run: |
          set -euo pipefail
          python3 dev-hub/tests/test_v615_guardian_comparative_pilot.py

      - name: Governance invariants
        run: |
          set -euo pipefail
          grep -Fq '"guardian_is_external_to_central_brain": true' dev-hub/config/guardian-role-contracts.v1.json
          grep -Fq '"guardian_cannot_build_or_choose_architecture": true' dev-hub/config/guardian-role-contracts.v1.json
          grep -Fq '"auto_activate_emergency_stop": false' dev-hub/config/guardian-runtime-policy.v1.json
          grep -Fq '"real_harness_required": true' dev-hub/config/comparative-pilot-policy.v1.json
          grep -Fq 'GUARDIAN_UNAVAILABLE_FAIL_CLOSED' dev-hub/bin/run-controller.py
          grep -Fq 'REAL_BENCHMARK_HARNESS_REQUIRED' dev-hub/bin/architecture-comparative-pilot.py
          echo CHACHA_DEV_V615_EXTERNAL_GOVERNANCE_INVARIANTS=PASS

      - name: Qualification receipt
        run: |
          {
            echo CHACHA_DEV_GUARDIAN_COMPARATIVE_PILOT=V6.15
            echo RESULT=success
            echo SOURCE_REV="$(git rev-parse HEAD)"
            echo EXTERNAL_GUARDIAN=YES
            echo ROLE_CONTRACTS=YES
            echo PRE_POST_RUNTIME_GATES=YES
            echo TECHNOLOGY_WATCH_OBSERVED=YES
            echo ADAPTER_CONTRACTS=YES
            echo ALERTS=YES
            echo CRITICAL_STOP_RECOMMENDATION=YES
            echo GUARDIAN_AUTO_STOP=NO
            echo COMPARATIVE_PILOT=YES
            echo ISOLATED_EPHEMERAL_CAPSULES=YES
            echo REAL_HARNESS_REQUIRED=YES
            echo PRODUCTION_FAIL_CLOSED_ON_UNRESOLVED_CONFLICT=YES
            echo AUTOMATIC_EXTERNAL_SPEND_EUR=0
          } | tee /tmp/CHACHA_DEV_V615_RECEIPT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: chacha-dev-v615-guardian-comparative-pilot
          path: /tmp/CHACHA_DEV_V615_RECEIPT.txt
          retention-days: 30
