name: ChaCha DEV Sentinel technical assurance

on:
  push:
    paths:
      - 'dev-hub/**'
      - 'android/**'
      - '.github/workflows/dev-hub-*.yml'
  pull_request:
    paths:
      - 'dev-hub/**'
      - 'android/**'
      - '.github/workflows/dev-hub-sentinel-technical-assurance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sentinel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve comparison base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          BASE=""
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BASE="$BEFORE"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            BASE="$(git rev-parse HEAD^)"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "SENTINEL_BASE=${BASE:-FULL_REPOSITORY}"

      - name: External technical audit
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          args=(--repo-root . --head "$GITHUB_SHA" --run-tests --output /tmp/sentinel-technical-audit.json)
          if [ -n "${{ steps.base.outputs.base }}" ]; then args+=(--base "${{ steps.base.outputs.base }}"); fi
          PYTHONPATH=dev-hub/bin python3 dev-hub/bin/sentinel-technical-audit.py "${args[@]}"

      - name: Audit receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/sentinel-technical-audit.json ]; then
            python3 - <<'PY'
          import json
          x=json.load(open('/tmp/sentinel-technical-audit.json',encoding='utf-8'))
          print('CHACHA_DEV_SENTINEL_EXTERNAL_AUDIT='+str(x.get('verdict')))
          print('REVISION='+str(x.get('revision')))
          print('AUDIT_DIGEST='+str(x.get('audit_digest')))
          print('BLOCKING_FINDINGS='+str(len(x.get('blocking_findings') or [])))
          print('ADVISORY_FINDINGS='+str(len(x.get('advisory_findings') or [])))
          print('DIRECT_CODE_MUTATION=NO')
          print('CENTRAL_ORCHESTRATOR_OWNS_REMEDIATION=YES')
          PY
          else
            echo "CHACHA_DEV_SENTINEL_EXTERNAL_AUDIT=BLOCK"
            echo "AUDIT_ARTIFACT_MISSING=YES"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chacha-dev-sentinel-technical-audit-${{ github.sha }}
          path: /tmp/sentinel-technical-audit.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce Sentinel verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.audit.outcome }}" = "success"
          python3 - <<'PY'
          import json,os
          x=json.load(open('/tmp/sentinel-technical-audit.json',encoding='utf-8'))
          assert x.get('verdict')=='PASS',x
          assert x.get('revision')==os.environ['GITHUB_SHA'],x
          assert x.get('direct_code_mutation') is False,x
          print('CHACHA_DEV_SENTINEL_TECHNICAL_ASSURANCE=PASS')
          print('EXACT_REVISION=PASS')
          print('AUTOMATIC_EXTERNAL_SPEND_EUR=0')
          PY

      - name: Persist and verify exact-revision Sentinel attestation
        if: success() && github.event_name != 'pull_request'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.parse,urllib.request,urllib.error

          token=os.environ.get("CF_API_TOKEN","").strip()
          if not token:
              raise SystemExit("MISSING_SECRET=CLOUDFLARE_API_TOKEN")
          headers={"Authorization":"Bearer "+token,"Content-Type":"application/json"}

          def call(url,method="GET",body=None):
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(url,headers=headers,method=method,data=data)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      return r.status,json.loads(r.read())
              except urllib.error.HTTPError as e:
                  raw=e.read().decode("utf-8","replace")
                  try: payload=json.loads(raw)
                  except Exception: payload={"raw":raw[:1000]}
                  return e.code,payload

          aid=os.environ.get("CF_ACCOUNT_ID","").strip()
          if not aid:
              status,payload=call("https://api.cloudflare.com/client/v4/accounts?per_page=50")
              rows=(payload.get("result") or []) if status==200 else []
              if len(rows)!=1:
                  raise SystemExit("CLOUDFLARE_ACCOUNT_RESOLUTION_FAILED:"+str(status)+":"+str(len(rows)))
              aid=rows[0]["id"]

          status,payload=call(
              "https://api.cloudflare.com/client/v4/accounts/"+aid+
              "/d1/database?name="+urllib.parse.quote("chacha-dev-sentinel")
          )
          if status!=200:
              raise SystemExit("SENTINEL_D1_LOOKUP_FAILED:"+str(status))
          rows=payload.get("result") or []
          db=next((x for x in rows if x.get("name")=="chacha-dev-sentinel"),None)
          if not db:
              raise SystemExit("SENTINEL_D1_MISSING")
          dbid=db["uuid"]

          audit=json.load(open("/tmp/sentinel-technical-audit.json",encoding="utf-8"))
          repo=os.environ["GITHUB_REPOSITORY"]
          revision=os.environ["GITHUB_SHA"]
          workflow="ChaCha DEV Sentinel technical assurance"
          run_id=os.environ["GITHUB_RUN_ID"]
          audit_digest=audit["audit_digest"]

          sql="""INSERT INTO technical_workflow_attestations
          (repository,revision,workflow_name,workflow_run_id,audit_digest,conclusion,attested_at)
          VALUES(?1,?2,?3,?4,?5,'PASS',datetime('now'))
          ON CONFLICT(repository,revision,workflow_name) DO UPDATE SET
          workflow_run_id=excluded.workflow_run_id,
          audit_digest=excluded.audit_digest,
          conclusion='PASS',
          attested_at=datetime('now')"""
          query_url=f"https://api.cloudflare.com/client/v4/accounts/{aid}/d1/database/{dbid}/query"
          status,payload=call(query_url,"POST",{
              "sql":sql,
              "params":[repo,revision,workflow,run_id,audit_digest]
          })
          if status!=200 or not payload.get("success"):
              raise SystemExit("SENTINEL_ATTESTATION_WRITE_FAILED:"+str(status)+":"+json.dumps(payload)[:500])

          status,payload=call(query_url,"POST",{
              "sql":"""SELECT repository,revision,workflow_name,workflow_run_id,audit_digest,conclusion
                       FROM technical_workflow_attestations
                       WHERE repository=?1 AND revision=?2 AND workflow_name=?3""",
              "params":[repo,revision,workflow]
          })
          if status!=200 or not payload.get("success"):
              raise SystemExit("SENTINEL_ATTESTATION_VERIFY_QUERY_FAILED:"+str(status))
          result=payload.get("result") or []
          data=[]
          for block in result:
              data.extend(block.get("results") or [])
          if len(data)!=1:
              raise SystemExit("SENTINEL_ATTESTATION_VERIFY_MISSING:"+str(len(data)))
          row=data[0]
          assert row["repository"]==repo,row
          assert row["revision"]==revision,row
          assert row["workflow_name"]==workflow,row
          assert str(row["workflow_run_id"])==str(run_id),row
          assert row["audit_digest"]==audit_digest,row
          assert row["conclusion"]=="PASS",row
          print("CHACHA_DEV_SENTINEL_WORKFLOW_ATTESTATION_WRITE=PASS")
          print("CHACHA_DEV_SENTINEL_WORKFLOW_ATTESTATION_READBACK=PASS")
          print("EXACT_REVISION_ATTESTED="+revision)
          PY
