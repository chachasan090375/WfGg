name: ChaCha DEV Guardian terminal hold hotfix v2

on:
  push:
    branches:
      - dev-hub-v820-guardian-terminal-hold-hotfix
    paths:
      - '.github/workflows/dev-hub-v820-guardian-terminal-hold-hotfix-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply and verify exact hotfix
        run: |
          set -euo pipefail
          test "$(sha256sum dev-hub/guardian/worker.js | awk '{print $1}')" = "0caa9c879d7ca9f717d416ccffb1113884a878112a102cd3c0af056fc7ad654f"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dev-hub/guardian/worker.js')
          s=p.read_text()
          old1="""        WHERE h.active=1 AND (h.target_actor=?1 OR h.target_role=?2)\n          AND (h.project_id IS NULL OR h.project_id='' OR h.project_id=?3)"""
          new1="""        WHERE h.active=1 AND d.status IN ('OPEN','DELIVERED')\n          AND (h.target_actor=?1 OR h.target_role=?2)\n          AND (h.project_id IS NULL OR h.project_id='' OR h.project_id=?3)"""
          old2="""    `SELECT * FROM remediation_holds\n      WHERE active=1 AND (target_actor=?1 OR target_role=?2)\n        AND (project_id IS NULL OR project_id='' OR project_id=?3)\n        AND (run_id IS NULL OR run_id='')\n      ORDER BY created_at ASC LIMIT 1`"""
          new2="""    `SELECT h.* FROM remediation_holds h\n      JOIN remediation_directives d ON d.directive_id=h.directive_id\n      WHERE h.active=1 AND d.status IN ('OPEN','DELIVERED')\n        AND (h.target_actor=?1 OR h.target_role=?2)\n        AND (h.project_id IS NULL OR h.project_id='' OR h.project_id=?3)\n        AND (h.run_id IS NULL OR h.run_id='')\n      ORDER BY h.created_at ASC LIMIT 1`"""
          assert s.count(old1)==1, s.count(old1)
          assert s.count(old2)==1, s.count(old2)
          s=s.replace(old1,new1).replace(old2,new2)
          p.write_text(s)
          PY
          test "$(sha256sum dev-hub/guardian/worker.js | awk '{print $1}')" = "03054815fc9603bd088144652a8746423398f291e2b3b41f41d7007389a9fee6"
          node --check dev-hub/guardian/worker.js
          echo CHACHA_DEV_GUARDIAN_TERMINAL_HOLD_HOTFIX_PREFLIGHT=PASS

      - name: Wait for exact-revision Sentinel attestation
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.parse,urllib.request,urllib.error
          token=os.environ.get('CF_API_TOKEN','').strip(); aid=os.environ.get('CF_ACCOUNT_ID','').strip()
          if not token: raise SystemExit('MISSING_SECRET=CLOUDFLARE_API_TOKEN')
          headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'}
          def call(url,method='GET',body=None):
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(url,headers=headers,method=method,data=data)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:return r.status,json.loads(r.read())
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try:p=json.loads(raw)
                  except Exception:p={'raw':raw[:500]}
                  return e.code,p
          if not aid:
              st,p=call('https://api.cloudflare.com/client/v4/accounts?per_page=50')
              rows=(p.get('result') or []) if st==200 else []
              if len(rows)!=1: raise SystemExit('CLOUDFLARE_ACCOUNT_RESOLUTION_FAILED')
              aid=rows[0]['id']
          st,p=call('https://api.cloudflare.com/client/v4/accounts/'+aid+'/d1/database?name='+urllib.parse.quote('chacha-dev-sentinel'))
          if st!=200: raise SystemExit('SENTINEL_D1_LOOKUP_FAILED:'+str(st))
          db=next((x for x in (p.get('result') or []) if x.get('name')=='chacha-dev-sentinel'),None)
          if not db: raise SystemExit('SENTINEL_D1_MISSING')
          url=f"https://api.cloudflare.com/client/v4/accounts/{aid}/d1/database/{db['uuid']}/query"
          sql="SELECT revision,conclusion FROM technical_workflow_attestations WHERE repository=?1 AND revision=?2 AND workflow_name=?3 AND conclusion='PASS' LIMIT 1"
          for _ in range(60):
              st,p=call(url,'POST',{'sql':sql,'params':[os.environ['GITHUB_REPOSITORY'],os.environ['GITHUB_SHA'],'ChaCha DEV Sentinel technical assurance']})
              rows=[]
              if st==200 and p.get('success'):
                  for block in p.get('result') or []: rows.extend(block.get('results') or [])
              if len(rows)==1:
                  print('CHACHA_DEV_GUARDIAN_HOTFIX_SENTINEL_EXACT_HEAD=PASS'); break
              time.sleep(10)
          else: raise SystemExit('SENTINEL_EXACT_HEAD_ATTESTATION_MISSING')
          PY

      - name: Resolve Guardian target
        id: cf
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.parse,urllib.request
          token=os.environ['CF_API_TOKEN']; aid=os.environ.get('CF_ACCOUNT_ID','').strip(); headers={'Authorization':'Bearer '+token}
          def call(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:return r.status,json.loads(r.read())
          if not aid:
              st,p=call('https://api.cloudflare.com/client/v4/accounts?per_page=50'); rows=p.get('result') or []
              if len(rows)!=1: raise SystemExit('CLOUDFLARE_ACCOUNT_RESOLUTION_FAILED')
              aid=rows[0]['id']
          st,p=call('https://api.cloudflare.com/client/v4/accounts/'+aid+'/d1/database?name='+urllib.parse.quote('chacha-dev-guardian'))
          db=next((x for x in (p.get('result') or []) if x.get('name')=='chacha-dev-guardian'),None)
          if not db: raise SystemExit('GUARDIAN_D1_MISSING')
          st,p=call('https://api.cloudflare.com/client/v4/accounts/'+aid+'/workers/subdomain'); sub=(p.get('result') or {}).get('subdomain')
          if not sub: raise SystemExit('WORKERS_SUBDOMAIN_MISSING')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('account_id='+aid+'\n'); f.write('database_id='+db['uuid']+'\n'); f.write('workers_subdomain='+sub+'\n')
          PY

      - name: Prepare Wrangler config
        run: |
          cat > .wrangler-guardian-hotfix.jsonc <<EOF
          {"name":"chacha-dev-guardian","main":"dev-hub/guardian/worker.js","compatibility_date":"2026-09-24","workers_dev":true,"triggers":{"crons":["* * * * *"]},"d1_databases":[{"binding":"DB","database_name":"chacha-dev-guardian","database_id":"${{ steps.cf.outputs.database_id }}"}]}
          EOF

      - name: Deploy with automatic rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
          SUBDOMAIN: ${{ steps.cf.outputs.workers_subdomain }}
        run: |
          set -euo pipefail
          DEPLOYED=0
          rollback() {
            if [[ "$DEPLOYED" = 1 ]]; then
              npx --yes wrangler@4.45.0 rollback --config=.wrangler-guardian-hotfix.jsonc --message "automatic rollback after Guardian terminal-hold hotfix health failure" || true
            fi
          }
          trap rollback ERR
          npx --yes wrangler@4.45.0 deploy --config=.wrangler-guardian-hotfix.jsonc
          DEPLOYED=1
          URL="https://chacha-dev-guardian.$SUBDOMAIN.workers.dev"
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS "$URL/healthz" -o /tmp/guardian-health.json && grep -Fq '"external_governance_plane":true' /tmp/guardian-health.json && grep -Fq '"coverage_watch":true' /tmp/guardian-health.json; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          trap - ERR
          echo CHACHA_DEV_GUARDIAN_TERMINAL_HOLD_HOTFIX_DEPLOY=PASS
          echo CHACHA_DEV_GUARDIAN_TERMINAL_HOLD_HOTFIX_HEALTH=PASS
          echo CHACHA_DEV_AUTOMATIC_EXTERNAL_SPEND_EUR=0
