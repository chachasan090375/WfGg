name: Radar player scan v2 build

on:
  push:
    branches: [radar-production-v1]
    paths:
      - '.github/workflows/radar-player-scan-v2-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wfgg-radar-player-scan-v2-build
  cancel-in-progress: false

env:
  RADAR_D1_NAME: wfgg-radar
  RADAR_CONNECTOR_URL: https://chachavps.tail3ab05a.ts.net
  LASTWAR_CLIENT_REF: ee5f64de160a8051c2f9f98189b75038dd225a0a

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct canonical Radar V0.5 and apply READONLY v2 patch
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar
          mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          echo '234df1dec57f6211bc625855bf13350c9f17fbd843fbe92d8cf1ab7cb5c081ef  /tmp/radar-src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar
          base64 -d .radar-release-src/player-scan-v2.patch | gzip -dc > /tmp/player-scan-v2.patch
          cd /tmp/wfgg-radar
          git apply --check /tmp/player-scan-v2.patch
          git apply /tmp/player-scan-v2.patch
          grep -Fq 'native-template-readonly-v2' connector-go/internal/protocol/native_template.go
          grep -Fq 'LASTWAR_NATIVE_SCAN_SEED' connector-go/internal/protocol/native_template.go
          grep -Fq 'saveRadarPlayerObservations' src/worker.js
          echo PLAYER_SCAN_V2_PATCH=OK

      - name: Guardian regression gate
        working-directory: /tmp/wfgg-radar
        run: |
          set -euo pipefail
          node --check src/worker.js
          node --check src/game/remote-transport.js
          node --check src/game/lastwar-adapter.js
          node --check src/db/repository.js
          npm test
          npm run check
          cd connector-go
          gofmt -w internal/protocol/native_template.go native-template/main.go
          go test ./...
          go vet ./...
          echo GUARDIAN_V2=OK

      - name: Build Linux connector
        working-directory: /tmp/wfgg-radar/connector-go
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o /tmp/radar-connector ./cmd/radar-connector
          test -s /tmp/radar-connector
          echo CONNECTOR_BUILD=OK

      - name: Build native Last War READONLY template
        run: |
          set -euo pipefail
          rm -rf /tmp/lastwar-client
          git clone --filter=blob:none --no-checkout https://github.com/ljagiello/lastwar-client.git /tmp/lastwar-client
          cd /tmp/lastwar-client
          git fetch --depth 1 origin "$LASTWAR_CLIENT_REF"
          git checkout --detach FETCH_HEAD
          mkdir -p cmd/wfgg-radar-native-template
          cp /tmp/wfgg-radar/connector-go/native-template/main.go cmd/wfgg-radar-native-template/main.go
          gofmt -w cmd/wfgg-radar-native-template/main.go
          go test ./internal/auth ./internal/pcap ./internal/sfs
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags lastwar_native_template -trimpath -ldflags='-s -w' -o /tmp/radar-native-template ./cmd/wfgg-radar-native-template
          test -s /tmp/radar-native-template
          strings /tmp/radar-native-template | grep -Fq 'native-template-readonly-v2'
          echo NATIVE_TEMPLATE_V2_BUILD=OK

      - name: Resolve Cloudflare context
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 .github/scripts/resolve-cloudflare-context.py

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Resolve Radar D1
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          p = subprocess.run(['wrangler','d1','list','--json'], text=True, capture_output=True)
          if p.returncode:
              print(p.stdout); print(p.stderr); raise SystemExit(p.returncode)
          rows = json.loads(p.stdout)
          found = next((x for x in rows if x.get('name') == os.environ['RADAR_D1_NAME']), None)
          if not found or not found.get('uuid'):
              raise SystemExit('RADAR_D1_NOT_FOUND')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('database_id=' + found['uuid'] + '\n')
          print('RADAR_D1=OK')
          PY

      - name: Generate production Worker configuration
        env:
          D1_ID: ${{ steps.d1.outputs.database_id }}
        working-directory: /tmp/wfgg-radar
        run: |
          cat > wrangler.toml <<EOF2
          name = "wfgg-radar"
          main = "src/worker.js"
          compatibility_date = "2026-09-10"
          workers_dev = true

          [assets]
          directory = "./public"
          binding = "ASSETS"
          run_worker_first = ["/api/*"]

          [[d1_databases]]
          binding = "DB"
          database_name = "wfgg-radar"
          database_id = "$D1_ID"

          [vars]
          RADAR_SESSION_TTL = "3600"
          RADAR_OWNER_PSEUDO = "__AUTO_BOOTSTRAP_FIRST_VALID__"
          RADAR_CONNECTOR_URL = "$RADAR_CONNECTOR_URL"

          [triggers]
          crons = ["*/5 * * * *"]
          EOF2

      - name: Deploy Radar Worker v2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        working-directory: /tmp/wfgg-radar
        run: wrangler deploy

      - name: Verify production surface
        env:
          RADAR_URL: https://wfgg-radar.${{ steps.cf.outputs.subdomain }}.workers.dev
        run: |
          set -euo pipefail
          curl -fsSL "$RADAR_URL/api/health?player_scan_v2=$GITHUB_RUN_ID" -o /tmp/health.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get('ok') is True
          assert d.get('app') == 'wfgg-radar'
          assert d.get('version') == '0.5.0'
          assert d.get('gameConnector') == 'configured'
          print('RADAR_WORKER_V2=OK')
          PY

      - name: Publish VPS v2 binaries
        run: |
          set -euo pipefail
          cp /tmp/radar-connector radar-vps/release/radar-connector
          cp /tmp/radar-native-template radar-vps/release/radar-native-template
          chmod 0755 radar-vps/release/radar-connector radar-vps/release/radar-native-template
          (
            cd radar-vps/release
            sha256sum radar-connector radar-native-template > SHA256SUMS
          )
          git config user.name 'WfGg Radar CI'
          git config user.email 'radar-ci@users.noreply.github.com'
          git add radar-vps/release/radar-connector radar-vps/release/radar-native-template radar-vps/release/SHA256SUMS
          if git diff --cached --quiet; then
            echo RELEASE_BINARIES_UNCHANGED=YES
          else
            git commit -m 'build(radar): publish READONLY player scan v2 binaries'
            git push origin HEAD:radar-production-v1
            echo RELEASE_BINARIES_PUBLISHED=YES
          fi
