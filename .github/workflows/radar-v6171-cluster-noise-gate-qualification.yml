name: Radar V6.17.1 cluster noise gate qualification

on:
  push:
    branches: [radar-v6171-cluster-noise-gate]
    paths:
      - '.radar-release-src/v6171-source/**'
      - '.github/scripts/patch-radar-cluster-noise-gate-v6171.py'
      - '.github/scripts/patch-radar-connector-runtime-v693.py'
      - '.github/workflows/radar-v6171-cluster-noise-gate-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-v6171-cluster-noise-gate
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Reconstruct connector through V6.18 with V6.17.1
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar
          mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          echo '234df1dec57f6211bc625855bf13350c9f17fbd843fbe92d8cf1ab7cb5c081ef  /tmp/radar-src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar
          rm -rf /tmp/wfgg-radar/connector-go
          cp -a .radar-release-src/v2-source/connector-go /tmp/wfgg-radar/connector-go
          python3 .github/scripts/patch-radar-target-profile-retry.py
          python3 .github/scripts/patch-radar-federated-diagnostics-v65.py
          python3 .github/scripts/patch-player-scan-v3.py
          python3 .github/scripts/patch-player-scan-v4.py
          python3 .github/scripts/patch-radar-protocol-discovery-v67.py
          python3 .github/scripts/patch-radar-profile-isolation-v68.py
          python3 .github/scripts/patch-radar-native-profile-v69.py
          python3 .github/scripts/patch-radar-native-profile-handshake-v691.py
          python3 .github/scripts/patch-radar-native-profile-exec-v692.py
          python3 .github/scripts/patch-radar-connector-runtime-v693.py

      - name: Test V6.17.1 noise gate and regressions
        working-directory: /tmp/wfgg-radar/connector-go
        run: |
          set -euo pipefail
          gofmt -w ./cmd ./internal
          go test ./cmd/radar-connector -run 'TestNoiseGateV6171FiltersPersistentOnePlayerServer|TestNoiseGateV6171KeepsLegitimateSmallServer|TestNoiseGateV6171UsesExistingThresholdBoundary|TestQualityCatalogV617DoesNotConfirmTwoFullPlusOnePartial|TestQualityCatalogV617ConfirmsThreeFullCycles|TestMergeProfileWithMapV618PreservesWorldFields' -count=1
          go test ./...
          go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o /tmp/radar-connector-v6171 ./cmd/radar-connector
          test -s /tmp/radar-connector-v6171
          echo RADAR_V6171_TESTS=PASS

      - name: Verify V6.17.1 safety and integration surface
        run: |
          set -euo pipefail
          grep -Fq 'WFGG_RADAR_CLUSTER_NOISE_GATE_V6171' /tmp/wfgg-radar/connector-go/cmd/radar-connector/server_cluster_noise_gate_v6171.go
          grep -Fq 'WFGG_RADAR_CLUSTER_NOISE_GATE_ROUTE_V6171' /tmp/wfgg-radar/connector-go/cmd/radar-connector/server_cluster_catalog_v613.go
          grep -Fq 'deriveServerClusterCatalogV6171(census, graph)' /tmp/wfgg-radar/connector-go/cmd/radar-connector/server_cluster_catalog_v613.go
          grep -Fq 'row.Players >= clusterSeedMinPlayersV613' /tmp/wfgg-radar/connector-go/cmd/radar-connector/server_cluster_noise_gate_v6171.go
          grep -Fq 'population_noise_gate' /tmp/wfgg-radar/connector-go/cmd/radar-connector/server_cluster_noise_gate_v6171.go
          grep -Fq 'WFGG_RADAR_MAP_PROFILE_MERGE_JOB_V618' /tmp/wfgg-radar/connector-go/cmd/radar-connector/collector_jobs.go
          grep -Fq 'WFGG_RADAR_PARTIAL_CYCLE_MARKER_V617' /tmp/wfgg-radar/connector-go/cmd/radar-connector/collector_jobs.go
          ! grep -REiq 'attack|march|purchase|donate|reward collection|building production' .radar-release-src/v6171-source
          echo RADAR_V6171_READONLY=PASS
          echo RADAR_V6171_INTEGRATION=PASS

      - name: Assert production untouched
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "radar-v6171-cluster-noise-gate"
          echo RADAR_V6171_PRODUCTION_UNTOUCHED=PASS
