name: ChaCha DEV V6.35 central specialist authorities qualification

on:
  push:
    branches: [dev-hub-v635-central-specialist-authorities]
    paths:
      - 'dev-hub/specialists/**'
      - 'dev-hub/curator/**'
      - 'dev-hub/bastion/**'
      - 'dev-hub/intendant/**'
      - 'dev-hub/assurance-exchange/**'
      - 'dev-hub/bin/specialist-authority-client.py'
      - 'dev-hub/bin/bastion-incident-response-controller.py'
      - 'dev-hub/systemd/chacha-dev-bastion-incident-response.service'
      - 'dev-hub/systemd/chacha-dev-bastion-incident-response.timer'
      - 'dev-hub/bin/project-assurance-identity-manager.py'
      - 'dev-hub/bin/autonomous-project-orchestrator.py'
      - 'dev-hub/config/specialist-authority-common.v1.json'
      - 'dev-hub/config/curator-authority.v1.json'
      - 'dev-hub/config/bastion-authority.v1.json'
      - 'dev-hub/config/intendant-authority.v1.json'
      - 'dev-hub/config/curator-runtime-policy.v1.json'
      - 'dev-hub/config/bastion-runtime-policy.v1.json'
      - 'dev-hub/config/intendant-runtime-policy.v1.json'
      - 'dev-hub/config/project-embedded-assurance.v1.json'
      - 'dev-hub/config/project-control.v1.json'
      - 'dev-hub/config/guardian-role-contracts.v1.json'
      - 'dev-hub/config/guardian-coverage-manifest.v1.json'
      - 'dev-hub/config/sentinel-technical-policy.v1.json'
      - 'dev-hub/tests/test_v635_central_specialist_authorities.py'
      - 'dev-hub/tests/test_v634_logic_ux_compromise_release.py'
      - 'dev-hub/tests/test_v633_five_agent_embedded_probes.py'
      - 'dev-hub/tests/test_v632_project_embedded_assurance.py'
      - 'dev-hub/tests/test_v631_assurance_exchange.py'
      - 'dev-hub/tests/test_v630_external_dual_assurance.py'
      - 'dev-hub/tests/test_v629_memory_guided_foundry_planning.py'
      - 'dev-hub/tests/test_v628_trusted_dispatch_lineage.py'
      - 'dev-hub/tests/test_v627_verified_evidence_learning.py'
      - 'dev-hub/tests/test_v623_contextual_memory_recall.py'
      - 'dev-hub/bin/install-v635-central-specialist-authorities.sh'
      - '.github/workflows/dev-hub-v635-central-specialist-authorities-qualification.yml'
      - '.github/workflows/dev-hub-v635-central-specialist-authorities-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-hub-v635-central-specialist-authorities
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static validation
        run: |
          set -euo pipefail
          node --check dev-hub/specialists/core.js
          node --check dev-hub/curator/worker.js
          node --check dev-hub/bastion/worker.js
          node --check dev-hub/intendant/worker.js
          node --check dev-hub/assurance-exchange/worker.js
          python3 -m py_compile \
            dev-hub/bin/specialist-authority-client.py \
            dev-hub/bin/bastion-incident-response-controller.py \
            dev-hub/bin/project-assurance-identity-manager.py \
            dev-hub/bin/autonomous-project-orchestrator.py
          for f in             dev-hub/config/specialist-authority-common.v1.json             dev-hub/config/curator-authority.v1.json             dev-hub/config/bastion-authority.v1.json             dev-hub/config/intendant-authority.v1.json             dev-hub/config/curator-runtime-policy.v1.json             dev-hub/config/bastion-runtime-policy.v1.json             dev-hub/config/intendant-runtime-policy.v1.json             dev-hub/config/project-embedded-assurance.v1.json             dev-hub/config/project-control.v1.json             dev-hub/config/guardian-role-contracts.v1.json             dev-hub/config/guardian-coverage-manifest.v1.json; do
            python3 -m json.tool "$f" >/dev/null
          done
          grep -Fq 'specialist_authority_reviews' dev-hub/assurance-exchange/migrations/0003_specialist_reviews.sql
          grep -Fq 'security_incidents' dev-hub/specialists/migrations/0001.sql
          grep -Fq 'OnUnitActiveSec=10s' dev-hub/systemd/chacha-dev-bastion-incident-response.timer
          if [ -f dev-hub/bin/install-v635-central-specialist-authorities.sh ]; then
            bash -n dev-hub/bin/install-v635-central-specialist-authorities.sh
          fi
          echo CHACHA_DEV_V635_STATIC=PASS

      - name: V6.35 central specialist authorities
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v635_central_specialist_authorities.py

      - name: V6.34 logic UX compromise regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v634_logic_ux_compromise_release.py

      - name: V6.33 five-agent probes regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v633_five_agent_embedded_probes.py

      - name: V6.32 embedded assurance regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v632_project_embedded_assurance.py

      - name: V6.31 Assurance Exchange regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v631_assurance_exchange.py

      - name: V6.30 dual assurance regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v630_external_dual_assurance.py

      - name: V6.29 memory guided Foundry regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v629_memory_guided_foundry_planning.py

      - name: V6.28 trusted dispatch regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v628_trusted_dispatch_lineage.py

      - name: V6.27 verified evidence regression
        env:
          CHACHA_DEV_TEST_TRUSTED_CONTEXT_BYPASS: '1'
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v627_verified_evidence_learning.py

      - name: V6.23 contextual recall regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v623_contextual_memory_recall.py

      - name: Qualification receipt
        run: |
          {
            echo CHACHA_DEV_CENTRAL_SPECIALIST_AUTHORITIES=V6.35
            echo RESULT=success
            echo SOURCE_REV="$(git rev-parse HEAD)"
            echo CURATOR_CENTRAL=YES
            echo BASTION_CENTRAL=YES
            echo INTENDANT_CENTRAL=YES
            echo SPECIALIST_REVIEWS_SOURCE_REVERIFIED=YES
            echo PROJECT_IDENTITIES_ALL_AUTHORITIES=YES
            echo BASTION_CONTAINMENT_CORE=YES
            echo BASTION_GLOBAL_EMERGENCY_REQUIRES_CORROBORATION=YES
            echo FAILOVER=RESERVED_INACTIVE
            echo COMPROMISED_STATE_REPLICATION=FORBIDDEN
            echo DIRECT_MUTATION=NO
            echo AUTOMATIC_EXTERNAL_SPEND_EUR=0
          } | tee /tmp/CHACHA_DEV_V635_RECEIPT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: chacha-dev-v635-central-specialist-authorities
          path: /tmp/CHACHA_DEV_V635_RECEIPT.txt
          retention-days: 30
