name: Radar V6.19.9 Autopilot targeted history quality qualification

on:
  push:
    branches: [radar-v6199-autopilot-targeted-history-quality]
    paths:
      - '.radar-release-src/v6199-source/**'
      - '.github/scripts/patch-radar-autopilot-targeted-history-v6199.py'
      - '.github/scripts/patch-live-radar-autopilot-v6199.py'
      - '.github/workflows/radar-v6199-autopilot-targeted-history-qualification.yml'
      - 'radar-vps/install-v6199-pilot.sh'
      - 'radar-vps/probe-v6199-pilot-runtime.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wfgg-radar-v6199-targeted-history
  cancel-in-progress: true

env:
  EXPECTED_CONNECTOR_SHA256: 5058159307ccb99e8e631fe71014608934b8575e69d5599e4388550306baab7f
  EXPECTED_NATIVE_SHA256: 274d040f5294cb09422e5d55cc4b5335ac7739924c33dcb67b3f279645814900

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-v6199-autopilot-targeted-history-quality

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Reconstruct cumulative V6.19.9 candidate
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar
          mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          echo '234df1dec57f6211bc625855bf13350c9f17fbd843fbe92d8cf1ab7cb5c081ef  /tmp/radar-src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar
          rm -rf /tmp/wfgg-radar/connector-go
          cp -a .radar-release-src/v2-source/connector-go /tmp/wfgg-radar/connector-go

          python3 .github/scripts/patch-radar-target-profile-retry.py
          python3 .github/scripts/patch-radar-federated-diagnostics-v65.py
          python3 .github/scripts/patch-player-scan-v3.py
          python3 .github/scripts/patch-player-scan-v4.py
          python3 .github/scripts/patch-radar-protocol-discovery-v67.py
          python3 .github/scripts/patch-radar-profile-isolation-v68.py
          python3 .github/scripts/patch-radar-native-profile-v69.py
          python3 .github/scripts/patch-radar-native-profile-handshake-v691.py
          python3 .github/scripts/patch-radar-native-profile-exec-v692.py
          python3 .github/scripts/patch-radar-connector-runtime-v693.py
          python3 .github/scripts/patch-radar-cluster-catalog-budget-v6192.py
          python3 .github/scripts/patch-radar-seed-scout-v6193.py
          python3 .github/scripts/patch-radar-autopilot-v6194.py
          python3 .github/scripts/patch-radar-autopilot-stale-cycle-v6197.py
          python3 .github/scripts/patch-radar-collector-cycle-terminalization-v6198.py
          python3 .github/scripts/patch-radar-autopilot-targeted-history-v6199.py

          install -m 0644 .radar-release-src/v2-source/src/game/remote-transport.js /tmp/wfgg-radar/src/game/remote-transport.js
          python3 .github/scripts/patch-radar-async-collector-worker.py
          python3 .github/scripts/patch-radar-worker-rich-profile-v6191.py
          python3 .github/scripts/patch-radar-worker-seed-scout-v6193.py
          python3 .github/scripts/patch-radar-worker-autopilot-v6194.py

          install -m 0644 radar-ui-live/live-radar.html /tmp/wfgg-radar/public/live-radar.html
          python3 .github/scripts/patch-live-radar-seed-scout-v6193.py
          python3 .github/scripts/patch-live-radar-autopilot-v6194.py
          python3 .github/scripts/patch-radar-session-keepalive-v6195.py
          python3 .github/scripts/patch-live-radar-autopilot-v6196.py
          python3 .github/scripts/patch-live-radar-autopilot-v6197.py
          python3 .github/scripts/patch-live-radar-autopilot-v6198.py
          python3 .github/scripts/patch-live-radar-autopilot-v6199.py

          grep -Fq 'WFGG_RADAR_AUTOPILOT_TARGETED_HISTORY_CALLSITE_V6199' /tmp/wfgg-radar/connector-go/cmd/radar-connector/server_autopilot_v6194.go
          grep -Fq 'AUTOPILOT V6.19.9 · ARRÊTÉ' /tmp/wfgg-radar/public/live-radar.html
          echo RADAR_V6199_RECONSTRUCT=PASS

      - name: Test, vet and build connector
        working-directory: /tmp/wfgg-radar/connector-go
        run: |
          set -euo pipefail
          gofmt -w ./cmd ./internal
          go test ./...
          go vet ./...
          mkdir -p "$GITHUB_WORKSPACE/radar-vps/pilot-v6199"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o "$GITHUB_WORKSPACE/radar-vps/pilot-v6199/radar-connector" ./cmd/radar-connector
          actual="$(sha256sum "$GITHUB_WORKSPACE/radar-vps/pilot-v6199/radar-connector" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_CONNECTOR_SHA256"
          echo "RADAR_V6199_CONNECTOR_SHA256=$actual"
          grep -aFq 'v6.19.9' "$GITHUB_WORKSPACE/radar-vps/pilot-v6199/radar-connector"
          grep -aFq 'AUTOPILOT_TARGET_HISTORY_TIMEOUT_V6199' "$GITHUB_WORKSPACE/radar-vps/pilot-v6199/radar-connector"
          grep -aFq 'COLLECTOR_CYCLE_TERMINALIZATION_FAILED' "$GITHUB_WORKSPACE/radar-vps/pilot-v6199/radar-connector"
          grep -aFq 'STALE_RUNNING_CYCLE_RECOVERED_V6197' "$GITHUB_WORKSPACE/radar-vps/pilot-v6199/radar-connector"
          grep -aFq 'SEED_SKIPPED_NO_DATA' "$GITHUB_WORKSPACE/radar-vps/pilot-v6199/radar-connector"
          echo RADAR_V6199_CONNECTOR=PASS

      - name: Verify targeted history contract and regressions
        run: |
          set -euo pipefail
          H=/tmp/wfgg-radar/connector-go/cmd/radar-connector/autopilot_targeted_history_v6199.go
          A=/tmp/wfgg-radar/connector-go/cmd/radar-connector/server_autopilot_v6194.go
          U=/tmp/wfgg-radar/public/live-radar.html
          grep -Fq "mode=ro" "$H"
          grep -Fq 'PRAGMA query_only=ON' "$H"
          grep -Fq "WHERE cycle_id IN" "$H"
          grep -Fq 'WFGG_RADAR_AUTOPILOT_TARGETED_HISTORY_CALLSITE_V6199' "$A"
          ! grep -Fq 'runServerCycleHistoryV614(ctx, dbPath)' "$A"
          grep -Eq 'autopilotVersionV6194[[:space:]]*=[[:space:]]*"v6\.19\.9"' "$A"
          grep -Fq 'AUTOPILOT_CONSECUTIVE_FAILURE_LIMIT' "$A"
          grep -Fq 'AUTOPILOT_AUTH_FAILED' "$A"
          grep -Fq 'SEED_SKIPPED_NO_DATA' "$A"
          grep -Fq 'AUTOPILOT V6.19.9 · ARRÊTÉ' "$U"
          grep -Fq 'AUTO 12H' "$U"
          grep -Fq '/api/auth/session/refresh' /tmp/wfgg-radar/src/worker.js
          echo RADAR_V6199_TARGETED_HISTORY_CONTRACT=PASS
          echo RADAR_V6199_V6198_TERMINALIZATION_REGRESSION=PASS
          echo RADAR_V6199_V6197_STALE_RECOVERY_REGRESSION=PASS
          echo RADAR_V6199_V6196_NO_DATA_REGRESSION=PASS
          echo RADAR_V6199_V6195_KEEPALIVE_REGRESSION=PASS

      - name: Verify native and safety
        run: |
          set -euo pipefail
          actual="$(sha256sum radar-vps/release/radar-native-template | awk '{print $1}')"
          test "$actual" = "$EXPECTED_NATIVE_SHA256"
          ! grep -REiq 'building\.production\.collect|mail\.reward|al\.science\.donate|visitor\.operate|march|attack|purchase'             .radar-release-src/v6199-source
          echo "RADAR_V6199_NATIVE_SHA256=$actual"
          echo RADAR_V6199_NATIVE_CHANGE=NO
          echo RADAR_V6199_LASTWAR_MUTATION=NO
          echo RADAR_V6199_HISTORY_MUTATION=NO

      - name: Verify pilot installer and guard-only probe
        run: |
          set -euo pipefail
          bash -n radar-vps/install-v6199-pilot.sh
          bash -n radar-vps/probe-v6199-pilot-runtime.sh
          grep -Fq 'WFGG_RADAR_PILOT=V6.19.9' radar-vps/install-v6199-pilot.sh
          grep -Fq "$EXPECTED_CONNECTOR_SHA256" radar-vps/probe-v6199-pilot-runtime.sh
          grep -Fq 'GAME_TOKEN_REQUIRED' radar-vps/probe-v6199-pilot-runtime.sh
          grep -Fq 'RADAR_V6199_GAME_SCAN_EXECUTED=NO' radar-vps/probe-v6199-pilot-runtime.sh
          grep -Fq 'RADAR_V6199_COLLECTOR_MUTATION=NO' radar-vps/probe-v6199-pilot-runtime.sh
          echo RADAR_V6199_PILOT_GUARD_PROBE=PASS

      - name: Publish qualified V6.19.9 pilot artifacts
        run: |
          set -euo pipefail
          install -m 0755 radar-vps/release/radar-native-template radar-vps/pilot-v6199/radar-native-template
          test "$(sha256sum radar-vps/pilot-v6199/radar-native-template | awk '{print $1}')" = "$EXPECTED_NATIVE_SHA256"
          chmod 0755 radar-vps/pilot-v6199/radar-connector radar-vps/pilot-v6199/radar-native-template
          (
            cd radar-vps/pilot-v6199
            sha256sum radar-connector radar-native-template > SHA256SUMS
          )
          grep -Fq "$EXPECTED_CONNECTOR_SHA256  radar-connector" radar-vps/pilot-v6199/SHA256SUMS
          grep -Fq "$EXPECTED_NATIVE_SHA256  radar-native-template" radar-vps/pilot-v6199/SHA256SUMS
          {
            echo "WFGG_RADAR_PILOT=V6.19.9"
            echo "SOURCE_BRANCH=radar-v6199-autopilot-targeted-history-quality"
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "CHANGE=autopilot-targeted-history-quality"
            echo "AUTOPILOT_TARGETED_HISTORY_QUALITY=YES"
            echo "TARGETED_HISTORY_FULL_REBUILD=NO"
            echo "HISTORY_READONLY=YES"
            echo "COLLECTOR_CYCLE_TERMINALIZATION_PRESERVED=YES"
            echo "STALE_CYCLE_RECOVERY_PRESERVED=YES"
            echo "NO_DATA_CONTINUE_PRESERVED=YES"
            echo "GLOBAL_FAILURE_GUARDS=PRESERVED"
            echo "LASTWAR_MUTATION=NO"
            echo "COLLECTOR_MUTATION=NO_FOR_HISTORY_LOOKUP"
            echo "TOKEN_PERSISTENCE=NO"
          } > radar-vps/pilot-v6199/PILOT_INFO.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar-vps/pilot-v6199
          if git diff --cached --quiet; then
            echo RADAR_V6199_PILOT=UNCHANGED
            exit 0
          fi
          git commit -m 'build(radar): publish V6.19.9 targeted history pilot'
          git push origin HEAD:radar-v6199-autopilot-targeted-history-quality
          echo RADAR_V6199_PILOT=PUBLISHED
