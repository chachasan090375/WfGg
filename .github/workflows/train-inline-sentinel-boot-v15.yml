name: Train inline Sentinel boot diagnostic v15

on:
  push:
    branches:
      - train-inline-sentinel-boot-v15

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: train-inline-sentinel-boot-v15
          fetch-depth: 0

      - name: Patch inline Sentinel boot diagnostic
        run: |
          python3 .github/scripts/train_inline_sentinel_boot_v15.py
          (cd frontend/train-native && sha256sum app.v15.js > app.v15.js.sha256)

      - name: Validate inline diagnostic
        run: |
          node --check frontend/train-native/app.v15.js
          node --check frontend/_worker.js
          grep -q 'WFGG_TRAIN_INLINE_SENTINEL_BOOT_V15' frontend/train-native/app.v15.js
          grep -q '/portal-api/sentinel/run?boot=' frontend/train-native/app.v15.js
          grep -q 'wfgg_diag=boot15' frontend/_worker.js
          (cd frontend/train-native && sha256sum -c app.v15.js.sha256)

      - name: Commit tested patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/train-native/app.v15.js frontend/train-native/app.v15.js.sha256 frontend/_worker.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix(train): render Sentinel boot diagnostic inline'
          git push origin HEAD:train-inline-sentinel-boot-v15
