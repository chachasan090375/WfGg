name: Radar V6.19.15 approved production promotion qualification

on:
  push:
    branches: [radar-v61915-production-approved-fadc]
  pull_request:
    branches: [radar-production-v1]
  workflow_dispatch:

permissions:
  contents: read

env:
  APPROVED_SOURCE_REV: fadcf91587ce17d7e735aafb6ef9b7a00f7f4f5f
  EXPECTED_CONNECTOR_SHA256: 64c7ce844df5772e8a7a7d0812449186c10d16239969797a85ec4adb022f73e8
  EXPECTED_NATIVE_SHA256: 274d040f5294cb09422e5d55cc4b5335ac7739924c33dcb67b3f279645814900
  EXPECTED_WORKER_SHA256: a2294468c72cdf02c807f2fd62cac06ab0e2d26a6299d52cf7527e4680e77d33
  EXPECTED_TRANSPORT_SHA256: 074de8c1574781c5974ae4ba34266b76afaaac89d4ef9cd161dba88e6278cc3c
  EXPECTED_UI_SHA256: e3d89a692d98c39bf180288cbcf4c0913bdd82d35376895bf78cc323551c4999

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-v61915-production-approved-fadc
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Verify explicit production approval
        run: |
          set -euo pipefail
          A=radar-vps/V61915_PRODUCTION_APPROVAL.txt
          grep -Fq 'WFGG_RADAR_PRODUCTION_APPROVAL=V6.19.15' "$A"
          grep -Fq 'APPROVED_SOURCE_REV=fadcf91587ce17d7e735aafb6ef9b7a00f7f4f5f' "$A"
          grep -Fq 'QUALIFICATION_RESULT=PASS' "$A"
          grep -Fq 'PILOT_AUTOMATED_RESULT=PASS' "$A"
          grep -Fq 'APPROVAL_SIGNAL=GO' "$A"
          grep -Fq 'WORKER_COVERAGE_PROPAGATION=REQUIRED' "$A"
          grep -Fq 'AUTOPILOT_RADAR_ANIMATION=MANUAL_SEARCH_PARITY' "$A"
          grep -Fq 'SUCCESS_YELLOW_BLIPS=REQUIRED' "$A"
          grep -Fq 'LASTWAR_MODE=READ_ONLY' "$A"
          grep -Fq 'TOKEN_PERSISTENCE=NO' "$A"
          grep -Fq 'ROLLBACK_REQUIRED=YES' "$A"
          grep -Fq 'CLOUDFLARE_DEPLOYMENT=APPROVED' "$A"
          echo RADAR_V61915_PRODUCTION_APPROVAL=PASS

      - name: Reconstruct cumulative V6.19.15
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar
          mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          echo '234df1dec57f6211bc625855bf13350c9f17fbd843fbe92d8cf1ab7cb5c081ef  /tmp/radar-src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar
          rm -rf /tmp/wfgg-radar/connector-go
          cp -a .radar-release-src/v2-source/connector-go /tmp/wfgg-radar/connector-go

          python3 .github/scripts/patch-radar-target-profile-retry.py
          python3 .github/scripts/patch-radar-federated-diagnostics-v65.py
          python3 .github/scripts/patch-player-scan-v3.py
          python3 .github/scripts/patch-player-scan-v4.py
          python3 .github/scripts/patch-radar-protocol-discovery-v67.py
          python3 .github/scripts/patch-radar-profile-isolation-v68.py
          python3 .github/scripts/patch-radar-native-profile-v69.py
          python3 .github/scripts/patch-radar-native-profile-handshake-v691.py
          python3 .github/scripts/patch-radar-native-profile-exec-v692.py
          python3 .github/scripts/patch-radar-connector-runtime-v693.py
          python3 .github/scripts/patch-radar-cluster-catalog-budget-v6192.py
          python3 .github/scripts/patch-radar-seed-scout-v6193.py
          python3 .github/scripts/patch-radar-autopilot-v6194.py
          python3 .github/scripts/patch-radar-autopilot-stale-cycle-v6197.py
          python3 .github/scripts/patch-radar-collector-cycle-terminalization-v6198.py
          python3 .github/scripts/patch-radar-autopilot-targeted-history-v6199.py
          python3 .github/scripts/patch-radar-autopilot-continue-partial-v61910.py

          install -m 0644 .radar-release-src/v2-source/src/game/remote-transport.js /tmp/wfgg-radar/src/game/remote-transport.js
          python3 .github/scripts/patch-radar-async-collector-worker.py
          python3 .github/scripts/patch-radar-worker-rich-profile-v6191.py
          python3 .github/scripts/patch-radar-worker-seed-scout-v6193.py
          python3 .github/scripts/patch-radar-worker-autopilot-v6194.py

          install -m 0644 radar-ui-live/live-radar.html /tmp/wfgg-radar/public/live-radar.html
          python3 .github/scripts/patch-live-radar-seed-scout-v6193.py
          python3 .github/scripts/patch-live-radar-autopilot-v6194.py
          python3 .github/scripts/patch-radar-session-keepalive-v6195.py
          python3 .github/scripts/patch-live-radar-autopilot-v6196.py
          python3 .github/scripts/patch-live-radar-autopilot-v6197.py
          python3 .github/scripts/patch-live-radar-autopilot-v6198.py
          python3 .github/scripts/patch-live-radar-autopilot-v6199.py
          python3 .github/scripts/patch-live-radar-autopilot-v61910.py

          python3 .github/scripts/patch-radar-manual-search-stop-v61911.py
          python3 .github/scripts/patch-radar-autopilot-no-rescan-qualified-v61912.py
          python3 .github/scripts/patch-live-radar-autopilot-v61912.py
          python3 .github/scripts/patch-radar-autopilot-persistent-ledger-v61913.py
          python3 .github/scripts/patch-live-radar-autopilot-v61913.py
          python3 .github/scripts/patch-radar-autopilot-coverage-completion-v61914.py
          python3 .github/scripts/patch-live-radar-autopilot-v61914.py
          python3 .github/scripts/patch-radar-worker-coverage-propagation-v61915.py

          echo RADAR_V61915_PRODUCTION_RECONSTRUCT=PASS

      - name: Qualify exact Connector
        working-directory: /tmp/wfgg-radar/connector-go
        run: |
          set -euo pipefail
          gofmt -w ./cmd ./internal
          go test ./...
          go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o /tmp/radar-connector ./cmd/radar-connector
          actual="$(sha256sum /tmp/radar-connector | awk '{print $1}')"
          echo "RADAR_V61915_CONNECTOR_SHA256=$actual"
          test "$actual" = "$EXPECTED_CONNECTOR_SHA256"
          grep -aFq 'v6.19.15' /tmp/radar-connector
          grep -aFq 'COVERAGE_COMPLETE' /tmp/radar-connector
          grep -aFq 'COVERAGE_FRONTIER_CONTINUE' /tmp/radar-connector
          grep -aFq 'SEED_SCOUT_FRONTIER_EXHAUSTED' /tmp/radar-connector
          grep -aFq 'radar_autopilot_ledger_v61913' /tmp/radar-connector
          grep -aFq 'SCOUT_SKIPPED_QUALIFIED' /tmp/radar-connector
          grep -aFq 'MANUAL_SEARCH_STOPPED' /tmp/radar-connector
          echo RADAR_V61915_CONNECTOR=PASS

      - name: Qualify exact Cloudflare surfaces
        run: |
          set -euo pipefail
          node --check /tmp/wfgg-radar/src/worker.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('/tmp/wfgg-radar/public/live-radar.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',h,re.S)
          assert m
          Path('/tmp/v61914-ui.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/v61914-ui.js
          worker="$(sha256sum /tmp/wfgg-radar/src/worker.js | awk '{print $1}')"
          transport="$(sha256sum /tmp/wfgg-radar/src/game/remote-transport.js | awk '{print $1}')"
          ui="$(sha256sum /tmp/wfgg-radar/public/live-radar.html | awk '{print $1}')"
          test "$worker" = "$EXPECTED_WORKER_SHA256"
          test "$transport" = "$EXPECTED_TRANSPORT_SHA256"
          test "$ui" = "$EXPECTED_UI_SHA256"
          grep -Fq 'WFGG_RADAR_AUTOPILOT_COVERAGE_COMPLETION_UI_V61914' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'AUTOPILOT V6.19.15 · ARRÊTÉ' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'coverageMode:true' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'COUVERTURE TERMINÉE' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'WFGG_RADAR_AUTOPILOT_PERSISTENT_LEDGER_UI_V61913' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'WFGG_RADAR_AUTOPILOT_NO_RESCAN_QUALIFIED_UI_V61912' /tmp/wfgg-radar/public/live-radar.html
          grep -Fq 'WFGG_RADAR_MANUAL_SEARCH_STOP_UI_V61911' /tmp/wfgg-radar/public/live-radar.html
          echo RADAR_V61915_CLOUDFLARE_SURFACES=PASS

      - name: Verify coverage and safety invariants
        run: |
          set -euo pipefail
          P=.github/scripts/patch-radar-worker-coverage-propagation-v61915.py
          grep -Fq 'normalizeAutopilotStartOptionsV61915' "$P"
          grep -Fq 'renderAutopilotRadarVisualV61915' "$P"
          grep -Fq 'const coverageMode = body.coverageMode === true;' "$P"
          grep -Fq "screen.classList.add('scanning')" "$P"
          grep -Fq "screen.classList.add('found')" "$P"
          ! grep -Fq 'ScanPlayerRegionDiagnosticOnServer' "$P"
          ! grep -Fq 'runCollectorSearch' "$P"
          ! grep -REiq 'localStorage.*token|sessionStorage.*token|INSERT.*token|token.*INSERT|access_token' "$P"
          ! grep -REiq 'building\.production\.collect|mail\.reward|al\.science\.donate|visitor\.operate|march|attack|purchase' "$P"
          echo RADAR_V61915_LASTWAR_MODE=READ_ONLY
          echo RADAR_V61915_TOKEN_PERSISTENCE=NO
          echo RADAR_V61915_NO_NEW_COLLECTOR_MUTATION_CLASS=PASS

      - name: Verify production workflows and rollback
        run: |
          set -euo pipefail
          B=.github/workflows/build-radar-vps-binaries.yml
          D=.github/workflows/deploy-radar-production.yml
          S=radar-vps/sentinel-vps-reconcile.sh
          grep -Fq 'EXPECTED_CONNECTOR_SHA256: 64c7ce844df5772e8a7a7d0812449186c10d16239969797a85ec4adb022f73e8' "$B"
          grep -Fq 'patch-radar-autopilot-coverage-completion-v61914.py' "$B"
          grep -Fq 'patch-live-radar-autopilot-v61914.py' "$B"
          grep -Fq 'patch-radar-worker-coverage-propagation-v61915.py' "$B"
          grep -Fq 'EXPECTED_CONNECTOR_SHA256: 64c7ce844df5772e8a7a7d0812449186c10d16239969797a85ec4adb022f73e8' "$D"
          grep -Fq 'EXPECTED_UI_SHA256: e3d89a692d98c39bf180288cbcf4c0913bdd82d35376895bf78cc323551c4999' "$D"
          grep -Fq 'WFGG_RADAR_AUTOPILOT_COVERAGE_COMPLETION_UI_V61914' "$D"
          grep -Fq 'RADAR_V61915_CONNECTOR_SIGNED_SURFACE=READY' "$D"
          grep -Fq 'RADAR_V61915_CLOUDFLARE_PRODUCTION=PASS' "$D"
          grep -Fq 'SENTINEL_VPS=ROLLBACK' "$S"
          grep -Fq 'sentinel-backups' "$S"
          echo RADAR_V61915_ROLLBACK=AVAILABLE
          echo RADAR_V61915_PRODUCTION_WORKFLOWS=QUALIFIED
