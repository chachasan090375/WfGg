name: ChaCha DEV Radar V6.19.3 Seed Scout governed pilot runner qualification

on:
  push:
    branches: [dev-hub-v5-radar-cluster-quality-diagnostic-v1]
    paths:
      - 'dev-hub/bin/run-radar-v6193-pilot-via-chacha-dev.sh'
      - 'dev-hub/projects/wfgg-radar/project-intent.v1.json'
      - '.github/workflows/dev-hub-radar-v6193-pilot-runner-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-hub-v5-radar-cluster-quality-diagnostic-v1

      - name: Validate shell and project intent
        run: |
          set -euo pipefail
          bash -n dev-hub/bin/run-radar-v6193-pilot-via-chacha-dev.sh
          python3 - <<'PY'
          import json
          p='dev-hub/projects/wfgg-radar/project-intent.v1.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['schema']=='chacha.dev/project-intent/v1',x
          assert x['project']=='wfgg-radar',x
          assert x['current_change']['id']=='radar-v6193-seed-scout',x
          assert x['current_change']['pilot_only'] is True,x
          assert x['current_change']['rollback_required'] is True,x
          print('PROJECT_INTENT=PASS')
          PY

      - name: Verify approval and pilot safety invariants
        run: |
          set -euo pipefail
          F=dev-hub/bin/run-radar-v6193-pilot-via-chacha-dev.sh
          grep -Fq 'APPROVAL_ID="production-release"' "$F"
          grep -Fq 'J’approuve le déploiement PILOT Radar V6.19.3 Seed Scout en lecture seule.' "$F"
          grep -Fq 'PRODUCTION_RELEASE_APPROVAL_REVOKED=PASS' "$F"
          grep -Fq 'close_pilot' "$F"
          grep -Fq 'revoke_approval' "$F"
          grep -Fq 'radar-runtime:pilot-open-v6193' "$F"
          grep -Fq 'radar-runtime:pilot-install-v6193' "$F"
          grep -Fq 'radar-runtime:pilot-probe-v6193' "$F"
          grep -Fq 'radar-runtime:pilot-close-v6193' "$F"
          grep -Fq 'c0ceb376b8735d3aa037608c91b8c0702f27d9f5' "$F"
          grep -Fq '73b64743031e4a47212dfdafae8ad67551f88d131831e70cb08a40957824f9a8' "$F"
          grep -Fq '274d040f5294cb09422e5d55cc4b5335ac7739924c33dcb67b3f279645814900' "$F"
          grep -Fq 'RADAR_V6193_GAME_SCAN_EXECUTED=NO' "$F"
          grep -Fq 'RADAR_V6193_COLLECTOR_MUTATION=NO' "$F"
          echo GOVERNED_V6193_SEED_SCOUT_PILOT_RUNNER=QUALIFIED
