name: Simulator balance discovery v2

on:
  push:
    branches: [simulator-standalone-v1]
    paths: ['.github/workflows/simulator-balance-discovery-v2.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simulator-standalone-v1
          fetch-depth: 0

      - name: Probe current public table metadata and table_env variants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p simulator/research /tmp/wfgg
          python3 - <<'PY'
          import json, pathlib, urllib.parse, urllib.request
          endpoint='https://lastwar-serverlist-cf.lastwarapp.net/gameservice/getlsu3dversion.php'
          variants=['','0','1','prod','production','release','online','formal','stable','1295','294','1295,294','1295|294']
          rows=[]
          for env in variants:
              q={
                'packageName':'com.fun.lastwar.gp','platform':'Android','appVersion':'1.0.359','gm':'0',
                'server':'','uid':'','deviceId':'','table_env':env,'buildId':'1864','returnJson':'1','unityVersion':'440'
              }
              url=endpoint+'?'+urllib.parse.urlencode(q)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'WfGg-public-balance-audit/1.0'})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      d=json.load(r)
                  row={'table_env':env,'keys':sorted(k for k in d if k!='resMsg')}
                  for k in ['code','msg','updateType','hotUpdateMsg','table_version']:
                      if k in d: row[k]=d[k]
                  rows.append(row)
              except Exception as e:
                  rows.append({'table_env':env,'error':type(e).__name__+': '+str(e)[:180]})
          out={
            'requestVersion':{'appVersion':'1.0.359','buildId':1864},
            'variants':rows,
            'note':'Anonymous public version endpoint probe. resMsg and account/session data are intentionally not persisted.'
          }
          p=pathlib.Path('simulator/research/public-table-env-probe.v1.json')
          p.write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps(out,indent=2,ensure_ascii=False))
          PY

      - name: Commit sanitized discovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add simulator/research/public-table-env-probe.v1.json
          if ! git diff --cached --quiet; then
            git commit -m 'simulator: capture public table_env probe'
            git push origin HEAD:simulator-standalone-v1
          fi
