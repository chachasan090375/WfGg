name: Radar indexing diagnostic

on:
  push:
    branches: [radar-production-v1]
    paths:
      - '.github/workflows/radar-indexing-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct canonical Radar V0.5
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar
          mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar

      - name: Inspect native player scan implementation
        working-directory: /tmp/wfgg-radar
        run: |
          set -euo pipefail
          echo '=== CONNECTOR SERVER ==='
          sed -n '1,180p' connector-go/cmd/radar-connector/main.go
          echo '=== NATIVE TEMPLATE ==='
          cat connector-go/internal/protocol/native_template.go
          echo '=== EXEC READONLY ==='
          cat connector-go/internal/protocol/exec_readonly.go
          echo '=== PROTOCOL TYPES ==='
          cat connector-go/internal/protocol/protocol.go
