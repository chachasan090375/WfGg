name: Radar indexing diagnostic

on:
  push:
    branches: [radar-production-v1]
    paths:
      - '.github/workflows/radar-indexing-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct canonical Radar V0.5
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar
          mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar

      - name: Inspect snapshot and observation pipeline
        working-directory: /tmp/wfgg-radar
        run: |
          set -euo pipefail
          echo '=== SCHEMA ==='
          cat schema.sql
          echo '=== REPOSITORY ==='
          cat src/db/repository.js
          echo '=== RADAR SERVICE ==='
          cat src/radar/service.js
          echo '=== LASTWAR ADAPTER ==='
          cat src/game/lastwar-adapter.js
          echo '=== ORCHESTRATOR ==='
          cat src/agents/orchestrator.js
          echo '=== ORACLE AGENT ==='
          cat src/agents/oracle-agent.js
          echo '=== WORKER SNAPSHOT/SEARCH SECTION ==='
          sed -n '120,180p' src/worker.js
