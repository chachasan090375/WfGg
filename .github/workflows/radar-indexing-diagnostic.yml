name: Radar indexing diagnostic

on:
  push:
    branches: [radar-production-v1]
    paths:
      - '.github/workflows/radar-indexing-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct canonical Radar V0.5
        run: |
          set -euo pipefail
          rm -rf /tmp/wfgg-radar
          mkdir -p /tmp/wfgg-radar
          python3 .github/scripts/reconstruct-radar-release.py
          tar -xzf /tmp/radar-src.tar.gz -C /tmp/wfgg-radar

      - name: Inspect player scan path
        working-directory: /tmp/wfgg-radar
        run: |
          set -euo pipefail
          echo '=== REMOTE TRANSPORT ==='
          cat src/game/remote-transport.js
          echo '=== CONNECTOR INTERFACE ==='
          cat src/game/connector.js
          echo '=== CONNECTOR FILES ==='
          find . -maxdepth 3 -type f | sort | grep -E 'connector|native|server|go$' || true
          echo '=== SCAN REFERENCES ==='
          grep -RniE 'scanPlayer|scan-player|player.scan|player/search|player.*query|radar_observations|INSERT INTO radar_observations' . --exclude='*.lock' || true
