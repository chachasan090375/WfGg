name: Portal Last War single v23 recette

on:
  push:
    branches: [portal-lastwar-single-v23]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lastwar-single:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portal-lastwar-single-v23
      - name: Validate sources
        run: |
          node --check frontend/portal-invitations-lastwar-safe-v1.js
          node --check .github/qa/portal-invitations-recette.mjs
          grep -q 'WFGG_LASTWAR_SINGLE_V1' frontend/portal-invitations-lastwar-safe-v1.js
          grep -Fq "BROKEN_ADDRESS='wfgg . pages . dev'" frontend/portal-invitations-lastwar-safe-v1.js
          grep -q 'portal-invitations-lastwar-safe-v1.js?v=002-single-address' frontend/index.html
      - name: Build XLSX fixture
        run: python3 .github/qa/make-invitations-xlsx-fixture.py /tmp/qa-members.xlsx
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local portal
        run: |
          python3 -m http.server 4173 --directory frontend >/tmp/portal.log 2>&1 &
          echo $! >/tmp/portal.pid
          sleep 2
      - name: Run invitation browser recette
        env:
          WFGG_PREVIEW: http://127.0.0.1:4173
          WFGG_XLSX_FIXTURE: /tmp/qa-members.xlsx
        run: node .github/qa/portal-invitations-recette.mjs
