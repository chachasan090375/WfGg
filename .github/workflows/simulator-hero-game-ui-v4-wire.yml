name: Simulator hero game UI v4 wire

on:
  push:
    branches:
      - simulator-standalone-v1
    paths:
      - '.github/workflows/simulator-hero-game-ui-v4-wire.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simulator-standalone-v1
          fetch-depth: 0
      - name: Wire v4 assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('simulator/index.html','frontend/simulator/index.html'):
              p=Path(name); s=p.read_text(encoding='utf-8')
              css='  <link rel="stylesheet" href="hero-game-ui-v4.css?v=004-lastwar-hero-pages" />\n'
              js='  <script src="hero-game-ui-v4.js?v=004-lastwar-hero-pages"></script>\n'
              if 'hero-game-ui-v4.css' not in s:
                  marker='  <link rel="stylesheet" href="hero-roster-v2.css?v=001" />\n'
                  if marker not in s: raise SystemExit(f'CSS marker missing in {name}')
                  s=s.replace(marker,marker+css,1)
              if 'hero-game-ui-v4.js' not in s:
                  marker='  <script src="hero-roster-v2.js?v=001-game-ui"></script>\n'
                  if marker not in s: raise SystemExit(f'JS marker missing in {name}')
                  s=s.replace(marker,marker+js,1)
              p.write_text(s,encoding='utf-8')
          Path('simulator/UI_VERSION.txt').write_text('HERO_GAME_UI_V4_LASTWAR_PAGES\nAttributes / Skills / Tier / Exclusive Weapon\n2026-08-26\n',encoding='utf-8')
          PY
      - name: Validate v4 sources
        run: |
          node --check simulator/hero-game-ui-v4.js
          node --check frontend/simulator/hero-game-ui-v4.js
          grep -Fq 'hero-game-ui-v4.css?v=004-lastwar-hero-pages' simulator/index.html
          grep -Fq 'hero-game-ui-v4.js?v=004-lastwar-hero-pages' simulator/index.html
          grep -Fq "grade:['Compétences','skill']" simulator/hero-game-ui-v4.js
          grep -Fq "wall:['Tier','tier']" simulator/hero-game-ui-v4.js
          grep -Fq "weapon:['Arme exclusive','weapon']" simulator/hero-game-ui-v4.js
          cmp simulator/hero-game-ui-v4.js frontend/simulator/hero-game-ui-v4.js
          cmp simulator/hero-game-ui-v4.css frontend/simulator/hero-game-ui-v4.css
      - name: Commit wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulator/index.html frontend/simulator/index.html simulator/UI_VERSION.txt
          git diff --cached --check
          git commit -m 'simulator: enable Last War hero pages v4'
          git push origin HEAD:simulator-standalone-v1
