name: Sentinel Train launcher v1

on:
  push:
    branches:
      - sentinel-train-launcher-v1
    paths:
      - 'frontend/train-native/sentinel-train-v1.js'
      - 'frontend/index.html'
      - 'scripts/patch-sentinel-train-launcher-v1.mjs'
      - '.github/workflows/sentinel-train-launcher-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sentinel-train-launcher-v1
          fetch-depth: 0
      - name: Patch native Train app and checksum
        run: node scripts/patch-sentinel-train-launcher-v1.mjs
      - name: Validate JavaScript
        run: |
          node --check frontend/train-native/app.v15.js
          node --check frontend/train-native/sentinel-train-v1.js
      - name: Validate Sentinel Train contract
        run: |
          grep -q 'WFGG_SENTINEL_TRAIN_LOADER_V1' frontend/train-native/app.v15.js
          grep -q "script.src = '/train-native/sentinel-train-v1.js?v=001'" frontend/train-native/app.v15.js
          grep -q "data?.system?.role === 'OWNER'" frontend/train-native/sentinel-train-v1.js
          grep -q "PORTAL_API + '/api/sentinel/run'\|portalFetch('/api/sentinel/run')" frontend/train-native/sentinel-train-v1.js
          grep -q "WFGG_SENTINEL_TRAIN_ROUND_LAUNCHER_V1" frontend/train-native/sentinel-train-v1.js
          grep -q "WFGG_SENTINEL_REPORT_V2" frontend/train-native/sentinel-train-v1.js
          ! grep -q 'sentinel-launcher-v2.js' frontend/index.html
          ! grep -q 'sentinel-owner-v1.js' frontend/index.html
          sha256sum -c frontend/train-native/app.v15.js.sha256
      - name: Commit generated native app changes
        run: |
          if git diff --quiet -- frontend/train-native/app.v15.js frontend/train-native/app.v15.js.sha256; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/train-native/app.v15.js frontend/train-native/app.v15.js.sha256
          git commit -m 'feat(sentinel): load OWNER panel inside Train'
          git push origin HEAD:sentinel-train-launcher-v1
