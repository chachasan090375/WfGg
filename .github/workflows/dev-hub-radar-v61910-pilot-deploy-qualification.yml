name: ChaCha DEV Radar V6.19.10 pilot deploy qualification

on:
  push:
    branches: [dev-hub-v5-radar-cluster-quality-diagnostic-v1]
    paths:
      - 'dev-hub/bin/run-radar-v61910-pilot-via-chacha-dev.sh'
      - 'dev-hub/projects/wfgg-radar/project-intent.v1.json'
      - '.github/workflows/dev-hub-radar-v61910-pilot-deploy-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PILOT_REV: 6761a1b7383143a40883af3373d6fd9d43a80359
  EXPECTED_CONNECTOR_SHA256: 18b972ebd63ea34de6e67c432c863598da1769fa33559115728a2e20d5015863
  EXPECTED_NATIVE_SHA256: 274d040f5294cb09422e5d55cc4b5335ac7739924c33dcb67b3f279645814900

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-hub-v5-radar-cluster-quality-diagnostic-v1

      - name: Validate governed runner
        run: |
          set -euo pipefail
          R=dev-hub/bin/run-radar-v61910-pilot-via-chacha-dev.sh
          bash -n "$R"
          grep -Fq 'PILOT_REV="6761a1b7383143a40883af3373d6fd9d43a80359"' "$R"
          grep -Fq 'PILOT_BRANCH="radar-v61910-autopilot-continue-partial-limit"' "$R"
          grep -Fq 'CONNECTOR_SHA="18b972ebd63ea34de6e67c432c863598da1769fa33559115728a2e20d5015863"' "$R"
          grep -Fq 'NATIVE_SHA="274d040f5294cb09422e5d55cc4b5335ac7739924c33dcb67b3f279645814900"' "$R"
          grep -Fq 'radar-vps/install-v61910-pilot.sh' "$R"
          grep -Fq 'radar-vps/probe-v61910-pilot-runtime.sh' "$R"
          grep -Fq 'RADAR_V61910_GAME_SCAN_EXECUTED=NO' "$R"
          grep -Fq 'RADAR_V61910_COLLECTOR_MUTATION=NO' "$R"
          grep -Fq 'RADAR_V61910_CHACHA_DEPLOY=PASS' "$R"
          echo RADAR_V61910_CHACHA_RUNNER=PASS

      - name: Validate project intent
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          x=json.load(open('dev-hub/projects/wfgg-radar/project-intent.v1.json',encoding='utf-8'))
          assert x['current_change']['id']=='radar-v61910-autopilot-continue-partial-limit',x
          assert x['current_change']['pilot_only'] is True,x
          criteria='\n'.join(x.get('acceptance_criteria') or [])
          assert 'PARTIAL_AFTER_RETRIES' in criteria,criteria
          assert 'SEED_SKIPPED_PARTIAL' in criteria,criteria
          assert 'Production promotion requires a separate explicit human approval.' in criteria,criteria
          print('RADAR_V61910_PROJECT_INTENT=PASS')
          PY

      - name: Validate pinned pilot assets
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/chachasan090375/WfGg/$PILOT_REV"
          mkdir -p /tmp/v61910
          for f in radar-vps/pilot-v61910/SHA256SUMS radar-vps/pilot-v61910/PILOT_INFO.txt radar-vps/pilot-v61910/radar-connector radar-vps/pilot-v61910/radar-native-template radar-vps/install-v61910-pilot.sh radar-vps/probe-v61910-pilot-runtime.sh; do
            curl -fsSL "$BASE/$f" -o "/tmp/v61910/$(basename "$f")"
          done
          grep -Fq 'WFGG_RADAR_PILOT=V6.19.10' /tmp/v61910/PILOT_INFO.txt
          grep -Fq 'AUTOPILOT_CONTINUE_PARTIAL_LIMIT=YES' /tmp/v61910/PILOT_INFO.txt
          grep -Fq 'PARTIAL_LIMIT_GLOBAL_STOP=NO' /tmp/v61910/PILOT_INFO.txt
          grep -Fq 'PARTIAL_VALID_EVIDENCE_PRESERVED=YES' /tmp/v61910/PILOT_INFO.txt
          grep -Fq 'NO_DATA_CONTINUE_PRESERVED=YES' /tmp/v61910/PILOT_INFO.txt
          (
            cd /tmp/v61910
            sha256sum -c SHA256SUMS
          )
          test "$(sha256sum /tmp/v61910/radar-connector | awk '{print $1}')" = "$EXPECTED_CONNECTOR_SHA256"
          test "$(sha256sum /tmp/v61910/radar-native-template | awk '{print $1}')" = "$EXPECTED_NATIVE_SHA256"
          bash -n /tmp/v61910/install-v61910-pilot.sh
          bash -n /tmp/v61910/probe-v61910-pilot-runtime.sh
          grep -Fq 'SEED_SKIPPED_PARTIAL' /tmp/v61910/probe-v61910-pilot-runtime.sh
          grep -Fq 'PARTIAL_AFTER_RETRIES' /tmp/v61910/probe-v61910-pilot-runtime.sh
          grep -Fq 'RADAR_V61910_GAME_SCAN_EXECUTED=NO' /tmp/v61910/probe-v61910-pilot-runtime.sh
          grep -Fq 'RADAR_V61910_COLLECTOR_MUTATION=NO' /tmp/v61910/probe-v61910-pilot-runtime.sh
          echo RADAR_V61910_PINNED_PILOT_ASSETS=PASS

      - name: Verify one-shot approval contract
        run: |
          set -euo pipefail
          R=dev-hub/bin/run-radar-v61910-pilot-via-chacha-dev.sh
          grep -Fq 'J’approuve le PILOT Radar V6.19.10 Autopilot Continue-on-Partial-Limit révision 6761a1b7383143a40883af3373d6fd9d43a80359 avec probe de garde sans scan de jeu.' "$R"
          grep -Fq '"revision":"6761a1b7383143a40883af3373d6fd9d43a80359"' "$R"
          grep -Fq 'PRODUCTION_RELEASE_APPROVAL_REVOKED=PASS' "$R"
          grep -Fq 'RADAR_V61910_PILOT_WINDOW_CLOSED=YES' "$R"
          echo RADAR_V61910_ONE_SHOT_APPROVAL=PASS
