name: ChaCha DEV V6.50 agent benchmark shadow evolution qualification
on:
  push:
    branches: [dev-hub-v650-agent-benchmark-shadow-evolution-campaigns]
    paths:
      - 'dev-hub/bin/agent_benchmark_harness.py'
      - 'dev-hub/bin/agent_evolution_daily_cycle.py'
      - 'dev-hub/bin/install-v650-agent-benchmark-bus-self-evolution.sh'
      - 'dev-hub/systemd/chacha-dev-agent-observation-bus-health.service'
      - 'dev-hub/systemd/chacha-dev-agent-observation-bus-health.timer'
      - 'dev-hub/bin/agent_observation_bus_health.py'
      - 'dev-hub/bin/autonomous-project-orchestrator.py'
      - 'dev-hub/config/agent-benchmark-harness.v1.json'
      - 'dev-hub/config/agent-observation-bus.v1.json'
      - 'dev-hub/config/technology-core-watch.v1.json'
      - 'dev-hub/config/technology-watch-logician.v1.json'
      - 'dev-hub/tests/test_v650_agent_benchmark_harness.py'
      - 'dev-hub/tests/test_v650_observation_bus_self_evolution.py'
      - '.github/workflows/dev-hub-v650-agent-benchmark-shadow-evolution-qualification.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Static validation
        run: |
          set -euo pipefail
          python3 -m py_compile dev-hub/bin/agent_benchmark_harness.py dev-hub/bin/agent_observation_bus_health.py dev-hub/bin/agent_evolution_daily_cycle.py dev-hub/bin/autonomous-project-orchestrator.py dev-hub/tests/test_v650_agent_benchmark_harness.py dev-hub/tests/test_v650_observation_bus_self_evolution.py
          python3 -m json.tool dev-hub/config/agent-benchmark-harness.v1.json >/dev/null
          python3 -m json.tool dev-hub/config/agent-observation-bus.v1.json >/dev/null
          python3 -m json.tool dev-hub/config/technology-core-watch.v1.json >/dev/null
          python3 -m json.tool dev-hub/config/technology-watch-logician.v1.json >/dev/null
          bash -n dev-hub/bin/install-v650-agent-benchmark-bus-self-evolution.sh
          grep -Fq 'OnCalendar=daily' dev-hub/systemd/chacha-dev-agent-observation-bus-health.timer
          grep -Fq '"version":"6.50.0"' dev-hub/bin/autonomous-project-orchestrator.py
      - name: Benchmark harness
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v650_agent_benchmark_harness.py | tee /tmp/v650-bench.out
          grep -Fq 'CHACHA_DEV_V650_70_SCHEDULED_ACTIONS_CONSUMED=PASS' /tmp/v650-bench.out
          grep -Fq 'CHACHA_DEV_V650_BENCHMARK_PRODUCTION_TRUTH=NO' /tmp/v650-bench.out
          grep -Fq 'CHACHA_DEV_V650_SHADOW_COMPARISON=PASS' /tmp/v650-bench.out
      - name: Observation bus self evolution
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v650_observation_bus_self_evolution.py | tee /tmp/v650-bus.out
          grep -Fq 'CHACHA_DEV_V650_BUS_SELF_HEALTH=PASS' /tmp/v650-bus.out
          grep -Fq 'CHACHA_DEV_V650_AGENT_CHANGE_REASSESSMENT=PASS' /tmp/v650-bus.out
          grep -Fq 'CHACHA_DEV_V650_BUS_HASH_TAMPER_DETECTED=PASS' /tmp/v650-bus.out
          grep -Fq 'CHACHA_DEV_V650_BUS_SELF_MUTATION=NO' /tmp/v650-bus.out
      - name: V6.49 regression
        run: |
          set -euo pipefail
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v649_assurance_agent_instrumentation.py >/tmp/v649.out
          grep -Fq 'CHACHA_DEV_V649_PRIORITY_ASSURANCE_TARGETS=PASS' /tmp/v649.out
          PYTHONPATH=dev-hub/bin python3 dev-hub/tests/test_v648_agent_observation_bus.py >/tmp/v648.out
          grep -Fq 'CHACHA_DEV_V648_HASH_CHAIN=PASS' /tmp/v648.out
      - name: Receipt
        run: |
          echo CHACHA_DEV_V650_QUALIFICATION=PASS
          echo BENCHMARK_FIXTURE_PRODUCTION_TRUTH=NO
          echo OBSERVATION_BUS_SELF_MUTATION=NO
          echo OBSERVATION_BUS_CANDIDATE_OWNER=CAPABILITY_FOUNDRY
          echo ARCHITECTURE_COUNCIL_FINAL_AUTHORITY=YES
          echo AUTOMATIC_EXTERNAL_SPEND_EUR=0
