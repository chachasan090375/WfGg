name: WfGg design system preview v1

on:
  push:
    branches: [design-system-preview-v1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design-system-preview-v1
          fetch-depth: 0
      - name: Wire shared preview assets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index=Path('frontend/index.html')
          s=index.read_text()
          css='  <link rel="stylesheet" href="wfgg-design-system-preview-v1.css?v=001" />\n'
          js='  <script src="wfgg-design-system-preview-v1.js?v=001" defer></script>\n'
          if 'wfgg-design-system-preview-v1.css' not in s:
              needle='  <link rel="stylesheet" href="portal-invitations-v1.css?v=001" />\n'
              if needle not in s: raise SystemExit('index css anchor missing')
              s=s.replace(needle,needle+css,1)
          if 'wfgg-design-system-preview-v1.js' not in s:
              needle='  <script src="guest-access.js?v=001"></script>\n'
              if needle not in s: raise SystemExit('index js anchor missing')
              s=s.replace(needle,js+needle,1)
          index.write_text(s)

          worker=Path('frontend/_worker.js')
          w=worker.read_text()
          marker='WFGG_DESIGN_SYSTEM_PREVIEW_PROXY_V1'
          if marker not in w:
              old="""        let html = languageBridgeScript(options.routeName || route.prefix.slice(1));
        if (options.baseHref) {
"""
              new="""        let html = languageBridgeScript(options.routeName || route.prefix.slice(1));
        /* WFGG_DESIGN_SYSTEM_PREVIEW_PROXY_V1
           Preview branch only: Portal, Guides and Train share the same visual mask.
           The module sources and business logic remain untouched. */
        html = '<link rel="stylesheet" href="/wfgg-design-system-preview-v1.css?v=001">' +
          '<script src="/wfgg-design-system-preview-v1.js?v=001" defer><\\/script>' + html;
        if (options.baseHref) {
"""
              if old not in w: raise SystemExit('worker head anchor missing')
              w=w.replace(old,new,1)
          worker.write_text(w)
          PY
          node --check frontend/_worker.js
          node --check frontend/wfgg-design-system-preview-v1.js
          grep -Fq 'WFGG_DESIGN_SYSTEM_PREVIEW_V1' frontend/wfgg-design-system-preview-v1.css
          grep -Fq 'WFGG_DESIGN_SYSTEM_PREVIEW_PROXY_V1' frontend/_worker.js
          grep -Fq 'wfgg-design-system-preview-v1.css?v=001' frontend/index.html
          grep -Fq 'wfgg-design-system-preview-v1.js?v=001' frontend/index.html
      - name: Commit wiring if needed
        run: |
          if git diff --quiet; then
            echo 'Preview wiring already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/index.html frontend/_worker.js
          git commit -m 'preview: apply common design mask to portal guides and train'
          git push origin HEAD:design-system-preview-v1
