name: Simulator CSP cleanup

on:
  push:
    branches: [simulator-standalone-v1]
    paths:
      - '.github/workflows/simulator-csp-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simulator-standalone-v1
          fetch-depth: 0

      - name: Replace inline/dynamic styles with classes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app=Path('simulator/app.js')
          s=app.read_text(encoding='utf-8')
          old="const el=$('#saveState'); if(el){el.textContent=ui('saved'); el.style.opacity='1'; setTimeout(()=>el.style.opacity='.7',650);}"
          new="const el=$('#saveState'); if(el){el.textContent=ui('saved'); el.classList.add('save-state-flash'); setTimeout(()=>el.classList.remove('save-state-flash'),650);}"
          if old not in s: raise SystemExit('saveState inline-style marker not found')
          s=s.replace(old,new,1)
          s=s.replace('class=\"section-card\" style=\"margin-top:12px\"','class=\"section-card summary-json-card\"')
          s=s.replace('class=\"toolbar\" style=\"margin-top:10px;margin-bottom:0\"','class=\"toolbar summary-json-toolbar\"')
          app.write_text(s,encoding='utf-8')

          tactics=Path('simulator/tactics-profile-v1.js')
          s=tactics.read_text(encoding='utf-8')
          old="if(s)s.style.display='none';"
          if old not in s: raise SystemExit('tactics hideLegacy style marker not found')
          s=s.replace(old,"if(s)s.classList.add('legacy-tactics-hidden');",1)
          tactics.write_text(s,encoding='utf-8')

          css=Path('simulator/style.css')
          s=css.read_text(encoding='utf-8')
          add="\n.save-state{opacity:.7;transition:opacity .2s ease}.save-state.save-state-flash{opacity:1}.summary-json-card{margin-top:12px}.summary-json-toolbar{margin-top:10px;margin-bottom:0}.legacy-tactics-hidden{display:none!important}\n"
          if '.legacy-tactics-hidden{' not in s: s += add
          css.write_text(s,encoding='utf-8')
          PY

      - name: Strict CSP source audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          bad=[]
          for p in Path('simulator').rglob('*'):
              if not p.is_file() or p.suffix not in {'.js','.html'}: continue
              text=p.read_text(encoding='utf-8')
              for pat in (r'\.style\.[A-Za-z_$][\w$]*\s*=', r'\bstyle\s*=\s*["\']'):
                  for m in re.finditer(pat,text):
                      line=text.count('\n',0,m.start())+1
                      bad.append((str(p),line,text[m.start():m.start()+120].replace('\n',' ')))
          if bad:
              for x in bad: print('CSP_INLINE_STYLE',*x)
              raise SystemExit(f'{len(bad)} inline/dynamic style writes remain')
          print('STRICT CSP STYLE AUDIT OK')
          PY

      - name: Mirror and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf frontend/simulator
          cp -a simulator frontend/simulator
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulator frontend/simulator
          git diff --cached --check
          if git diff --cached --quiet; then echo 'No CSP changes'; exit 0; fi
          git commit -m 'fix: make simulator compatible with strict CSP'
          git push origin HEAD:simulator-standalone-v1
