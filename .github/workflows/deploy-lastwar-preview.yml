name: Deploy LastWar preview API

on:
  workflow_dispatch:
  push:
    branches:
      - portal-auth-lastwar-lab-v1
    paths:
      - '.github/workflows/deploy-lastwar-preview.yml'
      - 'wrangler.jsonc'
      - 'worker/src/index-lastwar-preview.js'
      - 'worker/src/lastwar-identities.js'

permissions:
  contents: read

concurrency:
  group: wfgg-lastwar-preview-api
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/portal-auth-lastwar-lab-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v6

      - name: Deploy isolated LastWar preview Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          command: deploy --config wrangler.jsonc
