name: ChaCha DEV V8.2.4 Atomic Code Transport

on:
  push:
    branches:
      - dev-hub-v824-governed-build-runtime-roots
    paths:
      - '.github/workflows/v824-atomic-code-transport.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact governed code patch
        run: |
          set -euo pipefail
          echo 'eb030d0e95a8f033aa27891590bc56116babaf9867658e20de0bf5d183deb684  .chacha-transport/v824-lineage-fix.patch.gz' | sha256sum -c -
          gzip -dc .chacha-transport/v824-lineage-fix.patch.gz > /tmp/v824-lineage-fix.patch
          echo 'd2b329e7dac4e8d237acd550cd4bc7bc9133d14f8a6178b13faaecec53b33195  /tmp/v824-lineage-fix.patch' | sha256sum -c -
          git apply --index /tmp/v824-lineage-fix.patch
          git restore --staged --worktree -- .github/workflows/dev-hub-v824-governed-build-runtime-roots.yml
          test "$(git ls-files -s dev-hub/bin/central-interface-controller.py | awk '{print $2}')" = "92025007c764c404a7550dfb72d2a2d6dbd38a14"
          test "$(git ls-files -s dev-hub/bin/project-control.py | awk '{print $2}')" = "306b4471314e4ff43fdab124c5de84a54efd0cbb"
          test "$(git ls-files -s dev-hub/tests/test_v824_effective_adapter_lineage.py | awk '{print $2}')" = "90ec614e7f42300bb94ad4657f3d1f3eb9717c38"
          expected=$(printf '%s\n' 'dev-hub/bin/central-interface-controller.py' 'dev-hub/bin/project-control.py' 'dev-hub/tests/test_v824_effective_adapter_lineage.py')
          actual=$(git diff --cached --name-only | sort)
          test "$actual" = "$expected"
          git config user.name "ChaCha DEV Governed Transport"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(v824): preserve effective adapter lineage verification code"
          git push origin HEAD:dev-hub-v824-governed-build-runtime-roots
