<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#100d16" />
  <title>WfGg · Portail</title>
  <link rel="stylesheet" href="portal-v070.css?v=071" />
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <main id="app" class="app-shell">
    <section id="bootView" class="center-view"><div class="spinner" aria-label="Chargement"></div></section>

    <section id="authView" class="center-view hidden">
      <div class="auth-card glass-card">
        <div class="brand-row"><div class="brand-mark">W</div><div><p class="eyebrow">WfGg</p><h1 data-i18n="auth.title">Portail</h1></div></div>
        <p class="muted" data-i18n="auth.subtitle">Entrez votre code WfGg pour vous connecter.</p>
        <form id="authForm" class="stack">
          <label class="field-label" for="authCode" data-i18n="auth.code">Code d’authentification</label>
          <input id="authCode" class="code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="••••••" required />
          <button class="primary-button" type="submit" data-i18n="auth.login">Se connecter</button>
          <p id="authError" class="error-text hidden"></p>
        </form>
        <div class="language-strip" id="languageStrip">
          <button type="button" data-lang="fr">FR</button><button type="button" data-lang="it">IT</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="es">ES</button>
        </div>
      </div>
    </section>

    <section id="portalView" class="portal hidden">
      <header class="topbar glass-card">
        <button id="homeButton" class="brand-button alliance-brand-button" type="button"><span class="alliance-logo-shell small"><img id="topAllianceLogo" class="alliance-logo" alt="Logo WfGg"><span id="topAllianceFallback" class="alliance-logo-fallback">W</span></span><div class="brand-copy"><strong id="topAllianceName">WfGg</strong><small id="topAllianceMeta">Alliance · Portail</small></div></button>
        <div class="top-actions">
          <button id="profileChip" class="profile-chip" type="button">
            <div class="profile-chip-copy"><strong id="topName">—</strong><small id="topRole">—</small></div><span id="topAvatar" class="avatar"></span><span class="chevron">⌄</span>
          </button>
          <div id="profileMenu" class="profile-menu glass-card hidden">
            <button type="button" data-action="settings" data-i18n="home.settings">⚙️ Paramètres</button>
            <button type="button" data-action="logout" data-i18n="home.logout">Déconnexion</button>
          </div>
        </div>
      </header>

      <section class="hero">
        <div class="alliance-identity">
          <span class="alliance-logo-shell hero-logo"><img id="heroAllianceLogo" class="alliance-logo" alt="Logo de l’alliance"><span id="heroAllianceFallback" class="alliance-logo-fallback">W</span></span>
          <div class="alliance-identity-copy">
            <span class="alliance-kicker">ALLIANCE · LAST WAR</span>
            <strong id="heroAllianceName">WfGg</strong>
            <span id="heroAllianceServer" class="alliance-server">Serveur —</span>
          </div>
        </div>
        <p class="eyebrow" data-i18n="home.welcome">Bienvenue</p>
        <h2><span id="heroName">—</span></h2>
        <p id="homeWelcome" class="muted">Choisissez votre espace WfGg.</p>
      </section>
      <div id="profileRequiredBanner" class="profile-required glass-card hidden"><span>ℹ️</span><strong data-i18n="home.profileIncomplete">Votre profil est incomplet. Vous pouvez le compléter dans Paramètres.</strong></div>

      <section class="module-grid" aria-label="Navigation principale">
        <button class="module-card glass-card" type="button" data-module="guides"><span class="module-icon">📚</span><span class="module-arrow">↗</span><span class="module-copy"><strong id="guidesCardTitle">Guides</strong><small data-i18n="home.guidesSub">Saison 6 et Inter-Saison</small></span></button>
        <button class="module-card glass-card" type="button" data-module="train"><span class="module-icon">🚂</span><span class="module-arrow">↗</span><span class="module-copy"><strong id="trainCardTitle">Train</strong><small data-i18n="home.trainSub">Organisation et rotations</small></span></button>
        <button class="module-card glass-card settings-card" type="button" data-action="settings"><span class="module-icon">⚙️</span><span class="module-arrow">→</span><span class="module-copy"><strong data-i18n="home.settings">Paramètres</strong><small data-i18n="home.settingsSub">Profil, alliance et administration</small></span></button>
      </section>
    </section>
  </main>

  <div id="settingsOverlay" class="overlay hidden">
    <section class="settings-panel glass-card" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <header class="settings-header"><div><p class="eyebrow">WfGg</p><h2 id="settingsTitle" data-i18n="settings.title">Paramètres</h2></div><button class="icon-button" type="button" data-action="close-settings" aria-label="Fermer">×</button></header>
      <nav id="settingsTabs" class="tabs"></nav>
      <div id="settingsContent"></div>
    </section>
  </div>

  <div id="membersView" class="members-view hidden" aria-hidden="true">
    <header class="members-topbar">
      <button class="members-back" type="button" data-action="close-members">←</button>
      <div><p class="eyebrow">WfGg</p><h2 data-i18n="members.title">Joueurs de l’alliance</h2></div>
      <span id="membersCount" class="members-count">0</span>
    </header>
    <div class="members-page">
      <div class="members-tools">
        <button class="compact-primary" type="button" data-action="add-member">＋ <span data-i18n="members.add">Ajouter un joueur</span></button>
        <label class="member-search"><span>🔎</span><input id="memberSearch" type="search" autocomplete="off" data-i18n-placeholder="members.search" placeholder="Rechercher un pseudo…" /></label>
        <div id="rankFilters" class="rank-filters" aria-label="Filtres de rang"></div>
      </div>
      <div id="memberList" class="member-list"></div>
    </div>
  </div>

  <div id="modal" class="modal hidden"><div class="modal-backdrop" data-action="close-modal"></div><section class="modal-sheet"><div class="modal-handle"></div><button class="modal-close" type="button" data-action="close-modal">×</button><div id="modalBody"></div></section></div>

  <script src="config.js"></script>
  <script src="legacy-avatars.js?v=071"></script>
  <script src="portal-v070.js?v=071"></script>
</body>
</html>
