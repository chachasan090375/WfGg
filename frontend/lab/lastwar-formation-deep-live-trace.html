<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>WfGg LAB — Formation Deep Live Trace</title><style>:root{color-scheme:dark;--bg:#09090d;--p:#15141a;--l:#34303e;--t:#f5f1f8;--m:#aaa1b3;--a:#9b7cff;--ok:#78daa0;--w:#f0c575;--bad:#f28a94}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px}.top h1{font-size:30px;margin:4px 0}a{color:#cabdff}.muted{color:var(--m)}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}.stat,.card{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:14px}.stat span{display:block;color:var(--m)}.stat strong{font-size:28px}.pill{display:inline-block;border:1px solid var(--ok);border-radius:999px;padding:6px 10px;margin:6px 0}.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0}.tabs button{background:var(--p);border:1px solid var(--l);border-radius:11px;color:var(--t);padding:10px 14px;font-size:16px}.tabs button.on{border-color:var(--a)}.row{margin:9px 0;padding:12px;background:var(--p);border:1px solid var(--l);border-radius:12px;overflow-wrap:anywhere}.row strong{display:block}.score{color:var(--ok);font-size:13px}.new{color:var(--w);font-size:13px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d0c12;border:1px solid var(--l);border-radius:10px;padding:10px;font-size:11px}.empty{padding:18px;border:1px dashed var(--l);border-radius:12px;color:var(--m)}@media(min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}</style></head><body><main><div class="top"><div><div class="muted">WFGG · LAST WAR · LAB · DEEP RUNTIME</div><h1>Formation — fichiers & syscalls</h1><div id="status" class="muted">Chargement…</div></div><a href="/lab/lastwar-formation-live-trace.html?v=2">← Live Trace</a></div><div id="stats" class="stats"></div><div id="verdict" class="card"></div><div class="tabs"><button class="on" data-tab="strong">Candidats forts</button><button data-tab="fd">/proc/fd</button><button data-tab="strace">strace</button><button data-tab="raw">Diagnostic</button></div><div id="content"></div></main><script>const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),stat=(a,b)=>`<div class="stat"><span>${esc(a)}</span><strong>${esc(b)}</strong></div>`;let D=null,T='strong';function rows(a,kind){if(!a?.length)return'<div class="empty">Aucun élément.</div>';return a.map(x=>`<div class="row"><strong>${esc(x.path||x.template||'')}</strong><div class="score">score ${esc(x.score??'—')} ${x.count!=null?'· '+esc(x.count)+' ouverture(s)':''}${x.samples!=null?'· '+esc(x.samples)+' échantillon(s)':''}</div>${x.new?'<div class="new">NOUVEAU pendant la capture</div>':''}${x.hits?.length?`<div class="muted">${esc(x.hits.join(' · '))}</div>`:''}</div>`).join('')}function render(){if(!D)return;let h='';if(T==='strong')h=rows(D.strongCandidates,'s');if(T==='fd')h=rows(D.fdCandidates,'f');if(T==='strace')h=rows(D.straceOpenPaths,'t');if(T==='raw')h=`<div class="card"><strong>Syscalls</strong><pre>${esc(JSON.stringify(D.syscalls||{},null,2))}</pre><strong>Début strace</strong><pre>${esc((D.straceHead||[]).join('\n'))}</pre><strong>Erreurs polling FD</strong><pre>${esc((D.fdPollErrors||[]).join('\n')||'aucune')}</pre></div>`;$('content').innerHTML=h}document.querySelectorAll('button[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('button[data-tab]').forEach(x=>x.classList.remove('on'));b.classList.add('on');T=b.dataset.tab;render()});(async()=>{try{const r=await fetch('/lab/formation-deep-live-trace-data/latest.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);D=await r.json();const s=D.summary||{};$('status').textContent=`capture ${D.sessionId||''} chargée`;$('stats').innerHTML=[stat('Frames FD',s.fdFrames||0),stat('FD uniques',s.fdUnique||0),stat('Nouveaux FD',s.fdNew||0),stat('openat',s.openPaths||0),stat('strace lignes',s.straceLines||0),stat('Candidats forts',s.strongCandidates||0),stat('Attach strace',s.straceAttachDenied?'REFUSÉ':'OK/INCONNU'),stat('Label',D.label||'')].join('');$('verdict').innerHTML=`<h2>Verdict</h2><div class="pill">${esc(D.verdict)}</div><p>${esc(D.method)}</p>`;render()}catch(e){$('status').textContent='Capture absente : '+e.message}})();</script></body></html>
