<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>WfGg LAB — Consensus Formation</title><style>:root{color-scheme:dark;--bg:#09090d;--p:#15141a;--l:#34303e;--t:#f4f0f7;--m:#aaa1b3;--a:#9b7cff;--ok:#75d69c;--w:#f0c575}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:14px}.muted{color:var(--m)}a{color:#cbbcff}.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0}.stat,.card{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:14px}.stat span{display:block;color:var(--m);font-size:13px}.stat strong{display:block;font-size:26px}.badge{display:inline-block;border:1px solid var(--ok);border-radius:999px;padding:6px 10px;margin:6px 4px 6px 0}.warn{border-color:var(--w)}.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0}.tabs button{background:var(--p);color:var(--t);border:1px solid var(--l);border-radius:12px;padding:11px 14px;font-size:16px}.tabs button.on{border-color:var(--a)}.row{margin:10px 0}.row h3{font-size:15px;margin:0 0 7px;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--m);margin-bottom:7px}.token{display:inline-block;background:#1d1a24;border:1px solid var(--l);border-radius:999px;padding:5px 8px;margin:3px}.hidden{display:none}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d0c12;border:1px solid var(--l);border-radius:9px;padding:9px;font-size:11px}.section h2{font-size:21px}@media(min-width:760px){.sum{grid-template-columns:repeat(4,minmax(0,1fr))}}</style></head><body><main><div class="top"><div><div class="muted">WFGG · LAST WAR · LAB · CONSENSUS</div><h1>Formation — aller ∩ retour − témoin</h1><div id="status" class="muted">Chargement…</div></div><a href="/lab/lastwar-formation-live-trace.html?v=2">← Live Trace</a></div><div id="summary" class="sum"></div><div id="verdict" class="card"></div><section class="section"><h2>Sessions</h2><div id="sessions" class="card"></div></section><section class="section"><h2>Tokens / identifiants</h2><div id="tokens" class="card"></div></section><div class="tabs"><button data-tab="strong" class="on">Fortes</button><button data-tab="signals">Signaux</button><button data-tab="sockets">Réseau</button><button data-tab="common">Consensus complet</button></div><div id="strong"></div><div id="signals" class="hidden"></div><div id="sockets" class="hidden"></div><div id="common" class="hidden"></div></main><script>const $=x=>document.getElementById(x),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),stat=(a,b)=>`<div class="stat"><span>${e(a)}</span><strong>${e(b)}</strong></div>`;function row(r){return `<article class="card row"><h3>${e(r.template||r.normalized||'')}</h3><div class="meta">aller ${e(r.forward??r.countForward)} · témoin ${e(r.baseline??r.countBaseline)} · retour ${e(r.reverse??r.countReturn)} · excès ${e(r.excess??r.excessConsensus)}</div></article>`}function renderList(id,arr){$(id).innerHTML=(arr||[]).map(row).join('')||'<div class="card muted">Aucun élément.</div>'}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');['strong','signals','sockets','common'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.tab))});(async()=>{try{const r=await fetch('/lab/formation-live-trace-data/consensus.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json(),s=d.summary||{};$('status').textContent='consensus prêt';$('summary').innerHTML=[stat('Consensus',s.commonChangeTemplates??s.consensusLines??0),stat('Signaux',s.signals??0),stat('Fortes',s.strong??s.strongConsensus??0),stat('Sockets',s.commonUniqueSockets??s.socketConsensus??0)].join('');$('verdict').innerHTML=`<div class="badge ${(s.strong??0)?'':'warn'}">${e(d.verdict)}</div><p>${e(d.method||'')}</p>`;const q=d.sessions||{};$('sessions').innerHTML=`<b>Aller</b> ${e(q.forward?.id)} — ${e(q.forward?.label)}<br><b>Témoin</b> ${e(q.baseline?.id)} — ${e(q.baseline?.label)}<br><b>Retour</b> ${e(q.reverse?.id)} — ${e(q.reverse?.label)}`;$('tokens').innerHTML=(d.tokens||d.extracted?.identifiers||[]).slice(0,80).map(x=>`<span class="token">${e(x.value)} · ${e(x.score??x.count)}</span>`).join('')||'<span class="muted">Aucun token distinctif.</span>';renderList('strong',d.strong||d.strongConsensus);renderList('signals',d.signals);renderList('common',d.common||d.consensus);$('sockets').innerHTML=(d.commonUniqueSockets||d.socketConsensus||[]).map(x=>`<pre>${e(x)}</pre>`).join('')||'<div class="card muted">Aucun socket commun spécifique.</div>'}catch(err){$('status').textContent='Consensus absent : '+err.message}})();</script></body></html>
