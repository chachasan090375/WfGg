<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>WfGg LAB — Formation Lua Trace Viewer</title>
<style>
:root{color-scheme:dark;--bg:#09090d;--panel:#15141a;--panel2:#1d1a24;--line:#34303e;--text:#f4f0f7;--muted:#aaa1b3;--accent:#9b7cff;--ok:#75d69c;--warn:#f0c575;--bad:#ee8b8b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:1500px;margin:auto;padding:14px 14px 90px}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.top h1{margin:2px 0 4px;font-size:22px}.muted{color:var(--muted)}a{color:#cbbdff}.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}.stat{padding:9px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;margin-top:2px;overflow-wrap:anywhere}.toolbar{display:flex;gap:7px;overflow:auto;margin:10px 0}.toolbar button,.toolbar input,.toolbar select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px}.toolbar button.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}.toolbar input{min-width:220px;flex:1}.layout{display:grid;gap:10px}.graphwrap{position:relative;min-height:520px;overflow:auto;background:#0d0c12;border:1px solid var(--line);border-radius:12px}.graph{position:relative;min-width:1180px;min-height:520px;padding:16px}.edge{position:absolute;height:2px;background:#514966;transform-origin:0 50%;z-index:1;opacity:.55}.edge.exact{background:var(--ok);opacity:.85}.edge.candidate{background:var(--warn)}.edge.on{height:4px;opacity:1}.node{position:absolute;z-index:2;width:175px;min-height:64px;padding:8px 9px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);box-shadow:0 8px 20px rgba(0,0,0,.18);cursor:pointer}.node strong,.node small{display:block;overflow-wrap:anywhere}.node small{color:var(--muted);margin-top:4px}.node.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(155,124,255,.28)}.node.dim{opacity:.18}.node[data-kind="lua"]{border-left:4px solid #79b8ff}.node[data-kind="code"]{border-left:4px solid #c792ea}.node[data-kind="runtime"]{border-left:4px solid #f5a97f}.node[data-kind="ui"]{border-left:4px solid #91d7e3}.node[data-kind="render"]{border-left:4px solid #eed49f}.node[data-kind="asset"]{border-left:4px solid #a6da95}.node[data-kind="container"]{border-left:4px solid #f0c6c6}.detail{padding:12px}.detail h2{font-size:17px;margin:0 0 6px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:12px;padding:5px 7px;border:1px solid var(--line);border-radius:999px;background:#111018}.proof{margin-top:10px}.proof article{padding:9px;border-top:1px solid var(--line)}.proof code{white-space:pre-wrap;word-break:break-word;color:#ded4eb}.previewgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}.previewgrid img{width:100%;border:1px solid var(--line);border-radius:9px;background:#050507}.list{max-height:42vh;overflow:auto}.row{padding:9px;border-top:1px solid var(--line)}.row strong,.row span{display:block;overflow-wrap:anywhere}.row span{font-size:12px;color:var(--muted);margin-top:2px}.badge{display:inline-block!important;width:auto!important;padding:2px 6px;border-radius:999px;border:1px solid var(--line);margin-right:4px}.path{padding:10px;margin:10px 0;border:1px solid var(--line);border-radius:10px;background:#111018;overflow:auto}.path b{white-space:nowrap}.tabs{display:flex;gap:7px;overflow:auto;margin-top:10px}.tabs button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 11px}.tabs button.active{border-color:var(--accent)}.view{display:none}.view.active{display:block}@media(min-width:980px){.summary{grid-template-columns:repeat(6,minmax(0,1fr))}.layout{grid-template-columns:minmax(0,2fr) minmax(320px,1fr)}.graphwrap{min-height:680px}.graph{min-height:680px}.detail{position:sticky;top:8px;max-height:680px;overflow:auto}.previewgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body><main>
<div class="top"><div><div class="muted">WFGG · LAST WAR · LAB · TRACE VISUEL</div><h1>Formation ↔ Lua ↔ Murphy</h1><div id="status" class="muted">Chargement…</div></div><a href="/lab/">← LAB</a></div>
<div id="summary" class="summary"></div>
<div class="toolbar"><button id="allBtn" class="active">Tout</button><button id="formBtn">FormationRT</button><button id="murphyBtn">Murphy</button><button id="pathBtn">Chemin</button><input id="search" type="search" placeholder="Filtrer nœud, script, asset, preuve…"></div>
<div id="path" class="path"></div>
<div class="tabs"><button class="active" data-tab="graphView">Graphe</button><button data-tab="scriptsView">Scripts</button><button data-tab="containersView">Conteneurs</button></div>
<section id="graphView" class="view active"><div class="layout"><div class="graphwrap"><div id="graph" class="graph"></div></div><aside id="detail" class="panel detail"><div class="muted">Touchez un nœud pour afficher ses liaisons et les preuves.</div></aside></div></section>
<section id="scriptsView" class="view"><div class="panel list" id="scripts"></div></section>
<section id="containersView" class="view"><div class="panel list" id="containers"></div></section>
</main>
<script>
let D=null,selected=null,filterMode='all';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stat=(a,b)=>`<div class="stat"><span>${esc(a)}</span><strong>${esc(b)}</strong></div>`;
function kindLabel(k){return ({ui:'UI',runtime:'Runtime',lua:'Lua',code:'C#/XLua',asset:'Asset',render:'Render',container:'Conteneur',unknown:'Autre'})[k]||k}
function indexData(){D.nodeMap=Object.fromEntries(D.nodes.map(n=>[n.id,n]));D.evMap=Object.fromEntries(D.evidence.map(e=>[e.id,e]));D.out={};D.inc={};for(const e of D.edges){(D.out[e.source]??=[]).push(e);(D.inc[e.target]??=[]).push(e)}}
function layout(){const cols=['container','code','lua','runtime','ui','render','asset','unknown'];const grouped={};for(const c of cols)grouped[c]=[];for(const n of D.nodes)(grouped[n.kind]??=grouped.unknown).push(n);let x=20;const pos={};for(const c of cols){const arr=grouped[c]||[];arr.sort((a,b)=>(b.score||0)-(a.score||0));let y=25;for(const n of arr){pos[n.id]={x,y};y+=84}x+=195}return pos}
function visibleSet(){const q=$('search').value.trim().toLowerCase();let set=new Set(D.nodes.map(n=>n.id));if(filterMode==='formation')set=neighborhood('ui:FormationRT',2);if(filterMode==='murphy')set=neighborhood('asset:Murphy',2);if(filterMode==='path')set=new Set(D.shortestFormationMurphyPath||[]);if(q){set=new Set([...set].filter(id=>{const n=D.nodeMap[id];const txt=(n.label+' '+n.kind+' '+JSON.stringify(n)).toLowerCase();return txt.includes(q)||[...(D.out[id]||[]),...(D.inc[id]||[])].some(e=>{const ev=D.evMap[e.evidenceId];return (e.relation+' '+(ev?.text||'')).toLowerCase().includes(q)})}))}return set}
function neighborhood(seed,hops){const seen=new Set([seed]),q=[[seed,0]];while(q.length){const [x,d]=q.shift();if(d>=hops)continue;for(const e of [...(D.out[x]||[]),...(D.inc[x]||[])]){const y=e.source===x?e.target:e.source;if(!seen.has(y)){seen.add(y);q.push([y,d+1])}}}return seen}
function renderGraph(){const g=$('graph'),pos=layout(),vis=visibleSet();g.innerHTML='';let maxY=520,maxX=1180;for(const n of D.nodes){const p=pos[n.id];if(!p)continue;maxY=Math.max(maxY,p.y+100);maxX=Math.max(maxX,p.x+200)}g.style.minHeight=maxY+'px';g.style.minWidth=maxX+'px';for(const e of D.edges){const a=pos[e.source],b=pos[e.target];if(!a||!b)continue;const ax=a.x+175,ay=a.y+32,bx=b.x,by=b.y+32,dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;const d=document.createElement('div');d.className='edge '+(e.confidence==='exact'||e.proof==='serialized'||e.proof==='MethodDef'?'exact':e.confidence==='candidate'?'candidate':'');d.dataset.e=e.id;d.style.left=ax+'px';d.style.top=ay+'px';d.style.width=len+'px';d.style.transform=`rotate(${ang}deg)`;if(!vis.has(e.source)||!vis.has(e.target))d.style.opacity='.06';g.append(d)}for(const n of D.nodes){const p=pos[n.id];if(!p)continue;const el=document.createElement('div');el.className='node'+(vis.has(n.id)?'':' dim');el.dataset.id=n.id;el.dataset.kind=n.kind;el.style.left=p.x+'px';el.style.top=p.y+'px';el.innerHTML=`<strong>${esc(n.label)}</strong><small>${esc(kindLabel(n.kind))} · ${esc(n.degree??0)} liens</small>`;el.onclick=()=>selectNode(n.id);g.append(el)}if(selected)highlight(selected)}
function highlight(id){for(const n of document.querySelectorAll('.node'))n.classList.toggle('on',n.dataset.id===id);const es=new Set([...(D.out[id]||[]),...(D.inc[id]||[])].map(e=>e.id));for(const e of document.querySelectorAll('.edge'))e.classList.toggle('on',es.has(e.dataset.e))}
function selectNode(id){selected=id;highlight(id);const n=D.nodeMap[id];const links=[...(D.out[id]||[]).map(e=>({dir:'→',e,other:D.nodeMap[e.target]})),...(D.inc[id]||[]).map(e=>({dir:'←',e,other:D.nodeMap[e.source]}))];const pv=(D.previews||[]).filter(x=>x.nodeId===id);let h=`<h2>${esc(n.label)}</h2><div class="chips"><span class="chip">${esc(kindLabel(n.kind))}</span><span class="chip">${links.length} liaisons</span>${n.bundleId?`<span class="chip">bundle ${esc(n.bundleId)}</span>`:''}</div>`;if(n.note)h+=`<p class="muted">${esc(n.note)}</p>`;if(n.assetPath)h+=`<p><code>${esc(n.assetPath)}</code></p>`;if(pv.length)h+=`<div class="previewgrid">${pv.map(x=>`<img src="${esc(x.src)}" alt="${esc(x.name)}" title="${esc(x.name)}">`).join('')}</div>`;h+='<div class="proof">';for(const x of links){const ev=D.evMap[x.e.evidenceId];h+=`<article><b>${esc(x.dir)} ${esc(x.other?.label||'?')}</b><div class="muted">${esc(x.e.relation)} · preuve: ${esc(x.e.proof)} · confiance: ${esc(x.e.confidence)}</div>${ev?`<code>${esc(ev.text)}</code><div class="muted">${esc(ev.source)}</div>`:''}</article>`}h+='</div>';$('detail').innerHTML=h}
function renderLists(){const ss=D.scripts||[];$('scripts').innerHTML=ss.length?ss.map(s=>`<div class="row"><strong>${esc(s.name)}</strong><span>${esc(s.source||s.container||'')} · ${esc(s.lines??'?')} lignes ${s.binary?'· binaire':''}</span>${(s.hits||[]).slice(0,8).map(h=>`<span><b>L${esc(h.line)}</b> ${esc(h.text)}</span>`).join('')}</div>`).join(''):'<div class="row muted">Aucun script Lua texte extrait pour le moment.</div>';const cs=D.containers||[];$('containers').innerHTML=cs.length?cs.map(c=>`<div class="row"><strong>${esc(c.path)}</strong><span>${esc(c.kind)}${c.archive?' · '+esc(c.archive):''}${c.entries?' · '+esc(c.entries)+' entrées':''}${c.zipError?' · '+esc(c.zipError):''}</span></div>`).join(''):'<div class="row muted">Aucun conteneur candidat matérialisé pour le moment.</div>'}
function renderSummary(){const s=D.summary;$('summary').innerHTML=[stat('Nœuds',s.nodes),stat('Liaisons',s.edges),stat('Preuves',s.evidence),stat('Conteneurs',s.containers),stat('Scripts',s.scripts),stat('Lua parsés',s.luaSourcesParsed)].join('');const p=D.shortestFormationMurphyPath||[];$('path').innerHTML=p.length?'<b>'+p.map(id=>esc(D.nodeMap[id]?.label||id)).join(' → ')+'</b>':'<span class="muted">Pas encore de chemin exact FormationRT → Murphy : le maillon Lua dynamique doit encore être matérialisé.</span>'}
function setMode(m){filterMode=m;for(const [id,x] of [['allBtn','all'],['formBtn','formation'],['murphyBtn','murphy'],['pathBtn','path']])$(id).classList.toggle('active',m===x);renderGraph()}
$('allBtn').onclick=()=>setMode('all');$('formBtn').onclick=()=>setMode('formation');$('murphyBtn').onclick=()=>setMode('murphy');$('pathBtn').onclick=()=>setMode('path');$('search').oninput=()=>renderGraph();document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===b.dataset.tab))});
(async()=>{try{const r=await fetch('/lab/formation-lua-trace-viewer-data/manifest.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);D=await r.json();indexData();renderSummary();renderLists();renderGraph();$('status').textContent=`${D.summary.luaSourcesParsed?D.summary.luaSourcesParsed+' source(s) Lua analysée(s)':'viewer prêt — conteneur Lua à raccorder'}`;selectNode('ui:FormationRT')}catch(e){$('status').textContent='Données absentes : lance le runner ('+e.message+')'}})();
</script>
</body></html>
