<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>WfGg LAB — LWScripts Structure</title><style>:root{color-scheme:dark;--bg:#09090d;--p:#15141a;--p2:#1d1a24;--l:#34303e;--t:#f4f0f7;--m:#aaa1b3;--a:#9b7cff;--ok:#75d69c;--w:#f0c575;--bad:#ee8b8b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:1100px;margin:auto;padding:16px 16px 80px}.top{display:flex;justify-content:space-between;gap:12px}.top h1{margin:2px 0 4px;font-size:23px}a{color:#cabdff}.muted{color:var(--m)}.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}.stat,.card{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:11px}.stat span{display:block;color:var(--m);font-size:12px}.stat strong{font-size:19px;overflow-wrap:anywhere}.card{margin:10px 0}.card h2{font-size:18px;margin:0 0 8px;overflow-wrap:anywhere}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--l);background:var(--p2);border-radius:999px;padding:5px 8px;font-size:12px}.ok{border-color:var(--ok)}.warn{border-color:var(--w)}.bad{border-color:var(--bad)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d0c12;border:1px solid var(--l);border-radius:9px;padding:9px;font-size:11px;max-height:300px;overflow:auto}.bar{height:12px;background:#0d0c12;border:1px solid var(--l);border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}.row{padding:8px 0;border-top:1px solid var(--l)}@media(min-width:760px){.sum{grid-template-columns:repeat(4,minmax(0,1fr))}}</style></head><body><main><div class="top"><div><div class="muted">WFGG · LAST WAR · LAB · STRUCTURE</div><h1>LWScripts.data — radiographie</h1><div id="status" class="muted">Chargement…</div></div><div><a href="/lab/lastwar-lua-runtime-diagnostic.html?v=3">Diagnostic</a><br><a href="/lab/lastwar-formation-lua-trace-viewer.html?v=5">Graphe</a></div></div><div id="summary" class="sum"></div><div id="verdict" class="card"></div><section><h2>Métadonnées texte réelles</h2><div id="small"></div></section><section><h2>Entropie du gros fichier</h2><div id="entropy" class="card"></div></section><section><h2>Signatures internes</h2><div id="sigs" class="card"></div></section><section><h2>Chargeur LWLuaFile</h2><div id="loader" class="card"></div></section></main><script>const $=x=>document.getElementById(x),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),stat=(a,b)=>`<div class="stat"><span>${e(a)}</span><strong>${e(b)}</strong></div>`;function smallCard(r){const txt=r.bestText||'<aucun texte lisible>';const nums=(r.numericTokens||[]).map(x=>`${x.token} = ${x.value}`).join('\n')||'aucun';return `<article class="card"><h2>${e(r.name)}</h2><div class="chips"><span class="chip">${e(r.bytes||0)} octets</span><span class="chip">${e((r.decodings||[])[0]?.encoding||'binaire')}</span></div><pre>${e(txt)}</pre><details><summary>Valeurs numériques</summary><pre>${e(nums)}</pre></details></article>`}function meth(m){return `<div class="row"><strong>${e(m.symbol)}</strong>${(m.strings||[]).length?`<pre>STRINGS\n${e(m.strings.join('\n'))}</pre>`:''}<pre>CALLS\n${e([...(m.internalCalls||[]),...(m.externalCalls||[])].join('\n')||'aucun')}</pre></div>`}(async()=>{try{const r=await fetch('/lab/formation-lua-trace-viewer-data/lwscripts-structure.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json(),x=d.data||{};$('summary').innerHTML=[stat('Taille',Number(x.bytes||0).toLocaleString('fr-FR')+' o'),stat('CRC32',x.crc32Hex||'?'),stat('Entropie moyenne',x.avgEntropy??'?'),stat('Signatures',(x.knownSignatures||[]).length)].join('');let cls=d.verdict==='HIGH_ENTROPY_NO_STANDARD_SIGNATURE'?'warn':d.verdict==='EMBEDDED_STANDARD_SIGNATURES_FOUND'?'ok':'';$('verdict').innerHTML=`<h2>Verdict structurel</h2><div class="chips"><span class="chip ${cls}">${e(d.verdict)}</span></div><p>${e(d.nextHint)}</p>${(d.metadataMatches||[]).length?`<pre>${e(d.metadataMatches.map(m=>`${m.file}: ${m.token} → ${m.matches.join(', ')}`).join('\n'))}</pre>`:''}`;$('small').innerHTML=Object.values(d.smallFiles||{}).map(smallCard).join('');$('entropy').innerHTML=(x.windows||[]).map(w=>`<div class="row"><div><b>${Number(w.offset).toLocaleString('fr-FR')}</b> · H=${e(w.entropy)} · ASCII ${e(w.asciiPct)}%</div><div class="bar"><i style="width:${Math.min(100,(Number(w.entropy)||0)/8*100)}%"></i></div></div>`).join('');$('sigs').innerHTML=(x.knownSignatures||[]).length?(x.knownSignatures||[]).map(s=>`<div class="row"><b>${e(s.signature)}</b> @ ${Number(s.offset).toLocaleString('fr-FR')}</div>`).join(''):'<div class="muted">Aucune signature standard détectée dans les zones ciblées.</div>';$('loader').innerHTML=(d.loaderMethods||[]).map(meth).join('')||'<div class="muted">Aucune donnée loader.</div>';$('status').textContent='analyse structurelle prête'}catch(err){$('status').textContent='Analyse absente : '+err.message;console.error(err)}})();</script></body></html>
