<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>WfGg LAB — Lua Runtime Diagnostic</title>
<style>:root{color-scheme:dark;--bg:#09090d;--p:#15141a;--p2:#1d1a24;--l:#34303e;--t:#f4f0f7;--m:#aaa1b3;--a:#9b7cff;--ok:#75d69c;--w:#f0c575}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:1050px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px}.top h1{margin:2px 0;font-size:22px}a{color:#cabdff}.muted{color:var(--m)}.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}.card,.stat{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:11px}.stat span{display:block;color:var(--m);font-size:12px}.stat strong{display:block;font-size:20px}.card{margin:10px 0}.card h2{font-size:18px;margin:0 0 7px;overflow-wrap:anywhere}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--l);background:var(--p2);border-radius:999px;padding:5px 8px;font-size:12px}.ok{border-color:var(--ok)}.warn{border-color:var(--w)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d0c12;border:1px solid var(--l);border-radius:9px;padding:9px;font-size:11px;max-height:240px;overflow:auto}.section{margin-top:18px}.section h2{font-size:19px}.method{padding:9px 0;border-top:1px solid var(--l)}.method strong{display:block;overflow-wrap:anywhere}@media(min-width:760px){.sum{grid-template-columns:repeat(4,minmax(0,1fr))}}</style></head>
<body><main><div class="top"><div><div class="muted">WFGG · LAST WAR · LAB · DIAGNOSTIC RUNTIME</div><h1>Conteneurs Lua réels</h1><div id="status" class="muted">Chargement…</div></div><a href="/lab/lastwar-formation-lua-trace-viewer.html?v=3">← Graphe</a></div><div id="summary" class="sum"></div><section class="section"><h2>Fichiers runtime</h2><div id="files"></div></section><section class="section"><h2>Chargeur LWLuaFile</h2><div id="loader" class="card"></div></section></main>
<script>const $=x=>document.getElementById(x),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),stat=(a,b)=>`<div class="stat"><span>${e(a)}</span><strong>${e(b)}</strong></div>`;function fileCard(f){const dec=(f.decodings||[]).map(x=>`${x.encoding} ${x.score}`).join(' · ')||'aucun';const ah=(f.anchorHits||[]).map(x=>x.anchor+'@'+x.offset).join(', ')||'aucun';const strings=(f.asciiStrings||[]).slice(0,25).map(x=>`${x.offset}: ${x.text}`).join('\n');const decomp=(f.decompression||[]).filter(x=>x.ok).map(x=>`${x.method}: ${x.bytes} octets · ${x.signature}`).join(' · ')||'aucune décompression standard';return `<article class="card"><h2>${e(f.name)}</h2><div class="chips"><span class="chip ok">${e(f.signature)}</span><span class="chip">${e(f.bytes)} octets</span><span class="chip">encodage: ${e(dec)}</span><span class="chip ${ah==='aucun'?'warn':'ok'}">ancres: ${e(ah)}</span></div><p class="muted">Décompression: ${e(decomp)}</p><details><summary>Premiers octets</summary><pre>${e(f.headHex)}</pre></details><details><summary>Chaînes lisibles</summary><pre>${e(strings||'aucune')}</pre></details>${(f.decodings||[])[0]?`<details><summary>Aperçu texte (${e(f.decodings[0].encoding)})</summary><pre>${e(f.decodings[0].preview)}</pre></details>`:''}</article>`}function methodCard(m){return `<div class="method"><strong>${e(m.symbol)}</strong><div class="muted">rid ${e(m.rid)}</div>${(m.strings||[]).length?`<pre>STRINGS\n${e(m.strings.join('\n'))}</pre>`:''}<pre>CALLS\n${e([...(m.internalCalls||[]),...(m.externalCalls||[])].join('\n')||'aucun' )}</pre></div>`}(async()=>{try{const r=await fetch('/lab/formation-lua-trace-viewer-data/runtime-diagnostic.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json(),s=d.summary||{};$('summary').innerHTML=[stat('Fichiers bruts',s.rawFiles||0),stat('Extraits',s.materializedExtracted||0),stat('Erreurs',s.materializeErrors||0),stat('Méthodes loader',s.loaderMethods||0)].join('');$('files').innerHTML=(d.files||[]).map(fileCard).join('')||'<div class="card muted">Aucun fichier runtime.</div>';$('loader').innerHTML=(d.loaderMethods||[]).map(methodCard).join('')||'<div class="muted">Aucune méthode chargée.</div>';$('status').textContent='diagnostic prêt'}catch(err){$('status').textContent='Diagnostic absent : relance le runner ('+err.message+')'}})();</script></body></html>
