<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>WfGg LAB — Deep Trace Probe</title><style>:root{color-scheme:dark;--bg:#09090d;--p:#15141a;--l:#34303e;--t:#f4f0f7;--m:#aaa1b3;--a:#9b7cff;--ok:#75d69c;--no:#ef8d8d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:980px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px}.top h1{margin:4px 0;font-size:28px}.muted{color:var(--m)}a{color:#c9bbff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0}.card{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:14px}.cap strong{display:block;font-size:21px}.yes{border-color:var(--ok)}.no{border-color:var(--no)}.pill{display:inline-block;border:1px solid var(--l);border-radius:999px;padding:6px 9px;margin:4px 4px 0 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d0c12;border:1px solid var(--l);border-radius:10px;padding:10px;font-size:11px;max-height:280px;overflow:auto}details{margin:9px 0}.prio{font-size:18px;line-height:1.4}@media(min-width:760px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}</style></head><body><main><div class="top"><div><div class="muted">WFGG · LAST WAR · LAB · DEEP TRACE</div><h1>Capacités runtime réelles</h1><div id="status" class="muted">Chargement…</div></div><a href="/lab/lastwar-formation-live-trace-consensus.html?v=1">← Consensus</a></div><div id="caps" class="grid"></div><section class="card"><h2>Priorité recommandée</h2><div id="prio" class="prio"></div></section><section><h2>Détails des probes</h2><div id="details"></div></section></main><script>const $=x=>document.getElementById(x),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));(async()=>{try{const r=await fetch('/lab/formation-live-trace-data/deep-probe.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json(),c=d.capabilities||{};$('status').textContent=`device ${d.device} · pid ${d.pid}`;$('caps').innerHTML=Object.entries(c).map(([k,v])=>`<div class="card cap ${v?'yes':'no'}"><span class="muted">${e(k)}</span><strong>${v?'OUI':'NON'}</strong></div>`).join('');$('prio').innerHTML=(d.priority||[]).map((x,i)=>`<div><span class="pill">${i+1}</span> ${e(x)}</div>`).join('');$('details').innerHTML=Object.entries(d.checks||{}).map(([k,v])=>`<details class="card"><summary>${e(k)}</summary><pre>${e(v.stdout||'')}${v.stderr?`\nSTDERR\n${e(v.stderr)}`:''}</pre></details>`).join('')}catch(err){$('status').textContent='Probe absent : '+err.message}})();</script></body></html>
