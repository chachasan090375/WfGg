<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WFGG · OmniTrace différentiel</title><style>
:root{color-scheme:dark;--bg:#09080d;--card:#15131c;--line:#302b3c;--muted:#aaa5b5;--fg:#f5f2fb;--accent:#a67cff;--good:#6fd69a;--warn:#efbd68;--bad:#ef7f8b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:980px;margin:auto;padding:20px}.eyebrow{color:#aaa2ba;font-size:13px;letter-spacing:.08em;text-transform:uppercase}.top{display:flex;justify-content:space-between;gap:14px}.top a{color:#cbb7ff}h1{font-size:clamp(32px,7vw,54px);line-height:1.02;margin:7px 0}.sub{color:var(--muted);font-size:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}.metric,.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}.metric b{display:block;font-size:31px;margin-top:3px}.metric span{color:var(--muted)}.verdict{font-size:20px;font-weight:850;overflow-wrap:anywhere}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:6px;margin:14px 0}.tabs button{background:#17141f;color:var(--fg);border:1px solid var(--line);border-radius:15px;padding:11px 14px;font-size:15px;white-space:nowrap}.tabs button.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}.item{background:#111018;border:1px solid var(--line);border-radius:16px;padding:13px;margin:9px 0;overflow-wrap:anywhere}.item.hi{border-color:var(--good)}.item.mid{border-color:var(--warn)}.item strong{font-size:17px}.meta{color:var(--muted);font-size:12px;margin-top:5px}.src{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 7px;margin:4px 4px 0 0;font-size:11px}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;color:#ddd7e8}.empty{color:var(--muted);padding:14px}.method{display:grid;grid-template-columns:1fr repeat(2,auto);gap:8px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}.method small{color:var(--muted)}@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main class="wrap"><div class="top"><div><div class="eyebrow">WFGG · LAST WAR · LAB · OMNITRACE DIFF STRICT</div><h1>Formation — différentiel</h1><div class="sub" id="sub">chargement…</div></div><a href="./lastwar-formation-omnitrace.html">OmniTrace</a></div>
<section class="panel" style="margin-top:14px"><div class="eyebrow">Verdict différentiel</div><div class="verdict" id="verdict">–</div><div id="headline" style="margin-top:10px"></div></section>
<div class="grid"><div class="metric"><span>Méthodes</span><b id="methods">–</b></div><div class="metric"><span>Delta strict</span><b id="delta">–</b></div><div class="metric"><span>Ciblées</span><b id="target">–</b></div><div class="metric"><span>Fortes</span><b id="strong">–</b></div></div>
<div class="tabs"><button data-tab="strong" class="on">Fortes</button><button data-tab="crossTokens">Recoupements</button><button data-tab="medium">Moyennes</button><button data-tab="targetLines">Ciblées</button><button data-tab="lowLevelLines">Basse couche</button><button data-tab="topDelta">Delta</button><button data-tab="methodsTab">Méthodes</button></div><section class="panel"><div id="content"></div></section></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let D=null,tab='strong';
function tokenItem(r){return `<div class="item ${r.confidence==='FORTE'?'hi':r.confidence==='MOYENNE'?'mid':''}"><strong>${esc(r.token)}</strong><div class="meta">${esc(r.confidence)} · score ${r.score} · delta ${r.count} · sources ${r.sourceCount}</div>${(r.sources||[]).map(s=>`<span class="src">${esc(s)}</span>`).join('')}${(r.examples||[]).slice(0,2).map(e=>`<pre>${esc(e.text)}</pre>`).join('')}</div>`}
function lineItem(r){return `<div class="item ${r.source==='strace'&&r.syscall?'hi':''}"><strong>${esc(r.source)} · +${r.delta}</strong><div class="meta">action ${r.actionCount} · témoin ${r.baselineCount} · score ${r.score}${r.sourceCount>1?` · ${r.sourceCount} sources`:''}</div><pre>${esc(r.raw||r.text)}</pre></div>`}
function render(){if(!D)return;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));let h='';if(tab==='methodsTab'){h=Object.entries(D.methodStats||{}).map(([k,v])=>`<div class="method"><b>${esc(k)}</b><small>A ${v.actionLines}</small><small>T ${v.baselineLines}</small></div>`).join('')}else if(['strong','crossTokens','medium'].includes(tab)){h=(D[tab]||[]).map(tokenItem).join('')}else{h=(D[tab]||[]).map(lineItem).join('')}document.getElementById('content').innerHTML=h||'<div class="empty">Aucun élément exploitable dans cette catégorie.</div>'}
fetch('./master-assets-v2/formation-omnitrace/differential-latest.json?ts='+Date.now()).then(r=>r.json()).then(d=>{D=d;document.getElementById('sub').textContent=`ACTION ${d.actionSession} vs TÉMOIN ${d.baselineSession}`;document.getElementById('methods').textContent=d.methodComparedCount;document.getElementById('delta').textContent=d.deltaLineCount;document.getElementById('target').textContent=d.targetLineCount??d.anchorLineCount;document.getElementById('strong').textContent=d.strongCount;document.getElementById('verdict').textContent=d.verdict;let top=(d.strong&&d.strong[0])||(d.crossTokens&&d.crossTokens[0])||(d.medium&&d.medium[0]);document.getElementById('headline').innerHTML=top?`<div class="eyebrow">Meilleur signal strict</div>${tokenItem(top)}`:`<div class="meta">Aucune preuve forte. Recoupements ${d.crossTokenCount||0} · moyennes ${d.mediumCount||0} · basse couche ${d.lowLevelLineCount||0}</div>`;render()}).catch(e=>{document.getElementById('sub').textContent='analyse introuvable';document.getElementById('content').innerHTML='<pre>'+esc(e)+'</pre>'});document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
</script></body></html>
