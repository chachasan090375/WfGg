<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WFGG · Formation Vehicle Texture Viewer</title><style>:root{color-scheme:dark;--bg:#09080d;--card:#15131c;--line:#302b3c;--muted:#aaa5b5;--fg:#f5f2fb;--accent:#a67cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:14px}.top a{color:#cbb7ff}.eyebrow{color:#aaa2ba;font-size:13px;letter-spacing:.08em;text-transform:uppercase}h1{font-size:clamp(32px,7vw,54px);line-height:1.02;margin:8px 0}.sub{color:var(--muted);font-size:18px}.controls{display:grid;grid-template-columns:1fr;gap:10px;margin:16px 0}.controls input,.controls select{background:#17141f;color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}.metric{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}.metric b{display:block;font-size:28px}.metric span{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}.thumb{aspect-ratio:1/1;background:#050507;display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:contain;image-rendering:auto}.meta{padding:10px}.name{font-weight:800;overflow-wrap:anywhere}.small{font-size:12px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 7px;margin:5px 4px 0 0;font-size:11px}.empty{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;color:var(--muted)}@media(min-width:700px){.controls{grid-template-columns:2fr 1fr 1fr}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.metrics{grid-template-columns:repeat(4,1fr)}} </style></head><body><main class="wrap"><div class="top"><div><div class="eyebrow">WFGG · LAST WAR · LAB · VEHICLE TEXTURES</div><h1>Formation — images véhicules</h1><div class="sub">Textures, sprites et atlases extraits des bundles déjà analysés</div></div><a href="./index.html">← LAB</a></div><div class="controls"><input id="q" placeholder="Filtrer : murphy, audie, tank, vehicle, formation…"><select id="kind"><option value="">Tous types</option><option>Texture2D</option><option>Sprite</option><option>SpriteAtlas</option></select><select id="shape"><option value="">Toutes tailles</option><option value="square">Carrées</option><option value="wide">Paysage</option><option value="tall">Portrait</option></select></div><div class="metrics"><div class="metric"><span>Images</span><b id="count">0</b></div><div class="metric"><span>Bundles</span><b id="bundles">0</b></div><div class="metric"><span>Candidates nommées</span><b id="named">0</b></div><div class="metric"><span>Atlases</span><b id="atlases">0</b></div></div><section id="grid" class="grid"></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let D=[];const q=document.getElementById('q'),kind=document.getElementById('kind'),shape=document.getElementById('shape'),grid=document.getElementById('grid');function isNamed(x){return /(formation|hero|vehicle|tank|air|aircraft|missile|car|chariot|audie|murphy|slot|unit)/i.test((x.name||'')+' '+(x.path||'')+' '+(x.bundleName||''))}function shp(x){let w=+x.width||0,h=+x.height||0;if(!w||!h)return'';let r=w/h;return r>1.2?'wide':r<.83?'tall':'square'}function render(){let s=q.value.trim().toLowerCase();let a=D.filter(x=>(!s||JSON.stringify(x).toLowerCase().includes(s))&&(!kind.value||x.type===kind.value)&&(!shape.value||shp(x)===shape.value));document.getElementById('count').textContent=a.length;document.getElementById('bundles').textContent=new Set(a.map(x=>x.bundleId||x.bundleName).filter(Boolean)).size;document.getElementById('named').textContent=a.filter(isNamed).length;document.getElementById('atlases').textContent=a.filter(x=>/atlas/i.test(x.type||'')||/atlas/i.test(x.name||'')).length;grid.innerHTML=a.map(x=>`<article class="card"><div class="thumb"><img loading="lazy" src="${esc(x.url)}" alt="${esc(x.name)}"></div><div class="meta"><div class="name">${esc(x.name||'(sans nom)')}</div><div class="small">${esc(x.type||'Texture')} · ${esc(x.width||'?')}×${esc(x.height||'?')} · bundle ${esc(x.bundleId||x.bundleName||'?')}</div><div class="small">${esc(x.source||x.path||'')}</div>${isNamed(x)?'<span class="tag">candidate</span>':''}${x.bundleRole?`<span class="tag">${esc(x.bundleRole)}</span>`:''}</div></article>`).join('')||'<div class="empty">Aucune image pour ce filtre.</div>'}fetch('./master-assets-v2/formation-vehicle-texture-viewer-data/manifest.json?ts='+Date.now()).then(r=>r.json()).then(d=>{D=d.items||d||[];render()}).catch(e=>{grid.innerHTML='<div class="empty">Manifest absent. Lance le builder Termux du viewer.<br><br>'+esc(e)+'</div>'});[q,kind,shape].forEach(el=>el.addEventListener('input',render));</script></body></html>
