<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>WfGg LAB — Live Trace Summary</title><style>:root{color-scheme:dark;--bg:#09090d;--p:#15141a;--p2:#1d1a24;--l:#34303e;--t:#f4f0f7;--m:#aaa1b3;--a:#9b7cff;--ok:#75d69c;--w:#f0c575}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:1050px;margin:auto;padding:16px 16px 70px}.top{display:flex;justify-content:space-between;gap:14px}.top h1{font-size:25px;margin:4px 0}.muted{color:var(--m)}a{color:#cabdff}.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:15px 0}.stat,.card{background:var(--p);border:1px solid var(--l);border-radius:13px;padding:12px}.stat span{display:block;color:var(--m);font-size:12px}.stat strong{font-size:21px}.card{margin:10px 0}.card h2,.card h3{margin:0 0 9px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--l);background:var(--p2);padding:5px 8px;border-radius:999px;font-size:12px}.ok{border-color:var(--ok)}.warn{border-color:var(--w)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d0c12;border:1px solid var(--l);border-radius:9px;padding:9px;font-size:11px}.ev{border-left:4px solid var(--ok)}.ctx{border-left:4px solid var(--w)}.line{padding:8px 0;border-top:1px solid var(--l)}.line:first-child{border-top:0}.search{width:100%;font:inherit;color:var(--t);background:var(--p2);border:1px solid var(--l);border-radius:10px;padding:11px;margin:8px 0}@media(min-width:780px){.sum{grid-template-columns:repeat(4,minmax(0,1fr))}}</style></head><body><main><div class="top"><div><div class="muted">WFGG · LAST WAR · LAB · DELTA</div><h1>Résumé de la capture Formation</h1><div id="status" class="muted">Chargement…</div></div><div><a href="/lab/lastwar-formation-live-trace.html?v=2">← Live Trace</a></div></div><div id="summary" class="sum"></div><div id="verdict" class="card"></div><section><h2>Identifiants observés</h2><div id="ids" class="card"></div></section><section><h2>Appels runtime observés</h2><div id="calls" class="card"></div></section><section><h2>Numéros de bundle candidats</h2><div id="bundles" class="card"></div></section><section><h2>Chronologie des preuves directes</h2><input id="q" class="search" placeholder="Filtrer : Murphy, LoadAsset, Formation, bundle…"><div id="timeline"></div></section></main><script>const $=x=>document.getElementById(x),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),stat=(a,b)=>`<div class="stat"><span>${e(a)}</span><strong>${e(b)}</strong></div>`;let D=null;function chips(rows){return (rows||[]).length?`<div class="chips">${rows.map(x=>`<span class="chip">${e(x.value)} ×${e(x.count)}</span>`).join('')}</div>`:'<div class="muted">Aucun.</div>'}function render(){if(!D)return;const q=$('q').value.toLowerCase();const rows=(D.directTimeline||[]).filter(r=>JSON.stringify(r).toLowerCase().includes(q));$('timeline').innerHTML=rows.length?rows.map(r=>`<article class="card ev"><div class="chips"><span class="chip ok">ligne ${e(r.line)}</span>${(r.hits||[]).map(h=>`<span class="chip">${e(h)}</span>`).join('')}</div><pre>${e(r.text)}</pre>${(r.context||[]).length?`<details><summary>Contexte ±3 lignes</summary><pre>${e(r.context.map(c=>(c.isEvidence?'>> ':'   ')+c.line+' '+c.text).join('\n'))}</pre></details>`:''}</article>`).join(''):'<div class="card muted">Aucune preuve pour ce filtre.</div>'} $('q').addEventListener('input',render);(async()=>{try{const r=await fetch('/lab/formation-live-trace-data/summary.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);D=await r.json();const s=D.sourceSummary||{};$('summary').innerHTML=[stat('Session',D.sessionId||'?'),stat('Logs',s.logLines||0),stat('Pertinents',s.relevantLines||0),stat('Preuves',s.directEvidence||0)].join('');$('verdict').innerHTML=`<h2>${e(D.label||'Capture')}</h2><div class="chips"><span class="chip ok">${e(D.verdict)}</span></div><p>${e(D.note||'')}</p>`;$('ids').innerHTML=chips(D.extracted?.identifiers);$('calls').innerHTML=chips(D.extracted?.calls);$('bundles').innerHTML=chips(D.extracted?.bundleNumbers);$('status').textContent='résumé prêt';render()}catch(err){$('status').textContent='Résumé absent : '+err.message;$('verdict').innerHTML='<p>Lance le script de résumé dans Termux.</p>'}})();</script></body></html>
