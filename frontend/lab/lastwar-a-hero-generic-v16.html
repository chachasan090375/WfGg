<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A_Hero — inventaire générique V16</title>
<style>
:root{color-scheme:dark}body{margin:0;background:#08080d;color:#f5f3fb;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:980px;margin:auto;padding:24px}.muted{color:#aaa4b7}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#15131c;border:1px solid #34303f;border-radius:22px;padding:18px}.big{font-size:2.35rem;font-weight:800}.pill{display:inline-block;border:1px solid #8f66ff;border-radius:999px;padding:6px 10px;margin:4px 4px 0 0}.row{margin:12px 0;padding:16px;border:1px solid #35303f;border-radius:18px;background:#121018}.score{font-weight:800;font-size:1.15rem}.name{font-weight:800;font-size:1.2rem;word-break:break-word}.bundle{font-family:ui-monospace,monospace;font-size:.82rem;word-break:break-all;color:#b8b1c5}.hi{border-color:#63d79c}.warn{border-color:#f2bd67}.murphy{border-color:#67b7ff;box-shadow:0 0 0 1px #67b7ff33 inset}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.filters button,input{background:#181522;color:#fff;border:1px solid #3b3547;border-radius:14px;padding:12px;font-size:1rem}.filters button.on{border-color:#9d6bff}.filters button.hero{border-color:#67b7ff}.filters button.hero.on{background:#142235}.empty{padding:24px;text-align:center;color:#aaa4b7}.why{margin-top:8px;font-size:.86rem;color:#8ed0ff}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:18px}.big{font-size:2rem}}
</style></head><body><div class="wrap"><div class="muted">WFGG · LAST WAR · LAB · GENERIC ASSET NAME</div><h1>A_Hero — inventaire générique V16</h1><p class="muted">Recherche sans filtre Audie. Priorité à <code>A_Hero_01</code>, aux variantes non-Audie et aux noms Formation/PVP/LOD.</p><div id="stats" class="grid"></div><div class="filters"><button data-mode="all" class="on">Tous</button><button data-mode="murphy" class="hero">Murphy</button><button data-mode="exact">A_Hero_01</button><button data-mode="nonAudie">Sans Audie</button><button data-mode="groups">Groupes</button><input id="q" placeholder="Filtrer un nom / bundle"></div><div id="heroSummary"></div><div id="list"></div></div>
<script>
const URL='master-assets-v2/a-hero-generic-v16/manifest.json?v=16';let D,mode='all';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const murphyRx=/murph/i;
function blob(r){return [r.name,r.haystack,r.bundle,r.bundlePath,r.sourceBundle,r.serialized,r.serializedFile,r.sourceSerialized].filter(Boolean).join(' ')}
function murphyRank(r){let n=String(r.name||'');let b=blob(r);let x=0;if(murphyRx.test(n))x+=100;if(/a[_-]?hero[^\n]*murph/i.test(n))x+=80;if(murphyRx.test(String(r.bundle||r.bundlePath||r.sourceBundle||'')))x+=40;if(murphyRx.test(String(r.serialized||r.serializedFile||r.sourceSerialized||'')))x+=30;if(/formation|pvp|uihero|board/i.test(b))x+=20;if(/mesh/i.test(String(r.type||r.className||''))||/mesh/i.test(n))x+=10;return x}
function stats(){let s=D.summary;let mh=D.hits.filter(r=>murphyRx.test(blob(r)));let direct=mh.filter(r=>murphyRx.test(String(r.name||'')));document.querySelector('#stats').innerHTML=`<div class=card><div class=muted>Entrées A_Hero</div><div class=big>${s.aHeroHits}</div></div><div class=card><div class=muted>Groupes</div><div class=big>${s.groups}</div></div><div class=card><div class=muted>Murphy contexte</div><div class=big>${mh.length}</div></div><div class=card><div class=muted>Murphy dans le nom</div><div class=big>${direct.length}</div></div>`}
function isExact(n){return /^a[_-]?hero[_-]?0?1(?:$|[_-])/i.test(n||'')}
function render(){let q=document.querySelector('#q').value.toLowerCase(),el=document.querySelector('#list'),sum=document.querySelector('#heroSummary');sum.innerHTML='';if(mode==='groups'){let a=D.groups.filter(g=>(g.root+' '+g.names.join(' ')+' '+g.bundles.join(' ')).toLowerCase().includes(q));el.innerHTML=a.map(g=>`<div class="row ${isExact(g.root)?'hi':''} ${murphyRx.test(g.root+' '+g.names.join(' ')+' '+g.bundles.join(' '))?'murphy':''}"><div class=name>${esc(g.root)}</div><div class=muted>${g.count} variante(s) · score max ${g.maxScore}</div><div>${g.names.map(n=>`<span class=pill>${esc(n)}</span>`).join('')}</div><div class=bundle>${esc(g.bundles.join('\n'))}</div></div>`).join('')||'<div class=empty>Aucun groupe.</div>';return}
let a=D.hits.filter(r=>{let h=blob(r).toLowerCase();if(q&&!h.includes(q))return false;if(mode==='exact'&&!isExact(r.name))return false;if(mode==='nonAudie'&&h.includes('audie'))return false;if(mode==='murphy'&&!murphyRx.test(h))return false;return true});if(mode==='murphy'){a.sort((x,y)=>murphyRank(y)-murphyRank(x)||(y.score||0)-(x.score||0));let direct=a.filter(r=>murphyRx.test(String(r.name||''))).length;sum.innerHTML=`<div class="row murphy"><div class=name>Recherche Murphy ciblée</div><div class=muted>${a.length} occurrence(s) dans le contexte · ${direct} directement dans un nom d’asset.</div><div class=why>Ordre : nom Murphy → A_Hero + Murphy → bundle/fichier Murphy → contexte Formation/PVP → Mesh.</div></div>`}
el.innerHTML=a.slice(0,1000).map(r=>`<div class="row ${murphyRx.test(blob(r))?'murphy':(isExact(r.name)?'hi':(r.score>=50?'warn':''))}"><div class=score>score ${r.score}${mode==='murphy'?` · Murphy ${murphyRank(r)}`:''}</div><div class=name>${esc(r.name)}</div><div class=muted>${esc(r.type||r.className||'type inconnu')} · pathID ${esc(r.pathID||r.sourcePathID||'—')}</div><div class=bundle>${esc(r.bundle||r.bundlePath||r.sourceBundle||'')}</div><div class=bundle>${esc(r.serialized||r.serializedFile||r.sourceSerialized||'')}</div></div>`).join('')||'<div class=empty>Aucun résultat pour ce filtre.</div>'}
fetch(URL).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{D=d;stats();render()}).catch(e=>document.querySelector('#list').innerHTML=`<div class="row warn">Manifest V16 introuvable. Lance d’abord <code>bash scripts/lastwar-a-hero-generic-v16.sh</code><br>${esc(e)}</div>`);
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.mode;render()});document.querySelector('#q').oninput=render;
</script></body></html>
