<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#09080d"><title>WfGg LAB — Audie Board Usage V12</title><style>
:root{color-scheme:dark;--bg:#09080d;--card:#15131c;--line:#332d40;--muted:#aaa4b7;--fg:#f7f4fb;--accent:#a875ff;--ok:#70d79e;--warn:#f0c56c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.shell{max-width:980px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:14px}.top a{color:#cbb7ff}.eyebrow{color:#aaa2ba;font-size:13px;letter-spacing:.08em;text-transform:uppercase}h1{font-size:clamp(34px,8vw,58px);line-height:1.02;margin:8px 0}.sub,.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:18px}.stat{padding:14px}.stat span{display:block;color:var(--muted)}.stat strong{font-size:28px}.card{padding:16px;margin:14px 0}.winner{border-color:var(--accent)}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 9px;margin:4px 4px 4px 0;font-size:12px}.badge.ok{border-color:var(--ok)}.badge.warn{border-color:var(--warn)}.evidence{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.ev{background:#0e0d13;border:1px solid var(--line);border-radius:13px;padding:10px;margin:8px 0}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;overflow-wrap:anywhere}.small{font-size:12px;color:var(--muted);overflow-wrap:anywhere}@media(min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main class="shell"><header class="top"><div><div class="eyebrow">WFGG · LAST WAR · LAB · BOARD USAGE</div><h1>Audie — usage plateau V12</h1><div class="sub">Départage les deux variantes principales par leurs vrais pointeurs Unity et leur contexte d’utilisation, pas par leur nombre de polygones.</div></div><a href="/lab/">← LAB</a></header><section class="stats"><div class="stat"><span>Variantes</span><strong id="variants">—</strong></div><div class="stat"><span>Bundles scannés</span><strong id="bundles">—</strong></div><div class="stat"><span>PPtr inspectés</span><strong id="pptrs">—</strong></div><div class="stat"><span>Preuves</span><strong id="evidence">—</strong></div></section><section class="card"><div class="muted">Verdict</div><h2 id="verdict">Chargement…</h2><div class="small" id="scope"></div></section><section id="rows"></section></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const r=await fetch('/lab/audie-board-usage-v12-data/manifest.json?t='+Date.now(),{cache:'no-store'});if(!r.ok){document.getElementById('verdict').textContent='Manifest V12 absent : lance le script V12';return}const M=await r.json();const C=M.counts||{};variants.textContent=C.variants??0;bundles.textContent=C.bundlesScanned??0;pptrs.textContent=C.pptrsInspected??0;evidence.textContent=C.evidence??0;verdict.textContent=M.verdict||'—';scope.textContent=M.scope||'';const rows=document.getElementById('rows');rows.innerHTML=(M.variants||[]).map((v,i)=>`<section class="card ${i===0&&v.score>0?'winner':''}"><div class="muted">Candidat ${i+1}</div><h2>${esc(v.name)}</h2><div><span class="badge ${v.confidence==='DIRECT_RENDERER_MESH_PTR'?'ok':'warn'}">${esc(v.confidence)}</span><span class="badge">score ${esc(v.score)}</span><span class="badge">${esc(v.vertexCount)} vertices</span><span class="badge">${esc(v.faceCount)} faces</span></div><div class="small">${esc(v.bundle)} · pathID ${esc(v.pathID)} · ${esc(v.serializedFile)}</div><div class="evidence"><b>Preuves exactes (${(v.evidence||[]).length})</b>${(v.evidence||[]).slice(0,20).map(e=>`<div class="ev"><b>${esc(e.objectType)} · ${esc(e.objectName||'—')}</b><div>${esc(e.gameObject||'')}</div><div class="mono">${esc(e.field)} → ${esc(e.targetSerialized)} / pathID ${esc(e.meshPathID)}</div><div class="small">${esc(e.bundle)} · score ${esc(e.score)} · ${(e.keywordHits||[]).map(x=>esc(x)).join(', ')||'aucun mot-clé de contexte'}</div></div>`).join('')||'<div class="muted">Aucune preuve dans le fast pass famille Audie.</div>'}</div></section>`).join('')||'<section class="card">Aucune variante.</section>'}
load();
</script></body></html>
