<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WfGg LAB — Deep Capability V2</title><style>:root{color-scheme:dark;--bg:#09090d;--p:#15141a;--l:#35303f;--t:#f5f1f7;--m:#aaa2b4;--a:#9b7cff;--ok:#78d6a0;--no:#ef8d96}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:1000px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px}h1{font-size:34px;line-height:1.05;margin:8px 0}.muted{color:var(--m)}a{color:#cabdff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0}.card{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:14px}.cap{border-width:1.5px}.cap.ok{border-color:var(--ok)}.cap.no{border-color:var(--no)}.cap span{display:block;color:var(--m);font-size:13px}.cap strong{font-size:26px}.priority{font-size:22px;overflow-wrap:anywhere}.probe{margin:10px 0}.probe h3{margin:0 0 6px;font-size:16px;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0c0b10;border:1px solid var(--l);border-radius:10px;padding:10px;max-height:260px;overflow:auto;font-size:11px}@media(min-width:760px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}</style></head><body><main><div class="top"><div><div class="muted">WFGG · LAST WAR · LAB · DEEP CAPABILITY</div><h1>Accès runtime réel</h1><div id="status" class="muted">Chargement…</div></div><a href="/lab/lastwar-formation-deep-live-trace.html?v=2">← Deep Trace</a></div><section class="card"><div class="muted">Priorité recommandée</div><div id="priority" class="priority">—</div></section><div id="caps" class="grid"></div><h2>Détails des tests</h2><div id="probes"></div></main><script>const $=x=>document.getElementById(x),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));(async()=>{try{const r=await fetch('/lab/formation-deep-live-trace-data/capability-v2.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();$('status').textContent=`device ${d.device} · pid ${d.pid}`;$('priority').textContent=d.priority||'—';$('caps').innerHTML=Object.entries(d.capabilities||{}).map(([k,v])=>`<div class="card cap ${v?'ok':'no'}"><span>${e(k)}</span><strong>${v?'OUI':'NON'}</strong></div>`).join('');$('probes').innerHTML=(d.probes||[]).map(p=>`<article class="card probe"><h3>${e(p.name)} · rc=${e(p.rc)} · ${p.ok?'OK':'NON'}</h3><pre>${e(p.output||'aucune sortie')}</pre></article>`).join('')}catch(err){$('status').textContent='Erreur : '+err.message}})();</script></body></html>
