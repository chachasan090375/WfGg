<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WFGG · Formation strace live</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#08070d;color:#f5f2fa;font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:980px;margin:auto;padding:26px}.top{display:flex;justify-content:space-between;gap:18px}.eyebrow{color:#aaa3b6;font-size:14px;letter-spacing:.04em}.links a{color:#cab3ff}h1{font-size:42px;line-height:1.08;margin:10px 0 6px}.sub{color:#aaa3b6;font-size:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:26px 0}.card,.panel{background:#14121b;border:1px solid #34303f;border-radius:20px;padding:20px}.k{color:#aaa3b6;font-size:17px}.v{font-size:34px;font-weight:750;margin-top:4px}.badge{display:inline-block;border:1px solid #6cd89c;border-radius:999px;padding:8px 14px;margin:7px 0 12px}.tabs{display:flex;gap:10px;overflow:auto;margin:22px 0}.tabs button{background:#17141f;color:#eee;border:1px solid #34303f;border-radius:14px;padding:13px 18px;font-size:16px;white-space:nowrap}.tabs button.on{border-color:#a47cff;box-shadow:0 0 0 1px #a47cff inset}.row{border-top:1px solid #34303f;padding:14px 0}.row:first-child{border-top:0}.path{font-weight:700;overflow-wrap:anywhere}.meta{color:#aaa3b6;font-size:14px;margin-top:5px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}.empty{color:#aaa3b6;padding:20px}.err{border-color:#8b4d5a}@media(max-width:620px){main{padding:20px 18px}.grid{grid-template-columns:1fr 1fr;gap:10px}.card{padding:15px}.v{font-size:28px}h1{font-size:34px}.sub{font-size:18px}}</style></head><body><main><div class="top"><div><div class="eyebrow">WFGG · LAST WAR · LAB · STRACE RUNTIME</div><h1>Formation — appels système réels</h1><div class="sub" id="status">Chargement…</div></div><div class="links"><a href="/lab/lastwar-formation-live-trace.html">← Live Trace</a></div></div><div class="grid" id="stats"></div><div class="panel"><div class="badge" id="verdict">…</div><div id="method" class="sub"></div><div class="meta" id="filter"></div></div><div class="tabs"><button data-tab="strong" class="on">Candidats forts</button><button data-tab="paths">Fichiers ouverts</button><button data-tab="anchors">Ancres</button><button data-tab="net">Réseau</button><button data-tab="sys">Syscalls</button><button data-tab="raw">Trace</button></div><div class="panel" id="content"></div></main><script>const DATA='/lab/formation-strace-live-data/latest.json';let d=null,tab='strong';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function stat(k,v){return `<div class="card"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`}function row(title,meta,text=''){return `<div class="row"><div class="path">${esc(title)}</div>${meta?`<div class="meta">${esc(meta)}</div>`:''}${text?`<div class="mono">${esc(text)}</div>`:''}</div>`}function render(){if(!d)return;const s=d.summary||{};document.querySelector('#status').textContent=`capture ${d.sessionId||''} · ${d.label||''}`;document.querySelector('#stats').innerHTML=stat('Lignes strace',s.rawLines||0)+stat('Syscalls',s.syscalls||0)+stat('Chemins open',s.openPaths||0)+stat('Candidats forts',s.strongPaths||0)+stat('Ancres',s.anchorLines||0)+stat('Appels réseau',s.networkCalls||0);document.querySelector('#verdict').textContent=d.verdict||'—';document.querySelector('#method').textContent=d.method||'';document.querySelector('#filter').textContent='Filtre choisi : '+(d.filter||'—');document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));let html='';if(tab==='strong'){const a=d.strongPaths||[];html=a.length?a.map(x=>row(x.path,`score ${x.score} · ${x.count} ouverture(s) · ${x.hits?.join(', ')||''}`)).join(''):'<div class="empty">Aucun candidat fort.</div>'}else if(tab==='paths'){const a=d.openPaths||[];html=a.length?a.map(x=>row(x.path,`score ${x.score} · ${x.count} ouverture(s) · ${x.hits?.join(', ')||''}`)).join(''):'<div class="empty">Aucun chemin open/openat observé.</div>'}else if(tab==='anchors'){const a=d.anchorLines||[];html=a.length?a.map(x=>row('ligne '+x.line,'',x.text)).join(''):'<div class="empty">Aucune ancre Formation/hero/bundle/Lua observée.</div>'}else if(tab==='net'){const a=d.networkTimeline||[];html=a.length?a.slice(0,700).map(x=>row(`${x.syscall} · ligne ${x.line}`,x.result!=null?`résultat ${x.result}`:'',x.text)).join(''):'<div class="empty">Aucun appel réseau observé avec le filtre sélectionné.</div>'}else if(tab==='sys'){const a=Object.entries(d.syscalls||{}).sort((a,b)=>b[1]-a[1]);html=a.length?a.map(([k,v])=>row(k,`${v} appel(s)`)).join(''):'<div class="empty">Aucun syscall parsé.</div>'}else{const a=[...(d.traceHead||[]),...(d.traceTail||[])];html=a.length?`<div class="mono">${esc(a.join('\n'))}</div>`:'<div class="empty">Trace vide.</div>';if((d.errors||[]).length)html+=`<div class="panel err"><b>Erreurs</b><div class="mono">${esc(d.errors.join('\n'))}</div></div>`}document.querySelector('#content').innerHTML=html}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});fetch(DATA+'?t='+Date.now()).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(x=>{d=x;render()}).catch(e=>{document.querySelector('#status').textContent='Erreur de chargement';document.querySelector('#content').innerHTML='<div class="mono">'+esc(e)+'</div>'});</script></body></html>
