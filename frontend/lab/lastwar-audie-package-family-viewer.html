<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#09080d"><title>WfGg LAB — Audie Package Family V5</title><style>:root{color-scheme:dark;--bg:#09080d;--card:#15131c;--line:#332d40;--muted:#aaa4b7;--fg:#f7f4fb;--accent:#a875ff;--ok:#70d79e;--warn:#f0c56c;--blue:#67b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.shell{max-width:1180px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px}.top a{color:#cbb7ff;font-size:18px}.eyebrow{color:#aaa2ba;letter-spacing:.08em;text-transform:uppercase}.title{font-size:clamp(36px,8vw,60px);line-height:1.02;margin:8px 0}.sub{font-size:17px;color:var(--muted);line-height:1.45}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:18px}.stat{padding:14px}.stat span{display:block;color:var(--muted)}.stat strong{font-size:30px}.panel{padding:16px;margin:14px 0}.verdict{border:1px solid var(--accent);border-radius:18px;padding:16px;background:#15121d}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);border-radius:999px;padding:7px 10px}.chip.ok{border-color:var(--ok)}.chip.warn{border-color:var(--warn)}.chip.blue{border-color:var(--blue)}.tabs{display:flex;gap:8px;overflow-x:auto;margin:12px 0}.tabs button{white-space:nowrap;border:1px solid var(--line);background:#1b1823;color:var(--fg);border-radius:12px;padding:10px 13px;font:inherit}.tabs button.active{border-color:var(--accent)}input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0d0c12;color:var(--fg);font:inherit}.list{display:grid;gap:9px}.row{background:#0d0c12;border:1px solid var(--line);border-radius:14px;padding:11px;overflow-wrap:anywhere}.row strong{display:block}.meta{color:var(--muted);font-size:12px;margin-top:4px}.mini{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;color:#c9c4d1;white-space:pre-wrap}.good{border-left:3px solid var(--ok)}.empty{padding:18px;color:var(--muted);border:1px dashed var(--line);border-radius:14px}@media(min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}</style></head><body><main class="shell"><header class="top"><div><div class="eyebrow">WFGG · LAST WAR · LAB · PACKAGE FAMILY</div><h1 class="title">Audie — nomenclature V5</h1><div class="sub">Retrouve les branches sœurs material / texture / animation / prefab / mesh et vérifie lesquelles contiennent réellement la géométrie Unity.</div></div><a href="/lab/">← LAB</a></header><section class="stats"><div class="stat"><span>Hits index</span><strong id="idx">—</strong></div><div class="stat"><span>Bundles candidats</span><strong id="cand">—</strong></div><div class="stat"><span>Scannés</span><strong id="scan">—</strong></div><div class="stat"><span>Mesh carriers</span><strong id="mesh">—</strong></div></section><section class="verdict"><div class="eyebrow">Verdict</div><strong id="verdict">—</strong><div class="chips" id="cats" style="margin-top:12px"></div></section><section class="panel"><input id="q" placeholder="Filtrer : material, texture, animation, prefab, mesh, bundle…"><div class="tabs"><button data-tab="mesh" class="active">Mesh carriers</button><button data-tab="bundles">Bundles</button><button data-tab="names">Noms package</button><button data-tab="index">Index</button></div><div id="content" class="list"></div></section><section class="panel"><h2>Règles</h2><div id="rules" class="mini"></div></section></main><script>const $=x=>document.getElementById(x);let M=null,tab='mesh';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const blob=x=>JSON.stringify(x??'').toLowerCase();const filt=a=>{const q=$('q').value.trim().toLowerCase();return q?a.filter(x=>blob(x).includes(q)):a};function render(){if(!M)return;let a=[];if(tab==='mesh')a=filt(M.meshCarriers||[]).map(x=>`<div class="row good"><strong>${esc(x.basename)}</strong><div class="meta">cat ${esc(x.category)} · Mesh ${x.meshCount} · MeshRenderer ${x.meshRendererCount} · Skinned ${x.skinnedMeshRendererCount} · MeshFilter ${x.meshFilterCount}</div><div class="mini">${esc(x.path)}\nGameObject ${x.gameObjectCount} · Material ${x.materialCount} · Texture ${x.textureCount}\nMeshes: ${esc((x.samples?.Mesh||[]).join(', ')||'—')}</div></div>`);if(tab==='bundles')a=filt(M.bundles||[]).map(x=>`<div class="row ${x.meshCount||x.meshRendererCount||x.skinnedMeshRendererCount?'good':''}"><strong>${esc(x.basename)}</strong><div class="meta">${esc(x.category)} · objets ${x.objectCount} · mesh ${x.meshCount} · material ${x.materialCount} · texture ${x.textureCount} · anim ${x.animationClipCount}</div><div class="mini">${esc(x.path)}</div></div>`);if(tab==='names')a=filt(M.packageNames||[]).map(x=>`<div class="row"><div class="mini">${esc(x)}</div></div>`);if(tab==='index')a=filt(M.indexHits||[]).map(x=>`<div class="row"><strong>${esc(x.category)} · bundle ${esc(x.bundleId??'?')}</strong><div class="mini">${esc((x.audieStrings||[]).join('\n'))}</div></div>`);$('content').innerHTML=a.join('')||'<div class="empty">Aucun élément pour ce filtre.</div>'}async function load(){try{const r=await fetch('/lab/master-assets-v2/meta/audie-package-family-v5.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error();M=await r.json()}catch(e){$('content').innerHTML='<div class="empty">Lance : bash scripts/lastwar-audie-package-family-v5.sh</div>';return}$('idx').textContent=M.indexHitCount??0;$('cand').textContent=M.physicalCandidateCount??0;$('scan').textContent=M.scannedCandidateCount??0;$('mesh').textContent=M.meshCarrierCount??0;$('verdict').textContent=M.verdict||'—';const cats=M.indexCategories||{};$('cats').innerHTML=Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span class="chip ${k==='mesh'||k==='prefab'?'ok':'blue'}">${esc(k)} · ${v}</span>`).join('');$('rules').textContent=(M.rules||[]).map((x,i)=>`${i+1}. ${x}`).join('\n');render()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});$('q').oninput=render;load();</script></body></html>
