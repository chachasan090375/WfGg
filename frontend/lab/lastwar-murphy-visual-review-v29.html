<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Last War — Murphy/Audie validation visuelle V29</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#141923;--panel2:#1a2130;--line:#30394b;--fg:#f5f7fb;--muted:#aeb7c6;--violet:#a78bfa;--yes:#69d69d;--no:#ff7d84;--maybe:#f3c96b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:1200px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.top h1{margin:0;font-size:clamp(24px,6vw,42px)}.top p{margin:6px 0;color:var(--muted)}a{color:#c9b8ff}.stats{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.pill{border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:6px 9px;color:var(--muted)}.pill b{color:var(--fg)}.layout{display:grid;gap:10px}.sidebar,.stage,.meta{background:var(--panel);border:1px solid var(--line);border-radius:14px}.sidebar{padding:8px;display:flex;gap:7px;overflow:auto}.candidate{min-width:150px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);padding:9px;border-radius:10px;text-align:left}.candidate.active{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet) inset}.candidate .small{font-size:11px;color:var(--muted);margin-top:3px}.candidate.yes{border-left:4px solid var(--yes)}.candidate.no{border-left:4px solid var(--no)}.candidate.maybe{border-left:4px solid var(--maybe)}.stage{min-height:58vh;overflow:hidden;position:relative;background:#050608}.visual{height:58vh;display:flex;align-items:center;justify-content:center;position:relative}.visual img{width:100%;height:100%;object-fit:contain}.visual canvas{display:block;width:100%;height:100%}.empty{color:var(--muted);text-align:center;padding:30px;max-width:700px}.badge{position:absolute;top:10px;left:10px;background:#111722dd;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px}.nav{position:absolute;inset:auto 10px 10px;display:flex;justify-content:space-between;pointer-events:none}.nav button{pointer-events:auto}.btn{border:1px solid var(--line);border-radius:10px;background:#181f2c;color:var(--fg);padding:10px 13px;font-weight:700}.btn:disabled{opacity:.35}.meta{padding:12px}.name{font-size:18px;font-weight:800;overflow-wrap:anywhere}.path{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:#0b0e14;padding:8px;border-radius:8px;margin:8px 0;overflow-wrap:anywhere}.sub{font-size:12px;color:var(--muted)}.review{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.review button{font-size:16px}.review .yes{border-color:var(--yes)}.review .no{border-color:var(--no)}.review .maybe{border-color:var(--maybe)}.review button.active.yes{background:#163426}.review button.active.no{background:#3a191d}.review button.active.maybe{background:#3a3018}.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.tools button,.tools a{font-size:12px}.thumbs{display:flex;gap:6px;overflow:auto;padding:8px;background:#0b0e14}.thumb{border:1px solid var(--line);background:#111722;border-radius:7px;padding:3px;min-width:74px;height:74px}.thumb img{width:66px;height:66px;object-fit:contain}.thumb.active{border-color:var(--violet)}
@media(min-width:900px){.layout{grid-template-columns:240px 1fr}.sidebar{display:block;max-height:78vh;overflow:auto}.candidate{width:100%;min-width:0;margin-bottom:6px}.main{min-width:0}.stage,.visual{min-height:62vh;height:62vh}}
</style>
</head>
<body><main class="wrap">
<div class="top"><div><h1>Murphy / Audie — validation visuelle V29</h1><p>Un candidat à la fois. <b>Oui / Non / Incertain</b> n'est activé que lorsqu'un rendu réel est affiché.</p></div><a href="./index.html">← LAB</a></div>
<div class="stats"><span class="pill"><b id="total">0</b> candidats</span><span class="pill"><b id="done">0</b> validés</span><span class="pill"><b id="yesCount">0</b> oui</span><span class="pill"><b id="noCount">0</b> non</span><span class="pill"><b id="maybeCount">0</b> incertains</span></div>
<div class="layout"><aside id="sidebar" class="sidebar"></aside><section class="main"><div class="stage"><div id="visual" class="visual"><div class="empty">Chargement…</div></div><div id="thumbs" class="thumbs"></div><div class="nav"><button id="prev" class="btn">← Précédent</button><button id="next" class="btn">Suivant →</button></div></div><div class="meta"><div id="name" class="name"></div><div id="kind" class="sub"></div><div id="path" class="path"></div><div id="reason"></div><div class="tools"><a id="bundleLink" class="btn" target="_blank">Ouvrir le bundle complet</a><button id="resetCam" class="btn">Recentrer 3D</button><button id="wire" class="btn">Wireframe</button></div><div class="review"><button class="btn yes" data-review="yes">✓ Oui</button><button class="btn no" data-review="no">✕ Non</button><button class="btn maybe" data-review="maybe">? Incertain</button></div></div></section></div>
</main>
<script type="module">
const RET='manual-review-v27/index/retained.json?v=29b';
const KEY='wfgg-lastwar-murphy-visual-review-v29b';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let items=[],idx=0,review=JSON.parse(localStorage.getItem(KEY)||'{}'),manifest=null,visuals=[],vix=0;
let THREE,OrbitControls,OBJLoader,stage3d=null;
try{THREE=await import('three');({OrbitControls}=await import('three/addons/controls/OrbitControls.js'));({OBJLoader}=await import('three/addons/loaders/OBJLoader.js'));}catch(e){console.warn(e)}
function save(){localStorage.setItem(KEY,JSON.stringify(review));renderStats();renderSide();renderButtons()}
function renderStats(){const vals=Object.values(review);$('#total').textContent=items.length;$('#done').textContent=vals.filter(Boolean).length;$('#yesCount').textContent=vals.filter(x=>x==='yes').length;$('#noCount').textContent=vals.filter(x=>x==='no').length;$('#maybeCount').textContent=vals.filter(x=>x==='maybe').length}
function renderSide(){const sb=$('#sidebar');sb.innerHTML=items.map((x,i)=>`<button class="candidate ${i===idx?'active':''} ${review[x.id]||''}" data-i="${i}"><b>#${x.id}</b> ${esc(x.name)}<div class="small">${esc(x.category)} · b${esc(x.bundleId)}</div></button>`).join('');sb.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{idx=+b.dataset.i;loadCurrent()})}
function renderButtons(){document.querySelectorAll('[data-review]').forEach(b=>{b.classList.toggle('active',review[items[idx]?.id]===b.dataset.review);b.disabled=!visuals.length})}
function $$(s){return [...document.querySelectorAll(s)]}
function clear3d(){if(stage3d){cancelAnimationFrame(stage3d.raf);stage3d.ro?.disconnect();stage3d.renderer?.dispose();stage3d=null}}
async function show3d(src,name){clear3d();const host=$('#visual');host.replaceChildren();if(!THREE||!OBJLoader){host.innerHTML='<div class="empty">OBJ trouvé mais moteur 3D indisponible.</div>';return}const scene=new THREE.Scene();scene.background=new THREE.Color(0x050608);const camera=new THREE.PerspectiveCamera(45,1,.01,100000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));host.append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x202030,2));const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(3,6,5);scene.add(dl);let object;try{object=await new OBJLoader().loadAsync(src)}catch(e){host.innerHTML='<div class="empty">Échec OBJ : '+esc(e.message)+'</div>';return}object.traverse(o=>{if(o.isMesh)o.material=new THREE.MeshStandardMaterial({color:0xbab7bf,roughness:.85,side:THREE.DoubleSide})});scene.add(object);function fit(){const box=new THREE.Box3().setFromObject(object);if(box.isEmpty())return;const sz=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3()),m=Math.max(sz.x,sz.y,sz.z,.01),d=m/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)))*1.5;camera.position.set(c.x+d*.7,c.y+d*.55,c.z+d);camera.near=Math.max(d/10000,.001);camera.far=Math.max(d*100,1000);camera.updateProjectionMatrix();controls.target.copy(c);controls.update()}function resize(){const r=host.getBoundingClientRect();renderer.setSize(Math.max(1,r.width),Math.max(1,r.height),false);camera.aspect=Math.max(1,r.width)/Math.max(1,r.height);camera.updateProjectionMatrix()}fit();resize();const ro=new ResizeObserver(resize);ro.observe(host);let wire=false;const loop=()=>{stage3d.raf=requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)};stage3d={renderer,camera,controls,object,fit,ro,raf:0,setWire:()=>{wire=!wire;object.traverse(o=>{if(o.isMesh)o.material.wireframe=wire});return wire}};loop();}
function showImage(src,name){clear3d();$('#visual').innerHTML=`<img src="${esc(src)}" alt="${esc(name)}"><span class="badge">IMAGE RÉELLE EXTRAITE</span>`}
function showEmpty(msg){clear3d();$('#visual').innerHTML=`<div class="empty">${msg}</div>`}
function buildVisuals(m,x){const a=[];for(const s of (m?.scene||[])){if(s.reconstructable&&s.mesh?.src)a.push({type:'obj',src:s.mesh.src,name:s.gameObject?.name||s.mesh?.name||'Reconstruction'})}for(const z of (m?.meshes||[])){if(z.src)a.push({type:'obj',src:z.src,name:z.name||'Mesh'})}for(const t of (m?.textures||[])){if(t.src)a.push({type:'img',src:t.src,name:t.name||'Texture'})}const exact=a.filter(v=>String(v.name).toLowerCase().includes(String(x.name).replace(/\.[^.]+$/,'').toLowerCase()));return [...exact,...a.filter(v=>!exact.includes(v))]}
async function displayVisual(){const v=visuals[vix];$('#thumbs').innerHTML=visuals.map((x,i)=>`<button class="thumb ${i===vix?'active':''}" data-v="${i}">${x.type==='img'?`<img src="${esc(x.src)}" alt="">`:`<span>3D<br>${i+1}</span>`}</button>`).join('');$('#thumbs').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{vix=+b.dataset.v;displayVisual()});if(!v){showEmpty('Aucun rendu réel disponible pour ce candidat.<br><br><b>Validation désactivée</b> tant que le bundle n\'est pas reconstruit.');renderButtons();return}if(v.type==='img')showImage(v.src,v.name);else await show3d(v.src,v.name);renderButtons()}
async function loadCurrent(){const x=items[idx];if(!x)return;renderSide();$('#name').textContent=`#${x.id} — ${x.name}`;$('#kind').textContent=`${x.category} · bundle ${x.bundleId} · priorité ${x.priority}`;$('#path').textContent=x.assetPath;$('#reason').textContent=x.reason;$('#bundleLink').href=`lastwar-bundle-reconstruction-viewer.html?bundle=${encodeURIComponent(x.bundleId)}`;manifest=null;visuals=[];vix=0;renderButtons();showEmpty('Recherche des rendus réels du bundle…');try{const r=await fetch(`bundle-reconstruction-data/${encodeURIComponent(x.bundleId)}/manifest.json?t=${Date.now()}`,{cache:'no-store'});if(r.ok){manifest=await r.json();visuals=buildVisuals(manifest,x)}}catch{}await displayVisual()}
$('#prev').onclick=()=>{idx=(idx-1+items.length)%items.length;loadCurrent()};$('#next').onclick=()=>{idx=(idx+1)%items.length;loadCurrent()};$('#resetCam').onclick=()=>stage3d?.fit();$('#wire').onclick=()=>stage3d?.setWire();$$('[data-review]').forEach(b=>b.onclick=()=>{if(!visuals.length)return;const x=items[idx];review[x.id]=b.dataset.review;save();idx=(idx+1)%items.length;loadCurrent()});
const data=await fetch(RET).then(r=>r.json());items=[...(data.items||[])].sort((a,b)=>a.priority-b.priority||({"direct-candidate":0,"visual-2d-candidate":1,"context-anchor":2}[a.category]??9)-({"direct-candidate":0,"visual-2d-candidate":1,"context-anchor":2}[b.category]??9)||a.id-b.id);renderStats();loadCurrent();
</script></body></html>
