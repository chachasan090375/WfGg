<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#09080d"><title>WfGg LAB — Audie Cross Bundle</title><style>
:root{color-scheme:dark;--bg:#09080d;--card:#15131c;--line:#332d40;--muted:#aaa4b7;--fg:#f7f4fb;--accent:#a875ff;--ok:#70d79e;--warn:#f0c56c;--blue:#67b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.shell{max-width:1180px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px}.top a{color:#cbb7ff;font-size:18px}.eyebrow{color:#aaa2ba;letter-spacing:.08em;text-transform:uppercase}.title{font-size:clamp(36px,8vw,60px);line-height:1.02;margin:8px 0}.sub{font-size:17px;color:var(--muted);line-height:1.45}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}.stat,.panel,.verdict{background:var(--card);border:1px solid var(--line);border-radius:18px}.stat{padding:14px}.stat span{display:block;color:var(--muted)}.stat strong{font-size:30px}.verdict{padding:16px;border-color:var(--accent)}.verdict strong{font-size:22px;display:block;overflow-wrap:anywhere}.panel{padding:16px;margin:14px 0}.tabs{display:flex;gap:8px;overflow-x:auto;margin:12px 0}.tabs button{white-space:nowrap;border:1px solid var(--line);background:#1b1823;color:var(--fg);border-radius:12px;padding:10px 13px;font:inherit}.tabs button.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0d0c12;color:var(--fg);font:inherit;margin:8px 0 12px}.list{display:grid;gap:9px}.row{background:#0d0c12;border:1px solid var(--line);border-radius:14px;padding:11px;overflow-wrap:anywhere}.row.good{border-left:3px solid var(--ok)}.row.warn{border-left:3px solid var(--warn)}.row.chain{border-left:3px solid var(--blue)}.meta{color:var(--muted);font-size:12px;margin-top:4px}.mini{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;color:#c9c4d1;white-space:pre-wrap}.empty{padding:18px;color:var(--muted);border:1px dashed var(--line);border-radius:14px}@media(min-width:760px){.stats{grid-template-columns:repeat(6,1fr)}}
</style></head><body><main class="shell"><header class="top"><div><div class="eyebrow">WFGG · LAST WAR · LAB · CROSS BUNDLE</div><h1 class="title">Audie — consommateurs réels</h1><div class="sub">Recherche inversée sur tout le corpus local : Texture Audie → Material externe → Renderer → GameObject → Mesh.</div></div><a href="/lab/">← LAB</a></header>
<section class="verdict"><span class="eyebrow">Verdict V4</span><strong id="verdict">—</strong></section>
<section class="stats"><div class="stat"><span>Bundles scannés</span><strong id="bundles">—</strong></div><div class="stat"><span>Textures cibles</span><strong id="textures">—</strong></div><div class="stat"><span>Dépendances</span><strong id="deps">—</strong></div><div class="stat"><span>Materials</span><strong id="mats">—</strong></div><div class="stat"><span>Renderers</span><strong id="chains">—</strong></div><div class="stat"><span>Meshes</span><strong id="meshes">—</strong></div></section>
<section class="panel"><input id="q" placeholder="Filtrer : Audie, High, bullet, material, renderer, bundle, CAB…"><div class="tabs"><button class="active" data-tab="materials">Materials</button><button data-tab="chains">Chaînes Renderer</button><button data-tab="deps">Bundles dépendants</button><button data-tab="preload">Preload</button><button data-tab="textures">Textures cibles</button></div><div id="content" class="list"></div></section>
<section class="panel"><h2>Règles de preuve</h2><div id="rules" class="mini"></div></section></main><script>
const $=x=>document.getElementById(x);let M=null,tab='materials';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const blob=x=>JSON.stringify(x??'').toLowerCase();function filt(a){const q=$('q').value.trim().toLowerCase();return q?a.filter(x=>blob(x).includes(q)):a}
function render(){if(!M)return;let h='';if(tab==='materials'){h=filt(M.materialLinks||[]).map(x=>`<div class="row good"><strong>${esc(x.materialName||'(material sans nom)')}</strong><div class="meta">bundle ${esc(x.bundleId)} · p${esc(x.materialPathID)} · ${esc(x.field)}</div>${(x.textures||[]).map(t=>`<div class="mini">→ ${esc(t.name)} [${esc(t.variant)}/${esc(t.role)}] ${esc(t.width)}×${esc(t.height)} · bundle ${esc(t.bundleId)} · p${esc(t.pathID)}</div>`).join('')}<div class="mini">external: ${esc(x.externalPath||'local')}</div></div>`).join('')}
if(tab==='chains'){h=filt(M.chains||[]).map(x=>`<div class="row chain"><strong>${esc(x.rendererType)} ${esc(x.rendererName||'(sans nom)')}</strong><div class="meta">bundle ${esc(x.bundleId)} · ${x.reconstructible?'MESH RÉSOLU':'MESH NON RÉSOLU'}</div><div class="mini">GameObject: ${esc(x.gameObject?.name||'?')} p${esc(x.gameObject?.pathID||'?')}\nMesh: ${esc(x.mesh?.name||'?')} p${esc(x.mesh?.pathID||'?')}\nRenderer p${esc(x.rendererPathID)}</div>${(x.materialHits||[]).map(m=>`<div class="mini">Material p${esc(m.materialPathID)} · ${esc(m.field)}${m.externalPath?' · '+esc(m.externalPath):''}</div>`).join('')}</div>`).join('')}
if(tab==='deps'){h=filt(M.dependencyCandidates||[]).map(x=>`<div class="row warn"><strong>Bundle ${esc(x.bundleId??'?')}</strong><div class="meta">${x.containsTargetTexture?'contient une texture cible · ':''}${esc((x.externalMatches||[]).length)} référence(s) externe(s)</div><div class="mini">${esc(x.path)}</div>${(x.externalMatches||[]).map(e=>`<div class="mini">${esc(e.sourceSerializedFile)} → ${esc(e.externalPath)} [${esc((e.matchedAliases||[]).join(','))}]</div>`).join('')}</div>`).join('')}
if(tab==='preload'){h=filt(M.preloadHits||[]).map(x=>`<div class="row warn"><strong>AssetBundle preload · bundle ${esc(x.bundleId)}</strong><div class="meta">${esc(x.field)} · fileID ${esc(x.fileID)} → p${esc(x.targetPathID)}</div>${(x.textures||[]).map(t=>`<div class="mini">${esc(t.name)} [${esc(t.variant)}/${esc(t.role)}]</div>`).join('')}</div>`).join('')}
if(tab==='textures'){h=filt(M.textureTargets||[]).map(t=>`<div class="row"><strong>${esc(t.name)}</strong><div class="meta">bundle ${esc(t.bundleId)} · ${esc(t.variant)}/${esc(t.role)} · ${esc(t.width)}×${esc(t.height)}</div><div class="mini">${esc(t.serializedFile)} · p${esc(t.pathID)}</div></div>`).join('')}
$('content').innerHTML=h||'<div class="empty">Aucun élément dans cette catégorie.</div>'}
async function load(){try{const r=await fetch('/lab/master-assets-v2/meta/audie-crossbundle-v4.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);M=await r.json()}catch(e){$('content').innerHTML='<div class="empty">V4 absente. Lance : bash scripts/lastwar-audie-crossbundle-resolver-v4.sh</div>';return}const s=M.stats||{};$('verdict').textContent=M.verdict||'—';$('bundles').textContent=M.bundleFilesScanned??0;$('textures').textContent=s.textureTargets??0;$('deps').textContent=s.dependencyCandidates??0;$('mats').textContent=s.materialLinks??0;$('chains').textContent=s.chains??0;$('meshes').textContent=s.reconstructibleChains??0;$('rules').textContent=(M.rules||[]).map((x,i)=>`${i+1}. ${x}`).join('\n');render()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});$('q').oninput=render;load();
</script></body></html>
