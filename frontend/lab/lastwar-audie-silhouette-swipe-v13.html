<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Audie silhouettes V13</title><style>:root{color-scheme:dark;--bg:#09080d;--card:#15131c;--line:#332d40;--fg:#f7f4fb;--muted:#aaa4b7;--accent:#a875ff;--ok:#70d79e;--bad:#ef8796}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}.shell{max-width:760px;margin:auto;padding:14px}a{color:#cbb7ff}.head{display:flex;justify-content:space-between;gap:8px}.head h1{font-size:34px;margin:6px 0}.muted{color:var(--muted)}.controls{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.controls select,.controls input,.controls button{background:#1b1823;color:var(--fg);border:1px solid var(--line);border-radius:11px;padding:10px;font:inherit}.controls input{flex:1;min-width:160px}.stage{height:62vh;min-height:430px;background:#050507;border:1px solid var(--line);border-radius:18px;overflow:hidden;position:relative}.stage canvas{width:100%;height:100%;display:block}.info{position:absolute;left:10px;right:10px;bottom:10px;background:#0d0b12dd;border:1px solid var(--line);border-radius:12px;padding:9px;font-size:12px}.name{font-weight:800;font-size:16px}.nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}.nav button{padding:14px 8px;border-radius:13px;background:#1b1823;color:var(--fg);border:1px solid var(--line);font:inherit;font-weight:700}.nav .no{border-color:var(--bad)}.nav .yes{border-color:var(--ok)}.found{margin-top:10px;padding:10px;border:1px solid var(--ok);border-radius:12px;display:none}.found.show{display:block}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><main class="shell"><div class="head"><div><div class="muted">WFGG · LAST WAR · LAB</div><h1>Audie — silhouettes V13</h1></div><a href="/lab/">← LAB</a></div><p class="muted">Un modèle à la fois. Base/High de même silhouette sont regroupés. Écarte vite les mauvais candidats jusqu’au modèle du plateau.</p><div class="controls"><select id="scope"><option value="likely">Corps probables</option><option value="low">Faible/moyenne complexité</option><option value="all">Tous</option></select><input id="search" placeholder="Filtrer un nom"><select id="tex"><option value="neutral">Neutre</option></select><button id="wire">Wireframe</button></div><div id="counter" class="muted">Chargement…</div><div id="stage" class="stage"><div id="info" class="info">Chargement…</div></div><div class="nav"><button id="prev">← Précédent</button><button id="no" class="no">✕ Suivant</button><button id="yes" class="yes">✓ Trouvé</button></div><div id="found" class="found"></div></main><script type="module">import * as THREE from 'three';import {OBJLoader} from 'three/addons/loaders/OBJLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';const $=id=>document.getElementById(id);let M,items=[],idx=0,wire=false,scene,camera,renderer,controls,root,texCache=new Map();const bad=/bullet|missile|plane|sphere|camera|effect|eff_|frag|weapon|shell|projectile|particle|chedeng/i;function norm(n){return String(n||'').replace(/_high\b/ig,'').replace(/\bhigh\b/ig,'').replace(/__+/g,'_').toLowerCase()}function dedupe(a){const m=new Map;for(const r of a){const k=norm(r.name)+'|'+(r.faceCount||0);if(!m.has(k))m.set(k,r)}return [...m.values()]}function init(){const mount=$('stage');scene=new THREE.Scene();scene.background=new THREE.Color(0x050507);camera=new THREE.PerspectiveCamera(45,1,.01,1e6);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;mount.prepend(renderer.domElement);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x303040,1.8));const d=new THREE.DirectionalLight(0xffffff,2.2);d.position.set(5,8,6);scene.add(d);root=new THREE.Group;scene.add(root);new ResizeObserver(()=>{const r=mount.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}).observe(mount);(function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)})()}function clear(){while(root.children.length){const o=root.children.pop();o.traverse?.(x=>{x.geometry?.dispose?.();if(x.material)(Array.isArray(x.material)?x.material:[x.material]).forEach(m=>m.dispose?.())})}}function fit(){const b=new THREE.Box3().setFromObject(root);if(b.isEmpty())return;const s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),mx=Math.max(s.x,s.y,s.z,.001),d=mx/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)))*1.55;camera.position.set(c.x+d*.72,c.y+d*.58,c.z+d);camera.near=Math.max(d/10000,.001);camera.far=Math.max(d*100,1000);camera.updateProjectionMatrix();controls.target.copy(c);controls.update()}async function texture(){const v=$('tex').value;if(v==='neutral')return null;const r=M.textures[+v];if(!r)return null;if(texCache.has(r.src))return texCache.get(r.src);const t=await new THREE.TextureLoader().loadAsync(r.src);t.colorSpace=THREE.SRGBColorSpace;t.needsUpdate=true;texCache.set(r.src,t);return t}async function show(){const r=items[idx];$('counter').textContent=items.length?`${idx+1} / ${items.length}`:'0 candidat';clear();if(!r){$('info').textContent='Aucun candidat';return}try{const [o,map]=await Promise.all([new OBJLoader().loadAsync(r.src),texture()]);o.traverse(x=>{if(x.isMesh)x.material=new THREE.MeshStandardMaterial({color:map?0xffffff:0xbcb9c2,map,roughness:.75,metalness:.03,side:THREE.DoubleSide,wireframe:wire})});root.add(o);fit();$('info').innerHTML=`<div class="name">${r.name}</div>${r.vertexCount||'?'} vertices · ${r.faceCount||'?'} faces · ${r.complexity||'?'}<br>${r.bundle||''}`}catch(e){$('info').textContent='Erreur OBJ: '+e}}function filter(){const q=$('search').value.toLowerCase(),s=$('scope').value;items=dedupe(M.meshes||[]).filter(r=>{if(q&&!(`${r.name} ${r.bundle}`.toLowerCase().includes(q)))return false;if(s==='all')return true;if(s==='low')return (r.vertexCount||0)>=120&&(r.vertexCount||0)<=4500&&!bad.test(r.name||'');return (r.vertexCount||0)>=300&&(r.faceCount||0)>=180&&!bad.test(r.name||'')});items.sort((a,b)=>(a.vertexCount||0)-(b.vertexCount||0));idx=0;show()}function next(){if(items.length){idx=(idx+1)%items.length;show()}}function prev(){if(items.length){idx=(idx-1+items.length)%items.length;show()}}async function load(){const r=await fetch('/lab/audie-model-variants-v11-data/manifest.json?t='+Date.now(),{cache:'no-store'});M=await r.json();for(const [i,t] of (M.textures||[]).entries()){if(t.role!=='D')continue;const o=document.createElement('option');o.value=i;o.textContent=`${t.variant||'?'} D · ${t.width||'?'}×${t.height||'?'} · ${t.name}`;$('tex').append(o)}init();filter();$('scope').onchange=filter;$('search').oninput=filter;$('tex').onchange=show;$('wire').onclick=()=>{wire=!wire;show()};$('no').onclick=next;$('prev').onclick=prev;$('yes').onclick=()=>{const r=items[idx];if(!r)return;localStorage.setItem('wfgg_audie_board_mesh',JSON.stringify(r));$('found').classList.add('show');$('found').textContent=`Candidat retenu : ${r.name} · ${r.vertexCount} vertices · ${r.faceCount} faces`}}load().catch(e=>$('info').textContent=e)</script></body></html>
