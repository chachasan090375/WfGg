<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WFGG · Formation OmniTrace</title><style>
:root{color-scheme:dark;--bg:#09080d;--card:#15131c;--line:#302b3c;--muted:#aaa5b5;--fg:#f5f2fb;--accent:#a67cff;--good:#6fd69a;--warn:#efbd68;--bad:#ef7f8b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:980px;margin:auto;padding:24px}.eyebrow{color:#aaa2ba;font-size:14px;letter-spacing:.08em;text-transform:uppercase}.top{display:flex;gap:16px;justify-content:space-between;align-items:flex-start}.top a{color:#cbb7ff}h1{font-size:clamp(34px,7vw,58px);line-height:1.02;margin:8px 0 6px}.sub{color:var(--muted);font-size:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:22px 0}.metric,.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}.metric b{display:block;font-size:34px;margin-top:4px}.metric span{color:var(--muted)}.verdict{font-size:20px;font-weight:800}.pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:7px 11px;margin:4px 4px 4px 0;font-size:13px}.ok{border-color:var(--good);color:#c8f6d7}.warn{border-color:var(--warn);color:#ffe1a9}.bad{border-color:var(--bad);color:#ffc0c6}.tabs{display:flex;gap:9px;overflow:auto;padding-bottom:6px;margin:18px 0}.tabs button{background:#17141f;color:var(--fg);border:1px solid var(--line);border-radius:16px;padding:12px 16px;font-size:16px;white-space:nowrap}.tabs button.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}.item{background:#111018;border:1px solid var(--line);border-radius:17px;padding:14px;margin:10px 0;overflow-wrap:anywhere}.item strong{font-size:18px}.meta{color:var(--muted);font-size:13px;margin-top:6px}.src{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 7px;margin:4px 4px 0 0;font-size:11px}.hi{border-color:var(--good)}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;color:#d9d4e4}.empty{color:var(--muted);padding:18px}.methodrow{display:grid;grid-template-columns:1.4fr 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.methodrow:last-child{border:0}.methodrow small{color:var(--muted)}@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main class="wrap"><div class="top"><div><div class="eyebrow">WFGG · LAST WAR · LAB · OMNITRACE</div><h1>Formation — pack global</h1><div class="sub" id="sub">chargement…</div></div><a href="./lastwar-formation-live-trace.html">Live Trace</a></div>
<div class="grid"><div class="metric"><span>Méthodes OK</span><b id="methods">–</b></div><div class="metric"><span>Preuves fortes</span><b id="strong">–</b></div><div class="metric"><span>Recoupements</span><b id="cross">–</b></div><div class="metric"><span>Candidats</span><b id="cands">–</b></div></div>
<section class="panel"><div class="eyebrow">Verdict fusionné</div><div class="verdict" id="verdict">–</div><div id="health" style="margin-top:14px"></div></section>
<section class="panel" style="margin-top:14px"><div class="eyebrow">Top recoupements</div><div id="topCross"></div></section>
<div class="tabs"><button data-tab="strong" class="on">Fortes</button><button data-tab="crossSource">Recoupements</button><button data-tab="paths">Fichiers</button><button data-tab="network">Réseau</button><button data-tab="evidence">Chronologie</button><button data-tab="methodsTab">Méthodes</button></div><section class="panel"><div id="content"></div></section></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let D=null,tab='strong';
function item(r){return `<div class="item ${r.confidence==='FORTE'?'hi':''}"><strong>${esc(r.token||r.endpoint||r.text)}</strong><div class="meta">${r.confidence?`confiance ${esc(r.confidence)} · score ${r.score} · occurrences ${r.count}`:''}</div>${(r.sources||[r.source]).filter(Boolean).map(s=>`<span class="src">${esc(s)}</span>`).join('')}${(r.examples||[]).slice(0,2).map(e=>`<pre>${esc(e.text)}</pre>`).join('')}</div>`}
function render(){if(!D)return;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));let h='';if(tab==='methodsTab'){h=Object.entries(D.methodHealth||{}).map(([k,v])=>`<div class="methodrow"><b>${esc(k)}</b><span class="pill ${v.state==='OK'?'ok':v.state==='VIDE'?'warn':'bad'}">${esc(v.state)}</span><small>${v.bytes||0} o</small></div>`).join('')}else if(tab==='evidence'){h=(D.evidence||[]).map(e=>`<div class="item"><strong>${esc(e.source)}</strong><div class="meta">${esc(e.file)} · ligne ${e.line}${e.lowLevel?' · basse couche':''}</div><pre>${esc(e.text)}</pre></div>`).join('')}else{const a=D[tab]||[];h=a.map(item).join('')}document.getElementById('content').innerHTML=h||'<div class="empty">Aucun élément exploitable dans cette catégorie.</div>'}
fetch('./master-assets-v2/formation-omnitrace/latest.json?ts='+Date.now()).then(r=>r.json()).then(d=>{D=d;document.getElementById('sub').textContent=`capture ${d.session} · ${d.label||''}`;document.getElementById('methods').textContent=`${d.methodOkCount}/${d.methodTotal}`;document.getElementById('strong').textContent=d.strongCount;document.getElementById('cross').textContent=d.crossSourceCount;document.getElementById('cands').textContent=d.candidateCount;document.getElementById('verdict').textContent=d.verdict;document.getElementById('health').innerHTML=Object.entries(d.methodHealth||{}).map(([k,v])=>`<span class="pill ${v.state==='OK'?'ok':v.state==='VIDE'?'warn':'bad'}">${esc(k)} · ${esc(v.state)}</span>`).join('');document.getElementById('topCross').innerHTML=(d.crossSource||[]).slice(0,6).map(item).join('')||'<div class="empty">Pas encore de recoupement inter-source.</div>';render()}).catch(e=>{document.getElementById('sub').textContent='analyse introuvable';document.getElementById('content').innerHTML='<pre>'+esc(e)+'</pre>'});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
</script></body></html>
