<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>WfGg LAB — Formation Differential</title><style>:root{color-scheme:dark;--bg:#09090d;--p:#15141a;--p2:#1d1a24;--l:#34303e;--t:#f4f0f7;--m:#aaa1b3;--a:#9b7cff;--ok:#75d69c;--w:#f0c575;--bad:#ee8b8b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:1050px;margin:auto;padding:16px 16px 80px}.top{display:flex;justify-content:space-between;gap:12px}.top h1{font-size:25px;margin:4px 0}.muted{color:var(--m)}a{color:#cabdff}.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:15px 0}.stat,.card{background:var(--p);border:1px solid var(--l);border-radius:13px;padding:12px}.stat span{display:block;color:var(--m);font-size:12px}.stat strong{font-size:21px}.card{margin:10px 0}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--l);background:var(--p2);padding:5px 8px;border-radius:999px;font-size:12px}.ok{border-color:var(--ok)}.warn{border-color:var(--w)}.bad{border-color:var(--bad)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d0c12;border:1px solid var(--l);border-radius:9px;padding:9px;font-size:11px}.line{padding:9px 0;border-top:1px solid var(--l)}.line:first-child{border-top:0}.search{width:100%;font:inherit;color:var(--t);background:var(--p2);border:1px solid var(--l);border-radius:10px;padding:11px;margin:8px 0}.tabs{display:flex;gap:7px;overflow:auto}.tabs button{font:inherit;color:var(--t);background:var(--p);border:1px solid var(--l);border-radius:10px;padding:9px 12px}.tabs button.on{border-color:var(--a)}.hidden{display:none}@media(min-width:780px){.sum{grid-template-columns:repeat(4,minmax(0,1fr))}}</style></head><body><main><div class="top"><div><div class="muted">WFGG · LAST WAR · LAB · A/B</div><h1>Formation — différentiel témoin</h1><div id="status" class="muted">Chargement…</div></div><a href="/lab/lastwar-formation-live-trace.html?v=2">← Live Trace</a></div><div id="summary" class="sum"></div><div id="verdict" class="card"></div><input id="q" class="search" placeholder="Filtrer : formation, hero, bundle, rpc…"><div class="tabs"><button class="on" data-tab="strong">Preuves fortes</button><button data-tab="interesting">Signaux</button><button data-tab="sockets">Réseau</button><button data-tab="all">Delta complet</button></div><section id="strong"></section><section id="interesting" class="hidden"></section><section id="sockets" class="hidden"></section><section id="all" class="hidden"></section></main><script>const $=x=>document.getElementById(x),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),stat=(a,b)=>`<div class="stat"><span>${e(a)}</span><strong>${e(b)}</strong></div>`;let D;function rows(rs){const q=$('q').value.toLowerCase();const a=(rs||[]).filter(r=>JSON.stringify(r).toLowerCase().includes(q));return a.length?a.map(r=>`<div class="line"><div class="chips"><span class="chip">score ${e(r.score)}</span><span class="chip">+${e(r.excess)}</span>${(r.hits||[]).map(h=>`<span class="chip">${e(h)}</span>`).join('')}</div><pre>${e(r.text)}</pre></div>`).join(''):'<div class="card muted">Aucun élément pour ce filtre.</div>'}function render(){if(!D)return;$('strong').innerHTML=rows(D.strong);$('interesting').innerHTML=rows(D.interesting);$('all').innerHTML=rows(D.topDelta);$('sockets').innerHTML=`<div class="card"><pre>${e((D.uniqueSockets||[]).join('\n')||'Aucune connexion unique à la capture de changement.')}</pre></div>`}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));['strong','interesting','sockets','all'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.tab))});$('q').addEventListener('input',render);(async()=>{try{let r=await fetch('/lab/formation-live-trace-data/differential.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);D=await r.json();let s=D.summary||{};$('summary').innerHTML=[stat('Delta',s.deltaPatterns||0),stat('Signaux',s.interesting||0),stat('Fortes',s.strong||0),stat('Sockets uniques',s.uniqueSockets||0)].join('');let cls=D.verdict==='STRONG_CHANGE_SPECIFIC_EVIDENCE'?'ok':D.verdict==='CHANGE_SPECIFIC_RUNTIME_SIGNAL'?'warn':'bad';$('verdict').innerHTML=`<h2>${e(D.verdict)}</h2><div class="chips"><span class="chip ${cls}">${e(D.change?.label||'changement')}</span><span class="chip">vs ${e(D.baseline?.label||'témoin')}</span></div><p>Seules les lignes plus fréquentes pendant la modification que pendant le témoin sont conservées.</p>`;$('status').textContent=`${D.change?.sessionId||'?'} vs ${D.baseline?.sessionId||'?'}`;render()}catch(err){$('status').textContent='Pas encore de différentiel : '+err.message;$('verdict').innerHTML='<h2>Capture témoin requise</h2><p>Fais une capture V2 sans modifier la formation, puis lance le script differential-v1.</p>'}})();</script></body></html>
