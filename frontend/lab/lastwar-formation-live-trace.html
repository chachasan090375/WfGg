<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>WfGg LAB — Formation Live Trace</title><style>:root{color-scheme:dark;--bg:#09090d;--p:#15141a;--p2:#1d1a24;--l:#34303e;--t:#f4f0f7;--m:#aaa1b3;--a:#9b7cff;--ok:#75d69c;--w:#f0c575;--bad:#ee8b8b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:1100px;margin:auto;padding:16px 16px 80px}.top{display:flex;justify-content:space-between;gap:14px}.top h1{font-size:25px;margin:4px 0}.muted{color:var(--m)}a{color:#cabdff}.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:15px 0}.stat,.card{background:var(--p);border:1px solid var(--l);border-radius:13px;padding:12px}.stat span{display:block;color:var(--m);font-size:12px}.stat strong{font-size:21px}.card{margin:10px 0}.card h2,.card h3{margin:0 0 9px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--l);background:var(--p2);padding:5px 8px;border-radius:999px;font-size:12px}.ok{border-color:var(--ok)}.warn{border-color:var(--w)}.bad{border-color:var(--bad)}.line{padding:9px 0;border-top:1px solid var(--l)}.line:first-child{border-top:0}.line pre,pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d0c12;border:1px solid var(--l);border-radius:9px;padding:9px;font-size:11px}.proof{border-left:4px solid var(--ok);padding-left:10px}.rel{border-left:4px solid var(--w);padding-left:10px}.search{width:100%;font:inherit;color:var(--t);background:var(--p2);border:1px solid var(--l);border-radius:10px;padding:11px;margin:8px 0}.tabs{display:flex;gap:7px;overflow:auto;padding:4px 0}.tabs button{font:inherit;color:var(--t);background:var(--p);border:1px solid var(--l);border-radius:10px;padding:9px 12px;white-space:nowrap}.tabs button.on{border-color:var(--a)}section{margin-top:20px}.hidden{display:none}.staticmap strong{font-size:19px}@media(min-width:780px){.sum{grid-template-columns:repeat(6,minmax(0,1fr))}}</style></head><body><main><div class="top"><div><div class="muted">WFGG · LAST WAR · LAB · RUNTIME</div><h1>Formation Live Trace</h1><div id="status" class="muted">Chargement de la dernière capture…</div></div><div><a href="/lab/lastwar-formation-lua-trace-viewer.html?v=6">Graphe</a><br><a href="/lab/lastwar-lwscripts-structure.html?v=2">Lua</a></div></div><div id="summary" class="sum"></div><div id="verdict" class="card"></div><div class="card staticmap"><h2>Référentiel Murphy connu</h2><div id="staticmap"></div></div><input id="q" class="search" placeholder="Filtrer : FormationRT, LoadAsset, Murphy, bundle…"><div class="tabs"><button data-tab="direct" class="on">Preuves directes</button><button data-tab="relevant">Logs pertinents</button><button data-tab="files">Fichiers</button><button data-tab="net">Réseau</button><button data-tab="raw">Log brut</button></div><section id="direct"></section><section id="relevant" class="hidden"></section><section id="files" class="hidden"></section><section id="net" class="hidden"></section><section id="raw" class="hidden"></section></main><script>const $=id=>document.getElementById(id),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),stat=(a,b)=>`<div class="stat"><span>${e(a)}</span><strong>${e(b)}</strong></div>`;let DATA=null,TAB='direct';function renderList(rows,cls){const q=$('q').value.toLowerCase();const f=(rows||[]).filter(r=>JSON.stringify(r).toLowerCase().includes(q));return f.length?f.map(r=>`<div class="line ${cls||''}"><div class="chips"><span class="chip">ligne ${e(r.line??'—')}</span>${(r.hits||[]).map(h=>`<span class="chip">${e(h)}</span>`).join('')}</div><pre>${e(r.text||JSON.stringify(r,null,2))}</pre></div>`).join(''):'<div class="card muted">Aucun élément pour ce filtre.</div>'}function rerender(){if(!DATA)return;$('direct').innerHTML=renderList(DATA.directEvidence,'proof');$('relevant').innerHTML=renderList(DATA.relevant,'rel');const q=$('q').value.toLowerCase(),fd=(DATA.fileDelta||[]).filter(x=>JSON.stringify(x).toLowerCase().includes(q));$('files').innerHTML=fd.length?fd.map(x=>`<div class="card"><div class="chips"><span class="chip ${x.change==='created'?'ok':'warn'}">${e(x.change)}</span></div><pre>${e(x.path)}\n${e(JSON.stringify({before:x.before,after:x.after},null,2))}</pre></div>`).join(''):'<div class="card muted">Aucun fichier accessible modifié pendant cette capture.</div>';const add=(DATA.socketAdded||[]).filter(x=>x.toLowerCase().includes(q)),rem=(DATA.socketRemoved||[]).filter(x=>x.toLowerCase().includes(q));$('net').innerHTML=`<div class="card"><h3>Connexions apparues</h3><pre>${e(add.join('\n')||'aucune')}</pre></div><div class="card"><h3>Connexions disparues</h3><pre>${e(rem.join('\n')||'aucune')}</pre></div>`;const raw=(DATA.rawTail||[]).filter(x=>x.toLowerCase().includes(q));$('raw').innerHTML=`<div class="card"><pre>${e(raw.join('\n')||'aucune ligne')}</pre></div>`}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));['direct','relevant','files','net','raw'].forEach(id=>$(id).classList.toggle('hidden',id!==TAB))});$('q').addEventListener('input',rerender);(async()=>{try{const r=await fetch('/lab/formation-live-trace-data/latest.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);DATA=await r.json();const s=DATA.summary||{};$('summary').innerHTML=[stat('Session',DATA.sessionId||'?'),stat('Logs',s.logLines||0),stat('Pertinents',s.relevantLines||0),stat('Preuves',s.directEvidence||0),stat('Fichiers Δ',s.fileChanges||0),stat('Sockets +',s.socketAdded||0)].join('');let cls=DATA.verdict==='DIRECT_RUNTIME_EVIDENCE'?'ok':DATA.verdict==='PARTIAL_RUNTIME_EVIDENCE'?'warn':'bad';$('verdict').innerHTML=`<h2>${e(DATA.label||'Capture')}</h2><div class="chips"><span class="chip ${cls}">${e(DATA.verdict)}</span></div><p>${DATA.verdict==='DIRECT_RUNTIME_EVIDENCE'?'Des noms/points runtime ciblés ont été observés directement pendant la modification.':DATA.verdict==='PARTIAL_RUNTIME_EVIDENCE'?'Des traces liées au chargement/Formation existent, mais elles ne suffisent pas encore à prouver la chaîne complète.':'Le processus ne journalise pas les loaders utiles dans logcat. Le prochain niveau devra instrumenter les appels de chargement.'}</p><p class="muted">Les preuves live, les mots-clés et le référentiel statique sont séparés pour éviter les fausses liaisons.</p>`;const m=DATA.knownStaticMap?.Murphy||{};$('staticmap').innerHTML=`<strong>Murphy → ${e(m.prefabName||'?')}</strong><p>Prefab bundle <b>${e(m.prefabBundle)}</b> · Mesh <b>${e(m.meshBundle)}</b> · Textures <b>${e((m.textureBundles||[]).join(' / '))}</b></p><div class="muted">${e(m.note||'')}</div>`;$('status').textContent='capture '+(DATA.sessionId||'')+' chargée';rerender()}catch(err){$('status').textContent='Aucune capture analysée : '+err.message;$('verdict').innerHTML='<h2>Pas encore de capture</h2><p>Lance le script Formation Live Trace dans Termux, fais une seule modification de formation, puis arrête la capture.</p>'}})();</script></body></html>
