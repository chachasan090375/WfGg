<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>WfGg LAB — LWScripts Signature Map</title><style>:root{color-scheme:dark;--bg:#09090d;--p:#15141a;--p2:#1d1a24;--l:#34303e;--t:#f4f0f7;--m:#aaa1b3;--a:#9b7cff;--ok:#75d69c;--w:#f0c575}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:1100px;margin:auto;padding:16px 16px 80px}.top{display:flex;justify-content:space-between;gap:12px}.top h1{margin:2px 0 4px;font-size:23px}a{color:#cabdff}.muted{color:var(--m)}.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}.stat,.card{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:11px}.stat span{display:block;color:var(--m);font-size:12px}.stat strong{font-size:19px}.card{margin:10px 0}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--l);background:var(--p2);border-radius:999px;padding:5px 8px;font-size:12px}.ok{border-color:var(--ok)}.warn{border-color:var(--w)}.row{padding:8px 0;border-top:1px solid var(--l)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d0c12;border:1px solid var(--l);border-radius:9px;padding:9px;font-size:11px;max-height:320px;overflow:auto}.timeline{position:relative;height:44px;background:#0d0c12;border:1px solid var(--l);border-radius:10px;overflow:hidden;margin-top:10px}.mark{position:absolute;top:7px;width:3px;height:28px;background:var(--a)}@media(min-width:760px){.sum{grid-template-columns:repeat(4,minmax(0,1fr))}}</style></head><body><main><div class="top"><div><div class="muted">WFGG · LAST WAR · LAB · SIGNATURE MAP</div><h1>LWScripts.data — cartographie</h1><div id="status" class="muted">Chargement…</div></div><div><a href="/lab/lastwar-lwscripts-structure.html?v=2">Structure</a><br><a href="/lab/lastwar-formation-lua-trace-viewer.html?v=5">Graphe</a></div></div><div id="summary" class="sum"></div><div id="verdict" class="card"></div><section><h2>Types de signatures</h2><div id="counts" class="card"></div></section><section><h2>Répartition dans le fichier</h2><div id="timeline" class="timeline"></div></section><section><h2>Décodages réussis</h2><div id="decodes" class="card"></div></section><section><h2>Indices de framing</h2><div id="frames" class="card"></div></section></main><script>const $=x=>document.getElementById(x),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),stat=(a,b)=>`<div class="stat"><span>${e(a)}</span><strong>${e(b)}</strong></div>`;(async()=>{try{const r=await fetch('/lab/formation-lua-trace-viewer-data/lwscripts-signature-map.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json(),counts=d.counts||{},occ=d.occurrences||[],oks=(d.decodeAttempts||[]).filter(x=>x.ok),frames=d.frameClues||[];$('summary').innerHTML=[stat('Taille',Number(d.bytes||0).toLocaleString('fr-FR')+' o'),stat('Marqueurs',occ.length),stat('Types',Object.keys(counts).length),stat('Décodages OK',oks.length)].join('');$('verdict').innerHTML=`<h2>Verdict</h2><div class="chips"><span class="chip ok">${e(d.verdict)}</span></div><p>${e(d.nextHint)}</p>`;$('counts').innerHTML=Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row"><b>${e(k)}</b> · ${e(v)} occurrence(s)</div>`).join('')||'<div class="muted">Aucune signature.</div>';const n=Number(d.bytes||1);$('timeline').innerHTML=occ.slice(0,600).map(x=>`<i class="mark" title="${e(x.signature)} @ ${e(x.offset)}" style="left:${Math.max(0,Math.min(99.7,Number(x.offset)/n*100))}%"></i>`).join('');$('decodes').innerHTML=oks.length?oks.slice(0,120).map(x=>`<div class="row"><b>${e(x.signature)}</b> @ ${Number(x.offset).toLocaleString('fr-FR')}<br><span class="muted">${e(x.kind)} · ${e(x.detail||'')}</span></div>`).join(''):'<div class="muted">Aucun décodage standard réussi.</div>';$('frames').innerHTML=frames.length?frames.slice(0,100).map(x=>`<div class="row"><b>${e(x.signature)}</b> @ ${Number(x.offset).toLocaleString('fr-FR')}<pre>${e(JSON.stringify(x.prefixLengthCandidates,null,2))}</pre></div>`).join(''):'<div class="muted">Aucun préfixe de longueur plausible détecté.</div>';$('status').textContent='cartographie prête'}catch(err){$('status').textContent='Carte absente : '+err.message;console.error(err)}})();</script></body></html>
