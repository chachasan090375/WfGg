<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>WfGg LAB — Lua chunks</title><style>:root{color-scheme:dark;--bg:#09090d;--p:#15141a;--p2:#1d1a24;--l:#34303e;--t:#f4f0f7;--m:#aaa1b3;--a:#9b7cff;--ok:#75d69c;--w:#f0c575;--bad:#ed8e8e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:1150px;margin:auto;padding:16px 16px 90px}.top{display:flex;justify-content:space-between;gap:12px}.top h1{margin:2px 0 4px;font-size:23px}a{color:#cabdff}.muted{color:var(--m)}.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}.stat,.card{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:11px}.stat span{display:block;color:var(--m);font-size:12px}.stat strong{font-size:19px;overflow-wrap:anywhere}.card{margin:10px 0}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--l);background:var(--p2);border-radius:999px;padding:5px 8px;font-size:12px}.ok{border-color:var(--ok)}.warn{border-color:var(--w)}input{width:100%;background:#0d0c12;color:var(--t);border:1px solid var(--l);border-radius:12px;padding:12px;font-size:16px;margin:12px 0}.row{padding:10px 0;border-top:1px solid var(--l)}.row:first-child{border-top:0}.title{font-weight:700;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--m);margin-top:4px}.strings{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#0d0c12;border:1px solid var(--l);border-radius:8px;padding:8px;margin-top:7px;max-height:220px;overflow:auto}@media(min-width:760px){.sum{grid-template-columns:repeat(5,minmax(0,1fr))}}</style></head><body><main><div class="top"><div><div class="muted">WFGG · LAST WAR · LAB · LUA INDEX</div><h1>LWScripts.data — chunks compilés</h1><div id="status" class="muted">Chargement…</div></div><div><a href="/lab/lastwar-lwscripts-signature-map.html?v=1">Signatures</a><br><a href="/lab/lastwar-formation-lua-trace-viewer.html?v=6">Graphe</a></div></div><div id="summary" class="sum"></div><div id="verdict" class="card"></div><input id="q" placeholder="Filtrer : FormationRT, UIHeroPVPFormationPanel, Camera, Audie…"><section><h2>Chunks pertinents</h2><div id="rows" class="card"></div></section></main><script>const $=x=>document.getElementById(x),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),stat=(a,b)=>`<div class="stat"><span>${e(a)}</span><strong>${e(b)}</strong></div>`;let DATA=null;function render(){if(!DATA)return;const q=$('q').value.trim().toLowerCase();let rows=DATA.relevant||[];if(q)rows=rows.filter(r=>[r.moduleGuess,...(r.anchorHits||[]),...(r.keywordHits||[]),...(r.strings||[])].join('\n').toLowerCase().includes(q));rows=rows.slice(0,250);$('rows').innerHTML=rows.length?rows.map(r=>`<div class="row"><div class="title">${e(r.moduleGuess||('LUAC @ '+r.offset))}</div><div class="chips"><span class="chip ok">score ${e(r.score)}</span><span class="chip">offset ${Number(r.offset).toLocaleString('fr-FR')}</span><span class="chip">${Number(r.size).toLocaleString('fr-FR')} o</span><span class="chip">Lua ${e(r.version)}</span>${(r.anchorHits||[]).map(x=>`<span class="chip ok">${e(x)}</span>`).join('')}</div><div class="meta">${e((r.keywordHits||[]).join(' · '))}</div>${(r.strings||[]).length?`<details><summary>Constantes lisibles (${r.strings.length})</summary><div class="strings">${e(r.strings.join('\n'))}</div></details>`:''}</div>`).join(''):'<div class="muted">Aucun chunk pour ce filtre.</div>'}(async()=>{try{const r=await fetch('/lab/formation-lua-trace-viewer-data/lwscripts-luac-index.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);DATA=await r.json();const s=DATA.summary||{};$('summary').innerHTML=[stat('Marqueurs bruts',s.rawMarkers||0),stat('Chunks valides',s.validChunks||0),stat('Pertinents',s.relevantChunks||0),stat('Ancres exactes',s.exactAnchorChunks||0),stat('Taille médiane',Number(s.sizeMedian||0).toLocaleString('fr-FR')+' o')].join('');$('verdict').innerHTML=`<h2>Verdict</h2><div class="chips"><span class="chip ok">${e(DATA.verdict)}</span></div><p>${e(DATA.nextHint)}</p><div class="muted">Versions : ${e(JSON.stringify(s.versions||{}))}</div>`;$('status').textContent='index bytecode prêt';render();$('q').addEventListener('input',render)}catch(err){$('status').textContent='Index absent : '+err.message}})();</script></body></html>
