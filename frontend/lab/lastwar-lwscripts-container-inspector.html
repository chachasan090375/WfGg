<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>WfGg LAB — LWScripts Inspector</title><style>:root{color-scheme:dark;--bg:#09090d;--p:#15141a;--p2:#1d1a24;--l:#34303e;--t:#f4f0f7;--m:#aaa1b3;--a:#9b7cff;--ok:#75d69c;--w:#f0c575;--bad:#ef8f8f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:1180px;margin:auto;padding:16px 16px 90px}.top{display:flex;justify-content:space-between;gap:12px}.top h1{margin:2px 0;font-size:23px}a{color:#cabdff}.muted{color:var(--m)}.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}.stat,.card{background:var(--p);border:1px solid var(--l);border-radius:12px}.stat{padding:10px}.stat span{display:block;color:var(--m);font-size:12px}.stat strong{display:block;margin-top:2px;font-size:19px;overflow-wrap:anywhere}.card{padding:12px;margin:10px 0}.card h2{font-size:18px;margin:0 0 8px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:12px;border:1px solid var(--l);background:var(--p2);padding:5px 7px;border-radius:999px}.ok{border-color:var(--ok)}.warn{border-color:var(--w)}.bad{border-color:var(--bad)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d0c12;border:1px solid var(--l);border-radius:9px;padding:9px;font-size:11px;max-height:300px;overflow:auto}.grid{display:grid;gap:10px}.method{padding:10px 0;border-top:1px solid var(--l)}.method strong{display:block;overflow-wrap:anywhere}.hit{padding:7px;border-top:1px solid var(--l);font-size:12px;overflow-wrap:anywhere}@media(min-width:800px){.sum{grid-template-columns:repeat(5,minmax(0,1fr))}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}</style></head><body><main><div class="top"><div><div class="muted">WFGG · LAST WAR · LAB · INSPECTEUR</div><h1>LWScripts.data — structure réelle</h1><div id="status" class="muted">Chargement…</div></div><div><a href="/lab/lastwar-formation-lua-trace-viewer.html?v=4">Graphe</a><br><a href="/lab/lastwar-lua-runtime-diagnostic.html?v=2">Diagnostic</a></div></div><div id="summary" class="sum"></div><section><h2>Métadonnées embarquées</h2><div id="small" class="grid"></div></section><section><h2>Conteneur binaire</h2><div id="binary" class="card"></div></section><section><h2>Appels compression / crypto</h2><div id="hits" class="card"></div></section><section><h2>Méthodes exactes du chargeur</h2><div id="methods" class="card"></div></section></main><script>const $=x=>document.getElementById(x),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),stat=(a,b)=>`<div class="stat"><span>${e(a)}</span><strong>${e(b)}</strong></div>`;function sf(f){const best=(f.decodings||[])[0];return `<article class="card"><h2>${e(f.name)}</h2><div class="chips"><span class="chip">${e(f.bytes)} octets</span><span class="chip ${best?'ok':'warn'}">${best?e(best.encoding):'binaire'}</span></div><pre>${e(best?best.text:f.hex)}</pre></article>`}function meth(m){return `<div class="method"><strong>${e(m.symbol)}</strong><div class="muted">rid ${e(m.rid)}</div>${(m.strings||[]).length?`<pre>STRINGS\n${e((m.strings||[]).join('\n'))}</pre>`:''}<pre>INTERNAL\n${e((m.internalCalls||[]).join('\n')||'—')}\n\nEXTERNAL\n${e((m.externalCalls||[]).join('\n')||'—')}</pre></div>`}(async()=>{try{const r=await fetch('/lab/formation-lua-trace-viewer-data/lwscripts-container-inspector-v1.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json(),x=d.data||{},h=d.verdictHints||{},sigs=x.signatureOffsets||{},sigCount=Object.values(sigs).reduce((a,v)=>a+(v||[]).length,0),verified=(x.decompressionProbes||[]).filter(p=>p.ok).length;$('summary').innerHTML=[stat('Taille',Math.round((x.bytes||0)/1048576*10)/10+' Mio'),stat('Entropie tête',x.headEntropy),stat('Signatures',sigCount),stat('Zlib vérifiés',verified),stat('Méthodes',d.methods?.length||0)].join('');$('small').innerHTML=(d.smallFiles||[]).map(sf).join('');const sigTxt=Object.entries(sigs).filter(([,v])=>v&&v.length).map(([k,v])=>k+': '+v.slice(0,20).join(', ')).join('\n')||'Aucune signature connue trouvée.';const z=(x.zlibHeaderOffsets||[]).slice(0,40).join(', ')||'aucun';const probes=(x.decompressionProbes||[]).map(p=>`${p.kind}@${p.offset} ${p.ok?'OK '+p.outBytes+' octets':'ECHEC '+(p.error||'')}`).join('\n')||'aucun';$('binary').innerHTML=`<div class="chips"><span class="chip ${h.highEntropy?'warn':'ok'}">haute entropie: ${e(h.highEntropy)}</span><span class="chip ${h.hasKnownContainerSignature?'ok':'warn'}">signature connue: ${e(h.hasKnownContainerSignature)}</span><span class="chip ${h.hasVerifiedZlibProbe?'ok':'warn'}">zlib confirmé: ${e(h.hasVerifiedZlibProbe)}</span></div><p class="muted">Entropie tête / milieu / fin : ${e(x.headEntropy)} / ${e(x.middleEntropy)} / ${e(x.tailEntropy)}</p><details open><summary>Signatures trouvées</summary><pre>${e(sigTxt)}</pre></details><details><summary>Candidats zlib</summary><pre>${e(z)}</pre></details><details><summary>Tests de décompression</summary><pre>${e(probes)}</pre></details><details><summary>Premiers octets</summary><pre>${e(x.headHex)}</pre></details><details><summary>Chaînes ASCII tête/fin</summary><pre>${e([...(x.headStrings||[]),...(x.tailStrings||[])].map(y=>y.offset+': '+y.text).join('\n')||'aucune')}</pre></details>`;$('hits').innerHTML=(d.compressionCryptoCallHits||[]).length?(d.compressionCryptoCallHits||[]).map(y=>`<div class="hit"><b>${e(y.method)}</b><br>${e(y.call)}</div>`).join(''):'<div class="muted">Aucun appel classé compression/crypto.</div>';$('methods').innerHTML=(d.methods||[]).map(meth).join('')||'<div class="muted">Aucune méthode.</div>';$('status').textContent='inspecteur prêt'}catch(err){$('status').textContent='Inspecteur absent : '+err.message}})();</script></body></html>
