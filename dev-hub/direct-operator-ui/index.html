<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6650a4"><title>ChaCha DEV</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;--p:#7c5cff;--bg:#17171b;--card:#24242a;--muted:#aaa9b2;--line:#3a3942}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f5ff;min-height:100vh}
main{max-width:760px;margin:auto;padding:22px 16px 48px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{font-weight:800;font-size:22px}.dot{width:10px;height:10px;border-radius:50%;background:#66d17a;display:inline-block;margin-right:7px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 8px 30px #0003}
textarea{width:100%;min-height:120px;resize:vertical;background:#1c1c21;color:white;border:1px solid #4a4855;border-radius:16px;padding:15px;font-size:17px;outline:none}
textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px #7c5cff22}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
button{border:0;border-radius:14px;padding:12px 16px;font-weight:700;font-size:15px;background:#35343d;color:white}
button.primary{background:var(--p)}button:disabled{opacity:.5}.state{margin-top:18px}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#313039;color:var(--muted);font-size:13px}
pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;line-height:1.45;color:#e6e1f8;margin:12px 0 0}
.small{color:var(--muted);font-size:13px;margin-top:10px}
</style>
</head>
<body><main>
<div class="head"><div class="brand">ChaCha DEV</div><div><span class="dot"></span><span id="conn">Direct</span></div></div>
<div class="card">
<textarea id="q" placeholder="Demander à ChaCha DEV…"></textarea>
<div class="actions"><button class="primary" id="send">Envoyer</button><button id="go">Go</button><button id="status">Allo</button><button id="stop">Stop</button></div>
<div class="small">Entrée directe → Functional Translator → cerveau central</div>
</div>
<div class="card state"><span class="badge" id="stage">Prêt</span><pre id="result">Aucune demande en cours.</pre></div>
</main>
<script>
const q=document.querySelector('#q'),send=document.querySelector('#send'),stage=document.querySelector('#stage'),result=document.querySelector('#result');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function submit(text){
 if(!text.trim())return;[send].forEach(b=>b.disabled=true);stage.textContent='QUEUED';result.textContent='Transmission à ChaCha DEV…';
 try{
  const r=await fetch('/api/v1/intent',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
  const x=await r.json();if(!r.ok)throw new Error(x.reason||x.status||'Erreur');
  for(;;){await sleep(900);const j=await (await fetch('/api/v1/jobs/'+x.job_id,{cache:'no-store'})).json();stage.textContent=j.state||'…';
   if(j.state==='COMPLETE'){const z=j.response||{};result.textContent=(z.status||'OK')+'\n\n'+(z.next_action||'')+(z.project_id?'\n\nProjet : '+z.project_id:'');break}
   if(j.state==='FAILED'){throw new Error(j.error||'Échec')}
  }
 }catch(e){stage.textContent='ERREUR';result.textContent=String(e)}finally{send.disabled=false}
}
send.onclick=()=>submit(q.value);document.querySelector('#go').onclick=()=>submit('Go');document.querySelector('#status').onclick=()=>submit('Allo');document.querySelector('#stop').onclick=()=>submit('Stop');
q.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')submit(q.value)});
</script></body></html>
