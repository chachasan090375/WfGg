<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11160d">
<title>WfGg Radar Live</title>
<style>
:root{
  --bg:#080b07;--panel:#171d12;--panel2:#222b19;--edge:#53633c;--screen:#082916;
  --green:#5dff74;--green2:#c6ff69;--amber:#f2c04e;--red:#ff6b57;--ink:#eaf6d5;--muted:#9bad88;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#202919 0,#0b0f09 42%,#050705 100%);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
body{min-height:100dvh;padding:calc(14px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));overflow-x:hidden}
.shell{width:min(720px,100%);margin:auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 4px 12px}.brand{font-weight:900;letter-spacing:.14em;font-size:clamp(18px,5vw,28px)}.brand b{color:var(--green)}
.pill{font-size:11px;border:1px solid #405134;border-radius:999px;padding:7px 10px;color:var(--muted);background:#10150d}.pill.online{color:var(--green2);border-color:#396d3c}.pill.bad{color:#ff9b89;border-color:#7d3a30}
.device{position:relative;background:linear-gradient(145deg,#39442d,#171d12 42%,#0e120c 100%);border:1px solid #5f6e4a;border-radius:34px;padding:18px 18px 22px;box-shadow:0 28px 65px #000a,inset 0 1px 0 #7c8d6259,inset 0 -12px 30px #0008}
.device:before,.device:after{content:"";position:absolute;width:34px;height:11px;top:46px;background:#11170e;border:1px solid #556044;border-radius:8px}.device:before{left:-12px;transform:rotate(-64deg)}.device:after{right:-12px;transform:rotate(64deg)}
.screen-wrap{display:grid;place-items:center}.screen{position:relative;width:min(92vw,510px);aspect-ratio:1;border-radius:50%;overflow:hidden;border:12px solid #11170e;outline:3px solid #6d7a55;background:radial-gradient(circle,#0d5a2e 0,#083b21 42%,#061c12 72%,#020b07 100%);box-shadow:inset 0 0 0 2px #82906c,inset 0 0 50px #000,0 6px 24px #000b}
.grid{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle at center,transparent 0 11.8%,#65ff7c2d 12% 12.35%,transparent 12.6% 24%),linear-gradient(90deg,transparent 49.65%,#75ff8d36 49.8% 50.2%,transparent 50.35%),linear-gradient(0deg,transparent 49.65%,#75ff8d36 49.8% 50.2%,transparent 50.35%)}
.grid:after{content:"";position:absolute;inset:8%;border:1px dashed #7cff9255;border-radius:50%}
.sweep{position:absolute;inset:-2%;border-radius:50%;opacity:0;background:conic-gradient(from 0deg,transparent 0 300deg,#6cff7b05 315deg,#8cff8a46 350deg,#c7ff9b90 359deg,transparent 360deg);filter:blur(.3px);transform:rotate(0)}
.scanning .sweep{opacity:1;animation:sweep 1.15s linear infinite}@keyframes sweep{to{transform:rotate(360deg)}}
.glow{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 42px #6cff7c26;pointer-events:none}.scanline{position:absolute;inset:0;opacity:.13;background:repeating-linear-gradient(0deg,transparent 0 3px,#d5ffd9 4px);mix-blend-mode:screen;pointer-events:none}
.center{position:absolute;width:9px;height:9px;background:var(--green2);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 14px var(--green)}
.target{--x:63%;--y:34%;position:absolute;left:var(--x);top:var(--y);width:14px;height:14px;border-radius:50%;background:#faff81;box-shadow:0 0 8px #fff,0 0 22px #c8ff6c,0 0 42px #63ff72;transform:translate(-50%,-50%) scale(0);transition:transform .25s}.target.hit{transform:translate(-50%,-50%) scale(1);animation:pulse 1s ease-out infinite}@keyframes pulse{50%{box-shadow:0 0 10px #fff,0 0 30px #dfff70,0 0 65px #62ff78}}
.blips i{position:absolute;width:4px;height:4px;border-radius:50%;background:#72ff83;opacity:0;box-shadow:0 0 8px #72ff83}.scanning .blips i{animation:blip 2.3s infinite}.blips i:nth-child(1){left:28%;top:31%;animation-delay:.2s}.blips i:nth-child(2){left:72%;top:62%;animation-delay:.9s}.blips i:nth-child(3){left:41%;top:77%;animation-delay:1.5s}.blips i:nth-child(4){left:77%;top:25%;animation-delay:.55s}.blips i:nth-child(5){left:18%;top:59%;animation-delay:1.9s}@keyframes blip{0%,28%,100%{opacity:0}32%,52%{opacity:.85}60%{opacity:0}}
.statusbox{position:absolute;left:50%;bottom:13%;transform:translateX(-50%);width:76%;text-align:center;text-shadow:0 0 8px #000;background:#041109b8;border:1px solid #55d96854;border-radius:7px;padding:7px 8px;backdrop-filter:blur(2px)}.status-main{font-size:clamp(11px,3vw,15px);font-weight:900;letter-spacing:.08em;color:#baffc2}.status-sub{font-size:10px;color:#78b987;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{margin-top:17px;display:grid;grid-template-columns:1fr auto;gap:10px}.query{min-width:0;border:1px solid #586748;background:#0b1009;color:#f1ffe5;border-radius:12px;padding:14px 14px;font:700 16px ui-monospace,monospace;outline:none;box-shadow:inset 0 2px 8px #0009}.query:focus{border-color:#8ebd5e;box-shadow:0 0 0 3px #88ff7420,inset 0 2px 8px #0009}.go{border:1px solid #95a85f;border-radius:12px;background:linear-gradient(#d1e66e,#7d9738);color:#111707;font-weight:1000;letter-spacing:.08em;padding:0 20px;min-height:50px;box-shadow:inset 0 1px #fff8,0 5px 0 #3e4e20,0 8px 16px #0008}.go:active{transform:translateY(3px);box-shadow:inset 0 1px #fff8,0 2px 0 #3e4e20}.go:disabled{filter:grayscale(.8);opacity:.55}
.steps{display:flex;gap:6px;margin-top:12px}.step{height:4px;flex:1;border-radius:999px;background:#303a29;overflow:hidden}.step.on{background:var(--green);box-shadow:0 0 8px #6dff7c}.step.done{background:#819b49}
.result{margin-top:16px;background:#0c120a;border:1px solid #435137;border-radius:18px;overflow:hidden;box-shadow:inset 0 1px #ffffff0c;display:none}.result.show{display:block;animation:rise .28s ease-out}@keyframes rise{from{opacity:0;transform:translateY(8px)}}.rhead{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;background:linear-gradient(90deg,#1b2b17,#10160d);border-bottom:1px solid #37452f}.rname{font-size:19px;font-weight:1000;color:#dfff91}.badge{font-size:10px;padding:5px 8px;border:1px solid #5c7d45;border-radius:999px;color:#aaf2a2}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:#293222}.field{background:#0d130b;padding:12px 13px;min-width:0}.k{font-size:9px;color:#738268;letter-spacing:.11em;margin-bottom:4px}.v{font-size:14px;color:#e9f7d6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.raw{font-size:9px;color:#62715b;padding:8px 13px;border-top:1px solid #293222;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.login{display:none;margin-top:15px;padding:14px;border:1px solid #6f6235;background:#17140a;border-radius:15px}.login.show{display:block}.login p{margin:0 0 10px;font-size:12px;color:#d8c987}.tokenrow{display:grid;grid-template-columns:1fr auto;gap:8px}.token{min-width:0;background:#090b08;color:#fff;border:1px solid #5d5332;border-radius:10px;padding:11px;font:12px ui-monospace,monospace}.authbtn{border:1px solid #af9040;background:#5f4d1c;color:#fff2bd;border-radius:10px;padding:0 13px;font-weight:900}.foot{margin:12px 5px 0;display:flex;justify-content:space-between;gap:8px;color:#65725f;font-size:9px}.error{color:#ff8d78!important}.ok{color:#b8ff8a!important}
@media(max-width:450px){.device{padding:12px 12px 18px;border-radius:28px}.screen{border-width:9px}.controls{grid-template-columns:1fr 92px}.go{padding:0 8px}.fields{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar"><div class="brand">WfGg <b>RADAR</b></div><div id="health" class="pill">API…</div></div>
  <main class="device">
    <div class="screen-wrap">
      <div id="screen" class="screen">
        <div class="grid"></div><div class="sweep"></div><div class="blips"><i></i><i></i><i></i><i></i><i></i></div><div class="center"></div><div id="target" class="target"></div><div class="scanline"></div><div class="glow"></div>
        <div class="statusbox"><div id="statusMain" class="status-main">RADAR EN VEILLE</div><div id="statusSub" class="status-sub">Connexion au système…</div></div>
      </div>
    </div>
    <form id="searchForm" class="controls" autocomplete="off">
      <input id="q" class="query" maxlength="80" placeholder="Pseudo du joueur" spellcheck="false" autocapitalize="none">
      <button id="go" class="go" type="submit">RECHERCHER</button>
    </form>
    <div class="steps" aria-hidden="true"><span class="step" id="s1"></span><span class="step" id="s2"></span><span class="step" id="s3"></span><span class="step" id="s4"></span></div>
    <section id="login" class="login">
      <p>Session Radar requise. Le token Last War est envoyé à l’API pour ouvrir la session et n’est pas mémorisé par cette page.</p>
      <div class="tokenrow"><input id="token" class="token" type="password" placeholder="Token Last War" autocomplete="off"><button id="auth" class="authbtn" type="button">CONNECTER</button></div>
    </section>
    <section id="result" class="result">
      <div class="rhead"><div id="rname" class="rname">—</div><div id="rsource" class="badge">API LIVE</div></div>
      <div class="fields">
        <div class="field"><div class="k">SERVEUR</div><div id="rserver" class="v">—</div></div>
        <div class="field"><div class="k">ALLIANCE</div><div id="ralliance" class="v">—</div></div>
        <div class="field"><div class="k">QG</div><div id="rhq" class="v">—</div></div>
        <div class="field"><div class="k">PUISSANCE</div><div id="rpower" class="v">—</div></div>
        <div class="field"><div class="k">POSITION</div><div id="rpos" class="v">—</div></div>
        <div class="field"><div class="k">UID</div><div id="ruid" class="v">—</div></div>
      </div>
      <div id="rraw" class="raw">—</div>
    </section>
  </main>
  <div class="foot"><span id="session">SESSION: …</span><span>LIVE API /api/radar/search</span></div>
</div>
<script>
const $=id=>document.getElementById(id);
const screen=$('screen'),go=$('go'),result=$('result'),login=$('login'),target=$('target');
let phaseTimer=null, audioCtx=null;
function setStatus(main,sub='',kind=''){ $('statusMain').textContent=main; $('statusMain').className='status-main '+kind; $('statusSub').textContent=sub; }
function steps(n){ for(let i=1;i<=4;i++){ const e=$('s'+i); e.className='step'+(i<n?' done':i===n?' on':''); } }
function tone(freq=760,dur=.055,vol=.025){ try{ audioCtx ||= new (window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.frequency.value=freq;o.type='square';g.gain.value=vol;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur); }catch(_){} }
function startScan(q){ screen.classList.add('scanning');target.classList.remove('hit');result.classList.remove('show');go.disabled=true;steps(1);setStatus('SYNCHRONISATION RADAR',q);tone(420,.04,.018);let p=0;clearInterval(phaseTimer);const labels=[['LECTURE DE LA CARTE','Balayage des secteurs…'],['ANALYSE DES DELTAS','Comparaison de l’état connu…'],['ENRICHISSEMENT PROFIL','Consolidation des données…']];phaseTimer=setInterval(()=>{const x=labels[p++%labels.length];steps(Math.min(3,p+1));setStatus(x[0],x[1]);tone(520+p*60,.025,.012)},1100)}
function stopScan(){clearInterval(phaseTimer);screen.classList.remove('scanning');go.disabled=false;}
function pick(obj,...keys){for(const k of keys){if(obj&&obj[k]!==undefined&&obj[k]!==null&&obj[k]!=='')return obj[k]}return null}
function fmt(v){if(v===null||v===undefined||v==='')return '—';const n=Number(v);return Number.isFinite(n)&&Math.abs(n)>=10000?n.toLocaleString('fr-FR'):String(v)}
function playerFrom(data){if(!data)return null;const arr=Array.isArray(data.results)?data.results:Array.isArray(data.players)?data.players:[];return arr[0]||data.player||data.result||null}
function locate(p){let x=Number(pick(p,'x','mapX','pos_x')),y=Number(pick(p,'y','mapY','pos_y'));if(!Number.isFinite(x)||!Number.isFinite(y)){x=50;y=42}else{x=14+(Math.abs(x)%1000)/1000*72;y=14+(Math.abs(y)%1000)/1000*72}target.style.setProperty('--x',x+'%');target.style.setProperty('--y',y+'%');target.classList.add('hit')}
function showPlayer(p,data,q){const name=pick(p,'pseudo','name','player_name','playerName')||q;const server=pick(p,'server_id','serverId','server');const alliance=pick(p,'alliance_tag','allianceTag','alliance_name','allianceName','alliance');const hq=pick(p,'hq_level','hqLevel','level','baseLevel');const power=pick(p,'power','combatPower','strength');const x=pick(p,'x','mapX','pos_x'),y=pick(p,'y','mapY','pos_y');const uid=pick(p,'game_uid','gameUid','uid','playerId');$('rname').textContent=name;$('rserver').textContent=fmt(server);$('ralliance').textContent=fmt(alliance);$('rhq').textContent=fmt(hq);$('rpower').textContent=fmt(power);$('rpos').textContent=(x!=null&&y!=null)?`${x} / ${y}`:'—';$('ruid').textContent=fmt(uid);const live=data?.liveScan;$('rsource').textContent=live?.attempted?(live.status==='ok'?'LIVE SCAN':'CACHE + LIVE'):'RADAR CACHE';$('rraw').textContent=`Résultats: ${Array.isArray(data?.results)?data.results.length:1}${live?.status?' · live='+live.status:''}`;locate(p);result.classList.add('show');steps(4);setStatus('CIBLE LOCALISÉE',name,'ok');tone(980,.07,.03);setTimeout(()=>tone(1320,.09,.025),90)}
async function api(path,opt={}){const r=await fetch(path,{credentials:'include',cache:'no-store',...opt});let d={};try{d=await r.json()}catch(_){}if(!r.ok){const e=new Error(d.error||`HTTP_${r.status}`);e.status=r.status;e.data=d;throw e}return d}
async function health(){try{const d=await api('/api/health?ui=live-radar');$('health').textContent=`API ${d.version||''} · ONLINE`;$('health').className='pill online';setStatus('RADAR PRÊT','API connectée');}catch(e){$('health').textContent='API HORS LIGNE';$('health').className='pill bad';setStatus('API INDISPONIBLE',e.message,'error')}}
async function session(){try{const d=await api('/api/me');$('session').textContent=`SESSION: ${d.user?.pseudo||'OK'} · ${d.user?.role||''}`;login.classList.remove('show');return true}catch(e){$('session').textContent='SESSION: NON CONNECTÉE';if(e.status===401)login.classList.add('show');return false}}
$('auth').onclick=async()=>{const token=$('token').value.trim();if(!token)return;const b=$('auth');b.disabled=true;setStatus('AUTHENTIFICATION','Validation auprès de Last War…');try{const d=await api('/api/auth/game-token',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token})});$('token').value='';login.classList.remove('show');$('session').textContent=`SESSION: ${d.user?.pseudo||'OK'} · ${d.user?.role||''}`;setStatus('RADAR PRÊT','Session ouverte','ok');tone(900,.07,.02)}catch(e){setStatus('AUTHENTIFICATION REFUSÉE',e.message,'error')}finally{b.disabled=false}};
$('searchForm').onsubmit=async e=>{e.preventDefault();const q=$('q').value.trim();if(!q)return;startScan(q);try{const d=await api('/api/radar/search?q='+encodeURIComponent(q)+'&limit=50');const p=playerFrom(d);stopScan();if(p)showPlayer(p,d,q);else{steps(4);setStatus('AUCUNE CIBLE',`« ${q} » non trouvé`,'error');$('rname').textContent=q;$('rserver').textContent=$('ralliance').textContent=$('rhq').textContent=$('rpower').textContent=$('rpos').textContent=$('ruid').textContent='—';$('rsource').textContent=d.liveScan?.attempted?'LIVE SCAN':'RADAR';$('rraw').textContent=d.liveScan?.error?`Live: ${d.liveScan.error}`:'Aucun résultat';result.classList.add('show');tone(180,.14,.02)}}catch(err){stopScan();if(err.status===401){login.classList.add('show');setStatus('SESSION REQUISE','Connecte le Radar puis relance la recherche','error')}else setStatus('ERREUR RADAR',err.message,'error')}};
health();session();
</script>
</body>
</html>
